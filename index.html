              </span>\n                    <span className=\"text-sm font-black text-slate-800 block leading-tight mt-0.5\">\n                      {formatCurrency(emp.totalDt, 1)}\n                    </span>\n                  </div>\n                  <div className=\"bg-indigo-50/70 border border-indigo-200 rounded-xl p-2 text-center\">\n                    <span className=\"text-[9px] font-black uppercase text-indigo-700 block tracking-wider\">\n                      DT QUY ĐỔI\n                    </span>\n                    <span className=\"text-base font-black text-indigo-600 block leading-tight mt-0.5\">\n                      {formatCurrency(emp.totalDtQd, 1)}\n                    </span>\n                  </div>\n                  <div className=\"bg-slate-50 border border-slate-100 rounded-xl p-2 text-center\">\n                    <span className=\"text-[9px] font-bold uppercase text-slate-400 block tracking-wider\">\n                      KPI / ĐÓNG GÓP\n                    </span>\n                    <span className=\"text-sm font-black text-rose-600 block leading-tight mt-0.5\">\n                      {emp.diemKpi.toFixed(1)}đ\n                    </span>\n                  </div>\n                </div>\n\n                <div className=\"text-[10.5px] text-slate-500 text-center pb-2 border-b border-slate-100\">\n                  ĐT: <b className=\"text-slate-700 font-mono\">{emp.dtDiem.toFixed(1)}đ</b> • HQ:{' '}\n                  <b className=\"text-slate-700 font-mono\">{emp.hqDiem.toFixed(1)}đ</b> (Hiệu quả QĐ{' '}\n                  <b className=\"text-slate-700 font-mono\">{emp.hieuQuaQd.toFixed(1)}%</b>)\n                </div>\n\n                <div\n                    className={`card-programs-container custom-scroll pt-1 ${\n                      isExpandAllPrograms\n                        ? 'max-h-none overflow-visible'\n                        : 'max-h-[350px] overflow-y-auto'\n                    }`}\n                  >\n                  <SortableTable grid initialSort={{ column: 4, direction: 'desc' }} className=\"w-full text-left text-[10.5px]\">\n                    <div className=\"employee-program-grid grid gap-1 sticky top-0 z-10 bg-white text-slate-500 font-bold border-b border-slate-100 shadow-2xs\">\n                      <div className=\"py-1 px-1 font-semibold\">MÔN</div>\n                      <div className=\"py-1 px-1 text-right font-semibold\">THỰC</div>\n                      <div className=\"py-1 px-1 text-right font-semibold\">TARGET</div>\n                      <div className=\"py-1 px-1 text-right font-bold\">%LK</div>\n                      <div className=\"py-1 px-1 text-right font-semibold\">%DỰ</div>\n                    </div>\n                    <div className=\"divide-y divide-slate-50 text-slate-700\">\n                      {[...emp.programs].sort((a, b) => (Number(b.pctDu) || 0) - (Number(a.pctDu) || 0)).map((p, pIdx) => {\n                        const isQty = p.loai === 2 || p.loai === 6;\n                        const thucStr = isQty ? formatInt(p.thuc) : formatCurrency(p.thuc, 1);\n                        const targetStr = p.hasTarget === false\n                          ? '—'\n                          : (isQty ? formatInt(p.target) : formatCurrency(p.target, 1));\n\n                        const status = employeeProgramStatus(p);\n                        const pctColor = status === 'weak' ? '#f43f5e' : status === 'watch' ? '#d97706' : status === 'good' ? '#059669' : '#64748b';\n                        const missing = status === 'unknown';\n\n                        const isTopVung = p.hangVung && parseInt(p.hangVung) === 1;\n\n                        return (\n                          <div\n                            key={pIdx}\n                            onClick={() => onOpenProgramDetail(emp.store, p.code, p.name)}\n                            title=\"Bấm để xem chi tiết môn này\"\n                            data-program-status={status}\n                            style={{backgroundColor: status === 'weak' ? '#fff4d6' : undefined}}\n                            className=\"employee-program-grid grid gap-1 hover:bg-blue-50/70 cursor-pointer transition border-b border-slate-100\"\n                          >\n                            <div className=\"py-1.5 px-1 font-bold text-slate-800 truncate\" title={`${p.name}${status === 'weak' ? Number(p.thuc) === 0 ? ' — Chưa có số' : ' — Dự kiến dưới 80%' : ''}`}>\n                              {status === 'weak' && <span aria-label=\"Cảnh báo môn yếu\" style={{color: '#d97706'}}>⚠ </span>}\n                              {isTopVung && '🥇 '}\n                              {p.displayName}\n                            </div>\n                            <div data-sort-value={p.thuc} className=\"py-1.5 px-1 text-right text-slate-800 font-bold font-mono text-[11px]\">\n                              {p.hasActualData === false ? '—' : thucStr}\n                            </div>\n                            <div data-sort-value={p.target} className=\"py-1.5 px-1 text-right text-slate-700 font-bold font-mono text-[11px]\">\n                              {targetStr}\n                            </div>\n                            <div data-sort-value={p.pctLk} style={{color: pctColor}} className=\"py-1.5 px-1 text-right font-bold font-mono text-[11px]\">\n                              {missing ? '—' : formatPercent(p.pctLk, 1)}\n                            </div>\n                            <div data-sort-value={p.pctDu} style={{color: pctColor}} className=\"py-1.5 px-1 text-right font-bold font-mono text-[10.5px]\">\n                              {missing ? '—' : formatPercent(p.pctDu, 1)}\n                            </div>\n                          </div>\n                        );\n                      })}\n                    </div>\n                  </SortableTable>\n                </div>\n\n                {weakList.length > 0 && <div className=\"bg-rose-50/90 border border-rose-200 text-rose-800 rounded-xl p-2.5 text-[11px] leading-relaxed mt-2.5\">\n                  <span className=\"font-bold flex items-center gap-1 mb-0.5 text-rose-900\">\n                    ⚠ Cảnh báo môn yếu / chưa có số (dự kiến dưới 80%):\n                  </span>\n                  <span className=\"text-slate-600 font-bold text-[10.5px]\">{alertText}</span>\n                </div>}\n              </div>\n            );\n          })}\n        </div>\n      )}\n    </div>\n  );\n};\n","src/views/ThiDuaStView.tsx":"import { SortableTable } from '../components/SortableTable';\nimport React, { useEffect, useMemo, useRef, useState } from 'react';\nimport { Copy } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatInt, formatPercent, formatProgramName } from '../utils/formatters';\nimport { ProgramCopyToolbar, ProgramCopyItem } from '../components/ProgramCopyToolbar';\nimport { getVietnamMonthKey, readAiFocusPrograms, writeAiFocusPrograms } from '../utils/aiFocusPrograms';\nimport { getAiFocusSyncState, queueAiFocusProgramsSync, subscribeAiFocusProgramsSync, subscribeAiFocusSyncStatus } from '../utils/aiFocusCloudSync';\nimport { copyProgramNames, getProgramCopyNamesInRect, highlightProgramCopyNames, clearProgramCopyHighlights, suppressProgramOpen, shouldSuppressProgramOpen } from '../utils/programCopy';\nimport { getReportPeriodContext } from '../utils/reportPeriod';\nimport { competitionStoreCode, competitionTarget, competitionValue, sameCompetitionProgram as sameCompetitionProgramRow } from '../utils/competition';\n\ninterface ThiDuaStViewProps {\n  appData: AppDataState;\n  activeStore: 'TGDD' | 'TOPZONE';\n  onChangeActiveStore: (store: 'TGDD' | 'TOPZONE') => void;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n}\n\nexport const ThiDuaStView: React.FC<ThiDuaStViewProps> = ({\n  appData,\n  activeStore,\n  onChangeActiveStore,\n  onOpenProgramDetail,\n}) => {\n  const [searchTerm, setSearchTerm] = useState<string>('');\n  const programTableRef = useRef<HTMLDivElement>(null);\n  const copyNoticeTimerRef = useRef<any>(null);\n  const [copyNotice, setCopyNotice] = useState<string>('');\n  const [aiFocusPrograms, setAiFocusPrograms] = useState<string[]>(readAiFocusPrograms);\n  const aiFocusProgramsRef = useRef<string[]>(aiFocusPrograms);\n  const aiFocusRemoteApplyRef = useRef<boolean>(false);\n  const aiFocusInitialEffectRef = useRef<boolean>(true);\n  const aiFocusUserChangeRef = useRef<boolean>(false);\n  const [isAiFocusPanelOpen, setIsAiFocusPanelOpen] = useState<boolean>(false);\n  const [aiFocusPickerStep, setAiFocusPickerStep] = useState<'STORE' | 'PROGRAMS'>('STORE');\n  const focusDropdownRef = useRef<HTMLDivElement>(null);\n  const [focusPanelLayout, setFocusPanelLayout] = useState({ top: 96, left: 12, width: 360, maxHeight: 640, arrowLeft: 180 });\n  const aiFocusMonthRef = useRef<string>(getVietnamMonthKey());\n  const [aiFocusSyncState, setAiFocusSyncState] = useState(getAiFocusSyncState);\n\n  const updateAiFocusPanelLayout = (step: 'STORE' | 'PROGRAMS' = aiFocusPickerStep) => {\n    const anchor = focusDropdownRef.current;\n    if (!anchor) return;\n    const rect = anchor.getBoundingClientRect();\n    const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 1024;\n    const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 768;\n    const margin = 12;\n    const gap = 10;\n    const desiredWidth = step === 'STORE' ? 360 : 940;\n    const width = Math.min(desiredWidth, Math.max(200, viewportWidth - margin * 2));\n    const maxLeft = Math.max(margin, viewportWidth - width - margin);\n    const left = Math.min(Math.max(rect.right - width, margin), maxLeft);\n    const naturalTop = rect.bottom + gap;\n    const top = Math.min(Math.max(margin, naturalTop), Math.max(margin, viewportHeight - 220));\n    const maxHeight = Math.max(180, viewportHeight - top - margin);\n    const anchorCenter = rect.left + rect.width / 2;\n    const arrowLeft = Math.min(Math.max(anchorCenter - left, 24), Math.max(24, width - 24));\n    setFocusPanelLayout({ top, left, width, maxHeight, arrowLeft });\n  };\n  const showCopyNotice = (message: string) => {\n    setCopyNotice(message);\n    if (copyNoticeTimerRef.current) window.clearTimeout(copyNoticeTimerRef.current);\n    copyNoticeTimerRef.current = window.setTimeout(() => setCopyNotice(''), 2200);\n  };\n\n  useEffect(() => {\n    aiFocusProgramsRef.current = aiFocusPrograms;\n    writeAiFocusPrograms(aiFocusPrograms);\n    if (aiFocusRemoteApplyRef.current) {\n      aiFocusRemoteApplyRef.current = false;\n      return;\n    }\n\n    if (aiFocusInitialEffectRef.current) {\n      aiFocusInitialEffectRef.current = false;\n      return;\n    }\n    const allowEmpty = aiFocusUserChangeRef.current;\n    aiFocusUserChangeRef.current = false;\n    queueAiFocusProgramsSync(aiFocusPrograms, { allowEmpty });\n  }, [aiFocusPrograms]);\n\n  useEffect(() => subscribeAiFocusSyncStatus(setAiFocusSyncState), []);\n\n  useEffect(() => subscribeAiFocusProgramsSync(\n    () => aiFocusProgramsRef.current,\n    (remotePrograms) => {\n      if (JSON.stringify(remotePrograms) === JSON.stringify(aiFocusProgramsRef.current)) return;\n      aiFocusRemoteApplyRef.current = true;\n      aiFocusProgramsRef.current = remotePrograms;\n      writeAiFocusPrograms(remotePrograms);\n      setAiFocusPrograms(remotePrograms);\n    },\n  ), []);\n\n  useEffect(() => {\n    const refreshFocusMonth = () => {\n      const currentMonth = getVietnamMonthKey();\n      if (aiFocusMonthRef.current === currentMonth) return;\n      aiFocusMonthRef.current = currentMonth;\n      const resetPrograms = readAiFocusPrograms();\n      aiFocusProgramsRef.current = resetPrograms;\n      setAiFocusPrograms(resetPrograms);\n      if (resetPrograms.length > 0) queueAiFocusProgramsSync(resetPrograms);\n    };\n    const timer = window.setInterval(refreshFocusMonth, 60_000);\n    window.addEventListener('focus', refreshFocusMonth);\n    return () => {\n      window.clearInterval(timer);\n      window.removeEventListener('focus', refreshFocusMonth);\n    };\n  }, []);\n\n  useEffect(() => {\n    if (!isAiFocusPanelOpen) return;\n    const updateLayout = () => updateAiFocusPanelLayout();\n    const frame = window.requestAnimationFrame(updateLayout);\n\n    window.addEventListener('resize', updateLayout);\n    window.addEventListener('scroll', updateLayout, true);\n    return () => {\n      window.cancelAnimationFrame(frame);\n      window.removeEventListener('resize', updateLayout);\n      window.removeEventListener('scroll', updateLayout, true);\n    };\n  }, [isAiFocusPanelOpen, activeStore, aiFocusPickerStep]);\n\n  useEffect(() => {\n    if (!isAiFocusPanelOpen) return;\n    const handlePointerDown = (event: PointerEvent) => {\n      const target = event.target as Node | null;\n      if (target && focusDropdownRef.current && !focusDropdownRef.current.contains(target)) {\n        setIsAiFocusPanelOpen(false);\n      }\n    };\n    const handleKeyDown = (event: KeyboardEvent) => {\n      if (event.key === 'Escape') setIsAiFocusPanelOpen(false);\n    };\n    document.addEventListener('pointerdown', handlePointerDown);\n    document.addEventListener('keydown', handleKeyDown);\n    return () => {\n      document.removeEventListener('pointerdown', handlePointerDown);\n      document.removeEventListener('keydown', handleKeyDown);\n    };\n  }, [isAiFocusPanelOpen]);\n\n  const toggleAiFocusProgram = (programName: string) => {\n    aiFocusUserChangeRef.current = true;\n    setAiFocusPrograms(prev => prev.includes(programName) ? prev.filter(x => x !== programName) : [...prev, programName]);\n  };\n\n  const programDragRef = useRef<{\n    active: boolean;\n    pointerId: number | null;\n    startX: number;\n    startY: number;\n    moved: boolean;\n    names: string[];\n  }>({ active: false, pointerId: null, startX: 0, startY: 0, moved: false, names: [] });\n\n  const resetProgramDrag = (root?: HTMLElement | null) => {\n    clearProgramCopyHighlights(root || null);\n    programDragRef.current = { active: false, pointerId: null, startX: 0, startY: 0, moved: false, names: [] };\n  };\n\n  const handleProgramPointerDown = (e: React.PointerEvent<HTMLDivElement>) => {\n    if (e.button !== 0) return;\n    const target = e.target instanceof Element ? e.target : null;\n\n    if (target?.closest('button, input, select, textarea, a, label, [role=\"button\"]')) return;\n    programDragRef.current = {\n      active: true,\n      pointerId: e.pointerId,\n      startX: e.clientX,\n      startY: e.clientY,\n      moved: false,\n      names: [],\n    };\n\n  };\n\n  const handleProgramPointerMove = (e: React.PointerEvent<HTMLDivElement>) => {\n    const drag = programDragRef.current;\n    if (!drag.active || drag.pointerId !== e.pointerId) return;\n    const dx = e.clientX - drag.startX;\n    const dy = e.clientY - drag.startY;\n    if (!drag.moved && Math.hypot(dx, dy) >= 7) {\n      drag.moved = true;\n      try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}\n      e.currentTarget.classList.add('program-dragging');\n      e.currentTarget.style.userSelect = 'none';\n      try { window.getSelection()?.removeAllRanges(); } catch {}\n    }\n    if (!drag.moved) return;\n    e.preventDefault();\n    const names = getProgramCopyNamesInRect(e.currentTarget, drag.startX, drag.startY, e.clientX, e.clientY);\n    drag.names = names;\n    highlightProgramCopyNames(e.currentTarget, names);\n  };\n\n  const handleProgramPointerUp = async (e: React.PointerEvent<HTMLDivElement>) => {\n    const drag = programDragRef.current;\n    if (!drag.active || drag.pointerId !== e.pointerId) return;\n    if (drag.moved) { try { e.currentTarget.releasePointerCapture(e.pointerId); } catch {} }\n    const names = [...drag.names];\n    const shouldCopy = drag.moved && names.length > 0;\n    if (drag.moved) suppressProgramOpen(1000);\n    resetProgramDrag(e.currentTarget);\n    if (!shouldCopy) return;\n    const count = await copyProgramNames(names);\n    showCopyNotice(count ? `Đã tự copy ${count} môn trong vùng vừa kéo` : 'Không copy được · hãy cấp quyền Clipboard');\n  };\n\n  const handleProgramPointerCancel = (e: React.PointerEvent<HTMLDivElement>) => resetProgramDrag(e.currentTarget);\n\n  const td_lk = appData.td_luyke || [];\n  const td_rt = appData.td_realtime || [];\n  const reportPeriod = getReportPeriodContext(appData);\n  const daysInMonth = reportPeriod.daysInMonth;\n\n  const cleanKey = (value: any) => String(value ?? '')\n    .toLowerCase()\n    .normalize('NFD')\n    .replace(/[\\u0300-\\u036f]/g, '')\n    .replace(/[^a-z0-9]+/g, ' ')\n    .trim();\n\n  const monthlyFocusKeys = new Set(aiFocusPrograms.map(cleanKey));\n  const isMonthlyFocusProgram = (value: any) => {\n    const raw = String(value ?? '');\n    return monthlyFocusKeys.has(cleanKey(raw)) || monthlyFocusKeys.has(cleanKey(formatProgramName(raw)));\n  };\n\n  const sameProgram = (a: any, b: any) => sameCompetitionProgramRow(a, b);\n\n  const sameStoreKey = (store: 'TGDD' | 'TOPZONE', r: any) => competitionStoreCode(r) === (store === 'TGDD' ? '933' : '10341');\n\n  const sameStore = (r: any) => sameStoreKey(activeStore, r);\n\n  const catalogRows = useMemo(() => {\n    const map = new Map<string, any>();\n    const add = (row: any, source: 'LK' | 'RT') => {\n      const storeCode = competitionStoreCode(row);\n      const prog = String(row?.['MÃ CHƯƠNG TRÌNH'] || row?.['CHƯƠNG TRÌNH'] || '').trim();\n      if (!storeCode || !prog) return;\n      const key = `${storeCode}|${cleanKey(prog)}`;\n      const existing = map.get(key) || {};\n      map.set(key, source === 'RT' ? { ...existing, ...row, __source: 'RT' } : { ...row, ...existing, __source: existing.__source || 'LK' });\n    };\n    td_lk.forEach((row: any) => add(row, 'LK'));\n    td_rt.forEach((row: any) => add(row, 'RT'));\n    return Array.from(map.values());\n  }, [td_lk, td_rt]);\n\n  const getFocusStoreStats = (store: 'TGDD' | 'TOPZONE') => {\n    const names = new Set<string>();\n    catalogRows.forEach((row: any) => {\n      if (!sameStoreKey(store, row)) return;\n      const hasLkTarget = td_lk.some(lk => sameStoreKey(store, lk) && sameProgram(row, lk) && competitionTarget(lk) > 0);\n      const hasRtTarget = td_rt.some(rt => sameStoreKey(store, rt) && sameProgram(row, rt) && competitionTarget(rt) > 0);\n      if (!hasLkTarget && !hasRtTarget) return;\n      const name = formatProgramName(String(row['CHƯƠNG TRÌNH'] || '').trim());\n      if (name) names.add(name);\n    });\n    let selected = 0;\n    names.forEach(name => { if (aiFocusPrograms.includes(name)) selected += 1; });\n    return { total: names.size, selected };\n  };\n\n  const hasRealtimeToday = td_rt.some(r => sameStore(r));\n  const closedDays = reportPeriod.closedDays;\n  const daysElapsed = Math.min(daysInMonth, closedDays + (hasRealtimeToday && closedDays < daysInMonth ? 1 : 0));\n  const progressPct = daysInMonth > 0 ? (daysElapsed / daysInMonth * 100) : 0;\n  const paceTimePct = reportPeriod.timePct;\n  const planningDaysRemaining = reportPeriod.planningDaysRemaining;\n\n  let list = catalogRows.filter(r => {\n    if (!sameStore(r)) return false;\n    const hasLkTarget = td_lk.some(lk => sameStore(lk) && sameProgram(r, lk) && competitionTarget(lk) > 0);\n    const hasRtTarget = td_rt.some(rt => sameStore(rt) && sameProgram(r, rt) && competitionTarget(rt) > 0);\n    return hasLkTarget || hasRtTarget;\n  });\n  if (searchTerm) {\n    list = list.filter(r => {\n      const name = r['CHƯƠNG TRÌNH'] || '';\n      return (\n        name.toLowerCase().includes(searchTerm.toLowerCase()) ||\n        formatProgramName(name).toLowerCase().includes(searchTerm.toLowerCase())\n      );\n    });\n  }\n\n  const focusProgramCatalog = useMemo(() => {\n    const map = new Map<string, { name: string; employeeCount: number }>();\n    catalogRows.forEach((row: any) => {\n      if (!sameStore(row)) return;\n      const hasLkTarget = td_lk.some(lk => sameStore(lk) && sameProgram(row, lk) && competitionTarget(lk) > 0);\n      const hasRtTarget = td_rt.some(rt => sameStore(rt) && sameProgram(row, rt) && competitionTarget(rt) > 0);\n      if (!hasLkTarget && !hasRtTarget) return;\n      const name = formatProgramName(String(row['CHƯƠNG TRÌNH'] || '').trim());\n      if (!name) return;\n      const item = map.get(name);\n      if (item) item.employeeCount += 1;\n      else map.set(name, { name, employeeCount: 1 });\n    });\n    return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name, 'vi'));\n  }, [catalogRows, activeStore]);\n\n  const visibleFocusProgramNames = useMemo(() => new Set(focusProgramCatalog.map(item => item.name)), [focusProgramCatalog]);\n  const visibleSelectedFocusPrograms = useMemo(\n    () => aiFocusPrograms.filter(name => visibleFocusProgramNames.has(name)),\n    [aiFocusPrograms, visibleFocusProgramNames]\n  );\n  const clearVisibleAiFocusPrograms = () => {\n    aiFocusUserChangeRef.current = true;\n    setAiFocusPrograms(prev => prev.filter(name => !visibleFocusProgramNames.has(name)));\n  };\n\n  const aiFocusSyncBadge = (() => {\n    const checkedTime = aiFocusSyncState.checkedAt\n      ? new Date(aiFocusSyncState.checkedAt).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })\n      : '';\n    const updatedTime = aiFocusSyncState.updatedAt\n      ? new Date(aiFocusSyncState.updatedAt).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })\n      : '';\n    const by = aiFocusSyncState.updatedByEmail ? ` · ${aiFocusSyncState.updatedByEmail}` : '';\n    if (aiFocusSyncState.status === 'synced') return {\n      text: '☁✓',\n      className: 'border-emerald-200 bg-emerald-50 text-emerald-700',\n      title: `Đã khớp Cloud${checkedTime ? ` lúc ${checkedTime}` : ''}${updatedTime && updatedTime !== checkedTime ? ` · Dữ liệu cập nhật ${upda ? 'TGDĐ' : 'TOPZONE'}</span></h4>\n            <p className=\"text-[11px] text-slate-500\">Theo dõi song song <b>Lũy kế</b> và <b>Realtime hôm nay</b> · {rtLoadedCount}/{totalPrograms} môn đã có dữ liệu RT</p>\n          </div>\n          <div className=\"flex items-center gap-2\">\n            <div className=\"relative\">\n              <input type=\"text\" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder=\"🔍 Tìm ngành hàng...\" className=\"text-xs px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none w-48\" />\n            </div>\n          </div>\n        </div>\n\n        <ProgramCopyToolbar items={copyToolbarItems} focusItems={focusToolbarItems} onCopied={showCopyNotice} label={`COPY MÔN · ${activeStore === 'TGDD' ? 'TGDĐ' : 'TOPZONE'}`} />\n\n        <div ref={programTableRef} onPointerDown={handleProgramPointerDown} onPointerMove={handleProgramPointerMove} onPointerUp={(e) => void handleProgramPointerUp(e)} onPointerCancel={handleProgramPointerCancel} className=\"overflow-x-auto custom-scroll -mx-3 px-3 py-1 program-drag-surface\">\n          <SortableTable className=\"w-full min-w-[1050px] text-left text-xs border-collapse\">\n            <thead className=\"bg-slate-50 text-slate-600 font-bold border-b border-slate-200\">\n              <tr>\n                <th className=\"py-2.5 px-3 text-center w-12\">#</th>\n                <th className=\"py-2.5 px-4\"><button type=\"button\" onClick={(e) => { e.stopPropagation(); void copyCurrentColumn(); }} className=\"inline-flex items-center gap-1 hover:text-blue-700\" title=\"Bấm để copy nguyên cột tên môn\"><span>NGÀNH HÀNG</span><Copy className=\"w-3.5 h-3.5\" /></button></th>\n                <th className=\"py-2.5 px-3 text-right\">LŨY KẾ</th>\n                {rtLoadedCount > 0 && <th className=\"py-2.5 px-3 text-right bg-amber-50 text-amber-700\">HÔM NAY (RT)</th>}\n                {rtLoadedCount > 0 && <th className=\"py-2.5 px-3 text-right bg-amber-50 text-amber-700\">% HT NGÀY</th>}\n                <th className=\"py-2.5 px-3 text-right text-rose-600\">GAP (THIẾU)</th>\n                <th className=\"py-2.5 px-3 text-right\">TARGET LK</th>\n                <th className=\"py-2.5 px-4 text-center w-36\">TIẾN ĐỘ CHỐT</th>\n                <th className=\"py-2.5 px-3 text-right\">DỰ KIẾN HT</th>\n                <th className=\"py-2.5 px-3 text-center\">SỐ/NGÀY</th>\n              </tr>\n            </thead>\n            <tbody className=\"divide-y divide-slate-100 text-slate-700\">\n              {rows.map((row, idx) => {\n                const ten = row.sourceRow?.['CHƯƠNG TRÌNH'] || '';\n                let rankBadge: React.ReactNode = <span className=\"text-slate-400 font-mono text-[11px]\">{idx + 1}</span>;\n                if (idx === 0) rankBadge = <span className=\"text-base\">🥇</span>;\n                else if (idx === 1) rankBadge = <span className=\"text-base\">🥈</span>;\n                else if (idx === 2) rankBadge = <span className=\"text-base\">🥉</span>;\n\n                return (\n                  <tr key={String(row.sourceRow?.['MÃ CHƯƠNG TRÌNH'] ?? idx)} onClick={() => { if (shouldSuppressProgramOpen()) return; onOpenProgramDetail(activeStore, row.sourceRow?.['MÃ CHƯƠNG TRÌNH'], ten); }} title=\"Bấm để xem chi tiết nhân viên bán môn này\" className={`hover:bg-blue-50/60 cursor-pointer transition border-b border-slate-100 ${row.isCompleted ? 'bg-emerald-50/20' : ''}`}>\n                    <td className=\"py-2.5 px-3 text-center\">{rankBadge}</td>\n                    <td className=\"py-2.5 px-4 font-bold text-slate-900\" title={`${ten}${row.isMonthlyFocus ? ' · ⭐ Môn tập trung tháng này' : ''} · Bấm để xem chi tiết · Kéo quét vùng qua tên để tự copy`}>\n                      <div className=\"flex items-center gap-1.5 min-w-0 flex-wrap\">\n                        <span data-program-copy-name={formatProgramName(ten)} className={`cursor-pointer rounded px-0.5 hover:bg-blue-100/70 ${row.isMonthlyFocus ? 'text-amber-900' : ''}`}>{formatProgramName(ten)}</span>\n                        {row.isMonthlyFocus && <span className=\"shrink-0 text-[13px]\" title=\"Môn tập trung tháng này\">⭐</span>}\n                      </div>\n                    </td>\n                    <td className=\"py-2.5 px-3 text-right font-mono font-semibold text-slate-800\" data-sort-value={row.lkRow ? row.lkValue : '—'}>{row.lkRow ? (row.isQty ? formatInt(row.lkValue) : formatCurrency(row.lkValue)) : '—'}</td>\n                    {rtLoadedCount > 0 && <td className={`py-2.5 px-3 text-right font-mono font-black ${row.rtRow ? 'text-amber-700' : 'text-slate-300'}`} data-sort-value={row.rtRow ? row.rtValue : '—'}>{row.rtRow ? (row.isQty ? formatInt(row.rtValue) : formatCurrency(row.rtValue)) : '—'}</td>}\n                    {rtLoadedCount > 0 && <td className={`py-2.5 px-3 text-right bg-amber-50/50 ${row.rtRow && row.rtTarget > 0 ? (row.pctRt >= 100 ? 'text-emerald-700' : 'text-amber-700') : 'text-slate-300'}`} data-sort-value={row.rtRow && row.rtTarget > 0 ? row.pctRt : '—'}>\n                      {row.rtRow && row.rtTarget > 0 ? (\n                        <div>\n                          <div className=\"font-black\">{formatPercent(row.pctRt)}</div>\n                          <div className=\"mt-0.5 text-[9px] font-semibold\">Target RT: {row.isQty ? formatInt(row.rtTarget) : formatCurrency(row.rtTarget)}</div>\n                        </div>\n                      ) : '—'}\n                    </td>}\n                    <td className=\"py-2.5 px-3 text-right font-mono font-semibold text-rose-600\" data-sort-value={row.lkTarget > 0 ? row.gap : '—'}>{row.lkTarget > 0 ? (row.isQty ? formatInt(row.gap) : formatCurrency(row.gap)) : '—'}</td>\n                    <td className=\"py-2.5 px-3 text-right font-mono text-slate-500\" data-sort-value={row.lkTarget > 0 ? row.lkTarget : '—'}>{row.lkTarget > 0 ? (row.isQty ? formatInt(row.lkTarget) : formatCurrency(row.lkTarget)) : '—'}</td>\n                    <td className=\"py-2.5 px-4 text-center\">\n                      {row.lkTarget > 0 ? (\n                        <div className=\"flex items-center justify-center gap-2\">\n                          <div className=\"w-16 bg-slate-200 h-1.5 rounded-full overflow-hidden\"><div className={`${row.isCompleted ? 'bg-emerald-500' : 'bg-blue-600'} h-full`} style={{ width: `${Math.min(row.pctCurrent, 100)}%` }} /></div>\n                          <span className={`font-bold text-xs ${row.isCompleted ? 'text-emerald-700' : 'text-blue-700'}`}>{formatPercent(row.pctCurrent)}</span>\n                        </div>\n                      ) : <span className=\"text-slate-400 font-bold\">—</span>}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-right font-mono text-slate-600\" data-sort-value={row.lkTarget > 0 ? row.pctDu : '—'}>{row.lkTarget > 0 ? formatPercent(row.pctDu) : '—'}</td>\n                    <td className=\"py-2.5 px-3 text-center\"><span className={`px-2 py-0.5 rounded font-black text-[10px] ${row.isCompleted ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}`}>{row.soNgay}</span></td>\n                  </tr>\n                );\n              })}\n            </tbody>\n          </SortableTable>\n        </div>\n\n        {totalPrograms > 0 && rtLoadedCount < totalPrograms && (\n          <div className=\"text-[10.5px] text-slate-500 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2\">\n            ℹ️ Môn chưa có RT được giữ dấu <b>—</b>, không tự suy đoán từ Lũy kế. Khi anh dán Data Realtime mới, bảng sẽ tự ghép theo mã/tên chương trình cho đúng từng shop.\n          </div>\n        )}\n      </div>\n    </div>\n  );\n};\n","src/utils/forecastEngine.ts":"interface ForecastResult {\n  forecast: number;\n  forecastPct: number;\n  remainingGap: number;\n  requiredPerDay: number;\n  runRatePerDay: number;\n}\n\nexport function calculateForecast(current: number, target: number, daysPassed: number, totalDays: number, targetMultiplier = 100): ForecastResult {\n  const safeCurrent = Number.isFinite(current) ? current : 0;\n  const safeTarget = Number.isFinite(target) ? target : 0;\n  const days = Math.max(1, Math.round(totalDays || 1));\n  const d = Math.max(0, Math.min(Math.round(daysPassed || 0), days));\n  const runRatePerDay = d > 0 ? safeCurrent / d : 0;\n  const forecast = d > 0 ? runRatePerDay * days : safeCurrent;\n  const forecastPct = safeTarget > 0 ? forecast / safeTarget * 100 : 0;\n  const adjustedTarget = safeTarget * (Math.max(0, targetMultiplier) / 100);\n  const remainingDays = Math.max(0, days - d);\n  const remainingGap = Math.max(0, adjustedTarget - safeCurrent);\n  const requiredPerDay = remainingDays > 0 ? remainingGap / remainingDays : 0;\n  return { forecast, forecastPct, remainingGap, requiredPerDay, runRatePerDay };\n}\n","src/utils/dataValidation.ts":"import { AppDataState } from '../types';\n\ninterface ValidationResult { errors: string[]; warnings: string[]; }\n\nconst num = (v: any) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };\n\nexport function validateAppData(data: Partial<AppDataState> | null | undefined): ValidationResult {\n  const errors: string[] = [];\n  const warnings: string[] = [];\n  const isRecord = (value: any) => value !== null && typeof value === 'object' && !Array.isArray(value);\n  if (!isRecord(data)) return { errors: ['Dữ liệu phiên phải là một đối tượng hợp lệ.'], warnings };\n  const d: any = data;\n  const slots = ['dt_luyke', 'dt_realtime', 'td_luyke', 'td_realtime', 'nv_tgdd', 'nv_tz',\n    'dt_nv_luyke', 'dt_nv_realtime', 'tra_cham_luyke', 'tra_cham_realtime'];\n  for (const slot of slots) {\n    if (!Object.prototype.hasOwnProperty.call(d, slot)) continue;\n    if (!Array.isArray(d[slot])) { errors.push(`${slot}: dữ liệu phải là danh sách các dòng.`); continue; }\n    for (let i = 0; i < d[slot].length && errors.length < 30; i++) {\n      const row = d[slot][i];\n      if (!isRecord(row)) { errors.push(`${slot} dòng ${i + 1}: dòng dữ liệu không hợp lệ.`); continue; }\n      if (Object.values(row).some(v => typeof v === 'number' && !Number.isFinite(v))) errors.push(`${slot} dòng ${i + 1}: số không hợp lệ.`);\n      if (Object.values(row).some(v => v !== null && !['string', 'number', 'boolean'].includes(typeof v))) {\n        errors.push(`${slot} dòng ${i + 1}: ô dữ liệu có cấu trúc không hợp lệ.`);\n      }\n    }\n  }\n  if (errors.length) return { errors: errors.slice(0, 30), warnings };\n  const storeRows = [...(d.dt_luyke || []), ...(d.dt_realtime || [])];\n  const seenByCategory: Record<string, Set<string>> = { dt_luyke: new Set(), dt_realtime: new Set() };\n  (['dt_luyke','dt_realtime'] as const).forEach(category => {\n    (d[category] || []).forEach((r: any) => {\n      const code = String(r['MÃ ĐƠN VỊ'] || '').trim();\n      if (code) {\n        if (seenByCategory[category].has(code)) warnings.push(`${category}: mã đơn vị ${code} xuất hiện trùng trong cùng một cổng.`);\n        seenByCategory[category].add(code);\n      }\n    });\n  });\n  storeRows.forEach((r: any, i: number) => {\n    const code = String(r['MÃ ĐƠN VỊ'] || '').trim();\n    if (!code) errors.push(`Doanh thu ST dòng ${i + 1}: thiếu MÃ ĐƠN VỊ.`);\n\n    ['TARGET (TR)','TARGET QĐ (TR)','DOANH THU (TR)','DOANH THU QĐ (TR)'].forEach(k => { if (num(r[k]) < 0) warnings.push(`${code}: ${k} đang âm. Dữ liệu vẫn được chấp nhận và giữ nguyên, anh kiểm tra lại nếu cần.`); });\n    const target = num(r['TARGET (TR)']); const dt = num(r['DOANH THU (TR)']);\n    if (target === 0 && dt > 0) warnings.push(`${code}: có doanh thu nhưng TARGET bằng 0.`);\n    if (target > 0 && dt > target * 2.5) warnings.push(`${code}: doanh thu cao bất thường so với TARGET, hãy kiểm tra đơn vị/số liệu.`);\n    const days = num(r['SỐ NGÀY CỬA SỔ']);\n    if (days < 0) warnings.push(`${code}: SỐ NGÀY CỬA SỔ đang âm. Dữ liệu vẫn được chấp nhận, anh kiểm tra lại nếu cần.`);\n    if (days > 31) errors.push(`${code}: SỐ NGÀY CỬA SỔ không hợp lệ.`);\n  });\n  const employeeRows = [...(d.dt_nv_luyke || []), ...(d.dt_nv_realtime || [])];\n  employeeRows.forEach((r: any, i: number) => {\n    if (!String(r['TÊN NHÂN VIÊN'] || '').trim()) warnings.push(`Doanh thu NV dòng ${i + 1}: thiếu tên nhân viên.`);\n    ['DOANH THU (TR)','DOANH THU QĐ (TR)'].forEach(k => {\n      if (num(r[k]) < 0) warnings.push(`Doanh thu NV dòng ${i + 1}: ${k} đang âm do điều chỉnh/hoàn trừ, hãy kiểm tra nếu cần.`);\n    });\n  });\n  const compRows = [...(d.td_luyke || []), ...(d.td_realtime || []), ...(d.nv_tgdd || []), ...(d.nv_tz || [])];\n  compRows.forEach((r: any, i: number) => {\n    ['TARGET (TR/SL theo LOẠI TĐ)','SỐ LƯỢNG'].forEach(k => { if (num(r[k]) < 0) warnings.push(`Thi đua dòng ${i + 1}: ${k} đang âm. Dữ liệu vẫn được chấp nhận và giữ nguyên, anh kiểm tra lại nếu cần.`); });\n  });\n  return { errors: [...new Set(errors)].slice(0, 30), warnings: [...new Set(warnings)].slice(0, 50) };\n}\n","src/views/DailyProgressView.tsx":"import { SortableTable } from '../components/SortableTable';\nimport React, {useState} from 'react';\nimport {DailyTrendCharts} from '../components/DailyTrendCharts';\nimport { CalendarDays, AlertCircle } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatPercent } from '../utils/formatters';\n\nexport const DailyProgressView: React.FC<{appData: AppDataState; dailySnapshots:any[]; onRefresh:()=>void}> = ({appData,dailySnapshots,onRefresh}) => {\n const allRows=(Array.isArray(dailySnapshots)?dailySnapshots:[]).filter(r=>r && /^\\d{4}-\\d{2}-\\d{2}$/.test(r.date)).sort((a,b)=>String(a.date).localeCompare(String(b.date)));\n const months=[...new Set(allRows.map(r=>r.date.slice(0,7)))].reverse();\n const [selectedMonth,setSelectedMonth]=useState('');\n const [showHistory,setShowHistory]=useState(()=>{\n  try { return localStorage.getItem('skst_daily_history_visible_v1')!=='no'; } catch { return true; }\n });\n const toggleHistory=()=> cy(r.target,1)+' TR':'—'}</td><td className=\"p-3 text-right font-black\" data-sort-value={r.pct}>{r.pct!=null?formatPercent(r.pct,1):'—'}</td><td className={\"p-3 text-right font-bold \"+(d>=0?'text-emerald-600':'text-rose-600')} data-sort-value={d}>{d!=null?formatCurrency(d,1)+' điểm %':'—'}</td></tr>})}</tbody></SortableTable></div>:<div className=\"p-8 text-center text-xs text-slate-500\"><AlertCircle className=\"w-6 h-6 mx-auto mb-2\"/>Chưa có snapshot. Hãy nạp dữ liệu và bấm cập nhật hôm nay.</div>}</div></div>\n  </DailyTrendCharts>\n </div>;\n};\n","src/utils/stretchGoal.ts":"import React, { useEffect, useState } from 'react';\n\nconst STORAGE_KEY = 'skst_stretch_goal_pct_v1';\nconst EVENT_NAME = 'skst-stretch-goal-change';\nconst STATUS_EVENT = 'skst-stretch-sync-status';\nexport const FIREBASE_AUTH_EVENT = 'skst-firebase-auth-change';\nconst PENDING_KEY = 'skst_stretch_pending_v1';\nconst DEFAULT_STRETCH_GOAL = 100;\nconst MIN_STRETCH_GOAL = 90;\nconst MAX_STRETCH_GOAL = 150;\nconst PERSONNEL_ALLOCATION_KEY = 'skst_personnel_target_allocation_v1';\nconst FIREBASE_CONFIG = {\n  apiKey: 'AIzaSyBpYqlkhjFI8wU4kan9nYjgKfw9C77Js2Q',\n  authDomain: 'suc-khoe-cum-933.firebaseapp.com',\n  databaseURL: 'https://suc-khoe-cum-933-default-rtdb.asia-southeast1.firebasedatabase.app',\n  projectId: 'suc-khoe-cum-933',\n  storageBucket: 'suc-khoe-cum-933.firebasestorage.app',\n  messagingSenderId: '1038827611970',\n  appId: '1:1038827611970:web:059c46f85d6d327de34adb'\n};\n\nconst CLOUD_PATH = 'sharedConfig/stretchGoalPct';\nconst valid = (v: any): v is number => typeof v === 'number' && Number.isFinite(v) && v >= 90 && v <= 150;\nconst readLocal = () => { try { const n = Number(localStorage.getItem(STORAGE_KEY)); return valid(n) ? n : DEFAULT_STRETCH_GOAL; } catch { return DEFAULT_STRETCH_GOAL; } };\nlet current = readLocal();\nlet auth: any = null, db: any = null, user: any = null, remoteRef: any = null;\nlet connected = false, ready = false, permitted = false, writing = false;\nlet remoteValue: number | null = null, generation = 0;\ntype PendingItem = { id: string; uid: string | null; value: number };\nlet pending: PendingItem | null = null;\nlet timer: any = null, starting: Promise<void> | null = null, detach: (() => void) | null = null;\nlet authInitialStateKnown = false;\nlet authReadyPromise: Promise<void> | null = null;\nlet resolveAuthReady: (() => void) | null = null;\nlet state = { text: 'Đang kết nối đồng bộ mục tiêu…', email: '', signedIn: false, busy: false };\nfunction status(text: string) {\n  state = { ...state, text, email: user?.email || '', signedIn: !!user };\n  window.dispatchEvent(new CustomEvent(STATUS_EVENT));\n}\nfunction apply(value: number) {\n  if (!valid(value)) return;\n  current = value;\n  try { localStorage.setItem(STORAGE_KEY, String(value)); } catch {}\n  window.dispatchEvent(new CustomEvent(EVENT_NAME, { detail: value }));\n}\nfunction persistPending() {\n  try { if (pending) localStorage.setItem(PENDING_KEY, JSON.stringify(pending)); else localStorage.removeItem(PENDING_KEY); } catch {}\n}\nfunction readPending(): PendingItem | null {\n  try {\n    const p = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null');\n    if (!p || typeof p.id !== 'string' || !valid(p.value)) return null;\n    const uid = typeof p.uid === 'string' && p.uid ? p.uid : null;\n    return { id: p.id, uid, value: p.value };\n  } catch { return null; }\n}\nfunction restorePending(uid: string): PendingItem | null {\n  const p = readPending();\n  if (!p) return null;\n\n  if (p.uid && p.uid !== uid) return null;\n  if (!p.uid) {\n    p.uid = uid;\n    pending = p;\n    persistPending();\n  }\n  return p;\n}\npending = readPending();\nfunction showConnection() {\n  if (!user) return status(pending ? 'Đã lưu trên máy · Có thay đổi chờ đồng bộ sau khi đăng nhập' : 'Chỉ lưu trên máy · Đăng nhập để đồng bộ');\n  if (!connected) return status(pending ? 'Mất kết nối · Có thay đổi chờ gửi' : 'Mất kết nối · Đang dùng giá trị gần nhất');\n  if (!ready) return status('Đang kiểm tra quyền và nhận mục tiêu chung…');\n  if (!permitted) return status('Tài khoản chưa được cấp quyền đồng bộ');\n  status(pending || writing ? 'Đang gửi mục tiêu…' : remoteValue === null ? 'Đã kết nối · Đổi mục tiêu để lưu cấu hình chung' : 'Đã đồng bộ mục tiêu');\n}\nfunction scheduleFlush() { clearTimeout(timer); timer = setTimeout(flush, 350); }\nasync function flush() {\n  if (!user || !remoteRef || !connected || !ready || !permitted || writing || !pending || pending.uid !== user.uid) return;\n  const item = pending, ref = remoteRef, epoch = generation;\n  writing = true; showConnection();\n  try {\n    await ref.set(item.value);\n    if (epoch !== generation) return;\n    if (pending?.id === item.id) { pending = null; persistPending(); }\n    writing = false;\n    if (pending) { apply(pending.value); scheduleFlush(); }\n    else apply(item.value);\n    showConnection();\n  } catch (e: any) {\n    if (epoch !== generation) return;\n    writing = false;\n    if (/permission|denied/i.test(String(e?.code || e?.message))) {\n\n      permitted = false;\n      persistPending();\n      status('Không có quyền ghi · Thay đổi vẫn được giữ trên máy');\n    } else {\n      status('Chưa gửi được · Giữ thay đổi trên máy, sẽ thử lại');\n      timer = setTimeout(flush, 5000);\n    }\n  }\n}\nexport function getStretchGoalPct(): number { return current; }\nfunction setStretchGoalPct(value: number): void {\n  const n = Number(value);\n  const next = Math.min(MAX_STRETCH_GOAL, Math.max(MIN_STRETCH_GOAL, Number.isFinite(n) ? n : DEFAULT_STRETCH_GOAL));\n  apply(next);\n\n  pending = {\n    id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,\n    uid: user?.uid || null,\n    value: next,\n  };\n  persistPending();\n\n  if (user && permitted) {\n    scheduleFlush();\n    showConnection();\n  } else if (!navigator.onLine) {\n    status('Đã lưu trên máy · Sẽ đồng bộ khi có mạng và đăng nhập');\n  } else if (!user) {\n    status('Đã lưu trên máy · Đăng nhập Google để đồng bộ');\n  } else {\n    status('Đã lưu trên máy · Đang chờ quyền đồng bộ');\n  }\n}\nexport function useStretchGoalPct(): [number, (value: number) => void] {\n  const [value, setValue] = useState(getStretchGoalPct);\n  useEffect(() => {\n    const sync = () => setValue(getStretchGoalPct());\n    window.addEventListener(EVENT_NAME, sync); sync();\n    void startSync();\n    return () => window.removeEventListener(EVENT_NAME, sync);\n  }, []);\n  return [value, setStretchGoalPct];\n}\nwindow.addEventListener('storage', (e: StorageEvent) => {\n  if (e.key === STORAGE_KEY || e.key === null) { current = readLocal(); window.dispatchEvent(new CustomEvent(EVENT_NAME, { detail: current })); }\n});\n\nfunction loadScript(src: string): Promise<void> {\n  return new Promise((resolve, reject) => {\n    const script = document.createElement('script');\n    const timeout = setTimeout(() => { script.remove(); reject(new Error('sdk-timeout')); }, 15000);\n    script.src = src; script.async = true;\n    script.onload = () => { clearTimeout(timeout); resolve(); };\n    script.onerror = () => { clearTimeout(timeout); script.remove(); reject(new Error('sdk-network')); };\n    document.head.appendChild(script);\n  });\n}\nasync function startSync(): Promise<void> {\n  if (starting) return starting;\n  starting = (async () => {\n    try {\n      if (!/^https?:$/.test(location.protocol)) { status('Mở website qua HTTPS để đăng nhập · Hiện chỉ lưu trên máy'); return; }\n      const w = window as any;\n      const base = 'https://www.gstatic.com/firebasejs/12.2.1/';\n      if (!w.firebase) await loadScript(base + 'firebase-app-compat.js');\n      const sdkLoads: Promise<void>[] = [];\n      if (!w.firebase.auth) sdkLoads.push(loadScript(base + 'firebase-auth-compat.js'));\n      if (!w.firebase.database) sdkLoads.push(loadScript(base + 'firebase-database-compat.js'));\n      if (sdkLoads.length) await Promise.all(sdkLoads);\n      const firebase = w.firebase;\n      const app = firebase.apps.find((a: any) => a.name === 'stretch-goal-sync') || firebase.initializeApp(FIREBASE_CONFIG, 'stretch-goal-sync');\n      auth = app.auth(); db = app.database();\n      auth.onAuthStateChanged((nextUser: any) => {\n        authInitialStateKnown = true;\n        try { resolveAuthReady?.(); } catch {}\n        resolveAuthReady = null;\n        generation++; clearTimeout(timer); detach?.(); detach = null;\n        user = nextUser; remoteRef = null; ready = false; permitted = false; writing = false; remoteValue = null; connected = false;\n        window.dispatchEvent(new CustomEvent(FIREBASE_AUTH_EVENT, { detail: { uid: user?.uid || '', email: user?.email || '' } }));\n        pending = user ? restorePending(user.uid) : readPending();\n        if (!user) { showConnection(); return; }\n        if (pending) apply(pending.value);\n        const epoch = generation;\n        const ref = db.ref(CLOUD_PATH); remoteRef = ref;\n        const connection = db.ref('.info/connected');\n        const onConnection = (snap: any) => {\n          if (epoch !== generation) return;\n          connected = snap.val() === true; showConnection(); if (connected) scheduleFlush();\n        };\n        const onValue = (snap: any) => {\n          if (epoch !== generation) return;\n          const v = snap.val();\n          ready = true; permitted = true;\n          if (v !== null && !valid(v)) { permitted = false; status('Cấu hình cloud không hợp lệ · Đang dùng bản trên máy'); return; }\n          remoteValue = v;\n          if (!pending && valid(v)) apply(v);\n          showConnection(); if (pending) scheduleFlush();\n        };\n        ref.on('value', onValue, () => {\n          if (epoch !== generation) return;\n          ready = true; permitted = false;\n          status('Tài khoản chưa được cấp quyền · Chỉ dùng dữ liệu trên máy');\n        });\n        connection.on('value', onConnection);\n        detach = () => { ref.off('value', onValue); connection.off('value', onConnection); };\n        showConnection();\n      });\n    } catch { starting = null; status('Không tải được đồng bộ · Vẫn dùng mục tiêu trên máy'); }\n  })();\n  return starting;\n}\nwindow.addEventListener('online', () => { if (!auth) void startSync(); else { showConnection(); scheduleFlush(); } });\nwindow.addEventListener('offline', () => showConnection());\nfunction waitForAuthReady(): Promise<void> {\n  if (authInitialStateKnown || auth?.currentUser || user) return Promise.resolve();\n  if (!authReadyPromise) {\n    authReadyPromise = new Promise<void>((resolve) => {\n      let done = false;\n      let timeout: number | null = null;\n      const finish = () => {\n        if (done) return;\n        done = true;\n        if (timeout !== null) window.clearTimeout(timeout);\n        if (resolveAuthReady === finish) resolveAuthReady = null;\n        resolve();\n      };\n      resolveAuthReady = finish;\n      timeout = window.setTimeout(finish, 3500);\n    });\n  }\n  return authReadyPromise;\n}\n\nexport async function getSharedFirebaseContext(): Promise<{ auth: any; db: any; user: any }> {\n  await startSync();\n  if (!auth || !db) return { auth, db, user: null };\n  if (auth.currentUser || user) return { auth, db, user: auth.currentUser || user };\n\n  await waitForAuthReady();\n  return { auth, db, user: auth.currentUser || user };\n}\n\nasync function signInStretchGoal() {\n  if (state.busy) return;\n  state = { ...state, busy: true }; status(state.text);\n  try {\n    await startSync(); if (!auth) return;\n    const provider = new (window as any).firebase.auth.GoogleAuthProvider();\n    provider.setCustomParameters({ prompt: 'select_account' });\n    await auth.signInWithPopup(provider);\n  } catch (e: any) {\n    const code = String(e?.code || '');\n    status(code.includes('unauthorized-domain') ? 'Tên miền chưa được thêm trong Firebase Authentication' : code.includes('popup-blocked') ? 'Trình duyệt chặn cửa sổ · Cho phép popup rồi đăng nhập lại' : code.includes('popup-closed') ? 'Đã đóng đăng nhập · Chỉ dùng bản trên máy' : 'Đăng nhập chưa thành công · Vui lòng thử lại');\n  } finally { state = { ...state, busy: false }; window.dispatchEvent(new CustomEvent(STATUS_EVENT)); }\n}\nasync function signOutStretchGoal() {\n  if (writing) { status('Đang gửi mục tiêu · Chờ vài giây rồi đăng xuất'); return; }\n  try { await auth?.signOut(); } catch { status('Chưa đăng xuất được · Vui lòng thử lại'); }\n}\nexport function StretchGoalSyncStatus() {\n  const [s, setS] = useState(state);\n  useEffect(() => { const listener = () => setS({ ...state }); window.addEventListener(STATUS_EVENT, listener); listener(); void startSync(); return () => window.removeEventListener(STATUS_EVENT, listener); }, []);\n  return React.createElement('div', { className: 'flex flex-wrap items-center justify-end gap-2 text-[11px] text-slate-600', 'data-stretch-sync': true },\n    React.createElement('span', { role: 'status', 'aria-live': 'polite' }, s.text),\n    s.email && React.createElement('span', null, s.email),\n    React.createElement('button', { type: 'button', disabled: s.busy, onClick: s.signedIn ? signOutStretchGoal : signInStretchGoal, className: 'px-3 py-1.5 rounded-lg border border-blue-200 bg-white text-blue-700 font-bold' }, s.busy ? 'Đang đăng nhập…' : s.signedIn ? 'Đăng xuất đồng bộ' : 'Đăng nhập Google'),\n    React.createElement('span', { className: 'basis-full text-right text-slate-400' }, 'Google dùng cho đồng bộ mục tiêu %, KPI nhân viên, Môn Tập Trung và bàn giao data trong ngày. Thay đổi offline được giữ trên máy và tự gửi khi có mạng + tài khoản được cấp quyền.')\n  );\n}\n\nexport function getPersonnelAllocationPct(storeKey: 'TGDD' | 'TOPZONE'): number | null {\n  try {\n    const raw = localStorage.getItem(PERSONNEL_ALLOCATION_KEY);\n    const map = raw ? JSON.parse(raw) : {};\n    const value = Number(map?.[storeKey]);\n    return Number.isFinite(value) && value >= 100 && value <= MAX_STRETCH_GOAL ? value : null;\n  } catch { return null; }\n}\n\nexport function setPersonnelAllocationPct(storeKey: 'TGDD' | 'TOPZONE', totalPct: number): void {\n  try {\n    const raw = localStorage.getItem(PERSONNEL_ALLOCATION_KEY);\n    const map = raw ? JSON.parse(raw) : {};\n    map[storeKey] = Math.min(MAX_STRETCH_GOAL, Math.max(100, Number(totalPct) || 100));\n    localStorage.setItem(PERSONNEL_ALLOCATION_KEY, JSON.stringify(map));\n  } catch {}\n}\n","src/views/DataQualityCenterView.tsx":"import React, { useMemo, useState } from 'react';\nimport { AlertTriangle, CheckCircle2, Database, RefreshCw, Search, ShieldCheck, XCircle } from 'lucide-react';\nimport { AppDataState } from '../types';\n\ninterface Props { appData: AppDataState; onNavigate?: (view: any) => void; }\n\ntype Issue = { severity: 'error'|'warning'|'info'; area: string; message: string; count: number; details?: string[] };\n\nconst CATEGORIES: {key:keyof AppDataState; label:string}[] = [\n  {key:'dt_luyke',label:'DT Lũy kế'}, {key:'dt_realtime',label:'DT Realtime'},\n  {key:'td_luyke',label:'Thi đua LK'}, {key:'td_realtime',label:'Thi đua RT'},\n  {key:'nv_tgdd',label:'NV TGDĐ'}, {key:'nv_tz',label:'NV TopZone'},\n  {key:'dt_nv_luyke',label:'DT NV LK'}, {key:'dt_nv_realtime',label:'DT NV RT'},\n  {key:'tra_cham_luyke',label:'Trả chậm LK'}, {key:'tra_cham_realtime',label:'Trả chậm RT'}\n];\n\nconst str = (v:any) => String(v ?? '').trim();\nconst num = (v:any) => { const n = Number(String(v ?? '').replace(/,/g,'')); return Number.isFinite(n) ? n : 0; };\n\nconst recordKey = (category:keyof AppDataState, r:any) => {\n  const store = str(r?.['MÃ ĐƠN VỊ']);\n  const employee = str(r?.['MÃ NV'] ?? r?.['MÃ NHÂN VIÊN'] ?? r?.['TÊN NHÂN VIÊN'] ?? r?.['ĐƠN VỊ / NHÂN VIÊN']);\n  const program = str(r?.['MÃ CHƯƠNG TRÌNH'] ?? r?.['CHƯƠNG TRÌNH']);\n  if (category === 'dt_luyke' || category === 'dt_realtime') return store;\n  if (category === 'td_luyke' || category === 'td_realtime') return store && program ? `${store}|${program}` : '';\n  if (category === 'nv_tgdd' || category === 'nv_tz') return employee && program ? `${employee}|${program}` : '';\n  if (category === 'dt_nv_luyke' || category === 'dt_nv_realtime') return employee;\n  return '';\n};\n\nexport const DataQualityCenterView: React.FC<Props> = ({ appData }) => {\n  const [refresh, setRefresh] = useState(0);\n  const [filter, setFilter] = useState<'all'|'error'|'warning'>('all');\n  const [search, setSearch] = useState('');\n\n  const report = useMemo(() => {\n    void refresh;\n    const issues: Issue[] = [];\n    let rowsTotal = 0, rowsNonEmpty = 0;\n    const byCategory = CATEGORIES.map(c => ({...c, rows: Array.isArray(appData[c.key]) ? appData[c.key] : []}));\n\n    byCategory.forEach(c => {\n      rowsTotal += c.rows.length;\n      const canCheckIdentity = c.key !== 'tra_cham_luyke' && c.key !== 'tra_cham_realtime';\n      const missingKey = canCheckIdentity ? c.rows.filter((r:any) => !recordKey(c.key, r)) : [];\n      rowsNonEmpty += c.rows.filter((r:any) => Object.values(r || {}).some(v => str(v))).length;\n      if (missingKey.length) issues.push({severity:'warning', area:c.label, message:'Dòng thiếu mã định danh', count:missingKey.length});\n\n      const seen = new Set<string>(), dup = new Set<string>();\n      c.rows.forEach((r:any) => { const k=recordKey(c.key, r); if(k){ if(seen.has(k)) dup.add(k); seen.add(k); }});\n      if (dup.size) issues.push({severity:'warning', area:c.label, message:'Mã bị trùng trong cùng báo cáo', count:dup.size, details:Array.from(dup).slice(0,12)});\n\n      const negative = c.rows.filter((r:any) => Object.entries(r||{}).some(([k,v]) => /(DOANH THU|DT QUY ĐỔI|TARGET|SỐ LƯỢNG)/i.test(k) && num(v)<0));\n      if (negative.length) issues.push({severity:'error', area:c.label, message:'Có giá trị âm ở cột số liệu', count:negative.length});\n\n      const zeroTarget = c.rows.filter((r:any) => /(td_|nv_)/.test(c.key as string) && ('TARGET (TR/SL theo LOẠI TĐ)' in (r||{})) && num(r['TARGET (TR/SL theo LOẠI TĐ'])===0);\n      if (zeroTarget.length) issues.push({severity:'warning', area:c.label, message:'Chương trình có Target bằng 0', count:zeroTarget.length});\n\n      const invalidPct = c.rows.filter((r:any) => Object.entries(r||{}).some(([k,v]) => /%/.test(k) && num(v)>500));\n      if (invalidPct.length) issues.push({severity:'warning', area:c.label, message:'Tỷ lệ % vượt ngưỡng kiểm tra (>500%)', count:invalidPct.length});\n    });\n\n    const populated = byCategory.filter(c => c.rows.length>0).length;\n    if (!populated) issues.push({severity:'info', area:'Toàn phiên', message:'Chưa có dữ liệu để kiểm tra', count:0});\n    return {issues, rowsTotal, rowsNonEmpty, populated, byCategory};\n  }, [appData, refresh]);\n\n  const visibleIssues = report.issues.filter(i => filter==='all' || i.severity===filter).filter(i => !search || `${i.area} ${i.message}`.toLowerCase().includes(search.toLowerCase()));\n  const errors = report.issues.filter(i=>i.severity==='error').reduce((s,i)=>s+i.count,0);\n  const warnings = report.issues.filter(i=>i.severity==='warning').reduce((s,i)=>s+i.count,0);\n\n  return <div className=\"space-y-5 dq-page\">\n    <div className=\"flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4\">\n      <div><div className=\"text-[11px] font-black uppercase tracking-[.16em] text-blue-600\">D · DATA QUALITY CENTER</div><h2 className=\"text-2xl md:text-3xl font-black text-slate-950 mt-1\">Kiểm tra sức khỏe dữ liệu</h2><p className=\"text-sm text-slate-500 mt-1\">Quét nhanh các lỗi thường gặp trước khi dùng số liệu để điều hành.</p></div>\n      <button onClick={()=>setRefresh(x=>x+1)} className=\"dq-primary\"><RefreshCw className=\"w-4 h-4\"/> Quét lại dữ liệu</button>\n    </div>\n\n    <div className=\"grid grid-cols-2 xl:grid-cols-4 gap-3\">\n      <Metric title=\"Tổng dòng\" value={report.rowsTotal.toLocaleString('vi-VN')} icon={<Database/>} />\n      <Metric title=\"Category có data\" value={`${report.populated}/10`} icon={<CheckCircle2/>} />\n      <Metric title=\"Lỗi cần xử lý\" value={errors.toLocaleString('vi-VN')} icon={<XCircle/>} danger />\n      <Metric title=\"Cảnh báo\" value={warnings.toLocaleString('vi-VN')} icon={<AlertTriangle/>} warn />\n    </div>\n\n    <div className=\"bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden\">\n      <div className=\"p-4 border-b border-slate-100 flex flex-col lg:flex-row gap-3 lg:items-center lg:justify-between\">\n        <div className=\"flex gap-2 flex-wrap\"><FilterButton active={filter==='all'} onClick={()=>setFilter('all')}>Tất cả</FilterButton><FilterButton active={filter==='error'} onClick={()=>setFilter('error')}>Lỗi</FilterButton><FilterButton active={filter==='warning'} onClick={()=>setFilter('warning')}>Cảnh báo</FilterButton></div>\n        <div className=\"relative w-full lg:w-72\"><Search className=\"absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400\"/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder=\"Tìm cảnh báo...\" className=\"dq-input pl-9\"/></div>\n      </div>\n      <div className=\"divide-y divide-slate-100\">\n        {visibleIssues.length===0 ? <div className=\"p-10 text-center\"><ShieldCheck className=\"w-10 h-10 mx-auto text-emerald-500\"/><div className=\"font-black text-slate-900 mt-2\">Dữ liệu đang sạch theo bộ kiểm tra hiện tại</div><div className=\"text-xs text-slate-500 mt-1\">Không phát hiện lỗi/cảnh báo phù hợp bộ lọc.</div></div> : visibleIssues.map((i,idx)=><div key={idx} className=\"p-4 flex gap-3 items-start\"><IssueIcon severity={i.severity}/><div className=\"min-w-0 flex-1\"><div className=\"flex flex-wrap items-center gap-2\"><b className=\"text-sm text-slate-900\">{i.message}</b><span className=\"dq-chip\">{i.area}</span></div><div className=\"text-xs text-slate-500 mt-1\">Số lượng ảnh hưởng: <b>{i.count.toLocaleString('vi-VN')}</b></div>{i.details?.length ? <div className=\"text-[11px] text-slate-400 mt-2\">Mã mẫu: {i.details.join(', ')}{i.details.length>=12?'…':''}</div>:null}</div></div>)}\n      </div>\n    </div>\n\n    <div className=\"bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden\">\n      <div className=\"p-4 border-b border-slate-100\"><h3 className=\"font-black text-slate-900\">Bản đồ dữ liệu phiên hiện tại</h3><p className=\"text-xs text-slate-500 mt-1\">Theo dõi nhanh category nào đã có dữ liệu và số dòng.</p></div>\n      <div className=\"grid sm:grid-cols-2 lg:grid-cols-5 gap-2 p-4\">{report.byCategory.map(c=><div key={c.key} className={`rounded-2xl border p-3 ${c.rows.length?'bg-emerald-50/60 border-emerald-100':'bg-slate-50 border-slate-200'}`}><div className=\"text-[11px] font-bold text-slate-600\">{c.label}</div><div className=\"text-xl font-black mt-1\">{c.rows.length.toLocaleString('vi-VN')}</div><div className=\"text-[10px] text-slate-400\">dòng dữ liệu</div></div>)}</div>\n    </div>\n  </div>;\n};\n\nconst Metric=({title,value,icon,danger,warn}:{title:string;value:string;icon:React.ReactNode;danger?:boolean;warn?:boolean})=><div className=\"bg-white rounded-3xl border border-slate-200 p-4 shadow-sm\"><div className=\"flex items-center justify-between\"><span className=\"text-[11px] font-bold text-slate-500\">{title}</span><span className={`p-2 rounded-xl ${danger?'bg-rose-50 text-rose-600':warn?'bg-amber-50 text-amber-600':'bg-blue-50 text-blue-600'}`}>{React.cloneElement(icon as React.ReactElement,{className:'w-4 h-4'})}</span></div><div className=\"text-2xl font-black text-slate-950 mt-2\">{value}</div></div>;\nconst FilterButton=({active,onClick,children}:{active:boolean;onClick:()=>void;children:React.ReactNode})=><button onClick={onClick} className={`px-3 py-1.5 rounded-xl text-xs font-black ${active?'bg-slate-900 text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>{children}</button>;\nconst IssueIcon=({severity}:{severity:Issue['severity']})=>severity==='error'?<XCircle className=\"w-5 h-5 text-rose-600 shrink-0\"/>:severity==='warning'?<AlertTriangle className=\"w-5 h-5 text-amber-500 shrink-0\"/>:<CheckCircle2 className=\"w-5 h-5 text-blue-500 shrink-0\"/>;\n","src/components/SortableTable.tsx":"import React, { useState } from 'react';\n\nconst collator = new Intl.Collator('vi', { numeric: true, sensitivity: 'base' });\nconst elements = (children: any): any[] => React.Children.toArray(children).flatMap((child: any) =>\n  React.isValidElement(child) && child.type === React.Fragment ? elements(child.props.children) : [child]\n).filter(React.isValidElement);\n\nfunction cellValue(node: any): any {\n  if (node == null || typeof node === 'boolean') return '';\n  if (typeof node === 'string' || typeof node === 'number') return node;\n  if (Array.isArray(node)) { const values = node.map(cellValue).filter(v => v !== ''); return values.length === 1 ? values[0] : values.join(' '); }\n  if (!React.isValidElement(node)) return '';\n  const p: any = node.props;\n  if (p['data-sort-value'] !== undefined) return p['data-sort-value'];\n  if (node.type === 'input' || node.type === 'select') return p.type === 'checkbox' ? Number(!!p.checked) : (p.value ?? p.defaultValue ?? '');\n  if (typeof node.type === 'function' || node.type === 'svg') return '';\n  const value = cellValue(p.children);\n  return value !== '' ? value : (p['aria-label'] || p.title || '');\n}\n\nfunction comparable(value: any): number | string | null {\n  if (typeof value === 'number') return Number.isFinite(value) ? value : null;\n  let s = String(value ?? '').trim().replace(/\\u2212/g, '-').replace(/^✓\\s*/, '');\n  if (!s || /^(?:[-—–]|n\\/a|null)$/i.test(s)) return null;\n  const medals: any = { '🥇': 1, '🥈': 2, '🥉': 3 };\n  if (medals[s]) return medals[s];\n  if (/^(?:✓\\s*)?XONG$/i.test(s)) return 0;\n  const iso = s.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\n  const date = s.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/);\n  if (iso) return Number(iso[1] + iso[2] + iso[3]);\n  if (date) return Number(date[3] + date[2].padStart(2, '0') + date[1].padStart(2, '0'));\n\n  const percent = s.match(/^([+-]?[\\d.,\\s]+)\\s*%/);\n  const numeric = s.match(/^([+-]?[\\d.,\\s]+)(?:\\s*(?:TR|TRIỆU|Đ|₫|ĐIỂM|MÔN|MÓN|CÁI|BILL|\\/\\s*NGÀY))?$/i);\n  if (percent || numeric) {\n    let token = (percent || numeric)![1].replace(/\\s/g, '');\n    if (token.includes(',')) token = token.replace(/\\./g, '').replace(',', '.');\n    else if (/^[+-]?\\d{1,3}(?:\\.\\d{3})+$/.test(token)) token = token.replace(/\\./g, '');\n    const n = Number(token);\n    if (Number.isFinite(n)) return n;\n  }\n  return s.replace(/^[✓⚠★🥇🥈🥉\\s]+/u, '');\n}\n\nfunction sortRows(rows: any[], column: number, direction: string): any[] {\n  const movable = rows.filter(row => !row.props['data-sort-fixed'] && !elements(row.props.children).some(c => c.props.colSpan > 1));\n  const sorted = movable.map((row, index) => ({ row, index, value: comparable(cellValue(elements(row.props.children)[column])) }))\n    .sort((a, b) => {\n\n      if (a.value === null || b.value === null) return a.value === b.value ? a.index - b.index : a.value === null ? 1 : -1;\n      const result = typeof a.value === 'number' && typeof b.value === 'number' ? a.value - b.value : collator.compare(String(a.value), String(b.value));\n      return (direction === 'asc' ? result : -result) || a.index - b.index;\n    }).map(x => x.row);\n  let i = 0;\n  return rows.map(row => movable.includes(row) ? sorted[i++] : row);\n}\n\nexport function SortableTable({ children, grid = false, initialSort, rowLimit, ...props }: any) {\n  const parts = elements(children);\n  const head = grid ? parts[0] : parts.find(p => p.type === 'thead');\n  const headerRows = grid ? [head] : elements(head?.props.children);\n  const headers = headerRows.flatMap(r => elements(r?.props.children));\n  const signature = headers.map(h => String(cellValue(h))).join('|');\n  const [sort, setSort] = useState<any>(() => initialSort ? { ...initialSort, signature } : null);\n  const active = sort?.signature === signature ? sort : null;\n  const header = (h: any, index: number) => {\n    const chosen = active?.column === index;\n    const direction = chosen ? active.direction : null;\n    const label = String(cellValue(h));\n    const toggle = () => setSort({ signature, column: index, direction: chosen && direction === 'asc' ? 'desc' : 'asc' });\n    return React.cloneElement(h, {\n      role: grid ? 'columnheader' : undefined,\n      'aria-sort': chosen ? (direction === 'asc' ? 'ascending' : 'descending') : 'none',\n      'data-sort-column': index,\n      className: `${h.props.className || ''} sk-sort-header`,\n      title: `${label}: bấm để sắp xếp ${chosen && direction === 'asc' ? 'giảm dần / Z–A' : 'tăng dần / A–Z'}`,\n      tabIndex: 0,\n      onClick: (e: any) => { e.stopPropagation(); toggle(); },\n      onKeyDown: (e: any) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); toggle(); } },\n      children: <>{h.props.children}<span aria-hidden=\"true\" className=\"sk-sort-indicator\">{direction === 'asc' ? '↑' : direction === 'desc' ? '↓' : '↕'}</span></>\n    });\n  };\n  let column = 0;\n  const newHead = grid ? React.cloneElement(head, {}, headers.map((h, i) => header(h, i))) : head && React.cloneElement(head, {}, headerRows.map(r => React.cloneElement(r, {}, elements(r.props.children).map(h => header(h, column++)))));\n  const body = (part: any) => {\n    let rows = elements(part.props.children);\n    if (active) rows = sortRows(rows, active.column, active.direction);\n    if (rowLimit != null) rows = rows.slice(0, rowLimit);\n    return React.cloneElement(part, {}, rows);\n  };\n  const content = parts.map((p, i) => p === head ? newHead : (grid ? i === 1 : p.type === 'tbody') ? body(p) : p);\n  return grid ? <div {...props} data-sortable=\"grid\">{content}</div> : <table {...props} data-sortable=\"table\">{content}</table>;\n}\n","src/utils/employeeRealtime.ts":"\nexport function applyEmployeeRealtime(employees, cumulativeRows, realtimeRows, enabled) {\n  if (!enabled) return {employees, unmatched: 0};\n  const code = v => String(v ?? '').trim().replace(/\\.0$/, '');\n  const rowId = r => code(r['MÃ NHÂN VIÊN'] || r['Mã NV'] || r['MÃ NV']);\n  const index = rows => {\n    const map = new Map();\n    rows.forEach(r => { const id = rowId(r); if (id) map.set(id, map.has(id) ? null : r); });\n    return map;\n  };\n  const rtMap = index(realtimeRows), lkMap = index(cumulativeRows);\n  const value = (r, keys) => { for (const k of keys) if (r[k] !== undefined && r[k] !== null && r[k] !== '') { const n = Number(r[k]); return Number.isFinite(n) ? n : 0; } return 0; };\n  const next = employees.map(emp => {\n    const id = code(emp.id), rt = rtMap.get(id);\n    let status = 'missing';\n    if ((rtMap.has(id) && !rt) || (lkMap.has(id) && !lkMap.get(id))) status = 'ambiguous';\n    else if (rt && !lkMap.has(id)) status = 'no_lk';\n    else if (rt && lkMap.get(id)) status = 'ok';\n    if (status !== 'ok') return {...emp, revenueRealtime: {status}};\n    const dt = value(rt, ['DOANH THU (TR)', 'DOANH THU', 'DT']);\n    const qd = value(rt, ['DOANH THU QĐ (TR)', 'DT QUY ĐỔI (TR)', 'DTQĐ']);\n    return {...emp, totalDt: emp.totalDt + dt, totalDtQd: emp.totalDtQd + qd,\n      revenueRealtime: {status, lkDt: emp.totalDt, lkQd: emp.totalDtQd, dt, qd}};\n  });\n\n  const unmatched = realtimeRows.filter(r => {\n    const id = rowId(r);\n    return !id || !lkMap.get(id) || !rtMap.get(id);\n  }).length;\n  return {employees: next, unmatched};\n}\n","src/utils/employeeProgramStatus.ts":"\nexport function employeeProgramStatus(p) {\n  if (p.hasActualData === false || p.target == null || String(p.target).trim() === '' || !(Number(p.target) > 0) || !Number.isFinite(Number(p.target)) || p.thuc == null || String(p.thuc).trim() === '' || !Number.isFinite(Number(p.thuc)) || p.pctDu == null || String(p.pctDu).trim() === '' || !Number.isFinite(Number(p.pctDu))) return 'unknown';\n  return Number(p.pctDu) < 80 ? 'weak' : Number(p.pctDu) < 100 ? 'watch' : 'good';\n}\n","src/utils/programCounts.ts":"import { CompetitionRow } from '../types';\n\nconst normalize = (value: any) => String(value ?? '').normalize('NFC').trim().replace(/\\s+/g, ' ').toLocaleLowerCase('vi');\n\nfunction programStore(row: CompetitionRow): string {\n  const code = normalize(row['MÃ ĐƠN VỊ']);\n  const name = normalize(row['TÊN ĐƠN VỊ'] || row['ĐƠN VỊ / NHÂN VIÊN']);\n  if (code === '933' || /tgd/.test(name)) return 'TGDD';\n  if (code === '10341' || /aar|topzone/.test(name)) return 'TOPZONE';\n  return code;\n}\n\nexport function countPrograms(rows: CompetitionRow[] = [], store?: 'TGDD' | 'TOPZONE'): number {\n  const selected = rows.filter(row => {\n    const target = Number(row['TARGET (TR/SL theo LOẠI TĐ)']);\n    return (!store || programStore(row) === store) && Number.isFinite(target) && target > 0;\n  });\n  const codesByName = new Map<string, Set<string>>();\n  for (const row of selected) {\n    const name = normalize(row['CHƯƠNG TRÌNH']), code = normalize(row['MÃ CHƯƠNG TRÌNH']);\n    const key = JSON.stringify([programStore(row), name]);\n    if (name && code) {\n      if (!codesByName.has(key)) codesByName.set(key, new Set());\n      codesByName.get(key)!.add(code);\n    }\n  }\n  const keys = new Set<string>();\n  for (const row of selected) {\n    const shop = programStore(row), name = normalize(row['CHƯƠNG TRÌNH']);\n    let code = normalize(row['MÃ CHƯƠNG TRÌNH']);\n    if (!code && !name) continue;\n    const known = codesByName.get(JSON.stringify([shop, name]));\n    if (!code && known?.size === 1) code = [...known][0];\n    keys.add(JSON.stringify([shop, code ? 'code' : 'name', code || name]));\n  }\n  return keys.size;\n}\n","src/components/EmployeeProgress.tsx":"import React from 'react';\n\nexport function summarizeProgress(programs: any[] = [], total = 0) {\n  const counts = { done: 0, forecast: 0, behind: 0, unknown: 0 };\n  for (const p of programs) {\n    if (!(Number(p.target) > 0)) continue;\n    const valid = (v: any) => v != null && String(v).trim() !== '' && Number.isFinite(Number(v));\n    if (p.hasActualData === false || !valid(p.pctLk)) counts.unknown++;\n    else if (Number(p.pctLk) >= 100) counts.done++;\n    else if (!valid(p.pctDu)) counts.unknown++;\n    else if (Number(p.pctDu) >= 100) counts.forecast++;\n    else counts.behind++;\n  }\n  const known = Object.values(counts).reduce((a, b) => a + b, 0);\n  counts.unknown += Math.max(0, total - known);\n  return { ...counts, total: Math.max(total, known) };\n}\n\nexport function EmployeeProgress({ summary }: { summary: ReturnType<typeof summarizeProgress> }) {\n  const parts = [\n    { count: summary.done, label: 'Đã đạt', color: '#10b981' },\n    { count: summary.forecast, label: 'Dự kiến đạt', color: '#f59e0b' },\n    { count: summary.behind, label: 'Cần tăng tốc', color: '#f43f5e' },\n    { count: summary.unknown, label: 'Chưa đủ dữ liệu', color: '#94a3b8' },\n  ];\n  return <div className=\"min-w-0 w-full\" title=\"Theo lũy kế: Đã đạt ≥100%; Dự kiến đạt: chưa đạt nhưng dự báo ≥100%; Cần tăng tốc: dự báo <100%.\">\n    <div className=\"flex justify-between gap-2 mb-2 text-[10px] font-bold text-slate-500\">\n      <span>TIẾN ĐỘ MÔN THI ĐUA</span><span>{summary.total} môn có target</span>\n    </div>\n    {summary.total ? <>\n      <div data-export-preserve-layout=\"true\" className=\"flex h-2.5 w-full overflow-hidden rounded-full bg-slate-200\" role=\"img\" aria-label={parts.map(p => `${p.label}: ${p.count}`).join(', ')}>\n        {parts.filter(p => p.count > 0).map(p => <span key={p.label} style={{ width: `${p.count / summary.total * 100}%`, backgroundColor: p.color }} title={`${p.label}: ${p.count} môn`} />)}\n      </div>\n      <div className=\"flex flex-wrap gap-x-3 gap-y-1 mt-2 text-[10px] font-semibold text-slate-600\">\n        {parts.filter((p,i) => i < 3 || p.count > 0).map(p => <span key={p.label} className=\"inline-flex items-center gap-1\"><i className=\"w-1.5 h-1.5 rounded-full\" style={{backgroundColor:p.color}} /><b>{p.count}</b> {p.label}</span>)}\n      </div>\n    </> : <p className=\"text-xs text-slate-400\">Chưa có môn lũy kế được giao target</p>}\n  </div>;\n}\n","src/utils/traChamShop.ts":"\nconst normalize = (value: any) => String(value ?? '').normalize('NFC').trim().replace(/\\s+/g, ' ').toLocaleLowerCase('vi');\n\nexport function normalizeTraChamName(value: any): string {\n  return normalize(value).replace(/^\\d+\\s*[-–—_]\\s*/, '');\n}\n\nfunction explicitShop(row: any): string | null {\n  const code = String(row['MÃ ĐƠN VỊ'] ?? row['MÃ SIÊU THỊ'] ?? '').trim();\n  if (code === '933') return 'TGDD';\n  if (code === '10341') return 'TOPZONE';\n  const label = normalize(row['SIÊU THỊ'] || row['TÊN ĐƠN VỊ'] || row['SHOP']);\n  if (/topzone|aar/.test(label)) return 'TOPZONE';\n  if (/tgd|tgđ|tgdd|thế giới di động/.test(label)) return 'TGDD';\n  return null;\n}\n\nfunction identity(row: any) {\n  const raw = normalize(row['NHÂN VIÊN'] || row['TÊN NHÂN VIÊN'] || row['ĐƠN VỊ / NHÂN VIÊN']);\n  const prefix = raw.match(/^(\\d+)\\s*[-–—_]\\s*/);\n  const id = String(row['MÃ NHÂN VIÊN'] || row['MÃ NV'] || prefix?.[1] || '').trim().replace(/\\.0$/, '');\n  return { id, name: normalizeTraChamName(raw) };\n}\n\nexport function buildTraChamShopResolver(data: any, personnel: any = {}) {\n  const ids = new Map<string, Set<string>>(), names = new Map<string, Set<string>>();\n  const roster = new Map<string, Set<string>>();\n  const add = (map: Map<string, Set<string>>, key: string, shop: string) => {\n    if (!key) return;\n    if (!map.has(key)) map.set(key, new Set());\n    map.get(key)!.add(shop);\n  };\n\n  for (const shop of ['TGDD', 'TOPZONE']) {\n    for (const name of Object.keys(personnel[shop] || {})) add(roster, normalizeTraChamName(name), shop);\n  }\n\n  for (const [slot, fallback] of [['dt_nv_luyke', null], ['dt_nv_realtime', null], ['nv_tgdd', 'TGDD'], ['nv_tz', 'TOPZONE']] as const) {\n    for (const row of data[slot] || []) {\n      const shop = explicitShop(row) || fallback;\n      if (!shop) continue;\n      const { id, name } = identity(row);\n      add(ids, id, shop); add(names, name, shop);\n    }\n  }\n\n  const unique = (shops: Set<string>) => shops.size === 1 ? [...shops][0] : null;\n  return (row: any): string | null => {\n    const { id, name } = identity(row);\n\n    if (name && roster.has(name)) return unique(roster.get(name)!);\n\n    const explicit = explicitShop(row);\n    if (explicit) return explicit;\n    if (id && ids.has(id)) return unique(ids.get(id)!);\n    if (names.has(name)) return unique(names.get(name)!);\n    return null;\n  };\n}\n","src/utils/dailyCloudHandoff.ts":"import { AppDataState } from '../types';\nimport { validateAppData } from './dataValidation';\nimport { FIREBASE_AUTH_EVENT, getSharedFirebaseContext } from './stretchGoal';\n\nconst DAILY_CLOUD_ROOT = 'dailyData';\nconst APP_STORAGE_KEY = 'skst_app_data_v7';\nconst PENDING_STORAGE_KEY = 'skst_daily_cloud_pending_v1';\n\nexport const DAILY_DATA_SLOTS: (keyof AppDataState)[] = [\n  'dt_luyke',\n  'dt_realtime',\n  'td_luyke',\n  'td_realtime',\n  'nv_tgdd',\n  'nv_tz',\n  'dt_nv_luyke',\n  'dt_nv_realtime',\n  'tra_cham_luyke',\n  'tra_cham_realtime',\n];\n\nexport const DAILY_DATA_LABELS: Record<string, string> = {\n  dt_luyke: 'Doanh thu siêu thị lũy kế',\n  dt_realtime: 'Doanh thu siêu thị Realtime',\n  td_luyke: 'Thi đua siêu thị lũy kế',\n  td_realtime: 'Thi đua siêu thị Realtime',\n  nv_tgdd: 'Thi đua nhân viên TGDĐ',\n  nv_tz: 'Thi đua nhân viên TopZone',\n  dt_nv_luyke: 'Doanh thu nhân viên lũy kế',\n  dt_nv_realtime: 'Doanh thu nhân viên Realtime',\n  tra_cham_luyke: 'Trả chậm nhân viên lũy kế',\n  tra_cham_realtime: 'Trả chậm nhân viên Realtime',\n};\n\ninterface DailyCloudEntry {\n  slot: keyof AppDataState;\n  label: string;\n  rows: any[];\n  rowCount: number;\n  updatedAt: number;\n  updatedByEmail: string;\n  updatedByUid: string;\n}\n\nexport interface DailyCloudSnapshot {\n  dayKey: string;\n  entries: DailyCloudEntry[];\n  appData: Partial<AppDataState>;\n  latestAt: number;\n  latestEntry: DailyCloudEntry | null;\n  viewerUid: string;\n  viewerEmail: string;\n}\n\ntype DailyCloudFetchResult = {\n  status: 'ok' | 'empty' | 'signed-out' | 'offline' | 'permission' | 'error';\n  snapshot: DailyCloudSnapshot | null;\n  message?: string;\n};\n\ntype PendingItem = { id: string; rows: any[] };\ntype PendingState = { dayKey: string; slots: string[]; queuedAt: number; items?: Record<string, PendingItem> };\nlet activeFlush: Promise<DailyCloudFetchResult> | null = null;\nlet retryTimer: number | null = null;\nlet retryDelay = 5000;\n\nexport function getVietnamDayKey(date = new Date()): string {\n  try {\n    const parts = new Intl.DateTimeFormat('en-US', {\n      timeZone: 'Asia/Ho_Chi_Minh',\n      year: 'numeric',\n      month: '2-digit',\n      day: '2-digit',\n    }).formatToParts(date);\n    const get = (type: string) => parts.find(p => p.type === type)?.value || '';\n    const year = get('year'), month = get('month'), day = get('day');\n    if (year && month && day) return `${year}-${month}-${day}`;\n  } catch {}\n  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;\n}\n\nfunction readPending(): PendingState | null {\n  try {\n    const parsed = JSON.parse(localStorage.getItem(PENDING_STORAGE_KEY) || 'null');\n    if (!parsed || typeof parsed.dayKey !== 'string' || !Array.isArray(parsed.slots)) return null;\n    return {\n      dayKey: parsed.dayKey,\n      slots: parsed.slots.filter((s: string) => DAILY_DATA_SLOTS.includes(s as keyof AppDataState)),\n      queuedAt: Number(parsed.queuedAt) || Date.now(),\n      items: parsed.items && typeof parsed.items === 'object' && !Array.isArray(parsed.items) ? parsed.items : {},\n    };\n  } catch { return null; }\n}\n\nfunction writePending(value: PendingState | null) {\n  try {\n    if (!value || !value.slots.length) localStorage.removeItem(PENDING_STORAGE_KEY);\n    else localStorage.setItem(PENDING_STORAGE_KEY, JSON.stringify(value));\n  } catch {}\n}\n\nfunction queueSlots(slots: (keyof AppDataState)[], partial: Partial<AppDataState>) {\n  const dayKey = getVietnamDayKey();\n  const existing = readPending();\n  const sameDay = existing?.dayKey === dayKey;\n  const set = new Set<string>(sameDay ? existing!.slots : []);\n  const items: Record<string, PendingItem> = { ...(sameDay ? existing!.items : {}) };\n  slots.forEach(slot => {\n    set.add(String(slot));\n    items[String(slot)] = {\n      id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,\n      rows: JSON.parse(JSON.stringify(partial[slot])),\n    };\n  });\n  const pending = { dayKey, slots: Array.from(set), queuedAt: Date.now(), items };\n  localStorage.setItem(PENDING_STORAGE_KEY, JSON.stringify(pending));\n}\n\nfunction readLocalAppData(): any {\n  try { return JSON.parse(localStorage.getItem(APP_STORAGE_KEY) || '{}') || {}; }\n  catch { return {}; }\n}\n\nfunction parseCloudRecord(slot: keyof AppDataState, record: any): DailyCloudEntry | null {\n  if (!record || typeof record !== 'object' || typeof record.dataJson !== 'string') return null;\n  try {\n    const rows = JSON.parse(record.dataJson);\n    if (!Array.isArray(rows)) return null;\n    return {\n      slot,\n      label: DAILY_DATA_LABELS[String(slot)] || String(slot),\n      rows,\n      rowCount: Number(record.rowCount) || rows.length,\n      updatedAt: Number(record.updatedAt) || 0,\n      updatedByEmail: String(record.updatedByEmail || ''),\n      updatedByUid: String(record.updatedByUid || ''),\n    };\n  } catch {\n    return null;\n  }\n}\n\nfunction buildSnapshot(raw: any, viewer: any, dayKey = getVietnamDayKey()): DailyCloudSnapshot | null {\n  if (!raw || typeof raw !== 'object') return null;\n  const entries = DAILY_DATA_SLOTS\n    .map(slot => parseCloudRecord(slot, raw[String(slot)]))\n    .filter(Boolean) as DailyCloudEntry[];\n  if (!entries.length) return nul
