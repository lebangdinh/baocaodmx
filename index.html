g bộ mục tiêu…', email: '', signedIn: false, busy: false };\nfunction status(text: string) {\n  state = { ...state, text, email: user?.email || '', signedIn: !!user };\n  window.dispatchEvent(new CustomEvent(STATUS_EVENT));\n}\nfunction apply(value: number) {\n  if (!valid(value)) return;\n  current = value;\n  try { localStorage.setItem(STORAGE_KEY, String(value)); } catch {}\n  window.dispatchEvent(new CustomEvent(EVENT_NAME, { detail: value }));\n}\nfunction persistPending() {\n  try { if (pending) localStorage.setItem(PENDING_KEY, JSON.stringify(pending)); else localStorage.removeItem(PENDING_KEY); } catch {}\n}\nfunction readPending(): PendingItem | null {\n  try {\n    const p = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null');\n    if (!p || typeof p.id !== 'string' || !valid(p.value)) return null;\n    const uid = typeof p.uid === 'string' && p.uid ? p.uid : null;\n    return { id: p.id, uid, value: p.value };\n  } catch { return null; }\n}\nfunction restorePending(uid: string): PendingItem | null {\n  const p = readPending();\n  if (!p) return null;\n  // A change made before Firebase/Auth was available is intentionally unbound.\n  // Bind it only after a real Google account has authenticated.\n  if (p.uid && p.uid !== uid) return null;\n  if (!p.uid) {\n    p.uid = uid;\n    pending = p;\n    persistPending();\n  }\n  return p;\n}\npending = readPending();\nfunction showConnection() {\n  if (!user) return status(pending ? 'Đã lưu trên máy · Có thay đổi chờ đồng bộ sau khi đăng nhập' : 'Chỉ lưu trên máy · Đăng nhập để đồng bộ');\n  if (!connected) return status(pending ? 'Mất kết nối · Có thay đổi chờ gửi' : 'Mất kết nối · Đang dùng giá trị gần nhất');\n  if (!ready) return status('Đang kiểm tra quyền và nhận mục tiêu chung…');\n  if (!permitted) return status('Tài khoản chưa được cấp quyền đồng bộ');\n  status(pending || writing ? 'Đang gửi mục tiêu…' : remoteValue === null ? 'Đã kết nối · Đổi mục tiêu để lưu cấu hình chung' : 'Đã đồng bộ mục tiêu');\n}\nfunction scheduleFlush() { clearTimeout(timer); timer = setTimeout(flush, 350); }\nasync function flush() {\n  if (!user || !remoteRef || !connected || !ready || !permitted || writing || !pending || pending.uid !== user.uid) return;\n  const item = pending, ref = remoteRef, epoch = generation;\n  writing = true; showConnection();\n  try {\n    await ref.set(item.value);\n    if (epoch !== generation) return;\n    if (pending?.id === item.id) { pending = null; persistPending(); }\n    writing = false;\n    if (pending) { apply(pending.value); scheduleFlush(); }\n    else apply(item.value); // Keep the just-confirmed local value; realtime listener will confirm it too.\n    showConnection();\n  } catch (e: any) {\n    if (epoch !== generation) return;\n    writing = false;\n    if (/permission|denied/i.test(String(e?.code || e?.message))) {\n      // Keep the user's latest local change. An authorized account can send it later.\n      permitted = false;\n      persistPending();\n      status('Không có quyền ghi · Thay đổi vẫn được giữ trên máy');\n    } else {\n      status('Chưa gửi được · Giữ thay đổi trên máy, sẽ thử lại');\n      timer = setTimeout(flush, 5000);\n    }\n  }\n}\nexport function getStretchGoalPct(): number { return current; }\nexport function setStretchGoalPct(value: number): void {\n  const n = Number(value);\n  const next = Math.min(MAX_STRETCH_GOAL, Math.max(MIN_STRETCH_GOAL, Number.isFinite(n) ? n : DEFAULT_STRETCH_GOAL));\n  apply(next);\n\n  // Always persist the latest user change as an offline queue item.\n  // This also covers a cold start with no network, before Firebase/Auth can initialize.\n  pending = {\n    id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,\n    uid: user?.uid || null,\n    value: next,\n  };\n  persistPending();\n\n  if (user && permitted) {\n    scheduleFlush();\n    showConnection();\n  } else if (!navigator.onLine) {\n    status('Đã lưu trên máy · Sẽ đồng bộ khi có mạng và đăng nhập');\n  } else if (!user) {\n    status('Đã lưu trên máy · Đăng nhập Google để đồng bộ');\n  } else {\n    status('Đã lưu trên máy · Đang chờ quyền đồng bộ');\n  }\n}\nexport function useStretchGoalPct(): [number, (value: number) => void] {\n  const [value, setValue] = useState(getStretchGoalPct);\n  useEffect(() => {\n    const sync = () => setValue(getStretchGoalPct());\n    window.addEventListener(EVENT_NAME, sync); sync();\n    void startSync();\n    return () => window.removeEventListener(EVENT_NAME, sync);\n  }, []);\n  return [value, setStretchGoalPct];\n}\nexport const stretchGoalStorageKey = STORAGE_KEY;\nwindow.addEventListener('storage', (e: StorageEvent) => {\n  if (e.key === STORAGE_KEY || e.key === null) { current = readLocal(); window.dispatchEvent(new CustomEvent(EVENT_NAME, { detail: current })); }\n  // Another tab owns its own write. Never turn a storage event into a cloud write.\n});\n\nfunction loadScript(src: string): Promise<void> {\n  return new Promise((resolve, reject) => {\n    const script = document.createElement('script');\n    const timeout = setTimeout(() => { script.remove(); reject(new Error('sdk-timeout')); }, 15000);\n    script.src = src; script.async = true;\n    script.onload = () => { clearTimeout(timeout); resolve(); };\n    script.onerror = () => { clearTimeout(timeout); script.remove(); reject(new Error('sdk-network')); };\n    document.head.appendChild(script);\n  });\n}\nasync function startSync(): Promise<void> {\n  if (starting) return starting;\n  starting = (async () => {\n    try {\n      if (!/^https?:$/.test(location.protocol)) { status('Mở website qua HTTPS để đăng nhập · Hiện chỉ lưu trên máy'); return; }\n      const w = window as any;\n      const base = 'https://www.gstatic.com/firebasejs/12.2.1/';\n      if (!w.firebase) await loadScript(base + 'firebase-app-compat.js');\n      if (!w.firebase.auth) await loadScript(base + 'firebase-auth-compat.js');\n      if (!w.firebase.database) await loadScript(base + 'firebase-database-compat.js');\n      const firebase = w.firebase;\n      const app = firebase.apps.find((a: any) => a.name === 'stretch-goal-sync') || firebase.initializeApp(FIREBASE_CONFIG, 'stretch-goal-sync');\n      auth = app.auth(); db = app.database();\n      auth.onAuthStateChanged((nextUser: any) => {\n        generation++; clearTimeout(timer); detach?.(); detach = null;\n        user = nextUser; remoteRef = null; ready = false; permitted = false; writing = false; remoteValue = null; connected = false;\n        window.dispatchEvent(new CustomEvent(FIREBASE_AUTH_EVENT, { detail: { uid: user?.uid || '', email: user?.email || '' } }));\n        pending = user ? restorePending(user.uid) : readPending();\n        if (!user) { showConnection(); return; }\n        if (pending) apply(pending.value);\n        const epoch = generation;\n        const ref = db.ref(CLOUD_PATH); remoteRef = ref;\n        const connection = db.ref('.info/connected');\n        const onConnection = (snap: any) => {\n          if (epoch !== generation) return;\n          connected = snap.val() === true; showConnection(); if (connected) scheduleFlush();\n        };\n        const onValue = (snap: any) => {\n          if (epoch !== generation) return;\n          const v = snap.val();\n          ready = true; permitted = true;\n          if (v !== null && !valid(v)) { permitted = false; status('Cấu hình cloud không hợp lệ · Đang dùng bản trên máy'); return; }\n          remoteValue = v;\n          if (!pending && valid(v)) apply(v);\n          showConnection(); if (pending) scheduleFlush();\n        };\n        ref.on('value', onValue, () => {\n          if (epoch !== generation) return;\n          ready = true; permitted = false;\n          status('Tài khoản chưa được cấp quyền · Chỉ dùng dữ liệu trên máy');\n        });\n        connection.on('value', onConnection);\n        detach = () => { ref.off('value', onValue); connection.off('value', onConnection); };\n        showConnection();\n      });\n    } catch { starting = null; status('Không tải được đồng bộ · Vẫn dùng mục tiêu trên máy'); }\n  })();\n  return starting;\n}\nwindow.addEventListener('online', () => { if (!auth) void startSync(); else { showConnection(); scheduleFlush(); } });\nwindow.addEventListener('offline', () => showConnection());\nexport async function getSharedFirebaseContext(): Promise<{ auth: any; db: any; user: any }> {\n  await startSync();\n  if (!auth || !db) return { auth, db, user: null };\n  if (auth.currentUser || user) return { auth, db, user: auth.currentUser || user };\n\n  // Firebase may need a brief moment to restore the persisted Google session.\n  await new Promise<void>((resolve) => {\n    let done = false;\n    let unsub: any = null;\n    const finish = () => { if (done) return; done = true; try { unsub?.(); } catch {} resolve(); };\n    try { unsub = auth.onAuthStateChanged(() => finish()); } catch { finish(); return; }\n    window.setTimeout(finish, 3500);\n  });\n  return { auth, db, user: auth.currentUser || user };\n}\n\nexport function getCurrentSharedFirebaseUser(): any {\n  return auth?.currentUser || user || null;\n}\n\nexport async function signInStretchGoal() {\n  if (state.busy) return;\n  state = { ...state, busy: true }; status(state.text);\n  try {\n    await startSync(); if (!auth) return;\n    const provider = new (window as any).firebase.auth.GoogleAuthProvider();\n    provider.setCustomParameters({ prompt: 'select_account' });\n    await auth.signInWithPopup(provider);\n  } catch (e: any) {\n    const code = String(e?.code || '');\n    status(code.includes('unauthorized-domain') ? 'Tên miền chưa được thêm trong Firebase Authentication' : code.includes('popup-blocked') ? 'Trình duyệt chặn cửa sổ · Cho phép popup rồi đăng nhập lại' : code.includes('popup-closed') ? 'Đã đóng đăng nhập · Chỉ dùng bản trên máy' : 'Đăng nhập chưa thành công · Vui lòng thử lại');\n  } finally { state = { ...state, busy: false }; window.dispatchEvent(new CustomEvent(STATUS_EVENT)); }\n}\nexport async function signOutStretchGoal() {\n  if (writing) { status('Đang gửi mục tiêu · Chờ vài giây rồi đăng xuất'); return; }\n  // Pending changes stay in localStorage and may be sent after an authorized account signs in again.\n  try { await auth?.signOut(); } catch { status('Chưa đăng xuất được · Vui lòng thử lại'); }\n}\nexport function StretchGoalSyncStatus() {\n  const [s, setS] = useState(state);\n  useEffect(() => { const listener = () => setS({ ...state }); window.addEventListener(STATUS_EVENT, listener); listener(); void startSync(); return () => window.removeEventListener(STATUS_EVENT, listener); }, []);\n  return React.createElement('div', { className: 'flex flex-wrap items-center justify-end gap-2 text-[11px] text-slate-600', 'data-stretch-sync': true },\n    React.createElement('span', { role: 'status', 'aria-live': 'polite' }, s.text),\n    s.email && React.createElement('span', null, s.email),\n    React.createElement('button', { type: 'button', disabled: s.busy, onClick: s.signedIn ? signOutStretchGoal : signInStretchGoal, className: 'px-3 py-1.5 rounded-lg border border-blue-200 bg-white text-blue-700 font-bold' }, s.busy ? 'Đang đăng nhập…' : s.signedIn ? 'Đăng xuất đồng bộ' : 'Đăng nhập Google'),\n    React.createElement('span', { className: 'basis-full text-right text-slate-400' }, 'Google dùng cho đồng bộ mục tiêu % và bàn giao data trong ngày. Thay đổi offline được giữ trên máy và tự gửi khi có mạng + tài khoản được cấp quyền.')\n  );\n}\n\n// Chia Đều là một override cấp siêu thị: khi đã bấm Chia Đều,\n// target nhân viên ưu tiên tỷ lệ đã chia thay vì Stretch Goal chung.\nexport function getPersonnelAllocationPct(storeKey: 'TGDD' | 'TOPZONE'): number | null {\n  try {\n    const raw = localStorage.getItem(PERSONNEL_ALLOCATION_KEY);\n    const map = raw ? JSON.parse(raw) : {};\n    const value = Number(map?.[storeKey]);\n    return Number.isFinite(value) && value >= 100 && value <= MAX_STRETCH_GOAL ? value : null;\n  } catch { return null; }\n}\n\nexport function setPersonnelAllocationPct(storeKey: 'TGDD' | 'TOPZONE', totalPct: number): void {\n  try {\n    const raw = localStorage.getItem(PERSONNEL_ALLOCATION_KEY);\n    const map = raw ? JSON.parse(raw) : {};\n    map[storeKey] = Math.min(MAX_STRETCH_GOAL, Math.max(100, Number(totalPct) || 100));\n    localStorage.setItem(PERSONNEL_ALLOCATION_KEY, JSON.stringify(map));\n  } catch {}\n}\n\nexport function clearPersonnelAllocationPct(storeKey?: 'TGDD' | 'TOPZONE'): void {\n  try {\n    if (!storeKey) { localStorage.removeItem(PERSONNEL_ALLOCATION_KEY); return; }\n    const raw = localStorage.getItem(PERSONNEL_ALLOCATION_KEY);\n    const map = raw ? JSON.parse(raw) : {};\n    delete map[storeKey];\n    localStorage.setItem(PERSONNEL_ALLOCATION_KEY, JSON.stringify(map));\n  } catch {}\n}\n","src/views/DataQualityCenterView.tsx":"import React, { useMemo, useState } from 'react';\nimport { AlertTriangle, CheckCircle2, Database, RefreshCw, Search, ShieldCheck, XCircle } from 'lucide-react';\nimport { AppDataState } from '../types';\n\ninterface Props { appData: AppDataState; onNavigate?: (view: any) => void; }\n\ntype Issue = { severity: 'error'|'warning'|'info'; area: string; message: string; count: number; details?: string[] };\n\nconst CATEGORIES: {key:keyof AppDataState; label:string}[] = [\n  {key:'dt_luyke',label:'DT Lũy kế'}, {key:'dt_realtime',label:'DT Realtime'},\n  {key:'td_luyke',label:'Thi đua LK'}, {key:'td_realtime',label:'Thi đua RT'},\n  {key:'nv_tgdd',label:'NV TGDĐ'}, {key:'nv_tz',label:'NV TopZone'},\n  {key:'dt_nv_luyke',label:'DT NV LK'}, {key:'dt_nv_realtime',label:'DT NV RT'},\n  {key:'tra_cham_luyke',label:'Trả chậm LK'}, {key:'tra_cham_realtime',label:'Trả chậm RT'}\n];\n\nconst str = (v:any) => String(v ?? '').trim();\nconst num = (v:any) => { const n = Number(String(v ?? '').replace(/,/g,'')); return Number.isFinite(n) ? n : 0; };\n// Khóa kiểm tra phải theo đúng loại báo cáo. Ví dụ dữ liệu thi đua có nhiều\n// chương trình trong cùng một siêu thị, nên chỉ dùng MÃ ĐƠN VỊ sẽ báo trùng giả.\nconst recordKey = (category:keyof AppDataState, r:any) => {\n  const store = str(r?.['MÃ ĐƠN VỊ']);\n  const employee = str(r?.['MÃ NV'] ?? r?.['MÃ NHÂN VIÊN'] ?? r?.['TÊN NHÂN VIÊN'] ?? r?.['ĐƠN VỊ / NHÂN VIÊN']);\n  const program = str(r?.['MÃ CHƯƠNG TRÌNH'] ?? r?.['CHƯƠNG TRÌNH']);\n  if (category === 'dt_luyke' || category === 'dt_realtime') return store;\n  if (category === 'td_luyke' || category === 'td_realtime') return store && program ? `${store}|${program}` : '';\n  if (category === 'nv_tgdd' || category === 'nv_tz') return employee && program ? `${employee}|${program}` : '';\n  if (category === 'dt_nv_luyke' || category === 'dt_nv_realtime') return employee;\n  // Báo cáo trả chậm có thể có nhiều giao dịch hợp lệ cho cùng một nhân viên;\n  // chưa có mã giao dịch ổn định nên không suy đoán và không cảnh báo trùng.\n  return '';\n};\n\nexport const DataQualityCenterView: React.FC<Props> = ({ appData }) => {\n  const [refresh, setRefresh] = useState(0);\n  const [filter, setFilter] = useState<'all'|'error'|'warning'>('all');\n  const [search, setSearch] = useState('');\n\n  const report = useMemo(() => {\n    void refresh;\n    const issues: Issue[] = [];\n    let rowsTotal = 0, rowsNonEmpty = 0;\n    const byCategory = CATEGORIES.map(c => ({...c, rows: Array.isArray(appData[c.key]) ? appData[c.key] : []}));\n\n    byCategory.forEach(c => {\n      rowsTotal += c.rows.length;\n      const canCheckIdentity = c.key !== 'tra_cham_luyke' && c.key !== 'tra_cham_realtime';\n      const missingKey = canCheckIdentity ? c.rows.filter((r:any) => !recordKey(c.key, r)) : [];\n      rowsNonEmpty += c.rows.filter((r:any) => Object.values(r || {}).some(v => str(v))).length;\n      if (missingKey.length) issues.push({severity:'warning', area:c.label, message:'Dòng thiếu mã định danh', count:missingKey.length});\n\n      const seen = new Set<string>(), dup = new Set<string>();\n      c.rows.forEach((r:any) => { const k=recordKey(c.key, r); if(k){ if(seen.has(k)) dup.add(k); seen.add(k); }});\n      if (dup.size) issues.push({severity:'warning', area:c.label, message:'Mã bị trùng trong cùng báo cáo', count:dup.size, details:Array.from(dup).slice(0,12)});\n\n      const negative = c.rows.filter((r:any) => Object.entries(r||{}).some(([k,v]) => /(DOANH THU|DT QUY ĐỔI|TARGET|SỐ LƯỢNG)/i.test(k) && num(v)<0));\n      if (negative.length) issues.push({severity:'error', area:c.label, message:'Có giá trị âm ở cột số liệu', count:negative.length});\n\n      const zeroTarget = c.rows.filter((r:any) => /(td_|nv_)/.test(c.key as string) && ('TARGET (TR/SL theo LOẠI TĐ)' in (r||{})) && num(r['TARGET (TR/SL theo LOẠI TĐ'])===0);\n      if (zeroTarget.length) issues.push({severity:'warning', area:c.label, message:'Chương trình có Target bằng 0', count:zeroTarget.length});\n\n      const invalidPct = c.rows.filter((r:any) => Object.entries(r||{}).some(([k,v]) => /%/.test(k) && num(v)>500));\n      if (invalidPct.length) issues.push({severity:'warning', area:c.label, message:'Tỷ lệ % vượt ngưỡng kiểm tra (>500%)', count:invalidPct.length});\n    });\n\n    const populated = byCategory.filter(c => c.rows.length>0).length;\n    if (!populated) issues.push({severity:'info', area:'Toàn phiên', message:'Chưa có dữ liệu để kiểm tra', count:0});\n    return {issues, rowsTotal, rowsNonEmpty, populated, byCategory};\n  }, [appData, refresh]);\n\n  const visibleIssues = report.issues.filter(i => filter==='all' || i.severity===filter).filter(i => !search || `${i.area} ${i.message}`.toLowerCase().includes(search.toLowerCase()));\n  const errors = report.issues.filter(i=>i.severity==='error').reduce((s,i)=>s+i.count,0);\n  const warnings = report.issues.filter(i=>i.severity==='warning').reduce((s,i)=>s+i.count,0);\n  const healthy = report.issues.filter(i=>i.severity!=='error').length===0;\n\n  return <div className=\"space-y-5 dq-page\">\n    <div className=\"flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4\">\n      <div><div className=\"text-[11px] font-black uppercase tracking-[.16em] text-blue-600\">D · DATA QUALITY CENTER</div><h2 className=\"text-2xl md:text-3xl font-black text-slate-950 mt-1\">Kiểm tra sức khỏe dữ liệu</h2><p className=\"text-sm text-slate-500 mt-1\">Quét nhanh các lỗi thường gặp trước khi dùng số liệu để điều hành.</p></div>\n      <button onClick={()=>setRefresh(x=>x+1)} className=\"dq-primary\"><RefreshCw className=\"w-4 h-4\"/> Quét lại dữ liệu</button>\n    </div>\n\n    <div className=\"grid grid-cols-2 xl:grid-cols-4 gap-3\">\n      <Metric title=\"Tổng dòng\" value={report.rowsTotal.toLocaleString('vi-VN')} icon={<Database/>} />\n      <Metric title=\"Category có data\" value={`${report.populated}/10`} icon={<CheckCircle2/>} />\n      <Metric title=\"Lỗi cần xử lý\" value={errors.toLocaleString('vi-VN')} icon={<XCircle/>} danger />\n      <Metric title=\"Cảnh báo\" value={warnings.toLocaleString('vi-VN')} icon={<AlertTriangle/>} warn />\n    </div>\n\n    <div className=\"bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden\">\n      <div className=\"p-4 border-b border-slate-100 flex flex-col lg:flex-row gap-3 lg:items-center lg:justify-between\">\n        <div className=\"flex gap-2 flex-wrap\"><FilterButton active={filter==='all'} onClick={()=>setFilter('all')}>Tất cả</FilterButton><FilterButton active={filter==='error'} onClick={()=>setFilter('error')}>Lỗi</FilterButton><FilterButton active={filter==='warning'} onClick={()=>setFilter('warning')}>Cảnh báo</FilterButton></div>\n        <div className=\"relative w-full lg:w-72\"><Search className=\"absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400\"/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder=\"Tìm cảnh báo...\" className=\"dq-input pl-9\"/></div>\n      </div>\n      <div className=\"divide-y divide-slate-100\">\n        {visibleIssues.length===0 ? <div className=\"p-10 text-center\"><ShieldCheck className=\"w-10 h-10 mx-auto text-emerald-500\"/><div className=\"font-black text-slate-900 mt-2\">Dữ liệu đang sạch theo bộ kiểm tra hiện tại</div><div className=\"text-xs text-slate-500 mt-1\">Không phát hiện lỗi/cảnh báo phù hợp bộ lọc.</div></div> : visibleIssues.map((i,idx)=><div key={idx} className=\"p-4 flex gap-3 items-start\"><IssueIcon severity={i.severity}/><div className=\"min-w-0 flex-1\"><div className=\"flex flex-wrap items-center gap-2\"><b className=\"text-sm text-slate-900\">{i.message}</b><span className=\"dq-chip\">{i.area}</span></div><div className=\"text-xs text-slate-500 mt-1\">Số lượng ảnh hưởng: <b>{i.count.toLocaleString('vi-VN')}</b></div>{i.details?.length ? <div className=\"text-[11px] text-slate-400 mt-2\">Mã mẫu: {i.details.join(', ')}{i.details.length>=12?'…':''}</div>:null}</div></div>)}\n      </div>\n    </div>\n\n    <div className=\"bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden\">\n      <div className=\"p-4 border-b border-slate-100\"><h3 className=\"font-black text-slate-900\">Bản đồ dữ liệu phiên hiện tại</h3><p className=\"text-xs text-slate-500 mt-1\">Theo dõi nhanh category nào đã có dữ liệu và số dòng.</p></div>\n      <div className=\"grid sm:grid-cols-2 lg:grid-cols-5 gap-2 p-4\">{report.byCategory.map(c=><div key={c.key} className={`rounded-2xl border p-3 ${c.rows.length?'bg-emerald-50/60 border-emerald-100':'bg-slate-50 border-slate-200'}`}><div className=\"text-[11px] font-bold text-slate-600\">{c.label}</div><div className=\"text-xl font-black mt-1\">{c.rows.length.toLocaleString('vi-VN')}</div><div className=\"text-[10px] text-slate-400\">dòng dữ liệu</div></div>)}</div>\n    </div>\n  </div>;\n};\n\nconst Metric=({title,value,icon,danger,warn}:{title:string;value:string;icon:React.ReactNode;danger?:boolean;warn?:boolean})=><div className=\"bg-white rounded-3xl border border-slate-200 p-4 shadow-sm\"><div className=\"flex items-center justify-between\"><span className=\"text-[11px] font-bold text-slate-500\">{title}</span><span className={`p-2 rounded-xl ${danger?'bg-rose-50 text-rose-600':warn?'bg-amber-50 text-amber-600':'bg-blue-50 text-blue-600'}`}>{React.cloneElement(icon as React.ReactElement,{className:'w-4 h-4'})}</span></div><div className=\"text-2xl font-black text-slate-950 mt-2\">{value}</div></div>;\nconst FilterButton=({active,onClick,children}:{active:boolean;onClick:()=>void;children:React.ReactNode})=><button onClick={onClick} className={`px-3 py-1.5 rounded-xl text-xs font-black ${active?'bg-slate-900 text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>{children}</button>;\nconst IssueIcon=({severity}:{severity:Issue['severity']})=>severity==='error'?<XCircle className=\"w-5 h-5 text-rose-600 shrink-0\"/>:severity==='warning'?<AlertTriangle className=\"w-5 h-5 text-amber-500 shrink-0\"/>:<CheckCircle2 className=\"w-5 h-5 text-blue-500 shrink-0\"/>;\n","src/components/SortableTable.tsx":"import React, { useState } from 'react';\n\nconst collator = new Intl.Collator('vi', { numeric: true, sensitivity: 'base' });\nconst elements = (children: any): any[] => React.Children.toArray(children).flatMap((child: any) =>\n  React.isValidElement(child) && child.type === React.Fragment ? elements(child.props.children) : [child]\n).filter(React.isValidElement);\n\n// Read React values without changing the DOM or disconnecting row event handlers.\nexport function cellValue(node: any): any {\n  if (node == null || typeof node === 'boolean') return '';\n  if (typeof node === 'string' || typeof node === 'number') return node;\n  if (Array.isArray(node)) { const values = node.map(cellValue).filter(v => v !== ''); return values.length === 1 ? values[0] : values.join(' '); }\n  if (!React.isValidElement(node)) return '';\n  const p: any = node.props;\n  if (p['data-sort-value'] !== undefined) return p['data-sort-value'];\n  if (node.type === 'input' || node.type === 'select') return p.type === 'checkbox' ? Number(!!p.checked) : (p.value ?? p.defaultValue ?? '');\n  if (typeof node.type === 'function' || node.type === 'svg') return '';\n  const value = cellValue(p.children);\n  return value !== '' ? value : (p['aria-label'] || p.title || '');\n}\n\nexport function comparable(value: any): number | string | null {\n  if (typeof value === 'number') return Number.isFinite(value) ? value : null;\n  let s = String(value ?? '').trim().replace(/\\u2212/g, '-').replace(/^✓\\s*/, '');\n  if (!s || /^(?:[-—–]|n\\/a|null)$/i.test(s)) return null;\n  const medals: any = { '🥇': 1, '🥈': 2, '🥉': 3 };\n  if (medals[s]) return medals[s];\n  if (/^(?:✓\\s*)?XONG$/i.test(s)) return 0;\n  const iso = s.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\n  const date = s.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/);\n  if (iso) return Number(iso[1] + iso[2] + iso[3]);\n  if (date) return Number(date[3] + date[2].padStart(2, '0') + date[1].padStart(2, '0'));\n  // A percent may have a secondary actual/target caption below it.\n  const percent = s.match(/^([+-]?[\\d.,\\s]+)\\s*%/);\n  const numeric = s.match(/^([+-]?[\\d.,\\s]+)(?:\\s*(?:TR|TRIỆU|Đ|₫|ĐIỂM|MÔN|MÓN|CÁI|BILL|\\/\\s*NGÀY))?$/i);\n  if (percent || numeric) {\n    let token = (percent || numeric)![1].replace(/\\s/g, '');\n    if (token.includes(',')) token = token.replace(/\\./g, '').replace(',', '.');\n    else if (/^[+-]?\\d{1,3}(?:\\.\\d{3})+$/.test(token)) token = token.replace(/\\./g, '');\n    const n = Number(token);\n    if (Number.isFinite(n)) return n;\n  }\n  return s.replace(/^[✓⚠★🥇🥈🥉\\s]+/u, '');\n}\n\nexport function sortRows(rows: any[], column: number, direction: string): any[] {\n  const movable = rows.filter(row => !row.props['data-sort-fixed'] && !elements(row.props.children).some(c => c.props.colSpan > 1));\n  const sorted = movable.map((row, index) => ({ row, index, value: comparable(cellValue(elements(row.props.children)[column])) }))\n    .sort((a, b) => {\n      // Missing values remain at the bottom in either direction.\n      if (a.value === null || b.value === null) return a.value === b.value ? a.index - b.index : a.value === null ? 1 : -1;\n      const result = typeof a.value === 'number' && typeof b.value === 'number' ? a.value - b.value : collator.compare(String(a.value), String(b.value));\n      return (direction === 'asc' ? result : -result) || a.index - b.index;\n    }).map(x => x.row);\n  let i = 0;\n  return rows.map(row => movable.includes(row) ? sorted[i++] : row);\n}\n\nexport function SortableTable({ children, grid = false, initialSort, rowLimit, ...props }: any) {\n  const parts = elements(children);\n  const head = grid ? parts[0] : parts.find(p => p.type === 'thead');\n  const headerRows = grid ? [head] : elements(head?.props.children);\n  const headers = headerRows.flatMap(r => elements(r?.props.children));\n  const signature = headers.map(h => String(cellValue(h))).join('|');\n  const [sort, setSort] = useState<any>(() => initialSort ? { ...initialSort, signature } : null);\n  const active = sort?.signature === signature ? sort : null;\n  const header = (h: any, index: number) => {\n    const chosen = active?.column === index;\n    const direction = chosen ? active.direction : null;\n    const label = String(cellValue(h));\n    const toggle = () => setSort({ signature, column: index, direction: chosen && direction === 'asc' ? 'desc' : 'asc' });\n    return React.cloneElement(h, {\n      role: grid ? 'columnheader' : undefined,\n      'aria-sort': chosen ? (direction === 'asc' ? 'ascending' : 'descending') : 'none',\n      'data-sort-column': index,\n      className: `${h.props.className || ''} sk-sort-header`,\n      title: `${label}: bấm để sắp xếp ${chosen && direction === 'asc' ? 'giảm dần / Z–A' : 'tăng dần / A–Z'}`,\n      tabIndex: 0,\n      onClick: (e: any) => { e.stopPropagation(); toggle(); },\n      onKeyDown: (e: any) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); toggle(); } },\n      children: <>{h.props.children}<span aria-hidden=\"true\" className=\"sk-sort-indicator\">{direction === 'asc' ? '↑' : direction === 'desc' ? '↓' : '↕'}</span></>\n    });\n  };\n  let column = 0;\n  const newHead = grid ? React.cloneElement(head, {}, headers.map((h, i) => header(h, i))) : head && React.cloneElement(head, {}, headerRows.map(r => React.cloneElement(r, {}, elements(r.props.children).map(h => header(h, column++)))));\n  const body = (part: any) => {\n    let rows = elements(part.props.children);\n    if (active) rows = sortRows(rows, active.column, active.direction);\n    if (rowLimit != null) rows = rows.slice(0, rowLimit);\n    return React.cloneElement(part, {}, rows);\n  };\n  const content = parts.map((p, i) => p === head ? newHead : (grid ? i === 1 : p.type === 'tbody') ? body(p) : p);\n  return grid ? <div {...props} data-sortable=\"grid\">{content}</div> : <table {...props} data-sortable=\"table\">{content}</table>;\n}\n","src/utils/employeeRealtime.ts":"// Only revenue is overlaid. Never mutate imports, competition scores or ranked order.\nexport function applyEmployeeRealtime(employees, cumulativeRows, realtimeRows, enabled) {\n  if (!enabled) return {employees, unmatched: 0};\n  const code = v => String(v ?? '').trim().replace(/\\.0$/, '');\n  const rowId = r => code(r['MÃ NHÂN VIÊN'] || r['Mã NV'] || r['MÃ NV']);\n  const index = rows => {\n    const map = new Map();\n    rows.forEach(r => { const id = rowId(r); if (id) map.set(id, map.has(id) ? null : r); });\n    return map;\n  };\n  const rtMap = index(realtimeRows), lkMap = index(cumulativeRows);\n  const value = (r, keys) => { for (const k of keys) if (r[k] !== undefined && r[k] !== null && r[k] !== '') { const n = Number(r[k]); return Number.isFinite(n) ? n : 0; } return 0; };\n  const next = employees.map(emp => {\n    const id = code(emp.id), rt = rtMap.get(id);\n    let status = 'missing';\n    if ((rtMap.has(id) && !rt) || (lkMap.has(id) && !lkMap.get(id))) status = 'ambiguous';\n    else if (rt && !lkMap.has(id)) status = 'no_lk';\n    else if (rt && lkMap.get(id)) status = 'ok';\n    if (status !== 'ok') return {...emp, revenueRealtime: {status}};\n    const dt = value(rt, ['DOANH THU (TR)', 'DOANH THU', 'DT']);\n    const qd = value(rt, ['DOANH THU QĐ (TR)', 'DT QUY ĐỔI (TR)', 'DTQĐ']);\n    return {...emp, totalDt: emp.totalDt + dt, totalDtQd: emp.totalDtQd + qd,\n      revenueRealtime: {status, lkDt: emp.totalDt, lkQd: emp.totalDtQd, dt, qd}};\n  });\n  // Check the complete imports, independently of store/personnel/search filters.\n  // Duplicate or missing IDs cannot be matched safely; hidden employees are valid.\n  const unmatched = realtimeRows.filter(r => {\n    const id = rowId(r);\n    return !id || !lkMap.get(id) || !rtMap.get(id);\n  }).length;\n  return {employees: next, unmatched};\n}\n","src/utils/employeeProgramStatus.ts":"// Presentation only: forecast thresholds do not alter KPI or ranking.\nexport function employeeProgramStatus(p) {\n  if (p.hasActualData === false || p.target == null || String(p.target).trim() === '' || !(Number(p.target) > 0) || !Number.isFinite(Number(p.target)) || p.thuc == null || String(p.thuc).trim() === '' || !Number.isFinite(Number(p.thuc)) || p.pctDu == null || String(p.pctDu).trim() === '' || !Number.isFinite(Number(p.pctDu))) return 'unknown';\n  return Number(p.pctDu) < 80 ? 'weak' : Number(p.pctDu) < 100 ? 'watch' : 'good';\n}\n","src/utils/programCounts.ts":"import { CompetitionRow } from '../types';\n\nconst normalize = (value: any) => String(value ?? '').normalize('NFC').trim().replace(/\\s+/g, ' ').toLocaleLowerCase('vi');\n\nexport function programStore(row: CompetitionRow): string {\n  const code = normalize(row['MÃ ĐƠN VỊ']);\n  const name = normalize(row['TÊN ĐƠN VỊ'] || row['ĐƠN VỊ / NHÂN VIÊN']);\n  if (code === '933' || /tgd/.test(name)) return 'TGDD';\n  if (code === '10341' || /aar|topzone/.test(name)) return 'TOPZONE';\n  return code;\n}\n\n// Count only cumulative programs with a positive assigned target; never realtime rows.\n// The same program in two stores is counted once for each store.\nexport function countPrograms(rows: CompetitionRow[] = [], store?: 'TGDD' | 'TOPZONE'): number {\n  const selected = rows.filter(row => {\n    const target = Number(row['TARGET (TR/SL theo LOẠI TĐ)']);\n    return (!store || programStore(row) === store) && Number.isFinite(target) && target > 0;\n  });\n  const codesByName = new Map<string, Set<string>>();\n  for (const row of selected) {\n    const name = normalize(row['CHƯƠNG TRÌNH']), code = normalize(row['MÃ CHƯƠNG TRÌNH']);\n    const key = JSON.stringify([programStore(row), name]);\n    if (name && code) {\n      if (!codesByName.has(key)) codesByName.set(key, new Set());\n      codesByName.get(key)!.add(code);\n    }\n  }\n  const keys = new Set<string>();\n  for (const row of selected) {\n    const shop = programStore(row), name = normalize(row['CHƯƠNG TRÌNH']);\n    let code = normalize(row['MÃ CHƯƠNG TRÌNH']);\n    if (!code && !name) continue;\n    const known = codesByName.get(JSON.stringify([shop, name]));\n    if (!code && known?.size === 1) code = [...known][0];\n    keys.add(JSON.stringify([shop, code ? 'code' : 'name', code || name]));\n  }\n  return keys.size;\n}\n","src/components/EmployeeProgress.tsx":"import React from 'react';\n\nexport function summarizeProgress(programs: any[] = [], total = 0) {\n  const counts = { done: 0, forecast: 0, behind: 0, unknown: 0 };\n  for (const p of programs) {\n    if (!(Number(p.target) > 0)) continue;\n    const valid = (v: any) => v != null && String(v).trim() !== '' && Number.isFinite(Number(v));\n    if (p.hasActualData === false || !valid(p.pctLk)) counts.unknown++;\n    else if (Number(p.pctLk) >= 100) counts.done++;\n    else if (!valid(p.pctDu)) counts.unknown++;\n    else if (Number(p.pctDu) >= 100) counts.forecast++;\n    else counts.behind++;\n  }\n  const known = Object.values(counts).reduce((a, b) => a + b, 0);\n  counts.unknown += Math.max(0, total - known);\n  return { ...counts, total: Math.max(total, known) };\n}\n\nexport function EmployeeProgress({ summary }: { summary: ReturnType<typeof summarizeProgress> }) {\n  const parts = [\n    { count: summary.done, label: 'Đã đạt', color: '#10b981' },\n    { count: summary.forecast, label: 'Dự kiến đạt', color: '#f59e0b' },\n    { count: summary.behind, label: 'Cần tăng tốc', color: '#f43f5e' },\n    { count: summary.unknown, label: 'Chưa đủ dữ liệu', color: '#94a3b8' },\n  ];\n  return <div className=\"min-w-0 w-full\" title=\"Theo lũy kế: Đã đạt ≥100%; Dự kiến đạt: chưa đạt nhưng dự báo ≥100%; Cần tăng tốc: dự báo <100%.\">\n    <div className=\"flex justify-between gap-2 mb-2 text-[10px] font-bold text-slate-500\">\n      <span>TIẾN ĐỘ MÔN THI ĐUA</span><span>{summary.total} môn có target</span>\n    </div>\n    {summary.total ? <>\n      <div data-export-preserve-layout=\"true\" className=\"flex h-2.5 w-full overflow-hidden rounded-full bg-slate-200\" role=\"img\" aria-label={parts.map(p => `${p.label}: ${p.count}`).join(', ')}>\n        {parts.filter(p => p.count > 0).map(p => <span key={p.label} style={{ width: `${p.count / summary.total * 100}%`, backgroundColor: p.color }} title={`${p.label}: ${p.count} môn`} />)}\n      </div>\n      <div className=\"flex flex-wrap gap-x-3 gap-y-1 mt-2 text-[10px] font-semibold text-slate-600\">\n        {parts.filter((p,i) => i < 3 || p.count > 0).map(p => <span key={p.label} className=\"inline-flex items-center gap-1\"><i className=\"w-1.5 h-1.5 rounded-full\" style={{backgroundColor:p.color}} /><b>{p.count}</b> {p.label}</span>)}\n      </div>\n    </> : <p className=\"text-xs text-slate-400\">Chưa có môn lũy kế được giao target</p>}\n  </div>;\n}\n","src/utils/traChamShop.ts":"// Resolve shop for display only; never change imported repayment data.\nconst normalize = (value: any) => String(value ?? '').normalize('NFC').trim().replace(/\\s+/g, ' ').toLocaleLowerCase('vi');\n\nexport function normalizeTraChamName(value: any): string {\n  return normalize(value).replace(/^\\d+\\s*[-–—_]\\s*/, '');\n}\n\nexport function explicitShop(row: any): string | null {\n  const code = String(row['MÃ ĐƠN VỊ'] ?? row['MÃ SIÊU THỊ'] ?? '').trim();\n  if (code === '933') return 'TGDD';\n  if (code === '10341') return 'TOPZONE';\n  const label = normalize(row['SIÊU THỊ'] || row['TÊN ĐƠN VỊ'] || row['SHOP']);\n  if (/topzone|aar/.test(label)) return 'TOPZONE';\n  if (/tgd|tgđ|tgdd|thế giới di động/.test(label)) return 'TGDD';\n  return null;\n}\n\nfunction identity(row: any) {\n  const raw = normalize(row['NHÂN VIÊN'] || row['TÊN NHÂN VIÊN'] || row['ĐƠN VỊ / NHÂN VIÊN']);\n  const prefix = raw.match(/^(\\d+)\\s*[-–—_]\\s*/);\n  const id = String(row['MÃ NHÂN VIÊN'] || row['MÃ NV'] || prefix?.[1] || '').trim().replace(/\\.0$/, '');\n  return { id, name: normalizeTraChamName(raw) };\n}\n\nexport function buildTraChamShopResolver(data: any, personnel: any = {}) {\n  const ids = new Map<string, Set<string>>(), names = new Map<string, Set<string>>();\n  const roster = new Map<string, Set<string>>();\n  const add = (map: Map<string, Set<string>>, key: string, shop: string) => {\n    if (!key) return;\n    if (!map.has(key)) map.set(key, new Set());\n    map.get(key)!.add(shop);\n  };\n\n  // Tùy Biến KPI Nhân Sự là nguồn xác định shop ưu tiên cao nhất.\n  // Một nhân viên có thể phát sinh giao dịch/thi đua ở shop khác, nên không dùng\n  // dữ liệu bán hàng chéo để ghi đè shop đã được cấu hình thủ công.\n  for (const shop of ['TGDD', 'TOPZONE']) {\n    for (const name of Object.keys(personnel[shop] || {})) add(roster, normalizeTraChamName(name), shop);\n  }\n\n  // Các nguồn dữ liệu khác chỉ dùng làm phương án dự phòng cho nhân sự chưa có trong cấu hình KPI.\n  for (const [slot, fallback] of [['dt_nv_luyke', null], ['dt_nv_realtime', null], ['nv_tgdd', 'TGDD'], ['nv_tz', 'TOPZONE']] as const) {\n    for (const row of data[slot] || []) {\n      const shop = explicitShop(row) || fallback;\n      if (!shop) continue;\n      const { id, name } = identity(row);\n      add(ids, id, shop); add(names, name, shop);\n    }\n  }\n\n  const unique = (shops: Set<string>) => shops.size === 1 ? [...shops][0] : null;\n  return (row: any): string | null => {\n    const { id, name } = identity(row);\n\n    // Ưu tiên tuyệt đối danh sách đã cấu hình trong Tùy Biến KPI Nhân Sự.\n    if (name && roster.has(name)) return unique(roster.get(name)!);\n\n    // Sau đó mới dùng shop có sẵn trong dòng dữ liệu và các nguồn suy luận khác.\n    const explicit = explicitShop(row);\n    if (explicit) return explicit;\n    if (id && ids.has(id)) return unique(ids.get(id)!);\n    if (names.has(name)) return unique(names.get(name)!);\n    return null;\n  };\n}\n","src/utils/dailyCloudHandoff.ts":"import { AppDataState } from '../types';\nimport { FIREBASE_AUTH_EVENT, getSharedFirebaseContext } from './stretchGoal';\n\nexport const DAILY_CLOUD_ROOT = 'dailyData';\nconst APP_STORAGE_KEY = 'skst_app_data_v7';\nconst PENDING_STORAGE_KEY = 'skst_daily_cloud_pending_v1';\n\nexport const DAILY_DATA_SLOTS: (keyof AppDataState)[] = [\n  'dt_luyke',\n  'dt_realtime',\n  'td_luyke',\n  'td_realtime',\n  'nv_tgdd',\n  'nv_tz',\n  'dt_nv_luyke',\n  'dt_nv_realtime',\n  'tra_cham_luyke',\n  'tra_cham_realtime',\n];\n\nexport const DAILY_DATA_LABELS: Record<string, string> = {\n  dt_luyke: 'Doanh thu siêu thị lũy kế',\n  dt_realtime: 'Doanh thu siêu thị Realtime',\n  td_luyke: 'Thi đua siêu thị lũy kế',\n  td_realtime: 'Thi đua siêu thị Realtime',\n  nv_tgdd: 'Thi đua nhân viên TGDĐ',\n  nv_tz: 'Thi đua nhân viên TopZone',\n  dt_nv_luyke: 'Doanh thu nhân viên lũy kế',\n  dt_nv_realtime: 'Doanh thu nhân viên Realtime',\n  tra_cham_luyke: 'Trả chậm nhân viên lũy kế',\n  tra_cham_realtime: 'Trả chậm nhân viên Realtime',\n};\n\nexport interface DailyCloudEntry {\n  slot: keyof AppDataState;\n  label: string;\n  rows: any[];\n  rowCount: number;\n  updatedAt: number;\n  updatedByEmail: string;\n  updatedByUid: string;\n}\n\nexport interface DailyCloudSnapshot {\n  dayKey: string;\n  entries: DailyCloudEntry[];\n  appData: Partial<AppDataState>;\n  latestAt: number;\n  latestEntry: DailyCloudEntry | null;\n  viewerUid: string;\n  viewerEmail: string;\n}\n\nexport type DailyCloudFetchResult = {\n  status: 'ok' | 'empty' | 'signed-out' | 'offline' | 'permission' | 'error';\n  snapshot: DailyCloudSnapshot | null;\n  message?: string;\n};\n\ntype PendingState = { dayKey: string; slots: string[]; queuedAt: number };\n\nconst memoryLatest: Record<string, any[]> = {};\n\nexport function getVietnamDayKey(date = new Date()): string {\n  try {\n    const parts = new Intl.DateTimeFormat('en-US', {\n      timeZone: 'Asia/Ho_Chi_Minh',\n      year: 'numeric',\n      month: '2-digit',\n      day: '2-digit',\n    }).formatToParts(date);\n    const get = (type: string) => parts.find(p => p.type === type)?.value || '';\n    const year = get('year'), month = get('month'), day = get('day');\n    if (year && month && day) return `${year}-${month}-${day}`;\n  } catch {}\n  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;\n}\n\nfunction readPending(): PendingState | null {\n  try {\n    const parsed = JSON.parse(localStorage.getItem(PENDING_STORAGE_KEY) || 'null');\n    if (!parsed || typeof parsed.dayKey !== 'string' || !Array.isArray(parsed.slots)) return null;\n    return {\n      dayKey: parsed.dayKey,\n      slots: parsed.slots.filter((s: string) => DAILY_DATA_SLOTS.includes(s as keyof AppDataState)),\n      queuedAt: Number(parsed.queuedAt) || Date.now(),\n    };\n  } catch { return null; }\n}\n\nfunction writePending(value: PendingState | null) {\n  try {\n    if (!value || !value.slots.length) localStorage.removeItem(PENDING_STORAGE_KEY);\n    else localStorage.setItem(PENDING_STORAGE_KEY, JSON.stringify(value));\n  } catch {}\n}\n\nfunction queueSlots(slots: (keyof AppDataState)[]) {\n  if (!slots.length) return;\n  const dayKey = getVietnamDayKey();\n  const existing = readPending();\n  const set = new Set<string>(existing?.dayKey === dayKey ? existing.slots : []);\n  slots.forEach(slot => set.add(String(slot)));\n  writePending({ dayKey, slots: Array.from(set), queuedAt: Date.now() });\n}\n\nfunction readLocalAppData(): any {\n  try { return JSON.parse(localStorage.getItem(APP_STORAGE_KEY) || '{}') || {}; }\n  catch { return {}; }\n}\n\nfunction parseCloudRecord(slot: keyof AppDataState, record: any): DailyCloudEntry | null {\n  if (!record || typeof record !== 'object' || typeof record.dataJson !== 'string') return null;\n  try {\n    const rows = JSON.parse(record.dataJson);\n    if (!Array.isArray(rows)) return null;\n    return {\n      slot,\n      label: DAILY_DATA_LABELS[String(slot)] || String(slot),\n      rows,\n      rowCount: Number(record.rowCount) || rows.length,\n      updatedAt: Number(record.updatedAt) || 0,\n      updatedByEmail: String(record.updatedByEmail || ''),\n      updatedByUid: String(record.updatedByUid || ''),\n    };\n  } catch {\n    return null;\n  }\n}\n\nfunction buildSnapshot(raw: any, viewer: any): DailyCloudSnapshot | null {\n  if (!raw || typeof raw !== 'object') return null;\n  const entries = DAILY_DATA_SLOTS\n    .map(slot => parseCloudRecord(slot, raw[String(slot)]))\n    .filter(Boolean) as DailyCloudEntry[];\n  if (!entries.length) return null;\n  entries.sort((a, b) => b.updatedAt - a.updatedAt);\n\n  const appData: Partial<AppDataState> = {};\n  for (const entry of entries) (appData as any)[entry.slot] = entry.rows;\n\n  return {\n    dayKey: getVietnamDayKey(),\n    entries,\n    appData,\n    latestAt: entries[0]?.updatedAt || 0,\n    latestEntry: entries[0] || null,\n    viewerUid: String(viewer?.uid || ''),\n    viewerEmail: String(viewer?.email || ''),\n  };\n}\n\nexport async function flushPendingDailyData(): Promise<DailyCloudFetchResult> {\n  const pending = readPending();\n  if (!pending?.slots?.length) return { status: 'empty', snapshot: null };\n  const today = getVietnamDayKey();\n\n  // Never push yesterday's queued data into a new day.\n  if (pending.dayKey !== today) {\n    writePending(null);\n    return { status: 'empty', snapshot: null };\n  }\n  if (!navigator.onLine) return { status: 'offline', snapshot: null };\n\n  const ctx = await getSharedFirebaseContext();\n  if (!ctx?.user || !ctx?.db) return { status: 'signed-out', snapshot: null };\n\n  const localData = readLocalAppData();\n  const updates: Record<string, any> = {};\n  const sentSlots: string[] = [];\n  const serverTimestamp = (window as any).firebase?.database?.ServerValue?.TIMESTAMP || Date.now();\n\n  for (const slotName of pending.slots) {\n    const rows = memoryLatest[slotName] ?? localData?.[slotName];\n    if (!Array.isArray(rows)) continue;\n    updates[slotName] = {\n      dataJson: JSON.stringify(rows),\n      rowCount: rows.length,\n      updatedAt: serverTimestamp,\n      updatedByEmail: String(ctx.user.email || ''),\n      updatedByUid: String(ctx.user.uid || ''),\n    };\n    sentSlots.push(slotName);\n  }\n\n  if (!sentSlots.length) {\n    writePending(null);\n    return { status: 'empty', snapshot: null };\n  }\n\n  try {\n    await ctx.db.ref(`${DAILY_CLOUD_ROOT}/${today}`).update(updates);\n    const remaining = pending.slots.filter(s => !sentSlots.includes(s));\n    writePending(remaining.length ? { ...pending, slots: remaining } : null);\n    sentSlots.forEach(s => { delete memoryLatest[s]; });\n    return { status: 'ok', snapshot: null };\n  } catch (e: any) {\n    const message = String(e?.code || e?.message || e || '');\n    if (/permission|denied/i.test(message)) return { status: 'permission', snapshot: null, message };\n    return { status: 'error', snapshot: null, message };\n  }\n}\n\nexport async function syncDailyDataSlots(partial: Partial<AppDataState>): Promise<DailyCloudFetchResult> {\n  const slots = DAILY_DATA_SLOTS.filter(slot => Array.isArray((partial as any)?.[slot]) && (partial as any)[slot].length > 0);\n  if (!slots.length) return { status: 'empty', snapshot: null };\n  for (const slot of slots) memoryLatest[String(slot)] = (partial as any)[slot];\n  queueSlots(slots);\n  return flushPendingDailyData();\n}\n\nexport async function fetchTodayCloudSnapshot(): Promise<DailyCloudFetchResult> {\n  if (!navigator.onLine) return { status: 'offline', snapshot: null };\n  const ctx = await getSharedFirebaseContext();\n  if (!ctx?.user || !ctx?.db) return { status: 'signed-out', snapshot: null };\n  try {\n    const snap = await ctx.db.ref(`${DAILY_CLOUD_ROOT}/${getVietnamDayKey()}`).once('value');\n    const snapshot = buildSnapshot(snap.val(), ctx.user);\n    return snapshot ? { status: 'ok', snapshot } : { status: 'empty', snapshot: null };\n  } catch (e: any) {\n    const message = String(e?.code || e?.message || e || '');\n    if (/permission|denied/i.test(message)) return { status: 'permission', snapshot: null, message };\n    return { status: 'error', snapshot: null, message };\n  }\n}\n\nexport function subscribeTodayCloudSnapshot(\n  onSnapshot: (snapshot: DailyCloudSnapshot | null) => void,\n  onError?: (message: string) => void,\n): () => void {\n  let disposed = false;\n  let ref: any = null;\n  let handler: any = null;\n\n  const detach = () => {\n    if (ref && handler) {\n      try { ref.off('value', handler); } catch {}\n    }\n    ref = null;\n    handler = null;\n  };\n\n  const attach = async () => {\n    detach();\n    if (disposed || !navigator.onLine) return;\n    try {\n      const ctx = await getSharedFirebaseContext();\n      if (disposed || !ctx?.user || !ctx?.db) return;\n      const viewer = ctx.user;\n      ref = ctx.db.ref(`${DAILY_CLOUD_ROOT}/${getVietnamDayKey()}`);\n      handler = (snap: any) => {\n        if (disposed) return;\n        onSnapshot(buildSnapshot(snap.val(), viewer));\n      };\n      ref.on('value', handler, (err: any) => {\n        if (disposed) return;\n        onError?.(String(err?.code || err?.message || err || 'permission-denied'));\n      });\n      void flushPendingDailyData();\n    } catch (e: any) {\n      onError?.(String(e?.code || e?.message || e || 'cloud-error'));\n    }\n  };\n\n  const authListener = () => { void attach(); };\n  const onlineListener = () => { void attach(); };\n  const offlineListener = () => detach();\n\n  window.addEventListener(FIREBASE_AUTH_EVENT, authListener);\n  window.addEventListener('online', onlineListener);\n  window.addEventListener('offline', offlineListener);\n  void attach();\n\n  return () => {\n    disposed = true;\n    detach();\n    window.removeEventListener(FIREBASE_AUTH_EVENT, authListener);\n    window.removeEventListener('online', onlineListener);\n    window.removeEventListener('offline', offlineListener);\n  };\n}\n"}</script>
<script>
  (function () {
    'use strict';
    const files = JSON.parse(document.getElementById('embedded-source').textContent);
    const modules = Object.create(null);
    const cache = Object.create(null);

    function stripQuery(p) { return p.split('?')[0].split('#')[0]; }
    function normalizePath(p) {
      const parts=[];
      for (const x of p.split('/')) {
        if (!x || x==='.') continue;
        if (x==='..') parts.pop(); else parts.push(x);
      }
      return parts.join('/');
    }
    function resolve(from, req) {
      req=stripQuery(req);
      if (req==='react') return '@@react';
      if (req==='react-dom/client') return '@@react-dom-client';
      if (req==='lucide-react') return '@@lucide-react';
      if (req==='xlsx') return '@@xlsx';
      if (req==='chart.js') return '@@chart';
      if (req==='html-to-image') return '@@html-to-image';
      if (req==='html2canvas-pro') return '@@html2canvas-pro';
      if (req.endsWith('.css')) return '@@empty';
      if (req.startsWith('/')) req=req.slice(1);
      else req=normalizePath(from.split('/').slice(0,-1).concat(req).join('/'));
      if (files[req]) return req;
      for (const ext of ['.ts','.tsx','.js']) if (files[req+ext]) return req+ext;
      if (files[req+'/index.ts']) return req+'/index.ts';
      if (files[req+'/index.tsx']) return req+'/index.tsx';
      throw new Error('Không tìm thấy module: '+req+' (từ '+from+')');
    }

    const externals = {
      '@@react': () => window.React,
      '@@react-dom-client': () => window.ReactDOM,
      // The standalone build intentionally does not depend on lucide-react.
      // Return lightweight React icon components for every requested icon name.
      // This avoids UMD/React-version incompatibilities when opening index.html directly.
      '@@lucide-react': () => {
        const iconMap = {
          Camera:'📷', Sparkles:'✨', Save:'💾', CheckCircle2:'✓', CheckCircle:'✓', Menu:'☰',
          Settings:'⚙', Settings2:'⚙', Bot:'🤖', History:'↶', Loader2:'◌', Images:'▧', Trash2:'🗑',
          X:'×', Download:'↓', Copy:'⧉', Check:'✓', ExternalLink:'↗', Image:'▧', ImageIcon:'▧',
          RefreshCw:'↻', Palette:'🎨', Crosshair:'⌖', Eye:'◉', EyeOff:'⊘', Search:'⌕', BarChart3:'▥',
          Table:'▤', Table2:'▤', Trophy:'🏆', ArrowRightLeft:'↔', ArrowRight:'→', ArrowUp:'↑', ArrowDown:'↓',
          AlertCircle:'⚠', AlertTriangle:'⚠', Clock:'◷', Plus:'+', RotateCcw:'↺', ShieldCheck:'✓',
          UserCheck:'✓', Users:'👥', Users2:'👥', TrendingUp:'↗', Calendar:'□', CalendarDays:'□',
          Clipboard:'📋', CreditCard:'▣', Database:'▤', FileCheck2:'✓', FileSpreadsheet:'▤', FileText:'▤',
          Layers:'▱', LayoutDashboard:'▦', Scissors:'✂', Store:'⌂', Target:'◎', Upload:'↑',
          UploadCloud:'☁↑', WalletCards:'▣', Zap:'⚡', ChevronRight:'›'
        };
        return new Proxy({}, { get: (_, name) => function StandaloneIcon(props) {
          const { size=18, strokeWidth, className='', style, ...rest } = props || {};
          return React.createElement('span', {
            ...rest,
            className: ('inline-flex items-center justify-center leading-none ' + className).trim(),
            style: { fontSize: typeof size === 'number' ? size : undefined, width: size, height: size, ...style },
            'aria-hidden': 'true'
          }, iconMap[name] || '•');
        }});
      },
      '@@xlsx': () => window.XLSX,
      '@@chart': () => ({ Chart: window.Chart, registerables: [] }),
      '@@html-to-image': () => window.htmlToImage,
      '@@html2canvas-pro': () => window.html2canvasPro || window.html2canvas || window.html2Canvas,
      '@@empty': () => ({})
    };

    function makeModule(id) {
      if (modules[id]) return modules[id];
      if (externals[id]) {
        const value=externals[id]();
        modules[id]={exports:value};
        return modules[id];
      }
      const mod={exports:{}};
      modules[id]=mod;
      let code=files[id];
      if (id.endsWith('.css')) return mod;
      // CSS imports are handled by the embedded stylesheet above.
      code=code.replace(/^\s*import\s+['"]\.\/[^'"]+\.css['"];?\s*$/gm,'');
      let out;
      try {
        out=Babel.transform(code, {
          filename:id,
          presets:[['typescript',{allExtensions:true,isTSX:id.endsWith('.tsx')}],'react'],
          plugins:['transform-modules-commonjs'],
          sourceType:'module'
        }).code;
      } catch(e) {
        console.error('Compile error in',id,e);
        throw e;
      }
      const localRequire=(req)=>requireModule(resolve(id,req));
      try {
        const fn=new Function('require','module','exports','__filename','__dirname',out);
        fn(localRequire,mod,mod.exports,id,id.substring(0,id.lastIndexOf('/')));
      } catch(e) {
        console.error('Runtime error in',id,e);
        throw e;
      }
      return mod;
    }
    function requireModule(id) {
      if (cache[id]) return cache[id].exports;
      const m=makeModule(id);
      cache[id]=m;
      return m.exports;
    }

    window.addEventListener('error', function(e) {
      console.error(e.error || e.message);
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error(e.reason);
    });

    // Start the original React app from the embedded source tree.
    requireModule('src/main.tsx');
  })();
  </script>
