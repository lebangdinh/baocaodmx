?: number | string;\n  'TARGET (TR/SL theo LOẠI TĐ)'?: number | string;\n  'DOANH THU (TR)'?: number | string;\n  'DT QUY ĐỔI (TR)'?: number | string;\n  'SỐ LƯỢNG'?: number | string;\n  '% HT THÁNG'?: number | string;\n  '% DỰ BÁO'?: number | string;\n  'MÃ NV'?: string | number;\n  'HẠNG VÙNG'?: string | number;\n  [key: string]: any;\n}\n\nexport interface EmployeeRevenueRow {\n  'MÃ NHÂN VIÊN'?: string | number;\n  'TÊN NHÂN VIÊN'?: string;\n  'SIÊU THỊ'?: string;\n  'DOANH THU (TR)'?: number | string;\n  'DOANH THU QĐ (TR)'?: number | string;\n  'DT TRẢ GÓP (TR)'?: number | string;\n  '% TRẢ GÓP'?: number | string;\n  'SỐ LƯỢNG'?: number | string;\n  'SỐ NGÀY CỬA SỔ'?: number | string;\n  [key: string]: any;\n}\n\nexport interface AppDataState {\n  dt_luyke: StoreRevenueRow[];\n  dt_realtime: StoreRevenueRow[];\n  td_luyke: CompetitionRow[];\n  td_realtime: CompetitionRow[];\n  nv_tgdd: CompetitionRow[];\n  nv_tz: CompetitionRow[];\n  dt_nv_luyke: EmployeeRevenueRow[];\n  dt_nv_realtime: EmployeeRevenueRow[];\n  tra_cham_luyke: any[];\n  tra_cham_realtime: any[];\n}\n\nexport interface EmployeeProgramDetail {\n  code: string | number;\n  name: string;\n  displayName: string;\n  thuc: number;\n  dtQd: number;\n  target: number;\n  pctLk: number;\n  pctDu: number;\n  hasActualData?: boolean;\n  loai: number;\n  hangVung: string;\n}\n\nexport interface AggregatedEmployee {\n  name: string;\n  id: string;\n  store: 'TGDĐ' | 'TopZone';\n  department: string;\n  isOfficial: boolean;\n  isVisible: boolean;\n  targetSharePct: number;\n  revenueTarget?: number;\n  revenueRealtime?: {status: string; lkDt?: number; lkQd?: number; dt?: number; qd?: number};\n  totalDt: number;\n  totalDtQd: number;\n  totalTragop: number;\n  totalBill: number;\n  pctTragop: number;\n  pctDukien: number;\n  completedCount: number;\n  pctDongGop: number;\n  dtDiem: number;\n  hieuQuaQd: number;\n  hqDiem: number;\n  diemKpi: number;\n  programs: EmployeeProgramDetail[];\n}\n\nexport interface PersonnelConfigMap {\n  [storeKey: string]: {\n    [empName: string]: {\n      isOfficial?: boolean;\n      isVisible?: boolean;\n      targetPct?: number;\n    };\n  };\n}\n\nexport interface ScreenshotItem {\n  name: string;\n  url: string;\n  time: string;\n}\n\nexport enum ViewType {\n  DASHBOARD = 'dashboard',\n  BAO_CAO_CUOI_NGAY = 'bao-cao-cuoi-ngay',\n  THI_DUA_ST = 'thi-dua-st',\n  SUC_KHOE_CUM = 'suc-khoe-cum',\n  DOANH_THU_ST = 'doanh-thu-st',\n  SUC_KHOE_NV = 'suc-khoe-nv',\n  TRA_CHAM = 'tra-cham',\n  SO_SANH = 'so-sanh',\n  DU_BAO = 'du-bao',\n  KPI_CUSTOM = 'cai-dat',\n  DATA_QUALITY = 'data-quality',\n  THEO_DOI_NGAY = 'theo-doi-ngay',\n}\n","src/utils/excelParser.ts":"import * as XLSX from 'xlsx';\nimport { AppDataState } from '../types';\nimport { detectCategoryFromParsedData } from './smartDataParser';\n\nexport const CATEGORY_TITLES: Record<keyof AppDataState, string> = {\n  dt_luyke: 'Doanh Thu Luỹ Kế Siêu Thị',\n  dt_realtime: 'Doanh Thu Realtime Siêu Thị',\n  td_luyke: 'Thi Đua Luỹ Kế Siêu Thị',\n  td_realtime: 'Thi Đua Realtime Siêu Thị',\n  nv_tgdd: 'Thi Đua Nhân Viên TGDĐ',\n  nv_tz: 'Thi Đua Nhân Viên TopZone',\n  dt_nv_luyke: 'Doanh Thu Nhân Viên Luỹ Kế',\n  dt_nv_realtime: 'Doanh Thu Nhân Viên Realtime',\n  tra_cham_luyke: 'Trả Chậm — Lũy Kế',\n  tra_cham_realtime: 'Trả Chậm — Realtime',\n};\n\nexport function detectFileCategoryFromData(filename: string, rows: any[]): keyof AppDataState | null {\n  const fn = filename.toLowerCase();\n  const firstRow = rows[0] || {};\n  const secondRow = rows[1] || {};\n  \n  // Combine columns from first two rows in case headers are merged or shifted\n  const allColKeys = [...Object.keys(firstRow), ...Object.keys(secondRow)];\n  const cols = Array.from(new Set(allColKeys.map(c => c.trim().toUpperCase())));\n  const normalizedCols = cols.map(c => c.normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/đ/gi,'d'));\n  const hasCol = (...names: string[]) => names.some(n => cols.includes(n) || normalizedCols.includes(n.normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/đ/gi,'d')));\n\n  // Check DT Nhân Viên (MÃ NHÂN VIÊN, TÊN NHÂN VIÊN, DT OFFLINE...)\n  if (\n    (hasCol('TÊN NHÂN VIÊN') || hasCol('MÃ NHÂN VIÊN')) &&\n    (cols.includes('DT OFFLINE (TR)') || cols.includes('DOANH THU QĐ (TR)') || cols.includes('DT TRẢ GÓP (TR)') || cols.includes('DOANH THU (TR)') || fn.includes('dt nhân viên') || fn.includes('dt nv'))\n  ) {\n    if (fn.includes('realtime') || fn.includes('rt') || firstRow['SỐ NGÀY CỬA SỔ'] === 1) {\n      return 'dt_nv_realtime';\n    }\n    return 'dt_nv_luyke';\n  }\n\n  // Check Báo cáo trả chậm — cần đủ chữ ký bảng, tránh nhầm với\n  // Doanh Thu Nhân Viên vốn cũng có cột DT TRẢ GÓP.\n  if (\n    cols.includes('NHÂN VIÊN') &&\n    (cols.includes('DT TRẢ GÓP (TRIỆU)') || cols.includes('DT TRẢ GÓP')) &&\n    (cols.includes('DT SIÊU THỊ (TRIỆU)') || cols.includes('DT SIÊU THỊ')) &&\n    (cols.includes('TỶ TRỌNG TRẢ CHẬM (%)') || cols.includes('TỶ TRỌNG TRẢ CHẬM'))\n  ) {\n    return (fn.includes('realtime') || fn.includes('rt')) ? 'tra_cham_realtime' : 'tra_cham_luyke';\n  }\n\n  // Check Store Doanh Thu\n  if (cols.includes('TB 3 THÁNG (TR)') || cols.includes('TB 3 THÁNG') || cols.includes('SỐ NGÀY CỬA SỔ')) {\n    const dayWindow = firstRow['SỐ NGÀY CỬA SỔ'];\n    if (dayWindow === 1 || fn.includes('realtime') || fn.includes('rt')) return 'dt_realtime';\n    return 'dt_luyke';\n  }\n\n  // Check Employee Thi Đua (MÃ NV, CHƯƠNG TRÌNH, ĐƠN VỊ / NHÂN VIÊN)\n  if (cols.includes('MÃ NV') && (cols.includes('ĐƠN VỊ / NHÂN VIÊN') || cols.includes('CHƯƠNG TRÌNH'))) {\n    const namesStr = rows.slice(0, 30).map(r => String(r['ĐƠN VỊ / NHÂN VIÊN'] || '') + ' ' + String(r['MÃ NV'] || '')).join(' ');\n    if (\n      namesStr.includes('Lê Thị Mỹ Linh') ||\n      namesStr.includes('170266') ||\n      namesStr.includes('Trần Thị Mỹ Trang') ||\n      namesStr.includes('Tạ Đức Hiếu') ||\n      fn.includes('tz') ||\n      fn.includes('topzone') ||\n      fn.includes('12')\n    ) {\n      return 'nv_tz';\n    }\n    return 'nv_tgdd';\n  }\n\n  // Check Store Thi Đua\n  if (cols.includes('MÃ CHƯƠNG TRÌNH') && (cols.includes('CHƯƠNG TRÌNH') || cols.includes('TARGET (TR/SL theo LOẠI TĐ)'))) {\n    const hasForecast = rows.some(r => parseFloat(r['% DỰ BÁO'] || 0) > 0);\n    if (fn.includes('realtime') || fn.includes('rt') || !hasForecast) return 'td_realtime';\n    return 'td_luyke';\n  }\n\n  // Filename fallback checks\n  if (fn.includes('dtluyke') || fn.includes('dt_luyke')) return 'dt_luyke';\n  if (fn.includes('dtrealtime') || fn.includes('dt_realtime')) return 'dt_realtime';\n  if (fn.includes('nv_tz') || fn.includes('12mon')) return 'nv_tz';\n  if (fn.includes('nv_tgdd') || fn.includes('24mon')) return 'nv_tgdd';\n  if (fn.includes('thi') && fn.includes('luy')) return 'td_luyke';\n  if (fn.includes('thi') && fn.includes('real')) return 'td_realtime';\n\n  // Dynamic fallback: infer from normalized column semantics instead of filename.\n  if (rows.length) {\n    const headers = Array.from(new Set(rows.slice(0, 20).flatMap(r => Object.keys(r || {}))));\n    const gridRows = rows.slice(0, 20).map(r => headers.map(h => String(r?.[h] ?? '')));\n    const detected = detectCategoryFromParsedData(headers, gridRows);\n    if (detected) return detected;\n  }\n\n  return null;\n}\n\nexport interface ParseResult {\n  success: boolean;\n  category: keyof AppDataState | null;\n  categoryName?: string;\n  data: any[];\n  filename: string;\n  rowCount: number;\n  error?: string;\n  advice?: string;\n  foundColumns?: string[];\n  sheetName?: string;\n}\n\nexport function parseExcelFile(file: File): Promise<ParseResult> {\n  return new Promise((resolve) => {\n    // 1. Check file extension\n    const name = file.name || '';\n    const lowerName = name.toLowerCase();\n    const isSupportedExt = lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls') || lowerName.endsWith('.csv');\n\n    if (!isSupportedExt) {\n      resolve({\n        success: false,\n        category: null,\n        data: [],\n        filename: name,\n        rowCount: 0,\n        error: 'Định dạng file không được hỗ trợ',\n        advice: 'Vui lòng chỉ chọn hoặc kéo thả file Excel định dạng .xlsx, .xls hoặc .csv'\n      });\n      return;\n    }\n\n    const reader = new FileReader();\n    reader.onload = (e) => {\n      try {\n        const buffer = e.target?.result as ArrayBuffer;\n        const workbook = XLSX.read(buffer, { type: 'array' });\n        \n        if (!workbook.SheetNames || workbook.SheetNames.length === 0) {\n          resolve({\n            success: false,\n            category: null,\n            data: [],\n            filename: name,\n            rowCount: 0,\n            error: 'File Excel không có trang tính nào (Sheet rỗng)',\n            advice: 'Vui lòng kiểm tra lại nội dung file xem có bảng tính dữ liệu không.'\n          });\n          return;\n        }\n\n        // Scan every non-empty sheet. BI exports often place a title/menu sheet\n        // before the actual data table; never assume Sheet1 is the data source.\n        let best: { sheetName: string; json: any[]; category: keyof AppDataState | null; score: number } | null = null;\n        for (const sheetName of workbook.SheetNames) {\n          const worksheet = workbook.Sheets[sheetName];\n          const json = XLSX.utils.sheet_to_json(worksheet, { defval: '' });\n          if (!json || json.length === 0) continue;\n          const category = detectFileCategoryFromData(name, json);\n          const cols = Object.keys(json[0] || {});\n          const sampledText = json.slice(0, 20).map(r => Object.entries(r || {}).map(([k,v]) => `${k} ${v}`).join(' ')).join(' ');\n          const signal = cols.reduce((n, c) => n + (/ma|ten|target|doanh thu|quy doi|nhan vien|chuong trinh|so luong|tb 3 thang/i.test(c) ? 1 : 0), 0) + Math.min(10, (sampledText.match(/doanh thu|target|nhan vien|chuong trinh|sieu thi/gi) || []).length);\n          const score = (category ? 100 : 0) + Math.min(30, signal) + Math.min(20, json.length / 10);\n          if (!best || score > best.score) best = { sheetName, json, category, score };\n        }\n\n        if (!best) {\n          resolve({ success: false, category: null, data: [], filename: name, rowCount: 0, error: 'File không có bảng dữ liệu nào', advice: 'Tất cả Sheet đều rỗng.' });\n          return;\n        }\n\n        const json = best.json;\n        const foundCols = Object.keys(json[0] || {});\n        const category = best.category;\n\n        if (!category) {\n          const colPreview = foundCols.slice(0, 5).join(', ');\n          resolve({\n            success: false,\n            category: null,\n            data: json,\n            filename: name,\n            rowCount: json.length,\n            foundColumns: foundCols,\n            error: 'Cột dữ liệu không khớp với 6 mẫu hệ thống',\n            advice: `Các cột nhận diện được: [${colPreview}${foundCols.length > 5 ? ', ...' : ''}]. Cần các cột đặc trưng như: \"MÃ ĐƠN VỊ\", \"TÊN ĐƠN VỊ\", \"TÊN NHÂN VIÊN\" hoặc \"MÃ CHƯƠNG TRÌNH\".`\n          });\n          return;\n        }\n\n        resolve({\n          success: true,\n          category,\n          categoryName: CATEGORY_TITLES[category],\n          data: json,\n          filename: name,\n          rowCount: json.length,\n          foundColumns: foundCols,\n          sheetName: best.sheetName\n        });\n      } catch (err: any) {\n        resolve({\n          success: false,\n          category: null,\n          data: [],\n          filename: name,\n          rowCount: 0,\n          error: 'Lỗi đọc file Excel',\n          advice: err?.message || 'File có thể bị khóa mật khẩu hoặc cấu trúc tệp bị hỏng.'\n        });\n      }\n    };\n\n    reader.onerror = () => {\n      resolve({\n        success: false,\n        category: null,\n        data: [],\n        filename: name,\n        rowCount: 0,\n        error: 'Trình duyệt không thể đọc tệp này',\n        advice: 'Vui lòng đóng file nếu đang mở trong Excel và chọn lại.'\n      });\n    };\n\n    reader.readAsArrayBuffer(file);\n  });\n}\n\n","src/utils/formatters.ts":"export const SHORT_PROG_DICT: Record<string, string> = {\n  'TRẢ CHẬM FECREDIT, SHINHAN, SAMSUNG FINANCE+': 'Trả chậm FE/Shinhan/SS',\n  'SIM MOBIFONE/VINAPHONE/SIM DMX': 'Sim Mobi/Vina',\n  'MỞ THẺ TÍN DỤNG TPBANK EVO VÀ VPBANK MWG': 'Mở thẻ TPBank/VPBank',\n  'ĐIỆN THOẠI & TABLET ANDROID': 'ĐT & Tab Android',\n  'Điện thoại Flagship Samsung Galaxy S/Z Series': 'Flagship Samsung',\n  'Phụ kiện IT và nhóm khác': 'Phụ kiện IT',\n  'NẠP RÚT TIỀN TÀI KHOẢN NGÂN HÀNG': 'Nạp rút ngân hàng',\n  'Bảo hiểm Thợ ĐMX': 'BH Thợ ĐMX',\n  'Bảo hiểm tổng': 'BH Tổng',\n  'Laptop (trừ Apple)': 'Laptop',\n  'OTT MANGO+, ICALLME -': 'OTT Mango/iCall',\n  'Đồng hồ tháng 9': 'Đồng hồ T9',\n  'PHỤ KIỆN CÔNG NGHỆ': 'Phụ kiện CN',\n  'Điện thoại realme': 'ĐT Realme',\n  'Điện thoại Vivo': 'ĐT Vivo',\n  'Thu cũ đổi mới (Trade-in)': 'Thu cũ đổi mới',\n  'Phụ kiện chính hãng Apple': 'PK Apple',\n  'Gói AppleCare / BHMR': 'AppleCare/BHMR',\n  'Dịch vụ bảo hành & Kỹ thuật': 'Bảo hành kỹ thuật',\n};\n\nexport const SHORT_STORE_DICT: Record<string, string> = {\n  '10341 - AAR_DNA_HCH - 351 Nguyễn Hữu Thọ': 'AAR Nguyễn Hữu Thọ',\n  '933 - TGD_DNA_HCH - 351 Nguyễn Hữu Thọ': 'TGDĐ Nguyễn Hữu Thọ',\n  'AAR_DNA_HCH - 351 Nguyễn Hữu Thọ': 'TopZone 351 NHT',\n  'TGD_DNA_HCH - 351 Nguyễn Hữu Thọ': 'TGDĐ 351 NHT',\n};\n\nexport function formatProgramName(name: string, isShorten = true): string {\n  if (!name) return '';\n  if (!isShorten) return name;\n  return SHORT_PROG_DICT[name] || name;\n}\n\nexport function formatStoreName(name: string, isShorten = true): string {\n  if (!name) return '';\n  if (!isShorten) return name;\n  return SHORT_STORE_DICT[name] || name;\n}\n\nexport function formatCurrency(val: number | string | undefined | null, digits = 2): string {\n  if (val === undefined || val === null || val === '') return '0,00';\n  const num = typeof val === 'number' ? val : parseFloat(String(val).replace(/,/g, '.').replace(/[^\\d.-]/g, ''));\n  if (isNaN(num)) return '0,00';\n  return num.toLocaleString('vi-VN', {\n    minimumFractionDigits: digits,\n    maximumFractionDigits: digits,\n  });\n}\n\nexport function formatInt(val: number | string | undefined | null): string {\n  if (val === undefined || val === null || val === '') return '0';\n  const num = typeof val === 'number' ? val : parseFloat(String(val).replace(/,/g, '.').replace(/[^\\d.-]/g, ''));\n  if (isNaN(num)) return '0';\n  return Math.round(num).toLocaleString('vi-VN');\n}\n\nexport function formatPercent(val: number | string | undefined | null, digits = 1): string {\n  if (val === undefined || val === null || val === '') return '0,0%';\n  const num = typeof val === 'number' ? val : parseFloat(String(val).replace(/,/g, '.').replace(/[^\\d.-]/g, ''));\n  if (isNaN(num)) return '0,0%';\n  return num.toLocaleString('vi-VN', {\n    minimumFractionDigits: digits,\n    maximumFractionDigits: digits,\n  }) + '%';\n}\n\nexport function cleanCode(c: string | number | undefined | null): string {\n  if (c === undefined || c === null) return '';\n  return String(c).trim();\n}\n\nexport function cleanProgName(s: string | undefined | null): string {\n  if (!s) return '';\n  return String(s).trim().toLowerCase().replace(/\\s+/g, ' ');\n}\n\nexport function getCellNumber(row: any, possibleKeys: string[]): number {\n  if (!row) return 0;\n  for (const k of possibleKeys) {\n    if (row[k] !== undefined && row[k] !== null && row[k] !== '') {\n      const val = parseFloat(String(row[k]).replace(/,/g, '.').replace(/[^\\d.-]/g, ''));\n      if (!isNaN(val)) return val;\n    }\n  }\n  const rowKeys = Object.keys(row);\n  for (const pk of possibleKeys) {\n    const matchedKey = rowKeys.find(rk => rk.trim().toLowerCase() === pk.trim().toLowerCase());\n    if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== null) {\n      const val = parseFloat(String(row[matchedKey]).replace(/,/g, '.').replace(/[^\\d.-]/g, ''));\n      if (!isNaN(val)) return val;\n    }\n  }\n  return 0;\n}\n","src/utils/imageExporter.ts":"import { toPng, toBlob } from 'html-to-image';\nimport html2canvasPro from 'html2canvas-pro';\n\nexport interface ExportImageResult {\n  dataUrl: string;\n  blob: Blob;\n  fileName: string;\n}\n\n/**\n * Converts a base64 DataURL string to a standard Blob\n */\nexport function dataUrlToBlob(dataUrl: string): Blob {\n  const parts = dataUrl.split(';base64,');\n  const contentType = parts[0].split(':')[1] || 'image/png';\n  const raw = window.atob(parts[1]);\n  const rawLength = raw.length;\n  const uInt8Array = new Uint8Array(rawLength);\n\n  for (let i = 0; i < rawLength; ++i) {\n    uInt8Array[i] = raw.charCodeAt(i);\n  }\n\n  return new Blob([uInt8Array], { type: contentType });\n}\n\n/**\n * Robustly captures an HTML element to high-resolution PNG image.\n * Uses html2canvas-pro first for authentic canvas font rendering (eliminating Chrome SVG foreignObject text overlap bug),\n * ensures all fonts are loaded, temporarily activates export mode (expands scroll areas and hides toolbars),\n * and gracefully falls back to html-to-image if needed.\n */\nexport async function captureElement(\n  element: HTMLElement,\n  options?: {\n    fileName?: string;\n    backgroundColor?: string;\n    scale?: number;\n    /** true = preserve the two-column on-screen layout; false = stack vertically for export */\n    twoColumnLayout?: boolean;\n  }\n): Promise<ExportImageResult> {\n  const fileName = options?.fileName || `BaoCao_${new Date().toISOString().slice(0, 10)}.png`;\n  const bg = options?.backgroundColor || '#f8fafc';\n  const scale = options?.scale || 2;\n  const preserveTwoColumnLayout = options?.twoColumnLayout === true;\n\n  // 1. Ensure fonts are 100% loaded before rasterizing\n  try {\n    if (document.fonts) {\n      await document.fonts.ready;\n    }\n  } catch (e) {\n    // Continue even if font ready check fails\n  }\n\n  // 2. Mark element with export mode to unroll scrolls and hide toolbars.\n  //    IMPORTANT: the report lives inside flex/overflow containers on GitHub Pages.\n  //    We temporarily unroll the whole ancestor chain as well, then restore it.\n  element.classList.add('is-exporting');\n  if (preserveTwoColumnLayout) element.classList.add('is-exporting-screen');\n  document.body.classList.add('is-exporting');\n\n  const touchedAncestors: Array<{ el: HTMLElement; style: { overflow: string; overflowX: string; overflowY: string; height: string; maxHeight: string; } }> = [];\n  try {\n    let parent = element.parentElement;\n    while (parent && parent !== document.body) {\n      touchedAncestors.push({\n        el: parent,\n        style: {\n          overflow: parent.style.overflow,\n          overflowX: parent.style.overflowX,\n          overflowY: parent.style.overflowY,\n          height: parent.style.height,\n          maxHeight: parent.style.maxHeight,\n        },\n      });\n      parent.style.overflow = 'visible';\n      parent.style.overflowX = 'visible';\n      parent.style.overflowY = 'visible';\n      parent.style.height = 'auto';\n      parent.style.maxHeight = 'none';\n      parent = parent.parentElement;\n    }\n  } catch (e) {\n    console.warn('Could not temporarily unroll export ancestors', e);\n  }\n\n  // Allow DOM to settle and apply clean layout\n  await new Promise((resolve) => setTimeout(resolve, 120));\n\n  try {\n    // Attempt 1: html2canvas-pro (native canvas drawing, zero text overlap)\n    try {\n      const canvas = await html2canvasPro(element, {\n        scale,\n        useCORS: true,\n        allowTaint: true,\n        backgroundColor: bg,\n        logging: false,\n        ignoreElements: (domNode) => {\n          return domNode.classList?.contains('no-export') || false;\n        },\n        onclone: (clonedDoc, clonedElement) => {\n          clonedElement.classList.add('is-exporting');\n          if (preserveTwoColumnLayout) clonedElement.classList.add('is-exporting-screen');\n\n          // The on-screen report uses two columns. By default we stack them vertically\n          // because it guarantees every table column is readable in a tall export.\n          // When the user explicitly chooses \"Giữ bố cục màn hình\", keep the original\n          // two-column grid instead.\n          if (!preserveTwoColumnLayout) {\n            clonedElement.querySelectorAll<HTMLElement>('.export-stack-two-columns').forEach((grid) => {\n              grid.style.display = 'block';\n              grid.style.width = '100%';\n              grid.style.maxWidth = 'none';\n            });\n\n            clonedElement.querySelectorAll<HTMLElement>('.export-stack-two-columns > *').forEach((card) => {\n              card.style.width = '100%';\n              card.style.maxWidth = 'none';\n              card.style.marginBottom = '20px';\n            });\n          } else {\n            // SCREEN MODE: force a desktop-width export so TGDĐ + AAR stay side-by-side.\n            // The live page can be wide while the html2canvas clone still inherits a\n            // narrow viewport, which previously produced a squeezed/cropped PNG.\n            const exportWidth = '1250px';\n            clonedElement.style.width = exportWidth;\n            clonedElement.style.minWidth = exportWidth;\n            clonedElement.style.maxWidth = 'none';\n\n            clonedElement.querySelectorAll<HTMLElement>('.export-stack-two-columns').forEach((grid) => {\n              grid.style.display = 'grid';\n              grid.style.gridTemplateColumns = 'minmax(0, 1fr) minmax(0, 1fr)';\n              grid.style.width = exportWidth;\n              grid.style.minWidth = exportWidth;\n              grid.style.maxWidth = 'none';\n              grid.style.columnGap = '14px';\n            });\n\n            clonedElement.querySelectorAll<HTMLElement>('.export-stack-two-columns > *').forEach((card) => {\n              card.style.width = 'auto';\n              card.style.minWidth = '0';\n              card.style.maxWidth = 'none';\n              card.style.marginBottom = '0';\n            });\n          }\n\n          // Normalize native range sliders for image export.\n          // html2canvas/html2canvas-pro can rasterize Chrome's native <input type=range>\n          // differently from the live page (including painting the numeric value inside\n          // the track). Replace each range only in the cloned export DOM with a stable\n          // CSS track + fill + thumb so the exported image matches the web UI.\n          clonedElement.querySelectorAll<HTMLInputElement>('input[type=\\\"range\\\"]').forEach((input) => {\n            if (input.closest('[data-export-slider]')) { input.remove(); return; }\n            const min = Number(input.min || 0);\n            const max = Number(input.max || 100);\n            const value = Number(input.value || min);\n            const pct = max > min ? Math.min(100, Math.max(0, ((value - min) / (max - min)) * 100)) : 0;\n\n            const wrapper = clonedDoc.createElement('div');\n            wrapper.style.width = '100%';\n            wrapper.style.height = '8px';\n            wrapper.style.position = 'relative';\n            wrapper.style.borderRadius = '9999px';\n            wrapper.style.background = '#e2e8f0';\n            wrapper.style.margin = '0';\n            wrapper.style.padding = '0';\n\n            const fill = clonedDoc.createElement('div');\n            fill.style.position = 'absolute';\n            fill.style.left = '0';\n            fill.style.top = '0';\n            fill.style.height = '100%';\n            fill.style.width = `${pct}%`;\n            fill.style.borderRadius = '9999px';\n            fill.style.background = input.classList.contains('accent-emerald-600') ? '#10b981' : '#2563eb';\n\n            const thumb = clonedDoc.createElement('div');\n            thumb.style.position = 'absolute';\n            thumb.style.left = `calc(${pct}% - 6px)`;\n            thumb.style.top = '50%';\n            thumb.style.width = '12px';\n            thumb.style.height = '12px';\n            thumb.style.transform = 'translateY(-50%)';\n            thumb.style.borderRadius = '50%';\n            thumb.style.background = '#ffffff';\n            thumb.style.border = input.classList.contains('accent-emerald-600') ? '2px solid #10b981' : '2px solid #2563eb';\n            thumb.style.boxSizing = 'border-box';\n            thumb.style.boxShadow = '0 1px 3px rgba(15,23,42,.18)';\n\n            wrapper.appendChild(fill);\n            wrapper.appendChild(thumb);\n            input.parentElement?.replaceChild(wrapper, input);\n          });\n\n          // Fully expand EVERY scrollable/clipped descendant in the cloned report.\n          // This is intentionally data-driven instead of targeting only one class,\n          // because Tailwind's overflow-x-auto can become a computed overflow-y:auto\n          // on GitHub Pages and clip rows that are visible in the live Chrome page.\n          const allNodes = clonedElement.querySelectorAll('*');\n          allNodes.forEach((node: any) => {\n            // Decorative clipped graphics must retain their fixed height and clipping.\n            // Expanding an empty flex progress track to height:auto collapses it to zero.\n            if (node.closest?.('[data-export-slider], [data-export-preserve-layout=\"true\"]')) return;\n            if (!node.style) return;\n            const computed = clonedDoc.defaultView?.getComputedStyle(node);\n            const scrollable = computed && (\n              computed.overflow !== 'visible' ||\n              computed.overflowX !== 'visible' ||\n              computed.overflowY !== 'visible' ||\n              node.scrollHeight > node.clientHeight + 1 ||\n              node.scrollWidth > node.clientWidth + 1\n            );\n            if (scrollable || node.matches?.('.card-programs-container, [data-export-expand=\"true\"]')) {\n              node.scrollTop = 0;\n              node.scrollLeft = 0;\n              node.style.maxHeight = 'none';\n              node.style.height = 'auto';\n              node.style.minHeight = '0';\n              node.style.overflow = 'visible';\n              node.style.overflowY = 'visible';\n              node.style.overflowX = 'visible';\n              node.style.scrollbarWidth = 'none';\n              node.style.webkitOverflowScrolling = 'auto';\n            }\n          });\n\n          // Also unroll the clone root itself.\n          clonedElement.style.maxHeight = 'none';\n          clonedElement.style.height = 'auto';\n          clonedElement.style.overflow = 'visible';\n          clonedElement.style.overflowY = 'visible';\n          clonedElement.style.overflowX = 'visible';\n        },\n      });\n\n      const dataUrl = canvas.toDataURL('image/png');\n      if (dataUrl && dataUrl.length > 200) {\n        const blob = dataUrlToBlob(dataUrl);\n        return { dataUrl, blob, fileName };\n      }\n    } catch (h2cError) {\n      console.warn('html2canvas-pro capture failed, attempting html-to-image fallback...', h2cError);\n    }\n\n    // Attempt 2: Fallback to html-to-image\n    try {\n      const fullWidth = Math.max(element.scrollWidth, element.getBoundingClientRect().width);\n      const fullHeight = Math.max(element.scrollHeight, element.getBoundingClientRect().height);\n      const dataUrl = await toPng(element, {\n        backgroundColor: bg,\n        pixelRatio: scale,\n        cacheBust: true,\n        quality: 0.98,\n        width: fullWidth,\n        height: fullHeight,\n        style: {\n          transform: 'none',\n          margin: '0',\n          width: `${preserveTwoColumnLayout ? Math.max(fullWidth, 1250) : fullWidth}px`,\n          height: `${fullHeight}px`,\n          minWidth: preserveTwoColumnLayout ? '1250px' : `${fullWidth}px`,\n          maxWidth: 'none',\n          maxHeight: 'none',\n          overflow: 'visible',\n        },\n        filter: (domNode) => {\n          if (domNode instanceof HTMLElement) {\n            if (domNode.classList.contains('no-export')) return false;\n          }\n          return true;\n        },\n      });\n\n      if (dataUrl && dataUrl.length > 200) {\n        const blob = dataUrlToBlob(dataUrl);\n        return { dataUrl, blob, fileName };\n      }\n    } catch (toPngErr) {\n      console.error('html-to-image fallback also failed:', toPngErr);\n    }\n\n    throw new Error('Không thể tạo ảnh từ giao diện. Vui lòng thử lại!');\n  } finally {\n    // Always restore ancestor layout exactly as it was before export.\n    for (const item of touchedAncestors.reverse()) {\n      item.el.style.overflow = item.style.overflow;\n      item.el.style.overflowX = item.style.overflowX;\n      item.el.style.overflowY = item.style.overflowY;\n      item.el.style.height = item.style.height;\n      item.el.style.maxHeight = item.style.maxHeight;\n    }\n\n    // Always clean up export mode classes\n    element.classList.remove('is-exporting');\n    element.classList.remove('is-exporting-screen');\n    document.body.classList.remove('is-exporting');\n  }\n}\n\n/**\n * Triggers a client-side file download for the image\n */\nexport function downloadImage(blob: Blob | string, fileName: string): boolean {\n  try {\n    let url: string;\n    let shouldRevoke = false;\n\n    if (typeof blob === 'string') {\n      if (blob.startsWith('data:')) {\n        const b = dataUrlToBlob(blob);\n        url = URL.createObjectURL(b);\n        shouldRevoke = true;\n      } else {\n        url = blob;\n      }\n    } else {\n      url = URL.createObjectURL(blob);\n      shouldRevoke = true;\n    }\n\n    const anchor = document.createElement('a');\n    anchor.href = url;\n    anchor.download = fileName;\n    anchor.style.display = 'none';\n    document.body.appendChild(anchor);\n\n    // Trigger click\n    anchor.click();\n\n    setTimeout(() => {\n      document.body.removeChild(anchor);\n      if (shouldRevoke) URL.revokeObjectURL(url);\n    }, 1000);\n\n    return true;\n  } catch (e) {\n    console.error('Direct download error:', e);\n    return false;\n  }\n}\n\n/**\n * Copies the image directly to the user's OS clipboard\n * (Allows pasting directly into Zalo, Viber, Telegram, PowerPoint, etc.)\n */\nexport async function copyImageToClipboard(blob: Blob): Promise<boolean> {\n  if (!navigator.clipboard || !window.ClipboardItem) {\n    return false;\n  }\n\n  try {\n    // Ensure image/png type\n    const pngBlob = blob.type === 'image/png' ? blob : new Blob([blob], { type: 'image/png' });\n    await navigator.clipboard.write([\n      new ClipboardItem({\n        'image/png': pngBlob,\n      }),\n    ]);\n    return true;\n  } catch (err) {\n    console.warn('Clipboard write failed:', err);\n    return false;\n  }\n}\n","src/utils/smartDataParser.ts":"import { AppDataState, StoreRevenueRow, CompetitionRow, EmployeeRevenueRow } from '../types';\n\nexport const CATEGORY_LABELS: Record<keyof AppDataState, string> = {\n  dt_luyke: 'Doanh Thu Luỹ Kế Siêu Thị',\n  dt_realtime: 'Doanh Thu Realtime Siêu Thị',\n  td_luyke: 'Thi đua Lũy kế 2 shop',\n  td_realtime: 'Thi đua Realtime 2 shop',\n  nv_tgdd: 'Lũy kế thi đua nhân viên TGDĐ',\n  nv_tz: 'Lũy kế thi đua nhân viên TopZone',\n  dt_nv_luyke: 'Doanh Thu Nhân Viên Luỹ Kế',\n  dt_nv_realtime: 'Doanh Thu Nhân Viên Realtime',\n  tra_cham_luyke: 'Trả Chậm — Lũy Kế',\n  tra_cham_realtime: 'Trả Chậm — Realtime',\n};\n\nexport const CATEGORY_DESCRIPTIONS: Record<keyof AppDataState, string> = {\n  dt_luyke: 'Báo cáo doanh thu luỹ kế thực tế và quy đổi của 2 siêu thị',\n  dt_realtime: 'Báo cáo doanh thu phát sinh trong ngày theo thời gian thực',\n  td_luyke: 'Báo cáo tiến độ các chương trình thi đua luỹ kế của siêu thị',\n  td_realtime: 'Báo cáo thi đua phát sinh trong ngày của siêu thị',\n  nv_tgdd: 'Báo cáo chi tiết thi đua các chương trình của nhân sự TGDĐ',\n  nv_tz: 'Báo cáo chi tiết thi đua của nhân sự TopZone',\n  dt_nv_luyke: 'Doanh thu, số lượng, quy đổi lũy kế từng nhân viên',\n  dt_nv_realtime: 'Doanh thu, số lượng, quy đổi hôm nay của từng nhân viên',\n  tra_cham_luyke: 'Báo cáo trả chậm lũy kế theo nhân viên và nguồn tài chính',\n  tra_cham_realtime: 'Báo cáo trả chậm phát sinh trong ngày theo nhân viên và nguồn tài chính',\n};\n\n// Canonical shop names exactly as returned by the MWG BI copy-table.\nexport const MANAGED_SHOPS = {\n  TOPZONE: 'AAR_DNA_HCH - 351 Nguyễn Hữu Thọ',\n  TGDD: 'TGD_DNA_HCH - 351 Nguyễn Hữu Thọ',\n} as const;\n\nexport const SHOP_CODES = {\n  TOPZONE: '10341',\n  TGDD: '933',\n} as const;\n\nfunction canonicalShopFromCode(code: string): string {\n  const c = String(code || '').trim().toUpperCase();\n  if (c === 'AAR_DNA_HCH' || c === '10341' || c.includes('AAR_DNA_HCH')) return MANAGED_SHOPS.TOPZONE;\n  if (c === 'TGD_DNA_HCH' || c === '933' || c.includes('TGD_DNA_HCH')) return MANAGED_SHOPS.TGDD;\n  return '';\n}\n\nfunction canonicalShopCode(value: string): string {\n  const c = String(value || '').trim().toUpperCase();\n  if (c === 'AAR_DNA_HCH' || c === '10341' || c.includes('AAR_DNA_HCH')) return SHOP_CODES.TOPZONE;\n  if (c === 'TGD_DNA_HCH' || c === '933' || c.includes('TGD_DNA_HCH')) return SHOP_CODES.TGDD;\n  return '';\n}\n\nexport interface ParseDiagnostics {\n  category: keyof AppDataState;\n  categoryName: string;\n  rowCount: number;\n  recognizedColumns: { field: string; mappedHeader: string; sampleVal?: string }[];\n  missingColumns: string[];\n  data: any[];\n  mappingMode?: 'exact' | 'fuzzy' | 'learned';\n  confidence?: number;\n  pageExtractedInfo?: {\n    headerFoundAtLine: number;\n    totalLinesScanned: number;\n    ignoredNoiseLines: number;\n    isFullPageExtracted: boolean;\n  };\n}\n\nexport interface SplitResult {\n  headers: string[];\n  rows: string[][];\n  pageExtractedInfo: {\n    headerFoundAtLine: number;\n    totalLinesScanned: number;\n    ignoredNoiseLines: number;\n    isFullPageExtracted: boolean;\n  };\n}\n\nexport interface MwgDetectionContext {\n  existingStoreCompetitionLuyKe?: any[];\n  // Tổng DT QĐ của bản Lũy kế hiện đang có trong phiên.\n  // Khi có baseline này, bản paste có tổng nhỏ hơn sẽ được nhận diện là Realtime.\n  existingStoreLuyKeDtQd?: number;\n  existingEmployeeLuyKeDtQd?: number;\n  existingTraChamLuyKeTotal?: number;\n}\n\nfunction sumParsedDtQd(rows: any[] | undefined): number {\n  return (rows || []).reduce((sum, row) => {\n    const value = Number(row?.['DOANH THU QĐ (TR)']);\n    return sum + (Number.isFinite(value) ? value : 0);\n  }, 0);\n}\n\n/**\n * Remove Vietnamese accents and lower-case for robust matching\n */\nexport function normalizeStr(str: string): string {\n  if (!str) return '';\n  return str\n    .toLowerCase()\n    .normalize('NFD')\n    .replace(/[\\u0300-\\u036f]/g, '')\n    .replace(/đ/g, 'd')\n    .replace(/[^a-z0-9\\s]/g, ' ')\n    .replace(/\\s+/g, ' ')\n    .trim();\n}\n\n/**\n * Flexible number parser handling Vietnamese formatting:\n * - \"1,991\" -> 1991\n * - \"75.7%\" -> 75.7\n * - \"+3.2%\" -> 3.2\n * - \"-4.6%\" -> -4.6\n * - \"12.54\" -> 12.54\n * - \"—\" or \"-\" -> fallback\n */\nexport function parseFlexibleNumber(val: any, fallback: number = 0): number {\n  if (val === null || val === undefined) return fallback;\n  if (typeof val === 'number') return isNaN(val) ? fallback : val;\n\n  let s = String(val).trim().replace(/ /g, ' ');\n  if (!s || s === '—' || s === '-' || s === 'null' || s === 'undefined' || s === '?') {\n    return fallback;\n  }\n\n  // Remove positive sign and trailing %\n  s = s.replace(/^\\+/, '').replace(/%$/, '').trim();\n\n  // If format is 1,991 or 2,631 or 11,384 (thousand comma, dot decimal or integer)\n  if (/^-?\\d{1,3}(,\\d{3})+(\\.\\d+)?$/.test(s)) {\n    s = s.replace(/,/g, '');\n  } else if (/^-?\\d{1,3}(\\.\\d{3})+(,\\d+)?$/.test(s)) {\n    // European/VN style with dot thousands: 1.991,50\n    s = s.replace(/\\./g, '').replace(',', '.');\n  } else if (s.includes(',') && !s.includes('.')) {\n    // If only one comma e.g. \"12,5\" -> \"12.5\"\n    if (/^-?\\d+,\\d{1,2}$/.test(s)) {\n      s = s.replace(',', '.');\n    } else {\n      s = s.replace(/,/g, '');\n    }\n  }\n\n  const num = parseFloat(s);\n  return isNaN(num) ? fallback : num;\n}\n\nconst TOPZONE_STAFF_SET = new Set([\n  '98486', '83089', '170266', '189769', '45500', '183180', '302196', '315664',\n  'Nguyễn Quỳnh Anh', 'Trần Minh Hải', 'Lê Thị Mỹ Linh', 'Tạ Đức Hiếu', 'Trần Thị Mỹ Trang', 'Đỗ Nhật Trinh'\n]);\n\nfunction isTopzoneStaff(idOrName: string): boolean {\n  if (!idOrName) return false;\n  const clean = String(idOrName).trim();\n  if (TOPZONE_STAFF_SET.has(clean)) return true;\n  for (const tz of TOPZONE_STAFF_SET) {\n    if (clean.includes(tz)) return true;\n  }\n  return false;\n}\n\nconst TGDD_STAFF_SET = new Set([\n  '204201', '269167', '29649', '259623',\n  'Lê Văn Nhân', 'Lê Thị Thanh Trâm', 'Nguyễn Thị Thy', 'Trần Thị Huyền Trang'\n]);\n\nfunction isTgddStaff(idOrName: string): boolean {\n  if (!idOrName) return false;\n  const clean = String(idOrName).trim();\n  if (TGDD_STAFF_SET.has(clean)) return true;\n  for (const tg of TGDD_STAFF_SET) {\n    if (clean.includes(tg)) return true;\n  }\n  return false;\n}\n\n\n/** Robust helpers for the 2026 MWG BI copy format. The BI page can be copied as\n * tab-separated text, line-separated cells, or markdown-like table text. */\nfunction cleanClipboardLine(line: string): string {\n  return line\n    .replace(/\\*\\*/g, '')\n    // Markdown exports may escape table characters as \\_ / \\|.\n    // Real Clipboard text usually has no escapes, so this is harmless there.\n    .replace(/\\\\([_|])/g, '$1')\n    .replace(/^\\s*\\|\\s?/, '')\n    .replace(/\\s?\\|\\s*$/, '')\n    .replace(/\\bsvg\\b/gi, '')\n    .trim();\n}\n\nfunction isNoiseLine(line: string): boolean {\n  const n = normalizeStr(line);\n  return !n || /^[-:| ]+$/.test(line) || n === 'tong' || n === 'tong cong' || n === 'total' ||\n    n.startsWith('don vi trieu dong') || n.startsWith('1 17 tong');\n}\n\nfunction numericCellsFromLine(line: string): string[] {\n  const cleaned = cleanClipboardLine(line);\n  let cells: string[] = [];\n  if (cleaned.includes('\\t')) cells = cleaned.split('\\t').map(x => x.trim());\n  else if (cleaned.includes('|')) cells = cleaned.split('|').map(x => x.trim());\n  else return [];\n  return cells.filter(x => x !== '');\n}\n\nfunction competitionValueCells(line: string): string[] {\n  const cleaned = cleanClipboardLine(line);\n  return cleaned.split(/\\t|\\|/).slice(1).map(x => x.trim());\n}\n\nfunction looksLikeNumericRow(line: string, min = 3): boolean {\n  const cells = numericCellsFromLine(line);\n  if (cells.length >= min) {\n    const numericish = cells.filter(c => /[0-9]/.test(c) || c === '-' || c === '—').length;\n    return numericish >= min;\n  }\n  return false;\n}\n\nfunction extractProgramAndHeader(line: string, realtime = false): { program: string; type: number } | null {\n  const cleaned = cleanClipboardLine(line);\n  // Do not slice using an index from normalizeStr(): accent removal changes offsets.\n  // The 2026 BI copy concatenates the program title directly with the header.\n  const re = realtime\n    ? /^(.*?)(DOANH\\s*THU\\s*\\(\\s*RT\\s*\\)|SỐ\\s*LƯỢNG\\s*\\(\\s*RT\\s*\\))\\s*TARGET\\s*%?\\s*HT\\s*NGÀY/i\n    : /^(.*?)(DOANH\\s*THU|SỐ\\s*LƯỢNG)\\s*TARGET\\s*%?\\s*HT\\s*THÁNG/i;\n  const m = cleaned.match(re);\n  if (!m) return null;\n  const program = (m[1] || '').replace(/[|\\t]+$/g, '').trim();\n  const marker = m[2] || '';\n  return { program: program || 'Chương trình', type: /SỐ\\s*LƯỢNG/i.test(marker) ? 2 : 3 };\n}\n\nfunction extractPersonRow(line: string): { id: string; name: string; cells: string[] } | null {\n  const cleaned = cleanClipboardLine(line);\n  const m = cleaned.match(/^(\\d{4,7}|online)\\s*[-_–]\\s*(.+?)(?:\\t|\\||$)/i);\n  if (!m) return null;\n  const id = m[1].trim();\n  const name = m[2].trim();\n  const cells = numericCellsFromLine(cleaned);\n  return { id, name, cells: cells.length > 1 ? cells.slice(1) : [] };\n}\n\nfunction extractStoreRow(line: string): { code: string; name: string; cells: string[] } | null {\n  const cleaned = cleanClipboardLine(line);\n  // Store-competition rows use codes such as TGD_DNA_HCH / AAR_DNA_HCH,\n  // unlike the numeric IDs used by the revenue report. Accept both formats.\n  const m = cleaned.match(/^([A-Za-z0-9]{2,20}(?:[_-][A-Za-z0-9]+)*)\\s*[-_–]\\s*(.+?)(?:\\t|\\||$)/);\n  if (!m) return null;\n  const code = m[1].trim();\n  const name = m[2].trim();\n  const cells = numericCellsFromLine(cleaned);\n  return { code, name, cells: cells.length > 1 ? cells.slice(1) : [] };\n}\n\nfunction findFollowingValueCells(lines: string[], index: number): string[] {\n  for (let j = index + 1; j < Math.min(lines.length, index + 3); j++) {\n    if (isNoiseLine(lines[j])) continue;\n    const cells = numericCellsFromLine(lines[j]);\n    if (cells.length >= 3 && cells.some(c => /[0-9]/.test(c))) return cells;\n  }\n  return [];\n}\n\n/** Normalize only competition reports; leave revenue/installment import paths intact. */\nexport function normalizeCompetitionClipboard(rawText: string): string {\n  if (!/hang (?:trong st|vung)/.test(normalizeStr(rawText)) || !/top bottom/.test(normalizeStr(rawText))) return rawText;\n  const rawLines = String(rawText || '').replace(/\\r\\n?/g, '\\n').replace(/[\\u200B-\\u200D\\uFEFF]/g, '').split('\\n');\n  const lines = rawLines.map(cleanClipboardLine).filter(Boolean);\n  const output: string[] = [];\n  const metric = /(DOANH\\s*THU|SỐ\\s*LƯỢNG)(?:\\s*\\(\\s*RT\\s*\\))?(?=\\s*(?:$|TARGET|HẠNG|[|\\t]))/i;\n  const signature = /(DOANH\\s*THU|SỐ\\s*LƯỢNG)(?:\\s*\\(\\s*RT\\s*\\))?\\s*(?:TARGET\\s*%?\\s*HT\\s*(?:THÁNG|NGÀY)|HẠNG\\s*TRONG\\s*ST)/i;\n  let sawHeader = false;\n  for (let i = 0; i < lines.length; i++) {\n    let line = lines[i];\n    // Browsers may separate the title, each heading and each cell by newlines.\n    const hasMetric = metric.test(line);\n    const nextMetric = (lines[i + 1] || '').search(metric) === 0 && !/\\t|\\|/.test(line) && !/^\\d+\\s*[-–]/.test(line);\n    if (hasMetric || nextMetric) {\n      let joined = line.replace(/[|\\t]/g, ' ');\n      let end = i;\n      while (!(signature.test(joined) && /TOP\\s*\\/\\s*BOTTOM\\s*(?:VÙNG|ST)/i.test(joined)) && end < Math.min(lines.length - 1, i + 10)) {\n        if (/^(?:\\d{4,7}\\s*[-–]|(?:AAR|TGD)_)/i.test(lines[end + 1])) break;\n        if (metric.test(joined) && metric.test(lines[end + 1])) break;\n        joined += ' ' + lines[++end].replace(/[|\\t]/g, ' ');\n      }\n      if (signature.test(joined)) {\n        output.push(joined.trim()); sawHeader = true; i = end; continue;\n      }\n    }\n    if (!sawHeader) continue; // Menus, timestamps, toolbar buttons are not table evidence.\n    if (/^[-:|\\s]+$/.test(line)) continue;\n    // Preserve empty middle cells in TSV/Markdown. For vertical copies collect\n    // only scalar data cells, stopping before the next person/store/program.\n    if (extractPersonRow(line) || extractStoreRow(line) || /^TỔNG(?:\\s|\\||$)/i.test(line)) {\n      const cells = line.includes('\\t') ? line.split('\\t') : line.includes('|') ? line.split('|') : [line];\n      let end = i;\n      while (end + 1 < lines.length && cells.length < 9) {\n        const next = lines[end + 1];\n        const values = next.split(/\\t|\\|/).map(x => x.trim());\n        if (!values.every(v => !v || /^(?:[+-]?[\\d.,]+%?(?:\\s*\\(CTY\\))?|[-—–]|TOP|BOTTOM)$/i.test(v))) break;\n        cells.push(...values); end++;\n      }\n      output.push(cells.map(x => x.trim()).join('\\t')); i = end;\n    }\n  }\n  return sawHeader ? output.join('\\n') : rawText;\n}\n\nfunction employeeCompetitionDestination(text: string, context?: MwgDetectionContext): 'nv_tz' | 'nv_tgdd' | null {\n  const lines = text.split(/\\r?\\n/).map(cleanClipboardLine);\n  const totals = new Map<string, number>();\n  let program = '';\n  let tz = 0, tg = 0;\n  for (const line of lines) {\n    const h = /hang trong st/.test(normalizeStr(line)) ? line.match(/^(.*?)(?:DOANH\\s*THU|SỐ\\s*LƯỢNG)/i) : null;\n    if (h) { program = normalizeStr(h[1]); continue; }\n    const person = extractPersonRow(line);\n    if (!person || !program) continue;\n    if (isTopzoneStaff(person.id) || isTopzoneStaff(person.name)) tz++;\n    if (isTgddStaff(person.id) || isTgddStaff(person.name)) tg++;\n    totals.set(program, (totals.get(program) || 0) + parseFlexibleNumber(person.cells[0]));\n  }\n  // Match report totals to the loaded store report, including cross-store sellers.\n  const scores: Record<string, number> = { '10341': 0, '933': 0 };\n  for (const row of context?.existingStoreCompetitionLuyKe || []) {\n    const code = String(row['MÃ ĐƠN VỊ']);\n    if (!(code in scores)) continue;\n    const actual = totals.get(normalizeStr(String(row['CHƯƠNG TRÌNH'] || '')));\n    const value = Number(row[Number(row['LOẠI TĐ']) === 2 || Number(row['LOẠI TĐ']) === 6 ? 'SỐ LƯỢNG' : 'DOANH THU (TR)']) || 0;\n    if (actual == null || actual <= 0 || value <= 0) continue;\n    if (Math.abs(actual - value) <= Math.max(.05, value * .02)) scores[code]++;\n  }\n  if (scores['10341'] >= 2 && scores['10341'] > scores['933'] + 1) return 'nv_tz';\n  if (scores['933'] >= 2 && scores['933'] > scores['10341'] + 1) return 'nv_tgdd';\n  if (tz > tg && tz >= 2) return 'nv_tz';\n  if (tg > tz && tg >= 2) return 'nv_tgdd';\n  // Do not silently send an ambiguous employee report to the other shop.\n  return null;\n}\n\n\n// =========================================================================\n// 1. DEDICATED MWG BI PARSERS (BUILT DIRECTLY FROM REAL MWG SAMPLES)\n// =========================================================================\n\n/**\n * 1. Doanh thu Siêu thị Lũy kế (dt_luyke)\n * Handles MWG BI summary copy:\n * DT thực / Target trọn kỳ / Tỉ trọng trả góp / Siêu thị table\n */\nexport function parseMwgStoreRevenueLk(rawText: string): ParseDiagnostics | nu sRt) return null;\n\n  const records: EmployeeRevenueRow[] = [];\n\n  for (let i = 0; i < lines.length; i++) {\n    const line = lines[i];\n\n    // Must not be a store line (e.g. 10341 - AAR or 933 - TGD)\n    if (/aar_|tgd_|hch|351\\s*nguy[eê]n\\s*h[uư]u\\s*th[oọ]|\\b(10341|933)\\b/i.test(line)) {\n      continue;\n    }\n\n    // Match employee identifier: e.g. \"98486 - Nguyễn Quỳnh Anh\" or \"online - Online - 18001060\"\n    const staffMatch = line.match(/^(\\d{4,7}|online)\\s*[-_–]\\s*([^\\n\\r\\t|]+)/i);\n    if (!staffMatch || line.includes('Tổng') || line.includes('tong')) continue;\n\n    const staffId = staffMatch[1].trim();\n    let staffName = staffMatch[2].trim();\n    staffName = staffName.replace(/\\t.*$/, '').replace(/-\\s*\\d+$/, '').trim();\n\n    let tokens: string[] = numericCellsFromLine(line).slice(1);\n    if (tokens.length < 3) tokens = findFollowingValueCells(lines, i);\n\n    if (tokens.length >= 3) {\n      // MWG BI 2026 có thêm 2 cột sau % TT: DT TRẢ GÓP và % TRẢ GÓP.\n      // Quan trọng: phải giữ cả các ô \"—\" làm placeholder, vì chúng giữ đúng vị trí cột.\n      // Format hiện tại thường là:\n      // SL | DT QĐ | % TỈ TRỌNG | DT | TARGET | % HT TARGET | TB 3 THÁNG | % TT | DT TRẢ GÓP | % TRẢ GÓP\n      const sl = Math.round(parseFlexibleNumber(tokens[0]));\n      const dtQd = parseFlexibleNumber(tokens[1]);\n      const tiTrong = parseFlexibleNumber(tokens[2]);\n      const dt = tokens.length > 3 ? parseFlexibleNumber(tokens[3]) : 0;\n      const target = tokens.length > 4 ? parseFlexibleNumber(tokens[4], 0) : 0;\n      const htTarget = tokens.length > 5 ? parseFlexibleNumber(tokens[5], 0) : 0;\n      const tb3 = tokens.length > 6 ? parseFlexibleNumber(tokens[6], 0) : 0;\n      const hasCurrentInstallmentColumns = tokens.length >= 10;\n      const idxTraGop = hasCurrentInstallmentColumns ? 8 : -1;\n      const idxPctTraGop = hasCurrentInstallmentColumns ? 9 : -1;\n      const dtTraGop = idxTraGop >= 0 ? parseFlexibleNumber(tokens[
