um text-slate-800 truncate\" title={p.name}>\n                              {isTopVung && '🥇 '}\n                              {p.displayName}\n                            </div>\n                            <div className=\"py-1 px-1 text-right text-slate-700 font-mono text-[11px]\">\n                              {thucStr}\n                            </div>\n                            <div className=\"py-1 px-1 text-right text-slate-400 font-mono text-[11px]\">\n                              {targetStr}\n                            </div>\n                            <div className={`py-1 px-1 text-right font-mono text-[11px] ${pctClass}`}>\n                              {formatPercent(p.pctLk, 1)}\n                            </div>\n                            <div className=\"py-1 px-1 text-right text-slate-500 font-mono text-[10.5px]\">\n                              {formatPercent(p.pctDu, 1)}\n                            </div>\n                          </div>\n                        );\n                      })}\n                    </div>\n                  </div>\n                </div>\n\n                {/* Warning box */}\n                <div className=\"bg-rose-50/90 border border-rose-200 text-rose-800 rounded-xl p-2.5 text-[11px] leading-relaxed mt-2.5\">\n                  <span className=\"font-bold flex items-center gap-1 mb-0.5 text-rose-900\">\n                    ⚠️ Cảnh báo môn yếu / chưa có số:\n                  </span>\n                  <span className=\"text-rose-700 text-[10.5px]\">{alertText}</span>\n                </div>\n              </div>\n            );\n          })}\n        </div>\n      )}\n    </div>\n  );\n};\n","src/views/ThiDuaStView.tsx":"import React, { useState } from 'react';\nimport { Camera, Search } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatInt, formatPercent, formatProgramName } from '../utils/formatters';\n\ninterface ThiDuaStViewProps {\n  appData: AppDataState;\n  onExportTab: (storeLabel?: string) => void | Promise<void>;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n}\n\nexport const ThiDuaStView: React.FC<ThiDuaStViewProps> = ({\n  appData,\n  onExportTab,\n  onOpenProgramDetail,\n}) => {\n  const [activeStore, setActiveStore] = useState<'TGDD' | 'TOPZONE'>('TGDD');\n  const [searchTerm, setSearchTerm] = useState<string>('');\n  const [isExportMenuOpen, setIsExportMenuOpen] = useState<boolean>(false);\n\n  const waitForRender = () => new Promise<void>(resolve => setTimeout(resolve, 350));\n\n  const handleExportBothStores = async () => {\n    if (isExportMenuOpen === false) return;\n    const originalStore = activeStore;\n    setIsExportMenuOpen(false);\n    try {\n      setActiveStore('TGDD');\n      await waitForRender();\n      await onExportTab('TGDĐ');\n      await waitForRender();\n      setActiveStore('TOPZONE');\n      await waitForRender();\n      await onExportTab('TOPZONE');\n      await waitForRender();\n    } finally {\n      setActiveStore(originalStore);\n    }\n  };\n\n  const td_lk = appData.td_luyke || [];\n  const dt_lk = appData.dt_luyke || [];\n  const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();\n  // Quy ước quỹ thời gian Lũy kế: ngày hiện tại trừ 1 ngày.\n  // Không lấy 'SỐ NGÀY CỬA SỔ' từ Data BI vì có thể là ngày chốt dữ liệu cũ.\n  const daysElapsed = Math.max(0, Math.min(daysInMonth, new Date().getDate() - 1));\n  const progressPct = daysInMonth > 0 ? (daysElapsed / daysInMonth * 100) : 0;\n  const storeKeyword = activeStore === 'TGDD' ? 'TGD' : 'AAR';\n\n  let list = td_lk.filter(r => String(r['ĐƠN VỊ / NHÂN VIÊN']).includes(storeKeyword));\n  if (searchTerm) {\n    list = list.filter(r => {\n      const name = r['CHƯƠNG TRÌNH'] || '';\n      return (\n        name.toLowerCase().includes(searchTerm.toLowerCase()) ||\n        formatProgramName(name).toLowerCase().includes(searchTerm.toLowerCase())\n      );\n    });\n  }\n\n  // Sort by % HT\n  list.sort((a, b) => (parseFloat(String(b['% HT THÁNG'])) || 0) - (parseFloat(String(a['% HT THÁNG'])) || 0));\n\n  const totalPrograms = list.length;\n  let completedCount = 0;\n  let above50Count = 0;\n  let below50Count = 0;\n\n  list.forEach(r => {\n    const pct = parseFloat(String(r['% HT THÁNG'])) || 0;\n    if (pct >= 100) completedCount++;\n    if (pct >= 50) above50Count++;\n    else below50Count++;\n  });\n\n  const forecastPct = totalPrograms > 0 ? (completedCount / totalPrograms * 100).toFixed(1) : '0';\n\n  return (\n    <div className=\"space-y-6\">\n      {/* 1. Header Bar */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div className=\"flex items-center space-x-3\">\n          <span className=\"px-2.5 py-1 bg-slate-900 text-white font-black text-xs rounded-xl font-mono\">\n            {activeStore === 'TGDD' ? '933' : '10341'}\n          </span>\n          <div>\n            <h3 className=\"font-extrabold text-slate-900 text-base uppercase\">\n              BẢNG XẾP HẠNG THI ĐUA — Thi Đua Siêu Thị – {activeStore === 'TGDD' ? 'TGDĐ' : 'TOPZONE'}\n            </h3>\n            <p className=\"text-[11.5px] text-slate-500 font-medium flex items-center gap-1.5\">\n              <span>Cụm 933</span>\n              <span>•</span>\n              <span>351 Nguyễn Hữu Thọ</span>\n            </p>\n          </div>\n        </div>\n\n        <div className=\"flex items-center gap-3\">\n          <div className=\"flex rounded-xl bg-slate-100 p-1 text-xs font-bold shadow-inner\">\n            <button\n              onClick={() => setActiveStore('TGDD')}\n              className={`px-4 py-1.5 rounded-lg transition font-bold cursor-pointer ${\n                activeStore === 'TGDD' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600'\n              }`}\n            >\n              TGDĐ (24 môn)\n            </button>\n            <button\n              onClick={() => setActiveStore('TOPZONE')}\n              className={`px-4 py-1.5 rounded-lg transition font-bold cursor-pointer ${\n                activeStore === 'TOPZONE' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600'\n              }`}\n            >\n              TOPZONE (12 môn)\n            </button>\n          </div>\n          <div className=\"relative\">\n            <button\n              onClick={() => setIsExportMenuOpen(v => !v)}\n              className=\"px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-xs transition flex items-center gap-1.5 cursor-pointer\"\n              title=\"Chọn cách xuất ảnh\"\n            >\n              <Camera className=\"w-3.5 h-3.5\" />\n              <span>Xuất Ảnh</span>\n              <span className=\"text-[10px] ml-0.5\">▾</span>\n            </button>\n            {isExportMenuOpen && (\n              <>\n                <button\n                  type=\"button\"\n                  aria-label=\"Đóng menu xuất ảnh\"\n                  className=\"fixed inset-0 z-40 cursor-default\"\n                  onClick={() => setIsExportMenuOpen(false)}\n                />\n                <div className=\"absolute right-0 top-full mt-2 z-50 w-60 rounded-2xl bg-white border border-slate-200 shadow-xl p-1.5\">\n                  <button\n                    type=\"button\"\n                    onClick={async () => { setIsExportMenuOpen(false); await onExportTab(activeStore === 'TGDD' ? 'TGDĐ' : 'TOPZONE'); }}\n                    className=\"w-full text-left px-3 py-2.5 rounded-xl hover:bg-blue-50 text-slate-800 text-xs font-bold flex items-center gap-2 cursor-pointer\"\n                  >\n                    <Camera className=\"w-4 h-4 text-blue-600\" />\n                    <span>Xuất ảnh shop đang chọn</span>\n                  </button>\n                  <button\n                    type=\"button\"\n                    onClick={handleExportBothStores}\n                    className=\"w-full text-left px-3 py-2.5 rounded-xl hover:bg-emerald-50 text-slate-800 text-xs font-bold flex items-center gap-2 cursor-pointer\"\n                  >\n                    <span className=\"text-base\">🏪</span>\n                    <span>Xuất ảnh cả 2 shop</span>\n                  </button>\n                  <div className=\"px-3 pt-1 pb-1 text-[10px] text-slate-400\">TGDĐ + TOPZONE → 2 ảnh PNG riêng biệt</div>\n                </div>\n              </>\n            )}\n          </div>\n        </div>\n      </div>\n\n      {/* 2. Quỹ thời gian banner */}\n      <div className=\"bg-blue-50/80 border border-blue-200 rounded-xl p-3.5 flex items-center justify-between text-xs\">\n        <span className=\"font-bold text-blue-950\">Quỹ thời gian: {daysElapsed || 0} / {daysInMonth} NGÀY</span>\n        <span className=\"font-black text-blue-800\">Tiến độ chuẩn: {progressPct.toFixed(1)}%</span>\n      </div>\n\n      {/* 3. Action recommendations row */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3\">\n        <h4 className=\"font-extrabold text-slate-800 text-xs uppercase flex items-center gap-1.5\">\n          <span>⚡ Tập trung push mạnh về số thi đua – {activeStore === 'TGDD' ? 'TGDĐ' : 'TOPZONE'}</span>\n        </h4>\n\n        <div className=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5 text-xs\">\n          <div className=\"p-3.5 bg-rose-50/70 border border-rose-200 rounded-xl space-y-1\">\n            <span className=\"text-[11px] font-bold text-rose-900 block\">⚠️ MÔN ĐANG KÉO TỤT</span>\n            {list.filter(r => (parseFloat(String(r['% HT THÁNG'])) || 0) < 50).slice(-3).map((r,i) => (\n              <p key={i} className=\"text-rose-700 text-[11px]\">{formatProgramName(r['CHƯƠNG TRÌNH'] || '')}: <b>{formatPercent(parseFloat(String(r['% HT THÁNG'])) || 0)}</b></p>\n            ))}\n          </div>\n\n          <div className=\"p-3.5 bg-emerald-50/70 border border-emerald-200 rounded-xl space-y-1\">\n            <span className=\"text-[11px] font-bold text-emerald-900 block\">📈 MÔN BỨT PHÁ</span>\n            {list.slice(0,3).map((r,i) => (\n              <p key={i} className=\"text-emerald-800 text-[11px]\">{formatProgramName(r['CHƯƠNG TRÌNH'] || '')}: <b>{formatPercent(parseFloat(String(r['% HT THÁNG'])) || 0)}</b></p>\n            ))}\n          </div>\n\n          <div className=\"p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-center flex flex-col justify-center\">\n            <span className=\"text-[10px] text-slate-400 font-bold uppercase block\">🎯 DỰ BÁO THÁNG NÀY</span>\n            <span className=\"text-xl font-black text-emerald-600 block mt-1\">\n              {completedCount}/{totalPrograms}\n            </span>\n            <span className=\"text-[10.5px] text-slate-500 font-medium\">MÔN ĐẠT TARGET</span>\n          </div>\n\n          <div className=\"p-3.5 bg-amber-50/70 border border-amber-200 rounded-xl space-y-1\">\n            <span className=\"text-[11px] font-bold text-amber-900 block\">📋 ƯU TIÊN HÔM NAY</span>\n            <p className=\"text-amber-800 text-[10.5px]\">• Đẩy mạnh Mở thẻ tín dụng & Bảo hiểm</p>\n            <p className=\"text-amber-800 text-[10.5px]\">• Chốt thêm 2 Sim Vina/Mobi</p>\n            <p className=\"text-amber-800 text-[10.5px]\">• Duy trì tốc độ môn Android & Đồng hồ</p>\n          </div>\n        </div>\n      </div>\n\n      {/* 4. 5 Metric Summary Boxes */}\n      <div className=\"grid grid-cols-2 md:grid-cols-5 gap-3.5 text-white\">\n        <div className=\"bg-slate-900 rounded-2xl p-4 text-center shadow-xs\">\n          <span className=\"text-2xl font-black block\">{totalPrograms}</span>\n          <span className=\"text-[10px] text-slate-400 uppercase font-bold\">NGÀNH CÓ TARGET</span>\n        </div>\n        <div className=\"bg-emerald-600 rounded-2xl p-4 text-center shadow-xs\">\n          <span className=\"text-2xl font-black block\">{completedCount}</span>\n          <span className=\"text-[10px] text-emerald-100 uppercase font-bold\">SỐ MÔN VỀ SỐ</span>\n        </div>\n        <div className=\"bg-teal-600 rounded-2xl p-4 text-center shadow-xs\">\n          <span className=\"text-2xl font-black block\">{above50Count}</span>\n          <span className=\"text-[10px] text-teal-100 uppercase font-bold\">SỐ MÔN TRÊN 50%</span>\n        </div>\n        <div className=\"bg-rose-600 rounded-2xl p-4 text-center shadow-xs\">\n          <span className=\"text-2xl font-black block\">{below50Count}</span>\n          <span className=\"text-[10px] text-rose-100 uppercase font-bold\">SỐ MÔN DƯỚI 50%</span>\n        </div>\n        <div className=\"bg-purple-600 rounded-2xl p-4 text-center col-span-2 md:col-span-1 shadow-xs\">\n          <span className=\"text-2xl font-black block\">{forecastPct}%</span>\n          <span className=\"text-[10px] text-purple-100 uppercase font-bold\">TỈ LỆ DỰ KIẾN HT</span>\n        </div>\n      </div>\n\n      {/* 5. Detail Table */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n        <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2 border-b border-slate-100\">\n          <div>\n            <h4 className=\"font-black text-slate-900 text-sm uppercase flex items-center gap-2\">\n              <span>PUSH SỐ MÔN THI ĐUA {activeStore === 'TGDD' ? 'TGDĐ' : 'TOPZONE'}</span>\n            </h4>\n            <p className=\"text-[11px] text-slate-500\">\n              Theo dõi chi tiết Gap thiếu, mục tiêu và số lượng cần bán mỗi ngày\n            </p>\n          </div>\n          <div className=\"relative\">\n            <input\n              type=\"text\"\n              value={searchTerm}\n              onChange={(e) => setSearchTerm(e.target.value)}\n              placeholder=\"🔍 Tìm ngành hàng...\"\n              className=\"text-xs px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none w-48\"\n            />\n          </div>\n        </div>\n\n        <div className=\"overflow-x-auto custom-scroll\">\n          <table className=\"w-full text-left text-xs border-collapse\">\n            <thead className=\"bg-slate-50 text-slate-600 font-bold border-b border-slate-200\">\n              <tr>\n                <th className=\"py-2.5 px-3 text-center w-12\">#</th>\n                <th className=\"py-2.5 px-4\">NGÀNH HÀNG</th>\n                <th className=\"py-2.5 px-3 text-right\">HIỆN TẠI</th>\n                <th className=\"py-2.5 px-3 text-right text-rose-600\">GAP (THIẾU)</th>\n                <th className=\"py-2.5 px-3 text-right\">MỤC TIÊU</th>\n                <th className=\"py-2.5 px-4 text-center w-36\">TIẾN ĐỘ HT</th>\n                <th className=\"py-2.5 px-3 text-right\">DỰ KIẾN HT</th>\n                <th className=\"py-2.5 px-3 text-center\">SỐ/NGÀY</th>\n              </tr>\n            </thead>\n            <tbody className=\"divide-y divide-slate-100 text-slate-700\">\n              {list.map((r, idx) => {\n                const ten = r['CHƯƠNG TRÌNH'] || '';\n                const loai = Number(r['LOẠI TĐ']) || 3;\n                const isQty = loai === 2 || loai === 6;\n                const thuc = isQty ? (parseFloat(String(r['SỐ LƯỢNG'])) || 0) : (parseFloat(String(r['DOANH THU (TR)'])) || 0);\n                const target = parseFloat(String(r['TARGET (TR/SL theo LOẠI TĐ)'])) || 0;\n                const pctLk = parseFloat(String(r['% HT THÁNG'])) || 0;\n                const pctDu = parseFloat(String(r['% DỰ BÁO'])) || (pctLk * (daysInMonth / Math.max(1, daysElapsed)));\n                const gap = Math.max(0, target - thuc);\n                const isCompleted = pctLk >= 100;\n                const remainingDays = Math.max(1, daysInMonth - daysElapsed);\n                const soNgay = isCompleted ? '✓ XONG' : (gap / remainingDays).toFixed(1) + '/NGÀY';\n\n                let rankBadge = (\n                  <span className=\"text-slate-400 font-mono text-[11px]\">{idx + 1}</span>\n                );\n                if (idx === 0) rankBadge = <span className=\"text-base\">🥇</span>;\n                else if (idx === 1) rankBadge = <span className=\"text-base\">🥈</span>;\n                else if (idx === 2) rankBadge = <span className=\"text-base\">🥉</span>;\n\n                return (\n                  <tr\n                    key={idx}\n                    onClick={() => onOpenProgramDetail(activeStore, r['MÃ CHƯƠNG TRÌNH'], ten)}\n                    title=\"Bấm để xem chi tiết nhân viên bán môn này\"\n                    className={`hover:bg-blue-50/60 cursor-pointer transition border-b border-slate-100 ${\n                      isCompleted ? 'bg-emerald-50/20' : ''\n                    }`}\n                  >\n                    <td className=\"py-2.5 px-3 text-center\">{rankBadge}</td>\n                    <td className=\"py-2.5 px-4 font-bold text-slate-900\" title={ten}>\n                      {formatProgramName(ten)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-right font-mono font-semibold text-slate-800\">\n                      {isQty ? formatInt(thuc) : formatCurrency(thuc)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-right font-mono font-semibold text-rose-600\">\n                      {isQty ? formatInt(gap) : formatCurrency(gap)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-right font-mono text-slate-500\">\n                      {isQty ? formatInt(target) : formatCurrency(target)}\n                    </td>\n                    <td className=\"py-2.5 px-4 text-center\">\n                      <div className=\"flex items-center justify-center gap-2\">\n                        <div className=\"w-16 bg-slate-200 h-1.5 rounded-full overflow-hidden\">\n                          <div\n                            className={`${isCompleted ? 'bg-emerald-500' : 'bg-blue-600'} h-full`}\n                            style={{ width: `${Math.min(pctLk, 100)}%` }}\n                          ></div>\n                        </div>\n                        <span\n                          className={`font-bold text-xs ${\n                            isCompleted ? 'text-emerald-700' : 'text-blue-700'\n                          }`}\n                        >\n                          {formatPercent(pctLk)}\n                        </span>\n                      </div>\n                    </td>\n                    <td className=\"py-2.5 px-3 text-right font-mono text-slate-600\">\n                      {formatPercent(pctDu)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-center\">\n                      <span\n                        className={`px-2 py-0.5 rounded font-black text-[10px] ${\n                          isCompleted ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'\n                        }`}\n                      >\n                        {soNgay}\n                      </span>\n                    </td>\n                  </tr>\n                );\n              })}\n            </tbody>\n          </table>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/utils/forecastEngine.ts":"export interface ForecastResult {\n  forecast: number;\n  forecastPct: number;\n  remainingGap: number;\n  requiredPerDay: number;\n  runRatePerDay: number;\n}\n\nexport function calculateForecast(current: number, target: number, daysPassed: number, totalDays: number, targetMultiplier = 100): ForecastResult {\n  const safeCurrent = Number.isFinite(current) ? current : 0;\n  const safeTarget = Number.isFinite(target) ? target : 0;\n  const d = Math.max(1, Math.min(Math.round(daysPassed || 1), Math.max(1, Math.round(totalDays || 1))));\n  const days = Math.max(d, Math.round(totalDays || d));\n  const runRatePerDay = safeCurrent / d;\n  const forecast = runRatePerDay * days;\n  const forecastPct = safeTarget > 0 ? forecast / safeTarget * 100 : 0;\n  const adjustedTarget = safeTarget * (Math.max(0, targetMultiplier) / 100);\n  const remainingDays = Math.max(1, days - d);\n  const remainingGap = Math.max(0, adjustedTarget - safeCurrent);\n  const requiredPerDay = remainingGap / remainingDays;\n  return { forecast, forecastPct, remainingGap, requiredPerDay, runRatePerDay };\n}\n","src/utils/dataValidation.ts":"import { AppDataState } from '../types';\n\nexport interface ValidationResult { errors: string[]; warnings: string[]; }\n\nconst num = (v: any) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };\n\nexport function validateAppData(data: Partial<AppDataState> | null | undefined): ValidationResult {\n  const errors: string[] = [];\n  const warnings: string[] = [];\n  const d: any = data || {};\n  const storeRows = [...(d.dt_luyke || []), ...(d.dt_realtime || [])];\n  const seenStores = new Set<string>();\n  storeRows.forEach((r: any, i: number) => {\n    const code = String(r['MÃ ĐƠN VỊ'] || '').trim();\n    if (!code) errors.push(`Doanh thu ST dòng ${i + 1}: thiếu MÃ ĐƠN VỊ.`);\n    else if (seenStores.has(code)) warnings.push(`Mã siêu thị ${code} xuất hiện nhiều hơn một lần trong dữ liệu.`);\n    seenStores.add(code);\n    ['TARGET (TR)','TARGET QĐ (TR)','DOANH THU (TR)','DOANH THU QĐ (TR)'].forEach(k => { if (num(r[k]) < 0) errors.push(`${code}: ${k} không được âm.`); });\n    const target = num(r['TARGET (TR)']); const dt = num(r['DOANH THU (TR)']);\n    if (target === 0 && dt > 0) warnings.push(`${code}: có doanh thu nhưng TARGET bằng 0.`);\n    if (target > 0 && dt > target * 2.5) warnings.push(`${code}: doanh thu cao bất thường so với TARGET, hãy kiểm tra đơn vị/số liệu.`);\n    const days = num(r['SỐ NGÀY CỬA SỔ']);\n    if (days < 0 || days > 31) errors.push(`${code}: SỐ NGÀY CỬA SỔ không hợp lệ.`);\n  });\n  const employeeRows = [...(d.dt_nv_luyke || []), ...(d.dt_nv_realtime || [])];\n  employeeRows.forEach((r: any, i: number) => {\n    if (!String(r['TÊN NHÂN VIÊN'] || '').trim()) warnings.push(`Doanh thu NV dòng ${i + 1}: thiếu tên nhân viên.`);\n    ['DOANH THU (TR)','DOANH THU QĐ (TR)'].forEach(k => { if (num(r[k]) < 0) errors.push(`Doanh thu NV dòng ${i + 1}: ${k} không được âm.`); });\n  });\n  const compRows = [...(d.td_luyke || []), ...(d.td_realtime || []), ...(d.nv_tgdd || []), ...(d.nv_tz || [])];\n  compRows.forEach((r: any, i: number) => {\n    // BI có thể trả về doanh thu âm do điều chỉnh/hoàn trừ ở một số chương trình.\n    // Vì vậy không chặn toàn bộ lần import chỉ vì DOANH THU/DT QUY ĐỔI âm.\n    // Chỉ TARGET và SỐ LƯỢNG âm mới là lỗi dữ liệu nghiêm trọng.\n    ['TARGET (TR/SL theo LOẠI TĐ)','SỐ LƯỢNG'].forEach(k => { if (num(r[k]) < 0) errors.push(`Thi đua dòng ${i + 1}: ${k} không được âm.`); });\n  });\n  return { errors: [...new Set(errors)].slice(0, 30), warnings: [...new Set(warnings)].slice(0, 50) };\n}\n","src/components/OperationalPulse.tsx":"import React, { useState } from 'react';\nimport { AlertTriangle, CheckCircle2, TrendingUp, Users, ArrowRight, Store, Trophy, Database, Clock, Target, Zap } from 'lucide-react';\nimport { AppDataState, PersonnelConfigMap, ViewType } from '../types';\nimport { formatCurrency, formatPercent } from '../utils/formatters';\nimport { calculateForecast } from '../utils/forecastEngine';\nimport { DashboardView } from '../views/DashboardView';\n\nconst num = (v:any) => Number(v) || 0;\nconst pct = (a:number,b:number) => b > 0 ? a / b * 100 : 0;\n\nexport const OperationalPulse: React.FC<{appData: AppDataState; personnelConfig: PersonnelConfigMap; onNavigate?: (view: ViewType) => void; onUpdateSlot?: (slot: keyof AppDataState, data: any[]) => void; onClearAll?: () => void}> = ({appData, personnelConfig, onNavigate, onUpdateSlot, onClearAll}) => {\n  const [showEmbeddedDataInput, setShowEmbeddedDataInput] = useState(false);\n  const lk = (appData.dt_luyke || []).filter((r:any) => String(r['MÃ ĐƠN VỊ'] || '').trim());\n  const rt = (appData.dt_realtime || []).filter((r:any) => String(r['MÃ ĐƠN VỊ'] || '').trim());\n  const td = [...(appData.td_luyke || []), ...(appData.td_realtime || [])];\n  const emp = [...(appData.dt_nv_luyke || []), ...(appData.dt_nv_realtime || [])].filter((r:any) => String(r['TÊN NHÂN VIÊN'] || r['ĐƠN VỊ / NHÂN VIÊN'] || '').trim());\n\n  const target = lk.reduce((s:number,r:any)=>s+(num(r['TARGET QĐ (TR)'])||num(r['TARGET (TR)'])),0);\n  const actual = lk.reduce((s:number,r:any)=>s+num(r['DOANH THU QĐ (TR)']),0);\n  const rtActual = rt.reduce((s:number,r:any)=>s+num(r['DOANH THU QĐ (TR)']),0);\n  const rtQd = rt.reduce((s:number,r:any)=>s+num(r['DOANH THU QĐ (TR)']),0);\n  const now = new Date();\n  const totalDays = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();\n  const day = now.getDate();\n  const daysElapsed = Math.max(1, Math.min(totalDays, day));\n  const f = calculateForecast(actual, target, Math.max(0, day - 1), totalDays);\n  const progressPct = pct(actual,target);\n  const dailyRunRate = actual / daysElapsed;\n  const remaining = Math.max(0,target-actual);\n  const neededPerDay = remaining / Math.max(1,totalDays-day);\n\n  const staffMap = new Map<string, any>();\n  emp.forEach((r:any) => {\n    const name = String(r['TÊN NHÂN VIÊN'] || r['ĐƠN VỊ / NHÂN VIÊN'] || '').trim();\n    if (!name) return;\n    const prev = staffMap.get(name) || { name, revenue:0, qd:0, qty:0, pct:0 };\n    prev.revenue += num(r['DOANH THU (TR)']);\n    prev.qd += num(r['DOANH THU QĐ (TR)']) || num(r['DT QUY ĐỔI (TR)']);\n    prev.qty += num(r['SỐ LƯỢNG']);\n    prev.pct = Math.max(prev.pct, num(r['% HT THÁNG']));\n    staffMap.set(name, prev);\n  });\n  const topStaff = [...staffMap.values()].sort((a,b)=>b.qd-a.qd).slice(0,5);\n\n  const configuredStaff = Object.values(personnelConfig || {}).reduce((n:any,x:any)=>n+Object.values(x||{}).filter((c:any)=>c?.isOfficial!==false&&c?.isVisible!==false).length,0);\n\n  const shops = [\n    { code:'933', name:'TGDĐ', row: lk.find((r:any)=>String(r['MÃ ĐƠN VỊ']).trim()==='933' || /TGD/i.test(String(r['TÊN ĐƠN VỊ']||''))) },\n    { code:'10341', name:'TopZone', row: lk.find((r:any)=>String(r['MÃ ĐƠN VỊ']).trim()==='10341' || /AAR|TOPZONE/i.test(String(r['TÊN ĐƠN VỊ']||''))) },\n  ].map(x=>({ ...x, target:num(x.row?.['TARGET QĐ (TR)'])||num(x.row?.['TARGET (TR)']), actual:num(x.row?.['DOANH THU QĐ (TR)']) }));\n\n  const alerts:string[]=[];\n  if (!lk.length) alerts.push('Chưa có dữ liệu Doanh Thu Lũy Kế — hãy bấm “Nhập / Dán Data”.');\n  if (lk.length && target>0 && f.forecastPct < 100) alerts.push(`Dự báo cuối tháng ${formatPercent(f.forecastPct,0)} target — cần tăng tốc để đạt kế hoạch.`);\n  shops.forEach(s=>{ if(s.row && s.target>0 && pct(s.actual,s.target) < Math.max(40, progressPct-15)) alerts.push(`${s.code} ${s.name} đang thấp hơn nhịp chung của cụm.`); });\n  if (rt.length && rtActual===0) alerts.push('Có bảng Realtime nhưng doanh thu quy đổi hiện tại đang bằng 0 — kiểm tra cột dữ liệu.');\n\n  const dataBlocks = [\n    ['DT Lũy kế', appData.dt_luyke?.length || 0],\n    ['DT Realtime', appData.dt_realtime?.length || 0],\n    ['Thi đua ST', (appData.td_luyke?.length || 0)+(appData.td_realtime?.length || 0)],\n    ['Thi đua NV', (appData.nv_tgdd?.length || 0)+(appData.nv_tz?.length || 0)],\n    ['DT Nhân viên', (appData.dt_nv_luyke?.length || 0)+(appData.dt_nv_realtime?.length || 0)],\n  ];\n  const loadedBlocks = dataBlocks.filter(x=>Number(x[1])>0).length;\n\n  return <div className=\"space-y-5\">\n    <section className=\"bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden\">\n      <div className=\"px-6 py-5 bg-gradient-to-r from-white via-blue-50/40 to-indigo-50/50 border-b border-slate-100\">\n        <div className=\"flex flex-wrap items-center justify-between gap-4\">\n          <div>\n            <div className=\"text-[11px] font-black uppercase tracking-[0.16em] text-blue-600 flex items-center gap-2\"><span className=\"w-2 h-2 rounded-full bg-blue-600 animate-pulse\"/>TRUNG TÂM ĐIỀU HÀNH</div>\n            <h1 className=\"text-2xl md:text-3xl font-black text-slate-900 mt-1\">Sức khỏe cụm hôm nay</h1>\n            <p className=\"text-xs text-slate-500 mt-1\">Tổng hợp trực tiếp từ các bảng Data anh đã nạp · Ngày {day}/{totalDays}</p>\n          </div>\n          <div className=\"flex items-center gap-2 flex-wrap justify-end\">\n            <span className=\"px-3 py-2 rounded-xl bg-white border border-slate-200 text-[11px] font-bold text-slate-600 shadow-sm flex items-center gap-1.5\"><Clock className=\"w-3.5 h-3.5\"/> Cập nhật theo phiên</span>\n            <button type=\"button\" onClick={()=>setShowEmbeddedDataInput(true)} className=\"px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 text-[11px] font-black shadow-sm flex items-center gap-1.5 transition cursor-pointer\" title=\"Nhập riêng từng loại dữ liệu khi cổng tự động không nhận diện được\">\n              <Database className=\"w-3.5 h-3.5\"/> Cổng nhập Data riêng\n            </button>\n            <button onClick={()=>onNavigate?.(ViewType.DU_BAO)} className=\"px-3 py-2 rounded-xl bg-blue-600 text-white text-[11px] font-black shadow-sm hover:bg-blue-700 flex items-center gap-1.5\">Mở dự báo <ArrowRight className=\"w-3.5 h-3.5\"/></button>\n          </div>\n        </div>\n      </div>\n\n      <div className=\"p-5 md:p-6 space-y-5\">\n        <div className=\"grid grid-cols-2 xl:grid-cols-6 gap-3\">\n          <div className=\"rounded-2xl bg-blue-50 border border-blue-100 p-4 xl:col-span-2\"><div className=\"text-[10px] font-black text-blue-600 uppercase\">Doanh thu QĐ lũy kế</div><div className=\"text-2xl font-black text-blue-950 mt-1\">{formatCurrency(actual,1)} TR</div><div className=\"text-[10px] text-blue-700 mt-1\">Target {formatCurrency(target,1)} TR</div><div className=\"mt-3 h-2 bg-white rounded-full overflow-hidden\"><div className=\"h-full bg-blue-600 rounded-full\" style={{width:`${Math.min(100,progressPct)}%`}}/></div><div className=\"text-[10px] font-bold text-blue-700 mt-1\">{formatPercent(progressPct,1)} hoàn thành</div></div>\n          <div className=\"rounded-2xl bg-emerald-50 border border-emerald-100 p-4\"><div className=\"text-[10px] font-black text-emerald-600 uppercase\">Nhịp hiện tại</div><div className=\"text-2xl font-black text-emerald-950 mt-1\">{formatPercent(pct(actual,target),0)}</div><div className=\"text-[10px] text-emerald-700 mt-1\">Ngày {day}/{totalDays}</div></div>\n          <div className=\"rounded-2xl bg-violet-50 border border-violet-100 p-4\"><div className=\"text-[10px] font-black text-violet-600 uppercase\">Dự báo cuối tháng</div><div className=\"text-2xl font-black text-violet-950 mt-1\">{formatPercent(f.forecastPct,0)}</div><div className=\"text-[10px] text-violet-700 mt-1\">{formatCurrency(f.forecast,0)} TR</div></div>\n          <div className=\"rounded-2xl bg-amber-50 border border-amber-100 p-4\"><div className=\"text-[10px] font-black text-amber-600 uppercase\">Nhân sự KPI</div><div className=\"text-2xl font-black text-amber-950 mt-1\">{configuredStaff}</div><div className=\"text-[10px] text-amber-700 mt-1\">đang theo dõi</div></div>\n          <div className=\"rounded-2xl bg-slate-50 border border-slate-200 p-4\"><div className=\"text-[10px] font-black text-slate-500 uppercase\">Realtime QĐ</div><div className=\"text-2xl font-black text-slate-900 mt-1\">{formatCurrency(rtQd,1)} TR</div><div className=\"text-[10px] text-slate-500 mt-1\">{rt.length} dòng</div></div>\n        </div>\n\n        <div className=\"grid lg:grid-cols-3 gap-4\">\n          <div className=\"lg:col-span-2 rounded-2xl border border-slate-200 overflow-hidden\">\n            <div className=\"px-4 py-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between\"><div className=\"font-black text-sm flex items-center gap-2\"><Store className=\"w-4 h-4 text-blue-600\"/>Sức khỏe từng siêu thị</div><button onClick={()=>onNavigate?.(ViewType.DOANH_THU_ST)} className=\"text-[11px] font-bold text-blue-600\">Xem chi tiết →</button></div>\n            <div className=\"divide-y divide-slate-100\">{shops.map(s=><div key={s.code} className=\"p-4 grid grid-cols-[1fr_auto] gap-4 items-center\"><div><div className=\"flex items-center gap-2\"><span className=\"px-2 py-0.5 rounded-md bg-slate-100 text-[10px] font-black\">SHOP {s.code}</span><span className=\"font-black text-sm text-slate-800\">{s.name}</span></div><div className=\"mt-2 h-2 bg-slate-100 rounded-full overflow-hidden\"><div className=\"h-full bg-blue-500 rounded-full\" style={{width:`${Math.min(100,pct(s.actual,s.target))}%`}}/></div><div className=\"text-[10px] text-slate-500 mt-1\">{formatCurrency(s.actual,1)} / {formatCurrency(s.target,1)} TR quy đổi</div></div><div className=\"text-right\"><div className=\"text-xl font-black text-slate-900\">{s.target?formatPercent(pct(s.actual,s.target),0):'—'}</div><div className=\"text-[10px] font-bold text-slate-400\">HT Target</div></div></div>)}</div>\n          </div>\n\n          <div className=\"rounded-2xl border border-slate-200 overflow-hidden\">\n            <div className=\"px-4 py-3 bg-slate-50 border-b border-slate-200 flex items-center gap-2 font-black text-sm\"><Target className=\"w-4 h-4 text-indigo-600\"/>Áp lực cuối tháng</div>\n            <div className=\"p-4 space-y-4\"><div><div className=\"flex justify-between text-[11px] font-bold text-slate-600\"><span>Còn thiếu</span><span className=\"text-indigo-700\">{formatCurrency(remaining,1)} TR</span></div><div className=\"text-[10px] text-slate-400 mt-1\">Để chạm Target QĐ</div></div><div className=\"p-3 rounded-xl bg-indigo-50 border border-indigo-100\"><div className=\"text-[10px] font-black text-indigo-600 uppercase\">Cần bình quân mỗi ngày còn lại</div><div className=\"text-xl font-black text-indigo-950 mt-1\">{formatCurrency(neededPerDay,1)} TR/ngày</div></div><div className=\"p-3 rounded-xl bg-slate-50 border border-slate-200\"><div className=\"text-[10px] font-black text-slate-500 uppercase\">Run-rate hiện tại</div><div className=\"text-xl font-black text-slate-900 mt-1\">{formatCurrency(dailyRunRate,1)} TR/ngày</div></div></div>\n          </div>\n        </div>\n\n        <div className=\"grid lg:grid-cols-2 gap-4\">\n          <div className=\"rounded-2xl border border-slate-200 overflow-hidden\">\n            <div className=\"px-4 py-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between\"><div className=\"font-black text-sm flex items-center gap-2\"><Users className=\"w-4 h-4 text-emerald-600\"/>Top nhân viên theo DT QĐ</div><button onClick={()=>onNavigate?.(ViewType.SUC_KHOE_NV)} className=\"text-[11px] font-bold text-blue-600\">Mở BXH →</button></div>\n            <div className=\"p-3\">{topStaff.length ? topStaff.map((x,i)=><div key={x.name} className=\"flex items-center gap-3 p-2.5 rounded-xl hover:bg-slate-50\"><div className=\"w-7 h-7 rounded-lg bg-slate-100 flex items-center justify-center text-[11px] font-black\">{i+1}</div><div className=\"min-w-0 flex-1\"><div className=\"text-xs font-black text-slate-800 truncate\">{x.name}</div><div className=\"text-[10px] text-slate-400\">{x.qty.toLocaleString('vi-VN')} SL · HT {formatPercent(x.pct,0)}</div></div><div className=\"text-xs font-black text-emerald-700\">{formatCurrency(x.qd,1)} TR</div></div>) : <div className=\"py-8 text-center text-xs text-slate-400\">Chưa có dữ liệu doanh thu nhân viên.</div>}</div>\n          </div>\n\n          <div className=\"rounded-2xl border border-slate-200 overflow-hidden\">\n            <div className=\"px-4 py-3 bg-slate-50 border-b border-slate-200 flex items-center gap-2 font-black text-sm\"><Trophy className=\"w-4 h-4 text-amber-500\"/>Thi đua & dữ liệu hệ thống</div>\n            <div className=\"p-4 grid grid-cols-2 gap-3\">{[\n              ['Thi đua ST', (appData.td_luyke?.length||0)+(appData.td_realtime?.length||0)],\n              ['Thi đua NV', (appData.nv_tgdd?.length||0)+(appData.nv_tz?.length||0)],\n              ['DT nhân viên', (appData.dt_nv_luyke?.length||0)+(appData.dt_nv_realtime?.length||0)],\n              ['Cổng dữ liệu', loadedBlocks + '/5'],\n            ].map(([label,value])=><div key={String(label)} className=\"rounded-xl bg-white border border-slate-200 p-3\"><div className=\"text-[10px] font-bold text-slate-400 uppercase\">{label}</div><div className=\"text-lg font-black text-slate-900 mt-1\">{value}</div></div>)}</div>\n            <div className=\"px-4 pb-4\"><div className=\"flex items-center gap-2 text-[11px] font-bold text-slate-500 mb-2\"><Database className=\"w-3.5 h-3.5\"/>Tình trạng nạp dữ liệu</div><div className=\"flex flex-wrap gap-1.5\">{dataBlocks.map(([label,value])=><span key={String(label)} className={`px-2 py-1 rounded-lg text-[10px] font-bold border ${Number(value)>0?'bg-emerald-50 border-emerald-200 text-emerald-700':'bg-slate-50 border-slate-200 text-slate-400'}`}>{Number(value)>0?'✓':'○'} {label}: {value}</span>)}</div></div>\n          </div>\n        </div>\n\n        <div className={`rounded-2xl border p-4 ${alerts.length?'bg-amber-50/70 border-amber-200':'bg-emerald-50/60 border-emerald-200'}`}>\n          <div className=\"flex items-center justify-between gap-3\"><div className=\"flex items-center gap-2 font-black text-sm\"><AlertTriangle className={`w-4 h-4 ${alerts.length?'text-amber-600':'text-emerald-600'}`}/>CẢNH BÁO / VIỆC CẦN LÀM</div><button onClick={()=>onNavigate?.(ViewType.BAO_CAO_CUOI_NGAY)} className=\"text-[11px] font-black text-blue-600\">Mở báo cáo cuối ngày →</button></div>\n          {alerts.length ? <div className=\"mt-2 space-y-1.5\">{alerts.slice(0,5).map((a,i)=><div key={i} className=\"text-xs font-semibold text-slate-700 flex gap-2\"><span className=\"text-amber-600\">•</span>{a}</div>)}</div> : <div className=\"mt-2 text-xs font-bold text-emerald-700 flex items-center gap-2\"><CheckCircle2 className=\"w-4 h-4\"/>Dữ liệu hiện tại chưa phát hiện cảnh báo lớn.</div>}\n        </div>\n\n        <div className=\"flex flex-wrap gap-2 pt-1\"><button onClick={()=>onNavigate?.(ViewType.THI_DUA_ST)} className=\"px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 text-[11px] font-black flex items-center gap-1.5\"><Trophy className=\"w-3.5 h-3.5\"/>Thi đua siêu thị</button><button onClick={()=>onNavigate?.(ViewType.SUC_KHOE_CUM)} className=\"px-3 py-2 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 text-[11px] font-black flex items-center gap-1.5\"><TrendingUp className=\"w-3.5 h-3.5\"/>Sức khỏe cụm</button><button onClick={()=>onNavigate?.(ViewType.SO_SANH)} className=\"px-3 py-2 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 text-[11px] font-black flex items-center gap-1.5\"><Zap className=\"w-3.5 h-3.5\"/>So sánh hiệu suất</button></div>\n      </div>\n    </section>\n\n    {showEmbeddedDataInput && (\n      <div className=\"fixed inset-0 z-[60] bg-slate-950/65 backdrop-blur-sm flex items-center justify-center p-3 md:p-5\">\n        <div className=\"relative w-full max-w-[1500px] h-[94vh] bg-slate-100 rounded-3xl shadow-2xl border border-white/20 overflow-hidden\">\n          <div className=\"absolute top-3 right-3 z-[70] flex items-center gap-2\">\n            <span className=\"hidden md:inline-flex px-3 py-1.5 rounded-xl bg-slate-900/80 text-white text-[10px] font-bold shadow-lg\">CỔNG NHẬP DATA RIÊNG</span>\n            <button type=\"button\" onClick={()=>setShowEmbeddedDataInput(false)} className=\"w-9 h-9 rounded-xl bg-white text-slate-700 border border-slate-200 shadow-lg hover:bg-slate-50 font-black text-lg cursor-pointer\" title=\"Đóng cổng nhập Data\">×</button>\n          </div>\n          <div className=\"h-full overflow-y-auto custom-scroll p-2 md:p-4\">\n            <DashboardView\n              appData={appData}\n              onSelectView={onNavigate}\n              onUpdateSlot={(slot, data)=>onUpdateSlot?.(slot, data)}\n              onClearSlot={(slot)=>onUpdateSlot?.(slot, [])}\n              onClearAll={onClearAll}\n            />\n          </div>\n        </div>\n      </div>\n    )}\n  </div>;\n};\n","src/views/DailyProgressView.tsx":"import React from 'react';\nimport { CalendarDays, TrendingUp, AlertCircle } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatPercent } from '../utils/formatters';\n\nexport const DailyProgressView: React.FC<{appData: AppDataState; dailySnapshots:any[]; onRefresh:()=>void}> = ({appData,dailySnapshots,onRefresh}) => {\n const rows=[...(dailySnapshots||[])].sort((a,b)=>String(a.date).localeCompare(String(b.date)));\n const current=rows[rows.length-1];\n const prev=rows[rows.length-2];\n const delta=current&&prev?current.pct-prev.pct:0;\n return <div className=\"space-y-6\">\n  <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex items-center justify-between gap-3\"><div><h3 className=\"text-lg font-black text-slate-900 flex items-center gap-2\"><CalendarDays className=\"w-5 h-5 text-blue-600\"/>THEO DÕI TIẾN ĐỘ TỪNG NGÀY</h3><p className=\"text-xs text-slate-500\">Lưu snapshot cuối cùng của mỗi ngày để nhìn xu hướng và phát hiện ngày tụt tốc.</p></div><button onClick={onRefresh} className=\"px-3 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold\">Cập nhật hôm nay</button></div>\n  <div className=\"grid grid-cols-2 md:grid-cols-4 gap-4\"><div className=\"bg-white rounded-2xl border p-4\"><div className=\"text-[10px] font-bold text-slate-500\">NGÀY GẦN NHẤT</div><div className=\"text-xl font-black\">{current?.date||'—'}</div></div><div className=\"bg-white rounded-2xl border p-4\"><div className=\"text-[10px] font-bold text-slate-500\">DOANH THU QĐ</div><div className=\"text-xl font-black\">{current?formatCurrency(current.achieved,1)+' TR':'—'}</div></div><div className=\"bg-white rounded-2xl border p-4\"><div className=\"text-[10px] font-bold text-slate-500\">% TARGET</div><div className=\"text-xl font-black\">{current?formatPercent(current.pct,1):'—'}</div></div><div className=\"bg-white rounded-2xl border p-4\"><div className=\"text-[10px] font-bold text-slate-500\">BIẾN ĐỘNG</div><div className={\"text-xl font-black \"+(delta>=0?'text-emerald-600':'text-rose-600')}>{current?formatPercent(delta,1):'—'}</div></div></div>\n  <div className=\"bg-white rounded-2xl border border-slate-200 overflow-hidden\"><div className=\"p-4 border-b font-black text-sm\">LỊCH SỬ TIẾN ĐỘ</div>{rows.length?<div className=\"overflow-auto\"><table className=\"w-full text-xs\"><thead className=\"bg-slate-50\"><tr><th className=\"p-3 text-left\">Ngày</th><th className=\"p-3 text-right\">Doanh thu QĐ</th><th className=\"p-3 text-right\">Target</th><th className=\"p-3 text-right\">% HT</th><th className=\"p-3 text-right\">So với ngày trước</th></tr></thead><tbody>{rows.slice().reverse().map((r:any,i:number)=>{const before=rows[rows.indexOf(r)-1];const d=before?r.pct-before.pct:0;return <tr key={r.date} className=\"border-t\"><td className=\"p-3 font-bold\">{r.date}</td><td className=\"p-3 text-right\">{formatCurrency(r.achieved,1)} TR</td><td className=\"p-3 text-right\">{formatCurrency(r.target,1)} TR</td><td className=\"p-3 text-right font-black\">{formatPercent(r.pct,1)}</td><td className={\"p-3 text-right font-bold \"+(d>=0?'text-emerald-600':'text-rose-600')}>{formatPercent(d,1)}</td></tr>})}</tbody></table></div>:<div className=\"p-8 text-center text-xs text-slate-500\"><AlertCircle className=\"w-6 h-6 mx-auto mb-2\"/>Chưa có snapshot. Hãy nạp dữ liệu và bấm cập nhật hôm nay.</div>}</div>\n </div>;\n};\n"}</script>
<script>
  (function () {
    'use strict';
    const files = JSON.parse(document.getElementById('embedded-source').textContent);
    const modules = Object.create(null);
    const cache = Object.create(null);

    function stripQuery(p) { return p.split('?')[0].split('#')[0]; }
    function normalizePath(p) {
      const parts=[];
      for (const x of p.split('/')) {
        if (!x || x==='.') continue;
        if (x==='..') parts.pop(); else parts.push(x);
      }
      return parts.join('/');
    }
    function resolve(from, req) {
      req=stripQuery(req);
      if (req==='react') return '@@react';
      if (req==='react-dom/client') return '@@react-dom-client';
      if (req==='lucide-react') return '@@lucide-react';
      if (req==='xlsx') return '@@xlsx';
      if (req==='chart.js') return '@@chart';
      if (req==='html-to-image') return '@@html-to-image';
      if (req==='html2canvas-pro') return '@@html2canvas-pro';
      if (req.endsWith('.css')) return '@@empty';
      if (req.startsWith('/')) req=req.slice(1);
      else req=normalizePath(from.split('/').slice(0,-1).concat(req).join('/'));
      if (files[req]) return req;
      for (const ext of ['.ts','.tsx','.js']) if (files[req+ext]) return req+ext;
      if (files[req+'/index.ts']) return req+'/index.ts';
      if (files[req+'/index.tsx']) return req+'/index.tsx';
      throw new Error('Không tìm thấy module: '+req+' (từ '+from+')');
    }

    const externals = {
      '@@react': () => window.React,
      '@@react-dom-client': () => window.ReactDOM,
      // The standalone build intentionally does not depend on lucide-react.
      // Return lightweight React icon components for every requested icon name.
      // This avoids UMD/React-version incompatibilities when opening index.html directly.
      '@@lucide-react': () => {
        const iconMap = {
          Camera: '📷', Sparkles: '✨', Save: '💾', CheckCircle2: '✓', CheckCircle: '✓',
          Menu: '☰', Settings: '⚙', Bot: '🤖', History: '↶', Loader2: '◌', Images: '▧',
          Trash2: '🗑', X: '×', Download: '↓', Copy: '⧉', Check: '✓', ExternalLink: '↗',
          Image: '▧', ImageIcon: '▧', RefreshCw: '↻', Palette: '🎨', Crosshair: '⌖',
          Eye: '◉', EyeOff: '⊘', Search: '⌕', BarChart3: '▥', Table2: '▤', Trophy: '🏆',
          ArrowRightLeft: '↔', AlertCircle: '⚠', Clock: '◷', Plus: '+', RotateCcw: '↺',
          ShieldCheck: '✓', UserCheck: '✓', TrendingUp: '↗', Calendar: '□'
        };
        return new Proxy({}, { get: (_, name) => function StandaloneIcon(props) {
          const { size=18, strokeWidth, className='', style, ...rest } = props || {};
          return React.createElement('span', {
            ...rest,
            className: ('inline-flex items-center justify-center leading-none ' + className).trim(),
            style: { fontSize: typeof size === 'number' ? size : undefined, width: size, height: size, ...style },
            'aria-hidden': 'true'
          }, iconMap[name] || '•');
        }});
      },
      '@@xlsx': () => window.XLSX,
      '@@chart': () => ({ Chart: window.Chart, registerables: [] }),
      '@@html-to-image': () => window.htmlToImage,
      '@@html2canvas-pro': () => window.html2canvasPro || window.html2canvas || window.html2Canvas,
      '@@empty': () => ({})
    };

    function makeModule(id) {
      if (modules[id]) return modules[id];
      if (externals[id]) {
        const value=externals[id]();
        modules[id]={exports:value};
        return modules[id];
      }
      const mod={exports:{}};
      modules[id]=mod;
      let code=files[id];
      if (id.endsWith('.css')) return mod;
      // CSS imports are handled by the embedded stylesheet above.
      code=code.replace(/^\s*import\s+['"]\.\/[^'"]+\.css['"];?\s*$/gm,'');
      let out;
      try {
        out=Babel.transform(code, {
          filename:id,
          presets:[['typescript',{allExtensions:true,isTSX:id.endsWith('.tsx')}],'react'],
          plugins:['transform-modules-commonjs'],
          sourceType:'module'
        }).code;
      } catch(e) {
        console.error('Compile error in',id,e);
        throw e;
      }
      const localRequire=(req)=>requireModule(resolve(id,req));
      try {
        const fn=new Function('require','module','exports','__filename','__dirname',out);
        fn(localRequire,mod,mod.exports,id,id.substring(0,id.lastIndexOf('/')));
      } catch(e) {
        console.error('Runtime error in',id,e);
        throw e;
      }
      return mod;
    }
    function requireModule(id) {
      if (cache[id]) return cache[id].exports;
      const m=makeModule(id);
      cache[id]=m;
      return m.exports;
    }

    window.addEventListener('error', function(e) {
      console.error(e.error || e.message);
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error(e.reason);
    });

    // Start the original React app from the embedded source tree.
    requireModule('src/main.tsx');
  })();
  </script>
