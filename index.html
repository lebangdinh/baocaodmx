e().trim()));\n\n    const isMatchSet = (r: any, nameSet: Set<string>) => {\n      const fields = [\n        r['ĐƠN VỊ / NHÂN VIÊN'],\n        r['TÊN NHÂN VIÊN'],\n        r['Nhân viên'],\n        r['Họ và tên'],\n      ];\n      return fields.some(f => {\n        if (!f) return false;\n        const str = String(f).toLowerCase().trim();\n        return [...nameSet].some(n => str.includes(n) || n.includes(str));\n      });\n    };\n\n    const newAppData: AppDataState = {\n      ...appData,\n      nv_tgdd: (appData.nv_tgdd || []).filter(r => isMatchSet(r, tgddNames)),\n      nv_tz: (appData.nv_tz || []).filter(r => isMatchSet(r, tzNames)),\n      dt_nv_luyke: (appData.dt_nv_luyke || []).filter(r => isMatchSet(r, tgddNames) || isMatchSet(r, tzNames)),\n      dt_nv_realtime: (appData.dt_nv_realtime || []).filter(r => isMatchSet(r, tgddNames) || isMatchSet(r, tzNames)),\n    };\n\n    onUpdateAppData(newAppData);\n    handleDivideEqually();\n    showToast('Đã đồng bộ toàn bộ dữ liệu nhân sự thành công!');\n  };\n\n  const handleShowAll = () => {\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    Object.keys(next[activeStore]).forEach(name => {\n      next[activeStore][name].isVisible = true;\n    });\n    onUpdateConfig(next);\n    showToast(`Đã hiện tất cả nhân viên siêu thị ${activeStore === 'TGDD' ? 'TGDĐ' : 'TopZone'}`);\n  };\n\n  // Chia đều tổng target của siêu thị cho toàn bộ nhân sự nội bộ đang hiển thị.\n  // Cho phép tổng phân bổ từ 100% đến 150% để phục vụ mục tiêu bứt phá.\n  const handleDivideEqually = (totalPct: number = getStretchGoalPct()) => {\n    const officials = staffList.filter(s => s.isOfficial);\n    if (officials.length === 0) {\n      showToast('Chưa có nhân sự nội bộ đang hiển thị để chia target!',);\n      setIsDivideMenuOpen(false);\n      return;\n    }\n\n    const safeTotal = Math.max(100, Math.min(150, Number(totalPct) || 100));\n    const roundedTotal = Math.round(safeTotal * 10) / 10;\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n\n    // Chia đến 0.1% và dồn phần lẻ vào người cuối để tổng luôn đúng 100–150%.\n    const base = Math.floor((roundedTotal / officials.length) * 10) / 10;\n    officials.forEach((staff, index) => {\n      const pct = index === officials.length - 1\n        ? Math.round((roundedTotal - base * (officials.length - 1)) * 10) / 10\n        : base;\n      next[activeStore][staff.name].targetPct = pct;\n    });\n\n    Object.keys(next[activeStore]).forEach(name => {\n      const isOff = next[activeStore][name].isOfficial === true;\n      const isVis = next[activeStore][name].isVisible !== false;\n      if (!isOff || !isVis) next[activeStore][name].targetPct = 0;\n    });\n\n    onUpdateConfig(next);\n    // Ghi nhận Chia Đều là ưu tiên của siêu thị này. Các tab nhân viên/AI sẽ\n    // dùng đúng targetPct vừa chia cho tới khi anh bấm Chia Đều một mức khác.\n    setPersonnelAllocationPct(activeStore, roundedTotal);\n    setIsDivideMenuOpen(false);\n    showToast(`Đã chia đều ${roundedTotal}% target siêu thị cho ${officials.length} nhân sự nội bộ • Ưu tiên Chia Đều`);\n  };\n\n  const handleAddStaff = () => {\n    if (!newStaffName.trim()) return;\n    const name = newStaffName.trim();\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    next[activeStore][name] = {\n      isOfficial: true,\n      isVisible: true,\n      targetPct: activeStore === 'TGDD' ? 37.5 : 25.0,\n    };\n    onUpdateConfig(next);\n    setNewStaffName('');\n    showToast(`Đã thêm nhân viên mới: ${name}`);\n  };\n\n  // Calculate total target percentage from the current personnel allocation.\n  const officialVisibleStaff = staffList.filter(s => s.isOfficial && s.isVisible);\n  const officialVisibleCount = officialVisibleStaff.length;\n  const totalTargetPct = officialVisibleCount > 0\n    ? officialVisibleStaff.reduce((sum, staff) => sum + (Number(staff.targetPct) || 0), 0)\n    : 0;\n\n  return (\n    <div className=\"space-y-6\">\n      {/* Toast Alert */}\n      {toastMsg && (\n        <div className=\"fixed top-5 right-5 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-bold flex items-center gap-2 border border-slate-700 animate-in fade-in\">\n          <CheckCircle2 className=\"w-4 h-4 text-emerald-400\" />\n          <span>{toastMsg}</span>\n        </div>\n      )}\n\n      {/* 1. Header */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div>\n          <h3 className=\"font-black text-slate-900 text-lg uppercase tracking-tight flex items-center gap-2\">\n            <Settings className=\"w-5 h-5 text-indigo-600\" />\n            <span>THIẾT LẬP NHÂN SỰ & CHỈ TIÊU KPI GIAO VIỆC</span>\n          </h3>\n          <p className=\"text-xs text-slate-500 font-medium\">\n            Quản lý danh sách nhân sự chính thức, tỷ lệ phân bổ KPI theo siêu thị và ẩn/hiện nhân viên\n          </p>\n        </div>\n\n        <div className=\"flex items-center gap-3\">\n          <div className=\"flex rounded-xl bg-slate-100 p-1 text-xs font-bold shadow-inner\">\n            <button\n              onClick={() => setActiveStore('TGDD')}\n              className={`px-4 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                activeStore === 'TGDD' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              TGD NHT (Shop 933)\n            </button>\n            <button\n              onClick={() => setActiveStore('TOPZONE')}\n              className={`px-4 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                activeStore === 'TOPZONE' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              AAR NHT (Shop 10341)\n            </button>\n          </div>\n\n          <button\n            onClick={onResetDefault}\n            className=\"px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold flex items-center gap-1.5 transition cursor-pointer\"\n            title=\"Khôi phục danh sách nhân sự mặc định ban đầu\"\n          >\n            <RotateCcw className=\"w-3.5 h-3.5\" />\n            <span>Mặc định</span>\n          </button>\n        </div>\n      </div>\n\n      {/* 2. Target allocation summary banner & Actions */}\n      <div className=\"bg-indigo-50/80 border border-indigo-200 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3\">\n        <div className=\"flex items-center space-x-3\">\n          <ShieldCheck className=\"w-6 h-6 text-indigo-600 flex-shrink-0\" />\n          <div>\n            <h4 className=\"font-extrabold text-indigo-950 text-xs uppercase\">\n              TỔNG TARGET NHÂN SỰ: {totalTargetPct.toFixed(1)}% TARGET SIÊU THỊ\n            </h4>\n            <p className=\"text-[11px] text-indigo-700\">\n              {officialVisibleCount > 0\n                ? `✓ Target nhân sự được chia theo tỷ lệ đã chọn và phân bổ đều cho ${officialVisibleCount} nhân sự chính thức.`\n                : '⚠️ Chưa có nhân sự chính thức để tính target.'}\n            </p>\n          </div>\n        </div>\n\n        <div className=\"flex flex-wrap items-center gap-2\">\n          <button\n            onClick={handleSyncAllData}\n            className=\"px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition cursor-pointer shadow-xs whitespace-nowrap flex items-center gap-1.5\"\n            title=\"Đồng bộ toàn bộ data Excel hiện có theo cấu hình nhân sự\"\n          >\n            <RefreshCw className=\"w-3.5 h-3.5\" />\n            <span>Đồng Bộ Data</span>\n          </button>\n          <div className=\"relative\">\n            <button\n              type=\"button\"\n              onClick={() => setIsDivideMenuOpen(v => !v)}\n              className=\"px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition cursor-pointer shadow-xs whitespace-nowrap\"\n              title=\"Chia đều target siêu thị cho nhân sự nội bộ\"\n            >\n              ⚡ Chia Đều\n            </button>\n\n            {isDivideMenuOpen && (\n              <div className=\"absolute right-0 top-full mt-2 z-40 w-72 bg-white border border-indigo-200 rounded-2xl shadow-xl p-3\">\n                <div className=\"mb-2.5\">\n                  <div className=\"text-xs font-black text-slate-900\">CHIA ĐỀU TARGET SIÊU THỊ</div>\n                  <div className=\"text-[10px] text-slate-500 mt-0.5\">Chọn tổng tỷ lệ target siêu thị để chia đều cho nhân sự chính thức.</div>\n                </div>\n                <div className=\"grid grid-cols-3 gap-2\">\n                  {[100, 110, 120, 130, 140, 150].map((pct) => (\n                    <button\n                      key={pct}\n                      type=\"button\"\n                      onClick={() => handleDivideEqually(pct)}\n                      className={`px-2 py-2 rounded-xl text-xs font-black border transition cursor-pointer ${\n                        Math.abs(totalTargetPct - pct) < 0.5\n                          ? 'bg-indigo-600 text-white border-indigo-600'\n                          : 'bg-indigo-50 text-indigo-700 border-indigo-100 hover:bg-indigo-100'\n                      }`}\n                    >\n                      {pct}%\n                    </button>\n                  ))}\n                </div>\n                <div className=\"mt-2.5 pt-2 border-t border-slate-100 text-[10px] text-slate-500\">\n                  Tỷ lệ được chia đều theo số nhân sự chính thức đang hiển thị. Ví dụ 4 người: 100% → 25%/người; 150% → 37,5%/người.\n                </div>\n              </div>\n            )}\n          </div>\n          <button\n            onClick={handleShowAll}\n            className=\"px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition cursor-pointer shadow-xs whitespace-nowrap flex items-center gap-1\"\n          >\n            <Eye className=\"w-3.5 h-3.5\" />\n            <span>Hiện Tất Cả</span>\n          </button>\n        </div>\n      </div>\n\n      {/* 3. Add personnel mini form */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-4 shadow-xs flex flex-wrap items-center gap-3\">\n        <span className=\"text-xs font-extrabold text-slate-800 uppercase flex items-center gap-1.5\">\n          <Plus className=\"w-4 h-4 text-blue-600\" />\n          <span>Thêm Nhân Viên Mới:</span>\n        </span>\n        <input\n          type=\"text\"\n          value={newStaffName}\n          onChange={(e) => setNewStaffName(e.target.value)}\n          placeholder=\"Nhập họ và tên nhân viên...\"\n          className=\"text-xs px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none w-56 font-semibold\"\n          onKeyDown={(e) => {\n            if (e.key === 'Enter') handleAddStaff();\n          }}\n        />\n        <button\n          onClick={handleAddStaff}\n          className=\"px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition cursor-pointer shadow-xs\"\n        >\n          + Thêm vào danh sách\n        </button>\n      </div>\n\n      {/* 4. Personnel table */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3\">\n        <div className=\"flex items-center justify-between\">\n          <h4 className=\"font-extrabold text-slate-900 text-xs uppercase\">\n            Danh Sách Nhân Sự {activeStore === 'TGDD' ? 'TGD NHT' : 'AAR NHT (TopZone)'} ({staffList.length} người)\n          </h4>\n          <span className=\"text-[11px] text-slate-500 font-medium\">\n            Bấm nút 👁️ để Ẩn/Hiện nhân viên | Bấm nút Trạng thái để đổi Nội bộ / Hỗ trợ | Tổng KPI có thể chia đều từ 100% đến 150% | Chia Đều sẽ được ưu tiên\n          </span>\n        </div>\n\n        <div className=\"overflow-x-auto custom-scroll\">\n          <SortableTable className=\"w-full text-left text-xs border-collapse\">\n            <thead className=\"bg-slate-900 text-white font-bold text-[11px]\">\n              <tr>\n                <th className=\"py-2.5 px-3 text-center w-12\">#</th>\n                <th className=\"py-2.5 px-4\">HỌ VÀ TÊN</th>\n                <th className=\"py-2.5 px-4 text-center\">LOẠI NHÂN SỰ</th>\n                <th className=\"py-2.5 px-4 text-center\">ẨN / HIỆN</th>\n                <th className=\"py-2.5 px-4 text-center\">TỶ TRỌNG KPI</th>\n                <th className=\"py-2.5 px-3 text-center w-16\">XÓA</th>\n              </tr>\n            </thead>\n            <tbody className=\"divide-y divide-slate-100 font-semibold text-slate-700\">\n              {staffList.map((staff, idx) => (\n                <tr\n                  key={idx}\n                  className={`hover:bg-slate-50 transition border-b border-slate-100 ${\n                    !staff.isVisible ? 'bg-rose-50/20 opacity-70' : ''\n                  }`}\n                >\n                  <td className=\"py-3 px-3 text-center text-slate-400\">{idx + 1}</td>\n                  <td className=\"py-3 px-4 font-bold text-slate-900\">\n                    <span className={staff.isVisible ? '' : 'line-through text-slate-400'}>\n                      {staff.name}\n                    </span>\n                    {!staff.isVisible && (\n                      <span className=\"ml-2 text-[10px] font-bold text-rose-500 bg-rose-50 px-1.5 py-0.5 rounded\">\n                        Đang ẩn\n                      </span>\n                    )}\n                  </td>\n                  <td className=\"py-3 px-4 text-center\">\n                    <button\n                      type=\"button\"\n                      onClick={() => handleToggleOfficial(staff.name)}\n                      className={`px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer transition shadow-2xs ${\n                        staff.isOfficial\n                          ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200'\n                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200'\n                      }`}\n                    >\n                      {staff.isOfficial ? '✓ Nội bộ (KPI)' : 'Hỗ trợ'}\n                    </button>\n                  </td>\n                  <td className=\"py-3 px-4 text-center\">\n                    <button\n                      type=\"button\"\n                      onClick={() => handleToggleVisible(staff.name)}\n                      className={`px-3 py-1.5 rounded-xl text-xs font-extrabold cursor-pointer transition shadow-2xs flex items-center gap-1.5 mx-auto ${\n                        staff.isVisible\n                          ? 'bg-emerald-50 border border-emerald-200 text-emerald-700 hover:bg-emerald-100'\n                          : 'bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100'\n                      }`}\n                    >\n                      {staff.isVisible ? (\n                        <>\n                          <Eye className=\"w-3.5 h-3.5\" />\n                          <span>Đang hiện</span>\n                        </>\n                      ) : (\n                        <>\n                          <EyeOff className=\"w-3.5 h-3.5\" />\n                          <span>Đã ẩn</span>\n                        </>\n                      )}\n                    </button>\n                  </td>\n                  <td className=\"py-3 px-4 text-center\">\n                    <div className=\"flex items-center justify-center gap-2\">\n                      <input\n                        type=\"number\"\n                        min=\"0\"\n                        max=\"150\"\n                        step=\"0.1\"\n                        disabled={!staff.isOfficial}\n                        value={staff.targetPct}\n                        onChange={(e) => handleChangeTarget(staff.name, parseFloat(e.target.value) || 0)}\n                        className=\"w-20 text-center text-xs font-bold border border-slate-200 rounded-lg py-1 px-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500 disabled:opacity-40\"\n                      />\n                      <span className=\"font-bold text-slate-500\">%</span>\n                    </div>\n                  </td>\n                  <td className=\"py-3 px-3 text-center\">\n                    <button\n                      type=\"button\"\n                      onClick={() => handleDeleteStaff(staff.name)}\n                      className=\"p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition cursor-pointer\"\n                      title={`Xóa nhân viên ${staff.name}`}\n                    >\n                      <Trash2 className=\"w-4 h-4\" />\n                    </button>\n                  </td>\n                </tr>\n              ))}\n            </tbody>\n          </SortableTable>\n        </div>\n      </div>\n    </div>\n  );\n};\n\n","src/views/SoSanhView.tsx":"import React, { useState } from 'react';\nimport { Camera, ArrowRightLeft, Sparkles } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatPercent, formatProgramName } from '../utils/formatters';\nimport { useStretchGoalPct } from '../utils/stretchGoal';\n\ninterface SoSanhViewProps {\n  appData: AppDataState;\n  onExportTab: () => void;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n}\n\nexport const SoSanhView: React.FC<SoSanhViewProps> = ({\n  appData,\n  onExportTab,\n  onOpenProgramDetail,\n}) => {\n  const [compareMode, setCompareMode] = useState<'SHOPS' | 'TARGET'>('SHOPS');\n  const [stretchGoalPct] = useStretchGoalPct();\n\n  const lk = appData.dt_luyke || [];\n\n  // Lấy đúng shop theo mã, không phụ thuộc thứ tự dòng Excel.\n  const findShop = (code: string) =>\n    lk.find(r => String(r['MÃ ĐƠN VỊ'] || '').trim() === code) || {};\n\n  const rowTgd = findShop('933');\n  const rowAar = findShop('10341');\n\n  const num = (v: any) => {\n    const n = parseFloat(String(v ?? '').replace(/,/g, ''));\n    return Number.isFinite(n) ? n : 0;\n  };\n\n  const getShopMetrics = (row: any) => {\n    const dt = num(row['DOANH THU (TR)']);\n    const dtqd = num(row['DOANH THU QĐ (TR)']);\n    const target = num(row['TARGET QĐ (TR)']) || num(row['TARGET (TR)']);\n    const stretchTarget = target * (stretchGoalPct / 100);\n    const tragop = num(row['DT TRẢ GÓP (TR)']);\n    const bill = num(row['LƯỢT BILL (TẤT CẢ ST)']);\n    const pct = stretchTarget > 0 ? dtqd / stretchTarget * 100 : 0;\n    return { dt, dtqd, target, stretchTarget, tragop, bill, pct };\n  };\n\n  const tgd = getShopMetrics(rowTgd);\n  const aar = getShopMetrics(rowAar);\n\n  const td_lk = appData.td_luyke || [];\n  const tgdProgs = td_lk.filter(r => String(r['ĐƠN VỊ / NHÂN VIÊN'] || '').includes('TGD'));\n  const aarProgs = td_lk.filter(r => String(r['ĐƠN VỊ / NHÂN VIÊN'] || '').includes('AAR'));\n  const tgdDone = tgdProgs.filter(r => num(r['% HT THÁNG']) >= 100).length;\n  const aarDone = aarProgs.filter(r => num(r['% HT THÁNG']) >= 100).length;\n\n  const ShopCard = ({ code, name, subtitle, metrics, done, total, tone }: any) => (\n    <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n      <div className=\"flex items-center justify-between pb-3 border-b border-slate-100\">\n        <div className=\"flex items-center space-x-2.5\">\n          <span className={`w-8 h-8 rounded-xl text-white font-mono font-black text-xs flex items-center justify-center shadow-xs ${tone}`}>\n            {code}\n          </span>\n          <div>\n            <h4 className=\"font-extrabold text-slate-900 text-sm\">{name}</h4>\n            <p className=\"text-[11px] text-slate-400\">{subtitle}</p>\n          </div>\n        </div>\n        <span className={`px-2.5 py-1 rounded-lg text-xs font-black border ${tone === 'bg-blue-600' ? 'bg-blue-50 text-blue-800 border-blue-200' : 'bg-amber-50 text-amber-800 border-amber-200'}`}>\n          {formatPercent(metrics.pct)} Target\n        </span>\n      </div>\n\n      <div className=\"space-y-3\">\n        <div className=\"flex justify-between items-center text-xs\">\n          <span className=\"text-slate-500\">Doanh Thu Thực:</span>\n          <strong className=\"text-slate-800 font-mono text-sm\">{formatCurrency(metrics.dt)} Tr</strong>\n        </div>\n        <div className=\"flex justify-between items-center text-xs\">\n          <span className=\"text-slate-500\">Doanh Thu Quy Đổi (QĐ):</span>\n          <strong className=\"text-indigo-600 font-mono text-base font-black\">{formatCurrency(metrics.dtqd)} Tr</strong>\n        </div>\n        <div className=\"flex justify-between items-center text-xs\">\n          <span className=\"text-slate-500\">Target QĐ Tháng:</span>\n          <strong className=\"text-slate-600 font-mono\">{formatCurrency(metrics.target)} Tr</strong>\n        </div>\n        <div className=\"flex justify-between items-center text-xs\">\n          <span className=\"text-slate-500\">Doanh Thu Trả Góp:</span>\n          <strong className=\"text-purple-700 font-mono\">\n            {formatCurrency(metrics.tragop)} Tr ({metrics.dt > 0 ? formatPercent(metrics.tragop / metrics.dt * 100) : '0%'})\n          </strong>\n        </div>\n        <div className=\"flex justify-between items-center text-xs\">\n          <span className=\"text-slate-500\">Lượt Bill Khách:</span>\n          <strong className=\"text-slate-800 font-mono\">{metrics.bill} bill</strong>\n        </div>\n        <div className=\"flex justify-between items-center text-xs\">\n          <span className=\"text-slate-500\">Môn Thi Đua Đạt Target:</span>\n          <strong className=\"text-emerald-600 font-mono font-bold\">{done} / {total} môn</strong>\n        </div>\n      </div>\n    </div>\n  );\n\n  const TargetCard = ({ code, name, metrics, tone }: any) => {\n    const gap = metrics.dtqd - metrics.stretchTarget;\n    const achievedPct = metrics.pct;\n    const barPct = Math.min(Math.max(achievedPct, 0), 100);\n    return (\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n        <div className=\"flex items-center justify-between\">\n          <div className=\"flex items-center gap-2.5\">\n            <span className={`w-8 h-8 rounded-xl text-white font-mono font-black text-xs flex items-center justify-center ${tone}`}>{code}</span>\n            <div>\n              <h4 className=\"font-extrabold text-slate-900 text-sm\">{name}</h4>\n              <p className=\"text-[11px] text-slate-400\">Đối chiếu doanh thu QĐ với Target tháng</p>\n            </div>\n          </div>\n          <span className={`px-2.5 py-1 rounded-lg text-xs font-black border ${achievedPct >= 100 ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200'}`}>\n            {formatPercent(achievedPct)}\n          </span>\n        </div>\n\n        <div className=\"grid grid-cols-2 gap-3\">\n          <div className=\"rounded-xl bg-blue-50/70 border border-blue-100 p-3\">\n            <span className=\"block text-[10px] uppercase font-bold text-blue-600\">Thực tế QĐ</span>\n            <strong className=\"block mt-1 text-lg font-black text-blue-700\">{formatCurrency(metrics.dtqd)} Tr</strong>\n          </div>\n          <div className=\"rounded-xl bg-slate-50 border border-slate-200 p-3\">\n            <span className=\"block text-[10px] uppercase font-bold text-slate-500\">Mục tiêu QĐ</span>\n            <strong className=\"block mt-1 text-lg font-black text-slate-700\">{formatCurrency(metrics.stretchTarget)} Tr</strong>\n          </div>\n        </div>\n\n        <div>\n          <div className=\"flex justify-between text-[11px] font-bold mb-1.5\">\n            <span className=\"text-slate-500\">Tiến độ hoàn thành</span>\n            <span className={achievedPct >= 100 ? 'text-emerald-600' : 'text-blue-600'}>{formatPercent(achievedPct)}</span>\n          </div>\n          <div className=\"h-3 rounded-full bg-slate-100 overflow-hidden\">\n            <div\n              className={`h-full rounded-full transition-all duration-500 ${achievedPct >= 100 ? 'bg-emerald-500' : 'bg-blue-600'}`}\n              style={{ width: `${barPct}%` }}\n            />\n          </div>\n        </div>\n\n        <div className={`rounded-xl p-3 border ${gap >= 0 ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`}>\n          <div className=\"flex justify-between items-center\">\n            <span className={`text-xs font-bold ${gap >= 0 ? 'text-emerald-700' : 'text-rose-700'}`}>\n              {gap >= 0 ? 'Đang vượt mục tiêu' : 'Còn thiếu mục tiêu'}\n            </span>\n            <strong className={`font-mono text-sm ${gap >= 0 ? 'text-emerald-700' : 'text-rose-700'}`}>\n              {formatCurrency(Math.abs(gap))} Tr\n            </strong>\n          </div>\n        </div>\n      </div>\n    );\n  };\n\n  const totalActual = tgd.dtqd + aar.dtqd;\n  const totalTarget = tgd.target + aar.target;\n  const totalPct = totalTarget > 0 ? totalActual / totalTarget * 100 : 0;\n  const totalGap = totalActual - totalTarget;\n\n  return (\n    <div className=\"space-y-6\">\n      {/* 1. Header */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div>\n          <h3 className=\"font-black text-slate-900 text-lg uppercase tracking-tight flex items-center gap-2\">\n            <ArrowRightLeft className=\"w-5 h-5 text-blue-600\" />\n            <span>SO SÁNH HIỆU SUẤT VẬN HÀNH & THI ĐUA</span>\n          </h3>\n          <p className=\"text-xs text-slate-500 font-medium\">\n            {compareMode === 'SHOPS'\n              ? 'So sánh trực tiếp hiệu suất giữa Shop 933 và Shop 10341'\n              : 'Đối chiếu doanh thu QĐ thực tế với mục tiêu tháng của từng shop'}\n          </p>\n        </div>\n\n        <div className=\"flex items-center gap-3\">\n          <div className=\"flex rounded-xl bg-slate-100 p-1 text-xs font-bold shadow-inner\">\n            <button\n              onClick={() => setCompareMode('SHOPS')}\n              className={`px-4 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                compareMode === 'SHOPS' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              Shop vs Shop (933 vs 10341)\n            </button>\n            <button\n              onClick={() => setCompareMode('TARGET')}\n              className={`px-4 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                compareMode === 'TARGET' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              Thực Tế vs Mục Tiêu\n            </button>\n          </div>\n\n          <button\n            onClick={onExportTab}\n            className=\"px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-xs transition cursor-pointer\"\n          >\n            <Camera className=\"w-3.5 h-3.5\" />\n            <span>Xuất ảnh</span>\n          </button>\n        </div>\n      </div>\n\n      {compareMode === 'SHOPS' ? (\n        <>\n          {/* 2A. So sánh trực tiếp hai shop */}\n          <div className=\"grid grid-cols-1 md:grid-cols-2 gap-5\">\n            <ShopCard\n              code=\"933\"\n              name=\"TGD NHT - 351 Nguyễn Hữu Thọ\"\n              subtitle=\"Thế Giới Di Động đa ngành\"\n              metrics={tgd}\n              done={tgdDone}\n              total={tgdProgs.length}\n              tone=\"bg-amber-500\"\n            />\n            <ShopCard\n              code=\"10341\"\n              name=\"AAR NHT - 351 Nguyễn Hữu Thọ\"\n              subtitle=\"TopZone Apple Authorised Reseller\"\n              metrics={aar}\n              done={aarDone}\n              total={aarProgs.length}\n              tone=\"bg-blue-600\"\n            />\n          </div>\n\n          {/* 3A. Tương quan tỷ trọng */}\n          <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n            <h4 className=\"font-extrabold text-slate-900 text-xs uppercase\">\n              Tương Quan Đóng Góp Doanh Thu Toàn Cụm 933\n            </h4>\n            <div className=\"space-y-2\">\n              <div className=\"flex justify-between text-xs font-bold text-slate-700\">\n                <span className=\"text-amber-800\">TGD NHT ({totalActual > 0 ? (tgd.dtqd / totalActual * 100).toFixed(1) : '0.0'}%)</span>\n                <span className=\"text-blue-800\">AAR NHT ({totalActual > 0 ? (aar.dtqd / totalActual * 100).toFixed(1) : '0.0'}%)</span>\n              </div>\n              <div className=\"w-full bg-slate-100 h-4 rounded-xl overflow-hidden flex shadow-inner\">\n                <div\n                  className=\"bg-amber-500 h-full flex items-center justify-center text-[10px] text-white font-bold transition-all duration-500\"\n                  style={{ width: `${totalActual > 0 ? tgd.dtqd / totalActual * 100 : 50}%` }}\n                />\n                <div\n                  className=\"bg-blue-600 h-full flex items-center justify-center text-[10px] text-white font-bold transition-all duration-500\"\n                  style={{ width: `${totalActual > 0 ? aar.dtqd / totalActual * 100 : 50}%` }}\n                />\n              </div>\n            </div>\n          </div>\n        </>\n      ) : (\n        <>\n          {/* 2B. Thực tế vs mục tiêu — nội dung hoàn toàn khác chế độ Shop vs Shop */}\n          <div className=\"grid grid-cols-1 md:grid-cols-2 gap-5\">\n            <TargetCard\n              code=\"933\"\n              name=\"TGD NHT - 351 Nguyễn Hữu Thọ\"\n              metrics={tgd}\n              tone=\"bg-amber-500\"\n            />\n            <TargetCard\n              code=\"10341\"\n              name=\"AAR NHT - 351 Nguyễn Hữu Thọ\"\n              metrics={aar}\n              tone=\"bg-blue-600\"\n            />\n          </div>\n\n          <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs\">\n            <div className=\"flex items-center justify-between mb-4\">\n              <div>\n                <h4 className=\"font-extrabold text-slate-900 text-xs uppercase\">Tổng hợp Thực Tế vs Mục Tiêu — Cụm 933</h4>\n                <p className=\"text-[11px] text-slate-400 mt-1\">Gộp Shop 933 + Shop 10341 theo doanh thu QĐ.</p>\n              </div>\n              <span className={`px-3 py-1.5 rounded-lg text-xs font-black border ${\n                totalPct >= 100 ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200'\n              }`}>\n                {formatPercent(totalPct)}\n              </span>\n            </div>\n\n            <div className=\"grid grid-cols-1 sm:grid-cols-3 gap-3\">\n              <div className=\"rounded-xl bg-blue-50 border border-blue-100 p-3\">\n                <span className=\"block text-[10px] uppercase font-bold text-blue-600\">Tổng thực tế QĐ</span>\n                <strong className=\"block mt-1 text-xl font-black text-blue-700\">{formatCurrency(totalActual)} Tr</strong>\n              </div>\n              <div className=\"rounded-xl bg-slate-50 border border-slate-200 p-3\">\n                <span className=\"block text-[10px] uppercase font-bold text-slate-500\">Tổng mục tiêu QĐ</span>\n                <strong className=\"block mt-1 text-xl font-black text-slate-700\">{formatCurrency(totalTarget)} Tr</strong>\n              </div>\n              <div className={`rounded-xl p-3 border ${totalGap >= 0 ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`}>\n                <span className={`block text-[10px] uppercase font-bold ${totalGap >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>\n                  {totalGap >= 0 ? 'Vượt mục tiêu' : 'Còn thiếu'}\n                </span>\n                <strong className={`block mt-1 text-xl font-black ${totalGap >= 0 ? 'text-emerald-700' : 'text-rose-700'}`}>\n                  {formatCurrency(Math.abs(totalGap))} Tr\n                </strong>\n              </div>\n            </div>\n          </div>\n        </>\n      )}\n    </div>\n  );\n};\n","src/views/SucKhoeCumView.tsx":"import { SortableTable } from '../components/SortableTable';\nimport React, { useState } from 'react';\nimport { Search } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatInt, formatPercent, formatProgramName } from '../utils/formatters';\n\ninterface SucKhoeCumViewProps {\n  appData: AppDataState;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n}\n\nexport const SucKhoeCumView: React.FC<SucKhoeCumViewProps> = ({\n  appData,\n  onOpenProgramDetail,\n}) => {\n  const [searchTerm, setSearchTerm] = useState<string>('');\n\n  const lk = appData.dt_luyke || [];\n  const td_lk = appData.td_luyke || [];\n\n  // Calculate cluster sums\n  let tot_target_qd = 0;\n  let tot_dt_qd = 0;\n  let tot_dt = 0;\n  let tot_tragop = 0;\n  let tot_bill = 0;\n\n  lk.forEach(r => {\n    tot_target_qd += parseFloat(String(r['TARGET QĐ (TR)'])) || 0;\n    tot_dt_qd += parseFloat(String(r['DOANH THU QĐ (TR)'])) || 0;\n    tot_dt += parseFloat(String(r['DOANH THU (TR)'])) || 0;\n    tot_tragop += parseFloat(String(r['DT TRẢ GÓP (TR)'])) || 0;\n    tot_bill += parseFloat(String(r['LƯỢT BILL (TẤT CẢ ST)'])) || 0;\n  });\n\n  const tot_pct_ht = tot_target_qd > 0 ? (tot_dt_qd / tot_target_qd * 100) : 0;\n  const tot_pct_qd = tot_dt > 0 ? (tot_dt_qd / tot_dt * 100) : 0;\n  const tot_pct_tg = tot_dt > 0 ? (tot_tragop / tot_dt * 100) : 0;\n\n  // Build cluster competition map\n  const progMap = new Map<string, any>();\n  td_lk.forEach(r => {\n    const name = r['CHƯƠNG TRÌNH'];\n    if (!name) return;\n    if (!progMap.has(name)) {\n      progMap.set(name, {\n        name,\n        displayName: formatProgramName(name),\n        aar_pct: null,\n        aar_dt: 0,\n        aar_tg: 0,\n        tgd_pct: null,\n        tgd_dt: 0,\n        tgd_tg: 0,\n        cum_pct: 0,\n        cum_sub: '',\n      });\n    }\n    const p = progMap.get(name);\n    const donvi = String(r['ĐƠN VỊ / NHÂN VIÊN'] || '');\n    const pct = parseFloat(String(r['% HT THÁNG'])) || 0;\n    const loai = Number(r['LOẠI TĐ']) || 3;\n    const dt = loai === 2 || loai === 6 ? (parseFloat(String(r['SỐ LƯỢNG'])) || 0) : (parseFloat(String(r['DT QUY ĐỔI (TR)'])) || parseFloat(String(r['DOANH THU (TR)'])) || 0);\n    const target = parseFloat(String(r['TARGET (TR/SL theo LOẠI TĐ)'])) || 0;\n\n    if (donvi.includes('AAR')) {\n      p.aar_pct = pct;\n      p.aar_dt = dt;\n      p.aar_tg = target;\n    } else if (donvi.includes('TGD')) {\n      p.tgd_pct = pct;\n      p.tgd_dt = dt;\n      p.tgd_tg = target;\n    }\n  });\n\n  let list = Array.from(progMap.values());\n  if (searchTerm) {\n    list = list.filter(\n      x =>\n        x.name.toLowerCase().includes(searchTerm.toLowerCase()) ||\n        x.displayName.toLowerCase().includes(searchTerm.toLowerCase())\n    );\n  }\n\n  list.forEach(p => {\n    const dtTot = (p.aar_dt || 0) + (p.tgd_dt || 0);\n    const tgTot = (p.aar_tg || 0) + (p.tgd_tg || 0);\n    p.cum_pct = tgTot > 0 ? (dtTot / tgTot * 100) : ((p.aar_pct || 0) + (p.tgd_pct || 0));\n    p.cum_sub = `${dtTot.toFixed(0)}/${tgTot.toFixed(0)}`;\n  });\n\n  list.sort((a, b) => b.cum_pct - a.cum_pct);\n\n  const half = Math.ceil(list.length / 2);\n  const list1 = list.slice(0, half);\n  const list2 = list.slice(half);\n\n  const renderSideProgTable = (items: any[]) => {\n    return items.map((item, idx) => {\n      const aarVal = item.aar_pct !== null ? `${item.aar_pct.toFixed(0)}%` : '-';\n      const tgdVal = item.tgd_pct !== null ? `${item.tgd_pct.toFixed(0)}%` : '-';\n      const cumVal = `${item.cum_pct.toFixed(0)}%`;\n\n      const aarClass =\n        item.aar_pct >= 100\n          ? 'bg-blue-50 text-blue-700 font-bold'\n          : item.aar_pct >= 50\n          ? 'bg-amber-50 text-amber-700 font-bold'\n          : item.aar_pct !== null\n          ? 'text-slate-600'\n          : 'text-slate-300';\n      const tgdClass =\n        item.tgd_pct >= 100\n          ? 'bg-blue-50 text-blue-700 font-bold'\n          : item.tgd_pct >= 50\n          ? 'bg-amber-50 text-amber-700 font-bold'\n          : item.tgd_pct !== null\n          ? 'text-slate-600'\n          : 'text-slate-300';\n\n      return (\n        <tr\n          key={idx}\n          onClick={() => onOpenProgramDetail('TGDD', '', item.name)}\n          title=\"Bấm để xem chi tiết nhân viên bán môn này\"\n          className=\"hover:bg-blue-50/60 cursor-pointer transition border-b border-slate-100\"\n        >\n          <td className=\"py-2.5 px-3 font-semibold text-slate-800 truncate max-w-[170px]\" title={item.name}>\n            {item.displayName}\n          </td>\n          <td className={`py-2.5 px-2 text-center text-xs ${aarClass}`}>{aarVal}</td>\n          <td className={`py-2.5 px-2 text-center text-xs ${tgdClass}`}>{tgdVal}</td>\n          <td data-sort-value={item.cum_pct} className=\"py-2.5 px-2 text-center text-xs bg-slate-50 font-bold text-slate-900\">\n            <span>{cumVal}</span>\n            <span className=\"block text-[10px] text-slate-400 font-normal\">{item.cum_sub}</span>\n          </td>\n        </tr>\n      );\n    });\n  };\n\n  return (\n    <div className=\"space-y-6\">\n      {/* 1. BẢNG TỔNG HỢP DOANH THU CỤM */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n        <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-slate-100\">\n          <div>\n            <h3 className=\"font-extrabold text-slate-900 text-sm uppercase tracking-wide\">\n              BẢNG TỔNG HỢP DOANH THU CỤM SIÊU THỊ\n            </h3>\n            <p className=\"text-xs text-slate-500\">\n              Chi tiết Target QĐ, Doanh thu QĐ, % Hoàn thành, % Quy đổi, % Trả chậm, Lượt khách, Bill\n            </p>\n          </div>\n          <span className=\"text-xs font-bold text-slate-700 bg-slate-100 px-3 py-1 rounded-xl\">\n            LŨY KẾ THÁNG\n          </span>\n        </div>\n\n        <div className=\"overflow-x-auto custom-scroll\">\n          <SortableTable className=\"w-full text-left text-xs border-collapse\">\n            <thead className=\"bg-blue-600 text-white font-bold\">\n              <tr>\n                <th className=\"py-3 px-3 text-center\">STT</th>\n                <th className=\"py-3 px-4\">TÊN SIÊU THỊ</th>\n                <th className=\"py-3 px-3 text-right\">TARGET QĐ (TR)</th>\n                <th className=\"py-3 px-3 text-right\">DOANH THU QĐ (TR)</th>\n                <th className=\"py-3 px-3 text-center\">% HOÀN THÀNH</th>\n                <th className=\"py-3 px-3 text-center\">% QUY ĐỔI</th>\n                <th className=\"py-3 px-3 text-center\">% TRẢ CHẬM</th>\n                <th className=\"py-3 px-3 text-center\">LƯỢT KHÁCH</th>\n                <th className=\"py-3 px-3 text-center\">BILL</th>\n                <th className=\"py-3 px-3 text-right\">TỈ LỆ PVTC</th>\n              </tr>\n            </thead>\n            <tbody className=\"divide-y divide-slate-100 text-slate-700 font-semibold\">\n              {lk.map((r, idx) => {\n                const ma = r['MÃ ĐƠN VỊ'] || '';\n                const ten = r['TÊN ĐƠN VỊ'] || '';\n                const target_qd = parseFloat(String(r['TARGET QĐ (TR)'])) || 0;\n                const dt_qd = parseFloat(String(r['DOANH THU QĐ (TR)'])) || 0;\n                const dt = parseFloat(String(r['DOANH THU (TR)'])) || 0;\n                const tragop = parseFloat(String(r['DT TRẢ GÓP (TR)'])) || 0;\n                const bill = parseFloat(String(r['LƯỢT BILL (TẤT CẢ ST)'])) || 0;\n\n                const pct_ht = target_qd > 0 ? (dt_qd / target_qd * 100) : 0;\n                const pct_qd = dt > 0 ? (dt_qd / dt * 100) : 0;\n                const pct_tg = dt > 0 ? (tragop / dt * 100) : 0;\n\n                return (\n                  <tr key={idx} className=\"hover:bg-slate-50 transition font-medium\">\n                    <td className=\"py-2.5 px-3 text-center text-slate-500\">{idx + 1}</td>\n                    <td className=\"py-2.5 px-4 font-bold text-slate-900\">{ma} - {ten}</td>\n                    <td className=\"py-2.5 px-3 text-right font-mono font-bold text-slate-800\" data-sort-value={target_qd}>\n                      {formatCurrency(target_qd)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-right font-mono font-bold text-blue-600\" data-sort-value={dt_qd}>\n                      {formatCurrency(dt_qd)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-center\">\n                      <span\n                        className={`px-2 py-0.5 rounded font-black ${\n                          pct_ht >= 100\n                            ? 'bg-blue-100 text-blue-800'\n                            : pct_ht >= 70\n                            ? 'bg-amber-100 text-amber-800'\n                            : 'bg-rose-100 text-rose-800'\n                        }`}\n                      >\n                        {formatPercent(pct_ht)}\n                      </span>\n                    </td>\n                    <td className=\"py-2.5 px-3 text-center font-bold text-slate-700\" data-sort-value={pct_qd}>\n                      {formatPercent(pct_qd)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-center font-bold text-purple-700\" data-sort-value={pct_tg}>\n                      {formatPercent(pct_tg)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-center text-slate-400\">0</td>\n                    <td className=\"py-2.5 px-3 text-center font-bold text-slate-800\">{bill}</td>\n                    <td className=\"py-2.5 px-3 text-right text-slate-500 font-mono\">-</td>\n                  </tr>\n                );\n              })}\n\n              <tr data-sort-fixed=\"total\" className=\"bg-blue-50/70 font-black text-slate-900 border-t-2 border-blue-200\">\n                <td className=\"py-3 px-3 text-center text-blue-700\">★</td>\n                <td className=\"py-3 px-4 text-blue-900\">TỔNG CỤM SIÊU THỊ</td>\n                <td className=\"py-3 px-3 text-right font-mono\" data-sort-value={tot_target_qd}>{formatCurrency(tot_target_qd)}</td>\n                <td className=\"py-3 px-3 text-right font-mono text-blue-700\" data-sort-value={tot_dt_qd}>{formatCurrency(tot_dt_qd)}</td>\n                <td className=\"py-3 px-3 text-center\">\n                  <span className=\"px-2.5 py-0.5 rounded font-black bg-blue-600 text-white\">\n                    {formatPercent(tot_pct_ht)}\n                  </span>\n                </td>\n                <td className=\"py-3 px-3 text-center text-blue-800\" data-sort-value={tot_pct_qd}>{formatPercent(tot_pct_qd)}</td>\n                <td className=\"py-3 px-3 text-center text-purple-800\" data-sort-value={tot_pct_tg}>{formatPercent(tot_pct_tg)}</td>\n                <td className=\"py-3 px-3 text-center\">0</td>\n                <td className=\"py-3 px-3 text-center\">{tot_bill}</td>\n                <td className=\"py-3 px-3 text-right text-slate-400\">0,0%</td>\n              </tr>\n            </tbody>\n          </SortableTable>\n        </div>\n      </div>\n\n      {/* 2. BẢNG TỔNG HỢP THI ĐUA CỤM (2 BẢNG SONG SONG) */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n        <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2 border-b border-slate-100\">\n          <div>\n            <h3 className=\"font-extrabold text-slate-900 text-sm uppercase tracking-wide\">\n              BẢNG TỔNG HỢP THI ĐUA CỤM SIÊU THỊ\n            </h3>\n            <p className=\"text-xs text-slate-500\">\n              Hiển thị % hoàn thành của từng shop và Tổng Cụm (chia 2 bảng song song giúp quan sát toàn cảnh)\n            </p>\n          </div>\n          <div className=\"relative\">\n            <input\n              type=\"text\"\n              value={searchTerm}\n              onChange={(e) => setSearchTerm(e.target.value)}\n              placeholder=\"Tìm môn thi đua...\"\n              className=\"text-xs px-3.5 py-1.5 border border-slate-200 rounded-xl focus:outline-none w-56\"\n            />\n          </div>\n        </div>\n\n        <div className=\"grid grid-cols-1 lg:grid-cols-2 gap-5\">\n          <div className=\"border border-slate-200 rounded-2xl overflow-hidden shadow-xs\">\n            <div className=\"bg-slate-50 px-3.5 py-2.5 border-b border-slate-200 font-bold text-xs text-slate-700 flex justify-between items-center\">\n              <span>🎗 Bảng 1: Nhóm thi đua (Top đầu)</span>\n              <span className=\"text-[11px] text-slate-500 font-normal\">{list1.length} môn</span>\n            </div>\n            <div className=\"overflow-x-auto custom-scroll max-h-[550px]\">\n              <SortableTable className=\"w-full text-left text-xs border-collapse\">\n                <thead className=\"bg-blue-600 text-white font-bold sticky top-0 shadow-xs\">\n                  <tr>\n                    <th className=\"py-2.5 px-3\">MÔN THI ĐUA</th>\n                    <th className=\"py-2.5 px-2 text-center\">ST 10341</th>\n                    <th className=\"py-2.5 px-2 text-center\">ST 933</th>\n                    <th className=\"py-2.5 px-2 text-center\">TỔNG CỤM</th>\n                  </tr>\n                </thead>\n                <tbody className=\"divide-y divide-slate-100 text-slate-700\">\n                  {renderSideProgTable(list1)}\n                </tbody>\n              </SortableTable>\n            </div>\n          </div>\n\n          <div className=\"border border-slate-200 rounded-2xl overflow-hidden shadow-xs\">\n            <div className=\"bg-slate-50 px-3.5 py-2.5 border-b border-slate-200 font-bold text-xs text-slate-700 flex justify-between items-center\">\n              <span>🎗 Bảng 2: Nhóm thi đua (Cần bứt phá)</span>\n              <span className=\"text-[11px] text-slate-500 font-normal\">{list2.length} môn</span>\n            </div>\n            <div className=\"overflow-x-auto custom-scroll max-h-[550px]\">\n              <SortableTable className=\"w-full text-left text-xs border-collapse\">\n                <thead className=\"bg-blue-600 text-white font-bold sticky top-0 shadow-xs\">\n                  <tr>\n                    <th className=\"py-2.5 px-3\">MÔN THI ĐUA</th>\n                    <th className=\"py-2.5 px-2 text-center\">ST 10341</th>\n                    <th className=\"py-2.5 px-2 text-center\">ST 933</th>\n                    <th className=\"py-2.5 px-2 text-center\">TỔNG CỤM</th>\n                  </tr>\n                </thead>\n                <tbody className=\"divide-y divide-slate-100 text-slate-700\">\n                  {renderSideProgTable(list2)}\n                </tbody>\n              </SortableTable>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/views/SucKhoeNvView.tsx":"import { EmployeeProgress, summarizeProgress } from '../components/EmployeeProgress';\nimport { countPrograms } from '../utils/programCounts';\nimport { employeeProgramStatus } from '../utils/employeeProgramStatus';\nimport { applyEmployeeRealtime } from '../utils/employeeRealtime';\nimport { SortableTable } from '../components/SortableTable';\nimport React, { useState, useEffect, useRef, useMemo } from 'react';\nimport { Chart as ChartJS, registerables } from 'chart.js';\nimport { Search, Plus, Eye, EyeOff, Trophy, Sparkles, Camera } from 'lucide-react';\nimport { AppDataState, AggregatedEmployee, PersonnelConfigMap } from '../types';\nimport {\n  formatCurrency,\n  formatInt,\n  formatPercent,\n  formatProgramName,\n  cleanCode,\n  cleanProgName,\n  getCellNumber\n} from '../utils/formatters';\nimport { captureElement, downloadImage } from '../utils/imageExporter';\nimport { useStretchGoalPct, getPersonnelAllocationPct } from '../utils/stretchGoal';\n\nChartJS.register(...registerables);\n\ninterface SucKhoeNvViewProps {\n  appData: AppDataState;\n  personnelConfig: PersonnelConfigMap;\n  onUpdatePersonnelConfig?: (cfg: PersonnelConfigMap) => void;\n  onOpenQuickUpload: () => void;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n  onOpenPersonnelSettings?: () => void;\n}\n\nconst TOPZONE_STAFF_SET = new Set([\n  'Nguyễn Quỳnh Anh',\n  'Lê Thị Mỹ Linh',\n  'Tạ Đức Hiếu',\n  'Trần Minh Hải',\n  'Trần Thị Mỹ Trang',\n  'Đỗ Nhật Trinh',\n  '98486',\n  '170266',\n  '189769',\n  '83089',\n  '45500',\n  '183180',\n]);\n\nconst AI_FOCUS_STORAGE_KEY = 'skst_ai_focus_programs_v1';\nconst AI_FOCUS_VISIBLE_STORAGE_KEY = 'skst_ai_focus_programs_visible_v1';\n\nconst TGDD_STAFF_SET = new Set([\n  'Lê Văn Nhân',\n  'Lê Thị Thanh Trâm',\n  'Nguyễn Thị Thy',\n  'Trần Thị Huyền Trang',\n  '204201',\n  '269167',\n  '29649',\n  '259623',\n]);\n\nexport const SucKhoeNvView: React.FC<SucKhoeNvViewProps> = ({\n  appData,\n  personnelConfig,\n  onUpdatePersonnelConfig,\n  onOpenQuickUpload,\n  onOpenProgramDetail,\n  onOpenPersonnelSettings,\n}) => {\n  const [stretchGoalPct] = useStretchGoalPct();\n  // Consent is tied to these exact data references; importing/replacing data turns it off.\n  const [realtimeConsent, setRealtimeConsent] = useState<any>(null);\n  const hasEmployeeRealtime = (appData.dt_nv_realtime || []).length > 0;\n  const includeRealtime = hasEmployeeRealtime && realtimeConsent?.lk === appData.dt_nv_luyke && realtimeConsent?.rt === appData.dt_nv_realtime;\n\n  const [storeTab, setStoreTab] = useState<'TGDD' | 'TOPZONE' | 'ALL'>('TGDD');\n  const [displayMode, setDisplayMode] = useState<'SUMMARY' | 'TABLE' | 'CARDS' | 'AI'>('SUMMARY');\n  const [cardCols, setCardCols] = useState<number>(2);\n  const [isOfficialOnly, setIsOfficialOnly] = useState<boolean>(true);\n  const [visibilityFilter, setVisibilityFilter] = useState<'VISIBLE_ONLY' | 'ALL' | 'HIDDEN_ONLY'>('VISIBLE_ONLY');\n  const [isExcludeOnline, setIsExcludeOnline] = useState<boolean>(true);\n  const [searchTerm, setSearchTerm] = useState<string>('');\n  const [isChartVisible, setIsChartVisible] = useState<boolean>(true);\n  const [isExpandAllPrograms, setIsExpandAllPrograms] = useState<boolean>(false);\n  const [isBulkExporting, setIsBulkExporting] = useState<boolean>(false);\n  const [bulkExportFormat, setBulkExportFormat] = useState<'PNG' | 'ZIP'>('PNG');\n  const [bulkExportProgress, setBulkExportProgress] = useState('');\n  const [directExportFiles, setDirectExportFiles] = useState<{blob: Blob; fileName: string}[]>([]);\n  const [aiFocusPrograms, setAiFocusPrograms] = useState<string[]>(() => {\n    try {\n      const saved = localStorage.getItem(AI_FOCUS_STORAGE_KEY);\n      const parsed = saved ? JSON.parse(saved) : [];\n      return Array.isArray(parsed) ? parsed.filter((x: any) => typeof x === 'string') : [];\n    } catch {\n      return [];\n    }\n  });\n  const [isAiFocusSectionVisible, setIsAiFocusSectionVisible] = useState<boolean>(() => {\n    try {\n      const saved = localStorage.getItem(AI_FOCUS_VISIBLE_STORAGE_KEY);\n      return saved === null ? true : saved !== 'false';\n    } catch {\n      return true;\n    }\n  });\n\n  useEffect(() => {\n    try { localStorage.setItem(AI_FOCUS_STORAGE_KEY, JSON.stringify(aiFocusPrograms)); } catch { /* session-only fallback */ }\n  }, [aiFocusPrograms]);\n\n  useEffect(() => {\n    try { localStorage.setItem(AI_FOCUS_VISIBLE_STORAGE_KEY, String(isAiFocusSectionVisible)); } catch { /* session-only fallback */ }\n  }, [isAiFocusSectionVisible]);\n\n  const toggleAiFocusProgram = (programName: string) => {\n    setAiFocusPrograms(prev => prev.includes(programName) ? prev.filter(x => x !== programName) : [...prev, programName]);\n  };\n\n  const clearAiFocusPrograms = () => setAiFocusPrograms([]);\n\n  const handleToggleEmployeeVisibility = (empName: string, store: string) => {\n    const storeKey: 'TGDD' | 'TOPZONE' = store.includes('TopZone') || store.includes('AAR') || store === 'TOPZONE' ? 'TOPZONE' : 'TGDD';\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[storeKey]) next[storeKey] = {};\n    if (!next[storeKey][empName]) next[storeKey][empName] = {};\n    const curr = next[storeKey][empName].isVisible !== false;\n    next[storeKey][empName].isVisible = !curr;\n    onUpdatePersonnelConfig?.(next);\n  };\n\n  const handleToggleEmployeeOfficial = (empName: string, store: string) => {\n    const storeKey: 'TGDD' | 'TOPZONE' = store.includes('TopZone') || store.includes('AAR') || store === 'TOPZONE' ? 'TOPZONE' : 'TGDD';\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[storeKey]) next[storeKey] = {};\n    if (!next[storeKey][empName]) next[storeKey][empName] = {};\n    const curr = next[storeKey][empName].isOfficial !== false;\n    next[storeKey][empName].isOfficial = !curr;\n    onUpdatePersonnelConfig?.(next);\n  };\n\n  const handleExportEmployeeCard = async (\n    cardElement: HTMLElement | null,\n    emp: AggregatedEmployee,\n    rank: number,\n  ) => {\n    if (!cardElement) return;\n\n    const safeName = String(emp.name || 'NhanVien')\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g, '')\n      .replace(/[^a-zA-Z0-9]+/g, '_')\n      .replace(/^_+|_+$/g, '');\n    const dateStr = new Date().toISOString().slice(0, 10);\n    const fileName = `XepHang_NV_${rank}_${safeName}_${dateStr}.png`;\n\n    try {\n      const result = await captureElement(cardElement, {\n        fileName,\n        backgroundColor: '#ffffff',\n        scale: 2,\n      });\n      downloadImage(result.blob, result.fileName);\n    } catch (err) {\n      console.error('Employee card export error:', err);\n      window.alert('Không thể xuất ảnh thẻ nhân viên. Vui lòng thử lại!');\n    }\n  };\n\n  const handleExportAllEmployeeCards = async () => {\n    if (isBulkExporting) return;\n\n    const cards = Array.from(document.querySelectorAll('[data-employee-card=\"true\"]')) as HTMLElement[];\n    if (!cards.length || !aggregatedEmployees.length) {\n      window.alert('Chưa có thẻ nhân viên để xuất ảnh. Hãy chuyển sang mục 🃏 Thẻ Chi Tiết và kiểm tra dữ liệu.');\n      return;\n    }\n\n    const JSZipCtor = (window as any).JSZip;\n    if (bulkExportFormat === 'ZIP' && !JSZipCtor) {\n      window.alert('Chưa tải được bộ đóng gói ZIP. Vui lòng kiểm tra kết nối mạng rồi thử lại.');\n      return;\n    }\n\n    setIsBulkExporting(true);\n    setDirectExportFiles([]);\n    setBulkExportProgress('Đang chuẩn bị...');\n    try {\n      const zip = bulkExportFormat === 'ZIP' ? new JSZipCtor() : null;\n      let exportedCount = 0;\n      const dateStr = new Date().toISOString().slice(0, 10);\n\n      for (let i = 0; i < cards.length; i++) {\n        const emp = aggregatedEmployees[i];\n        if (!emp) continue;\n\n        const safeName = String(emp.name || 'NhanVien')\n          .normalize('NFD')\n          .replace(/[\\u0300-\\u036f]/g, '')\n          .replace(/[^a-zA-Z0-9]+/g, '_')\n          .replace(/^_+|_+$/g, '');\n        const fileName = `XepHang_NV_${i + 1}_${safeName}_${dateStr}.png`;\n\n        const result = await captureElement(cards[i], {\n          fileName,\n          backgroundColor: '#ffffff',\n          scale: 2,\n        });\n        exportedCount++;\n        setBulkExportProgress(`${exportedCount}/${cards.length}`);\n        if (zip) zip.file(fileName, result.blob);\n        else {\n          setDirectExportFiles(prev => [...prev, {blob: result.blob, fileName}]);\n          downloadImage(result.blob, fileName);\n          await new Promise(resolve => window.setTimeout(resolve, 400));\n        }\n      }\n\n      if (!zip) {\n        window.alert(`Đã gửi yêu cầu tải ${exportedCount} ảnh PNG riêng. Nếu trình duyệt hỏi tải nhiều tệp, anh bấm Cho phép. Hãy kiểm tra danh sách tải xuống; nếu thiếu ảnh, dùng các nút Tải lại bên dưới. Ứng dụng không thể xác nhận trình duyệt đã lưu đủ ảnh.`);\n        return;\n      }\n      const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });\n      const url = URL.createObjectURL(zipBlob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = `XepHang_NhanVien_TatCa_${storeTab}_${dateStr}.zip`;\n      document.body.appendChild(a);\n      a.click();\n      a.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 1500);\n\n      window.alert(`Đã xuất ${exportedCount} ảnh nhân viên thành 1 file ZIP. Mỗi nhân viên vẫn là 1 ảnh PNG riêng.`);\n    } catch (err) {\n      console.error('Bulk employee card export error:', err);\n      window.alert('Không thể xuất toàn bộ ảnh nhân viên. Vui lòng thử lại!');\n    } finally {\n      setIsBulkExporting(false);\n      setBulkExportProgress('');\n    }\n  };\n\n  const chartRef = useRef<HTMLCanvasElement>(null);\n  const chartInstance = useRef<ChartJS | null>(null);\n\n  // 1. Determine valid disciplines with target for the active store\n  const validPrograms = useMemo(() => {\n    const storeKeyw = storeTab === 'TOPZONE' ? 'AAR' : 'TGD';\n    const td_lk = appData.td_luyke || [];\n    const valid: { code: string | number; name: string; loai: number; storeTarget: number }[] = [];\n\n    td_lk.forEach(r => {\n      if (String(r['ĐƠN VỊ / NHÂN VIÊN']).includes(storeKeyw)) {\n        const target = parseFloat(String(r['TARGET (TR/SL theo LOẠI TĐ)'])) || 0;\n        if (target > 0) {\n          valid.push({\n            code: r['MÃ CHƯƠNG TRÌNH'] || '',\n            name: r['CHƯƠNG TRÌNH'] || '',\n            loai: Number(r['LOẠI TĐ']) || 3,\n            storeTarget: target,\n          });\n        }\n      }\n    });\n\n    return valid;\n  }, [storeTab, appData.td_luyke, appData.nv_tz, appData.nv_tgdd]);\n\n  // 2. Aggregate employees data\n  const cumulativeEmployees: AggregatedEmployee[] = useMemo(() => {\n    const tgddRaw = appData.nv_tgdd || [];\n    const tzRaw = appData.nv_tz || [];\n    const dtNvList = appData.dt_nv_luyke || [];\n\n    // Build employee records from BOTH sources but use MÃ NV as the canonical key.\n    // This prevents the same person appearing twice as:\n    //   \"98486 - Nguyễn Quỳnh Anh\" (competition data)\n    //   \"Nguyễn Quỳnh Anh\" (revenue data).\n    type EmpBucket = { id: string; name: string; progRows: any[]; revRow: any };\n    const buckets = new Map<string, EmpBucket>();\n    const canonicalName = (s: any) => String(s || '').replace(/\\s+/g, ' ').trim();\n    const canonicalId = (s: any) => cleanCode(s);\n    const addBucket = (idRaw: any, nameRaw: any, storeHint: 'TGDD' | 'TOPZONE', row?: any) => {\n      const id = canonicalId(idRaw);\n      const name = canonicalName(nameRaw);\n      if (!name || /^online$/i.test(name) || /online/i.test(name)) return null;\n      const key = id ? `id:${id}` : `name:${name.toLowerCase()}`;\n      let b = buckets.get(key);\n      if (!b) {\n        b = { id, name, progRows: [], revRow: {} };\n        buckets.set(key, b);\n      }\n      if (!b.id && id) b.id = id;\n      if (name && (!b.name || b.name.includes(' - '))) b.name = name;\n      if (row) {\n        if (row.__source === 'prog') b.progRows.push(row);\n        if (row.__source === 'rev') b.revRow = row;\n      }\n      return b;\n    };\n\n    const classifyProgStore = (category: 'TGDD' | 'TOPZONE', r: any) => {\n      const id = canonicalId(r['MÃ NV'] || r['Mã NV']);\n      const nameRaw = r['ĐƠN VỊ / NHÂN VIÊN'] || r['Nhân viên'] || r['Họ và tên'];\n      const full = canonicalName(nameRaw);\n      const name = full.replace(/^\\d{4,7}\\s*[-_–]\\s*/, '').trim();\n      const isTzByFixed = TOPZONE_STAFF_SET.has(name) || TOPZONE_STAFF_SET.has(id);\n      const isTgByFixed = TGDD_STAFF_SET.has(name) || TGDD_STAFF_SET.has(id);\n      if (category === 'TGDD') return !isTzByFixed;\n      return !isTgByFixed;\n    };\n\n    const progSources: { rows: any[]; store: 'TGDD' | 'TOPZONE' }[] =\n      storeTab === 'TGDD' ? [{ rows: tgddRaw, store: 'TGDD' }] :\n      storeTab === 'TOPZONE' ? [{ rows: tzRaw, store: 'TOPZONE' }] :\n      [{ rows: tgddRaw, store: 'TGDD' }, { rows: tzRaw, store: 'TOPZONE' }];\n\n    progSources.forEach(src => {\n      src.rows.forEach(r0 => {\n        if (!classifyProgStore(src.store, r0)) return;\n        const full = canonicalName(r0['ĐƠN VỊ / NHÂN VIÊN'] || r0['Nhân viên'] || r0['Họ và tên']);\n        const id = canonicalId(r0['MÃ NV'] || r0['Mã NV']);\n        const name = full.replace(/^\\d{4,7}\\s*[-_–]\\s*/, '').trim();\n        const row = { ...r0, __source: 'prog', __store: src.store };\n        addBucket(id, name, src.store, row);\n      });\n    });\n\n    dtNvList.forEach(r0 => {\n      const id = canonicalId(r0['MÃ NHÂN VIÊN'] || r0['Mã NV']);\n      const name = canonicalName(r0['TÊN NHÂN VIÊN'] || r0['Nhân viên'] || r0['Họ và tên']);\n      if (!name || /online/i.test(name)) return;\n      const sourceStore = String(r0['SIÊU THỊ'] || '').toLowerCase();\n      const isTz = sourceStore.includes('topzone') || sourceStore.includes('aar') || TOPZONE_STAFF_SET.has(name) || TOPZONE_STAFF_SET.has(id);\n      if (storeTab === 'TGDD' && isTz) return;\n      if (storeTab === 'TOPZONE' && !isTz) return;\n      addBucket(id, name, isTz ? 'TOPZONE' : 'TGDD', { ...r0, __source: 'rev', __store: isTz ? 'TOPZONE' : 'TGDD' });\n    });\n\n    const employeeRows = dtNvList;\n    const lkStoreRows = appData.dt_luyke || [];\n    const daysCandidates = [\n      ...employeeRows.map(r => getCellNumber(r, ['SỐ NGÀY CỬA SỔ', 'SỐ NGÀY', 'NGÀY CỬA SỔ'])),\n      ...lkStoreRows.map(r => getCellNumber(r, ['SỐ NGÀY CỬA SỔ', 'SỐ NGÀY', 'NGÀY CỬA SỔ']))\n    ].filter(n => n > 0);\n    const daysInMonthForForecast = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();\n    // Employee BI rows may omit SỐ NGÀY CỬA SỔ. Use the LK store source\n    // (or yesterday as a final fallback) so % DỰ is based on completed days.\n    const fallbackDaysRun = Math.max(0, new Date().getDate() - 1);\n    const daysRun = daysCandidates.length ? Math.max(...daysCandidates) : fallbackDaysRun;\n    const pacingMultiplier = daysInMonthForForecast / Math.max(1, daysRun);\n\n    // TARGET NHÂN VIÊN dùng một quy tắc duy nhất cho cả doanh thu và từng môn thi đua:\n    // TARGET NV = TARGET SIÊU THỊ × STRETCH GOAL ÷ SỐ NHÂN SỰ CHÍNH THỨC.\n    // Số nhân sự lấy trực tiếp từ cấu hình KPI; không đếm các dòng thi đua cũ/hỗ trợ\n    // trong dữ liệu BI vì các dòng đó có thể làm phình mẫu số và khiến target bị sai.\n    const staffCountByStore = (storeKey: 'TGDD' | 'TOPZONE') => {\n      const roster = personnelConfig[storeKey] || {};\n      const count = Object.values(roster).filter((cfg: any) => cfg?.isOfficial === true).length;\n      if (count > 0) return count;\n      // Fallback theo roster mặc định của cụm nếu dữ liệu cấu hình chưa được nạp.\n      return storeKey === 'TGDD' ? 4 : 6;\n    };\n\n    const shopTargetQdTotal = (() => {\n      const rows = lkStoreRows.filter(r => {\n        const code = cleanCode(r['MÃ ĐƠN VỊ'] || r['Mã đơn vị'] || '');\n        const name = String(r['TÊN ĐƠN VỊ'] || r['Siêu thị'] || r['SIÊU THỊ'] || '');\n        const isTzRow = code === '10341' || /AAR|TOPZONE/i.test(name);\n        const isTgdRow = code === '933' || /TGD|TGDD|THẾ GIỚI DI ĐỘNG/i.test(name);\n        return storeTab === 'TOPZONE' ? isTzRow : storeTab === 'TGDD' ? isTgdRow : isTzRow || isTgdRow;\n      });\n      return rows.reduce((sum, r) => sum + getCellNumber(r, ['TARGET QĐ (TR)', 'TARGET (TR)', 'TARGET']), 0);\n    })();\n\n    const employees: AggregatedEmployee[] = [];\n    buckets.forEach(bucket => {\n      const empProgRows = bucket.progRows;\n      const empRevRow = bucket.revRow || {};\n      const id = bucket.id || cleanCode(empRevRow['MÃ NHÂN VIÊN'] || '');\n      const name = bucket.name || String(empRevRow['TÊN NHÂN VIÊN'] || '').trim();\n\n      const sourceStore = String(empRevRow['SIÊU THỊ'] || '').toLowerCase();\n      const isTz = sourceStore.includes('topzone') || sourceStore.includes('aar') || TOPZONE_STAFF_SET.has(name) || TOPZONE_STAFF_SET.has(id) || empProgRows.some(r => r.__store === 'TOPZONE');\n      const storeName = isTz ? 'TopZone' : 'TGDĐ';\n      const storeConfigKey = isTz ? 'TOPZONE' : 'TGDD';\n\n      const cfg = (personnelConfig[storeConfigKey] || {})[name] || (personnelConfig[storeConfigKey] || {})[`${id} - ${name}`] || {\n        // Không có cấu hình thì xem là nhân sự hỗ trợ, tránh tự động đưa nhân sự cũ\n        // từ bảng thi đua vào nhóm chính thức và làm sai target.\n        isOfficial: false,\n        isVisible: true,\n        targetPct: 0,\n      };\n\n      // THẺ TỔNG: chỉ lấy từ Doanh thu nhân viên Lũy kế.\n      const totalDt = getCellNumber(empRevRow, ['DOANH THU (TR)', 'DOANH THU', 'DT', 'DT LŨY KẾ (TR)']);\n      const totalDtQd = getCellNumber(empRevRow, ['DOANH THU QĐ (TR)', 'DT QUY ĐỔI (TR)', 'DTQĐ', 'DT LŨY KẾ QĐ (TR)']);\n      const totalTragop = getCellNumber(empRevRow, ['DT TRẢ GÓP (TR)', 'DT TRẢ GÓP']);\n      const totalBill = getCellNumber(empRevRow, ['SỐ LƯỢNG', 'Số lượng', 'SL']);\n\n      // Target doanh thu NV = Stretch Goal target siêu thị / số nhân sự chính thức.\n      // Không dùng targetPct cũ trong cấu hình để tránh target doanh thu và target môn\n            >\n              🤖 AI Kế Hoạch\n            </button>\n          </div>\n\n          {/* Cards Column Config */}\n          {displayMode === 'CARDS' && (\n            <div className=\"flex items-center gap-1 rounded-xl bg-slate-100 p-1 text-xs font-bold shadow-inner\">\n              <span className=\"px-2 text-slate-500 hidden xl:inline\">Cột:</span>\n              <button\n                onClick={() => setCardCols(1)}\n                className={`px-2.5 py-1.5 rounded-lg transition cursor-pointer ${\n                  cardCols === 1 ? 'bg-white shadow-xs text-blue-600 font-bold' : 'text-slate-600'\n                }`}\n              >\n                1\n              </button>\n              <button\n                onClick={() => setCardCols(2)}\n                className={`px-2.5 py-1.5 rounded-lg transition cursor-pointer ${\n                  cardCols === 2 ? 'bg-white shadow-xs text-blue-600 font-bold' : 'text-slate-600'\n                }`}\n              >\n                2\n              </button>\n              <button\n                onClick={() => setCardCols(3)}\n                className={`px-2.5 py-1.5 rounded-lg transition cursor-pointer ${\n                  cardCols === 3 ? 'bg-white shadow-xs text-blue-600 font-bold' : 'text-slate-600'\n                }`}\n              >\n                3\n              </button>\n              <button\n                onClick={() => setIsExpandAllPrograms(!isExpandAllPrograms)}\n                className={`ml-1 px-2.5 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                  isExpandAllPrograms ? 'bg-indigo-600 text-white shadow-xs' : 'bg-white text-slate-700 shadow-xs'\n                }`}\n                title=\"Bấm để xem toàn bộ môn thi đua; bấm lại để thu gọn và bật cuộn\"\n              >\n                {isExpandAllPrograms ? '📖 Thu gọn' : '📜 Xem đủ môn'}\n              </button>\n              <button\n                type=\"button\"\n                onClick={() => void handleExportAllEmployeeCards()}\n                disabled={isBulkExporting}\n                className={`ml-1 px-3 py-1.5 rounded-lg transition cursor-pointer font-black text-[11px] flex items-center gap-1.5 ${\n                  isBulkExporting ? 'bg-slate-200 text-slate-500 cursor-wait' : 'bg-blue-600 text-white hover:bg-blue-700 shadow-xs'\n                }`}\n                title=\"Xuất các thẻ nhân viên đang hiển thị theo định dạng đã chọn\"\n              >\n                <Camera className=\"w-3.5 h-3.5\" />\n                {isBulkExporting ? `Đang xuất ${bulkExportProgress}` : `Xuất tất cả ảnh (${aggregatedEmployees.length})`}\n              </button>\n              <select aria-label=\"Định dạng xuất tất cả ảnh\" value={bulkExportFormat} disabled={isBulkExporting}\n                onChange={e => setBulkExportFormat(e.target.value as 'PNG' | 'ZIP')}\n                className=\"no-export px-2 py-1.5 rounded-lg bg-white text-xs font-bold border border-slate-200\">\n                <option value=\"PNG\">Ảnh PNG trực tiếp</option>\n                <option value=\"ZIP\">Gói ZIP</option>\n              </select>\n            </div>\n          )}\n\n          {displayMode === 'CARDS' && bulkExportFormat === 'PNG' && <div className=\"no-export w-full text-xs text-slate-500\">\n            Nếu trình duyệt hỏi quyền tải nhiều tệp, anh bấm <b>Cho phép</b>. Nếu đã chặn, bật quyền tải nhiều tệp trong cài đặt trang rồi tải lại ảnh còn thiếu.\n          </div>}\n          {directExportFiles.length > 0 && <div className=\"no-export w-full rounded-xl border border-blue-100 bg-blue-50 p-3 text-xs\">\n            <div className=\"font-bold mb-2\">Ảnh của lần xuất vừa rồi ({directExportFiles.length}) — tải lại từng ảnh nếu bị chặn</div>\n            <div className=\"flex flex-wrap gap-2\">{directExportFiles.map(file => <button key={file.fileName} type=\"button\" disabled={isBulkExporting}\n              onClick={() => downloadImage(file.blob, file.fileName)} className=
