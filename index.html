lick={(e) => {\n        if (e.target === e.currentTarget) onClose();\n      }}\n    >\n      <div className=\"bg-white rounded-3xl shadow-2xl max-w-2xl w-full p-5 sm:p-6 border border-slate-200 space-y-4 animate-fadeIn flex flex-col max-h-[90vh]\">\n        {/* Header */}\n        <div className=\"flex items-center justify-between pb-3 border-b border-slate-100 flex-shrink-0\">\n          <div className=\"flex items-center space-x-2.5\">\n            <div className=\"w-8 h-8 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold\">\n              <Camera className=\"w-4 h-4\" />\n            </div>\n            <div>\n              <h3 className=\"font-black text-slate-900 text-sm\">Xuất Ảnh Báo Cáo Thành Công!</h3>\n              <p className=\"text-[11px] text-slate-500 font-medium truncate max-w-xs sm:max-w-md\">\n                {imageResult.fileName}\n              </p>\n            </div>\n          </div>\n          <button\n            onClick={onClose}\n            className=\"p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition cursor-pointer\"\n          >\n            <X className=\"w-5 h-5\" />\n          </button>\n        </div>\n\n        {/* Image Preview Box */}\n        <div className=\"flex-1 min-h-0 overflow-y-auto custom-scroll rounded-2xl border border-slate-200 bg-slate-50 p-2 flex items-center justify-center\">\n          <img\n            src={imageResult.dataUrl}\n            alt={imageResult.fileName}\n            className=\"max-w-full max-h-[50vh] object-contain rounded-xl shadow-xs border border-slate-200\"\n          />\n        </div>\n\n        {/* Action Controls */}\n        <div className=\"flex-shrink-0 space-y-3 pt-1\">\n          <div className=\"flex flex-wrap items-center justify-between gap-2\">\n            <div className=\"flex items-center gap-2\">\n              <button\n                onClick={handleCopy}\n                className=\"px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition flex items-center gap-1.5 cursor-pointer\"\n                title=\"Sao chép ảnh để dán thẳng vào Zalo, Viber, PowerPoint...\"\n              >\n                {copied ? <Check className=\"w-4 h-4 text-emerald-600\" /> : <Copy className=\"w-4 h-4\" />}\n                <span>{copied ? 'Đã sao chép ảnh!' : 'Sao chép ảnh (Copy)'}</span>\n              </button>\n\n              <button\n                onClick={handleOpenInNewTab}\n                className=\"px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition flex items-center gap-1.5 cursor-pointer\"\n                title=\"Mở ảnh kích thước đầy đủ trong tab mới\"\n              >\n                <ExternalLink className=\"w-3.5 h-3.5\" />\n                <span className=\"hidden sm:inline\">Mở tab mới</span>\n              </button>\n            </div>\n\n            <div className=\"flex items-center gap-2\">\n              <button\n                onClick={handleDownload}\n                className=\"px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-xs transition flex items-center gap-1.5 cursor-pointer\"\n              >\n                <Download className=\"w-4 h-4\" />\n                <span>Tải Ảnh Về Máy (.PNG)</span>\n              </button>\n              <button\n                onClick={onClose}\n                className=\"px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs transition cursor-pointer\"\n              >\n                Đóng\n              </button>\n            </div>\n          </div>\n\n          <p className=\"text-[11px] text-slate-500 text-center\">\n            💡 <b>Mẹo:</b> Bạn có thể bấm <b>Sao chép ảnh</b> rồi nhấn <code>Ctrl + V</code> để gửi ngay vào tin nhắn Zalo / Nhóm bán hàng!\n          </p>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/components/ProgramDetailModal.tsx":"import React, { useRef, useState } from 'react';\nimport { Camera, X, CheckCircle, AlertCircle, Clock, Loader2 } from 'lucide-react';\nimport { captureElement, downloadImage } from '../utils/imageExporter';\nimport { formatCurrency, formatInt, formatPercent, formatProgramName, cleanCode, cleanProgName } from '../utils/formatters';\nimport { AppDataState, PersonnelConfigMap } from '../types';\n\nexport interface StaffSellingDetail {\n  name: string;\n  id: string;\n  sl: number;\n  dtThuc: number;\n  dtQd: number;\n  empTarget: number;\n  pctLk: number;\n  pctDu: number;\n  isDone: boolean;\n}\n\ninterface ProgramDetailModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  storeKey?: string;\n  programCode?: string | number;\n  programName?: string;\n  appData?: AppDataState;\n  personnelConfig?: PersonnelConfigMap;\n  storeName?: string;\n  progCode?: string | number;\n  progName?: string;\n  loaiTd?: number;\n  shopThuc?: number;\n  shopTarget?: number;\n  shopPctLk?: number;\n  shopPctDu?: number;\n  staffList?: StaffSellingDetail[];\n  onSaveScreenshot?: (item: { name: string; url: string; time: string }) => void;\n}\n\nconst normalizeStoreKey = (value?: string) => {\n  const s = String(value || '').trim().toUpperCase();\n  if (s === 'TOPZONE' || s === 'AAR' || s === '10341' || s.includes('TOPZONE') || s.includes('AAR')) return 'TOPZONE';\n  return 'TGDD';\n};\n\nconst isStoreRow = (row: any, store: 'TGDD' | 'TOPZONE') => {\n  const code = cleanCode(row?.['MÃ ĐƠN VỊ'] || row?.['Mã đơn vị'] || row?.['MÃ ĐƠN VỊ'] || '');\n  const name = String(row?.['TÊN ĐƠN VỊ'] || row?.['ĐƠN VỊ / NHÂN VIÊN'] || row?.['Siêu thị'] || '').toUpperCase();\n  return store === 'TOPZONE'\n    ? code === '10341' || /TOPZONE|AAR/.test(name)\n    : code === '933' || /TGDĐ|TGDD|TGD\\b|THẾ GIỚI DI ĐỘNG/.test(name);\n};\n\nconst canonicalEmployeeName = (value: any) => {\n  const raw = String(value || '').trim();\n  return raw.replace(/^\\d{4,7}\\s*[-_–]\\s*/, '').trim();\n};\n\nexport const ProgramDetailModal: React.FC<ProgramDetailModalProps> = ({\n  isOpen,\n  onClose,\n  storeKey,\n  programCode,\n  programName,\n  appData,\n  personnelConfig,\n  storeName: propStoreName,\n  progCode: propProgCode,\n  progName: propProgName,\n  loaiTd: propLoaiTd,\n  shopThuc: propShopThuc,\n  shopTarget: propShopTarget,\n  shopPctLk: propShopPctLk,\n  shopPctDu: propShopPctDu,\n  staffList: propStaffList,\n  onSaveScreenshot,\n}) => {\n  const cardRef = useRef<HTMLDivElement>(null);\n  const [isExporting, setIsExporting] = useState<boolean>(false);\n\n  if (!isOpen) return null;\n\n  const effectiveStore = storeKey || propStoreName || 'TGDĐ';\n  const storeType = normalizeStoreKey(effectiveStore);\n  const isTopZone = storeType === 'TOPZONE';\n  const effectiveCode = programCode !== undefined ? programCode : propProgCode;\n  const effectiveName = programName || propProgName || 'Chi tiết môn thi đua';\n\n  let computedLoaiTd = propLoaiTd || 3;\n  let computedShopThuc = propShopThuc || 0;\n  let computedShopTarget = propShopTarget || 0;\n  let computedPctLk = propShopPctLk || 0;\n  let computedPctDu = propShopPctDu || 0;\n  let computedStaffList: StaffSellingDetail[] = propStaffList || [];\n\n  if (appData) {\n    const codeStr = effectiveCode !== undefined && effectiveCode !== null ? cleanCode(effectiveCode) : '';\n    const nameClean = cleanProgName(effectiveName || '');\n    const isProgMatch = (r: any) => {\n      const rCode = cleanCode(r?.['MÃ CHƯƠNG TRÌNH']);\n      const rName = cleanProgName(r?.['CHƯƠNG TRÌNH'] || '');\n      // When a program code exists, it is the canonical key. Do not fall back to\n      // another store's row just because the program name happens to match.\n      if (codeStr && rCode) return rCode === codeStr;\n      // Không dùng includes: các môn như \"TABLET ANDROID\" và\n      // \"ĐIỆN THOẠI & TABLET ANDROID\" là 2 chương trình hoàn toàn khác nhau.\n      return !!nameClean && rName === nameClean;\n    };\n\n    // Find the program ONLY inside the selected store.\n    const tdRow = (appData.td_luyke || []).find((r: any) => isStoreRow(r, storeType) && isProgMatch(r));\n\n    if (tdRow) {\n      computedLoaiTd = Number(tdRow['LOẠI TĐ']) || 3;\n      computedShopTarget = Number(tdRow['TARGET (TR/SL theo LOẠI TĐ)']) || 0;\n      computedShopThuc = (computedLoaiTd === 2 || computedLoaiTd === 6)\n        ? (Number(tdRow['SỐ LƯỢNG']) || 0)\n        : (Number(tdRow['DT QUY ĐỔI (TR)']) || Number(tdRow['DOANH THU (TR)']) || 0);\n      computedPctLk = Number(tdRow['% HT THÁNG']) || 0;\n      computedPctDu = Number(tdRow['% DỰ BÁO']) || 0;\n    }\n\n    // Không phụ thuộc vào việc parser đã xếp dòng vào nv_tgdd hay nv_tz.\n    // BI employee row có MÃ ĐƠN VỊ/TÊN ĐƠN VỊ là nguồn sự thật để xác định shop.\n    // Điều này cũng sửa trường hợp dữ liệu trước đó bị xếp nhầm 933 <-> 10341.\n    const nvSource = [\n      ...(appData.nv_tgdd || []),\n      ...(appData.nv_tz || []),\n    ].filter((r: any) => isStoreRow(r, storeType));\n    const resolvedProgCode = tdRow ? cleanCode(tdRow['MÃ CHƯƠNG TRÌNH']) : codeStr;\n\n    // Quan trọng: mỗi lần bấm một môn phải lọc đúng MÔN đó.\n    // Không dùng danh sách nhân sự cấu hình để loại dòng BI, vì một nhân viên\n    // có thể hỗ trợ chéo giữa TGDĐ/TopZone và BI vẫn phải được tôn trọng.\n    const filteredStaff = nvSource.filter((r: any) => {\n      const rCode = cleanCode(r?.['MÃ CHƯƠNG TRÌNH']);\n      const rName = cleanProgName(r?.['CHƯƠNG TRÌNH'] || '');\n\n      // Nếu cả hai bên có mã chương trình thì mã là khóa chính.\n      if (resolvedProgCode && rCode) return rCode === resolvedProgCode;\n\n      // BI hiện tại của anh không có MÃ CHƯƠNG TRÌNH ở bảng nhân viên,\n      // nên bắt buộc đối chiếu theo TÊN MÔN chính xác (không includes).\n      if (nameClean && rName) return rName === nameClean;\n      return false;\n    });\n\n    if (filteredStaff.length > 0) {\n      const seen = new Set<string>();\n      computedStaffList = filteredStaff\n        .map((r: any) => {\n          const empNameRaw = String(r?.['ĐƠN VỊ / NHÂN VIÊN'] || r?.['TÊN NHÂN VIÊN'] || '').trim();\n          const empName = canonicalEmployeeName(empNameRaw);\n          const empId = cleanCode(r?.['MÃ NV'] || r?.['MÃ NHÂN VIÊN'] || '');\n          const key = empId ? `id:${empId}` : `name:${empName.toLowerCase()}`;\n          if (seen.has(key)) return null;\n          seen.add(key);\n\n          const sl = Number(r?.['SỐ LƯỢNG']) || 0;\n          const dtThuc = Number(r?.['DOANH THU (TR)']) || 0;\n          const dtQd = Number(r?.['DT QUY ĐỔI (TR)']) || dtThuc;\n          const empLoai = Number(r?.['LOẠI TĐ']) || computedLoaiTd;\n          const isQuantity = empLoai === 2 || empLoai === 6;\n\n          const cfgMap = personnelConfig?.[storeType] || {};\n          const officialStaffCount = Object.values(cfgMap).filter((cfg: any) => cfg?.isOfficial === true).length;\n          const staffCount = officialStaffCount > 0\n            ? officialStaffCount\n            : (storeType === 'TGDD' ? 4 : 6);\n          // TARGET CÁ NHÂN = TARGET MÔN SHOP × 150% / SỐ NHÂN SỰ CHÍNH THỨC.\n          // Target môn shop ở đây đã được lấy bằng tên chương trình chính xác,\n          // nên TABLET ANDROID sẽ không thể nhầm với ĐIỆN THOẠI & TABLET ANDROID.\n          let empTarget = computedShopTarget > 0\n            ? Math.round((computedShopTarget * 1.5 / staffCount) * 10) / 10\n            : (Number(r?.['TARGET']) || Number(r?.['TARGET (TR/SL theo LOẠI TĐ)']) || 0);\n\n          const currentAchieved = isQuantity ? sl : (dtQd || dtThuc);\n          const pctLk = empTarget > 0\n            ? (currentAchieved / empTarget) * 100\n            : (Number(r?.['% LŨY KẾ']) || 0);\n          const pctDu = Number(r?.['% DỰ BÁO']) || (pctLk * 1.2);\n\n          return {\n            name: empName || empNameRaw,\n            id: empId,\n            sl,\n            dtThuc,\n            dtQd,\n            empTarget,\n            pctLk,\n            pctDu,\n            isDone: pctLk >= 100,\n          } as StaffSellingDetail;\n        })\n        .filter(Boolean) as StaffSellingDetail[];\n    }\n  }\n\n  const isQty = computedLoaiTd === 2 || computedLoaiTd === 6;\n  const totalAchieved = computedStaffList.reduce((sum, emp) => sum + (isQty ? emp.sl : (emp.dtQd || emp.dtThuc)), 0);\n  const totalTarget = computedStaffList.reduce((sum, emp) => sum + emp.empTarget, 0);\n  const totalGap = Math.max(0, totalTarget - totalAchieved);\n  const doneCount = computedStaffList.filter(emp => emp.pctLk >= 100).length;\n  const needRunCount = computedStaffList.filter(emp => emp.pctLk < 100).length;\n\n  const handleExportImage = async () => {\n    if (!cardRef.current || isExporting) return;\n    setIsExporting(true);\n    try {\n      const cleanName = String(effectiveName || 'Mon_Thi_Dua').replace(/[^a-zA-Z0-9_]/g, '_');\n      const filename = `Chi_Tiet_Mon_${cleanName}_${new Date().toISOString().slice(0, 10)}.png`;\n      const result = await captureElement(cardRef.current, {\n        fileName: filename,\n        backgroundColor: '#ffffff',\n        scale: 2,\n      });\n      if (onSaveScreenshot) {\n        onSaveScreenshot({ name: result.fileName, url: result.dataUrl, time: new Date().toLocaleTimeString('vi-VN') });\n      }\n      downloadImage(result.blob, result.fileName);\n    } catch (err) {\n      console.error('Export detail error:', err);\n    } finally {\n      setIsExporting(false);\n    }\n  };\n\n  return (\n    <div\n      className=\"fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-5 overflow-y-auto\"\n      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}\n    >\n      <div ref={cardRef} className=\"bg-white rounded-3xl shadow-2xl max-w-5xl w-full p-5 sm:p-6 border border-slate-200 space-y-4 my-auto animate-fadeIn\">\n        <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100\">\n          <div className=\"flex items-center space-x-3 min-w-0\">\n            <span className=\"px-2.5 py-1 bg-blue-600 text-white font-mono font-black text-xs rounded-xl shadow-xs shrink-0\">Mã {effectiveCode || '---'}</span>\n            <div className=\"min-w-0\">\n              <div className=\"flex items-center gap-2 flex-wrap\">\n                <h3 className=\"font-black text-slate-900 text-base uppercase tracking-tight truncate\">{formatProgramName(effectiveName)}</h3>\n                <span className=\"px-2.5 py-0.5 rounded-lg text-[10.5px] font-extrabold bg-amber-100 text-amber-900 shrink-0\">\n                  {isTopZone ? 'AAR / TopZone (10341)' : 'TGD NHT (933)'}\n                </span>\n              </div>\n              <p className=\"text-xs text-slate-500 font-medium\">Chi tiết nhân sự bán hàng & tiến độ hoàn thành môn</p>\n            </div>\n          </div>\n          <div className=\"flex items-center gap-2 shrink-0\">\n            <button onClick={handleExportImage} disabled={isExporting} className=\"px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-bold text-xs rounded-xl shadow-xs transition flex items-center gap-1.5 cursor-pointer\">\n              {isExporting ? <Loader2 className=\"w-3.5 h-3.5 animate-spin\" /> : <Camera className=\"w-3.5 h-3.5\" />}\n              <span>{isExporting ? 'Đang xuất...' : 'Xuất Ảnh'}</span>\n            </button>\n            <button onClick={onClose} className=\"px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs rounded-xl transition cursor-pointer\"><X className=\"w-4 h-4\" /></button>\n          </div>\n        </div>\n\n        <div className=\"grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-center\">\n          <div className=\"bg-slate-50 border border-slate-200 rounded-2xl p-2.5\">\n            <span className=\"text-[9.5px] text-slate-400 font-bold uppercase block\">THỰC ĐẠT SHOP</span>\n            <span className=\"text-base font-black text-slate-900 mt-0.5 block\">{isQty ? `${formatInt(computedShopThuc)} món` : `${formatCurrency(computedShopThuc)} TR`}</span>\n          </div>\n          <div className=\"bg-slate-50 border border-slate-200 rounded-2xl p-2.5\">\n            <span className=\"text-[9.5px] text-slate-400 font-bold uppercase block\">TARGET SHOP</span>\n            <span className=\"text-base font-black text-slate-700 mt-0.5 block\">{isQty ? `${formatInt(computedShopTarget)} món` : `${formatCurrency(computedShopTarget)} TR`}</span>\n          </div>\n          <div className=\"bg-blue-50/70 border border-blue-200 rounded-2xl p-2.5\">\n            <span className=\"text-[9.5px] text-blue-600 font-bold uppercase block\">% HOÀN THÀNH SHOP</span>\n            <span className=\"text-base font-black text-blue-700 mt-0.5 block\">{formatPercent(computedPctLk)}</span>\n          </div>\n          <div className=\"bg-emerald-50/70 border border-emerald-200 rounded-2xl p-2.5\">\n            <span className=\"text-[9.5px] text-emerald-600 font-bold uppercase block\">DỰ BÁO CHỐT SHOP</span>\n            <span className=\"text-base font-black text-emerald-700 mt-0.5 block\">{formatPercent(computedPctDu)}</span>\n          </div>\n        </div>\n\n        <div className=\"grid grid-cols-3 gap-2.5 text-center\">\n          <div className=\"rounded-2xl border border-slate-200 bg-white p-2.5\"><span className=\"block text-[9px] font-bold text-slate-400 uppercase\">Nhân sự</span><b className=\"text-lg text-slate-900\">{computedStaffList.length}</b></div>\n          <div className=\"rounded-2xl border border-emerald-200 bg-emerald-50/60 p-2.5\"><span className=\"block text-[9px] font-bold text-emerald-600 uppercase\">Đã về số</span><b className=\"text-lg text-emerald-700\">{doneCount}</b></div>\n          <div className=\"rounded-2xl border border-rose-200 bg-rose-50/60 p-2.5\"><span className=\"block text-[9px] font-bold text-rose-600 uppercase\">Còn cần chạy</span><b className=\"text-lg text-rose-700\">{needRunCount}</b></div>\n        </div>\n\n        <div className=\"space-y-2 pt-1\">\n          <div className=\"flex items-center justify-between gap-3\">\n            <div>\n              <h4 className=\"font-extrabold text-slate-800 text-xs uppercase\">Bảng Chi Tiết Nhân Viên Bán Môn Này</h4>\n              <p className=\"text-[10px] text-slate-400 mt-0.5\">Đã lọc đúng theo <b>{isTopZone ? 'AAR / TopZone (10341)' : 'TGD NHT (933)'}</b> và mã môn.</p>\n            </div>\n            <span className=\"text-[11px] text-slate-500 font-medium shrink-0\">{computedStaffList.length} nhân sự</span>\n          </div>\n          <div className=\"overflow-x-auto custom-scroll max-h-[420px] border border-slate-200 rounded-2xl\">\n            <table className=\"w-full text-left text-xs border-collapse min-w-[920px]\">\n              <thead className=\"bg-slate-900 text-white font-bold text-[10.5px] sticky top-0 shadow-xs z-10\">\n                <tr>\n                  <th className=\"py-2.5 px-3 text-center w-10\">#</th>\n                  <th className=\"py-2.5 px-3\">MÃ NV</th>\n                  <th className=\"py-2.5 px-4\">TÊN NHÂN VIÊN</th>\n                  <th className=\"py-2.5 px-3 text-center\">SỐ LƯỢNG</th>\n                  <th className=\"py-2.5 px-3 text-right\">DT THỰC (TR)</th>\n                  <th className=\"py-2.5 px-3 text-right font-black text-indigo-300\">DT QĐ (TR)</th>\n                  <th className=\"py-2.5 px-3 text-right\">TARGET CÁ NHÂN</th>\n                  <th className=\"py-2.5 px-3 text-right text-rose-300\">CÒN THIẾU</th>\n                  <th className=\"py-2.5 px-3 text-center font-black\">% LK</th>\n                  <th className=\"py-2.5 px-3 text-center font-bold text-amber-300\">% DỰ BÁO</th>\n                  <th className=\"py-2.5 px-3 text-center\">TRẠNG THÁI</th>\n                </tr>\n              </thead>\n              <tbody className=\"divide-y divide-slate-100 font-semibold text-slate-700\">\n                {computedStaffList.length === 0 ? (\n                  <tr><td colSpan={11} className=\"py-8 text-center text-slate-400 font-medium\">Chưa ghi nhận số liệu nhân viên bán môn này.</td></tr>\n                ) : (\n                  computedStaffList\n                    .slice()\n                    .sort((a, b) => a.pctLk - b.pctLk)\n                    .map((emp, idx) => {\n                      const achieved = isQty ? emp.sl : (emp.dtQd || emp.dtThuc);\n                      const gap = Math.max(0, emp.empTarget - achieved);\n                      let badge = <span className=\"px-2 py-0.5 rounded text-[10px] font-black bg-rose-100 text-rose-800\">Cần chạy</span>;\n                      if (emp.pctLk >= 100) badge = <span className=\"px-2 py-0.5 rounded text-[10px] font-black bg-emerald-100 text-emerald-800\">✓ Về Số</span>;\n                      else if (emp.pctDu >= 100) badge = <span className=\"px-2 py-0.5 rounded text-[10px] font-black bg-emerald-50 text-emerald-700 border border-emerald-300\">✓ Dự kiến đạt</span>;\n                      else if (emp.pctDu >= 80) badge = <span className=\"px-2 py-0.5 rounded text-[10px] font-black bg-amber-100 text-amber-800\">⚡ Gần Về</span>;\n                      return (\n                        <tr key={`${emp.id || emp.name}-${idx}`} className={`hover:bg-blue-50 transition border-b border-slate-100 ${emp.isDone ? 'bg-emerald-50/20' : ''}`}>\n                          <td className=\"py-2.5 px-3 text-center font-bold text-slate-500\">{idx + 1}</td>\n                          <td className=\"py-2.5 px-3 font-mono text-slate-400\">{emp.id || '—'}</td>\n                          <td className=\"py-2.5 px-4 font-bold text-slate-900\">{emp.name}</td>\n                          <td className=\"py-2.5 px-3 text-center font-mono font-bold\">{formatInt(emp.sl)}</td>\n                          <td className=\"py-2.5 px-3 text-right font-mono font-bold text-slate-800\">{formatCurrency(emp.dtThuc)}</td>\n                          <td className=\"py-2.5 px-3 text-right font-mono font-black text-indigo-700 bg-indigo-50/40\">{formatCurrency(emp.dtQd)}</td>\n                          <td className=\"py-2.5 px-3 text-right font-mono text-slate-500\">{isQty ? formatInt(emp.empTarget) : formatCurrency(emp.empTarget)}</td>\n                          <td className={`py-2.5 px-3 text-right font-mono font-black ${gap > 0 ? 'text-rose-600' : 'text-emerald-600'}`}>{gap > 0 ? (isQty ? formatInt(gap) : formatCurrency(gap)) : '✓ 0'}</td>\n                          <td className={`py-2.5 px-3 text-center font-black ${emp.pctLk >= 100 ? 'text-emerald-700' : 'text-slate-700'}`}>{formatPercent(emp.pctLk)}</td>\n                          <td className={`py-2.5 px-3 text-center font-black ${emp.pctDu >= 100 ? 'text-emerald-600' : emp.pctDu >= 80 ? 'text-amber-600' : 'text-rose-600'}`}>{formatPercent(emp.pctDu)}</td>\n                          <td className=\"py-2.5 px-3 text-center\">{badge}</td>\n                        </tr>\n                      );\n                    })\n                )}\n              </tbody>\n            </table>\n          </div>\n\n          {computedStaffList.length > 0 && (\n            <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-2 rounded-2xl bg-slate-50 border border-slate-200 px-3 py-2 text-[10.5px]\">\n              <span className=\"text-slate-500\">Tổng target cá nhân: <b className=\"text-slate-800\">{isQty ? `${formatInt(totalTarget)} món` : `${formatCurrency(totalTarget)} TR`}</b></span>\n              <span className=\"text-slate-500\">Tổng còn thiếu: <b className=\"text-rose-600\">{isQty ? `${formatInt(totalGap)} món` : `${formatCurrency(totalGap)} TR`}</b></span>\n              <span className=\"text-slate-500\">Tổng thực đạt NV: <b className=\"text-slate-800\">{isQty ? `${formatInt(totalAchieved)} món` : `${formatCurrency(totalAchieved)} TR`}</b></span>\n            </div>\n          )}\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/components/QuickUploadModal.tsx":"import React, { useRef, useState, useMemo } from 'react';\nimport {\n  UploadCloud,\n  X,\n  FileSpreadsheet,\n  Check,\n  Loader2,\n  AlertTriangle,\n  RefreshCw,\n  AlertCircle,\n  Clipboard,\n  Sparkles,\n  Database,\n  ArrowRight,\n  CheckCircle2,\n  Table,\n  Trash2,\n} from 'lucide-react';\nimport { parseExcelFile, ParseResult } from '../utils/excelParser';\nimport { AppDataState } from '../types';\nimport {\n  parsePastedData,\n  CATEGORY_LABELS,\n  ParseDiagnostics,\n} from '../utils/smartDataParser';\n\ninterface QuickUploadModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  onDataParsed?: (newData: Partial<AppDataState>) => void;\n  appData?: AppDataState;\n  onFilesSelected?: (files: FileList | File[]) => void;\n  onOpenClearModal?: () => void;\n}\n\ninterface UploadReport {\n  successList: { filename: string; categoryName: string; rows: number }[];\n  errorList: { filename: string; error: string; advice?: string }[];\n}\n\nexport const QuickUploadModal: React.FC<QuickUploadModalProps> = ({\n  isOpen,\n  onClose,\n  onDataParsed,\n  appData,\n  onFilesSelected,\n  onOpenClearModal,\n}) => {\n  const [activeTab, setActiveTab] = useState<'paste' | 'file'>('paste');\n\n  // Paste Mode States\n  const [selectedCategory, setSelectedCategory] = useState<string>('auto');\n  const [inputText, setInputText] = useState<string>('');\n  const [pasteError, setPasteError] = useState<string | null>(null);\n  const [showFullPreview, setShowFullPreview] = useState<boolean>(false);\n\n  // File Upload Mode States\n  const fileInputRef = useRef<HTMLInputElement>(null);\n  const [isProcessing, setIsProcessing] = useState<boolean>(false);\n  const [uploadStatus, setUploadStatus] = useState<string>('');\n  const [report, setReport] = useState<UploadReport | null>(null);\n\n  // Live parsing for paste tab\n  const parseResult = useMemo(() => {\n    if (!inputText.trim()) return null;\n    const catToUse =\n      selectedCategory === 'auto' ? null : (selectedCategory as keyof AppDataState);\n    const existingStoreLuyKeDtQd = (appData?.dt_luyke || []).reduce((s: number, r: any) => s + (Number(r?.['DOANH THU QĐ (TR)']) || 0), 0);\n    const existingEmployeeLuyKeDtQd = (appData?.dt_nv_luyke || []).reduce((s: number, r: any) => s + (Number(r?.['DOANH THU QĐ (TR)']) || 0), 0);\n    return parsePastedData(inputText, catToUse, { existingStoreLuyKeDtQd, existingEmployeeLuyKeDtQd });\n  }, [inputText, selectedCategory]);\n\n  if (!isOpen) return null;\n\n  const isSuccess = parseResult && !('error' in parseResult);\n  const diagnostics = isSuccess ? (parseResult as ParseDiagnostics) : null;\n  const pasteErrorMessage = parseResult && 'error' in parseResult ? parseResult.error : null;\n\n  // Handle read clipboard\n  const handleReadClipboard = async () => {\n    try {\n      const text = await navigator.clipboard.readText();\n      if (text && text.trim()) {\n        setInputText(text);\n        setPasteError(null);\n      } else {\n        setPasteError('Clipboard trống. Hãy sao chép bảng trên web BI rồi nhấn Ctrl + V!');\n      }\n    } catch (e) {\n      setPasteError('Trình duyệt chặn quyền tự đọc. Bạn vui lòng nhấn Ctrl + V trực tiếp vào khung nhập!');\n    }\n  };\n\n  // Commit pasted data\n  const handleCommitPastedData = () => {\n    if (!diagnostics || diagnostics.data.length === 0) {\n      setPasteError('Chưa có dữ liệu hợp lệ để lưu.');\n      return;\n    }\n    if (onDataParsed) {\n      onDataParsed({\n        [diagnostics.category]: diagnostics.data,\n      });\n    }\n    setInputText('');\n    setPasteError(null);\n    onClose();\n  };\n\n  // Process Files\n  const processFiles = async (files: FileList | File[]) => {\n    if (!files || files.length === 0) return;\n    setIsProcessing(true);\n    setUploadStatus('Đang đọc và phân tích cấu trúc files...');\n    setReport(null);\n\n    try {\n      const fileArr = Array.from(files);\n      const updates: Partial<AppDataState> = {};\n      const successList: { filename: string; categoryName: string; rows: number }[] = [];\n      const errorList: { filename: string; error: string; advice?: string }[] = [];\n\n      for (const file of fileArr) {\n        try {\n          const res: ParseResult = await parseExcelFile(file);\n          if (res.success && res.category && res.data && res.data.length > 0) {\n            updates[res.category] = res.data as any;\n            successList.push({\n              filename: file.name,\n              categoryName: res.categoryName || res.category,\n              rows: res.rowCount,\n            });\n          } else {\n            errorList.push({\n              filename: file.name,\n              error: res.error || 'Cấu trúc file không đúng định dạng',\n              advice: res.advice || 'Vui lòng kiểm tra lại cột tiêu đề hoặc nội dung file Excel.',\n            });\n          }\n        } catch (err: any) {\n          errorList.push({\n            filename: file.name,\n            error: 'Lỗi không xác định khi mở file',\n            advice: err?.message || 'File có thể bị mã hóa, bị hỏng hoặc dung lượng bất thường.',\n          });\n        }\n      }\n\n      if (Object.keys(updates).length > 0 && onDataParsed) {\n        onDataParsed(updates);\n      }\n      if (onFilesSelected) {\n        onFilesSelected(files);\n      }\n\n      setReport({ successList, errorList });\n      setIsProcessing(false);\n\n      if (errorList.length === 0 && successList.length > 0) {\n        setUploadStatus(`Đã nhận diện và nạp thành công ${successList.length} file!`);\n        setTimeout(() => {\n          setReport(null);\n          onClose();\n        }, 1200);\n      }\n    } catch (e: any) {\n      setIsProcessing(false);\n      setUploadStatus('Có lỗi hệ thống khi xử lý files!');\n      setReport({\n        successList: [],\n        errorList: [{ filename: 'Hệ thống', error: 'Lỗi xử lý file', advice: e?.message }],\n      });\n    }\n  };\n\n  const handleDrop = (e: React.DragEvent<HTMLDivElement>) => {\n    e.preventDefault();\n    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {\n      processFiles(e.dataTransfer.files);\n    }\n  };\n\n  return (\n    <div\n      className=\"fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200\"\n      onClick={(e) => {\n        if (e.target === e.currentTarget && !isProcessing) {\n          onClose();\n        }\n      }}\n    >\n      <div className=\"bg-white rounded-3xl shadow-2xl max-w-3xl w-full p-6 border border-slate-200 space-y-4 max-h-[92vh] flex flex-col overflow-hidden text-slate-800\">\n        {/* Header */}\n        <div className=\"flex items-center justify-between pb-3 border-b border-slate-100 flex-shrink-0\">\n          <div className=\"flex items-center space-x-2.5\">\n            <span className=\"p-2.5 bg-blue-50 text-blue-600 rounded-xl font-bold\">\n              <Clipboard className=\"w-5 h-5\" />\n            </span>\n            <div>\n              <h4 className=\"font-black text-slate-900 text-base\">Trung Tâm Nhập & Dán Dữ Liệu Báo Cáo</h4>\n              <p className=\"text-xs text-slate-500 font-medium\">\n                Hỗ trợ sao chép trực tiếp từ web BI MWG (không cần xuất Excel) hoặc nạp file có sẵn\n              </p>\n            </div>\n          </div>\n          <button\n            onClick={onClose}\n            disabled={isProcessing}\n            className=\"text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-100 transition cursor-pointer disabled:opacity-50\"\n          >\n            <X className=\"w-5 h-5\" />\n          </button>\n        </div>\n\n        {/* Tab Navigation */}\n        <div className=\"flex items-center gap-2 p-1 bg-slate-100 rounded-xl flex-shrink-0\">\n          <button\n            onClick={() => setActiveTab('paste')}\n            type=\"button\"\n            className={`flex-1 py-2 px-4 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 cursor-pointer ${\n              activeTab === 'paste'\n                ? 'bg-white text-blue-700 shadow-xs'\n                : 'text-slate-600 hover:text-slate-900'\n            }`}\n          >\n            <Clipboard className=\"w-4 h-4 text-blue-600\" />\n            <span>📋 Dán Nội Dung (Copy & Paste Từ Web BI)</span>\n            <span className=\"text-[10px] px-1.5 py-0.5 bg-blue-100 text-blue-800 rounded font-semibold\">\n              Mới • Khuyên dùng\n            </span>\n          </button>\n\n          <button\n            onClick={() => setActiveTab('file')}\n            type=\"button\"\n            className={`py-2 px-4 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 cursor-pointer ${\n              activeTab === 'file'\n                ? 'bg-white text-slate-900 shadow-xs'\n                : 'text-slate-600 hover:text-slate-900'\n            }`}\n          >\n            <FileSpreadsheet className=\"w-4 h-4 text-emerald-600\" />\n            <span>📁 Chọn File Excel / CSV</span>\n          </button>\n        </div>\n\n        {/* Modal Body */}\n        <div className=\"overflow-y-auto custom-scroll flex-1 pr-1 space-y-4\">\n          {activeTab === 'paste' ? (\n            /* TAB 1: PASTE DATA */\n            <div className=\"space-y-3\">\n              {/* DATA INPUT — placed first for fastest Copy/Paste workflow */}\n              <div className=\"relative\">\n                <textarea\n                  autoFocus\n                  value={inputText}\n                  onChange={(e) => {\n                    setInputText(e.target.value);\n                    setPasteError(null);\n                  }}\n                  placeholder={`Dán dữ liệu BI vào đây (Ctrl + V)...\\n\\nCó thể Ctrl + A → Ctrl + C toàn bộ trang BI rồi dán trực tiếp. Hệ thống sẽ tự nhận diện bảng.`}\n                  rows={10}\n                  className=\"w-full font-mono text-xs bg-white border-2 border-blue-200 rounded-2xl p-4 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition custom-scroll placeholder:text-slate-400 leading-relaxed shadow-sm\"\n                />\n              </div>\n\n              {/* Lưu ngay dưới ô nhập để thao tác Dán → Lưu nhanh */}\n              <button\n                onClick={handleCommitPastedData}\n                disabled={!diagnostics || diagnostics.data.length === 0}\n                type=\"button\"\n                className={`w-full inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl text-sm font-extrabold text-white shadow-md transition ${\n                  diagnostics && diagnostics.data.length > 0\n                    ? 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-600/20 active:scale-[0.99] cursor-pointer'\n                    : 'bg-slate-300 cursor-not-allowed text-slate-500'\n                }`}\n              >\n                <CheckCircle2 className=\"w-5 h-5\" />\n                Lưu Dữ Liệu Vào Hệ Thống ({diagnostics?.rowCount || 0} dòng)\n              </button>\n\n              {/* Only the essential selector remains */}\n              <div className=\"flex items-center justify-between gap-3 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2\">\n                <div className=\"flex items-center gap-2 text-xs font-bold text-slate-700\">\n                  <Database className=\"w-4 h-4 text-blue-600\" />\n                  <span>Loại dữ liệu</span>\n                </div>\n                <select\n                  value={selectedCategory}\n                  onChange={(e) => setSelectedCategory(e.target.value)}\n                  className=\"flex-1 max-w-md bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer\"\n                >\n                  <option value=\"auto\">✨ Tự động nhận diện theo bảng dán</option>\n                  {Object.entries(CATEGORY_LABELS).map(([key, label]) => (\n                    <option key={key} value={key}>\n                      {label}\n                    </option>\n                  ))}\n                </select>\n              </div>\n\n              {/* Session clear — kept because it is a real data-safety action */}\n              {onOpenClearModal && (\n                <div className=\"flex justify-end\">\n                  <button\n                    onClick={onOpenClearModal}\n                    type=\"button\"\n                    className=\"inline-flex items-center gap-1.5 px-2.5 py-1.5 text-[11px] text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-lg font-bold transition cursor-pointer\"\n                    title=\"Xóa toàn bộ data đang lưu trong phiên\"\n                  >\n                    <Trash2 className=\"w-3.5 h-3.5 text-rose-600\" />\n                    Xóa data phiên\n                  </button>\n                </div>\n              )}\n\n              {/* Paste Error */}\n              {pasteError && (\n                <div className=\"p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-center gap-2 text-xs text-amber-800\">\n                  <AlertTriangle className=\"w-4 h-4 text-amber-600 flex-shrink-0\" />\n                  <span>{pasteError}</span>\n                </div>\n              )}\n\n              {/* Diagnostics & Preview */}\n              {diagnostics && (\n                <div className=\"bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3\">\n                  <div className=\"flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 pb-2\">\n                    <div className=\"flex items-center gap-2\">\n                      <CheckCircle2 className=\"w-4 h-4 text-emerald-600\" />\n                      <span className=\"text-xs font-bold text-slate-900\">\n                        Khớp với: {diagnostics.categoryName}\n                      </span>\n                      <span className=\"px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200\">\n                        {diagnostics.rowCount} dòng dữ liệu\n                      </span>\n                    </div>\n                    <button\n                      type=\"button\"\n                      onClick={() => setShowFullPreview(!showFullPreview)}\n                      className=\"text-xs text-blue-600 hover:text-blue-700 font-medium flex items-center gap-1 cursor-pointer\"\n                    >\n                      <Table className=\"w-3.5 h-3.5\" />\n                      {showFullPreview ? 'Thu gọn' : 'Xem trước bảng'}\n                    </button>\n                  </div>\n\n                  {/* Ctrl + A Full Page Extraction Indicator */}\n                  {diagnostics.pageExtractedInfo?.isFullPageExtracted && (\n                    <div className=\"p-2.5 bg-emerald-50 border border-emerald-200 rounded-lg text-xs text-emerald-900 flex items-center gap-2 font-medium\">\n                      <Sparkles className=\"w-4 h-4 text-emerald-600 flex-shrink-0\" />\n                      <span>\n                        <b>✨ Đã tự động lọc sạch trang web (Ctrl + A):</b> Bỏ qua{' '}\n                        <b>{diagnostics.pageExtractedInfo.ignoredNoiseLines} dòng</b> menu/chân trang thừa, nhận diện bảng tại dòng{' '}\n                        <b>{diagnostics.pageExtractedInfo.headerFoundAtLine + 1}</b>!\n                      </span>\n                    </div>\n                  )}\n\n                  <div>\n                    <span className=\"text-[11px] font-semibold text-slate-500 uppercase tracking-wider block mb-1.5\">\n                      Cột dữ liệu tự động nhận diện ({diagnostics.recognizedColumns.length} cột):\n                    </span>\n                    <div className=\"flex flex-wrap gap-1.5\">\n                      {diagnostics.recognizedColumns.map((col, idx) => (\n                        <span\n                          key={idx}\n                          className=\"inline-flex items-center gap-1 text-[11px] px-2 py-0.5 bg-white border border-slate-200 rounded-md text-slate-700 font-medium\"\n                        >\n                          <span className=\"font-bold text-blue-700\">{col.field}</span>\n                          <ArrowRight className=\"w-3 h-3 text-slate-400\" />\n                          <span className=\"text-slate-500 italic\">\"{col.mappedHeader}\"</span>\n                        </span>\n                      ))}\n                    </div>\n                  </div>\n\n                  <div className=\"border border-slate-200 rounded-lg overflow-hidden bg-white max-h-40 overflow-x-auto overflow-y-auto custom-scroll\">\n                    <table className=\"w-full text-[11px] text-left\">\n                      <thead className=\"bg-slate-100 text-slate-600 font-semibold border-b border-slate-200 sticky top-0\">\n                        <tr>\n                          <th className=\"p-2 w-8 text-center text-slate-400\">#</th>\n                          {Object.keys(diagnostics.data[0] || {}).map((k) => (\n                            <th key={k} className=\"p-2 whitespace-nowrap\">\n                              {k}\n                            </th>\n                          ))}\n                        </tr>\n                      </thead>\n                      <tbody className=\"divide-y divide-slate-100 text-slate-700\">\n                        {diagnostics.data\n                          .slice(0, showFullPreview ? 15 : 3)\n                          .map((row, rIdx) => (\n                            <tr key={rIdx} className=\"hover:bg-slate-50\">\n                              <td className=\"p-2 text-center text-slate-400\">{rIdx + 1}</td>\n                              {Object.values(row).map((v: any, cIdx) => (\n                                <td key={cIdx} className=\"p-2 whitespace-nowrap font-mono\">\n                                  {typeof v === 'number' ? v.toLocaleString('vi-VN') : String(v)}\n                                </td>\n                              ))}\n                            </tr>\n                          ))}\n                      </tbody>\n                    </table>\n                  </div>\n                </div>\n              )}\n            </div>\n          ) : (\n            /* TAB 2: FILE DROP ZONE */\n            <div className=\"space-y-4\">\n              <div\n                onDrop={handleDrop}\n                onDragOver={(e) => e.preventDefault()}\n                onClick={() => !isProcessing && fileInputRef.current?.click()}\n                className={`border-2 border-dashed rounded-2xl p-7 text-center transition cursor-pointer group ${\n                  isProcessing\n                    ? 'border-blue-400 bg-blue-50/50 cursor-wait'\n                    : report?.errorList && report.errorList.length > 0\n                    ? 'border-amber-400 bg-amber-50/30 hover:bg-amber-50/60'\n                    : 'border-indigo-300 hover:border-indigo-500 bg-indigo-50/20 hover:bg-indigo-50/50'\n                }`}\n              >\n                <input\n                  type=\"file\"\n                  ref={fileInputRef}\n                  onChange={(e) => {\n                    if (e.target.files && e.target.files.length > 0) {\n                      processFiles(e.target.files);\n                    }\n                  }}\n                  multiple\n                  accept=\".xlsx,.xls,.csv\"\n                  className=\"hidden\"\n                  disabled={isProcessing}\n                />\n                <div className=\"w-12 h-12 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto mb-2.5 group-hover:scale-110 transition-transform\">\n                  {isProcessing ? (\n                    <Loader2 className=\"w-6 h-6 animate-spin text-blue-600\" />\n                  ) : (\n                    <UploadCloud className=\"w-6 h-6\" />\n                  )}\n                </div>\n                <p className=\"text-xs font-bold text-slate-800\">\n                  {isProcessing ? uploadStatus : 'Kéo thả hoặc bấm để chọn files Excel (.xlsx, .xls, .csv)'}\n                </p>\n                <p className=\"text-[11px] text-slate-500 mt-1\">\n                  Có thể chọn cùng lúc nhiều files – hệ thống sẽ kiểm tra từng file và cảnh báo nếu có lỗi\n                </p>\n              </div>\n\n              {/* WARNING REPORT BOX IF FILES FAILED */}\n              {report?.errorList && report.errorList.length > 0 && (\n                <div className=\"bg-rose-50 border border-rose-200 rounded-2xl p-4 space-y-3\">\n                  <div className=\"flex items-center gap-2 text-rose-800 font-extrabold text-xs\">\n                    <AlertTriangle className=\"w-4 h-4 text-rose-600 flex-shrink-0\" />\n                    <span>CẢNH BÁO: CÓ {report.errorList.length} FILE BỊ SAI ĐỊNH DẠNG</span>\n                  </div>\n                  <div className=\"space-y-2 max-h-36 overflow-y-auto pr-1 custom-scroll\">\n                    {report.errorList.map((err, idx) => (\n                      <div key={idx} className=\"bg-white rounded-xl p-2.5 border border-rose-200 text-xs shadow-2xs space-y-1\">\n                        <div className=\"flex items-center justify-between\">\n                          <span className=\"font-bold text-slate-900 truncate max-w-[280px]\">\n                            📄 {err.filename}\n                          </span>\n                          <span className=\"px-2 py-0.5 bg-rose-100 text-rose-800 font-black text-[10px] rounded-md\">\n                            Sai cấu trúc\n                          </span>\n                        </div>\n                        <p className=\"text-rose-700 font-semibold text-[11px] flex items-start gap-1\">\n                          <AlertCircle className=\"w-3.5 h-3.5 text-rose-500 mt-0.5 flex-shrink-0\" />\n                          <span>{err.error}</span>\n                        </p>\n                        {err.advice && (\n                          <p className=\"text-slate-500 text-[10.5px] pl-4 italic\">\n                            💡 {err.advice}\n                          </p>\n                        )}\n                      </div>\n                    ))}\n                  </div>\n                </div>\n              )}\n\n              {/* SUCCESS LIST */}\n              {report?.successList && report.successList.length > 0 && (\n                <div className=\"bg-emerald-50 border border-emerald-200 rounded-2xl p-3.5 space-y-2\">\n                  <div className=\"text-emerald-900 font-extrabold text-xs flex items-center gap-1.5\">\n                    <Check className=\"w-4 h-4 text-emerald-600\" />\n                    <span>Đã nạp thành công {report.successList.length} file:</span>\n                  </div>\n                  <div className=\"space-y-1 max-h-32 overflow-y-auto pr-1 custom-scroll\">\n                    {report.successList.map((suc, idx) => (\n                      <div key={idx} className=\"flex items-center justify-between bg-white rounded-lg p-2 border border-emerald-200 text-[11px]\">\n                        <span className=\"font-bold text-slate-800 truncate max-w-[240px]\">\n                          ✓ {suc.filename}\n                        </span>\n                        <div className=\"flex items-center gap-2\">\n                          <span className=\"text-emerald-700 font-semibold bg-emerald-100/70 px-2 py-0.5 rounded text-[10px]\">\n                            {suc.categoryName}\n                          </span>\n                          <span className=\"text-slate-400 font-mono text-[10px]\">({suc.rows} dòng)</span>\n                        </div>\n                      </div>\n                    ))}\n                  </div>\n                </div>\n              )}\n            </div>\n          )}\n        </div>\n\n        {/* Footer Actions */}\n        <div className=\"flex items-center justify-between pt-3 border-t border-slate-100 flex-shrink-0\">\n          <button\n            onClick={onClose}\n            type=\"button\"\n            className=\"px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition cursor-pointer\"\n          >\n            Đóng\n          </button>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/components/Sidebar.tsx":"import React from 'react';\nimport {\n  LayoutDashboard,\n  FileCheck2,\n  Trophy,\n  Layers,\n  Store,\n  Users2,\n  ArrowRightLeft,\n  TrendingUp,\n  Settings2,\n  X,\n  Trash2,\n  CalendarDays,\n} from 'lucide-react';\nimport { ViewType } from '../types';\n\ninterface SidebarProps {\n  currentView: ViewType;\n  onSelectView: (view: ViewType) => void;\n  isOpenMobile?: boolean;\n  onCloseMobile?: () => void;\n  onOpenClearSession?: () => void;\n}\n\nexport const Sidebar: React.FC<SidebarProps> = ({\n  currentView,\n  onSelectView,\n  isOpenMobile = false,\n  onCloseMobile,\n  onOpenClearSession,\n}) => {\n  const navItems = [\n    {\n      id: ViewType.DASHBOARD,\n      label: 'Dashboard Tổng Quan',\n      icon: LayoutDashboard,\n    },\n    {\n      id: ViewType.BAO_CAO_CUOI_NGAY,\n      label: 'Báo Cáo Cuối Ngày ⚡',\n      icon: FileCheck2,\n      badge: 'HOT',\n      highlight: true,\n    },\n    {\n      id: ViewType.THI_DUA_ST,\n      label: 'Thi Đua Siêu Thị 🏆',\n      icon: Trophy,\n    },\n    {\n      id: ViewType.SUC_KHOE_CUM,\n      label: 'Sức Khoẻ Cụm 933',\n      icon: Layers,\n    },\n    {\n      id: ViewType.DOANH_THU_ST,\n      label: 'Doanh Thu Siêu Thị',\n      icon: Store,\n    },\n    {\n      id: ViewType.SUC_KHOE_NV,\n      label: 'Xếp Hạng Nhân Viên',\n      icon: Users2,\n    },\n    {\n      id: ViewType.SO_SANH,\n      label: 'So Sánh Hiệu Suất',\n      icon: ArrowRightLeft,\n    },\n    {\n      id: ViewType.DU_BAO,\n      label: 'Dự Báo & Kế Hoạch',\n      icon: TrendingUp,\n    },\n    {\n      id: ViewType.THEO_DOI_NGAY,\n      label: 'Theo Dõi Từng Ngày',\n      icon: CalendarDays,\n    },\n    {\n      id: ViewType.KPI_CUSTOM,\n      label: 'Tùy Biến KPI Nhân Sự',\n      icon: Settings2,\n    },\n  ];\n\n  const content = (\n    <aside className=\"w-64 bg-white border-r border-slate-200 flex flex-col justify-between flex-shrink-0 z-30 shadow-sm select-none h-full\">\n      <div className=\"p-4 flex flex-col space-y-4\">\n        {/* Brand header */}\n        <div className=\"flex items-center justify-between px-2\">\n          <div className=\"flex items-center space-x-2.5\">\n            <div className=\"w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white font-black shadow-md shadow-blue-500/30\">\n              <Store className=\"w-4.5 h-4.5\" />\n            </div>\n            <div>\n              <h1 className=\"font-black text-slate-900 text-xs tracking-wider uppercase\">SỨC KHOẺ SIÊU THỊ</h1>\n              <p className=\"text-[10px] text-slate-400 font-semibold\">Cụm 933 - NHT</p>\n            </div>\n          </div>\n          {onCloseMobile && (\n            <button\n              onClick={onCloseMobile}\n              className=\"md:hidden p-1 text-slate-400 hover:text-slate-700\"\n            >\n              <X className=\"w-5 h-5\" />\n            </button>\n          )}\n        </div>\n\n        {/* Navigation list */}\n        <nav className=\"space-y-1 pt-1\">\n          {navItems.map((item) => {\n            const Icon = item.icon;\n            const isActive = currentView === item.id;\n            return (\n              <button\n                key={item.id}\n                onClick={() => onSelectView(item.id)}\n                className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-bold transition cursor-pointer ${\n                  isActive\n                    ? 'bg-blue-600 text-white shadow-sm font-black'\n                    : item.highlight\n                    ? 'text-emerald-800 bg-emerald-50 hover:bg-emerald-100/70 border border-emerald-200/60'\n                    : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'\n                }`}\n              >\n                <div className=\"flex items-center space-x-2.5 truncate\">\n                  <Icon\n                    className={`w-4 h-4 flex-shrink-0 ${\n                      isActive ? 'text-white' : item.highlight ? 'text-emerald-600' : 'text-slate-400'\n                    }`}\n                  />\n                  <span className=\"truncate\">{item.label}</span>\n                </div>\n                {item.badge && !isActive && (\n                  <span className=\"text-[9px] font-black px-1.5 py-0.5 rounded bg-amber-400 text-amber-950\">\n                    {item.badge}\n                  </span>\n                )}\n              </button>\n            );\n          })}\n        </nav>\n      </div>\n\n      {/* Footer Store Info */}\n      <div className=\"p-3.5 border-t border-slate-100 bg-slate-50/60 text-[11px] text-slate-500 space-y-2\">\n        <div className=\"space-y-1\">\n          <div className=\"flex justify-between font-bold text-slate-700\">\n            <span>Shop 933:</span>\n            <span>TGDĐ</span>\n          </div>\n          <div className=\"flex justify-between font-bold text-slate-700\">\n            <span>Shop 10341:</span>\n            <span>TopZone</span>\n          </div>\n        </div>\n\n        {onOpenClearSession && (\n          <button\n            type=\"button\"\n            onClick={onOpenClearSession}\n            className=\"w-full py-1.5 px-2 rounded-lg border border-rose-200 bg-rose-50/80 hover:bg-rose-100 text-rose-700 font-bold text-[11px] flex items-center justify-center gap-1.5 transition cursor-pointer\"\n            title=\"Xóa toàn bộ data đang lưu trong phiên\"\n          >\n            <Trash2 className=\"w-3.5 h-3.5 text-rose-600\" />\n            <span>Xóa data phiên</span>\n          </button>\n        )}\n\n        <div className=\"text-[10px] text-slate-400 pt-1 border-t border-slate-200/60 flex justify-between items-center\">\n          <span>Hệ điều hành v3.2</span>\n          <span className=\"text-emerald-600 font-semibold\">Online</span>\n        </div>\n      </div>\n    </aside>\n  );\n\n  return (\n    <>\n      {/* Desktop view */}\n      <div className=\"hidden md:block h-full\">\n        {content}\n      </div>\n\n      {/* Mobile drawer backdrop */}\n      {isOpenMobile && (\n        <div className=\"fixed inset-0 z-50 md:hidden flex\">\n          <div\n            className=\"fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity\"\n            onClick={onCloseMobile}\n          ></div>\n          <div className=\"relative z-10 w-64 h-full bg-white shadow-2xl animate-in slide-in-from-left\">\n            {content}\n          </div>\n        </div>\n      )}\n    </>\n  );\n};\n","src/index.css":"@import \"tailwindcss\";\n\n:root {\n  --app-font: 'Be Vietnam Pro', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;\n  --kpi-align: center;\n  --kpi-size: 3.2rem;\n  --content-size: 14px;\n  --export-width: 1900px;\n  --grid-color: #e2e8f0;\n}\n\nbody {\n  font-family: var(--app-font);\n  font-feature-settings: \"cv02\", \"cv03\", \"cv04\", \"cv11\";\n  font-variant-numeric: tabular-nums;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n/* Tabular figures for numbers across tables and cards */\ntable, td, th, .tabular-nums, .font-mono {\n  font-variant-numeric: tabular-nums;\n}\n\n/* Custom Scrollbar */\n.custom-scroll::-webkit-scrollbar {\n  width: 6px;\n  height: 6px;\n}\n.custom-scroll::-webkit-scrollbar-track {\n  background: #f1f5f9;\n}\n.custom-scroll::-webkit-scrollbar-thumb {\n  background: #cbd5e1;\n  border-radius: 9999px;\n}\n.custom-scroll::-webkit-scrollbar-thumb:hover {\n  background: #94a3b8;\n}\n\n.nav-item-active {\n  background-color: #1d4ed8 !important;\n  color: #ffffff !important;\n  font-weight: 700 !important;\n  box-shadow: 0 4px 12px -2px rgba(29, 78, 216, 0.3);\n}\n.nav-item-active svg {\n  color: #ffffff !important;\n}\n\n/* Table grid borders */\n.table-grid-caro td, .table-grid-caro th {\n  border: 1px solid var(--grid-color) !important;\n}\n.table-grid-horizontal td, .table-grid-horizontal th {\n  border-bottom: 1px solid var(--grid-color) !important;\n  border-top: 1px solid var(--grid-color) !important;\n  border-left: none !important;\n  border-right: none !important;\n}\n.table-grid-none td, .table-grid-none th {\n  border: none !important;\n}\n\n/* Interactive table headers */\ntable thead th {\n  user-select: none;\n  transition: background-color 0.15s ease;\n}\ntable thead th:hover {\n  background-color: rgba(37, 99, 235, 0.08);\n}\n\n/* Image Export Clean Rules */\n.export-only {\n  display: none;\n}\n\n.is-exporting .no-export {\n  display: none !important;\n}\n\n.is-exporting .export-only {\n  display: inline-flex !important;\n}\n\n.is-exporting .card-programs-container,\n.is-exporting [data-export-expand=\"true\"] {\n  max-height: none !important;\n  height: auto !important;\n  overflow: visible !important;\n  overflow-y: visible !important;\n  overflow-x: visible !important;\n}\n\n/* Suppress all scrollbars during export */\n.is-exporting *::-webkit-scrollbar {\n  display: none !important;\n  width: 0 !important;\n  height: 0 !important;\n}\n.is-exporting * {\n  scrollbar-width: none !important;\n  -ms-overflow-style: none !important;\n}\n\n/* Ensure crystal-clear text during export */\n.is-exporting {\n  -webkit-font-smoothing: subpixel-antialiased !important;\n  text-rendering: geometricPrecision !important;\n}\n\n","src/main.tsx":"import {StrictMode} from 'react';\nimport {createRoot} from 'react-dom/client';\nimport App from './App.tsx';\nimport './index.css';\n\ncreateRoot(document.getElementById('root')!).render(\n  <StrictMode>\n    <App />\n  </StrictMode>,\n);\n","src/types.ts":"export interface StoreRevenueRow {\n  'MÃ ĐƠN VỊ'?: string | number;\n  'TÊN ĐƠN VỊ'?: string;\n  'TARGET (TR)'?: number | string;\n  'TARGET QĐ (TR)'?: number | string;\n  'DOANH THU (TR)'?: number | string;\n  'DOANH THU QĐ (TR)'?: number | string;\n  'DT TRẢ GÓP (TR)'?: number | string;\n  '% TRẢ GÓP'?: number | string;\n  'LƯỢT BILL (TẤT CẢ ST)'?: number | string;\n  'SỐ LƯỢNG'?: number | string;\n  'TB 3 THÁNG (TR)'?: number | string;\n  'SỐ NGÀY CỬA SỔ'?: number | string;\n  [key: string]: any;\n}\n\nexport interface CompetitionRow {\n  'MÃ CHƯƠNG TRÌNH'?: string | number;\n  'CHƯƠNG TRÌNH'?: string;\n  'ĐƠN VỊ / NHÂN VIÊN'?: string;\n  'LOẠI TĐ'?: number | string;\n  'TARGET (TR/SL theo LOẠI TĐ)'?: number | string;\n  'DOANH THU (TR)'?: number | string;\n  'DT QUY ĐỔI (TR)'?: number | string;\n  'SỐ LƯỢNG'?: number | string;\n  '% HT THÁNG'?: number | string;\n  '% DỰ BÁO'?: number | string;\n  'MÃ NV'?: string | number;\n  'HẠNG VÙNG'?: string | number;\n  [key: string]: any;\n}\n\nexport interface EmployeeRevenueRow {\n  'MÃ NHÂN VIÊN'?: string | number;\n  'TÊN NHÂN VIÊN'?: string;\n  'SIÊU THỊ'?: string;\n  'DOANH THU (TR)'?: number | string;\n  'DOANH THU QĐ (TR)'?: number | string;\n  'DT TRẢ GÓP (TR)'?: number | string;\n  '% TRẢ GÓP'?: number | string;\n  'SỐ LƯỢNG'?: number | string;\n  'SỐ NGÀY CỬA SỔ'?: number | string;\n  [key: string]: any;\n}\n\nexport interface AppDataState {\n  dt_luyke: StoreRevenueRow[];\n  dt_realtime: StoreRevenueRow[];\n  td_luyke: CompetitionRow[];\n  td_realtime: CompetitionRow[];\n  nv_tgdd: CompetitionRow[];\n  nv_tz: CompetitionRow[];\n  dt_nv_luyke: EmployeeRevenueRow[];\n  dt_nv_realtime: EmployeeRevenueRow[];\n}\n\nexport interface EmployeeProgramDetail {\n  code: string | number;\n  name: string;\n  displayName: string;\n  thuc: number;\n  dtQd: number;\n  target: number;\n  pctLk: number;\n  pctDu: number;\n  loai: number;\n  hangVung: string;\n}\n\nexport interface AggregatedEmployee {\n  name: string;\n  id: string;\n  store: 'TGDĐ' | 'TopZone';\n  department: string;\n  isOfficial: boolean;\n  isVisible: boolean;\n  targetSharePct: number;\n  totalDt: number;\n  totalDtQd: number;\n  totalTragop: number;\n  totalBill: number;\n  pctTragop: number;\n  pctDukien: number;\n  completedCount: number;\n  pctDongGop: number;\n  dtDiem: number;\n  hieuQuaQd: number;\n  hqDiem: number;\n  diemKpi: number;\n  programs: EmployeeProgramDetail[];\n}\n\nexport interface PersonnelConfigMap {\n  [storeKey: string]: {\n    [empName: string]: {\n      isOfficial?: boolean;\n      isVisible?: boolean;\n      targetPct?: number;\n    };\n  };\n}\n\nexport interface ScreenshotItem {\n  name: string;\n  url: string;\n  time: string;\n}\n\nexport enum ViewType {\n  DASHBOARD = 'dashboard',\n  BAO_CAO_CUOI_NGAY = 'bao-cao-cuoi-ngay',\n  THI_DUA_ST = 'thi-dua-st',\n  SUC_KHOE_CUM = 'suc-khoe-cum',\n  DOANH_THU_ST = 'doanh-thu-st',\n  SUC_KHOE_NV = 'suc-khoe-nv',\n  SO_SANH = 'so-sanh',\n  DU_BAO = 'du-bao',\n  KPI_CUSTOM = 'cai-dat',\n  THEO_DOI_NGAY = 'theo-doi-ngay',\n}\n","src/utils/excelParser.ts":"import * as XLSX from 'xlsx';\nimport { AppDataState } from '../types';\n\nexport const CATEGORY_TITLES: Record<keyof AppDataState, string> = {\n  dt_luyke: 'Doanh Thu Luỹ Kế Siêu Thị',\n  dt_realtime: 'Doanh Thu Realtime Siêu Thị',\n  td_luyke: 'Thi Đua Luỹ Kế Siêu Thị',\n  td_realtime: 'Thi Đua Realtime Siêu Thị',\n  nv_tgdd: 'Thi Đua Nhân Viên TGDĐ (24 Môn)',\n  nv_tz: 'Thi Đua Nhân Viên TopZone (12 Môn)',\n  dt_nv_luyke: 'Doanh Thu Nhân Viên Luỹ Kế',\n  dt_nv_realtime: 'Doanh Thu Nhân Viên Realtime',\n};\n\nexport function detectFileCategoryFromData(filename: string, rows: any[]): keyof AppDataState | null {\n  const fn = filename.toLowerCase();\n  const firstRow = rows[0] || {};\n  const secondRow = rows[1] || {};\n  \n  // Combine columns from first two rows in case headers are merged or shifted\n  const allColKeys = [...Object.keys(firstRow), ...Object.keys(secondRow)];\n  const cols = Array.from(new Set(allColKeys.map(c => c.trim().toUpperCase())));\n\n  // Check DT Nhân Viên (MÃ NHÂN VIÊN, TÊN NHÂN VIÊN, DT OFFLINE...)\n  if (\n    (cols.includes('TÊN NHÂN VIÊN') || cols.includes('MÃ NHÂN VIÊN')) &&\n    (cols.includes('DT OFFLINE (TR)') || cols.includes('DOANH THU QĐ (TR)') || cols.includes('DT TRẢ GÓP (TR)') || cols.includes('DOANH THU (TR)') || fn.includes('dt nhân viên') || fn.includes('dt nv'))\n  ) {\n    if (fn.includes('realtime') || fn.includes('rt') || firstRow['SỐ NGÀY CỬA SỔ'] === 1) {\n      return 'dt_nv_realtime';\n    }\n    return 'dt_nv_luyke';\n  }\n\n  // Check Store Doanh Thu\n  if (cols.includes('TB 3 THÁNG (TR)') || cols.includes('TB 3 THÁNG') || cols.includes('SỐ NGÀY CỬA SỔ')) {\n    const dayWindow = firstRow['SỐ NGÀY CỬA SỔ'];\n    if (dayWindow === 1 || fn.includes('realtime') || fn.includes('rt')) return 'dt_realtime';\n    return 'dt_luyke';\n  }\n\n  // Check Employee Thi Đua (MÃ NV, CHƯƠNG TRÌNH, ĐƠN VỊ / NHÂN VIÊN)\n  if (cols.includes('MÃ NV') && (cols.includes('ĐƠN VỊ / NHÂN VIÊN') || cols.includes('CHƯƠNG TRÌNH'))) {\n    const namesStr = rows.slice(0, 30).map(r => String(r['ĐƠN VỊ / NHÂN VIÊN'] || '') + ' ' + String(r['MÃ NV'] || '')).join(' ');\n    if (\n      namesStr.includes('Lê Thị Mỹ Linh') ||\n      namesStr.includes('170266') ||\n      namesStr.includes('Trần Thị Mỹ Trang') ||\n      namesStr.includes('Tạ Đức Hiếu') ||\n      fn.includes('tz') ||\n      fn.includes('topzone') ||\n      fn.includes('12')\n    ) {\n      return 'nv_tz';\n    }\n    return 'nv_tgdd';\n  }\n\n  // Check Store Thi Đua\n  if (cols.includes('MÃ CHƯƠNG TRÌNH') && (cols.includes('CHƯƠNG TRÌNH') || cols.includes('TARGET (TR/SL theo LOẠI TĐ)'))) {\n    const hasForecast = rows.some(r => parseFloat(r['% DỰ BÁO'] || 0) > 0);\n    if (fn.includes('realtime') || fn.includes('rt') || !hasForecast) return 'td_realtime';\n    return 'td_luyke';\n  }\n\n  // Filename fallback checks\n  if (fn.includes('dtluyke') || fn.includes('dt_luyke')) return 'dt_luyke';\n  if (fn.includes('dtrealtime') || fn.includes('dt_realtime')) return 'dt_realtime';\n  if (fn.includes('nv_tz') || fn.includes('12mon')) return 'nv_tz';\n  if (fn.includes('nv_tgdd') || fn.includes('24mon')) return 'nv_tgdd';\n  if (fn.includes('thi') && fn.includes('luy')) return 'td_luyke';\n  if (fn.includes('thi') && fn.includes('real')) return 'td_realtime';\n\n  return null;\n}\n\nexport interface ParseResult {\n  success: boolean;\n  category: keyof AppDataState | null;\n  categoryName?: string;\n  data: any[];\n  filename: string;\n  rowCount: number;\n  error?: string;\n  advice?: string;\n  foundColumns?: string[];\n}\n\nexport function parseExcelFile(file: File): Promise<ParseResult> {\n  return new Promise((resolve) => {\n    // 1. Check file extension\n    const name = file.name || '';\n    const lowerName = name.toLowerCase();\n    const isSupportedExt = lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls') || lowerName.endsWith('.csv');\n\n    if (!isSupportedExt) {\n      resolve({\n        success: false,\n        category: null,\n        data: [],\n        filename: name,\n        rowCount: 0,\n        error: 'Định dạng file không được hỗ trợ',\n        advice: 'Vui lòng chỉ chọn hoặc kéo thả file Excel định dạng .xlsx, .xls hoặc .csv'\n      });\n      return;\n    }\n\n    const reader = new FileReader();\n    reader.onload = (e) => {\n      try {\n        const buffer = e.target?.result as ArrayBuffer;\n        const workbook = XLSX.read(buffer, { type: 'array' });\n        \n        if (!workbook.SheetNames || workbook.SheetNames.length === 0) {\n          resolve({\n            success: false,\n            category: null,\n            data: [],\n            filename: name,\n            rowCount: 0,\n            error: 'File Excel không có trang tính nào (Sheet rỗng)',\n            advice: 'Vui lòng kiểm tra lại nội dung file xem có bảng tính dữ liệu không.'\n          });\n          return;\n        }\n\n        const firstSheetName = workbook.SheetNames[0];\n        const worksheet = workbook.Sheets[firstSheetName];\n        const json = XLSX.utils.sheet_to_json(worksheet);\n\n        if (!json || json.length === 0) {\n          resolve({\n            success: false,\n            category: null,\n            data: [],\n            filename: name,\n            rowCount: 0,\n            error: 'File không có dòng dữ liệu nào',\n            advice: 'Trang tính đầu tiên rỗng hoặc chưa nhập số liệu.'\n          });\n          return;\n        }\n\n        const foundCols = Object.keys(json[0] || {});\n        const category = detectFileCategoryFromData(name, json);\n\n        if (!category) {\n          const colPreview = foundCols.slice(0, 5).join(', ');\n          resolve({\n            success: false,\n            category: null,\n            data: json,\n            filename: name,\n            rowCount: json.length,\n            foundColumns: foundCols,\n            error: 'Cột dữ liệu không khớp với 6 mẫu hệ thống',\n            advice: `Các cột nhận diện được: [${colPreview}${foundCols.length > 5 ? ', ...' : ''}]. Cần các cột đặc trưng như: \"MÃ ĐƠN VỊ\", \"TÊN ĐƠN VỊ\", \"TÊN NHÂN VIÊN\" hoặc \"MÃ CHƯƠNG TRÌNH\".`\n          });\n          return;\n        }\n\n        resolve({\n          success: true,\n          category,\n          categoryName: CATEGORY_TITLES[category],\n          data: json,\n          filename: name,\n          rowCount: json.length,\n          foundColumns: foundCols\n        });\n      } catch (err: any) {\n        resolve({\n          success: false,\n          category: null,\n          data: [],\n          filename: name,\n          rowCount: 0,\n          error: 'Lỗi đọc file Excel',\n          advice: err?.message || 'File có thể bị khóa mật khẩu hoặc cấu trúc tệp bị hỏng.'\n        });\n      }\n    };\n\n    reader.onerror = () => {\n      resolve({\n        success: false,\n        category: null,\n        data: [],\n        filename: name,\n        rowCount: 0,\n        error: 'Trình duyệt không thể đọc tệp này',\n        advice: 'Vui lòng đóng file nếu đang mở trong Excel và chọn lại.'\n      });\n    };\n\n    reader.readAsArrayBuffer(file);\n  });\n}\n\n","src/utils/formatters.ts":"export const SHORT_PROG_DICT: Record<string, string> = {\n  'TRẢ CHẬM FECREDIT, SHINHAN, SAMSUNG FINANCE+': 'Trả chậm FE/Shinhan/SS',\n  'SIM MOBIFONE/VINAPHONE/SIM DMX': 'Sim Mobi/Vina',\n  'MỞ THẺ TÍN DỤNG TPBANK EVO VÀ VPBANK MWG': 'Mở thẻ TPBank/VPBank',\n  'ĐIỆN THOẠI & TABLET ANDROID': 'ĐT & Tab Android',\n  'Điện thoại Flagship Samsung Galaxy S/Z Series': 'Flagship Samsung',\n  'Phụ kiện IT và nhóm khác': 'Phụ kiện IT',\n  'NẠP RÚT TIỀN TÀI KHOẢN NGÂN HÀNG': 'Nạp rút ngân hàng',\n  'Bảo hiểm Thợ ĐMX': 'BH Thợ ĐMX',\n  'Bảo hiểm tổng': 'BH Tổng',\n  'Laptop (trừ Apple)': 'Laptop',\n  'OTT MANGO+, ICALLME -': 'OTT Mango/iCall',\n  'Đồng hồ tháng 9': 'Đồng hồ T9',\n  'PHỤ KIỆN CÔNG NGHỆ': 'Phụ kiện CN',\n  'Điện thoại realme': 'ĐT Realme',\n  'Điện thoại Vivo': 'ĐT Vivo',\n  'Thu cũ đổi mới (Trade-in)': 'Thu cũ đổi mới',\n  'Phụ kiện chính hãng Apple': 'PK Apple',\n  'Gói AppleCare / BHMR': 'AppleCare/BHMR',\n  'Dịch vụ bảo hành & Kỹ thuật': 'Bảo hành kỹ thuật',\n};\n\nexport const SHORT_STORE_DICT: Record<string, string> = {\n  '10341 - AAR_DNA_HCH - 351 Nguyễn Hữu Thọ': 'AAR Nguyễn Hữu Thọ',\n  '933 - TGD_DNA_HCH - 351 Nguyễn Hữu Thọ': 'TGDĐ Nguyễn Hữu Thọ',\n  'AAR_DNA_HCH - 351 Nguyễn Hữu Thọ': 'TopZone 351 NHT',\n  'TGD_DNA_HCH - 351 Nguyễn Hữu Thọ': 'TGDĐ 351 NHT',\n};\n\nexport function formatProgramName(name: string, isShorten = true): string {\n  if (!name) return '';\n  if (!isShorten) return name;\n  return SHORT_PROG_DICT[name] || name;\n}\n\nexport function formatStoreName(name: string, isShorten = true): string {\n  if (!name) return '';\n  if (!isShorten) return name;\n  return SHORT_STORE_DICT[name] || name;\n}\n\nexport function formatCurrency(val: number | string | undefined | null, digits = 2): string {\n  if (val === undefined || val === null || val === '') return '0,00';\n  const num = typeof val === 'number' ? val : parseFloat(String(val).replace(/,/g, '.').replace(/[^\\d.-]/g, ''));\n  if (isNaN(num)) return '0,00';\n  return num.toLocaleString('vi-VN', {\n    minimumFractionDigits: digits,\n    maximumFractionDigits: digits,\n  });\n}\n\nexport function formatInt(val: number | string | undefined | null): string {\n  if (val === undefined || val === null || val === '') return '0';\n  const num = typeof val === 'number' ? val : parseFloat(String(val).replace(/,/g, '.').replace(/[^\\d.-]/g, ''));\n  if (isNaN(num)) return '0';\n  return Math.round(num).toLocaleString('vi-VN');\n}\n\nexport function formatPercent(val: number | string | undefined | null, digits = 1): string {\n  if (val === undefined || val === null || val === '') return '0,0%';\n  const num = typeof val === 'number' ? val : parseFloat(String(val).replace(/,/g, '.').replace(/[^\\d.-]/g, ''));\n  if (isNaN(num)) return '0,0%';\n  return num.toLocaleString('vi-VN', {\n    minimumFractionDigits: digits,\n    maximumFractionDigits: digits,\n  }) + '%';\n}\n\nexport function cleanCode(c: string | number | undefined | null): string {\n  if (c === undefined || c === null) return '';\n  return String(c).trim();\n}\n\nexport function cleanProgName(s: string | undefined | null): string {\n  if (!s) return '';\n  return String(s).trim().toLowerCase().replace(/\\s+/g, ' ');\n}\n\nexport function getCellNumber(row: any, possibleKeys: string[]): number {\n  if (!row) return 0;\n  for (const k of possibleKeys) {\n    if (row[k] !== undefined && row[k] !== null && row[k] !== '') {\n      const val = parseFloat(String(row[k]).replace(/,/g, '.').replace(/[^\\d.-]/g, ''));\n      if (!isNaN(val)) return val;\n    }\n  }\n  const rowKeys = Object.keys(row);\n  for (const pk of possibleKeys) {\n    const matchedKey = rowKeys.find(rk => rk.trim().toLowerCase() === pk.trim().toLowerCase());\n    if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== null) {\n      const val = parseFloat(String(row[matchedKey]).replace(/,/g, '.').replace(/[^\\d.-]/g, ''));\n      if (!isNaN(val)) return val;\n    }\n  }\n  return 0;\n}\n","src/utils/imageExporter.ts":"import { toPng, toBlob } from 'html-to-image';\nimport html2canvasPro from 'html2canvas-pro';\n\nexport interface ExportImageResult {\n  dataUrl: string;\n  blob: Blob;\n  fileName: string;\n}\n\n/**\n * Converts a base64 DataURL string to a standard Blob\n */\nexport function dataUrlToBlob(dataUrl: string): Blob {\n  const parts = dataUrl.split(';base64,');\n  const contentType = parts[0].split(':')[1] || 'image/png';\n  const raw = window.atob(parts[1]);\n  const rawLength = raw.length;\n  const uInt8Array = new Uint8Array(rawLength);\n\n  for (let i = 0; i < rawLength; ++i) {\n    uInt8Array[i] = raw.charCodeAt(i);\n  }\n\n  return new Blob([uInt8Array], { type: contentType });\n}\n\n/**\n * Robustly captures an HTML element to high-resolution PNG image.\n * Uses html2canvas-pro first for authentic canvas font rendering (eliminating Chrome SVG foreignObject text overlap bug),\n * ensures all fonts are loaded, temporarily activates export mode (expands scroll areas and hides toolbars),\n * and gracefully falls back to html-to-image if needed.\n */\nexport async function captureElement(\n  element: HTMLElement,\n  options?: {\n    fileName?: string;\n    backgroundColor?: string;\n    scale?: number;\n  }\n): Promise<ExportImageResult> {\n  const fileName = options?.fileName || `BaoCao_${new Date().toISOString().slice(0, 10)}.png`;\n  const bg = options?.backgroundColor || '#f8fafc';\n  const scale = options?.scale || 2;\n\n  // 1. Ensure fonts are 100% loaded before rasterizing\n  try {\n    if (document.fonts) {\n      await document.fonts.ready;\n    }\n  } catch (e) {\n    // Continue even if font ready check fails\n  }\n\n  // 2. Mark element with export mode to unroll scrolls and hide toolbars\n  element.classList.add('is-exporting');\n  document.body.classList.add('is-exporting');\n\n  // Allow DOM to settle and apply clean layout\n  await new Promise((resolve) => setTimeout(resolve, 80));\n\n  try {\n    // Attempt 1: html2canvas-pro (native canvas drawing, zero text overlap)\n    try {\n      const canvas = await html2canvasPro(element, {\n        scale,\n        useCORS: true,\n        allowTaint: true,\n        backgroundColor: bg,\n        logging: false,\n        ignoreElements: (domNode) => {\n          return domNode.classList?.contains('no-export') || false;\n        },\n        onclone: (clonedDoc, clonedElement) => {\n          clonedElement.classList.add('is-exporting');\n          // Fully expand any remaining scroll containers\n          const scrollContainers = clonedElement.querySelectorAll(\n            '.card-programs-container, [data-export-expand=\"true\"]'\n          );\n          scrollContainers.forEach((c: any) => {\n            c.scrollTop = 0;\n            c.scrollLeft = 0;\n            c.style.maxHeight = 'none';\n            c.style.height = 'auto';\n            c.style.overflow = 'visible';\n            c.style.overflowY = 'visible';\n            c.style.overflowX = 'visible';\n          });\n          // Remove scrollbars from cloned DOM\n          const allNodes = clonedElement.querySelectorAll('*');\n          allNodes.forEach((node: any) => {\n            if (node.style) {\n              node.style.scrollbarWidth = 'none';\n            }\n          });\n        },\n      });\n\n      const dataUrl = canvas.toDataURL('image/png');\n      if (dataUrl && dataUrl.length > 200) {\n        const blob = dataUrlToBlob(dataUrl);\n        return { dataUrl, blob, fileName };\n      }\n    } catch (h2cError) {\n      console.warn('html2canvas-pro capture failed, attempting html-to-image fallback...', h2cError);\n    }\n\n    // Attempt 2: Fallback to html-to-image\n    try {\n      const dataUrl = await toPng(element, {\n        backgroundColor: bg,\n        pixelRatio: scale,\n        cacheBust: true,\n        quality: 0.98,\n        style: {\n          transform: 'none',\n          margin: '0',\n        },\n        filter: (domNode) => {\n          if (domNode instanceof HTMLElement) {\n            if (domNode.classList.contains('no-export')) return false;\n          }\n          return true;\n        },\n      });\n\n      if (dataUrl && dataUrl.length > 200) {\n        const blob = dataUrlToBlob(dataUrl);\n        return { dataUrl, blob, fileName };\n      }\n    } catch (toPngErr) {\n      console.error('html-to-image fallback also failed:', toPngErr);\n    }\n\n    throw new Error('Không thể tạo ảnh từ giao diện. Vui lòng thử lại!');\n  } finally {\n    // Always clean up export mode classes\n    element.classList.remove('is-exporting');\n    document.body.classList.remove('is-exporting');\n  }\n}\n\n/**\n * Triggers a client-side file download for the image\n */\nexport function downloadImage(blob: Blob | string, fileName: string): boolean {\n  try {\n    let url: string;\n    let shouldRevoke = false;\n\n    if (typeof blob === 'string') {\n      if (blob.startsWith('data:')) {\n        const b = dataUrlToBlob(blob);\n        url = URL.createObjectURL(b);\n        shouldRevoke = true;\n      } else {\n        url = blob;\n      }\n    } else {\n      url = URL.createObjectURL(blob);\n      shouldRevoke = true;\n    }\n\n    const anchor = document.createElement('a');\n    anchor.href = url;\n    anchor.download = fileName;\n    anchor.style.display = 'none';\n    document.body.appendChild(anchor);\n\n    // Trigger click\n    anchor.click();\n\n    setTimeout(() => {\n      document.body.removeChild(anchor);\n      if (shouldRevoke) URL.revokeObjectURL(url);\n    }, 1000);\n\n    return true;\n  } catch (e) {\n    console.error('Direct download error:', e);\n    return false;\n  }\n}\n\n/**\n * Copies the image directly to the user's OS clipboard\n * (Allows pasting directly into Zalo, Viber, Telegram, PowerPoint, etc.)\n */\nexport async function copyImageToClipboard(blob: Blob): Promise<boolean> {\n  if (!navigator.clipboard || !window.ClipboardItem) {\n    return false;\n  }\n\n  try {\n    // Ensure image/png type\n    const pngBlob = blob.type === 'image/png' ? blob : new Blob([blob], { type: 'image/png' });\n    await navigator.clipboard.write([\n      new ClipboardItem({\n        'image/png': pngBlob,\n      }),\n    ]);\n    return true;\n  } catch (err) {\n    console.warn('Clipboard write failed:', err);\n    return false;\n  }\n}\n","src/utils/smartDataParser.ts":"import { AppDataState, StoreRevenueRow, CompetitionRow, EmployeeRevenueRow } from '../types';\n\nexport const CATEGORY_LABELS: Record<keyof AppDataState, string> = {\n  dt_luyke: 'Doanh Thu Luỹ Kế Siêu Thị',\n  dt_realtime: 'Doanh Thu Realtime Siêu Thị',\n  td_luyke: 'Thi đua Lũy kế 2 shop',\n  td_realtime: 'Thi đua Realtime 2 shop',\n  nv_tgdd: 'Lũy kế thi đua nhân viên TGDĐ',\n  nv_tz: 'Lũy kế thi đua nhân viên TopZone',\n  dt_nv_luyke: 'Doanh Thu Nhân Viên Luỹ Kế',\n  dt_nv_realtime: 'Doanh Thu Nhân Viên Realtime',\n};\n\nexport const CATEGORY_DESCRIPTIONS: Record<keyof AppDataState, string> = {\n  dt_luyke: 'Báo cáo doanh thu luỹ kế thực tế và quy đổi của 2 siêu thị',\n  dt_realtime: 'Báo cáo doanh thu phát sinh trong ngày theo thời gian thực',\n  td_luyke: 'Báo cáo tiến độ các chương trình thi đua luỹ kế của siêu thị',\n  td_realtime: 'Báo cáo thi đua phát sinh trong ngày của siêu thị',\n  nv_tgdd: 'Báo cáo chi tiết thi đua 24 chương trình của nhân sự TGDĐ',\n  nv_tz: 'Báo cáo chi tiết thi đua 12 chương trình của nhân sự TopZone',\n  dt_nv_luyke: 'Doanh thu, số lượng, quy đổi lũy kế từng nhân viên',\n  dt_nv_realtime: 'Doanh thu, số lượng, quy đổi hôm nay của từng nhân viên',\n};\n\n// Canonical shop names exactly as returned by the MWG BI copy-table.\nexport const MANAGED_SHOPS = {\n  TOPZONE: 'AAR_DNA_HCH - 351 Nguyễn Hữu Thọ',\n  TGDD: 'TGD_DNA_HCH - 351 N
