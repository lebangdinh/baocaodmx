< lines.length; i++) {\n    let line = lines[i];\n\n    const hasMetric = metric.test(line);\n    const nextMetric = (lines[i + 1] || '').search(metric) === 0 && !/\\t|\\|/.test(line) && !/^\\d+\\s*[-–]/.test(line);\n    if (hasMetric || nextMetric) {\n      let joined = line.replace(/[|\\t]/g, ' ');\n      let end = i;\n      while (!(signature.test(joined) && /TOP\\s*\\/\\s*BOTTOM\\s*(?:VÙNG|ST)/i.test(joined)) && end < Math.min(lines.length - 1, i + 10)) {\n        if (/^(?:\\d{4,7}\\s*[-–]|(?:AAR|TGD)_)/i.test(lines[end + 1])) break;\n        if (metric.test(joined) && metric.test(lines[end + 1])) break;\n        joined += ' ' + lines[++end].replace(/[|\\t]/g, ' ');\n      }\n      if (signature.test(joined)) {\n        output.push(joined.trim()); sawHeader = true; i = end; continue;\n      }\n    }\n    if (!sawHeader) continue;\n    if (/^[-:|\\s]+$/.test(line)) continue;\n\n    if (extractPersonRow(line) || extractStoreRow(line) || /^TỔNG(?:\\s|\\||$)/i.test(line)) {\n      const cells = line.includes('\\t') ? line.split('\\t') : line.includes('|') ? line.split('|') : [line];\n      let end = i;\n      while (end + 1 < lines.length && cells.length < 9) {\n        const next = lines[end + 1];\n        const values = next.split(/\\t|\\|/).map(x => x.trim());\n        if (!values.every(v => !v || /^(?:[+-]?[\\d.,]+%?(?:\\s*\\(CTY\\))?|[-—–]|TOP|BOTTOM)$/i.test(v))) break;\n        cells.push(...values); end++;\n      }\n      output.push(cells.map(x => x.trim()).join('\\t')); i = end;\n    }\n  }\n  return sawHeader ? output.join('\\n') : rawText;\n}\n\nfunction employeeCompetitionDestination(text: string, context?: MwgDetectionContext): 'nv_tz' | 'nv_tgdd' | null {\n  const lines = text.split(/\\r?\\n/).map(cleanClipboardLine);\n  const totals = new Map<string, number>();\n  let program = '';\n  let tz = 0, tg = 0;\n  for (const line of lines) {\n    const h = /hang trong st/.test(normalizeStr(line)) ? line.match(/^(.*?)(?:DOANH\\s*THU|SỐ\\s*LƯỢNG)/i) : null;\n    if (h) { program = normalizeStr(h[1]); continue; }\n    const person = extractPersonRow(line);\n    if (!person || !program) continue;\n    if (isTopzoneStaff(person.id) || isTopzoneStaff(person.name)) tz++;\n    if (isTgddStaff(person.id) || isTgddStaff(person.name)) tg++;\n    totals.set(program, (totals.get(program) || 0) + parseFlexibleNumber(person.cells[0]));\n  }\n\n  const scores: Record<string, number> = { '10341': 0, '933': 0 };\n  for (const row of context?.existingStoreCompetitionLuyKe || []) {\n    const code = String(row['MÃ ĐƠN VỊ']);\n    if (!(code in scores)) continue;\n    const actual = totals.get(normalizeStr(String(row['CHƯƠNG TRÌNH'] || '')));\n    const value = Number(row[Number(row['LOẠI TĐ']) === 2 || Number(row['LOẠI TĐ']) === 6 ? 'SỐ LƯỢNG' : 'DOANH THU (TR)']) || 0;\n    if (actual == null || actual <= 0 || value <= 0) continue;\n    if (Math.abs(actual - value) <= Math.max(.05, value * .02)) scores[code]++;\n  }\n  if (scores['10341'] >= 2 && scores['10341'] > scores['933'] + 1) return 'nv_tz';\n  if (scores['933'] >= 2 && scores['933'] > scores['10341'] + 1) return 'nv_tgdd';\n  if (tz > tg && tz >= 2) return 'nv_tz';\n  if (tg > tz && tg >= 2) return 'nv_tgdd';\n\n  return null;\n}\n\nfunction storeRevenueColumns(lines: string[]): { actual: number; converted: number } {\n  const cells = lines.flatMap(line => line.split(/\\t|\\|/)).map(cell => normalizeStr(cell));\n  for (let start = 0; start < cells.length; start++) {\n    if (!/^so luong(?: rt)?$/.test(cells[start])) continue;\n    const headers: string[] = [];\n    for (let i = start; i < Math.min(cells.length, start + 24); i++) {\n      if (/^\\d/.test(cells[i])) break;\n      headers.push(cells[i]);\n    }\n    const isRevenue = (h: string) => /^(?:doanh thu|dt)(?: |$)/.test(h);\n    const converted = headers.findIndex(h => isRevenue(h) && /\\b(?:qd|quy doi)\\b/.test(h));\n    const actual = headers.findIndex(h => isRevenue(h) && /\\bthuc\\b/.test(h));\n    const generic = hea t union = new Set([...A, ...B]).size;\n  return union ? inter / union : 0;\n}\n\nfunction compactHeader(value: string): string {\n  return normalizeStr(value).replace(/\\b(bao cao|chi tiet|thuc hien|phat sinh|hom nay|lu y ke|luy ke)\\b/g, ' ').replace(/\\s+/g, ' ').trim();\n}\n\nfunction loadDynamicColumnMap(): Record<string, string> {\n  try {\n    const raw = localStorage.getItem(DYNAMIC_MAP_STORAGE_KEY);\n    const parsed = raw ? JSON.parse(raw) : {};\n    return parsed && typeof parsed === 'object' ? parsed : {};\n  } catch { return {}; }\n}\n\nfunction learnColumnMapping(header: string, field: string): void {\n  if (typeof localStorage === 'undefined' || !header || !field) return;\n  try {\n    const map = loadDynamicColumnMap();\n    const key = compactHeader(header);\n    if (!key) return;\n    map[key] = field;\n    const keys = Object.keys(map);\n    if (keys.length > 250) delete map[keys[0]];\n    localStorage.setItem(DYNAMIC_MAP_STORAGE_KEY, JSON.stringify(map));\n  } catch { /* storage may be unavailable/private mode */ }\n}\n\nfunction findColumnIndex(headers: string[], aliases: string[]): number {\n  const normHeaders = headers.map(h => normalizeStr(h));\n  const compactHeaders = headers.map(h => compactHeader(h));\n  const dynamicMap = loadDynamicColumnMap();\n\n  for (const alias of aliases) {\n    const normAlias = normalizeStr(alias);\n    const idx = normHeaders.findIndex(h => h === normAlias || h.startsWith(normAlias));\n    if (idx !== -1) { learnColumnMapping(headers[idx], alias); return idx; }\n  }\n\n  for (let i = 0; i < compactHeaders.length; i++) {\n    const learned = dynamicMap[compactHeaders[i]];\n    if (!learned) continue;\n    const target = normalizeStr(learned);\n    if (aliases.some(a => normalizeStr(a) === target || normalizeStr(a).includes(target) || target.includes(normalizeStr(a)))) {\n      return i;\n    }\n  }\n\n  for (const alias of aliases) {\n    const normAlias = normalizeStr(alias);\n    const idx = normHeaders.findIndex(h => h.includes(normAlias));\n    if (idx !== -1) { learnColumnMapping(headers[idx], alias); return idx; }\n  }\n\n  let bestIdx = -1; let bestScore = 0;\n  for (let i = 0; i < compactHeaders.length; i++) {\n    for (const alias of aliases) {\n      const a = compactHeader(alias);\n      let score = tokenSimilarity(compactHeaders[i], a);\n      if (compactHeaders[i].includes(a) || a.includes(compactHeaders[i])) score += 0.18;\n      if (score > bestScore) { bestScore = score; bestIdx = i; }\n    }\n  }\n  if (bestIdx !== -1 && bestScore >= 0.52) {\n    learnColumnMapping(headers[bestIdx], aliases.reduce((a,b) => tokenSimilarity(headers[bestIdx], b) > tokenSimilarity(headers[bestIdx], a) ? b : a));\n    return bestIdx;\n  }\n  return -1;\n}\n\nfunction splitClipboardIntoGrid(rawText: string): SplitResult {\n  const rawLines = rawText.split(/\\r?\\n/).filter(line => line.trim().length > 0);\n\n  if (rawLines.length === 0) {\n    return {\n      headers: [],\n      rows: [],\n      pageExtractedInfo: {\n        headerFoundAtLine: 0,\n        totalLinesScanned: 0,\n        ignoredNoiseLines: 0,\n        isFullPageExtracted: false,\n      },\n    };\n  }\n\n  const tabCounts = rawLines.slice(0, 15).map(l => (l.match(/\\t/g) || []).length);\n  const avgTabs = tabCounts.reduce((a, b) => a + b, 0) / tabCounts.length;\n\n  let delimiter: string | RegExp = '\\t';\n  if (avgTabs < 1.5) {\n    const commaCounts = rawLines.slice(0, 15).map(l => (l.match(/,/g) || []).length);\n    const avgCommas = commaCounts.reduce((a, b) => a + b, 0) / commaCounts.length;\n    if (avgCommas >= 2) {\n      delimiter = ',';\n    }\n  }\n\n  const parsedLines = rawLines.map(line =>\n    line.split(delimiter).map(cell => cell.trim())\n  );\n\n  const commonHeaderKeywords = [\n    'ma', 'ten', 'sieu thi', 'don vi', 'target', 'doanh thu', 'quy doi',\n    'so luong', 'chuong trinh', 'nhan vien', 'tra gop', 'tb 3 thang'\n  ];\n\n  let bestHeaderIndex = -1;\n  let bestScore = -1;\n\n  for (let i = z -= 2; }\n\n  const ranked = Object.entries(score).sort((a,b) => b[1]-a[1]);\n  if (!ranked.length || ranked[0][1] < 6) return null;\n  const margin = ranked[0][1] - (ranked[1]?.[1] || 0);\n  if (margin < 1.5 && !rt && !staff && !program && !store) return null;\n  return ranked[0][0] as keyof AppDataState;\n}\n\nfunction mapGridToCategoryData(\n  category: keyof AppDataState,\n  headers: string[],\n  rows: string[][],\n  pageExtractedInfo?: SplitResult['pageExtractedInfo']\n): ParseDiagnostics {\n  const recognizedColumns: { field: string; mappedHeader: string; sampleVal?: string }[] = [];\n  const missingColumns: string[] = [];\n\n  const getIdx = (field: string, aliases: string[]): number => {\n    const idx = findColumnIndex(headers, aliases);\n    if (idx !== -1) {\n      recognizedColumns.push({\n        field,\n        mappedHeader: headers[idx],\n        sampleVal: rows[0] ? rows[0][idx] : undefined,\n      });\n    } else {\n      missingColumns.push(field);\n    }\n    return idx;\n  };\n\n  const getOptionalIdx = (field: string, aliases: string[]): number => {\n    const idx = findColumnIndex(headers, aliases);\n    if (idx !== -1) {\n      recognizedColumns.push({\n        field,\n        mappedHeader: headers[idx],\n        sampleVal: rows[0] ? rows[0][idx] : undefined,\n      });\n    }\n    return idx;\n  };\n\n  const getCell = (row: string[], idx: number, fallback: any = '') => {\n    if (idx === -1 || !row || idx >= row.length) return fallback;\n    const v = row[idx];\n    return v !== undefined && v !== null ? v : fallback;\n  };\n\n  let formattedData: any[] = [];\n\n  switch (category) {\n    case 'dt_luyke':\n    case 'dt_realtime': {\n      const idxMa = getIdx('MÃ ĐƠN VỊ', ['ma don vi', 'ma dv', 'ma st', 'ma sieu thi', 'st', 'store id', 'ma']);\n      const idxTen = getIdx('TÊN ĐƠN VỊ', ['ten don vi', 'ten dv', 'ten st', 'ten sieu thi', 'sieu thi', 'don vi', 'ten']);\n      const idxTarget = getIdx('TARGET (TR)', ['target tr', 'target dt', '  TRẢ GÓP (TR)': parseFlexibleNumber(getCell(row, idxTraGop, 0)) } : {}),\n          ...(idxPctTraGop !== -1 ? { '% TRẢ GÓP': parseFlexibleNumber(getCell(row, idxPctTraGop, 0)) } : {}),\n          'LƯỢT BILL (TẤT CẢ ST)': Math.round(parseFlexibleNumber(getCell(row, idxBill, 0))),\n          'SỐ LƯỢNG': Math.round(parseFlexibleNumber(getCell(row, idxQty, 0))),\n          'TB 3 THÁNG (TR)': parseFlexibleNumber(getCell(row, idxTb3, 0)),\n          'SỐ NGÀY CỬA SỔ': Math.round(parseFlexibleNumber(getCell(row, idxDays, category === 'dt_realtime' ? 1 : 0))),\n        };\n      }).filter(Boolean);\n      break;\n    }\n\n    case 'td_luyke':\n    case 'td_realtime': {\n      const idxMaCt = getIdx('MÃ CHƯƠNG TRÌNH', ['ma chuong trinh', 'ma ct', 'ct id', 'ma']);\n      const idxTenCt = getIdx('CHƯƠNG TRÌNH', ['chuong trinh', 'ten chuong trinh', 'ten ct', 'mon']);\n      const idxTarget = getIdx('TARGET (TR/SL theo LOẠI TĐ)', ['target tr sl theo loai td', 'target tr sl', 'target', 'chi tieu']);\n      const idxDt = getIdx('DOANH THU (TR)', ['doanh thu tr', 'doanh thu', 'dt tr', 'dt']);\n      const idxDtQd = getIdx('DT QUY ĐỔI (TR)', ['dt quy doi tr', 'dt quy doi', 'dt qd tr', 'dtqd']);\n      const idxQty = getIdx('SỐ LƯỢNG', ['so luong', 'sl', 'qty']);\n      const idxLoai = getIdx('LOẠI TĐ', ['loai td', 'loai', 'type']);\n      const idxHt = getIdx('% HT THÁNG', ['ht thang', 'ti le ht', 'hoan thanh', 'ht']);\n      const idxDb = getIdx('% DỰ BÁO', ['du bao', 'db']);\n      const idxRank = getIdx('HẠNG VÙNG', ['hang vung', 'hang']);\n\n      formattedData = rows.map((row) => {\n        const dt = parseFlexibleNumber(getCell(row, idxDt, 0));\n        const dtQd = idxDtQd !== -1 ? parseFlexibleNumber(getCell(row, idxDtQd, 0)) : 0;\n        const qty = Math.round(parseFlexibleNumber(getCell(row, idxQty, 0)));\n        const loai = idxLoai !== -1 ? Math.round(parseFlexibleNumber(getCell(row, idxLoai, 0))) : 0;\n        const target = parseFlexibleNumber(getCell(row, idxTarget, 0));\n        const htThang = idxHt !== -1 ? parseFlexibleNumber(getCell(row, idxHt, 0)) : (target > 0 ? (dt / target) * 100 : 0);\n\n        return {\n          'MÃ CHƯƠNG TRÌNH': String(getCell(row, idxMaCt, '')).trim(),\n          'CHƯƠNG TRÌNH': String(getCell(row, idxTenCt, '')).trim(),\n          'LOẠI TĐ': loai,\n          'TARGET (TR/SL theo LOẠI TĐ)': target,\n          'DOANH THU (TR)': dt,\n          'DT QUY ĐỔI (TR)': dtQd,\n          'SỐ LƯỢNG': qty,\n          '% HT THÁNG': htThang,\n          '% DỰ BÁO': idxDb !== -1 ? parseFlexibleNumber(getCell(row, idxDb, 0)) : 0,\n          'HẠNG VÙNG': getCell(row, idxRank, ''),\n        };\n      });\n      break;\n    }\n\n    case 'dt_nv_luyke':\n    case 'dt_nv_realtime': {\n      const idxMaNv = getIdx('MÃ NHÂN VIÊN', ['ma nhan vien', 'ma nv', 'ma nhan su', 'ma so', 'user id', 'ma']);\n      const idxTenNv = getIdx('TÊN NHÂN VIÊN', ['ten nhan vien', 'ten nv', 'ho va ten', 'ho ten', 'nhan vien']);\n      const idxShop = getIdx('SIÊU THỊ', ['sieu thi', 'ten st', 'don vi', 'shop']);\n      const idxDt = getIdx('DOANH THU (TR)', ['doanh thu tr', 'doanh thu', 'dt']);\n      const idxDtQd = getIdx('DOANH THU QĐ (TR)', ['doanh thu qd tr', 'doanh thu quy doi', 'dt qd tr', 'dt qd', 'quy doi']);\n      // Trả góp là nhóm cột tùy chọn trên BI: không tích thì không coi là lỗi/0.\n      const idxTraGop = getOptionalIdx('DT TRẢ GÓP (TR)', ['dt tra gop tr', 'dt tra gop', 'tra gop']);\n      const idxPctTraGop = getOptionalIdx('% TRẢ GÓP', ['pct tra gop', 'ti le tra gop', 'ty le tra gop', 'phan tram tra gop']);\n      const idxQty = getIdx('SỐ LƯỢNG', ['so luong', 'sl', 'qty']);\n\n      formattedData = rows.map((row) => {\n        let maNv = getCell(row, idxMaNv, '');\n        let tenNv = getCell(row, idxTenNv, '');\n\n        if (!maNv && tenNv) {\n          const parenMatch = String(tenNv).match(/\\((\\d+)\\)/);\n          if (parenMatch) {\n            maNv = parenMatch[1];\n            tenNv = String(tenNv).replace(/\\ THÁNG', ['ht thang', 'ti le ht', 'hoan thanh']);\n      const idxRank = getIdx('HẠNG VÙNG', ['hang vung', 'hang']);\n\n      formattedData = rows.map((row, rIdx) => {\n        const dt = parseFlexibleNumber(getCell(row, idxDt, 0));\n        const dtQd = idxDtQd !== -1 ? parseFlexibleNumber(getCell(row, idxDtQd, 0)) : 0;\n        const qty = Math.round(parseFlexibleNumber(getCell(row, idxQty, 0)));\n        const loai = idxLoai !== -1 ? Math.round(parseFlexibleNumber(getCell(row, idxLoai, 0))) : 0;\n        const target = parseFlexibleNumber(getCell(row, idxTarget, 0));\n        const htThang = idxHt !== -1 ? parseFlexibleNumber(getCell(row, idxHt, 0)) : (target > 0 ? (dt / target) * 100 : 0);\n\n        return {\n          'MÃ NV': String(getCell(row, idxMaNv, '')),\n          'ĐƠN VỊ / NHÂN VIÊN': String(getCell(row, idxTenNv, `Nhân viên ${rIdx + 1}`)),\n          'MÃ CHƯƠNG TRÌNH': String(getCell(row, idxMaCt, '')).trim(),\n          'CHƯƠNG TRÌNH': String(getCell(row, idxTenCt, '')).trim(),\n          'LOẠI TĐ': loai,\n          'TARGET (TR/SL theo LOẠI TĐ)': target,\n          'DOANH THU (TR)': dt,\n          'DT QUY ĐỔI (TR)': dtQd,\n          'SỐ LƯỢNG': qty,\n          '% HT THÁNG': htThang,\n          'HẠNG VÙNG': getCell(row, idxRank, ''),\n        };\n      });\n      break;\n    }\n  }\n\n  const requiredCount = Math.max(1, recognizedColumns.length + missingColumns.length);\n  const confidence = Math.round((recognizedColumns.length / requiredCount) * 100);\n  const mappingMode: ParseDiagnostics['mappingMode'] = recognizedColumns.some(x => {\n    const exact = normalizeStr(x.mappedHeader) === normalizeStr(x.field);\n    return !exact;\n  }) ? 'fuzzy' : 'exact';\n\n  return {\n    category,\n    categoryName: CATEGORY_LABELS[category],\n    rowCount: formattedData.length,\n    recognizedColumns,\n    missingColumns,\n    data: formattedData,\n    mappingMode,\n    confidence,\n    pageExtractedInfo,\n  };\n}\n\nfunction parsePastedDataInternal(\n  rawText: string,\n  targetCategory?: keyof AppDataState | null,\n  context?: MwgDetectionContext\n): ParseDiagnostics | { error: string } {\n  if (!rawText || !rawText.trim()) {\n    return { error: 'Nội dung dán trống. Vui lòng kiểm tra lại clipboard!' };\n  }\n\n  const competitionText = normalizeCompetitionClipboard(rawText);\n  if (!targetCategory && /hang trong st/.test(normalizeStr(competitionText)) &&\n      !employeeCompetitionDestination(competitionText, context)) {\n    return { error: 'Đã nhận ra bảng thi đua nhân viên nhưng chưa đủ thông tin xác định shop. Anh chọn TGDĐ hoặc TopZone ở mục Loại dữ liệu, rồi lưu lại.' };\n  }\n\n  const mwgResult = tryParseMwgBiFormat(rawText, targetCategory, context);\n  if (mwgResult && mwgResult.data.length > 0) {\n    return mwgResult;\n  }\n\n  const { headers, rows, pageExtractedInfo } = splitClipboardIntoGrid(rawText);\n\n  if (rows.length > 0) {\n    let finalCategory: keyof AppDataState | null = targetCategory || null;\n\n    if (!finalCategory) {\n      finalCategory = detectCategoryFromParsedData(headers, rows);\n    }\n\n    if (finalCategory) {\n      return mapGridToCategoryData(finalCategory, headers, rows, pageExtractedInfo);\n    }\n  }\n\n  if (rows.length === 0) {\n    return {\n      error:\n        'Không tìm thấy dữ liệu bảng hợp lệ trong nội dung dán. Vui lòng copy từ báo cáo BI hoặc bảng tính Excel và dán lại.',\n    };\n  }\n\n  return {\n    error:\n      'Hệ thống chưa tự động nhận diện được loại dữ liệu này. Vui lòng chọn cụ thể mục dữ liệu ở thanh chọn bên trên.',\n  };\n}\n\nexport function parsePastedData(...args: Parameters<typeof parsePastedDataInternal>): ReturnType<typeof parsePastedDataInternal> {\n  try { return parsePastedDataInternal(...args); }\n  catch (e: any) { return { error: e?.message || 'Dữ liệu số không hợp lệ.' } as ReturnType<typeof parsePastedDataInternal>; }\n}\n","src/views/TraChamView.tsx":"import { SortableTable } from '../components/SortableTable';\nimport React, { useEffect, ;\n  const managePanelRef = useRef<HTMLDivElement>(null);\n\n  const rows = appData.tra_cham_luyke || [];\n\n  const activeRosterNames = useMemo(() => {\n    const set = new Set<string>();\n    for (const storeKey of ['TGDD', 'TOPZONE']) {\n      for (const [name, cfg] of Object.entries(personnelConfig?.[storeKey] || {})) {\n        if ((cfg as any)?.isVisible === false) continue;\n        const normalized = normalizeTraChamName(name);\n        if (normalized) set.add(normalized);\n      }\n    }\n    return set;\n  }, [personnelConfig]);\n\n  const hasConfiguredRoster = activeRosterNames.size > 0;\n  const rosterRows = useMemo(() => {\n\n    if (shop === 'ALL') return rows;\n\n    return hasConfiguredRoster\n      ? rows.filter((r: any) => activeRosterNames.has(normalizeTraChamName(r['NHÂN VIÊN'] || r['TÊN NHÂN VIÊN'] || r['ĐƠN VỊ / NHÂN VIÊN'])))\n      : rows;\n  }, [rows, shop, activeRosterNames, hasConfiguredRoster]);\n\n  const excludedRosterCount = shop === 'ALL' ? 0 : Math.max(0, rows.length - rosterRows.length);\n  const shopRows = useMemo(() => rosterRows.filter((r: any) => shop === 'ALL' || resolveShop(r) === shop), [rosterRows, shop, resolveShop]);\n  const unknownCount = shop === 'ALL' ? 0 : rosterRows.filter((r: any) => !resolveShop(r)).length;\n  const hiddenCount = shopRows.filter((r: any) => hidden.has(String(r['NHÂN VIÊN'] || '').trim())).length;\n  const hasLk = (appData.tra_cham_luyke || []).length > 0;\n\n  const allEmployeeNames = useMemo(() => {\n    const set = new Set<string>();\n    (appData.tra_cham_luyke || []).forEach((r: any) => {\n      const normalized = normalizeTraChamName(r['NHÂN VIÊN'] || r['TÊN NHÂN VIÊN'] || r['ĐƠN VỊ / NHÂN VIÊN']);\n      if (shop !== 'ALL' && hasConfiguredRoster && !activeRosterNames.has(normalized)) return;\n      if (shop !== 'ALL' && resolveShop(r) !== shop) return;\n      const name = String(r['NHÂN VIÊN'] || '').trim();\n      if (name) set.add(name);\n    });\n    return Array.from(set).sort((a, b) => a.localeCompare(b, 'vi'));\n  }, [appData.tra_cham_luyke, shop, resolveShop, activeRosterNames, hasConfiguredRoster]);\n\n  useEffect(() => {\n    try { localStorage.setItem(HIDDEN_STORAGE_KEY, JSON.stringify(Array.from(hidden))); } catch {  }\n  }, [hidden]);\n\n  useEffect(() => {\n    const handleClickOutside = (e: MouseEvent) => {\n      if (managePanelRef.current && !managePanelRef.current.contains(e.target as Node)) {\n        setShowManage(false);\n      }\n    };\n    if (showManage) document.addEventListener('mousedown', handleClickOutside);\n    return () => document.removeEventListener('mousedown', handleClickOutside);\n  }, [showManage]);\n\n  const toggleHidden = (name: string) => {\n    setHidden(prev => {\n      const next = new Set(prev);\n      if (next.has(name)) next.delete(name); else next.add(name);\n      return next;\n    });\n  };\n\n  const visibleRows = useMemo(() => shopRows.filter((r: any) => !hidden.has(String(r['NHÂN VIÊN'] || '').trim())), [shopRows, hidden]);\n\n  const filtered = useMemo(() => visibleRows\n    .filter((r: any) => String(r['NHÂN VIÊN'] || '').toLowerCase().includes(search.toLowerCase().trim()))\n    .sort((a: any, b: any) => Number(b['DT TRẢ GÓP (TRIỆU)'] || 0) - Number(a['DT TRẢ GÓP (TRIỆU)'] || 0)), [visibleRows, search]);\n\n  const total = visibleRows.reduce((s: number, r: any) => s + Number(r['DT TRẢ GÓP (TRIỆU)'] || 0), 0);\n  const totalShop = visibleRows.reduce((s: number, r: any) => s + Number(r['DT SIÊU THỊ (TRIỆU)'] || 0), 0);\n  const avgShare = totalShop ? total / totalShop * 100 : 0;\n  const leader = filtered[0];\n  const sourceTotals = sources.map(([dtKey, name, pctKey]) => ({ name, value: visibleRows.reduce((s: number, r: any) => s + Number(r[dtKey] || 0), 0), share: total ? visibleRows.reduce((s: number, r: any) => s + Number(r[dtKey] || 0), 0) / total * 100 : 0, pctKey }));\n\n  return (\n    <div className=\"w-full h-full overflow-y-auto custom-scroll bg-slate-100 p-3 sm:p-5 space-y-4\">\n      <div ">{visibleRows.filter((r:any) => Number(r['DT TRẢ GÓP (TRIỆU)'] || 0) > 0).length}</div><div className=\"text-[10px] text-slate-400 mt-1\">/ {visibleRows.length} nhân viên{hiddenCount > 0 ? ` (đang ẩn ${hiddenCount})` : ''}</div></div>\n          <div className=\"rounded-2xl bg-white border border-violet-100 p-4 shadow-sm\"><div className=\"text-[10px] font-black text-slate-400 uppercase\">Dẫn đầu</div><div className=\"text-lg font-black text-violet-700 mt-1 truncate\">{leader?.['NHÂN VIÊN'] || '—'}</div><div className=\"text-[10px] text-slate-400 mt-1\">{leader ? `${money(leader['DT TRẢ GÓP (TRIỆU)'])} TR` : 'Chưa có dữ liệu'}</div></div>\n        </div>\n\n        {!rows.length && <div className=\"bg-white border border-dashed border-slate-300 rounded-3xl p-10 text-center\"><WalletCards className=\"w-10 h-10 mx-auto text-slate-300\" /><div className=\"font-black text-slate-700 mt-3\">Chưa có dữ liệu Trả Chậm</div><p className=\"text-xs text-slate-400 mt-1\">Nhấn “Nạp dữ liệu” → Ctrl+A → Ctrl+C toàn bộ trang Báo cáo trả chậm trên BI → dán vào hệ thống.</p></div>}\n\n        {!!rows.length && <>\n          <div className=\"bg-white rounded-3xl border border-slate-200 shadow-sm p-4\">\n            <div className=\"flex flex-col md:flex-row md:items-center justify-between gap-3 mb-3\">\n              <div><h3 className=\"font-black text-slate-900 text-sm\">Nguồn tài chính</h3><p className=\"text-[10px] text-slate-400\">Tổng doanh thu trả chậm theo từng đối tác trong lũy kế.</p></div>\n              <div className=\"relative w-full md:w-64\"><Search className=\"absolute left-3 top-2.5 w-4 h-4 text-slate-400\" /><input value={search} onChange={e => setSearch(e.target.value)} placeholder=\"Tìm nhân viên...\" className=\"w-full pl-9 pr-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs font-semibold outline-none focus:ring-2 focus:ring-blue-500\" /></div>\n            </div>\n            <div className=\"grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-2.5\">\n              {sourceTotals.map((s) => <div key={s.name} className={`rounded-2xl p-3 border ${s.value > 0 ? 'bg-blue-50/60 border-blue-100' : 'bg-slate-50 border-slate-100'}`}><div className=\"text-[10px] font-black text-slate-500 truncate\">{s.name}</div><div className=\"text-base font-black text-slate-900 mt-1\">{money(s.value)} <span className=\"text-[9px] text-slate-400\">TR</span></div><div className=\"text-[10px] font-bold text-blue-600 mt-0.5\">{pct(s.share)}</div></div>)}\n            </div>\n          </div>\n\n          <div className=\"bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden\">\n            <div className=\"px-4 py-3 border-b border-slate-100 flex items-center justify-between\"><div><h3 className=\"font-black text-slate-900 text-sm\">Xếp hạng nhân viên trả chậm</h3><p className=\"text-[10px] text-slate-400\">{filtered.length} nhân viên • sắp xếp theo DT trả góp giảm dần</p></div><div className=\"text-[10px] font-bold text-slate-400\">Đơn vị: triệu đồng</div></div>\n            <div className=\"overflow-x-auto custom-scroll\">\n              <SortableTable className=\"w-full min-w-[980px] text-xs border-collapse\">\n                <thead className=\"bg-slate-900 text-white text-[10px] font-black sticky top-0 z-10\"><tr><th className=\"px-3 py-3 text-center w-12\">#</th><th className=\"px-4 py-3 text-left\">NHÂN VIÊN</th><th className=\"px-3 py-3 text-right\">DT TRẢ CHẬM</th><th className=\"px-3 py-3 text-right\">DT SIÊU THỊ</th><th className=\"px-3 py-3 text-right\">TỶ TRỌNG</th>{sources.map(s => <th key={s[1]} className={`px-3 py-3 text-right ${s[1] === 'Samsung Finance+' ? 'w-[64px] whitespace-normal leading-tight' : ''}`}>{s[1] === 'Samsung Finance+' ? <>SAMSUNG<br/>FINANCE+</> : s[1].toUpperCase()}</th>)}</tr></thead>\n                <tbody className=\"divide-y divide-slate-100\">\n                  {filtered.map((r:any, idx:number) => {\n                    const value = Number(r['DT TRẢ GÓP (TRIỆU)'] || 0); const share = Number(r['TỶ TRỌNG TRẢ CHẬM (%)'] || 0); const positive = value > 0;\n                    return <tr key={r['NHÂN VIÊN']} className={`hover:bg-blue-50/60 transition ${idx === 0 ? 'bg-amber-50/60' : positive ? '' : 'bg-slate-50/70'}`}>\n                      <td className=\"px-3 py-3 text-center font-black text-slate-400\">{idx < 3 ? ['🥇','🥈','🥉'][idx] : idx + 1}</td>\n                      <td className=\"px-4 py-3 font-black text-slate-800\">{r['NHÂN VIÊN']}</td>\n                      <td className={`px-3 py-3 text-right font-black ${value < 0 ? 'text-rose-600' : 'text-blue-700'}`} data-sort-value={value}>{money(value)}</td>\n                      <td className=\"px-3 py-3 text-right font-semibold text-slate-600\" data-sort-value={r['DT SIÊU THỊ (TRIỆU)']}>{money(r['DT SIÊU THỊ (TRIỆU)'])}</td>\n                      <td className={`px-3 py-3 text-right font-black ${share >= 50 ? 'text-emerald-700' : share > 0 ? 'text-amber-700' : 'text-slate-400'}`} data-sort-value={share}>{pct(share)}</td>\n                      {sources.map(([dtKey,name,pctKey]) => { const v=Number(r[dtKey]||0); const p=Number(r[pctKey]||0); return <td key={name} data-sort-value={v} className=\"px-3 py-3 text-right\"><div className=\"font-bold text-slate-700\">{money(v)}</div><div className=\"text-[9px] font-bold text-slate-400\">{pct(p)}</div></td> })}\n                    </tr>\n                  })}\n                </tbody>\n              </SortableTable>\n            </div>\n            <div className=\"px-4 py-3 bg-slate-50 border-t border-slate-100 text-[10px] text-slate-500 flex flex-wrap gap-x-4 gap-y-1\"><span><b>Tổng DT trả chậm:</b> {money(total)} TR</span><span><b>DT siêu thị:</b> {money(totalShop)} TR</span><span><b>Tỷ trọng:</b> {pct(avgShare)}</span><span><b>Shop:</b> {shopLabel}</span><span><b>Chế độ:</b> Lũy kế</span></div>\n          </div>\n        </>}\n      </div>\n    </div>\n  );\n};\n","src/views/BaoCaoCuoiNgayView.tsx":"import { countPrograms } from '../utils/programCounts';\nimport { SortableTable } from '../components/SortableTable';\nimport React, { useState, useEffect, useRef } from 'react';\nimport { Chart as ChartJS, registerables } from 'chart.js';\nimport { Eye, EyeOff, ArrowRightLeft, BarChart3, Table2, Copy } from 'lucide-react';\nimport { AppDataState, CompetitionRow } from '../types';\nimport { useStretchGoalPct } from '../utils/stretchGoal';\nimport { ProgramCopyToolbar, ProgramCopyItem } from '../components/ProgramCopyToolbar';\nimport { copyProgramNames, getProgramCopyNamesInRect, highlightProgramCopyNames, clearProgramCopyHighlights, suppressProgramOpen, shouldSuppressProgramOpen } from '../utils/programCopy';\nimport { formatInt, formatPercent, formatProgramName, cleanCode } from '../utils/formatters';\nimport { getReportPeriodContext } from '../utils/reportPeriod';\n\nChartJS.register(...registerables);\n\nconst formatReportDisplayNumber = (value: number | string) => {\n  const num = Number(value);\n  if (!Number.isFinite(num)) return '0';\n  return Number.isInteger(num)\n    ? num.toLocaleString('vi-VN', { maximumFractionDigits: 0 })\n    : num.toLocaleString('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n};\n\ninterface BaoCaoCuoiNgayViewProps {\n  appData: AppDataState;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n}\n\nexport const BaoCaoCuoiNgayView: React.FC<BaoCaoCuoiNgayViewProps> = ({\n  appData,\n  onOpenProgramDetail,\n}) => {\n  const [revenueMode, setRevenueMode] = useState<'QD' | 'THUC'>('QD');\n  const [donutMode, setDonutMode] = useState<'RT' | 'LK'>('RT');\n  const [isSplitTable, setIsSplitTable] = useState<boolean>(false);\n  const [splitStoreKey, setSplitStoreKey] = useState<'TGDD' | 'TOPZONE'>('TGDD');\n  const [searchTerm, setSearchTerm] = useState<string>('');\n  const [stretchGoalPct] = useStretchGoalPct();\n\n  const [showCharts, setShowCharts] = useState<boolean>(false);\n  const [showKpiCards, setShowKpiCards] = useS
