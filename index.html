= 'skst_personnel_config_v7';\nconst STORAGE_KEY_AUTO_BACKUPS = 'skst_auto_backups_v2';\nconst STORAGE_KEY_DAILY = 'skst_daily_snapshots_v1';\nconst STORAGE_KEY_SESSION_DAY = 'skst_session_day_v1';\nconst STORAGE_KEY_LAST_CLEAR_BACKUP = 'skst_last_clear_backup_v1';\nconst STORAGE_KEY_SLOT_MONTHS = 'skst_slot_months_v1';\nconst RETENTION_MS = 31 * 24 * 60 * 60 * 1000;\n\ntype SlotMonthMap = Record<string, string>;\nconst MONTH_SENSITIVE_LUYKE_SLOTS = ['dt_luyke', 'td_luyke', 'dt_nv_luyke', 'tra_cham_luyke'] as const;\n\nfunction currentVietnamMonthKey(): string {\n  return getVietnamDayKey().slice(0, 7);\n}\n\nfunction previousMonthKey(monthKey: string): string {\n  const [year, month] = monthKey.split('-').map(Number);\n  const d = new Date(Date.UTC(year, month - 2, 1));\n  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;\n}\n\nfunction hasAnyRealtimeData(data: Partial<AppDataState> | null | undefined): boolean {\n  return ['dt_realtime', 'td_realtime', 'dt_nv_realtime', 'tra_cham_realtime'].some(slot => {\n    const rows = (data as any)?.[slot];\n    return Array.isArray(rows) && rows.length > 0;\n  });\n}\n\nfunction seedPreviousMonthSlotTags(data: AppDataState, base: SlotMonthMap = {}): SlotMonthMap {\n  const next = { ...base };\n  if (!hasAnyRealtimeData(data)) return next;\n  const period = getReportPeriodContext(data);\n  if (!period.inferredPreviousMonth) return next;\n  MONTH_SENSITIVE_LUYKE_SLOTS.forEach(slot => {\n    const rows = (data as any)[slot];\n    if (Array.isArray(rows) && rows.length > 0 && !next[slot]) next[slot] = period.monthKey;\n  });\n  return next;\n}\n\nfunction buildOperationalAppData(data: AppDataState, slotMonths: SlotMonthMap) {\n  const currentMonth = currentVietnamMonthKey();\n  const period = getReportPeriodContext(data);\n  const crossMonthDetected = period.inferredPreviousMonth && period.monthKey !== currentMonth;\n\n  const scoped = { ...data } as AppDataState;\n  const separatedSlots: string[] = gStore === 'TGDD' ? 'TGDĐ' : employeeRankingStore === 'TOPZONE' ? 'TOPZONE' : 'TOÀN CỤM';\n          return [\n            { id: 'employee-ranking-current', icon: '📷', label: `Xuất shop đang xem — ${employeeStoreLabel}`, description: 'Xuất đúng chế độ Tổng Quan / Bảng DT / Thẻ Chi Tiết / AI Kế Hoạch đang hiển thị.', onSelect: () => handleExportScreenshot(`XepHangNhanVien_${employeeStoreLabel}`, 'stack') },\n            { id: 'employee-ranking-both', icon: '🏪', tone: 'emerald' as const, label: 'Xuất cả 2 shop', description: 'TGDĐ + TOPZONE → 2 ảnh PNG riêng biệt; sau khi xuất tự quay lại shop đang xem.', onSelect: async () => { await exportEmployeeRankingStore('TGDD'); await exportEmployeeRankingStore('TOPZONE'); } },\n          ];\n        }\n        const currentLabel = traChamShop === 'ALL' ? 'Tất cả' : traChamShop === 'TGDD' ? 'TGDĐ' : 'TopZone';\n        const actions: any[] = [\n          { id: 'tracham-current', icon: '📷', label: `Xuất bộ lọc đang xem — ${currentLabel}`, description: 'Xuất báo cáo Trả chậm Lũy kế theo bộ lọc đang hiển thị.', onSelect: () => handleExportScreenshot(`TraCham_${traChamShop}`, 'stack') },\n        ];\n        if (traChamShop !== 'ALL') actions.push({ id: 'tracham-all', icon: '👥', label: 'Xuất Tất cả nhân viên', description: 'Tạm chuyển bộ lọc sang Tất cả để xuất rồi tự quay lại.', onSelect: () => exportTraChamShop('ALL') });\n        if (traChamShop !== 'TGDD') actions.push({ id: 'tracham-tgdd', icon: '🏬', label: 'Xuất riêng TGDĐ', description: 'Tạm chuyển bộ lọc sang TGDĐ để xuất rồi tự quay lại.', onSelect: () => exportTraChamShop('TGDD') });\n        if (traChamShop !== 'TOPZONE') actions.push({ id: 'tracham-topzone', icon: '🏬', label: 'Xuất riêng TopZone', description: 'Tạm chuyển bộ lọc sang TopZone để xuất rồi tự quay lại.', onSelect: () => exportTraChamShop('TOPZONE') });\n        return actions;\n      }\n      default:\n        return [\n          { id: 'current-view', icon: '📷', label: 'Xuất tab hiện tại', description: 'C     activeStore={thiDuaActiveStore}\n            onChangeActiveStore={setThiDuaActiveStore}\n            onOpenProgramDetail={handleOpenProgramDetail}\n          />\n        );\n      case ViewType.SUC_KHOE_CUM:\n        return (\n          <SucKhoeCumView\n            appData={operationalAppData}\n            onOpenProgramDetail={handleOpenProgramDetail}\n          />\n        );\n      case ViewType.DOANH_THU_ST:\n        return (\n          <DoanhThuStView\n            appData={operationalAppData}\n            activeStore={activeStore}\n            onChangeActiveStore={setActiveStore}\n            onOpenProgramDetail={handleOpenProgramDetail}\n            personnelConfig={personnelConfig}\n            lastImportAt={lastImportAt}\n            subView={doanhThuSubView}\n            onChangeSubView={setDoanhThuSubView}\n            onExportRealtimeSummary={() => handleExportScreenshot('RealtimeTongHop', 'screen', true)}\n            isExporting={isExporting}\n          />\n        );\n      case ViewType.SUC_KHOE_NV:\n        return (\n          <SucKhoeNvView\n            appData={operationalAppData}\n            personnelConfig={personnelConfig}\n            onUpdatePersonnelConfig={updatePersonnelConfig}\n            onOpenQuickUpload={() => setIsUploadModalOpen(true)}\n            onOpenProgramDetail={handleOpenProgramDetail}\n            onOpenPersonnelSettings={() => setCurrentView(ViewType.KPI_CUSTOM)}\n            subView={employeeSubView}\n            onChangeSubView={setEmployeeSubView}\n            traChamShop={traChamShop}\n            onChangeTraChamShop={setTraChamShop}\n            storeTab={employeeRankingStore}\n            onChangeStoreTab={setEmployeeRankingStore}\n          />\n        );\n      case ViewType.DU_BAO:\n        return (\n          <DuBaoView\n            appData={operationalAppData}\n          />\n        );\n      case ViewType.THEO_DOI_NGAY:\n        return (\n          <DailyProgressView appData={appData} dailySnapshots={dailySnapshots} onRefresh={() => saveDailyProgressSnapshot(appData)} />\n        );\n      case ViewType.DATA_QUALITY:\n        return <DataQualityCenterView appData={appData} />;\n      case ViewType.KPI_CUSTOM:\n        return (\n          <KpiCustomView\n            appData={appData}\n            onUpdateAppData={setAppData}\n            personnelConfig={personnelConfig}\n            onUpdateConfig={updatePersonnelConfig}\n            onResetDefault={() => {\n              updatePersonnelConfig(JSON.parse(JSON.stringify(DEFAULT_PERSONNEL_CONFIG)));\n              showToast('Đã khôi phục danh sách 10 nhân sự NHT mặc định!');\n            }}\n          />\n        );\n      default:\n        return (\n          <BaoCaoCuoiNgayView\n            appData={operationalAppData}\n            onOpenProgramDetail={handleOpenProgramDetail}\n          />\n        );\n    }\n  };\n\n  return (\n    <div\n      style={{ fontFamily: themeFont }}\n      className=\"min-h-screen bg-slate-100 flex flex-col text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900\"\n    >\n      {lastClearedBackup && isClearNoticeVisible && (\n        <div className=\"fixed bottom-5 left-5 z-50 bg-white border border-slate-200 shadow-xl rounded-2xl p-3 flex items-center gap-3\">\n          <div className=\"text-xs\"><b>Data vừa được xóa trắng.</b><div className=\"text-slate-500\">Bản an toàn vẫn còn để hoàn tác.</div></div>\n          <button onClick={() => { setAppData(lastClearedBackup.appData); updateSlotMonthMap(seedPreviousMonthSlotTags(lastClearedBackup.appData, lastClearedBackup.slotMonths || {})); updateLastImportAt(lastClearedBackup.lastImportAt || null); updatePersonnelConfig(lastClearedBackup.personnelConfig); setLastClearedBackup(null); try { localStorage.removeItem(STORAGE_KEY_LAST_CLEAR_BACKUP); } catch {} showToast('Đã hoàn tác lần xóa dữ liệu gần nhất!'); }} className=\"px-3 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-bold\">Hoàn tác</button>\n          <button onClick={() => { setLastClearedBackup(null); try { localStorage.removeItem(STORAGE_KEY_LAST_CLEAR_BACKUP); } catch {} }} className=\"text-xs text-slate-400 hover:text-slate-700\">×</button>\n        </div>\n      )}\n\n      {toast.show && (\n        <div className=\"fixed bottom-5 right-5 z-50 animate-bounce\">\n          <div\n            className={`px-4 py-2.5 rounded-xl shadow-lg font-bold text-xs flex items-center gap-2 ${\n              toast.type === 'error'\n                ? 'bg-rose-600 text-white'\n                : toast.type === 'info'\n                ? 'bg-blue-600 text-white'\n                : 'bg-emerald-600 text-white'\n            }`}\n          >\n            <span>{toast.type === 'error' ? '❌' : toast.type === 'info' ? 'ℹ️' : '✓'}</span>\n            <span>{toast.message}</span>\n          </div>\n        </div>\n      )}\n\n      <Header\n        currentView={currentView}\n        onOpenUpload={() => setIsUploadModalOpen(true)}\n        onOpenAiAssistant={() => setActiveDrawer('danh-gia-ai')}\n        onOpenSettings={() => setActiveDrawer('giao-dien')}\n        onOpenSessionManager={() => setActiveDrawer('quan-ly-phien')}\n        onOpenClearSession={() => setIsClearModalOpen(true)}\n        onOpenDownloads={() => setActiveDrawer('tai-xuong')}\n        screenshotCount={screenshots.length}\n        isExporting={isExporting}\n        exportActions={getHeaderExportActions()}\n        onToggleMobileSidebar={() => setIsSidebarOpen(!isSidebarOpen)}\n      />\n\n      <div className=\"flex-1 flex overflow-hidden\">\n        <Sidebar\n          currentView={currentView}\n          onSelectView={(view) => {\n            navigateToView(view);\n            setIsSidebarOpen(false);\n          }}\n          isOpenMobile={isSidebarOpen}\n          onCloseMobile={() => setIsSidebarOpen(false)}\n          onOpenClearSession={() => setIsClearModalOpen(true)}\n        />\n\n        <main className=\"flex-1 overflow-y-auto custom-scroll p-4 md:p-6 lg:p-8\">\n          <div className=\"max-w-7xl mx-auto mb-3\"><StretchGoalSyncStatus /></div>\n          {hasSeparatedPreviousMonthLuyKe && (\n            <div className=\"max-w-7xl mx-auto mb-4 rounded-2xl border border-sky-200 bg-sky-50 px-4 py-3 text-xs text-sky-900 shadow-xs\">\n              <div className=\"font-black\">⚡ Đang vận hành {currentOperationalMonthLabel} · đã tách Lũy kế {separatedPreviousMonthLabel}</div>\n              <div className=\"mt-1 text-sky-700\">Dữ liệu tháng cũ vẫn được giữ để tham chiếu/lịch sử nhưng không tham gia phép tính tháng mới. Realtime hiện tại không bao giờ cộng với Lũy kế khác tháng.</div>\n            </div>\n          )}\n          {hasCurrentRealtime && !hasSeparatedPreviousMonthLuyKe && expectedClosedDay > 0 && missingClosedDays === 0 && (\n            <div className=\"max-w-7xl mx-auto mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-xs text-emerald-900 shadow-xs\">\n              <div className=\"font-black\">✅ Chu kỳ đúng: Lũy kế đến ngày {expectedClosedDay} + Realtime ngày {currentVnDay}</div>\n              <div className=\"mt-1 text-emerald-700\">Doanh thu/thi đua hiện tại dùng LK D-1 + RT D; GAP tính trên phần còn thiếu sau Realtime hôm nay.</div>\n            </div>\n          )}\n          {hasCurrentRealtime && !hasSeparatedPreviousMonthLuyKe && expectedClosedDay > 0 && missingClosedDays > 0 && (\n            <div className=\"max-w-7xl mx-auto mb-4 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-xs text-amber-900 shadow-xs\">\n              <div className=\"font-black\">⚠️ Realtime ngày {currentVnDay} đang chạy nhưng Lũy kế mới chốt đến ngày {actualClosedDay || 0}</div>\n              <div className=\"mt-1 text-amber-700\">Đang thiếu {missingClosedDays} ngày Lũy kế. Hệ thống không lấy dữ liệu tháng trước để bù; khi nhập LK mới, phép tính sẽ tự cập nhật.</div>\n            </div>\n          )}\n          <div\n            ref={exportContainerRef}\n            className={`mx-auto space-y-6 ${\n              currentView === ViewType.DOANH_THU_ST && doanhThuSubView === 'REALTIME_SUMMARY'\n                ? 'realtime-live-export-width'\n                : 'max-w-7xl'\n            }`}\n          >\n            <div className=\"flex items-center justify-end -mb-2\">\n              <div className=\"inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-[11px] font-extrabold shadow-xs\">\n                🎯 Mục tiêu bứt phá toàn hệ thống: {stretchGoalPct}% Target\n              </div>\n            </div>\n            {renderCurrentView()}\n          </div>\n        </main>\n      </div>\n\n      <QuickUploadModal\n        isOpen={isUploadModalOpen}\n        onClose={() => setIsUploadModalOpen(false)}\n        appData={appData}\n        onDataParsed={handleDataParsed}\n        onOpenClearModal={() => setIsClearModalOpen(true)}\n      />\n\n      {cloudHandoffOffer && (\n        <div className=\"fixed inset-0 z-[76] flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm\">\n          <div className=\"w-full max-w-2xl max-h-[88vh] overflow-hidden rounded-3xl bg-white shadow-2xl border border-sky-100 flex flex-col\">\n            <div className=\"p-5 md:p-6 border-b border-slate-100 bg-gradient-to-r from-sky-50 to-blue-50\">\n              <div className=\"flex items-start justify-between gap-4\">\n                <div>\n                  <div className=\"text-[11px] font-black uppercase tracking-wider text-sky-600\">☁️ Cloud Handoff · Bàn giao ca</div>\n                  <h3 className=\"mt-1 text-xl font-black text-slate-900\">Phát hiện data đã nhập trong hôm nay</h3>\n                  <p className=\"mt-2 text-sm text-slate-600\">\n                    Bản mới nhất: <b>{cloudHandoffOffer.latestEntry?.updatedByEmail || 'Tài khoản Google'}</b>\n                    {' · '}\n                    <b>{formatCloudTime(cloudHandoffOffer.latestAt)}</b>\n                  </p>\n                  <div className=\"mt-3 inline-flex items-center rounded-full border border-sky-200 bg-white px-3 py-1 text-[11px] font-black text-sky-700\">\n                    Có {cloudHandoffOffer.entries.length}/{DAILY_DATA_SLOTS.length} nhóm data của hôm nay\n                  </div>\n                </div>\n                <button type=\"button\" onClick={() => setCloudHandoffOffer(null)} className=\"rounded-xl p-2 text-slate-400 hover:bg-white hover:text-slate-700\" aria-label=\"Đóng\">×</button>\n              </div>\n            </div>\n\n            <div className=\"p-5 md:p-6 overflow-y-auto custom-scroll\">\n              <div className=\"rounded-2xl border border-slate-200 overflow-hidden\">\n                <div className=\"grid grid-cols-[1.4fr_.9fr_.75fr] gap-2 bg-slate-50 border-b border-slate-200 px-4 py-2.5 text-[10px] font-black uppercase text-slate-500\">\n                  <div>Loại data</div><div>Tài khoản / Thời gian</div><div className=\"text-right\">Số dòng</div>\n                </div>\n                <div className=\"divide-y divide-slate-100\">\n                  {cloudHandoffOffer.entries.map((entry) => (\n                    <div key={String(entry.slot)} className=\"grid grid-cols-[1.4fr_.9fr_.75fr] gap-2 px-4 py-3 text-xs items-center\">\n                      <div className=\"font-extrabold text-slate-800\">{entry.label}</div>\n                      <div className=\"min-w-0\">\n                        <div className=\"font-semibold text-slate-600 truncate\" title={entry.updatedByEmail}>{entry.updatedByEmail || 'Google'}</div>\n                        <div className=\"text-[10px] text-slate-400 mt-0.5\">{formatCloudTime(entry.updatedAt)}</div>\n                      </div>\n                      <div className=\"text-right font-black text-slate-900\">{entry.rowCount.toLocaleString('vi-VN')} dòng</div>\n                    </div>\n                  ))}\n                </div>\n              </div>\n\n              {cloudHandoffOffer.entries.length < DAILY_DATA_SLOTS.length && (\n                <div className=\"mt-4 rounded-2xl bg-slate-50 border border-slate-200 px-4 py-3 text-xs leading-5 text-slate-700\">\n                  <b>Chưa có trên Cloud ({DAILY_DATA_SLOTS.length - cloudHandoffOffer.entries.length} nhóm):</b>{' '}\n                  {DAILY_DATA_SLOTS\n                    .filter(slot => !cloudHandoffOffer.entries.some(entry => entry.slot === slot))\n                    .map(slot => DAILY_DATA_LABELS[String(slot)] || String(slot))\n                    .join(', ')}.\n                </div>\n              )}\n\n              <div className=\"mt-4 rounded-2xl bg-amber-50 border border-amber-200 px-4 py-3 text-xs leading-5 text-amber-800\">\n                <b>An toàn dữ liệu:</b> Khi nhận, hệ thống sẽ backup phiên local hiện tại rồi <b>thay toàn bộ data vận hành</b> bằng snapshot Cloud của hôm nay. Nhóm Cloud chưa có sẽ để trống, không lấy data cũ trên máy để bù vào.\n              </div>\n            </div>\n\n            <div className=\"p-4 md:p-5 bg-slate-50 border-t border-slate-200 flex flex-col-reverse sm:flex-row sm:justify-end gap-2.5\">\n              <button type=\"button\" onClick={() => setCloudHandoffOffer(null)} className=\"px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-bold hover:bg-slate-50\">\n                Bỏ qua – Tôi sẽ nhập data mới\n              </button>\n              <button type=\"button\" onClick={handleAcceptCloudHandoff} className=\"px-4 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-sm font-black shadow-lg shadow-sky-600/20\">\n                ☁️ Nhận & thay phiên hiện tại\n              </button>\n            </div>\n          </div>\n        </div>\n      )}\n\n      <ClearSessionModal\n        isOpen={isClearModalOpen}\n        onClose={() => setIsClearModalOpen(false)}\n        appData={appData}\n        onConfirmClear={handleConfirmClear}\n      />\n\n      <ProgramDetailModal\n        isOpen={drilldownModal.isOpen}\n        onClose={() => setDrilldownModal(prev => ({ ...prev, isOpen: false }))}\n        storeKey={drilldownModal.storeKey}\n        programCode={drilldownModal.programCode}\n        programName={drilldownModal.programName}\n        appData={operationalAppData}\n        personnelConfig={personnelConfig}\n        onUpdatePersonnelConfig={updatePersonnelConfig}\n        onSaveScreenshot={(item) => setScreenshots(prev => [item, ...prev])}\n      />\n\n      <Drawers\n        activeDrawer={activeDrawer}\n        onClose={() => setActiveDrawer(null)}\n        appData={operationalAppData}\n        lastImportAt={lastImportAt}\n        dailySnapshots={dailySnapshots}\n        screenshots={screenshots}\n        onOpenClearModal={() => setIsClearModalOpen(true)}\n        onExportSession={handleExportSession}\n        onImportSession={handleImportSession}\n        onDownloadAutoBackup={handleDownloadAutoBackup}\n        onRestoreLatestAutoBackup={handleRestoreLatestAutoBackup}\n        themeFont={themeFont}\n        onChangeThemeFont={setThemeFont}\n      />\n\n      <ImageExportModal\n        isOpen={!!exportedImage}\n        onClose={() => setExportedImage(null)}\n        imageResult={exportedImage}\n      />\n    </div>\n  );\n}\n","src/components/ClearSessionModal.tsx":"import React, { useState } from 'react';\nimport { Trash2, X, Database, FileSpreadsheet, Users, Trophy, Store } from 'lucide-react';\nimport { AppDataState } from '../types';\n\ninterface ClearSessionModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  appData: AppDataState;\n  onConfirmClear: (options: {\n    resetPersonnel: boolean;\n    clearScreenshots: boolean;\n  }) => void;\n}\n\nexport const ClearSessionModal: React.FC<ClearSessionModalProps> = ({\n  isOpen,\n  onClose,\n  appData,\n  onConfirmClear,\n}) => {\n  const [resetPersonnel, setResetPersonnel] = useState<boolean>(false);\n  const [clearScreenshots, setClearScreenshots] = useState<boolean>(false);\n\n  if (!isOpen) return null;\n\n  const countDtSt = (appData.dt_luyke?.length || 0) + (appData.dt_realtime?.length || 0);\n  const countTdSt = (appData.td_luyke?.length || 0) + (appData.td_realtime?.length || 0);\n  const countDtNv = (appData.dt_nv_luyke?.length || 0) + (appData.dt_nv_realtime?.length || 0);\n  const countTdNv = (appData.nv_tgdd?.length || 0) + (appData.nv_tz?.length || 0);\n  const totalRecords = countDtSt + countTdSt + countDtNv + countTdNv;\n\n  const handleExecute = () => {\n    onConfirmClear({\n      resetPersonnel,\n      clearScreenshots,\n    });\n    onClose();\n  };\n\n  return (\n    <div className=\"fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-in fade-in duration-200\">\n      <div\n        className=\"bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200\"\n        role=\"dialog\"\n        aria-modal=\"true\"\n      >\n        {}\n        <div className=\"bg-rose-50/70 border-b border-rose-100 p-5 flex items-start justify-between\">\n          <div className=\"flex items-center space-x-3\">\n            <div className=\"w-10 h-10 rounded-2xl bg-rose-600 flex items-center justify-center text-white shadow-md shadow-rose-500/20 flex-shrink-0\">\n              <Trash2 className=\"w-5 h-5\" />\n            </div>\n            <div>\n              <h3 className=\"font-extrabold text-slate-900 text-base\">\n                Xóa Dữ Liệu Đang Lưu Trong Phiên\n              </h3>\n              <p className=\"text-xs text-rose-700 font-medium\">\n                Dọn dữ liệu của phiên hiện tại để bắt đầu phiên làm việc mới\n              </p>\n            </div>\n          </div>\n          <button\n            onClick={onClose}\n            className=\"p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-xl transition cursor-pointer\"\n            aria-label=\"Đóng\"\n          >\n            <X className=\"w-5 h-5\" />\n          </button>\n        </div>\n\n        {}\n        <div className=\"p-5 space-y-5\">\n          {}\n          <div className=\"bg-slate-50 border border-slate-200 rounded-2xl p-3.5 space-y-2.5\">\n            <div className=\"flex items-center justify-between text-xs\">\n              <span className=\"font-bold text-slate-700 flex items-center gap-1.5\">\n                <Database className=\"w-3.5 h-3.5 text-blue-600\" />\n                Dữ liệu hiện đang lưu trong phiên:\n              </span>\n              <span className=\"font-extrabold text-blue-700 bg-blue-50 px-2 py-0.5 rounded-md border border-blue-200\">\n                {totalRecords} dòng bản ghi\n              </span>\n            </div>\n\n            <div className=\"grid grid-cols-2 gap-2 text-[11px]\">\n              <div className=\"flex items-center justify-between p-2 rounded-xl bg-white border border-slate-200/80\">\n                <span className=\"text-slate-600 flex items-center gap-1\">\n                  <Store className=\"w-3 h-3 text-slate-400\" />\n                  DT Siêu thị:\n                </span>\n                <span className=\"font-bold text-slate-900\">{countDtSt} dòng</span>\n              </div>\n              <div className=\"flex items-center justify-between p-2 rounded-xl bg-white border border-slate-200/80\">\n                <span className=\"text-slate-600 flex items-center gap-1\">\n                  <Trophy className=\"w-3 h-3 text-slate-400\" />\n                  Thi đua ST:\n                </span>\n                <span className=\"font-bold text-slate-900\">{countTdSt} dòng</span>\n              </div>\n              <div className=\"flex items-center justify-between p-2 rounded-xl bg-white border border-slate-200/80\">\n                <span className=\"text-slate-600 flex items-center gap-1\">\n                  <Users className=\"w-3 h-3 text-slate-400\" />\n                  DT Nhân viên:\n                </span>\n                <span className=\"font-bold text-slate-900\">{countDtNv} dòng</span>\n              </div>\n              <div className=\"flex items-center justify-between p-2 rounded-xl bg-white border border-slate-200/80\">\n                <span className=\"text-slate-600 flex items-center gap-1\">\n                  <FileSpreadsheet className=\"w-3 h-3 text-slate-400\" />\n                  Thi đua NV:\n                </span>\n                <span className=\"font-bold text-slate-900\">{countTdNv} dòng</span>\n              </div>\n            </div>\n          </div>\n\n          {}\n          <div className=\"space-y-2.5\">\n            <label className=\"text-xs font-bold text-slate-800 block\">\n              Chọn phương thức dọn dẹp:\n            </label>\n\n            {}\n            <div className=\"p-3.5 rounded-2xl border-2 border-rose-500 bg-rose-50/40 shadow-xs flex items-start space-x-3\">\n              <div className=\"w-4 h-4 rounded-full bg-rose-600 mt-0.5 flex-shrink-0\" />\n              <div className=\"flex-1\">\n                <div className=\"flex items-center justify-between\">\n                  <span className=\"font-extrabold text-xs text-rose-900\">\n                    Xóa trắng toàn bộ dữ liệu (Về 0 bản ghi)\n                  </span>\n                  <span className=\"text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700\">\n                    Khuyên dùng khi nạp ngày mới\n                  </span>\n                </div>\n                <p className=\"text-[11px] text-slate-500 mt-1 leading-relaxed\">\n                  Xóa các bảng Doanh thu, Thi đua và Nhân viên của phiên hiện tại về rỗng. Bản sao lưu an toàn và lịch sử tiến độ vẫn được giữ để có thể khôi phục khi cần.\n                </p>\n              </div>\n            </div>\n          </div>\n\n          {}\n          <div className=\"space-y-2 pt-2 border-t border-slate-100 text-xs\">\n            <label className=\"flex items-center space-x-2.5 cursor-pointer select-none text-slate-700 font-medium\">\n              <input\n                type=\"checkbox\"\n                checked={resetPersonnel}\n                onChange={(e) => setResetPersonnel(e.target.checked)}\n                className=\"w-4 h-4 rounded text-rose-600 accent-rose-600 cursor-pointer\"\n              />\n              <span>Đặt lại cấu hình nhân viên (Ẩn/Hiện và % KPI) về mặc định</span>\n            </label>\n\n            <label className=\"flex items-center space-x-2.5 cursor-pointer select-none text-slate-700 font-medium\">\n              <input\n                type=\"checkbox\"\n                checked={clearScreenshots}\n                onChange={(e) => setClearScreenshots(e.target.checked)}\n                className=\"w-4 h-4 rounded text-rose-600 accent-rose-600 cursor-pointer\"\n              />\n              <span>Xóa toàn bộ kho ảnh báo cáo đã xuất trong phiên</span>\n            </label>\n          </div>\n        </div>\n\n        {}\n        <div className=\"p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-3\">\n          <button\n            type=\"button\"\n            onClick={onClose}\n            className=\"px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 font-bold text-xs rounded-xl transition cursor-pointer\"\n          >\n            Hủy bỏ\n          </button>\n\n          <button\n            type=\"button\"\n            onClick={handleExecute}\n            className=\"px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow-xs transition flex items-center gap-2 cursor-pointer\"\n          >\n            <Trash2 className=\"w-4 h-4\" />\n            <span>Xác nhận Xóa Trắng Data</span>\n          </button>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/components/Drawers.tsx":"import React, { useState } from 'react';\nimport { X, RefreshCw, Copy, Download, Palette, Bot, History, Trash2, Save } from 'lucide-react';\nimport { ScreenshotItem } from '../types';\nimport { getStretchGoalPct } from '../utils/stretchGoal';\nimport { readAiFocusPrograms } from '../utils/aiFocusPrograms';\n\nexport type DrawerType = 'danh-gia-ai' | 'quan-ly-phien' | 'giao-dien' | 'tai-xuong' | null;\n\ninterface DrawersProps {\n  activeDrawer: DrawerType | string | null;\n  onClose: () => void;\n  screenshots?: ScreenshotItem[];\n  onOpenClearModal?: () => void;\n  onExportSession?: () => void;\n  onImportSession?: (file: File) => void;\n  onDownloadAutoBackup?: () => void;\n  onRestoreLatestAutoBackup?: () => void;\n  themeFont?: string;\n  onChangeThemeFont?: (font: string) => void;\n  appData?: any;\n  lastImportAt?: string | null;\n  dailySnapshots?: any[];\n}\n\nexport const Drawers: React.FC<DrawersProps> = ({\n  activeDrawer,\n  onClose,\n  screenshots = [],\n  onOpenClearModal,\n  onExportSession,\n  onImportSession,\n  onDownloadAutoBackup,\n  onRestoreLatestAutoBackup,\n  themeFont = \"'Be Vietnam Pro', sans-serif\",\n  onChangeThemeFont,\n  appData,\n  lastImportAt = null,\n  dailySnapshots = [],\n}) => {\n  const [aiStore, setAiStore] = useState<'10341' | '933' | 'CUM'>('10341');\n  const [aiMode, setAiMode] = useState<'suctich' | 'chitiet'>('suctich');\n  const [copiedAi, setCopiedAi] = useState<boolean>(false);\n\n  if (!activeDrawer || activeDrawer === 'NONE') return null;\n\n  const getAiAnalysis = () => {\n    const stretchGoalPct = getStretchGoalPct();\n    const lkRevenueAll = appData?.dt_luyke || [];\n    const rtRevenueAll = appData?.dt_realtime || [];\n    const lkProgramsAll = appData?.td_luyke || [];\n    const rtProgramsAll = appData?.td_realtime || [];\n\n    const normalize = (v: any) => String(v ?? '')\n      .trim()\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g, '')\n      .replace(/đ/g, 'd')\n      .toLowerCase();\n    const num = (v: any) => {\n      if (v == null || String(v).trim() === '') return 0;\n      const raw = String(v).trim().replace(/%/g, '').replace(/\\s/g, '');\n      const normalized = raw.includes(',') && !raw.includes('.')\n        ? raw.replace(',', '.')\n        : raw.replace(/,/g, '');\n      const n = Number(normalized);\n      return Number.isFinite(n) ? n : 0;\n    };\n    const clamp = (n: number, min: number, max: number) => Math.max(min, Math.min(max, n));\n    const fmtTr = (n: number) => `${n.toLocaleString('vi-VN', { maximumFractionDigits: 1 })} Tr`;\n    const fmtPct = (n: number) => `${n.toLocaleString('vi-VN', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%`;\n    const storeOf = (r: any) => {\n      const direct = String(r?.['MÃ ĐƠN VỊ'] || '').trim();\n      if (direct === '933' || direct === '10341') return direct;\n      const text = normalize(r?.['ĐƠN VỊ / NHÂN VIÊN'] || r?.['TÊN ĐƠN VỊ'] || r?.['SIÊU THỊ'] || direct);\n      if (/10341|aar|topzone/.test(text)) return '10341';\n      if (/(^|\\D)933(\\D|$)|tgd/.test(text)) return '933';\n      return '';\n    };\n    const storeName = (code: string) => code === '10341' ? 'TopZone' : code === '933' ? 'TGDĐ' : 'Cụm';\n    const inSelectedStore = (r: any) => aiStore === 'CUM' ? ['933','10341'].includes(storeOf(r)) : storeOf(r) === aiStore;\n    const programKey = (r: any) => {\n      const code = String(r?.['MÃ CHƯƠNG TRÌNH'] || '').trim();\n      return code ? `code:${code}` : `name:${normalize(r?.['CHƯƠNG TRÌNH'])}`;\n    };\n    const sameProgram = (a: any, b: any) => storeOf(a) === storeOf(b) && programKey(a) === programKey(b);\n\n    const vnParts = (date: Date) => {\n      const parts = new Intl.DateTimeFormat('en-CA', {\n        timeZone: 'Asia/Ho_Chi_Minh', year: 'numeric', month: '2-digit', day: '2-digit',\n        hour: '2-digit', minute: '2-digit', hourCycle: 'h23',\n      }).formatToParts(date);\n      const part = (type: string) => parts.find(p => p.type === type)?.value || '';\n      return {\n        year: Number(part('year')), month: Number(part('month')), day: Number(part('day')),\n        hour: Number(part('hour')), minute: Number(part('minute')),\n      };\n    };\n    const importedAt = lastImportAt && Number.isFinite(Date.parse(lastImportAt)) ? new Date(lastImportAt) : null;\n    const analysisAt = importedAt || new Date();\n    const at = vnParts(analysisAt);\n    const nowParts = vnParts(new Date());\n    const totalDays = new Date(Date.UTC(at.year, at.month, 0)).getUTCDate();\n    const analysisAtLabel = importedAt\n      ? `${String(at.hour).padStart(2,'0')}:${String(at.minute).padStart(2,'0')} · ${String(at.day).padStart(2,'0')}/${String(at.month).padStart(2,'0')}/${at.year}`\n      : 'chưa ghi nhận thời điểm nạp data';\n    const importDayUtc = Date.UTC(at.year, at.month - 1, at.day);\n    const nowDayUtc = Date.UTC(nowParts.year, nowParts.month - 1, nowParts.day);\n    const staleDays = importedAt ? Math.max(0, Math.floor((nowDayUtc - importDayUtc) / 86400000)) : 0;\n\n    const lkRevenue = lkRevenueAll.filter(inSelectedStore);\n    const rtRevenue = rtRevenueAll.filter(inSelectedStore);\n    const windowDays = lkRevenue\n      .map((r: any) => num(r['SỐ NGÀY CỬA SỔ']))\n      .filter((n: number) => n >= 1 && n <= totalDays);\n    const inferredClosedDay = clamp(at.day - 1, 1, totalDays);\n    const closedDays = windowDays.length ? clamp(Math.max(...windowDays), 1, totalDays) : inferredClosedDay;\n\n    const sum = (rows: any[], key: string) => rows.reduce((t, r) => t + num(r[key]), 0);\n    const revenueTarget = sum(rtRevenue, 'TARGET QĐ (TR)') || sum(rtRevenue, 'TARGET (TR)') || sum(lkRevenue, 'TARGET QĐ (TR)') || sum(lkRevenue, 'TARGET (TR)');\n    const revenueLk = sum(lkRevenue, 'DOANH THU QĐ (TR)');\n    const revenueRt = sum(rtRevenue, 'DOANH THU QĐ (TR)');\n    const revenueNow = revenueLk + revenueRt;\n    const hasRealtime = rtRevenue.length > 0 || rtProgramsAll.some(inSelectedStore);\n    const currentDataDay = clamp(closedDays + (hasRealtime && closedDays < totalDays ? 1 : 0), 1, totalDays);\n    const remainingDays = Math.max(1, totalDays - closedDays);\n    const timePct = closedDays / totalDays * 100;\n    const stretchTarget = revenueTarget * stretchGoalPct / 100;\n    const revenuePct = revenueTarget > 0 ? revenueNow / revenueTarget * 100 : 0;\n    const stretchPct = stretchTarget > 0 ? revenueNow / stretchTarget * 100 : 0;\n    const revenueRunRate = closedDays > 0 ? revenueLk / closedDays : 0;\n    const baselineForecast = revenueRunRate * totalDays;\n    const forecastVsStretch = stretchTarget > 0 ? baselineForecast / stretchTarget * 100 : 0;\n    const stretchGap = Math.max(0, stretchTarget - revenueNow);\n    const requiredRevenuePerDay = stretchGap / remainingDays;\n    const revenueEffort = revenueRunRate > 0 ? requiredRevenuePerDay / revenueRunRate : Number.POSITIVE_INFINITY;\n\n    const monthPhase = timePct < 35\n      ? 'ĐẦU THÁNG'\n      : timePct < 70\n      ? 'GIỮA THÁNG'\n      : timePct < 90\n      ? 'CUỐI THÁNG'\n      : 'GIAI ĐOẠN VỀ ĐÍCH';\n\n    const revenueDecision = stretchTarget <= 0\n      ? 'Chưa đủ Target doanh thu để ra quyết định.'\n      : stretchGap <= 0\n      ? 'Đã chạm mục tiêu Stretch; ưu tiên giữ nhịp và bảo vệ các môn còn rủi ro.'\n      : revenueEffort <= 1\n      ? 'Nhịp lịch sử đủ để bám Stretch; không cần dàn lực, tập trung khóa các môn có khả năng về đích.'\n      : revenueEffort <= 1.25\n      ? 'Cần tăng nhịp nhẹ so với bình quân lũy kế; ưu tiên các cơ hội gần đích và có xu hướng tốt.'\n      : revenueEffort <= 1.6\n      ? 'Nhịp cần tăng khá mạnh; phải chọn ít môn có xác suất chốt cao thay vì cứu đồng loạt.'\n      : 'Khoảng cách Stretch đang lớn so với nhịp lịch sử; chỉ dồn lực vào các cơ hội thực tế, các môn quá xa đích chuyển sang theo dõi/nguyên nhân.';\n\n    const selectedLkProgramRows = lkProgramsAll.filter(inSelectedStore);\n    const untargetedCount = selectedLkProgramRows.filter((r: any) => num(r['TARGET (TR/SL theo LOẠI TĐ)']) <= 0).length;\n    const targetedMap = new Map<string, any>();\n    selectedLkProgramRows.forEach((r: any) => {\n      const target = num(r['TARGET (TR/SL theo LOẠI TĐ)']);\n      if (target <= 0) return;\n      const key = `${storeOf(r)}|${programKey(r)}`;\n      targetedMap.set(key, r);\n    });\n\n    const managerFocusPrograms: string[] = readAiFocusPrograms();\n    const managerFocusKeys = new Set(managerFocusPrograms.map(normalize));\n\n    const monthPrefix = `${at.year}-${String(at.month).padStart(2,'0')}`;\n    const monthSnapshots = (Array.isArray(dailySnapshots) ? dailySnapshots : [])\n      .filter((s: any) => String(s?.date || '').startsWith(monthPrefix))\n      .sort((a: any, b: any) => String(a.date).localeCompare(String(b.date)));\n    const trendFor = (storeCode: string, id: string) => {\n      const points = monthSnapshots.map((snap: any) => {\n        const found = (Array.isArray(snap?.programs) ? snap.programs : []).find((p: any) =>\n          String(p?.storeCode || '') === storeCode && String(p?.id || '') === id && num(p?.target) > 0 && Number.isFinite(Number(p?.pct))\n        );\n        return found ? { date: String(snap.date), pct: Number(found.pct) } : null;\n      }).filter(Boolean) as { date: string; pct: number }[];\n      if (points.length < 2) return { kind: 'unknown', label: 'chưa đủ lịch sử xu hướng', rate: null as number | null, delta: null as number | null };\n      const recent = points.slice(-3);\n      const first = recent[0];\n      const last = recent[recent.length - 1];\n      const dayDiff = Math.max(1, Math.round((Date.parse(last.date + 'T00:00:00Z') - Date.parse(first.date + 'T00:00:00Z')) / 86400000));\n      const delta = last.pct - first.pct;\n      const rate = delta / dayDiff;\n      const expected = 100 / Math.max(1, totalDays);\n      if (delta < -0.5) return { kind: 'down', label: `giảm ${fmtPct(Math.abs(delta))} trong ${dayDiff} ngày`, rate, delta };\n      if (rate >= expected * 1.2) return { kind: 'up', label: `đang tăng tốc +${fmtPct(delta)} / ${dayDiff} ngày`, rate, delta };\n      if (rate <= expected * 0.5) return { kind: 'slow', label: `đang mất nhịp (+${fmtPct(Math.max(0, delta))} / ${dayDiff} ngày)` s, paceGap };\n    });\n\n    const revenueTargets = rawPrograms.filter((p: any) => !p.isQty).map((p: any) => p.target);\n    const qtyTargets = rawPrograms.filter((p: any) => p.isQty).map((p: any) => p.target);\n    const maxRevenueTarget = Math.max(1, ...revenueTargets);\n    const maxQtyTarget = Math.max(1, ...qtyTargets);\n    const phaseLate = timePct >= 70;\n    const phaseFinal = timePct >= 90;\n\n    const programs = rawPrograms.map((p: any) => {\n      const closeness = clamp(p.pctNow / 100, 0, 1);\n      const forecastScore = clamp(p.forecastPct / 100, 0, 1);\n      const effortScore = !Number.isFinite(p.effort) ? 0 : p.effort <= 1 ? 1 : p.effort <= 1.25 ? .88 : p.effort <= 1.6 ? .7 : p.effort <= 2.2 ? .5 : p.effort <= 3 ? .25 : .05;\n      const trendScore = p.trend.kind === 'up' ? 1 : p.trend.kind === 'steady' ? .7 : p.trend.kind === 'unknown' ? .5 : p.trend.kind === 'slow' ? .3 : .15;\n      const impact = clamp(p.target / (p.isQty ? maxQtyTarget : maxRevenueTarget), 0, 1);\n      const score = p.focus ? 1000 : phaseLate\n        ? closeness * 38 + effortScore * 28 + forecastScore * 16 + trendScore * 10 + impact * 8\n        : timePct >= 35\n        ? closeness * 28 + effortScore * 26 + forecastScore * 20 + trendScore * 14 + impact * 12\n        : closeness * 20 + effortScore * 22 + forecastScore * 20 + trendScore * 18 + impact * 20;\n      const phaseFloor = phaseFinal ? 72 : phaseLate ? 60 : timePct >= 35 ? 40 : 15;\n      const effortCeiling = phaseFinal ? 1.9 : phaseLate ? 2.2 : timePct >= 35 ? 2.8 : 3.5;\n      const forecastFloor = phaseFinal ? 82 : phaseLate ? 72 : timePct >= 35 ? 60 : 45;\n      const actionable = p.pctNow < 100 && (p.focus || (p.pctNow >= phaseFloor && p.forecastPct >= forecastFloor && p.effort <= effortCeiling));\n      const severeBehind = p.pctNow < Math.max(10, timePct - (phaseLate ? 25 : 30));\n      const deprioritized = p.pctNow < 100 && !p.focus && !actionable && (severeBehind || !Number.isFinite(p.effort) || p.effort > effortCeiling * 1.25);\n      const risk = p.pctNow < 100 && p.paceGap < -(phaseLate ? 12 : 18) && (p.trend.kind === 'slow' || p.trend.kind === 'down');\n      return { ...p, score, actionable, deprioritized, risk };\n    }).sort((a: any, b: any) => b.score - a.score);\n\n    const actionablePrograms = programs.filter((p: any) => p.actionable).slice(0, 4);\n    const riskPrograms = programs.filter((p: any) => p.risk && !actionablePrograms.some((a: any) => a.id === p.id && a.storeCode === p.storeCode)).slice(0, 3);\n    const deprioritizedPrograms = programs.filter((p: any) => p.deprioritized).slice(0, 4);\n    const maintainingPrograms = programs.filter((p: any) => p.pctNow >= 100 || (p.pctNow >= timePct - 5 && p.trend.kind !== 'down' && p.trend.kind !== 'slow')).slice(0, 4);\n    const acceleratingPrograms = programs.filter((p: any) => p.trend.kind === 'up' && p.pctNow < 100).slice(0, 3);\n\n    const fmtProgramValue = (p: any, n: number) => p.isQty ? `${Math.ceil(n).toLocaleString('vi-VN')} món` : fmtTr(n);\n    const programTitle = (p: any) => `${aiStore === 'CUM' ? `[${p.storeLabel}] ` : ''}${p.rawName}`;\n    const whyAction = (p: any) => {\n      if (p.focus) return 'Manager đã chọn tập trung và môn có Target hợp lệ';\n      if (p.pctNow >= 90) return 'rất gần 100%, khoảng cách chốt nhỏ';\n      if (p.trend.kind === 'up' && p.effort <= 1.6) return 'đang tăng tốc và mức tăng nhịp cần thiết còn thực tế';\n      if (p.effort <= 1.25) return 'nhịp cần tăng thấp so với bình quân đã chạy';\n      if (p.forecastPct >= 90) return 'forecast đang sát đích, đáng ưu tiên khóa kết quả';\n      return 'còn khả năng về đích trong thời gian còn lại';\n    };\n    const actionText = (p: any) => `• ${programTitle(p)} — ${fmtPct(p.pctNow)} | Target ${fmtProgramValue(p, p.target)} | còn ${fmtProgramValue(p, p.gap)} | cần TB ${fmtProgramValue(p, p.requiredDaily)}/ngày | ${p.trend.label} → ${whyAction(p)}.`;\n    const watchText = (p: any) => `• ${programTitle(p)} — ${fmtPct(p.pctNow)} | còn ${fmtProgramValue(p, p.gap)} | ${p.trend.label}${Number.isFinite(p.effort) ? ` | cần ${p.effort.toFixed(1)}× nhịp lịch sử` : ' | chưa có nhịp nền đủ tin cậy'} → chưa nên dàn lực lúc này.`;\n    const riskText = (p: any) => `• ${programTitle(p)} — chậm ${fmtPct(Math.abs(p.paceGap))} so với tiến độ kỳ chốt; ${p.trend.label}.`;\n    const maintainText = (p: any) => `• ${programTitle(p)} — ${fmtPct(p.pctNow)} | ${p.trend.label}.`;\n\n    const status = stretchGap <= 0\n      ? 'ĐÃ CHẠM STRETCH'\n      : revenueEffort <= 1\n      ? 'ĐANG BÁM NHỊP'\n      : revenueEffort <= 1.25\n      ? 'CẦN TĂNG NHẸ'\n      : revenueEffort <= 1.6\n      ? 'CẦN TĂNG TỐC CÓ CHỌN LỌC'\n      : 'ÁP LỰC CAO — KHÔNG DÀN LỰC';\n\n    const storeMetrics = (code: string) => {\n      const lk = lkRevenueAll.filter((r: any) => storeOf(r) === code);\n      const rt = rtRevenueAll.filter((r: any) => storeOf(r) === code);\n      const target = sum(lk, 'TARGET QĐ (TR)') || sum(lk, 'TARGET (TR)');\n      const lkActual = sum(lk, 'DOANH THU QĐ (TR)');\n      const rtActual = sum(rt, 'DOANH THU QĐ (TR)');\n      const actual = lkActual + rtActual;\n      const stretch = target * stretchGoalPct / 100;\n      const gap = Math.max(0, stretch - actual);\n      const run = closedDays > 0 ? lkActual / closedDays : 0;\n      const need = gap / remainingDays;\n      return { code, name: storeName(code), target, actual, stretch, gap, run, need, pct: target > 0 ? actual / target * 100 : 0, stretchPct: stretch > 0 ? actual / stretch * 100 : 0 };\n    };\n    const comparison = aiStore === 'CUM' ? (() => {\n      const a = storeMetrics('933');\n      const b = storeMetrics('10341');\n      return `\\n\\n🏪 2 SHOP\\n• ${a.name}: ${fmtPct(a.pct)} Target gốc | ${fmtPct(a.stretchPct)} Stretch | còn ${fmtTr(a.gap)} | cần ${fmtTr(a.need)}/ngày.\\n• ${b.name}: ${fmtPct(b.pct)} Target gốc | ${fmtPct(b.stretchPct)} Stretch | còn ${fmtTr(b.gap)} | cần ${fmtTr(b.need)}/ngày.`;\n    })() : '';\n\n    const priorityBlock = actionablePrograms.length\n      ? actionablePrograms.map(actionText).join('\\n')\n      : '• Chưa có môn nào đủ điều kiện để dồn lực theo Target + khoảng cách + nhịp cần + forecast. Ưu tiên kiểm tra nguyên nhân thay vì ép danh sách dài.';\n    const riskBlock = riskPrograms.length ? riskPrograms.map(riskText).join('\\n') : '• Chưa phát hiện môn có lịch sử giảm/mất nhịp đủ rõ để cảnh báo.';\n    const watchBlock = deprioritizedPrograms.length ? deprioritizedPrograms.map(watchText).join('\\n') : '• Không có môn nào cần hạ ưu tiên rõ rệt ở thời điểm này.';\n    const maintainBlock = maintainingPrograms.length ? maintainingPrograms.map(maintainText).join('\\n') : '• Chưa có môn đủ dữ liệu để xếp nhóm giữ nhịp.';\n    const accelBlock = acceleratingPrograms.length ? acceleratingPrograms.map(maintainText).join('\\n') : '• Chưa đủ lịch sử để xác nhận môn nào đang tăng tốc.';\n\n    const staleWarning = staleDays > 0 ? `\\n⚠ Data gần nhất đã cách hiện tại ${staleDays} ngày; quyết định bên dưới bám theo mốc data này, không giả định số mới hơn.` : '';\n    const dataContext = `Mốc data: ${analysisAtLabel} | Lũy kế ${closedDays}/${totalDays} ngày | ${hasRealtime ? 'có Realtime đang cộng vào số hiện tại' : 'chưa có Realtime'}${staleWarning}`;\n\n    const summary = `*AI ĐIỀU HÀNH 3.0 – ${aiStore === 'CUM' ? 'TỔNG CỤM 933' : storeName(aiStore)}*\\n` +\n      `⏱ ${dataContext}\\n` +\n      `📍 Giai đoạn: ${monthPhase} · kỳ chốt ${fmtPct(timePct)}\\n` +\n      `💰 Hiện tại: ${fmtTr(revenueNow)} / Target ${fmtTr(revenueTarget)} · ${fmtPct(revenuePct)}\\n` +\n      `🎯 Stretch ${stretchGoalPct}%: còn ${fmtTr(stretchGap)} · cần TB ${fmtTr(requiredRevenuePerDay)}/ngày\\n` +\n      `🧭 ${status}: ${revenueDecision}\\n\\n` +\n      `🔥 LÀM NGAY — chỉ chọn môn có Target\\n${priorityBlock}\\n\\n` +\n      `👀 CẦN CHẶN RỦI RO\\n${riskBlock}\\n\\n` +\n      `ℹ️ AI đang phân tích ${programs.length} môn có Target > 0; đã bỏ qua ${untargetedCount} dòng/môn không có Target.` +\n      compariso t nhất 2 snapshot lịch sử trong tháng; thiếu lịch sử sẽ ghi rõ “chưa đủ lịch sử”.\\n` +\n      `• Realtime được cộng vào số hiện tại nhưng không bị nội suy theo giờ để tránh dự báo giả.` +\n      comparison;\n\n    return { summary, detail };\n  };\n  const aiReport = getAiAnalysis();\n\n  const handleCopyAi = () => {\n    const text = aiMode === 'suctich' ? aiReport.summary : aiReport.detail;\n    navigator.clipboard.writeText(text).then(() => {\n      setCopiedAi(true);\n      setTimeout(() => setCopiedAi(false), 2000);\n    });\n  };\n\n  const handleDownloadAll = () => {\n    screenshots.forEach((item, idx) => {\n      setTimeout(() => {\n        const a = document.createElement('a');\n        a.href = item.url;\n        a.download = item.name;\n        a.click();\n      }, idx * 400);\n    });\n  };\n\n  return (\n    <>\n      <div\n        onClick={onClose}\n        className=\"fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 transition-opacity\"\n      />\n\n      <aside className=\"fixed right-0 top-0 bottom-0 w-[520px] max-w-full bg-white border-l border-slate-200 shadow-2xl z-50 flex flex-col animate-slideLeft\">\n        <div className=\"px-5 py-4 border-b border-slate-100 flex items-center justify-between\">\n          <div className=\"flex items-center space-x-2\">\n            {activeDrawer === 'danh-gia-ai' && <Bot className=\"w-4 h-4 text-emerald-600\" />}\n            {activeDrawer === 'quan-ly-phien' && <History className=\"w-4 h-4 text-slate-600\" />}\n            {activeDrawer === 'giao-dien' && <Palette className=\"w-4 h-4 text-purple-600\" />}\n            {activeDrawer === 'tai-xuong' && <Download className=\"w-4 h-4 text-blue-600\" />}\n            <h3 className=\"font-extrabold text-slate-900 text-sm uppercase tracking-wide\">\n                {activeDrawer === 'danh-gia-ai' && 'AI ĐIỀU HÀNH 3.0'}\n              {activeDrawer === 'quan-ly-phien' && 'QUẢN LÝ PHIÊN'}\n              {activeDrawer === 'giao-dien' && 'GIAO DIỆN & FONT CHỮ'}\n              {activeDrawer === 'tai-xuong' && 'TRUNG TÂM TẢI XUỐNG'}\n            </h3>\n          </div>\n          <button\n            onClick={onClose}\n            className=\"p-1.5 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition cursor-pointer\"\n          >\n            <X className=\"w-5 h-5\" />\n          </button>\n        </div>\n\n        <div className=\"p-5 flex-1 overflow-y-auto custom-scroll text-xs space-y-5\">\n          {activeDrawer === 'danh-gia-ai' && (\n            <div className=\"space-y-4\">\n              <div className=\"bg-emerald-50 border border-emerald-200 rounded-xl p-3\">\n                <div className=\"flex items-center justify-between gap-2\">\n                  <span className=\"font-black text-emerald-900\">🧠 AI ĐIỀU HÀNH 3.0</span>\n                  <span className=\"px-2 py-1 rounded-lg bg-white text-emerald-700 border border-emerald-200 font-black\">Stretch {getStretchGoalPct()}%</span>\n                </div>\n                <p className=\"text-[10px] text-emerald-700 mt-1\">Bám Target thật + thời điểm data + nhịp chạy + xu hướng. Môn không có Target được loại khỏi phân tích.</p>\n              </div>\n              <div>\n                <label className=\"block text-slate-500 font-medium mb-1\">Chọn siêu thị phân tích</label>\n                <select\n                  value={aiStore}\n                  onChange={(e) => setAiStore(e.target.value as any)}\n                  className=\"w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold text-slate-800\"\n                >\n                  <option value=\"10341\">AAR_DNA_HCH - 351 Nguyễn Hữu Thọ</option>\n                  <option value=\"933\">TGD_DNA_HCH - 351 Nguyễn Hữu Thọ</option>\n                  <option value=\"CUM\">TỔNG CỤM - 351 Nguyễn Hữu Thọ</option>\n                </select>\n              </div>\n\n              <div className=\"flex items-center justify-between\">\n                <div className=\"flex rounded-xl bg-slate-100 p-1 font-semibold flex-1 mr-2\">\n                  <button\n                    onClick={() => setAiMode('suctich')}\n                    className={`flex-1 py-1.5 rounded-lg transition font-bold ${\n                      aiMode === 'suctich' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600'\n                    }`}\n                  >\n                    Quyết định\n                  </button>\n                  <button\n                    onClick={() => setAiMode('chitiet')}\n                    className={`flex-1 py-1.5 rounded-lg transition font-bold ${\n                      aiMode === 'chitiet' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600'\n                    }`}\n                  >\n                    Chi tiết\n                  </button>\n                </div>\n                <button\n                  onClick={handleCopyAi}\n                  className=\"p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-600 transition cursor-pointer\"\n                  title=\"Sao chép nội dung\"\n                >\n                  <Copy className=\"w-4 h-4\" />\n                </button>\n              </div>\n\n              {copiedAi && (\n                <div className=\"py-1 px-2.5 bg-emerald-50 text-emerald-700 font-bold rounded-lg text-center text-[11px]\">\n                  ✓ Đã sao chép nội dung báo cáo AI!\n                </div>\n              )}\n\n              <div className=\"bg-slate-50 border border-slate-200 rounded-xl p-4 text-slate-800 text-[12px] leading-6 whitespace-pre-line select-text\">\n                {aiMode === 'suctich' ? aiReport.summary : aiReport.detail}\n              </div>\n            </div>\n          )}\n\n          {activeDrawer === 'giao-dien' && (\n            <div className=\"space-y-5\">\n              <div>\n                <label className=\"block font-bold text-slate-700 mb-1.5\">Kiểu chữ Báo cáo</label>\n                <select\n                  value={themeFont}\n                  onChange={(e) => onChangeThemeFont(e.target.value)}\n                  className=\"w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-semibold text-slate-800\"\n                >\n                  <option value=\"'Be Vietnam Pro', sans-serif\">Be Vietnam Pro (Khuyên dùng - Rõ nét)</option>\n                  <option value=\"'Plus Jakarta Sans', sans-serif\">Plus Jakarta Sans</option>\n                  <option value=\"'Inter', sans-serif\">Inter</option>\n                  <option value=\"'JetBrains Mono', monospace\">JetBrains Mono (Dạng số code)</option>\n                  <option value=\"Arial, sans-serif\">Arial chuẩn</option>\n                </select>\n              </div>\n\n            </div>\n          )}\n\n          {activeDrawer === 'tai-xuong' && (\n            <div className=\"space-y-4\">\n              <div className=\"bg-blue-50 border border-blue-200 rounded-xl p-3 text-[11px] text-blue-800 leading-relaxed\">\n                ℹ️ Toàn bộ ảnh báo cáo bạn đã xuất trong phiên làm việc. Bạn có thể bấm <b>Tải lại</b> hoặc tải toàn bộ.\n              </div>\n\n              <div className=\"flex items-center justify-between\">\n                <span className=\"px-3 py-1.5 rounded-lg bg-blue-600 text-white font-bold text-xs\">\n                  Tất cả ({screenshots.length} ảnh)\n                </span>\n                {screenshots.length > 0 && (\n                  <button\n                    onClick={handleDownloadAll}\n                    className=\"px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-xs transition cursor-pointer\"\n                  >\n                    Tải Tất Cả Ảnh\n                  </button>\n                )}\n              </div>\n\n              <div className=\"space-y-3 pt-2 max-h-[480px] overflow-y-auto custom-scroll\">\n                {screenshots.length === 0 ? (\n                  <div className=\"text-center py-10 text-slate-400 space-y-2 border-2 border-dashed border-slate-200 rounded-2xl\">\n                    <Download className=\"w-8 h-8 mx-auto text-slate-300\" />\n                    <p className=\"font-bold text-slate-600\">Chưa có ảnh nào được xuất</p>\n                    <p className=\"text-[11px]\">Bấm <b>Xuất Ảnh Tab</b> hoặc <b>Xuất ALL Báo Cáo</b> để tạo ảnh.</p>\n                  </div>\n                ) : (\n                  screenshots.map((item, idx) => (\n                    <div\n                      key={idx}\n                      className=\"p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between\"\n                    >\n                      <div className=\"flex items-center space-x-2.5 truncate pr-2\">\n                        <img\n                          src={item.url}\n                          alt={item.name}\n                          className=\"w-10 h-10 object-cover rounded-lg border border-slate-300\"\n                        />\n                        <div className=\"truncate\">\n                          <p className=\"font-bold text-slate-800 text-xs truncate\">{item.name}</p>\n                          <p className=\"text-[10px] text-slate-400\">Chụp lúc: {item.time}</p>\n                        </div>\n                      </div>\n                      <a\n                        href={item.url}\n                        download={item.name}\n                        className=\"px-2.5 py-1 bg-blue-600 text-white font-bold text-[11px] rounded-lg shadow-xs hover:bg-blue-700 whitespace-nowrap cursor-pointer\"\n                      >\n                        Tải lại\n                      </a>\n                    </div>\n                  ))\n                )}\n              </div>\n            </div>\n          )}\n\n          {activeDrawer === 'quan-ly-phien' && (\n            <div className=\"space-y-4\">\n              <p className=\"text-slate-600 leading-relaxed text-xs\">\n                Sao lưu dữ liệu đã nhập và cấu hình KPI nhân viên thành file JSON để tải về và khôi phục khi cần.\n              </p>\n\n              <div className=\"bg-emerald-50/70 border border-emerald-200 rounded-2xl p-3.5 space-y-2.5\">\n                <div className=\"flex items-center justify-between gap-2\">\n                  <div>\n                    <div className=\"font-extrabold text-emerald-900 text-xs\">💾 TỰ ĐỘNG SAO LƯU</div>\n                    <div className=\"text-[10px] text-emerald-700 mt-0.5\">Giữ tối đa 5 backup gần nhất. Tự dọn backup, lịch sử ngày và bản hoàn tác quá 31 ngày khi mở hoặc sử dụng trang; không xóa dữ liệu phiên hiện tại, cấu hình KPI hay file JSON đã tải về. Bản thiếu ngày hợp lệ được giữ lại.</div>\n                  </div>\n                  <span className=\"px-2 py-1 rounded-lg bg-emerald-100 text-emerald-800 font-black text-[10px]\">ĐANG BẬT</span>\n                </div>\n                <div className=\"grid grid-cols-2 gap-2\">\n                  <button type=\"button\" onClick={onRestoreLatestAutoBackup} className=\"py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition flex items-center justify-center gap-1.5 text-[11px]\">\n                    <RefreshCw className=\"w-3.5 h-3.5\" /> Khôi phục gần nhất\n                  </button>\n                  <button type=\"button\" onClick={onDownloadAutoBackup} className=\"py-2 bg-white hover:bg-emerald-50 text-emerald-800 font-bold rounded-xl border border-emerald-300 transition flex items-center justify-center gap-1.5 text-[11px]\">\n                    <Download className=\"w-3.5 h-3.5\" /> Tải backup gần nhất\n                  </button>\n                </div>\n              </div>\n\n              <button\n                onClick={onExportSession}\n                className=\"w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-xs transition flex items-center justify-center gap-2 cursor-pointer text-xs\"\n              >\n                <Save className=\"w-4 h-4\" />\n                <span>Sao lưu & Tải file phiên làm việc (.json)</span>\n              </button>\n\n              <label className=\"w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl border border-slate-300 transition flex items-center justify-center gap-2 cursor-pointer text-xs\">\n                <History className=\"w-4 h-4\" />\n                <span>Khôi phục từ file JSON đã lưu</span>\n                <input\n                  type=\"file\"\n                  accept=\".json\"\n                  className=\"hidden\"\n                  onChange={(e) => {\n                    const f = e.target.files?.[0];\n                    if (f && onImportSession) {\n                      onImportSession(f);\n                    }\n                  }}\n                />\n              </label>\n\n              <div className=\"pt-3 border-t border-slate-200\">\n                <div className=\"bg-rose-50/80 border border-rose-200 rounded-2xl p-3.5 space-y-2.5\">\n                  <div className=\"flex items-center space-x-2 text-rose-900 font-extrabold text-xs\">\n                    <Trash2 className=\"w-4 h-4 text-rose-600 flex-shrink-0\" />\n                    <span>Dọn dẹp phiên làm việc</span>\n                  </div>\n                  <p className=\"text-[11px] text-rose-700 leading-relaxed\">\n                    Xóa sạch toàn bộ các bảng dữ liệu đã lưu trong phiên (Doanh thu, Thi đua, Nhân viên) và giải phóng bộ nhớ trình duyệt.\n                  </p>\n                  <button\n                    type=\"button\"\n                    onClick={() => {\n                      onOpenClearModal?.();\n                    }}\n                    className=\"w-full py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-xs transition flex items-center justify-center gap-2 cursor-pointer text-xs\"\n                  >\n                    <Trash2 className=\"w-4 h-4\" />\n                    <span>Xóa toàn bộ data đang lưu trong phiên</span>\n                  </button>\n                </div>\n              </div>\n            </div>\n          )}\n        </div>\n      </aside>\n    </>\n  );\n};\n","src/components/Header.tsx":"import React, { useEffect, useRef, useState } from 'react';\nimport { Camera, Sparkles, Menu, Settings, Bot, History, Loader2, Images, Trash2 } from 'lucide-react';\nimport { ViewType } from '../types';\n\ninterface HeaderExportAction {\n  id: string;\n  label: string;\n  description?: string;\n  icon?: string;\n  tone?: 'blue' | 'emerald' | 'slate';\n  onSelect: () => void | Promise<void>;\n}\n\ninterface HeaderProps {\n  currentView?: ViewType;\n  onOpenUpload?: () => void;\n  exportActions?: HeaderExportAction[];\n  onOpenAiAssistant?: () => void;\n  onOpenSettings?: () => void;\n  onOpenSessionManager?: () => void;\n  onOpenClearSession?: () => void;\n  onOpenDownloads?: () => void;\n  screenshotCount?: number;\n  isExporting?: boolean;\n  onToggleMobileSidebar?: () => void;\n}\n\nconst VIEW_TITLES: Partial<Record<ViewType, string>> = {\n  [ViewType.BAO_CAO_CUOI_NGAY]: 'Báo Cáo Cuối Ngày — Cụm 933',\n  [ViewType.THI_DUA_ST]: 'Bảng Xếp Hạng Thi Đua Siêu Thị',\n  [ViewType.SUC_KHOE_CUM]: 'Sức Khoẻ Cụm 933 — Hiệu Suất & Tương Quan',\n  [ViewType.DOANH_THU_ST]: 'Doanh Thu & Thi Đua Siêu Thị Chi Tiết',\n  [ViewType.SUC_KHOE_NV]: 'Bảng Xếp Hạng Thi Đua & Doanh Thu Nhân Viên',\n  [ViewType.DU_BAO]: 'Dự Báo Cuối Tháng & Kế Hoạch Bứt Phá',\n  [ViewType.KPI_CUSTOM]: 'Cài Đặt & Cấu Hình Nhân Sự KPI',\n  [ViewType.THEO_DOI_NGAY]: 'Theo Dõi Tiến Độ Từng Ngày',\n  [ViewType.DATA_QUALITY]: 'Data Quality Center — Kiểm Tra Chất Lượng Dữ Liệu',\n};\n\nexport const Header: React.FC<HeaderProps> = ({\n  currentView = ViewType.BAO_CAO_CUOI_NGAY,\n  onOpenUpload,\n  exportActions = [],\n  onOpenAiAssistant,\n  onOpenSettings,\n  onOpenSessionManager,\n  onOpenClearSession,\n  onOpenDownloads,\n  screenshotCount = 0,\n  isExporting = false,\n  onToggleMobileSidebar,\n}) => {\n  const triggerUpload = onOpenUpload;\n  const [exportMenuOpen, setExportMenuOpen] = useState(false);\n  const exportMenuRef = useRef<HTMLDivElement>(null);\n  const exportButtonRef = useRef<HTMLButtonElement>(null);\n  const hasExportActions = exportActions.length > 0;\n\n  useEffect(() => { setExportMenuOpen(false); }, [currentView, isExporting]);\n  useEffect(() => {\n    if (!exportMenuOpen) return;\n    const closeOutside = (event: PointerEvent) => {\n      if (!exportMenuRef.current?.contains(event.target as Node)) setExportMenuOpen(false);\n    };\n    document.addEventListener('pointerdown', closeOutside);\n    return () => document.removeEventListener('pointerdown', closeOutside);\n  }, [exportMenuOpen]);\n\n  const runExportAction = async (action: HeaderExportAction) => {\n    if (isExporting) return;\n    setExportMenuOpen(false);\n    exportButtonRef.current?.focus();\n    await action.onSelect();\n  };\n\n  return (\n    <header className=\"bg-white border-b border-slate-200 px-4 md:px-6 py-3 flex items-center justify-between sticky top-0 z-20 shadow-xs\">\n      <div className=\"flex items-center space-x-3\">\n        {onToggleMobileSidebar && (\n          <button\n            type=\"button\"\n            onClick={onToggleMobileSidebar}\n            className=\"md:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100 transition cursor-pointer\"\n            aria-label=\"Toggle menu\"\n          >\n            <Menu className=\"w-5 h-5\" />\n          </button>\n        )}\n        <span className=\"inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-emerald-100 animate-pulse\"></span>\n        <h2 className=\"font-extrabold text-slate-900 text-sm tracking-tight truncate max-w-[200px] sm:max-w-xs md:max-w-none\">\n          {VIEW_TITLES[currentView] || 'Sức Khoẻ Siêu Thị'}\n        </h2>\n        <span className=\"hidden sm:inline text-slate-300\">|</span>\n        <span className=\"hidden sm:inline-block text-xs font-bold text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-lg border border-blue-200/70\">\n          Cụm 933 - 351 Nguyễn Hữu Thọ\n        </span>\n      </div>\n\n      <div className=\"flex items-center space-x-2\">\n        {triggerUpload && (\n          <button\n            onClick={triggerUpload}\n            className=\"flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold shadow-xs hover:shadow-amber-500/25 transition cursor-pointer\"\n            title=\"Nhập hoặc dán trực tiếp dữ liệu từ bất kỳ màn hình nào\"\n          >\n            <Sparkles className=\"w-3.5 h-3.5\" />\n            <span className=\"hidden sm:inline\">Nhập / Dán Data</span>\n          </button>\n        )}\n\n        {onOpenAiAssistant && (\n          <button\n            onClick={onOpenAiAssistant}\n            className=\"flex items-center space-x-1 px-3 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 text-xs font-bold transition cursor-pointer\"\n            title=\"Mở Trợ Lý Đánh Giá AI\"\n          >\n            <Bot className=\"w-3.5 h-3.5 text-emerald-600\" />\n            <span className=\"hidden md:inline\">Đánh Giá AI</span>\n          </button>\n        )}\n\n        {onOpenSessionManager && (\n          <button\n            onClick={onOpenSessionManager}\n            className=\"flex items-center space-x-1 px-2.5 py-1.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-xs font-semibold text-slate-700 transition cursor-pointer\"\n            title=\"Quản lý sao lưu & khôi phục phiên làm việc\"\n          >\n            <History className=\"w-3.5 h-3.5 text-slate-500\" />\n            <span className=\"hidden lg:inline\">Phiên làm việc</span>\n          </button>\n        )}\n\n        {onOpenClearSession && (\n          <button\n            onClick={onOpenClearSession}\n            className=\"flex items-center space-x-1.5 px-2.5 py-1.5 rounded-xl border border-rose-200 bg-rose-50/70 hover:bg-rose-100 text-rose-700 text-xs font-bold transition cursor-pointer\"\n            title=\"Xóa toàn bộ data đang lưu trong phiên\"\n          >\n            <Trash2 className=\"w-3.5 h-3.5 text-rose-600\" />\n            <span className=\"hidden xl:inline\">Xóa Data Phiên</span>\n          </button>\n        )}\n\n        {onOpenSettings && (\n          <button\n            onClick={onOpenSettings}\n            className=\"p-1.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-600 transition cursor-pointer\"\n            title=\"Cài đặt hệ thống\"\n          >\n            <Settings className=\"w-4 h-4\" />\n          </button>\n        )}\n\n        {onOpenDownloads && screenshotCount > 0 && (\n          <button\n            onClick={onOpenDownloads}\n            className=\"flex items-center space-x-1.5 px-2.5 py-1.5 rounded-xl border border-blue-200 bg-blue-50/70 hover:bg-blue-100 text-blue-800 text-xs font-bold transition cursor-pointer\"\n            title=\"Xem danh sách ảnh báo cáo đã xuất\"\n          >\n            <Images className=\"w-3.5 h-3.5 text-blue-600\" />\n            <span className=\"hidden sm:inline\">Kho ảnh</span>\n            <span className=\"w-4 h-4 rounded-full bg-blue-600 text-white text-[10px] flex items-center justify-center font-bold\">\n              {screenshotCount}\n            </span>\n          </button>\n        )}\n\n        {hasExportActions && (\n          <div\n            ref={exportMenuRef}\n            className=\"relative\"\n            onBlur={(event) => {\n              if (!event.currentTarget.contains(event.relatedTarget as Node)) setExportMenuOpen(false);\n            }}\n            onKeyDown={(event) => {\n              if (event.key === 'Escape' && exportMenuOpen) {\n                event.preventDefault();\n                setExportMenuOpen(false);\n                exportButtonRef.current?.focus();\n              }\n            }}\n          >\n            <button\n              ref={exportButtonRef}\n              type=\"button\"\n              onClick={() => setExportMenuOpen(open => !open)}\n              disabled={isExporting}\n              aria-expanded={exportMenuOpen}\n              aria-controls=\"header-export-center\"\n              className=\"flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white text-xs font-bold shadow-xs hover:shadow-blue-500/25 transition cursor-pointer\"\n              title=\"Mở Trung tâm Xuất Ảnh của tab hiện tại\"\n            >\n              {isExporting ? <Loader2 className=\"w-3.5 h-3.5 animate-spin\" /> : <Camera className=\"w-3.5 h-3.5\" />}\n              <span>{isExporting ? 'Đang xuất...' : 'Xuất Ảnh'}</span>\n              {!isExporting && <span aria-hidden=\"true\">▾</span>}\n            </button>\n\n            {exportMenuOpen && !isExporting && (\n              <div\n                id=\"header-export-center\"\n                role=\"group\"\n                aria-label=\"Trung tâm Xuất Ảnh\"\n                className=\"absolute right-0 top-full mt-2 w-80 max-w-[calc(100vw-2rem)] overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl z-50\"\n              >\n                <div className=\"px-4 py-3 border-b border-slate-100 bg-slate-50/80\">\n                  <div className=\"text-[10px] font-black uppercase tracking-wider text-blue-600\">📷 Trung tâm Xuất Ảnh</div>\n                  <div className=\"mt-0.5 text-xs font-extrabold text-slate-900 truncate\">{VIEW_TITLES[currentView] || 'Tab hiện tại'}</div>\n                </div>\n                <div className=\"p-1.5\">\n                  {exportActions.map(action => {\n                    const hover = action.tone === 'emerald' ? 'hover:bg-emerald-50 focus:bg-emerald-50' : action.tone === 'slate' ? 'hover:bg-slate-50 focus:bg-slate-50' : 'hover:bg-blue-50 focus:bg-blue-50';\n                    return (\n                      <button\n                        key={action.id}\n                        type=\"button\"\n                        onClick={() => { void runExportAction(action); }}\n                        className={`w-full rounded-xl px-3 py-2.5 text-left transition cursor-pointer ${hover}`}\n                      >\n                        <span className=\"flex items-start gap-2.5\">\n                          <span className=\"text-base leading-5 shrink-0\">{action.icon || '📷'}</span>\n                          <span className=\"min-w-0\">\n                            <span className=\"block text-xs font-black text-slate-900\">{action.label}</span>\n                            {action.description && <span className=\"block mt-0.5 text-[10.5px] leading-4 text-slate-500\">{action.description}</span>}\n                          </span>\n                        </span>\n                      </button>\n                    );\n                  })}\n                </div>\n                <div className=\"px-4 py-2.5 border-t border-slate-100 bg-slate-50 text-[10px] text-slate-400\">\n                  Ảnh xuất xong vẫn tự tải xuống và lưu vào Kho ảnh như trước.\n                </div>\n              </div>\n            )}\n          </div>\n        )}\n      </div>\n    </header>\n  );\n};\n","src/components/ImageExportModal.tsx":"import React, { useState } from 'react';\nimport { X, Download, Copy, Check, ExternalLink, Camera } from 'lucide-react';\nimport { downloadImage, copyImageToClipboard } from '../utils/imageExporter';\n\ninterface ImageExportModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  imageResult: {\n    dataUrl: string;\n    blob: Blob;\n    fileName: string;\n  } | null;\n}\n\nexport const ImageExportModal: React.FC<ImageExportModalProps> = ({\n  isOpen,\n  onClose,\n  imageResult,\n}) => {\n  const [copied, setCopied] = useState<boolean>(false);\n\n  if (!isOpen || !imageResult) return null;\n\n  const handleDownload = () => {\n    downloadImage(imageResult.blob, imageResult.fileName);\n  };\n\n  const handleCopy = async () => {\n    const ok = await copyImageToClipboard(imageResult.blob);\n    if (ok) {\n      setCopied(true);\n      setTimeout(() => setCopied(false), 2500);\n    } else {\n\n      try {\n        await navigator.clipboard.writeText(imageResult.dataUrl);\n        setCopied(true);\n        setTimeout(() => setCopied(false), 2500);\n      } catch (err) {\n        console.error('Clipboard copy failed:', err);\n      }\n    }\n  };\n\n  const handleOpenInNewTab = () => {\n    try {\n      const blobUrl = URL.createObjectURL(imageResult.blob);\n      window.open(blobUrl, '_blank');\n    } catch {\n      const win = window.open();\n      if (win) {\n        win.document.write(`<img src=\"${imageResult.dataUrl}\" style=\"max-width:100%\" />`);\n      }\n    }\n  };\n\n  return (\n    <div\n      className=\"fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-5\"\n      onClick={(e) => {\n        if (e.target === e.currentTarget) onClose();\n      }}\n    >\n      <div className=\"bg-white rounded-3xl shadow-2xl max-w-2xl w-full p-5 sm:p-6 border border-slate-200 space-y-4 animate-fadeIn flex flex-col max-h-[90vh]\">\n        {}\n        <div className=\"flex items-center justify-between pb-3 border-b border-slate-100 flex-shrink-0\">\n          <div className=\"flex items-center space-x-2.5\">\n            <div className=\"w-8 h-8 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold\">\n              <Camera className=\"w-4 h-4\" />\n            </div>\n            <div>\n              <h3 className=\"font-black text-slate-900 text-sm\">Xuất Ảnh Báo Cáo Thành Công!</h3>\n              <p className=\"text-[11px] text-slate-500 font-medium truncate max-w-xs sm:max-w-md\">\n                {imageResult.fileName}\n              </p>\n            </div>\n          </div>\n          <button\n            onClick={onClose}\n            className=\"p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition cursor-pointer\"\n          >\n            <X className=\"w-5 h-5\" />\n          </button>\n        </div>\n\n        {}\n        <div className=\"flex-1 min-h-0 overflow-y-auto custom-scroll rounded-2xl border border-slate-200 bg-slate-50 p-2 flex items-center justify-center\">\n          <img\n            src={imageResult.dataUrl}\n            alt={imageResult.fileName}\n            className=\"max-w-full max-h-[50vh] object-contain rounded-xl shadow-xs border border-slate-200\"\n          />\n        </div>\n\n        {}\n        <div className=\"flex-shrink-0 space-y-3 pt-1\">\n          <div className=\"flex flex-wrap items-center justify-between gap-2\">\n            <div className=\"flex items-center gap-2\">\n              <button\n                onClick={handleCopy}\n                className=\"px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition flex items-center gap-1.5 cursor-pointer\"\n                title=\"Sao chép ảnh để dán thẳng vào Zalo, Viber, PowerPoint...\"\n              >\n                {copied ? <Check className=\"w-4 h-4 text-emerald-600\" /> : <Copy className=\"w-4 h-4\" />}\n                <span>{copied ? 'Đã sao chép ảnh!' : 'Sao chép ảnh (Copy)'}</span>\n              </button>\n\n              <button\n                onClick={handleOpenInNewTab}\n                className=\"px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition flex items-center gap-1.5 cursor-pointer\"\n                title=\"Mở ảnh kích thước đầy đủ trong tab mới\"\n              >\n                <ExternalLink className=\"w-3.5 h-3.5\" />\n                <span className=\"hidden sm:inline\">Mở tab mới</span>\n              </button>\n            </div>\n\n            <div className=\"flex items-center gap-2\">\n              <button\n                onClick={handleDownload}\n                className=\"px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-xs transition flex items-center gap-1.5 cursor-pointer\"\n              >\n                <Download className=\"w-4 h-4\" />\n                <span>Tải Ảnh Về Máy (.PNG)</span>\n              </button>\n              <button\n                onClick={onClose}\n                className=\"px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs transition cursor-pointer\"\n              >\n                Đóng\n              </button>\n            </div>\n          </div>\n\n          <p className=\"text-[11px] text-slate-500 text-center\">\n            💡 <b>Mẹo:</b> Bạn có thể bấm <b>Sao chép ảnh</b> rồi nhấn <code>Ctrl + V</code> để gửi ngay vào tin nhắn Zalo / Nhóm bán hàng!\n          </p>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/components/ProgramDetailModal.tsx":"import { SortableTable } from './SortableTable';\nimport React, { useRef, useState } from 'react';\nimport { Camera, X, Loader2 } from 'lucide-react';\nimport { captureElement, downloadImage } from '../utils/imageExporter';\nimport { formatCurrency, formatInt, formatPercent, formatProgramName, cleanCode, cleanProgName } from '../utils/formatters';\nimport { AppDataState, PersonnelConfigMap } from '../types';\nimport { getPersonnelAllocationPct } from '../utils/stretchGoal';\n\ninterface StaffSellingDetail {\n  name: string;\n  id: string;\n  sl: number;\n  dtThuc: number;\n  dtQd: number;\n  empTarget: number;\n  pctLk: number;\n  pctDu: number;\n  isDone: boolean;\n}\n\ninterface ProgramDetailModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  storeKey?: string;\n  programCode?: string | number;\n  programName?: string;\n  appData?: AppDataState;\n  personnelConfig?: PersonnelConfigMap;\n  onUpdatePersonnelConfig?: (cfg: PersonnelConfigMap) => void;\n  storeName?: string;\n  progCode?: string | number;\n  progName?: string;\n  loaiTd?: number;\n  shopThuc?: number;\n  shopTarget?: number;\n  shopPctLk?: number;\n  shopPctDu?: number;\n  staffList?: StaffSellingDetail[];\n  onSaveScreenshot?: (item: { name: string; url: string; time: string }) => void;\n}\n\nconst normalizeStoreKey = (value?: string) => {\n  const s = String(value || '').trim().toUpperCase();\n  if (s === 'TOPZONE' || s === 'AAR' || s === '10341' || s.includes('TOPZONE') || s.includes('AAR')) return 'TOPZONE';\n  return 'TGDD';\n};\n\nconst isStoreRow = (row: any, store: 'TGDD' | 'TOPZONE') => {\n  const code = cleanCode(row?.['MÃ ĐƠN VỊ'] || row?.['Mã đơn vị'] || row?.['MÃ ĐƠN VỊ'] || '');\n  const name = String(row?.['TÊN ĐƠN VỊ'] || row?.['ĐƠN VỊ / NHÂN VIÊN'] || row?.['Siêu thị'] || '').toUpperCase();\n  return store === 'TOPZONE'\n    ? code === '10341' || /TOPZONE|AAR/.test(name)\n    : code === '933' || /TGDĐ|TGDD|TGD\\b|THẾ GIỚI DI ĐỘNG/.test(name);\n};\n\nconst canonicalEmployeeName = (value: any) => {\n  const raw = String(value || '').trim();\n  return raw.replace(/^\\d{4,7}\\s*[-_–]\\s*/, '').trim();\n};\n\nexport const ProgramDetailModal: React.FC<ProgramDetailModalProps> = ({\n  isOpen,\n  onClose,\n  storeKey,\n  programCode,\n  programName,\n  appData,\n  personnelConfig,\n  onUpdatePersonnelConfig,\n  storeName: propStoreName,\n  progCode: propProgCode,\n  progName: propProgName,\n  loaiTd: propLoaiTd,\n  shopThuc: propShopThuc,\n  shopTarget: propShopTarget,\n  shopPctLk: propShopPctLk,\n  shopPctDu: propShopPctDu,\n  staffList: propStaffList,\n  onSaveScreenshot,\n}) => {\n  const cardRef = useRef<HTMLDivElement>(null);\n  const [isExporting, setIsExporting] = useState<boolean>(false);\n  const [isEmployeeVisibilityMenuOpen, setIsEmployeeVisibilityMenuOpen] = useState<boolean>(false);\n\n  const [hiddenEmployeeKeysByProgram, setHiddenEmployeeKeysByProgram] = useState<Record<string, Record<string, boolean>>>({});\n\n  const [hideScope, setHideScope] = useState<'LOCAL' | 'GLOBAL'>('LOCAL');\n\n  if (!isOpen)
