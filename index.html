Number(tokens[6], 0) : 0;\n      const hasCurrentInstallmentColumns = tokens.length >= 10;\n      const idxTraGop = hasCurrentInstallmentColumns ? 8 : -1;\n      const idxPctTraGop = hasCurrentInstallmentColumns ? 9 : -1;\n      const dtTraGop = idxTraGop >= 0 ? parseFlexibleNumber(tokens[idxTraGop], 0) : 0;\n      const pctTraGop = idxPctTraGop >= 0 ? parseFlexibleNumber(tokens[idxPctTraGop], 0) : 0;\n\n      const shop = isTopzoneStaff(staffId) || isTopzoneStaff(staffName) ? 'TopZone' : 'TGDĐ';\n\n      records.push({\n        'MÃ NHÂN VIÊN': staffId,\n        'TÊN NHÂN VIÊN': staffName,\n        'SIÊU THỊ': shop,\n        'DOANH THU (TR)': dt,\n        'DOANH THU QĐ (TR)': dtQd,\n        'DT TRẢ GÓP (TR)': dtTraGop,\n        '% TRẢ GÓP': pctTraGop,\n        'SỐ LƯỢNG': sl,\n        '% TỈ TRỌNG': tiTrong,\n        'TARGET (TR)': target,\n        '% HT TARGET': htTarget,\n        'TB 3 THÁNG (TR)': tb3,\n        'SỐ NGÀY CỬA SỔ': 1,\n      });\n    }\n  }\n\n  if (records.length === 0) return null;\n\n  return {\n    category: 'dt_nv_realtime',\n    categoryName: CATEGORY_LABELS['dt_nv_realtime'],\n    rowCount: records.length,\n    recognizedColumns: [\n      { field: 'MÃ NHÂN VIÊN', mappedHeader: 'Mã NV' },\n      { field: 'TÊN NHÂN VIÊN', mappedHeader: 'Tên nhân viên' },\n      { field: 'SIÊU THỊ', mappedHeader: 'Siêu thị' },\n      { field: 'SỐ LƯỢNG', mappedHeader: 'Số lượng' },\n      { field: 'DOANH THU (TR)', mappedHeader: 'Doanh thu RT' },\n      { field: 'DOANH THU QĐ (TR)', mappedHeader: 'Doanh thu QĐ' },\n      { field: '% TỈ TRỌNG', mappedHeader: '% Tỉ trọng' },\n      { field: 'DT TRẢ GÓP (TR)', mappedHeader: 'DT trả góp' },\n      { field: '% TRẢ GÓP', mappedHeader: '% trả góp' },\n    ],\n    missingColumns: [],\n    data: records,\n    pageExtractedInfo: {\n      headerFoundAtLine: 0,\n      totalLinesScanned: lines.length,\n      ignoredNoiseLines: Math.max(0, lines.length - records.length * 2),\n      isFullPageExtracted: true,\n    },\n  };\n}\n\n/**\n * Master MWG BI Auto-Detector and Parser\n */\n\n/**\n * Báo cáo trả chậm — MWG BI 2026.\n * Hỗ trợ copy toàn trang Ctrl+A/C và tự bỏ menu/filter/footer.\n * LK có 6 nguồn tài chính; RT có thể chỉ trả về Payoo + Home Credit.\n */\nfunction parseMwgTraCham(rawText: string, mode: 'luyke' | 'realtime'): ParseDiagnostics | null {\n  const lines = String(rawText || '').split(/\\r?\\n/).map(l => l.trim()).filter(Boolean);\n  if (!lines.length) return null;\n  const normalizedText = normalizeStr(rawText);\n\n  // Chữ ký phải đến từ CỤM HEADER CỦA BẢNG, không phụ thuộc menu/tiêu đề\n  // \"Báo cáo trả chậm\" ở nơi khác trên trang. Khi copy từ Web BI, header\n  // đôi lúc bị tách thành nhiều dòng/tab, nên kiểm tra trong một cửa sổ nhỏ\n  // quanh dòng \"Nhân viên\" thay vì bắt buộc tất cả nằm trên cùng một dòng.\n  // Bộ 4 cột bắt buộc: Nhân viên + DT trả góp + DT siêu thị + Tỷ trọng trả chậm.\n  const headerHas = (windowText: string) => {\n    const h = normalizeStr(windowText);\n    return /nhan vien/.test(h) &&\n      /dt tra gop/.test(h) &&\n      /dt sieu thi/.test(h) &&\n      /ty trong tra cham/.test(h);\n  };\n\n  let headerIndex = -1;\n  let headerCells: string[] = [];\n  for (let i = 0; i < lines.length; i++) {\n    const start = Math.max(0, i - 2);\n    const end = Math.min(lines.length, i + 4);\n    const windowText = lines.slice(start, end).join(' | ');\n    const n = normalizeStr(lines[i]);\n    const cells = numericCellsFromLine(lines[i]);\n    if (headerHas(windowText) && /nhan vien/.test(n)) {\n      headerIndex = i;\n      headerCells = cells;\n      break;\n    }\n  }\n  if (headerIndex < 0) return null;\n\n  const expectedPrograms = mode === 'luyke'\n    ? ['Payoo', 'Home Credit (HC)', 'Kim Ngân Pay', 'KREDIVO', 'FE Credit (FE)', 'Thẻ tín dụng - SMARTPOS', 'Samsung Finance+']\n    : ['Payoo', 'Home Credit (HC)'];\n  const records: any[] = [];\n\n  const makeRecord = (name: string, cells: string[]) => {\n    const vals = cells.filter(c => c !== '');\n    // LK can have six providers (15 values) or seven with Samsung (17).\n    if (vals.length < (mode === 'luyke' ? 15 : 7)) return null;\n    const nums = vals.map(v => parseFlexibleNumber(v, 0));\n    const r: any = {\n      'NHÂN VIÊN': name.trim(),\n      'DT TRẢ GÓP (TRIỆU)': nums[0],\n      'DT SIÊU THỊ (TRIỆU)': nums[1],\n      'TỶ TRỌNG TRẢ CHẬM (%)': nums[2],\n      'PAYOO DT (TRIỆU)': nums[3],\n      'PAYOO %': nums[4],\n      'HOME CREDIT (HC) DT (TRIỆU)': nums[5],\n      'HOME CREDIT (HC) %': nums[6],\n      'KIM NGÂN PAY DT (TRIỆU)': mode === 'luyke' ? nums[7] : 0,\n      'KIM NGÂN PAY %': mode === 'luyke' ? nums[8] : 0,\n      'KREDIVO DT (TRIỆU)': mode === 'luyke' ? nums[9] : 0,\n      'KREDIVO %': mode === 'luyke' ? nums[10] : 0,\n      'FE CREDIT (FE) DT (TRIỆU)': mode === 'luyke' ? nums[11] : 0,\n      'FE CREDIT (FE) %': mode === 'luyke' ? nums[12] : 0,\n      'SMARTPOS DT (TRIỆU)': mode === 'luyke' ? nums[13] : 0,\n      'SMARTPOS %': mode === 'luyke' ? nums[14] : 0,\n      'SAMSUNG FINANCE+ DT (TRIỆU)': mode === 'luyke' ? (nums[15] ?? 0) : 0,\n      'SAMSUNG FINANCE+ %': mode === 'luyke' ? (nums[16] ?? 0) : 0,\n      'CHẾ ĐỘ': mode,\n    };\n    return r;\n  };\n\n  // Normal BI copy is one employee per tab-separated line. Ignore menu/filter lines.\n  for (let i = headerIndex + 1; i < lines.length; i++) {\n    const line = lines[i];\n    const n = normalizeStr(line);\n    if (/^tong$|tong \\d+ dong|^1 \\d+/.test(n)) break;\n    const cells = numericCellsFromLine(line);\n    if (cells.length < 2) continue;\n    const first = cells[0].trim();\n    const firstNorm = normalizeStr(first);\n    // MWG BI đôi khi chèn dòng tổng/nhãn \"DT\" ngay đầu bảng.\n    // Dòng này có cấu trúc số giống một nhân viên nên nếu không loại riêng sẽ bị\n    // nhận thành nhân viên thứ 13 (thường còn trùng số liệu với người đầu tiên).\n    if (!first || /^dt$/.test(firstNorm) || /^(nhan vien|don vi|filter|loc|luy ke|realtime)$/i.test(firstNorm)) continue;\n    if (!/[a-zA-ZÀ-ỹĐđ]/.test(first)) continue;\n    const row = makeRecord(first, cells.slice(1));\n    if (row) records.push(row);\n  }\n\n  // Some clipboard variants place the name on its own line and numbers on the next line.\n  if (!records.length) {\n    for (let i = headerIndex + 1; i < lines.length; i++) {\n      const nameLine = lines[i];\n      const nn = normalizeStr(nameLine);\n      if (/^tong$|tong \\d+ dong/.test(nn)) break;\n      if (/^dt$/.test(nn)) continue;\n      if (!/[a-zA-ZÀ-ỹĐđ]/.test(nameLine) || /bao cao|cap nhat|theo nganh|ty le duyet|filter|luy ke|realtime/.test(nn)) continue;\n      const cells = findFollowingValueCells(lines, i);\n      const row = makeRecord(nameLine.replace(/\\t.*$/, '').trim(), cells);\n      if (row) records.push(row);\n    }\n  }\n\n  if (!records.length) return null;\n  const unique = records.filter((r, i, arr) => arr.findIndex(x => normalizeStr(String(x['NHÂN VIÊN'] || '')) === normalizeStr(String(r['NHÂN VIÊN'] || ''))) === i);\n\n  // Lá chắn thứ 2: nếu dòng tổng/nhãn kiểu \"DT\" vẫn lọt qua bộ lọc tên ở trên (do lệch\n  // định dạng, thừa khoảng trắng, ký tự ẩn...), nó sẽ luôn có numeric fingerprint trùng\n  // y hệt với nhân viên đứng đầu bảng. Phát hiện các dòng trùng số liệu tuyệt đối và chỉ\n  // giữ lại dòng có tên trông giống tên người thật, loại dòng còn lại (nhãn/tổng).\n  const numericKey = (r: any) => [\n    'DT TRẢ GÓP (TRIỆU)', 'DT SIÊU THỊ (TRIỆU)', 'TỶ TRỌNG TRẢ CHẬM (%)',\n    'PAYOO DT (TRIỆU)', 'HOME CREDIT (HC) DT (TRIỆU)', 'KIM NGÂN PAY DT (TRIỆU)', 'KREDIVO DT (TRIỆU)',\n    'FE CREDIT (FE) DT (TRIỆU)', 'SMARTPOS DT (TRIỆU)', 'SAMSUNG FINANCE+ DT (TRIỆU)',\n  ].map(k => Number(r[k]) || 0).join('|');\n  const looksLikeLabelRow = (name: string) => {\n    const n = normalizeStr(name);\n    if (!n) return true;\n    if (/^dt$/.test(n) || /^tong/.test(n) || /^(nhan vien|don vi|filter|loc|luy ke|realtime)$/.test(n)) return true;\n    // Tên nhân viên thật hầu như luôn có ít nhất 2 âm tiết; nhãn/mã kiểu \"DT\" thì không.\n    return !n.includes(' ') && n.length <= 3;\n  };\n  const seenKeys = new Map<string, number>();\n  const dedupedByValue: any[] = [];\n  for (const r of unique) {\n    const key = numericKey(r);\n    const isZeroKey = /^(0\\|)+0$/.test(key);\n    if (!isZeroKey && seenKeys.has(key)) {\n      const existingIdx = seenKeys.get(key)!;\n      const existing = dedupedByValue[existingIdx];\n      const rIsLabel = looksLikeLabelRow(String(r['NHÂN VIÊN']));\n      const existingIsLabel = looksLikeLabelRow(String(existing['NHÂN VIÊN']));\n      if (rIsLabel && !existingIsLabel) continue; // bỏ dòng nhãn/tổng, giữ nhân viên thật\n      if (existingIsLabel && !rIsLabel) { dedupedByValue[existingIdx] = r; continue; }\n      continue; // không rõ ràng bên nào là nhãn -> vẫn bỏ dòng trùng để tránh đếm 2 lần\n    }\n    seenKeys.set(key, dedupedByValue.length);\n    dedupedByValue.push(r);\n  }\n\n  return {\n    category: mode === 'luyke' ? 'tra_cham_luyke' : 'tra_cham_realtime',\n    categoryName: CATEGORY_LABELS[mode === 'luyke' ? 'tra_cham_luyke' : 'tra_cham_realtime'],\n    rowCount: dedupedByValue.length,\n    recognizedColumns: [\n      { field: 'NHÂN VIÊN', mappedHeader: 'Nhân viên' },\n      { field: 'DT TRẢ GÓP (TRIỆU)', mappedHeader: 'DT trả góp (triệu)' },\n      { field: 'DT SIÊU THỊ (TRIỆU)', mappedHeader: 'DT siêu thị (triệu)' },\n      { field: 'TỶ TRỌNG TRẢ CHẬM (%)', mappedHeader: 'Tỷ trọng trả chậm %' },\n      { field: 'PAYOO DT (TRIỆU)', mappedHeader: 'Payoo DT' },\n      { field: 'HOME CREDIT (HC) DT (TRIỆU)', mappedHeader: 'Home Credit DT' },\n      ...(mode === 'luyke' ? [\n        { field: 'KIM NGÂN PAY DT (TRIỆU)', mappedHeader: 'Kim Ngân Pay DT' },\n        { field: 'KREDIVO DT (TRIỆU)', mappedHeader: 'KREDIVO DT' },\n        { field: 'FE CREDIT (FE) DT (TRIỆU)', mappedHeader: 'FE Credit DT' },\n        { field: 'SMARTPOS DT (TRIỆU)', mappedHeader: 'SMARTPOS DT' },\n        { field: 'SAMSUNG FINANCE+ DT (TRIỆU)', mappedHeader: 'Samsung Finance+ DT' },\n      ] : []),\n    ],\n    missingColumns: mode === 'realtime' ? ['Kim Ngân Pay', 'KREDIVO', 'FE Credit', 'SMARTPOS', 'Samsung Finance+'] : [],\n    data: dedupedByValue,\n    pageExtractedInfo: {\n      headerFoundAtLine: headerIndex,\n      totalLinesScanned: lines.length,\n      ignoredNoiseLines: Math.max(0, lines.length - dedupedByValue.length - 1),\n      isFullPageExtracted: true,\n    },\n  };\n}\n\nexport function tryParseMwgBiFormat(\n  rawText: string,\n  targetCategory?: keyof AppDataState | null,\n  context?: MwgDetectionContext\n): ParseDiagnostics | null {\n  rawText = normalizeCompetitionClipboard(rawText);\n  // Explicit destination is always authoritative.\n  if (targetCategory === 'dt_luyke') return parseMwgStoreRevenueLk(rawText);\n  if (targetCategory === 'dt_realtime') return parseMwgStoreRevenueRt(rawText);\n  if (targetCategory === 'td_luyke') return parseMwgStoreCompetitionLk(rawText);\n  if (targetCategory === 'td_realtime') return parseMwgStoreCompetitionRt(rawText);\n  if (targetCategory === 'nv_tgdd' || targetCategory === 'nv_tz') return parseMwgEmployeeCompetition(rawText, targetCategory);\n  if (targetCategory === 'dt_nv_luyke') return parseMwgEmployeeRevenueLk(rawText);\n  if (targetCategory === 'dt_nv_realtime') return parseMwgEmployeeRevenueRt(rawText);\n  if (targetCategory === 'tra_cham_luyke') return parseMwgTraCham(rawText, 'luyke');\n  if (targetCategory === 'tra_cham_realtime') return parseMwgTraCham(rawText, 'realtime');\n\n  const text = String(rawText || '');\n  const norm = normalizeStr(text);\n  const hasEmployeeHeader = /nhan\\s*vien|ma\\s*nv/i.test(norm);\n  // Chỉ mở parser Trả Chậm khi có CHỮ KÝ CỦA BẢNG, không dựa vào tên menu\n  // \"Báo cáo trả chậm\" có thể xuất hiện khi Ctrl+A/C toàn bộ trang Doanh Thu.\n  const hasTraChamTableSignature =\n    /nhan\\s*vien/.test(norm) &&\n    /dt\\s*tra\\s*gop/.test(norm) &&\n    /dt\\s*sieu\\s*thi/.test(norm) &&\n    /ty\\s*trong\\s*tra\\s*cham/.test(norm);\n  if (hasTraChamTableSignature) {\n    const lk = parseMwgTraCham(text, 'luyke');\n    const rt = parseMwgTraCham(text, 'realtime');\n    // Structural evidence must win over stored totals. A refreshed LK table\n    // may decrease after refunds, filtering, or a new month. RT accepts the\n    // first seven values of LK too, so choosing RT by amount truncates providers.\n    // Full LK supports six or seven providers; compact RT has two providers.\n    if (lk?.data.length) return lk;\n    if (rt?.data.length) return rt;\n  }\n  const hasStoreRows = /(?:^|\\n|\\|)\\s*\\d{3,5}\\s*[-_–]\\s*/i.test(text);\n\n  // Rank columns identify employee tables; sidebar labels are ignored.\n  if (/hang trong st/i.test(norm)) {\n    const destination = employeeCompetitionDestination(text, context);\n    return destination ? parseMwgEmployeeCompetition(text, destination) : null;\n  }\n\n  if (/%\\s*ht\\s*ng[aà]y|doanh\\s*thu\\s*\\(\\s*rt\\s*\\)|s[oố]\\s*l[uư][oợ]ng\\s*\\(\\s*rt\\s*\\)/i.test(text)) {\n    const compRt = parseMwgStoreCompetitionRt(text);\n    if (compRt?.data.length) return compRt;\n  }\n  if (/%\\s*ht\\s*th[aá]ng/i.test(text) && /top\\s*\\/\\s*bottom\\s*v[uù]ng/i.test(text)) {\n    const compLk = parseMwgStoreCompetitionLk(text);\n    if (compLk?.data.length) return compLk;\n  }\n\n  // ================================================================\n  // 1) DOANH THU NHÂN VIÊN\n  // Quy tắc chính theo yêu cầu: nếu đã có bản Lũy kế trong phiên,\n  // tổng DT QĐ của bản paste nhỏ hơn baseline => Realtime; ngược lại => Lũy kế.\n  // Không dùng chữ \"Realtime/Cập nhật/Lũy kế\" trong menu toàn trang để quyết định.\n  // ================================================================\n  if (hasEmployeeHeader) {\n    const empLk = parseMwgEmployeeRevenueLk(text);\n    const empRt = parseMwgEmployeeRevenueRt(text);\n    const incomingLkTotal = sumParsedDtQd(empLk?.data);\n    const incomingRtTotal = sumParsedDtQd(empRt?.data);\n    const baseline = Number(context?.existingEmployeeLuyKeDtQd || 0);\n\n    if (baseline > 0) {\n      // Parse both candidates, then let the total DT QĐ decide.\n      if (incomingRtTotal > 0 && incomingRtTotal < baseline && empRt?.data.length) return empRt;\n      if (incomingLkTotal >= baseline && empLk?.data.length) return empLk;\n      // Realtime can legitimately be 0; a valid RT table with total 0 is\n      // still smaller than a positive Lũy kế baseline.\n      if (empRt?.data.length && incomingRtTotal < baseline) return empRt;\n    }\n\n    // Không có baseline (ví dụ người dùng paste Realtime trước): dùng dấu hiệu\n    // nằm trong CHÍNH bảng, không dùng chữ Realtime ở menu.\n    const employeeRtTableMarker = /%\\s*ht\\s*target\\s*\\(\\s*lk\\s*\\)/i.test(text) ||\n      /doanh\\s*thu\\s*\\(\\s*rt\\s*\\)/i.test(text) ||\n      /s[oố]\\s*l[uư][oợ]ng\\s*\\(\\s*rt\\s*\\)/i.test(text);\n    if (employeeRtTableMarker && empRt?.data.length) return empRt;\n    if (empLk?.data.length) return empLk;\n    if (empRt?.data.length) return empRt;\n  }\n\n  // ================================================================\n  // 2) DOANH THU SIÊU THỊ\n  // Dùng đúng cùng nguyên tắc baseline: tổng DT QĐ paste nhỏ hơn Lũy kế\n  // hiện có => Realtime. Đây là tín hiệu mạnh hơn các chữ ở phần menu/KPI.\n  // ================================================================\n  if (hasStoreRows) {\n    const storeLk = parseMwgStoreRevenueLk(text);\n    const storeRt = parseMwgStoreRevenueRt(text);\n    const incomingLkTotal = sumParsedDtQd(storeLk?.data);\n    const incomingRtTotal = sumParsedDtQd(storeRt?.data);\n    const baseline = Number(context?.existingStoreLuyKeDtQd || 0);\n\n    if (baseline > 0) {\n      if (incomingRtTotal > 0 && incomingRtTotal < baseline && storeRt?.data.length) return storeRt;\n      if (incomingLkTotal >= baseline && storeLk?.data.length) return storeLk;\n      if (storeRt?.data.length && incomingRtTotal < baseline) return storeRt;\n    }\n\n    // Không có baseline: chỉ dùng marker thực sự thuộc bảng RT.\n    const storeRtTableMarker = /doanh\\s*thu\\s*\\(\\s*rt\\s*\\)/i.test(text) ||\n      /%\\s*ht\\s*target\\s*\\(\\s*lk\\s*\\)/i.test(text) ||\n      /s[oố]\\s*l[uư][oợ]ng\\s*\\(\\s*rt\\s*\\)/i.test(text);\n    if (storeRtTableMarker && storeRt?.data.length) return storeRt;\n    if (storeLk?.data.length) return storeLk;\n    if (storeRt?.data.length) return storeRt;\n  }\n\n  return null;\n}\n\n/**\n * Employee competition is a set of small tables, one table per program.\n * 2026 BI changed the copied header to e.g. \"DOANH THU HẠNG TRONG ST\n * TOP/BOTTOM ST BỘ PHẬN\" and may concatenate the program title + headers.\n */\nexport function parseMwgEmployeeCompetition(\n  rawText: string,\n  category: 'nv_tgdd' | 'nv_tz'\n): ParseDiagnostics | null {\n  const lines = rawText.split(/\\r?\\n/).map(cleanClipboardLine).filter(Boolean);\n  const records: CompetitionRow[] = [];\n  let currentProgram = '';\n  let currentLoai = 3;\n  let sawHeader = false;\n\n  for (let i = 0; i < lines.length; i++) {\n    const line = lines[i];\n    const header = extractProgramAndHeader(line, false);\n    if (header && /h[aạ]ng trong st/i.test(normalizeStr(line))) {\n      currentProgram = header.program;\n      currentLoai = header.type;\n      sawHeader = true;\n      continue;\n    }\n\n    // 2026 BI concatenates the program title directly with the header.\n    const n = normalizeStr(line);\n    const employeeHeader = /h[ạa]ng trong st/i.test(n) && /top bottom/i.test(n)\n      ? extractProgramAndHeader(line, false)\n      : null;\n    if (employeeHeader) {\n      currentProgram = employeeHeader.program;\n      currentLoai = employeeHeader.type;\n      sawHeader = true;\n      continue;\n    }\n    // Employee-competition headers do not contain TARGET, so extractProgramAndHeader\n    // cannot recognize them; use the original-string marker as a safe fallback.\n    if ((n.includes('doanh thu') || n.includes('so luong')) && n.includes('hang trong st') && n.includes('top bottom')) {\n      const markerMatch = line.match(/(DOANH\\s*THU|SỐ\\s*LƯỢNG)/i);\n      if (markerMatch && markerMatch.index !== undefined) {\n        currentProgram = line.slice(0, markerMatch.index).trim() || currentProgram || 'Chương trình';\n        currentLoai = /SỐ\\s*LƯỢNG/i.test(markerMatch[1]) ? 2 : 3;\n        sawHeader = true;\n        continue;\n      }\n    }\n\n    if (!sawHeader || !currentProgram) continue;\n    if (/^tong$/i.test(n) || n.startsWith('tong ')) continue;\n\n    const person = extractPersonRow(line);\n    if (!person) continue;\n\n    let cells = competitionValueCells(line);\n    if (cells.length < 2) cells = findFollowingValueCells(lines, i);\n    if (cells.length < 2) continue;\n\n    const thuc = parseFlexibleNumber(cells[0]);\n    let rank = 0;\n    let topBottom = '';\n    let companyRank: number | null = null;\n\n    // TopZone BI có thêm cột HẠNG CÔNG TY, ví dụ `2786 (CTY)`,\n    // nằm giữa doanh thu/số lượng và HẠNG TRONG ST.\n    // TGDĐ không có cột này, nên phải dò theo nhãn (CTY), không được cố định vị trí.\n    const companyIdx = cells.findIndex(c => /\\(\\s*cty\\s*\\)/i.test(c));\n    if (companyIdx !== -1) {\n      companyRank = parseFlexibleNumber(cells[companyIdx]);\n      if (cells[companyIdx + 1] != null) rank = parseFlexibleNumber(cells[companyIdx + 1]);\n      if (cells[companyIdx + 2] != null) topBottom = cells[companyIdx + 2].trim();\n    } else {\n      rank = cells.length > 1 ? parseFlexibleNumber(cells[1]) : 0;\n      topBottom = cells.length > 2 ? cells[2].trim() : '';\n    }\n\n    const managedShop = category === 'nv_tgdd' ? MANAGED_SHOPS.TGDD : MANAGED_SHOPS.TOPZONE;\n    const row: CompetitionRow = {\n      'MÃ NV': person.id,\n      'MÃ ĐƠN VỊ': category === 'nv_tgdd' ? SHOP_CODES.TGDD : SHOP_CODES.TOPZONE,\n      'TÊN ĐƠN VỊ': managedShop,\n      'ĐƠN VỊ / NHÂN VIÊN': `${person.id} - ${person.name}`,\n      'CHƯƠNG TRÌNH': currentProgram,\n      'LOẠI TĐ': currentLoai,\n      'DOANH THU (TR)': currentLoai === 3 ? thuc : 0,\n      'DT QUY ĐỔI (TR)': currentLoai === 3 ? thuc : 0,\n      'SỐ LƯỢNG': currentLoai === 2 ? Math.round(thuc) : 0,\n      'HẠNG TRONG ST': rank,\n      'TOP/BOTTOM ST': topBottom,\n    };\n    if (companyRank !== null) row['HẠNG CÔNG TY'] = companyRank;\n    records.push(row);\n  }\n\n  if (!records.length) return null;\n  return {\n    category,\n    categoryName: CATEGORY_LABELS[category],\n    rowCount: records.length,\n    recognizedColumns: [\n      { field: 'MÃ NV', mappedHeader: 'Mã nhân viên' },\n      { field: 'ĐƠN VỊ / NHÂN VIÊN', mappedHeader: 'Nhân viên' },\n      { field: 'CHƯƠNG TRÌNH', mappedHeader: 'Tên chương trình' },\n      { field: 'DOANH THU (TR)', mappedHeader: 'Doanh thu' },\n      { field: 'SỐ LƯỢNG', mappedHeader: 'Số lượng' },\n      { field: 'HẠNG TRONG ST', mappedHeader: 'Hạng trong ST' },\n      { field: 'TOP/BOTTOM ST', mappedHeader: 'Top/Bottom ST' },\n    ],\n    missingColumns: [],\n    data: records,\n    pageExtractedInfo: {\n      headerFoundAtLine: 0,\n      totalLinesScanned: lines.length,\n      ignoredNoiseLines: Math.max(0, lines.length - records.length),\n      isFullPageExtracted: true,\n    },\n  };\n}\n\n// =========================================================================\n// 2. GENERIC TABULAR GRID PARSER (FOR EXCEL / GOOGLE SHEETS COPIES)\n// =========================================================================\n\nconst DYNAMIC_MAP_STORAGE_KEY = 'skst_dynamic_column_map_v1';\n\nfunction tokenSet(value: string): Set<string> {\n  return new Set(normalizeStr(value).split(' ').filter(Boolean));\n}\n\nfunction tokenSimilarity(a: string, b: string): number {\n  const A = tokenSet(a); const B = tokenSet(b);\n  if (!A.size || !B.size) return 0;\n  let inter = 0; A.forEach(t => { if (B.has(t)) inter++; });\n  const union = new Set([...A, ...B]).size;\n  return union ? inter / union : 0;\n}\n\nfunction compactHeader(value: string): string {\n  return normalizeStr(value).replace(/\\b(bao cao|chi tiet|thuc hien|phat sinh|hom nay|lu y ke|luy ke)\\b/g, ' ').replace(/\\s+/g, ' ').trim();\n}\n\nfunction loadDynamicColumnMap(): Record<string, string> {\n  try {\n    const raw = localStorage.getItem(DYNAMIC_MAP_STORAGE_KEY);\n    const parsed = raw ? JSON.parse(raw) : {};\n    return parsed && typeof parsed === 'object' ? parsed : {};\n  } catch { return {}; }\n}\n\nfunction learnColumnMapping(header: string, field: string): void {\n  if (typeof localStorage === 'undefined' || !header || !field) return;\n  try {\n    const map = loadDynamicColumnMap();\n    const key = compactHeader(header);\n    if (!key) return;\n    map[key] = field;\n    const keys = Object.keys(map);\n    if (keys.length > 250) delete map[keys[0]];\n    localStorage.setItem(DYNAMIC_MAP_STORAGE_KEY, JSON.stringify(map));\n  } catch { /* storage may be unavailable/private mode */ }\n}\n\n/**\n * Dynamic column resolver.\n * Priority: exact/prefix -> learned mapping -> token/fuzzy similarity.\n * This makes small BI header changes (spacing, accents, words such as \"báo cáo\",\n * \"thực hiện\", \"hôm nay\") resilient without requiring a code change.\n */\nexport function findColumnIndex(headers: string[], aliases: string[]): number {\n  const normHeaders = headers.map(h => normalizeStr(h));\n  const compactHeaders = headers.map(h => compactHeader(h));\n  const dynamicMap = loadDynamicColumnMap();\n\n  for (const alias of aliases) {\n    const normAlias = normalizeStr(alias);\n    const idx = normHeaders.findIndex(h => h === normAlias || h.startsWith(normAlias));\n    if (idx !== -1) { learnColumnMapping(headers[idx], alias); return idx; }\n  }\n\n  // Reuse mappings learned from previously successful imports.\n  for (let i = 0; i < compactHeaders.length; i++) {\n    const learned = dynamicMap[compactHeaders[i]];\n    if (!learned) continue;\n    const target = normalizeStr(learned);\n    if (aliases.some(a => normalizeStr(a) === target || normalizeStr(a).includes(target) || target.includes(normalizeStr(a)))) {\n      return i;\n    }\n  }\n\n  for (const alias of aliases) {\n    const normAlias = normalizeStr(alias);\n    const idx = normHeaders.findIndex(h => h.includes(normAlias));\n    if (idx !== -1) { learnColumnMapping(headers[idx], alias); return idx; }\n  }\n\n  // Fuzzy fallback: enough overlap to survive renamed/reordered BI headers.\n  let bestIdx = -1; let bestScore = 0;\n  for (let i = 0; i < compactHeaders.length; i++) {\n    for (const alias of aliases) {\n      const a = compactHeader(alias);\n      let score = tokenSimilarity(compactHeaders[i], a);\n      if (compactHeaders[i].includes(a) || a.includes(compactHeaders[i])) score += 0.18;\n      if (score > bestScore) { bestScore = score; bestIdx = i; }\n    }\n  }\n  if (bestIdx !== -1 && bestScore >= 0.52) {\n    learnColumnMapping(headers[bestIdx], aliases.reduce((a,b) => tokenSimilarity(headers[bestIdx], b) > tokenSimilarity(headers[bestIdx], a) ? b : a));\n    return bestIdx;\n  }\n  return -1;\n}\n\nexport function splitClipboardIntoGrid(\n  rawText: string,\n  preferredCategory?: keyof AppDataState | null\n): SplitResult {\n  const rawLines = rawText.split(/\\r?\\n/).filter(line => line.trim().length > 0);\n\n  if (rawLines.length === 0) {\n    return {\n      headers: [],\n      rows: [],\n      pageExtractedInfo: {\n        headerFoundAtLine: 0,\n        totalLinesScanned: 0,\n        ignoredNoiseLines: 0,\n        isFullPageExtracted: false,\n      },\n    };\n  }\n\n  // Check delimiter (Tab vs Semicolon vs Comma)\n  const tabCounts = rawLines.slice(0, 15).map(l => (l.match(/\\t/g) || []).length);\n  const avgTabs = tabCounts.reduce((a, b) => a + b, 0) / tabCounts.length;\n\n  let delimiter: string | RegExp = '\\t';\n  if (avgTabs < 1.5) {\n    const commaCounts = rawLines.slice(0, 15).map(l => (l.match(/,/g) || []).length);\n    const avgCommas = commaCounts.reduce((a, b) => a + b, 0) / commaCounts.length;\n    if (avgCommas >= 2) {\n      delimiter = ',';\n    }\n  }\n\n  const parsedLines = rawLines.map(line =>\n    line.split(delimiter).map(cell => cell.trim())\n  );\n\n  const commonHeaderKeywords = [\n    'ma', 'ten', 'sieu thi', 'don vi', 'target', 'doanh thu', 'quy doi',\n    'so luong', 'chuong trinh', 'nhan vien', 'tra gop', 'tb 3 thang'\n  ];\n\n  let bestHeaderIndex = -1;\n  let bestScore = -1;\n\n  for (let i = 0; i < parsedLines.length; i++) {\n    const row = parsedLines[i];\n    if (row.length < 2) continue;\n\n    const rowText = normalizeStr(row.join(' '));\n    let score = 0;\n\n    commonHeaderKeywords.forEach(kw => {\n      if (rowText.includes(kw)) score += 2;\n    });\n\n    if (row.length >= 4) score += row.length;\n\n    if (i + 1 < parsedLines.length) {\n      const nextRow = parsedLines[i + 1];\n      const nextRowStr = nextRow.join(' ');\n      if (/\\d+/.test(nextRowStr) && nextRow.length >= 2) {\n        score += 4;\n      }\n    }\n\n    if (score > bestScore && score >= 4) {\n      bestScore = score;\n      bestHeaderIndex = i;\n    }\n  }\n\n  if (bestHeaderIndex === -1) bestHeaderIndex = 0;\n\n  const rawHeaders = parsedLines[bestHeaderIndex] || [];\n  const rawDataLines = parsedLines.slice(bestHeaderIndex + 1);\n\n  const extractedRows: string[][] = [];\n  let ignoredNoiseLines = bestHeaderIndex;\n\n  for (let i = 0; i < rawDataLines.length; i++) {\n    const row = rawDataLines[i];\n    if (!row || row.length === 0) continue;\n\n    const rowStr = normalizeStr(row.join(' '));\n    if (\n      rowStr.startsWith('tong cong') ||\n      rowStr.startsWith('tong') ||\n      rowStr.startsWith('total')\n    ) {\n      ignoredNoiseLines++;\n      continue;\n    }\n\n    if (row.length >= 2 || (row.length === 1 && /\\d+/.test(row[0]))) {\n      extractedRows.push(row);\n    } else {\n      ignoredNoiseLines++;\n    }\n  }\n\n  return {\n    headers: rawHeaders,\n    rows: extractedRows,\n    pageExtractedInfo: {\n      headerFoundAtLine: bestHeaderIndex,\n      totalLinesScanned: rawLines.length,\n      ignoredNoiseLines,\n      isFullPageExtracted: bestHeaderIndex > 1,\n    },\n  };\n}\n\nexport function detectCategoryFromParsedData(\n  headers: string[],\n  rows: string[][]\n): keyof AppDataState | null {\n  const h = normalizeStr(headers.join(' '));\n  const sample = normalizeStr(rows.slice(0, 12).map(r => r.join(' ')).join(' '));\n  const score: Record<string, number> = {\n    dt_luyke: 0, dt_realtime: 0, td_luyke: 0, td_realtime: 0,\n    nv_tgdd: 0, nv_tz: 0, dt_nv_luyke: 0, dt_nv_realtime: 0,\n  };\n  const has = (x: string) => h.includes(normalizeStr(x));\n  const hasS = (x: string) => sample.includes(normalizeStr(x));\n  const rt = has('realtime') || has('hom nay') || hasS('realtime') || hasS('doanh thu rt');\n  const staff = has('ma nv') || has('ma nhan vien') || has('ten nhan vien') || has('nhan vien') || has('nguoi ban');\n  const program = has('chuong trinh') || has('ma ct') || has('loai td') || has('target theo loai');\n  const store = has('ma don vi') || has('ma dv') || has('ten don vi') || has('sieu thi') || hasS('aar dna hch') || hasS('tgd dna hch');\n  const qty = has('so luong') || has('sl') || has('qty');\n  const target = has('target') || has('muc tieu') || has('chi tieu');\n  const qd = has('quy doi') || has('doanh thu qd');\n  const rank = has('hang') || has('top bottom');\n\n  if (staff) {\n    score.dt_nv_luyke += 5; score.dt_nv_realtime += 5;\n    if (rt) score.dt_nv_realtime += 4; else score.dt_nv_luyke += 2;\n    if (program) { score.nv_tgdd += 4; score.nv_tz += 4; score.dt_nv_luyke -= 2; score.dt_nv_realtime -= 2; }\n    if (qd) { score.dt_nv_luyke += 2; score.dt_nv_realtime += 2; }\n  }\n  if (store) { score.dt_luyke += 5; score.dt_realtime += 5; if (rt) score.dt_realtime += 4; else score.dt_luyke += 2; }\n  if (program) { score.td_luyke += 6; score.td_realtime += 6; if (rt) score.td_realtime += 4; else score.td_luyke += 2; }\n  if (qty) { score.td_luyke += 1; score.td_realtime += 1; }\n  if (target) { score.dt_luyke += 1; score.dt_realtime += 1; score.td_luyke += 2; score.td_realtime += 2; }\n  if (rank) { score.td_luyke += 1; score.td_realtime += 1; }\n  if (hasS('topzone') || hasS('aar') || hasS('nguyen quynh anh') || hasS('170266')) { score.nv_tz += 6; score.nv_tgdd -= 2; }\n  if (hasS('tgdd') || hasS('tgd dna hch') || hasS('le van nhan') || hasS('204201')) { score.nv_tgdd += 6; score.nv_tz -= 2; }\n\n  const ranked = Object.entries(score).sort((a,b) => b[1]-a[1]);\n  if (!ranked.length || ranked[0][1] < 6) return null;\n  const margin = ranked[0][1] - (ranked[1]?.[1] || 0);\n  // Refuse ambiguous detection instead of silently loading the wrong port.\n  if (margin < 1.5 && !rt && !staff && !program && !store) return null;\n  return ranked[0][0] as keyof AppDataState;\n}\n\nexport function mapGridToCategoryData(\n  category: keyof AppDataState,\n  headers: string[],\n  rows: string[][],\n  pageExtractedInfo?: SplitResult['pageExtractedInfo']\n): ParseDiagnostics {\n  const recognizedColumns: { field: string; mappedHeader: string; sampleVal?: string }[] = [];\n  const missingColumns: string[] = [];\n\n  const getIdx = (field: string, aliases: string[]): number => {\n    const idx = findColumnIndex(headers, aliases);\n    if (idx !== -1) {\n      recognizedColumns.push({\n        field,\n        mappedHeader: headers[idx],\n        sampleVal: rows[0] ? rows[0][idx] : undefined,\n      });\n    } else {\n      missingColumns.push(field);\n    }\n    return idx;\n  };\n\n  const getCell = (row: string[], idx: number, fallback: any = '') => {\n    if (idx === -1 || !row || idx >= row.length) return fallback;\n    const v = row[idx];\n    return v !== undefined && v !== null ? v : fallback;\n  };\n\n  let formattedData: any[] = [];\n\n  switch (category) {\n    case 'dt_luyke':\n    case 'dt_realtime': {\n      const idxMa = getIdx('MÃ ĐƠN VỊ', ['ma don vi', 'ma dv', 'ma st', 'ma sieu thi', 'st', 'store id', 'ma']);\n      const idxTen = getIdx('TÊN ĐƠN VỊ', ['ten don vi', 'ten dv', 'ten st', 'ten sieu thi', 'sieu thi', 'don vi', 'ten']);\n      const idxTarget = getIdx('TARGET (TR)', ['target tr', 'target dt', 'target', 'muc tieu tr', 'chi tieu tr']);\n      const idxTargetQd = getIdx('TARGET QĐ (TR)', ['target qd tr', 'target qd', 'target quy doi']);\n      const idxDt = getIdx('DOANH THU (TR)', ['doanh thu tr', 'doanh thu', 'dt tr', 'dt', 'thuc hien']);\n      const idxDtQd = getIdx('DOANH THU QĐ (TR)', ['doanh thu qd tr', 'doanh thu qd', 'dt qd tr', 'dt qd', 'quy doi']);\n      const idxTraGop = getIdx('DT TRẢ GÓP (TR)', ['dt tra gop tr', 'dt tra gop', 'tra gop']);\n      const idxPctTraGop = getIdx('% TRẢ GÓP', ['pct tra gop', 'ti le tra gop', 'ty le tra gop', 'phan tram tra gop']);\n      const idxBill = getIdx('LƯỢT BILL (TẤT CẢ ST)', ['luot bill tat ca st', 'luot bill', 'bill', 'so bill']);\n      const idxQty = getIdx('SỐ LƯỢNG', ['so luong', 'sl', 'qty']);\n      const idxTb3 = getIdx('TB 3 THÁNG (TR)', ['tb 3 thang tr', 'tb 3 thang', 'tb 3t', 'tb3t']);\n      const idxDays = getIdx('SỐ NGÀY CỬA SỔ', ['so ngay cua so', 'so ngay', 'cua so']);\n\n      formattedData = rows.map((row, rIdx) => {\n        let maDv = getCell(row, idxMa, '');\n        let tenDv = getCell(row, idxTen, '');\n\n        if (!maDv && tenDv) {\n          const m = String(tenDv).match(/^(\\d{3,5})\\b/);\n          if (m) maDv = m[1];\n        }\n\n        const dt = parseFlexibleNumber(getCell(row, idxDt, 0));\n        const dtQd = idxDtQd !== -1 ? parseFlexibleNumber(getCell(row, idxDtQd, 0)) : 0;\n        const target = parseFlexibleNumber(getCell(row, idxTarget, 0));\n\n        // Never fabricate a store identity when the source row has no identity.\n        if (!String(maDv).trim() || !String(tenDv).trim()) return null;\n\n        return {\n          'MÃ ĐƠN VỊ': String(maDv).trim(),\n          'TÊN ĐƠN VỊ': String(tenDv).trim(),\n          'TARGET (TR)': target,\n          'TARGET QĐ (TR)': idxTargetQd !== -1 ? parseFlexibleNumber(getCell(row, idxTargetQd, 0)) : target,\n          'DOAN nst target = parseFlexibleNumber(getCell(row, idxTarget, 0));\n        const htThang = idxHt !== -1 ? parseFlexibleNumber(getCell(row, idxHt, 0)) : (target > 0 ? (dt / target) * 100 : 0);\n\n        return {\n          'MÃ CHƯƠNG TRÌNH': String(getCell(row, idxMaCt, '')).trim(),\n          'CHƯƠNG TRÌNH': String(getCell(row, idxTenCt, '')).trim(),\n          'LOẠI TĐ': loai,\n          'TARGET (TR/SL theo LOẠI TĐ)': target,\n          'DOANH THU (TR)': dt,\n          'DT QUY ĐỔI (TR)': dtQd,\n          'SỐ LƯỢNG': qty,\n          '% HT THÁNG': htThang,\n          '% DỰ BÁO': idxDb !== -1 ? parseFlexibleNumber(getCell(row, idxDb, 0)) : 0,\n          'HẠNG VÙNG': getCell(row, idxRank, ''),\n        };\n      });\n      break;\n    }\n\n    case 'dt_nv_luyke':\n    case 'dt_nv_realtime': {\n      const idxMaNv = getIdx('MÃ NHÂN VIÊN', ['ma nhan vien', 'ma nv', 'ma nhan su', 'ma so', 'user id', 'ma']);\n      const idxTenNv = getIdx('TÊN NHÂN VIÊN', ['ten nhan vien', 'ten nv', 'ho va ten', 'ho ten', 'nhan vien']);\n      const idxShop = getIdx('SIÊU THỊ', ['sieu thi', 'ten st', 'don vi', 'shop']);\n      const idxDt = getIdx('DOANH THU (TR)', ['doanh thu tr', 'doanh thu', 'dt']);\n      const idxDtQd = getIdx('DOANH THU QĐ (TR)', ['doanh thu qd tr', 'doanh thu quy doi', 'dt qd tr', 'dt qd', 'quy doi']);\n      const idxTraGop = getIdx('DT TRẢ GÓP (TR)', ['dt tra gop tr', 'dt tra gop', 'tra gop']);\n      const idxPctTraGop = getIdx('% TRẢ GÓP', ['pct tra gop', 'ti le tra gop', 'ty le tra gop', 'phan tram tra gop']);\n      const idxQty = getIdx('SỐ LƯỢNG', ['so luong', 'sl', 'qty']);\n\n      formattedData = rows.map((row, rIdx) => {\n        let maNv = getCell(row, idxMaNv, '');\n        let tenNv = getCell(row, idxTenNv, '');\n\n        if (!maNv && tenNv) {\n          const parenMatch = String(tenNv).match(/\\((\\d+)\\)/);\n          if (parenMatch) {\n            maNv = parenMatch[1];\n            tenNv = String(tenNv).replace(/\\(\\d+\\)/g, '').trim();\n          }\n        }\n        if (!maNv && row[0] && /^\\d{4,7}$/.test(String(row[0]).trim())) {\n          maNv = String(row[0]).trim();\n        }\n        if (!tenNv) return null;\n\n        const dt = parseFlexibleNumber(getCell(row, idxDt, 0));\n        const dtQd = idxDtQd !== -1 ? parseFlexibleNumber(getCell(row, idxDtQd, 0)) : 0;\n\n        let shop = getCell(row, idxShop, '');\n        if (!shop) {\n          shop = isTopzoneStaff(maNv) || isTopzoneStaff(tenNv) ? 'TopZone' : 'TGDĐ';\n        }\n\n        return {\n          'MÃ NHÂN VIÊN': String(maNv || '').trim(),\n          'TÊN NHÂN VIÊN': String(tenNv).trim(),\n          'SIÊU THỊ': shop,\n          'DOANH THU (TR)': dt,\n          'DOANH THU QĐ (TR)': dtQd,\n          'DT TRẢ GÓP (TR)': parseFlexibleNumber(getCell(row, idxTraGop, 0)),\n          '% TRẢ GÓP': idxPctTraGop !== -1 ? parseFlexibleNumber(getCell(row, idxPctTraGop, 0)) : 0,\n          'SỐ LƯỢNG': Math.round(parseFlexibleNumber(getCell(row, idxQty, 0))),\n        };\n      });\n      break;\n    }\n\n    case 'nv_tgdd':\n    case 'nv_tz': {\n      const idxMaNv = getIdx('MÃ NV', ['ma nv', 'ma nhan vien', 'ma so']);\n      const idxTenNv = getIdx('ĐƠN VỊ / NHÂN VIÊN', ['don vi nhan vien', 'ten nhan vien', 'ten nv', 'ho va ten', 'nhan vien']);\n      const idxMaCt = getIdx('MÃ CHƯƠNG TRÌNH', ['ma chuong trinh', 'ma ct']);\n      const idxTenCt = getIdx('CHƯƠNG TRÌNH', ['chuong trinh', 'ten chuong trinh', 'ten ct']);\n      const idxTarget = getIdx('TARGET (TR/SL theo LOẠI TĐ)', ['target tr sl theo loai td', 'target tr sl', 'target']);\n      const idxDt = getIdx('DOANH THU (TR)', ['doanh thu tr', 'doanh thu', 'dt']);\n      const idxDtQd = getIdx('DT QUY ĐỔI (TR)', ['dt quy doi tr', 'dt quy doi', 'dt qd tr', 'dtqd']);\n      const idxQty = getIdx('SỐ LƯỢNG', ['so luong', 'sl']);\n      const idxLoai = getIdx('LOẠI TĐ', ['loai td', 'loai']);\n      const idxHt = getIdx('% HT THÁNG', ['ht thang', 'ti le ht', 'hoan thanh']);\n      const idxRank = getIdx('HẠNG VÙNG', ['hang vung', 'hang']);\n\n      formattedData = rows.map((row, rIdx) => {\n        const dt = parseFlexibleNumber(getCell(row, idxDt, 0));\n        const dtQd = idxDtQd !== -1 ? parseFlexibleNumber(getCell(row, idxDtQd, 0)) : 0;\n        const qty = Math.round(parseFlexibleNumber(getCell(row, idxQty, 0)));\n        const loai = idxLoai !== -1 ? Math.round(parseFlexibleNumber(getCell(row, idxLoai, 0))) : 0;\n        const target = parseFlexibleNumber(getCell(row, idxTarget, 0));\n        const htThang = idxHt !== -1 ? parseFlexibleNumber(getCell(row, idxHt, 0)) : (target > 0 ? (dt / target) * 100 : 0);\n\n        return {\n          'MÃ NV': String(getCell(row, idxMaNv, '')),\n          'ĐƠN VỊ / NHÂN VIÊN': String(getCell(row, idxTenNv, `Nhân viên ${rIdx + 1}`)),\n          'MÃ CHƯƠNG TRÌNH': String(getCell(row, idxMaCt, '')).trim(),\n          'CHƯƠNG TRÌNH': String(getCell(row, idxTenCt, '')).trim(),\n          'LOẠI TĐ': loai,\n          'TARGET (TR/SL theo LOẠI TĐ)': target,\n          'DOANH THU (TR)': dt,\n          'DT QUY ĐỔI (TR)': dtQd,\n          'SỐ LƯỢNG': qty,\n          '% HT THÁNG': htThang,\n          'HẠNG VÙNG': getCell(row, idxRank, ''),\n        };\n      });\n      break;\n    }\n  }\n\n  const requiredCount = Math.max(1, recognizedColumns.length + missingColumns.length);\n  const confidence = Math.round((recognizedColumns.length / requiredCount) * 100);\n  const mappingMode: ParseDiagnostics['mappingMode'] = recognizedColumns.some(x => {\n    const exact = normalizeStr(x.mappedHeader) === normalizeStr(x.field);\n    return !exact;\n  }) ? 'fuzzy' : 'exact';\n\n  return {\n    category,\n    categoryName: CATEGORY_LABELS[category],\n    rowCount: formattedData.length,\n    recognizedColumns,\n    missingColumns,\n    data: formattedData,\n    mappingMode,\n    confidence,\n    pageExtractedInfo,\n  };\n}\n\n/**\n * Top-level Master Entrypoint for pasted data\n */\nfunction getDuplicateStoreCodes(rows: any[]): string[] {\n  const seen = new Set<string>();\n  const dup = new Set<string>();\n  for (const row of rows || []) {\n    const code = String(row?.['MÃ ĐƠN VỊ'] ?? '').trim();\n    if (!code) continue;\n    if (seen.has(code)) dup.add(code);\n    seen.add(code);\n  }\n  return Array.from(dup);\n}\n\nexport function parsePastedData(\n  rawText: string,\n  targetCategory?: keyof AppDataState | null,\n  context?: MwgDetectionContext\n): ParseDiagnostics | { error: string } {\n  if (!rawText || !rawText.trim()) {\n    return { error: 'Nội dung dán trống. Vui lòng kiểm tra lại clipboard!' };\n  }\n\n  const competitionText = normalizeCompetitionClipboard(rawText);\n  if (!targetCategory && /hang trong st/.test(normalizeStr(competitionText)) &&\n      !employeeCompetitionDestination(competitionText, context)) {\n    return { error: 'Đã nhận ra bảng thi đua nhân viên nhưng chưa đủ thông tin xác định shop. Anh chọn TGDĐ hoặc TopZone ở mục Loại dữ liệu, rồi lưu lại.' };\n  }\n\n  // 1. Prioritize MWG BI Direct Parser (Matches the real format provided by user)\n  const mwgResult = tryParseMwgBiFormat(rawText, targetCategory, context);\n  if (mwgResult && mwgResult.data.length > 0) {\n    return mwgResult;\n  }\n\n  // 2. Generic Tabular Grid Parser (for Excel / Google Sheets copies)\n  const { headers, rows, pageExtractedInfo } = splitClipboardIntoGrid(rawText, targetCategory);\n\n  if (rows.length > 0) {\n    let finalCategory: keyof AppDataState | null = targetCategory || null;\n\n    if (!finalCategory) {\n      finalCategory = detectCategoryFromParsedData(headers, rows);\n    }\n\n    if (finalCategory) {\n      return mapGridToCategoryData(finalCategory, headers, rows, pageExtractedInfo);\n    }\n  }\n\n  if (rows.length === 0) {\n    return {\n      error:\n        'Không tìm thấy dữ liệu bảng hợp lệ trong nội dung dán. Vui lòng copy từ báo cáo BI hoặc bảng tính Excel và dán lại.',\n    };\n  }\n\n  return {\n    error:\n      'Hệ thống chưa tự động nhận diện được loại dữ liệu này. Vui lòng chọn cụ thể mục dữ liệu ở thanh chọn bên trên.',\n  };\n}\n","src/views/TraChamView.tsx":"import { SortableTable } from '../components/SortableTable';\nimport React, { useEffect, useMemo, useRef, useState } from 'react';\nimport { Camera, CreditCard, Search, TrendingUp, Trophy, WalletCards, ArrowUp, ArrowDown, Eye, EyeOff } from 'lucide-react';\nimport { buildTraChamShopResolver, normalizeTraChamName } from '../utils/traChamShop';\nimport { AppDataState, PersonnelConfigMap } from '../types';\n\ninterface TraChamViewProps {\n  appData: AppDataState;\n  personnelConfig: PersonnelConfigMap;\n  onExportTab?: (storeLabel?: string, exportLayout?: 'stack' | 'screen') => void;\n}\n\nconst HIDDEN_STORAGE_KEY = 'skst_tracham_hidden_employees_v1';\n\nfunction loadHiddenSet(): Set<string> {\n  try {\n    const raw = localStorage.getItem(HIDDEN_STORAGE_KEY);\n    const arr = raw ? JSON.parse(raw) : [];\n    return new Set(Array.isArray(arr) ? arr : []);\n  } catch {\n    return new Set();\n  }\n}\n\nconst money = (v: any) => Number(v || 0).toLocaleString('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\nconst pct = (v: any) => Number(v || 0).toLocaleString('vi-VN', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';\nconst sources = [\n  ['PAYOO DT (TRIỆU)', 'Payoo', 'PAYOO %'],\n  ['HOME CREDIT (HC) DT (TRIỆU)', 'Home Credit', 'HOME CREDIT (HC) %'],\n  ['KIM NGÂN PAY DT (TRIỆU)', 'Kim Ngân Pay', 'KIM NGÂN PAY %'],\n  ['KREDIVO DT (TRIỆU)', 'KREDIVO', 'KREDIVO %'],\n  ['FE CREDIT (FE) DT (TRIỆU)', 'FE Credit', 'FE CREDIT (FE) %'],\n  ['SMARTPOS DT (TRIỆU)', 'SMARTPOS', 'SMARTPOS %'],\n  ['SAMSUNG FINANCE+ DT (TRIỆU)', 'Samsung Finance+', 'SAMSUNG FINANCE+ %'],\n] as const;\n\nexport const TraChamView: React.FC<TraChamViewProps> = ({ appData, personnelConfig, onExportTab }) => {\n  const [mode, setMode] = useState<'luyke' | 'realtime'>('luyke');\n  const [shop, setShop] = useState('ALL');\n  const shopLabel = shop === 'ALL' ? 'Tất cả' : shop === 'TGDD' ? 'TGDĐ' : 'TopZone';\n  const resolveShop = useMemo(() => buildTraChamShopResolver(appData, personnelConfig), [appData, personnelConfig]);\n  const [search, setSearch] = useState('');\n  const [hidden, setHidden] = useState<Set<string>>(() => loadHiddenSet());\n  const [showManage, setShowManage] = useState(false);\n  const managePanelRef = useRef<HTMLDivElement>(null);\n\n  const rows = mode === 'luyke' ? (appData.tra_cham_luyke || []) : (appData.tra_cham_realtime || []);\n\n  // Tùy Biến KPI Nhân Sự vẫn là nguồn ưu tiên để xác định đúng shop TGDĐ/TopZone.\n  // Riêng tab TẤT CẢ phải hiển thị mọi nhân sự có dữ liệu Trả Chậm; người dùng tự Ẩn/Hiện sau.\n  const activeRosterNames = useMemo(() => {\n    const set = new Set<string>();\n    for (const storeKey of ['TGDD', 'TOPZONE']) {\n      for (const [name, cfg] of Object.entries(personnelConfig?.[storeKey] || {})) {\n        if ((cfg as any)?.isVisible === false) continue;\n        const normalized = normalizeTraChamName(name);\n        if (normalized) set.add(normalized);\n      }\n    }\n    return set;\n  }, [personnelConfig]);\n\n  const hasConfiguredRoster = activeRosterNames.size > 0;\n  const rosterRows = useMemo(() => {\n    // \"Tất cả\" = toàn bộ nhân sự có dòng số liệu trong báo cáo Trả Chậm.\n    if (shop === 'ALL') return rows;\n    // Khi lọc từng shop, ưu tiên roster KPI để tránh kéo nhầm người từ shop còn lại.\n    return hasConfiguredRoster\n      ? rows.filter((r: any) => activeRosterNames.has(normalizeTraChamName(r['NHÂN VIÊN'] || r['TÊN NHÂN VIÊN'] || r['ĐƠN VỊ / NHÂN VIÊN'])))\n      : rows;\n  }, [rows, shop, activeRosterNames, hasConfiguredRoster]);\n\n  const excludedRosterCount = shop === 'ALL' ? 0 : Math.max(0, rows.length - rosterRows.length);\n  const shopRows = useMemo(() => rosterRows.filter((r: any) => shop === 'ALL' || resolveShop(r) === shop), [rosterRows, shop, resolveShop]);\n  const unknownCount = shop === 'ALL' ? 0 : rosterRows.filter((r: any) => !resolveShop(r)).length;\n  const hiddenCount = shopRows.filter((r: any) => hidden.has(String(r['NHÂN VIÊN'] || '').trim())).length;\n  const hasLk = (appData.tra_cham_luyke || []).length > 0;\n  const hasRt = (appData.tra_cham_realtime || []).length > 0;\n\n  // Ở tab TẤT CẢ, danh sách Ẩn/Hiện phải có toàn bộ nhân sự có số.\n  // Ở từng shop, chỉ hiện các nhân sự được xác định thuộc shop đó.\n  const allEmployeeNames = useMemo(() => {\n    const set = new Set<string>();\n    [...(appData.tra_cham_luyke || []), ...(appData.tra_cham_realtime || [])].forEach((r: any) => {\n      const normalized = normalizeTraChamName(r['NHÂN VIÊN'] || r['TÊN NHÂN VIÊN'] || r['ĐƠN VỊ / NHÂN VIÊN']);\n      if (shop !== 'ALL' && hasConfiguredRoster && !activeRosterNames.has(normalized)) return;\n      if (shop !== 'ALL' && resolveShop(r) !== shop) return;\n      const name = String(r['NHÂN VIÊN'] || '').trim();\n      if (name) set.add(name);\n    });\n    return Array.from(set).sort((a, b) => a.localeCompare(b, 'vi'));\n  }, [appData.tra_cham_luyke, appData.tra_cham_realtime, shop, resolveShop, activeRosterNames, hasConfiguredRoster]);\n\n  useEffect(() => {\n    try { localStorage.setItem(HIDDEN_STORAGE_KEY, JSON.stringify(Array.from(hidden))); } catch { /* ignore */ }\n  }, [hidden]);\n\n  useEffect(() => {\n    const handleClickOutside = (e: MouseEvent) => {\n      if (managePanelRef.current && !managePanelRef.current.contains(e.target as Node)) {\n        setShowManage(false);\n      }\n    };\n    if (showManage) document.addEventListener('mousedown', handleClickOutside);\n    return () => document.removeEventListener('mousedown', handleClickOutside);\n  }, [showManage]);\n\n  const toggleHidden = (name: string) => {\n    setHidden(prev => {\n      const next = new Set(prev);\n      if (next.has(name)) next.delete(name); else next.add(name);\n      return next;\n    });\n  };\n\n  // Chỉ những nhân viên đang hiện mới được tính vào các số liệu tổng hợp và bảng xếp hạng.\n  const visibleRows = useMemo(() => shopRows.filter((r: any) => !hidden.has(String(r['NHÂN VIÊN'] || '').trim())), [shopRows, hidden]);\n\n  const filtered = useMemo(() => visibleRows\n    .filter((r: any) => String(r['NHÂN VIÊN'] || '').toLowerCase().includes(search.toLowerCase().trim()))\n    .sort((a: any, b: any) => Number(b['DT TRẢ GÓP (TRIỆU)'] || 0) - Number(a['DT TRẢ GÓP (TRIỆU)'] || 0)), [visibleRows, search]);\n\n  const total = visibleRows.reduce((s: number, r: any) => s + Number(r['DT TRẢ GÓP (TRIỆU)'] || 0), 0);\n  const totalShop = visibleRows.reduce((s: number, r: any) => s + Number(r['DT SIÊU THỊ (TRIỆU)'] || 0), 0);\n  const avgShare = totalShop ? total / totalShop * 100 : 0;\n  const leader = filtered[0];\n  const sourceTotals = sources.map(([dtKey, name, pctKey]) => ({ name, value: visibleRows.reduce((s: number, r: any) => s + Number(r[dtKey] || 0), 0), share: total ? visibleRows.reduce((s: number, r: any) => s + Number(r[dtKey] || 0), 0) / total * 100 : 0, pctKey }));\n\n  return (\n    <div className=\"w-full h-full overflow-y-auto custom-scroll bg-slate-100 p-3 sm:p-5 space-y-4\">\n      <div className=\"max-w-[1500px] mx-auto space-y-4\">\n        <div className=\"bg-gradient-to-r from-indigo-700 via-blue-700 to-cyan-600 rounded-3xl p-5 sm:p-6 text-white shadow-lg shadow-blue-900/15\">\n          <div className=\"flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4\">\n            <div>\n              <div className=\"flex items-center gap-2 text-blue-100 text-[11px] font-black uppercase tracking-[0.16em]\"><CreditCard className=\"w-4 h-4\" /> Báo cáo trả chậm</div>\n              <h2 className=\"text-xl sm:text-2xl font-black tracking-tight mt-1\">Hiệu quả trả chậm theo nhân viên · {shopLabel}</h2>\n              <p className=\"text-xs sm:text-sm text-blue-100/90 mt-1\">Lũy kế là tổng tích lũy; Realtime là doanh thu trả chậm phát sinh trong ngày.</p>\n            </div>\n            <div className=\"flex items-center gap-2 flex-wrap\">\n              <div className=\"flex p-1 bg-white/15 rounded-xl border border-white/15\">\n                <button onClick={() => setMode('luyke')} disabled={!hasLk} className={`px-4 py-2 rounded-lg text-xs font-black transition ${mode === 'luyke' ? 'bg-white text-blue-800 shadow' : 'text-white hover:bg-white/10'} disabled:opacity-40`}>Lũy kế</button>\n                <button onClick={() => setMode('realtime')} disabled={!hasRt} className={`px-4 py-2 rounded-lg text-xs font-black transition ${mode === 'realtime' ? 'bg-white text-blue-800 shadow' : 'text-white hover:bg-white/10'} disabled:opacity-40`}>Realtime</button>\n              </div>\n              <div className=\"relative no-export\" ref={managePanelRef}>\n                <button onClick={() => setShowManage(v => !v)} className=\"inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-white/15 border border-white/15 text-white text-xs font-black hover:bg-white/25 transition\">\n                  <Eye className=\"w-4 h-4\" /> Ẩn/Hiện NV{hidden.size > 0 ? ` (${hidden.size})` : ''}\n                </button>\n                {showManage && (\n                  <div className=\"absolute right-0 top-full mt-2 w-72 max-h-96 overflow-y-auto custom-scroll bg-white rounded-2xl shadow-2xl border border-slate-200 p-3 z-30 text-slate-800\">\n                    <div className=\"flex items-center justify-between pb-2 mb-2 border-b border-slate-100\">\n                      <span className=\"text-xs font-black text-slate-700\">Hiển thị nhân viên ({allEmployeeNames.filter(name => !hidden.has(name)).length}/{allEmployeeNames.length})</span>\n                      {hidden.size > 0 && (\n                        <button onClick={() => setHidden(prev => new Set([...prev].filter(name => !allEmployeeNames.includes(name))))} className=\"text-[11px] font-bold text-blue-600 hover:underline\">Hiện tất cả</button>\n                      )}\n                    </div>\n                    <div className=\"space-y-1\">\n                      {allEmployeeNames.map(name => {\n                        const isHidden = hidden.has(name);\n                        return (\n                          <button\n                            key={name}\n                            onClick={() => toggleHidden(name)}\n                            className={`w-full flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-xl text-xs font-semibold transition ${isHidden ? 'bg-slate-50 text-slate-400' : 'bg-blue-50/60 text-slate-800 hover:bg-blue-50'}`}\n                          >\n                            <span className=\"truncate\">{name}</span>\n                            {isHidden ? <EyeOff className=\"w-3.5 h-3.5 flex-shrink-0\" /> : <Eye className=\"w-3.5 h-3.5 flex-shrink-0 text-blue-600\" />}\n                          </button>\n                        );\n                      })}\n                      {!allEmployeeNames.length && <p className=\"text-[11px] text-slate-400 text-center py-3\">Chưa có dữ liệu nhân viên.</p>}\n                    </div>\n                  </div>\n                )}\n              </div>\n              {onExportTab && <button onClick={() => onExportTab(`TraCham_${shop}`, 'stack')} className=\"inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-white text-blue-800 text-xs font-black shadow hover:bg-blue-50\"><Camera className=\"w-4 h-4\" /> Xuất ảnh</button>}\n            </div>\n          </div>\n        </div>\n\n        <div className=\"flex flex-wrap items-center gap-2\" role=\"group\" aria-label=\"Lọc trả chậm theo shop\">\n          {[['ALL', 'Tất cả'], ['TGDD', 'TGDĐ'], ['TOPZONE', 'TopZone']].map(([key, label]) => <button key={key} aria-pressed={shop === key} onClick={() => setShop(key)} className={`px-5 py-2.5 rounded-xl text-sm font-black border transition ${shop === key ? 'bg-blue-700 text-white border-blue-700 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-blue-50'}`}>{label}</button>)}\n        </div>\n        {excludedRosterCount > 0 && <p className=\"text-xs t  0 ? ` (đang ẩn ${hiddenCount})` : ''}</div></div>\n          <div className=\"rounded-2xl bg-white border border-violet-100 p-4 shadow-sm\"><div className=\"text-[10px] font-black text-slate-400 uppercase\">Dẫn đầu</div><div className=\"text-lg font-black text-violet-700 mt-1 truncate\">{leader?.['NHÂN VIÊN'] || '—'}</div><div className=\"text-[10px] text-slate-400 mt-1\">{leader ? `${money(leader['DT TRẢ GÓP (TRIỆU)'])} TR` : 'Chưa có dữ liệu'}</div></div>\n        </div>\n\n        {!rows.length && <div className=\"bg-white border border-dashed border-slate-300 rounded-3xl p-10 text-center\"><WalletCards className=\"w-10 h-10 mx-auto text-slate-300\" /><div className=\"font-black text-slate-700 mt-3\">Chưa có dữ liệu Trả Chậm</div><p className=\"text-xs text-slate-400 mt-1\">Nhấn “Nạp dữ liệu” → Ctrl+A → Ctrl+C toàn bộ trang Báo cáo trả chậm trên BI → dán vào hệ thống.</p></div>}\n\n        {!!rows.length && <>\n          <div className=\"bg-white rounded-3xl border border-slate-200 shadow-sm p-4\">\n            <div className=\"flex flex-col md:flex-row md:items-center justify-between gap-3 mb-3\">\n              <div><h3 className=\"font-black text-slate-900 text-sm\">Nguồn tài chính</h3><p className=\"text-[10px] text-slate-400\">Tổng doanh thu trả chậm theo từng đối tác trong {mode === 'luyke' ? 'lũy kế' : 'ngày'}.</p></div>\n              <div className=\"relative w-full md:w-64\"><Search className=\"absolute left-3 top-2.5 w-4 h-4 text-slate-400\" /><input value={search} onChange={e => setSearch(e.target.value)} placeholder=\"Tìm nhân viên...\" className=\"w-full pl-9 pr-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-xs font-semibold outline-none focus:ring-2 focus:ring-blue-500\" /></div>\n            </div>\n            <div className=\"grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-2.5\">\n              {sourceTotals.map((s, i) => <div key={s.name} className={`rounded-2xl p-3 border ${s.value > 0 ? 'bg-blue-50/60 border-blue-100' : 'bg-sl useRef } from 'react';\nimport { Chart as ChartJS, registerables } from 'chart.js';\nimport { Camera, Eye, EyeOff, Sparkles, Trophy, ArrowRightLeft, Search, BarChart3, Table2 } from 'lucide-react';\nimport { AppDataState, CompetitionRow } from '../types';\nimport { useStretchGoalPct } from '../utils/stretchGoal';\nimport {\n  formatCurrency,\n  formatInt,\n  formatPercent,\n  formatProgramName,\n  cleanCode,\n  cleanProgName,\n  getCellNumber\n} from '../utils/formatters';\n\nChartJS.register(...registerables);\n\nconst formatReportDisplayNumber = (value: number | string) => {\n  const num = Number(value);\n  if (!Number.isFinite(num)) return '0';\n  return Number.isInteger(num)\n    ? num.toLocaleString('vi-VN', { maximumFractionDigits: 0 })\n    : num.toLocaleString('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n};\n\n\ninterface BaoCaoCuoiNgayViewProps {\n  appData: AppDataState;\n  onExportTab: (storeLabel?: string, exportLayout?: 'stack' | 'screen') => void;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n}\n\nexport const BaoCaoCuoiNgayView: React.FC<BaoCaoCuoiNgayViewProps> = ({\n  appData,\n  onExportTab,\n  onOpenProgramDetail,\n}) => {\n  const [revenueMode, setRevenueMode] = useState<'QD' | 'THUC'>('QD');\n  const [donutMode, setDonutMode] = useState<'RT' | 'LK'>('RT');\n  const [isSplitTable, setIsSplitTable] = useState<boolean>(false);\n  const [splitStoreKey, setSplitStoreKey] = useState<'TGDD' | 'TOPZONE'>('TGDD');\n  const [searchTerm, setSearchTerm] = useState<string>('');\n  const [stretchGoalPct] = useStretchGoalPct();\n\n  // Toggles for charts, KPI cards & data tables\n  const [showCharts, setShowCharts] = useState<boolean>(true);\n  const [showKpiCards, setShowKpiCards] = useState<boolean>(true);\n  const [showDataTables, setShowDataTables] = useState<boolean>(true);\n  const [exportLayout, setExportLayout] = useState<'stack' | 'screen'>('screen');\n\n  const barCanvasRef = useRef<HTMLCanvasElement>(null);\n  const donutTdRef = useRef<HTMLCanvasElement>(null);\n  const donutCatRef = useRef<HTMLCanvasElement>(null);\n\n  const barChartInstance = useRef<ChartJS | null>(null);\n  const donutTdInstance = useRef<ChartJS | null>(null);\n  const donutCatInstance = useRef<ChartJS | null>(null);\n\n\n  const isQd = revenueMode === 'QD';\n\n  // 1. Calculate Store & Cluster Revenue Stats\n  const lk = appData.dt_luyke || [];\n  const rt = appData.dt_realtime || [];\n\n  const rowAarLk = lk.find(r => String(r['MÃ ĐƠN VỊ']) === '10341' || String(r['TÊN ĐƠN VỊ']).includes('AAR')) || {};\n  const rowAarRt = rt.find(r => String(r['MÃ ĐƠN VỊ']) === '10341' || String(r['TÊN ĐƠN VỊ']).includes('AAR')) || {};\n  const rowTgdLk = lk.find(r => String(r['MÃ ĐƠN VỊ']) === '933' || String(r['TÊN ĐƠN VỊ']).includes('TGD')) || {};\n  const rowTgdRt = rt.find(r => String(r['MÃ ĐƠN VỊ']) === '933' || String(r['TÊN ĐƠN VỊ']).includes('TGD')) || {};\n\n  const aar_rt = isQd ? (parseFloat(String(rowAarRt['DOANH THU QĐ (TR)'])) || 0) : (parseFloat(String(rowAarRt['DOANH THU (TR)'])) || 0);\n  const aar_lk = isQd ? (parseFloat(String(rowAarLk['DOANH THU QĐ (TR)'])) || 0) : (parseFloat(String(rowAarLk['DOANH THU (TR)'])) || 0);\n  const aar_chot = aar_lk + aar_rt;\n  const aar_tg = isQd ? (parseFloat(String(rowAarLk['TARGET QĐ (TR)'])) || parseFloat(String(rowAarLk['TARGET (TR)'])) || 0) : (parseFloat(String(rowAarLk['TARGET (TR)'])) || 0);\n  const aar_pct_ht = aar_tg > 0 ? (aar_chot / aar_tg * 100) : 0;\n\n  const tgd_rt = isQd ? (parseFloat(String(rowTgdRt['DOANH THU QĐ (TR)'])) || 0) : (parseFloat(String(rowTgdRt['DOANH THU (TR)'])) || 0);\n  const tgd_lk = isQd ? (parseFloat(String(rowTgdLk['DOANH THU QĐ (TR)'])) || 0) : (parseFloat(String(rowTgdLk['DOANH THU (TR)'])) || 0);\n  const tgd_chot = tgd_lk + tgd_rt;\n  const tgd_tg = isQd ? (parseFloat(String(rowTgdLk['TARGET QĐ (TR)'])) || parseFloat(String(rowTgdLk['TARGET (TR)'])) || 0) : (parseFloat(String(rowTgdLk['TARGET (TR)'])) || 0);\n  const tgd_pct_ht = tgd_tg > 0 ? (tgd_chot / tgd_tg * 100) : 0;\n\n  const cum_rt = aar_rt + tgd_rt;\n  const cum_lk = aar_lk + tgd_lk;\n  const cum_chot = aar_chot + tgd_chot;\n  const cum_tg = aar_tg + tgd_tg;\n  const cum_pct_ht = cum_tg > 0 ? (cum_chot / cum_tg * 100) : 0;\n\n  // Báo cáo cuối ngày phải dùng cùng Mục tiêu bứt phá toàn hệ thống như màn Dự Báo.\n  const stretchFactor = stretchGoalPct / 100;\n  const aar_stretch_tg = aar_tg * stretchFactor;\n  const tgd_stretch_tg = tgd_tg * stretchFactor;\n  const cum_stretch_tg = cum_tg * stretchFactor;\n  const aar_pct_stretch = aar_stretch_tg > 0 ? (aar_chot / aar_stretch_tg * 100) : 0;\n  const tgd_pct_stretch = tgd_stretch_tg > 0 ? (tgd_chot / tgd_stretch_tg * 100) : 0;\n  const cum_pct_stretch = cum_stretch_tg > 0 ? (cum_chot / cum_stretch_tg * 100) : 0;\n  const cum_gap_stretch = Math.max(0, cum_stretch_tg - cum_chot);\n\n  // BI's LK forecast is based on the accumulated amount only (not today's RT).\n  // The end-of-day target gap, however, must use LK + RT and the days remaining\n  // after the current trading day.\n  const daysElapsedLk = Math.max(1, Math.max(\n    parseFloat(String(rowAarLk['SỐ NGÀY CỬA SỔ'])) || 0,\n    parseFloat(String(rowTgdLk['SỐ NGÀY CỬA SỔ'])) || 0\n  ));\n  const hasRealtime = rt.some(r =>\n    String(r['MÃ ĐƠN VỊ'] || '').trim() === '10341' ||\n    String(r['MÃ ĐƠN VỊ'] || '').trim() === '933' ||\n    String(r['TÊN ĐƠN VỊ'] || '').includes('AAR_DNA_HCH') ||\n    String(r['TÊN ĐƠN VỊ'] || '').includes('TGD_DNA_HCH')\n  );\n  const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();\n  const currentDay = Math.min(daysInMonth, daysElapsedLk + (hasRealtime ? 1 : 0));\n  const daysRemaining = Math.max(1, daysInMonth - currentDay);\n  const aar_dubao = aar_lk * daysInMonth / daysElapsedLk;\n  const tgd_dubao = tgd_lk * daysInMonth / daysElapsedLk;\n  const cum_dubao = cum_lk * daysInMonth / daysElapsedLk;\n  const aar_can_chay = Math.max(0, aar_stretch_tg - aar_chot) / daysRemaining;\n  const tgd_can_chay = Math.max(0, tgd_stretch_tg - tgd_chot) / daysRemaining;\n  const cum_can_chay = Math.max(0, cum_stretch_tg - cum_chot) / daysRemaining;\n  const aar_tragop_pct = parseFloat(String(rowAarLk['% TRẢ GÓP'])) || (parseFloat(String(rowAarLk['DOANH THU (TR)'])) > 0 ? (parseFloat(String(rowAarLk['DT TRẢ GÓP (TR)'])) || 0) / parseFloat(String(rowAarLk['DOANH THU (TR)'])) * 100 : 0);\n  const tgd_tragop_pct = parseFloat(String(rowTgdLk['% TRẢ GÓP'])) || (parseFloat(String(rowTgdLk['DOANH THU (TR)'])) > 0 ? (parseFloat(String(rowTgdLk['DT TRẢ GÓP (TR)'])) || 0) / parseFloat(String(rowTgdLk['DOANH THU (TR)'])) * 100 : 0);\n  const cum_tragop_pct = (cum_lk > 0) ? (((parseFloat(String(rowAarLk['DT TRẢ GÓP (TR)'])) || 0) + (parseFloat(String(rowTgdLk['DT TRẢ GÓP (TR)'])) || 0)) / cum_lk * 100) : 0;\n\n  // 2. Extract programs for each store\n  const td_lk = appData.td_luyke || [];\n  const td_rt = appData.td_realtime || [];\n\n  // Chuẩn hóa khóa ghép giống màn hình Thi Đua Siêu Thị để Báo Cáo Cuối Ngày\n  // luôn lấy đúng Realtime theo shop + chương trình, kể cả khi BI đổi cách ghi tên/mã.\n  const cleanJoinKey = (value: any) => String(value ?? '')\n    .toLowerCase()\n    .normalize('NFD')\n    .replace(/[\\u0300-\\u036f]/g, '')\n    .replace(/[^a-z0-9]+/g, ' ')\n    .trim();\n\n  const sameProgram = (a: any, b: any) => {\n    const codeA = cleanJoinKey(a?.['MÃ CHƯƠNG TRÌNH']);\n    const codeB = cleanJoinKey(b?.['MÃ CHƯƠNG TRÌNH']);\n    if (codeA && codeB && codeA === codeB) return true;\n    const nameA = cleanJoinKey(a?.['CHƯƠNG TRÌNH']);\n    const nameB = cleanJoinKey(b?.['CHƯƠNG TRÌNH']);\n    return !!nameA && !!nameB && nameA === nameB;\n  };\n\n  const sameStore = (r: any, storeKeyword: string) => {\n    const shop = cleanJoinKey(r?.['ĐƠN VỊ / NHÂN VIÊN'] || r?.['TÊN ĐƠN VỊ']);\n    const code = cleanJoinKey(r?.['MÃ ĐƠN VỊ']);\n    if (storeKeyword === 'TGD') return shop.includes('tgd') || code === '933';\n    return shop.includes('aar') || shop.includes('topzone') || code === '10341';\n  };\n\n  // Một môn có thể xuất hiện nhiều dòng trong RT. Cộng dồn tất cả dòng đúng shop/môn\n  // thay vì find() lấy dòng đầu tiên. Đây cũng là cách màn hình Thi Đua Siêu Thị\n  // xác định dữ liệu RT thực tế.\n  const getRealtimeRows = (lkRow: CompetitionRow, storeKeyword: string) =>\n    td_rt.filter(r => sameStore(r, storeKeyword) && sameProgram(lkRow, r));\n\n  const getRealtimeValue = (lkRow: CompetitionRow, storeKeyword: string) => {\n    const rows = getRealtimeRows(lkRow, storeKeyword);\n    const loai = Number(lkRow['LOẠI TĐ']) || Number(rows[0]?.['LOẠI TĐ']) || 3;\n    const isQty = loai === 2 || loai === 6;\n    if (isQty) {\n      return { value: rows.reduce((sum, r) => sum + (parseFloat(String(r['SỐ LƯỢNG'])) || 0), 0), hasRt: rows.length > 0, isQty };\n    }\n    const value = rows.reduce((sum, r) => {\n      // BI có phiên bản chỉ trả DOANH THU (TR), có phiên bản trả thêm DT QUY ĐỔI (TR).\n      // Nếu QĐ không có/không hợp lệ thì dùng DOANH THU để không làm mất RT.\n      const qd = parseFloat(String(r['DT QUY ĐỔI (TR)']));\n      const thuc = parseFloat(String(r['DOANH THU (TR)']));\n      return sum + (Number.isFinite(qd) && qd !== 0 ? qd : (Number.isFinite(thuc) ? thuc : 0));\n    }, 0);\n    return { value, hasRt: rows.length > 0, isQty };\n  };\n\n  const getStorePrograms = (storeKeyword: string) => {\n    return td_lk.filter(r => sameStore(r, storeKeyword) && (parseFloat(String(r['TARGET (TR/SL theo LOẠI TĐ)'])) || 0) > 0);\n  };\n\n  const tgdProgs = getStorePrograms('TGD');\n  const aarProgs = getStorePrograms('AAR');\n\n  // Count done programs\n  let totalDoneCount = 0;\n  const countDone = (progs: CompetitionRow[], storeKeyword: string) => {\n    let count = 0;\n    progs.forEach(p => {\n      const pCode = cleanCode(p['MÃ CHƯƠNG TRÌNH']);\n      const pName = cleanProgName(p['CHƯƠNG TRÌNH']);\n      const target = parseFloat(String(p['TARGET (TR/SL theo LOẠI TĐ)'])) || 0;\n      const loai = p['LOẠI TĐ'];\n\n      // p itself is the exact Lũy kế row already filtered for this store.\n      const lkMatch = p;\n      const rtInfo = getRealtimeValue(lkMatch, storeKeyword);\n      const rtMatch = rtInfo.hasRt ? td_rt.find(r => sameStore(r, storeKeyword) && sameProgram(lkMatch, r)) : undefined;\n\n      let valLk = (parseFloat(String(lkMatch['DOANH THU (TR)'])) || 0);\n      if (loai === 2 || loai === 6) {\n        valLk = parseFloat(String(lkMatch['SỐ LƯỢNG'])) || 0;\n      } else if (loai === 3) {\n        const qdLk = parseFloat(String(lkMatch['DT QUY ĐỔI (TR)']));\n        if (Number.isFinite(qdLk) && qdLk !== 0) valLk = qdLk;\n      }\n      const valRt = rtInfo.value;\n\n      const chot = valLk + valRt;\n      const pct = target > 0 ? (chot / target * 100) : 0;\n      if (pct >= 100) count++;\n    });\n    return count;\n  };\n\n  const tgdDone = countDone(tgdProgs, 'TGD');\n  const aarDone = countDone(aarProgs, 'AAR');\n  const allProgsCount = tgdProgs.length + aarProgs.length;\n  totalDoneCount = tgdDone + aarDone;\n\n  // 3. Render Charts\n  useEffect(() => {\n    if (!showCharts) {\n      barChartInstance.current?.destroy();\n      donutTdInstance.current?.destroy();\n      donutCatInstance.current?.destroy();\n      return;\n    }\n\n    // Bar Chart\n    if (barCanvasRef.current) {\n      if (barChartInstance.current) barChartInstance.current.destroy();\n      barChartInstance.current = new ChartJS(barCanvasRef.current, {\n        type: 'bar',\n        data: {\n          labels: ['AAR NHT', 'TGD NHT'],\n          datasets: [\n            {\n              label: 'Realtime Hôm Nay',\n              data: [aar_rt, tgd_rt],\n              backgroundColor: '#f59e0b',\n              borderRadius: 6,\n            },\n            {\n              label: 'Luỹ Kế Đầu Ngày',\n              data: [aar_lk, tgd_lk],\n              backgroundColor: '#3b82f6',\n              borderRadius: 6,\n            },\n            {\n              label: 'Target Tháng',\n              data: [aar_tg, tgd_tg],\n              backgroundColor: '#cbd5e1',\n              borderRadius: 6,\n            }\n          ]\n        },\n        options: {\n          responsive: true,\n          maintainAspectRatio: false,\n          plugins: {\n            legend: { position: 'top', labels: { boxWidth: 10, font: { size: 10, weight: 'bold' } } },\n          },\n          scales: {\n            x: { ticks: { font: { size: 10, weight: 'bold' } } },\n            y: { beginAtZero: true, ticks: { font: { size: 9 } } },\n          }\n        }\n      });\n    }\n\n    // Donut Thi Đua\n    if (donutTdRef.current) {\n      if (donutTdInstance.current) donutTdInstance.current.destroy();\n      let done = 0;\n      let near = 0;\n      let bottom = 0;\n\n      td_lk.forEach(r => {\n        const pct = parseFloat(String(r['% HT THÁNG'])) || 0;\n        if (pct >= 100) done++;\n        else if (pct >= 80) near++;\n        else bottom++;\n      });\n\n      donutTdInstance.current = new ChartJS(donutTdRef.current, {\n        type: 'doughnut',\n        data: {\n          labels: ['Về Số (≥100%)', 'Gần Về (80-100%)', 'Bottom (<80%)'],\n          datasets: [\n            {\n              data: [done || 12, near || 8, bottom || 16],\n              backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],\n            }\n          ]\n        },\n        options: {\n          responsive: true,\n          maintainAspectRatio: false,\n          plugins: {\n            legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }\n          }\n        }\n      });\n    }\n\n    // Donut Top Ngành Hàng\n    if (donutCatRef.current) {\n      if (donutCatInstance.current) donutCatInstance.current.destroy();\n      donutCatInstance.current = new ChartJS(donutCatRef.current, {\n        type: 'doughnut',\n        data: {\n          labels: ['Điện thoại', 'Laptop', 'Đồng hồ', 'Phụ kiện', 'Gia dụng', 'Khác'],\n          datasets: [\n            {\n              data: donutMode === 'RT' ? [54, 18, 12, 8, 5, 3] : [48, 22, 14, 9, 4, 3],\n              backgroundColor: ['#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#64748b'],\n            }\n          ]\n        },\n        options: {\n          responsive: true,\n          maintainAspectRatio: false,\n          plugins: {\n            legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 9 } } }\n          }\n        }\n      });\n    }\n\n    return () => {\n      barChartInstance.current?.destroy();\n      donutTdInstance.current?.destroy();\n      donutCatInstance.current?.destroy();\n    };\n  }, [aar_rt, tgd_rt, aar_lk, tgd_lk, aar_tg, tgd_tg, donutMode, td_lk, showCharts]);\n\n  // Helper to render side competition table\n  const renderSideTableRows = (progs: CompetitionRow[], storeKeyword: string) => {\n    return progs\n      .filter(p => {\n        if (!searchTerm) return true;\n        const name = p['CHƯƠNG TRÌNH'] || '';\n        return (\n          name.toLowerCase().includes(searchTerm.toLowerCase()) ||\n          formatProgramName(name).toLowerCase().includes(searchTerm.toLowerCase())\n        );\n      })\n      .map((p, idx) => {\n        const pCode = cleanCode(p['MÃ CHƯƠNG TRÌNH']);\n        const pName = p['CHƯƠNG TRÌNH'] || '';\n        const target = parseFloat(String(p['TARGET (TR/SL theo LOẠI TĐ)'])) || 0;\n        const loai = Number(p['LOẠI TĐ']) || 3;\n\n        // IMPORTANT: p is already the exact Lũy kế row from td_luyke for this store.\n        // Do not search td_luyke again by program name/code: duplicate program names\n        // across shops (or stale/demo rows) can otherwise make AAR/TGD pick the wrong row.\n        const lkMatch = p;\n        const rtInfo = getRealtimeValue(lkMatch, storeKeyword);\n        const rtMatch = rtInfo.hasRt ? td_rt.find(r => sameStore(r, storeKeyword) && sameProgram(lkMatch, r)) : undefined;\n\n        let valLk = (parseFloat(String(lkMatch['DOANH THU (TR)'])) || 0);\n        if (loai === 2 || loai === 6) {\n          valLk = parseFloat(String(lkMatch['SỐ LƯỢNG'])) || 0;\n        } else if (loai === 3) {\n          const qdLk = parseFloat(String(lkMatch['DT QUY ĐỔI (TR)']));\n          if (Number.isFinite(qdLk) && qdLk !== 0) valLk = qdLk;\n        }\n        const valRt = rtInfo.value;\n\n        const chot = valLk + valRt;\n        const pctHt = target > 0 ? (chot / target * 100) : 0;\n        const gap = Math.max(0, target - chot);\n\n        let badge = (\n          <span className=\"px-2 py-0.5 rounded bg-rose-100 text-rose-800 text-[10px] font-black\">\n            Bottom\n          </span>\n        );\n        if (pctHt >= 100) {\n          badge = (\n            <span className=\"px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[10px] font-black\">\n              Về Số\n            </span>\n          );\n        } else if (pctHt >= 80) {\n          badge = (\n            <span className=\"px-2 py-0.5 rounded bg-amber-100 text-amber-800 text-[10px] font-black\">\n              Gần Về\n            </span>\n          );\n        }\n\n        const isQty = loai === 2 || loai === 6;\n\n        return (\n          <tr\n            key={idx}\n            onClick={() => onOpenProgramDetail(storeKeyword === 'AAR' ? 'TopZone' : 'TGDĐ', pCode, pName)}\n            title=\"Bấm để xem chi tiết nhân viên bán môn này\"\n            className={`hover:bg-blue-50/70 cursor-pointer transition border-b border-slate-100 ${\n              pctHt >= 100 ? 'bg-emerald-50/20' : ''\n            }`}\n          >\n                        <td className=\"py-2.5 px-2 w-[150px] min-w-[150px] max-w-[150px] font-bold text-slate-900 whitespace-normal break-words\" title={pName}>\n              {formatProgramName(pName)}\n            </td>\n            <td className=\"py-2.5 px-1 w-[38px] min-w-[38px] max-w-[38px] text-center text-[10px] text-slate-500 font-black\" data-sort-value={isQty ? ('SL') : ('DT')}>\n              {isQty ? 'SL' : 'DT'}\n            </td>\n            <td className=\"py-2.5 px-2 text-right font-mono text-slate-700\" data-sort-value={isQty ? (valLk) : (valLk)}>\n              {isQty ? formatInt(valLk) : formatReportDisplayNumber(valLk)}\n            </td>\n            <td className=\"py-2.5 px-2 text-right font-mono font-bold text-blue-600\" data-sort-value={isQty ? (valRt) : (valRt)}>\n              {isQty ? formatInt(valRt) : formatReportDisplayNumber(valRt)}\n            </td>\n            <td className=\"py-2.5 px-2 text-right font-mono font-black text-slate-900 bg-amber-50/50\" data-sort-value={isQty ? (chot) : (chot)}>\n              {isQty ? formatInt(chot) : formatReportDisplayNumber(chot)}\n            </td>\n            <td className=\"py-2.5 px-2 text-right font-mono text-slate-500\" data-sort-value={isQty ? (target) : (target)}>\n              {isQty ? formatInt(target) : formatReportDisplayNumber(target)}\n            </td>\n            <td\n              className={`py-2.5 px-2 text-center font-black ${\n                pctHt >= 100\n                  ? 'text-emerald-700'\n                  : pctHt >= 80\n                  ? 'text-amber-700'\n                  : 'text-rose-600'\n              }`}\n             data-sort-value={pctHt}>\n              {formatPercent(pctHt)}\n            </td>\n            <td className=\"py-2.5 px-2 text-right font-mono font-bold text-rose-600\" data-sort-value={isQty ? (gap) : (gap)}>\n              {isQty ? formatInt(gap) : formatReportDisplayNumber(gap)}\n            </td>\n            <td className=\"py-2.5 px-2 text-center\">{badge}</td>\n          </tr>\n        );\n      });\n  };\n\n  return (\n    <div className=\"space-y-6\">\n      {/* 1. Header Banner */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col gap-3\">\n        <div>\n          <div className=\"flex items-center space-x-2 mb-1\">\n            <span className=\"px-2.5 py-0.5 bg-amber-500 text-white
