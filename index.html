nsition flex items-center gap-2 cursor-pointer whitespace-nowrap\"\n              title={exportLayout === 'screen' ? 'Xuất ảnh theo bố cục màn hình: TGD trái / AAR phải' : 'Xuất ảnh theo bố cục dọc: TGD trên / AAR dưới'}\n            >\n              <Camera className=\"w-4 h-4\" />\n              <span>Xuất Ảnh Báo Cáo</span>\n            </button>\n          </div>\n        </div>\n      </div>\n\n      {/* 2. Green Sync Status Banner — chỉ hiển thị trên giao diện, không đưa vào ảnh báo cáo */}\n      <div className=\"no-export bg-emerald-50/90 border border-emerald-200 rounded-2xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3\">\n        <div className=\"flex items-center space-x-2.5\">\n          <span className=\"w-6 h-6 rounded-lg bg-emerald-600 text-white flex items-center justify-center font-black text-xs shadow-xs\">\n            ✓\n          </span>\n          <div>\n            <span className=\"font-extrabold text-emerald-950 text-xs uppercase block\">\n              ĐÃ ĐỒNG BỘ ĐẦY ĐỦ 4 NGUỒN DỮ LIỆU CHỐT CUỐI NGÀY\n            </span>\n            <span className=\"text-[11px] text-emerald-700 font-medium\">\n              Đối chiếu chính xác số liệu chốt Luỹ kế & Doanh thu Realtime trong ngày\n            </span>\n          </div>\n        </div>\n        <div className=\"flex flex-wrap items-center gap-1.5 text-[11px] font-bold text-emerald-800\">\n          <span className=\"px-2.5 py-1 bg-white rounded-lg border border-emerald-200 shadow-2xs\">✓ 1. DT Luỹ Kế</span>\n          <span className=\"px-2.5 py-1 bg-white rounded-lg border border-emerald-200 shadow-2xs\">✓ 2. DT Realtime</span>\n          <span className=\"px-2.5 py-1 bg-white rounded-lg border border-emerald-200 shadow-2xs\">✓ 3. TĐ Luỹ Kế</span>\n          <span className=\"px-2.5 py-1 bg-white rounded-lg border border-emerald-200 shadow-2xs\">✓ 4. TĐ Realtime</span>\n        </div>\n      </div>\n\n      {/* 3. Top 4 High-Impact KPI Cards (Ẩn / Hiện) */}\n      {showKpiCards && (\n      <div className=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4\">\n        {/* Card 1: DT Realtime Hôm Nay */}\n        <div className=\"bg-amber-500 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-extrabold uppercase tracking-wide text-amber-100 flex items-center gap-1\">\n            ⚡ DT REALTIME HÔM NAY\n          </span>\n          <div className=\"my-2\">\n            <span className=\"text-3xl font-black block tracking-tight\">\n              {formatReportDisplayNumber(cum_rt)} Tr\n            </span>\n            <span className=\"text-[11px] text-amber-100 font-medium mt-0.5 block\">\n              Phát sinh trong ngày ({isQd ? 'DT Quy Đổi' : 'DT Thực'})\n            </span>\n          </div>\n        </div>\n\n        {/* Card 2: Tổng DT Chốt Cuối Ngày */}\n        <div className=\"bg-slate-900 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-extrabold uppercase tracking-wide text-blue-200 flex items-center gap-1\">\n            📊 TỔNG DT CHỐT CUỐI NGÀY\n          </span>\n          <div className=\"my-2\">\n            <span className=\"text-2xl font-black block tracking-tight\">\n              {formatReportDisplayNumber(cum_chot)}{' '}\n              <span className=\"text-sm font-bold text-slate-400\">/ {formatReportDisplayNumber(cum_stretch_tg)} Tr</span>\n            </span>\n            <span className=\"text-[11px] text-blue-200 font-medium mt-0.5 block\">\n              HT Target gốc: {formatPercent(cum_pct_ht)} · HT {stretchGoalPct}%: {formatPercent(cum_pct_stretch)}\n            </span>\n          </div>\n        </div>\n\n        {/* Card 3: Thi Đua Chốt Cuối Ngày */}\n        <div className=\"bg-emerald-600 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-extrabold uppercase tracking-wide text-emerald-100 flex items-center gap-1\">\n            🎖 THI ĐUA CHỐT CUỐI NGÀY\n          </span>\n          <div className=\"my-2\">\n            <span className=\"text-3xl font-black block tracking-tight\">\n              {totalDoneCount} / {allProgsCount} Môn Về Số\n            </span>\n            <span className=\"text-[11px] text-emerald-100 font-medium mt-0.5 block\">\n              Tỷ lệ về số: {allProgsCount > 0 ? formatPercent(totalDoneCount / allProgsCount * 100) : '0%'}\n            </span>\n          </div>\n        </div>\n\n        {/* Card 4: Doanh Thu Còn Thiếu */}\n        <div className=\"bg-rose-600 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-extrabold uppercase tracking-wide text-rose-100 flex items-center gap-1\">\n            ⚠️ CÒN THIẾU ĐỂ ĐẠT {stretchGoalPct}% TARGET\n          </span>\n          <div className=\"my-2\">\n            <span className=\"text-3xl font-black block tracking-tight\">\n              {formatReportDisplayNumber(cum_gap_stretch)} Tr\n            </span>\n            <span className=\"text-[11px] text-rose-100 font-medium mt-0.5 block\">\n              Cần bứt phá trong những ngày còn lại\n            </span>\n          </div>\n        </div>\n      </div>\n      )}\n\n      {/* 4. Charts Visual Row (Ẩn / Hiện theo tùy chọn) */}\n      {showCharts ? (\n        <div className=\"grid grid-cols-1 lg:grid-cols-3 gap-4\">\n          {/* Chart 1: DT Realtime vs Lũy Kế & Target */}\n          <div className=\"bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-2\">\n            <div className=\"pb-1 border-b border-slate-100\">\n              <h4 className=\"font-extrabold text-slate-800 text-xs uppercase\">\n                📊 DT Realtime vs Luỹ Kế & Target (TR)\n              </h4>\n            </div>\n            <div className=\"h-44 w-full\">\n              <canvas ref={barCanvasRef}></canvas>\n            </div>\n          </div>\n\n          {/* Chart 2: Donut Tỷ Lệ Môn Thi Đua */}\n          <div className=\"bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-2\">\n            <div className=\"pb-1 border-b border-slate-100\">\n              <h4 className=\"font-extrabold text-slate-800 text-xs uppercase\">\n                🎯 Tỷ Lệ Môn Thi Đua Chốt Cuối Ngày\n              </h4>\n            </div>\n            <div className=\"h-44 w-full flex items-center justify-center\">\n              <canvas ref={donutTdRef}></canvas>\n            </div>\n          </div>\n\n          {/* Chart 3: Donut Tỷ Trọng Ngành Hàng */}\n          <div className=\"bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-2\">\n            <div className=\"flex items-center justify-between pb-1 border-b border-slate-100\">\n              <h4 className=\"font-extrabold text-slate-800 text-xs uppercase\">\n                🍩 Tỷ Trọng Ngành Hàng\n              </h4>\n              <div className=\"flex rounded-lg bg-slate-100 p-0.5 text-[10px] font-bold\">\n                <button\n                  onClick={() => setDonutMode('RT')}\n                  className={`px-2 py-0.5 rounded transition cursor-pointer ${\n                    donutMode === 'RT' ? 'bg-white shadow-2xs text-blue-600' : 'text-slate-600'\n                  }`}\n                >\n                  Hôm Nay\n                </button>\n                <button\n                  onClick={() => setDonutMode('LK')}\n                  className={`px-2 py-0.5 rounded transition cursor-pointer ${\n                    donutMode === 'LK' ? 'bg-white shadow-2xs text-blue-600' : 'text-slate-600'\n                  }`}\n                >\n                  Luỹ Kế\n                </button>\n              </div>\n            </div>\n            <div className=\"h-44 w-full flex items-center justify-center\">\n              <canvas ref={donutCatRef}></canvas>\n            </div>\n          </div>\n        </div>\n      ) : (\n        <div className=\"no-export bg-white rounded-2xl border border-dashed border-slate-300 p-4 flex items-center justify-between shadow-2xs text-slate-600 text-xs\">\n          <div className=\"flex items-center gap-2.5\">\n            <div className=\"w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center\">\n              <BarChart3 className=\"w-4 h-4\" />\n            </div>\n            <div>\n              <p className=\"font-bold text-slate-800\">Cụm 3 biểu đồ trực quan đang được ẩn</p>\n              <p className=\"text-[11px] text-slate-500\">Bấm nút bên cạnh để hiển thị lại biểu đồ phân tích</p>\n            </div>\n          </div>\n          <button\n            onClick={() => setShowCharts(true)}\n            className=\"px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded-xl text-xs transition cursor-pointer flex items-center gap-1.5 border border-indigo-200\"\n          >\n            <Eye className=\"w-3.5 h-3.5\" />\n            <span>Hiện Biểu Đồ</span>\n          </button>\n        </div>\n      )}\n\n      {/* CÁC BẢNG DATA CHI TIẾT (ẨN / HIỆN THEO TÙY CHỌN) */}\n      {showDataTables ? (\n        <>\n          {/* 5. PHẦN 1: TIẾN ĐỘ DOANH THU CHỐT CUỐI NGÀY (THEO SIÊU THỊ) */}\n          <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4 export-revenue-progress\">\n        <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2 border-b border-slate-100\">\n          <div>\n            <h4 className=\"font-black text-slate-900 text-sm uppercase flex items-center gap-2\">\n              <span>📊 1. TIẾN ĐỘ DOANH THU CHỐT CUỐI NGÀY (THEO SIÊU THỊ)</span>\n            </h4>\n            <p className=\"text-[11.5px] text-slate-500 font-medium\">\n              Đã cộng dồn: Luỹ kế đầu ngày + Realtime phát sinh trong ngày\n            </p>\n          </div>\n\n          <div className=\"flex items-center gap-2\">\n            <div className=\"flex rounded-xl bg-slate-100 p-1 text-xs font-bold shadow-inner\">\n              <button\n                onClick={() => setRevenueMode('QD')}\n                className={`px-3.5 py-1.5 rounded-lg transition font-black cursor-pointer ${\n                  revenueMode === 'QD'\n                    ? 'bg-indigo-600 text-white shadow-xs'\n                    : 'text-slate-600 hover:text-slate-900'\n                }`}\n              >\n                ⭐ Doanh Thu Quy Đổi (DT QĐ)\n              </button>\n              <button\n                onClick={() => setRevenueMode('THUC')}\n                className={`px-3.5 py-1.5 rounded-lg transition font-bold cursor-pointer ${\n                  revenueMode === 'THUC'\n                    ? 'bg-blue-600 text-white shadow-xs'\n                    : 'text-slate-600 hover:text-slate-900'\n                }`}\n              >\n                💵 Doanh Thu Thực\n              </button>\n            </div>\n          </div>\n        </div>\n\n        <div className=\"overflow-x-auto custom-scroll\" data-export-expand=\"true\">\n          <SortableTable className=\"w-full table-fixed text-left text-xs border-collapse\">\n              <colgroup>\n                <col className=\"w-[8%]\" />\n                <col className=\"w-[10%]\" />\n                <col className=\"w-[10%]\" />\n                <col className=\"w-[9%]\" />\n                <col className=\"w-[11%]\" />\n                <col className=\"w-[8%]\" />\n                <col className=\"w-[13%]\" />\n                <col className=\"w-[13%]\" />\n                <col className=\"w-[8%]\" />\n                <col className=\"w-[10%]\" />\n              </colgroup>\n            <thead className=\"bg-slate-900 text-white font-bold border-b border-slate-800 text-[11px]\">\n              <tr>\n                <th className=\"py-3 px-2 text-center w-28\">SIÊU THỊ</th>\n                <th className=\"py-3 px-2 text-right\">\n                  {isQd ? 'DT QĐ REALTIME (TR)' : 'DT REALTIME (TR)'}\n                </th>\n                <th className=\"py-3 px-2 text-right\">\n                  {isQd ? 'DT QĐ LUỸ KẾ (TR)' : 'DT LUỸ KẾ (TR)'}\n                </th>\n                <th className=\"py-3 px-2 text-right font-black text-amber-300\">\n                  {isQd ? 'TỔNG DT QĐ CHỐT (TR)' : 'TỔNG DT CHỐT (TR)'}\n                </th>\n                <th className=\"py-3 px-2 text-center\">\n                  <span className=\"block leading-tight\">TARGET {stretchGoalPct}%</span>\n                  <span className=\"block text-[9px] text-slate-400 mt-0.5\">Gốc / Bứt phá (TR)</span>\n                </th>\n                <th className=\"py-3 px-2 text-center\">\n                  <span className=\"block leading-tight\">% HT {stretchGoalPct}%</span>\n                  <span className=\"block text-[9px] text-slate-400 mt-0.5\">Gốc / Bứt phá</span>\n                </th>\n                <th className=\"py-3 px-2 text-right\">DỰ BÁO CUỐI THÁNG THEO BI (TR)</th>\n                <th className=\"py-3 px-2 text-right text-rose-300 whitespace-nowrap min-w-[115px]\"><span className=\"block leading-tight text-center\">TARGET CẦN<br />CHẠY/NGÀY</span></th>\n                <th className=\"py-3 px-2 text-center\">% TRẢ GÓP</th>\n                <th className=\"py-3 px-2 text-center\">TRẠNG THÁI</th>\n              </tr>\n            </thead>\n            <tbody className=\"divide-y divide-slate-100 font-semibold text-slate-700\">\n              <tr className=\"hover:bg-slate-50 transition border-b border-slate-100\">\n                <td className=\"py-3 px-2 text-center font-bold text-slate-900\">AAR NHT</td>\n                <td className=\"py-3 px-2 text-right font-mono text-slate-700\" data-sort-value={aar_rt}>{formatReportDisplayNumber(aar_rt)}</td>\n                <td className=\"py-3 px-2 text-right font-mono text-slate-700\" data-sort-value={aar_lk}>{formatReportDisplayNumber(aar_lk)}</td>\n                <td className=\"py-3 px-2 text-right font-mono font-black  font-black\">% HT</th>\n                            <th className=\"py-2.5 px-2 text-right text-rose-300\">CẦN CHẠY</th>\n                            <th className=\"py-2.5 px-2 text-center\">TRẠNG THÁI</th>\n                          </tr>\n                        </thead>\n                        <tbody className=\"divide-y divide-slate-100 text-slate-700 font-semibold text-[11px]\">\n                          {renderSideTableRows(part2, storeKeyw)}\n                        </tbody>\n                      </SortableTable>\n                    </div>\n                  </div>\n                </>\n              );\n            })()\n          )}\n        </div>\n      </div>\n    </>\n  ) : (\n    <div className=\"bg-white rounded-2xl border border-dashed border-slate-300 p-6 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-2xs text-slate-600 text-xs\">\n      <div className=\"flex items-center gap-3\">\n        <div className=\"w-10 h-10 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center flex-shrink-0\">\n          <Table2 className=\"w-5 h-5\" />\n        </div>\n        <div>\n          <p className=\"font-extrabold text-slate-900 text-sm\">Bảng dữ liệu chi tiết Doanh thu & Thi đua đang được ẩn</p>\n          <p className=\"text-slate-500 text-xs mt-0.5\">Bấm nút bên cạnh để hiển thị lại toàn bộ số liệu chi tiết</p>\n        </div>\n      </div>\n      <button\n        onClick={() => setShowDataTables(true)}\n        className=\"px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs transition cursor-pointer flex items-center gap-2 shadow-xs whitespace-nowrap\"\n      >\n        <Eye className=\"w-4 h-4\" />\n        <span>Hiện Bảng Dữ Liệu</span>\n      </button>\n    </div>\n  )}\n</div>\n);\n};\n","src/views/DashboardView.tsx":"import { countPrograms } from '../utils/programCounts';\nimport React, { useState } from 'react';\nimport {\n  ExternalLink,\n  Trash2,\n  RotateCcw,\n  Upload,\n  CheckCircle2,\n  FileSpreadsheet,\n  Store,\n  ChevronRight,\n  Sparkles,\n  Clipboard,\n  Zap,\n  FileText,\n  AlertCircle\n} from 'lucide-react';\nimport { AppDataState, ViewType } from '../types';\nimport { DataInputModal } from '../components/DataInputModal';\nimport { CATEGORY_LABELS, parsePastedData } from '../utils/smartDataParser';\n\ninterface DashboardViewProps {\n  appData: AppDataState;\n  onSelectView?: (view: ViewType) => void;\n  onOpenUpload?: () => void;\n  onResetData?: () => void;\n  onOpenProgramDetail?: (params: { storeKey: 'TGDD' | 'TOPZONE'; programCode: string | number; programName: string }) => void;\n  onUpdateSlot?: (slot: keyof AppDataState, data: any[]) => void;\n  onClearSlot?: (slot: keyof AppDataState) => void;\n  onClearAll?: () => void;\n  onRestoreSample?: () => void;\n  onTriggerFilePicker?: (slot: keyof AppDataState) => void;\n  onSelectStoreAndNavigate?: (storeId: string) => void;\n  onNavigateToEmployeeRanking?: (storeTab: 'TGDD' | 'TOPZONE') => void;\n  onOpenStoreSettings?: (storeId: string) => void;\n}\n\nexport const DashboardView: React.FC<DashboardViewProps> = ({\n  appData,\n  onSelectView,\n  onOpenUpload,\n  onResetData,\n  onOpenProgramDetail,\n  onUpdateSlot,\n  onClearSlot,\n  onClearAll,\n  onRestoreSample,\n  onTriggerFilePicker,\n  onSelectStoreAndNavigate,\n  onNavigateToEmployeeRanking,\n  onOpenStoreSettings,\n}) => {\n  // Modal state for smart paste/manual data entry\n  const [inputModal, setInputModal] = useState<{\n    isOpen: boolean;\n    targetCategory: keyof AppDataState | null;\n  }>({\n    isOpen: false,\n    targetCategory: null,\n  });\n\n  // Toast feedback state for quick paste\n  const [quickFeedback, setQuickFeedback] = useState<string | null>(null);\n\n  const showQuickFeedback = (msg: string) => {\n    setQuickFeedback(msg);\n    setTimeout(() => setQuickFeedback(null), 3500);\n  };\n\n  // Open data entry modal for a specific slot\n  const handleOpenInputModal = (category?: keyof AppDataState) => {\n    setInputModal({\n      isOpen: true,\n      targetCategory: category || null,\n    });\n  };\n\n  // Quick paste directly from clipboard\n  const handleQuickPaste = async (slot: keyof AppDataState) => {\n    try {\n      const text = await navigator.clipboard.readText();\n      if (!text || !text.trim()) {\n        showQuickFeedback('Clipboard trống! Đang mở ô nhập data để bạn dán thủ công...');\n        handleOpenInputModal(slot);\n        return;\n      }\n\n      const parsed = parsePastedData(text, slot);\n      if ('error' in parsed) {\n        showQuickFeedback('Chưa khớp định dạng! Đang mở ô nhập data để bạn xem trước...');\n        handleOpenInputModal(slot);\n        return;\n      }\n\n      if (parsed.data.length > 0) {\n        if (onUpdateSlot) {\n          onUpdateSlot(slot, parsed.data);\n        }\n        showQuickFeedback(`⚡ Đã dán nhanh ${parsed.data.length} dòng vào \"${CATEGORY_LABELS[slot]}\"!`);\n      }\n    } catch (err) {\n      // If clipboard read permission blocked by browser, open the modal instead\n      handleOpenInputModal(slot);\n    }\n  };\n\n  const handleSaveDataFromModal = (category: keyof AppDataState, data: any[]) => {\n    let finalData = data;\n\n    // Doanh thu nhân viên: chỉ giữ những nhân viên thực sự xuất hiện trong\n    // hai báo cáo Thi đua nhân viên TGDĐ/TopZone mà anh đã nạp.\n    // Như vậy các nhân viên không tham gia thi đua sẽ không đi vào bảng KPI NV.\n    if (category === 'dt_nv_luyke' || category === 'dt_nv_realtime') {\n      const competitionIds = new Set<string>();\n      [...(appData.nv_tgdd || []), ...(appData.nv_tz || [])].forEach((row: any) => {\n        const raw = String(row?.['MÃ NV'] ?? row?.['MÃ NHÂN VIÊN'] ?? '').trim();\n        if (raw) competitionIds.add(raw.toLowerCase());\n        const label = String(row?.['ĐƠN VỊ / NHÂN VIÊN'] ?? '').trim();\n        const m = label.match(/^(\\d{4,7}|online)\\s*[-_–]/i);\n        if (m) competitionIds.add(m[1].toLowerCase());\n      });\n\n      // Chỉ lọc khi đã có dữ liệu Thi đua. Nếu anh nhập doanh thu trước\n      // khi nhập Thi đua thì vẫn giữ dữ liệu để không làm mất dữ liệu.\n      if (competitionIds.size > 0) {\n        finalData = data.filter((row: any) => {\n          const id = String(row?.['MÃ NHÂN VIÊN'] ?? row?.['MÃ NV'] ?? '').trim().toLowerCase();\n          return id && competitionIds.has(id);\n        });\n      }\n    }\n\n    if (onUpdateSlot) {\n      onUpdateSlot(category, finalData);\n    }\n\n    if (finalData.length !== data.length) {\n      showQuickFeedback(`✓ Đã lưu ${finalData.length}/${data.length} nhân viên — chỉ giữ nhân viên có trong Thi đua.`);\n    } else {\n      showQuickFeedback(`✓ Đã lưu thành công ${finalData.length} dòng vào \"${CATEGORY_LABELS[category]}\"!`);\n    }\n  };\n\n  const clearSlot = (slot: keyof AppDataState) => {\n    if (onClearSlot) {\n      onClearSlot(slot);\n    } else if (onUpdateSlot) {\n      onUpdateSlot(slot, []);\n    }\n    showQuickFeedback(`Đã xóa dữ liệu mục \"${CATEGORY_LABELS[slot]}\"`);\n  };\n\n  const hasDtLk = appData.dt_luyke.length > 0;\n  const hasDtRt = appData.dt_realtime.length > 0;\n  const hasTdLk = appData.td_luyke.length > 0;\n  const hasTdRt = appData.td_realtime.length > 0;\n  const hasDtNvLk = appData.dt_nv_luyke.length > 0;\n  const hasDtNvRt = appData.dt_nv_realtime.length > 0;\n  const hasNvTz = appData.nv_tz.length > 0;\n  const hasNvTgdd = appData.nv_tgdd.length > 0;\n\n  const hasTraChamLk = (appData.tra_cham_luyke || []).length > 0;\n  const hasTraChamRt = (appData.tra_cham_realtime || []).length > 0;\n\n  // Render an interactive Slot Input Card\n  const renderSlotCard = (\n    slot: keyof AppDataState,\n    title: string,\n    iconColor: string,\n    hasData: boolean,\n    countText: string\n  ) => {\n    return (\n      <div\n        className={`border rounded-2xl p-4 transition flex flex-col justify-between ${\n          hasData\n            ? 'border-emerald-200 bg-emerald-50/40 hover:bg-emerald-50/70 shadow-2xs'\n            : 'border-slate-200 bg-white hover:border-blue-300 hover:bg-slate-50/60 shadow-2xs'\n        }`}\n      >\n        <div>\n          {/* Slot Header */}\n          <div className=\"flex items-center justify-between mb-2\">\n            <span className=\"font-extrabold text-slate-800 text-xs flex items-center gap-1.5\">\n              <span className={`w-2 h-2 rounded-full ${hasData ? 'bg-emerald-500' : 'bg-slate-300'}`}></span>\n              {title}\n            </span>\n            <span\n              className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${\n                hasData\n                  ? 'bg-emerald-100 text-emerald-800 border border-emerald-200'\n                  : 'bg-slate-100 text-slate-500'\n              }`}\n            >\n              {hasData ? countText : 'Chưa có data'}\n            </span>\n          </div>\n\n          <p className=\"text-[11px] text-slate-500 line-clamp-1 mb-3\">\n            {hasData ? `✓ Đã sẵn sàng số liệu phân tích` : 'Sao chép từ web BI và dán vào đây'}\n          </p>\n        </div>\n\n        {/* Action Controls for this Slot */}\n        <div className=\"space-y-1.5 pt-2 border-t border-slate-100\">\n          <div className=\"grid grid-cols-2 gap-1.5\">\n            <button\n              onClick={() => handleOpenInputModal(slot)}\n              type=\"button\"\n              className=\"px-2.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 shadow-2xs cursor-pointer active:scale-95\"\n              title=\"Mở ô nhập / dán dữ liệu cho mục này\"\n            >\n              <Clipboard className=\"w-3.5 h-3.5\" />\n              <span>Nhập Data</span>\n            </button>\n\n            <button\n              onClick={() => handleQuickPaste(slot)}\n              type=\"button\"\n              className=\"px-2.5 py-1.5 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 shadow-2xs cursor-pointer active:scale-95\"\n              title=\"Dán nhanh ngay từ clipboard (Ctrl + V)\"\n            >\n              <Zap className=\"w-3.5 h-3.5\" />\n              <span>Dán Nhanh</span>\n            </button>\n          </div>\n\n          <div className=\"flex items-center justify-between text-[11px] pt-1\">\n            {onTriggerFilePicker ? (\n              <button\n                onClick={() => onTriggerFilePicker(slot)}\n                className=\"text-slate-400 hover:text-slate-700 font-medium hover:underline flex items-center gap-1 cursor-pointer\"\n                title=\"Chọn file Excel/CSV cũ nếu có\"\n              >\n                <Upload className=\"w-3 h-3\" />\n                <span>Chọn file cũ</span>\n              </button>\n            ) : (\n              <span />\n            )}\n\n            {hasData && (\n              <button\n                onClick={() => clearSlot(slot)}\n                className=\"text-rose-500 hover:text-rose-700 font-medium flex items-center gap-1 hover:underline cursor-pointer\"\n                title=\"Xóa dữ liệu ô này\"\n              >\n                <Trash2 className=\"w-3 h-3\" />\n                <span>Xóa data</span>\n              </button>\n            )}\n          </div>\n        </div>\n      </div>\n    );\n  };\n\n  return (\n    <div className=\"space-y-6\">\n      {/* Quick Feedback Toast */}\n      {quickFeedback && (\n        <div className=\"fixed top-20 right-6 z-50 animate-in slide-in-from-top-4 duration-300\">\n          <div className=\"bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-xl border border-slate-800 flex items-center gap-2.5\">\n            <CheckCircle2 className=\"w-4 h-4 text-emerald-400 flex-shrink-0\" />\n            <span>{quickFeedback}</span>\n          </div>\n        </div>\n      )}\n\n      {/* 1. KHỐI TRUY CẬP NHANH BI MWG & HƯỚNG DẪN SAO CHÉP / DÁN DATA */}\n      <div className=\"bg-gradient-to-r from-slate-900 via-blue-950 to-indigo-950 text-white rounded-3xl p-6 shadow-xl border border-slate-800 space-y-5\">\n        <div className=\"flex flex-col lg:flex-row lg:items-center justify-between gap-4 pb-4 border-b border-white/10\">\n          <div className=\"flex items-center space-x-3.5\">\n            <div className=\"w-11 h-11 rounded-2xl bg-amber-400 text-slate-950 flex items-center justify-center font-black text-xl shadow-lg shadow-amber-400/20\">\n              ⚡\n            </div>\n            <div>\n              <h3 className=\"font-black text-white text-base uppercase tracking-tight flex items-center gap-2\">\n                <span>Cổng Nhập Dữ Liệu Báo Cáo BI (MWG)</span>\n                <span className=\"text-[10px] bg-emerald-500/20 text-emerald-300 font-bold px-2 py-0.5 rounded-full border border-emerald-500/30\">\n                  Copy & Paste\n                </span>\n              </h3>\n              <p className=\"text-xs text-blue-200\">\n                Không cần xuất file Excel. Chỉ cần bôi đen bảng trên web BI, nhấn Copy (Ctrl + C) và Dán (Ctrl + V) vào hệ thống!\n              </p>\n            </div>\n          </div>\n\n          {/* Quick links to BI */}\n          <div className=\"flex flex-wrap items-center gap-2.5\">\n            <a\n              href=\"https://baocao.dienmayxanh.com/dashboard/home\"\n              target=\"_blank\"\n              rel=\"noopener noreferrer\"\n              className=\"px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-bold transition flex items-center gap-2 border border-white/15 backdrop-blur-sm hover:border-amber-400\"\n            >\n              <span>🌐 BI Trang Chủ</span>\n              <ExternalLink className=\"w-3.5 h-3.5 text-amber-300\" />\n            </a>\n\n            <a\n              href=\"https://baocao.dienmayxanh.com/dashboard/revenue-consolidated\"\n              target=\"_blank\"\n              rel=\"noopener noreferrer\"\n              className=\"px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-extrabold transition flex items-center gap-2 shadow-md hover:shadow-blue-500/30\"\n            >\n              <span>📊 Báo Cáo Doanh Thu</span>\n              <ExternalLink className=\"w-3.5 h-3.5\" />\n            </a>\n\n            <a\n              href=\"https://baocao.dienmayxanh.com/dashboard/thi-dua\"\n              target=\"_blank\"\n              rel=\"noopener noreferrer\"\n              className=\"px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-black transition flex items-center gap-2 shadow-md hover:shadow-amber-500/30\"\n            >\n              <span>🏆 Thi Đua Siêu Thị</span>\n              <ExternalLink className=\"w-3.5 h-3.5\" />\n            </a>\n          </div>\n        </div>\n\n        {/* 3 Step Workflow: Adapted for Copy-Paste */}\n        <div className=\"grid grid-cols-1 md:grid-cols-3 gap-3.5 text-xs\">\n          <div className=\"bg-white/5 border border-white/10 rounded-2xl p-4 space-y-1.5 backdrop-blur-sm\">\n            <div className=\"flex items-center space-x-2\">\n              <span className=\"w-5 h-5 rounded-full bg-blue-500 text-white text-[11px] font-black flex items-center justify-center\">\n                1\n              </span>\n              <h4 className=\"font-extrabold text-blue-200\">Mở Web BI & Lọc Báo Cáo</h4>\n            </div>\n            <p className=\"text-[11.5px] text-slate-300 leading-relaxed\">\n              Bấm nút ở trên để vào BI. Chọn đơn vị:\n              <br />\n              <span className=\"text-amber-300 font-bold\">• 933</span> (TGD NHT) hoặc{' '}\n              <span className=\"text-blue-300 font-bold\">• 10341</span> (AAR NHT).\n            </p>\n          </div>\n\n          <div className=\"bg-white/5 border border-white/10 rounded-2xl p-4 space-y-1.5 backdrop-blur-sm\">\n            <div className=\"flex items-center space-x-2\">\n              <span className=\"w-5 h-5 rounded-full bg-amber-400 text-slate-950 text-[11px] font-black flex items-center justify-center\">\n                2\n              </span>\n              <h4 className=\"font-extrabold text-amber-300\">Ctrl + A Copy Toàn Bộ Trang</h4>\n            </div>\n            <p className=\"text-[11.5px] text-slate-300 leading-relaxed\">\n              Tại trang web BI, anh có thể bấm <b>Ctrl + A</b> (chọn toàn bộ trang) rồi nhấn <b>Ctrl + C</b>.\n              <br />\n              <span className=\"text-amber-200/90 font-medium\">\n                ★ Hệ thống tự động lọc sạch menu, tiêu đề & thanh điều hướng thừa trên web!\n              </span>\n            </p>\n          </div>\n\n          <div className=\"bg-white/5 border border-white/10 rounded-2xl p-4 space-y-1.5 backdrop-blur-sm\">\n            <div className=\"flex items-center space-x-2\">\n              <span className=\"w-5 h-5 rounded-full bg-emerald-400 text-slate-950 text-[11px] font-black flex items-center justify-center\">\n                3\n              </span>\n              <h4 className=\"font-extrabold text-emerald-300\">Dán Nhanh Vào Ô Nhập</h4>\n            </div>\n            <p className=\"text-[11.5px] text-slate-300 leading-relaxed\">\n              Bấm nút <b>\"⚡ Dán Nhanh\"</b> hoặc <b>\"📋 Nhập Data\"</b> tại ô tương ứng bên dưới. Hệ thống tự động bóc tách đúng bảng số liệu và lưu ngay lập tức!\n            </p>\n          </div>\n        </div>\n      </div>\n\n      {/* 2. THANH HÀNH ĐỘNG: DÁN TỔNG HỢP / XÓA DATA CŨ / NẠP LẠI MẪU */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-4 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3\">\n        <div className=\"flex items-center space-x-3\">\n          <div className=\"p-2.5 bg-blue-50 text-blue-600 rounded-xl\">\n            <Clipboard className=\"w-5 h-5\" />\n          </div>\n          <div>\n            <h3 className=\"font-extrabold text-slate-900 text-sm\">Quản Lý Nhập & Cập Nhật Dữ Liệu</h3>\n            <p className=\"text-xs text-slate-500 font-medium\">\n              Đầy đủ 10 cổng nhập dự phòng • Chọn đúng loại dữ liệu để nhập trực tiếp vào hệ thống\n            </p>\n          </div>\n        </div>\n\n        <div className=\"flex flex-wrap items-center gap-2\">\n          <button\n            onClick={() => handleOpenInputModal()}\n            type=\"button\"\n            className=\"px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-xs transition flex items-center gap-1.5 cursor-pointer active:scale-95\"\n          >\n            <Clipboard className=\"w-3.5 h-3.5\" />\n            <span>Dán Data Tổng Hợp (Tự Nhận Diện)</span>\n          </button>\n\n          {onClearAll && (\n            <button\n              onClick={onClearAll}\n              type=\"button\"\n              className=\"px-3.5 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold text-xs rounded-xl transition flex items-center gap-1.5 cursor-pointer\"\n            >\n              <Trash2 className=\"w-3.5 h-3.5 text-rose-600\" />\n              <span>Xóa Tất Cả Data Cũ</span>\n            </button>\n          )}\n\n        </div>\n      </div>\n\n      {/* 3. ĐẦY ĐỦ 10 CỔNG NHẬP DATA */}\n      <div className=\"grid grid-cols-1 md:grid-cols-2 gap-5\">\n        {/* Box 1: Doanh Thu Siêu Thị */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex items-center justify-between pb-2 border-b border-slate-100\">\n            <div className=\"flex items-center space-x-2\">\n              <span className=\"w-2.5 h-2.5 rounded-full bg-emerald-500\"></span>\n              <h3 className=\"font-extrabold text-slate-900 text-sm\">Doanh Thu Siêu Thị</h3>\n              <span className=\"text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200\">\n                {hasDtLk && hasDtRt ? '2/2 Sẵn sàng' : 'Chờ nhập data'}\n              </span>\n            </div>\n            {onSelectView && (\n              <button\n                onClick={() => onSelectView(ViewType.DOANH_THU_ST)}\n                className=\"text-[11px] font-bold text-blue-600 hover:underline cursor-pointer flex items-center gap-1\"\n              >\n                <span>Xem Báo Cáo DT</span> ↗\n              </button>\n            )}\n          </div>\n\n          <div className=\"grid grid-cols-2 gap-3\">\n            {renderSlotCard(\n              'dt_luyke',\n              'Luỹ Kế Siêu Thị',\n              'emerald',\n              hasDtLk,\n              `✓ ${appData.dt_luyke.length} Siêu thị`\n            )}\n            {renderSlotCard(\n              'dt_realtime',\n              'Realtime Hôm Nay',\n              'blue',\n              hasDtRt,\n              `✓ ${appData.dt_realtime.length} Siêu thị`\n            )}\n          </div>\n        </div>\n\n        {/* Box 2: Thi Đua Siêu Thị */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex items-center justify-between pb-2 border-b border-slate-100\">\n            <div className=\"flex items-center space-x-2\">\n              <span className=\"w-2.5 h-2.5 rounded-full bg-amber-500\"></span>\n              <h3 className=\"font-extrabold text-slate-900 text-sm\">Thi Đua Siêu Thị</h3>\n              <span className=\"text-[11px] font-bold text-amber-800 bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200\">\n                {countPrograms(appData.td_luyke)} Môn có target\n              </span>\n            </div>\n\n          </div>\n\n          <div className=\"grid grid-cols-2 gap-3\">\n            {renderSlotCard(\n              'td_luyke',\n              'Thi Đua Luỹ Kế',\n              'amber',\n              hasTdLk,\n              `✓ ${countPrograms(appData.td_luyke)} Môn`\n            )}\n            {renderSlotCard(\n              'td_realtime',\n              'Thi Đua Realtime',\n              'purple',\n              hasTdRt,\n              `✓ ${countPrograms(appData.td_luyke)} Môn LK · ${appData.td_realtime.length} dòng RT`\n            )}\n          </div>\n        </div>\n\n        {/* Box 3: Doanh Thu Nhân Viên (2 Cổng) */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex items-center justify-between pb-2 border-b border-slate-100\">\n            <div className=\"flex items-center space-x-2\">\n              <span className=\"w-2.5 h-2.5 rounded-full bg-blue-600\"></span>\n              <h3 className=\"font-extrabold text-slate-900 text-sm\">Doanh Thu Nhân Viên (2 Cổng)</h3>\n              <span className=\"text-[11px] font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded-md border border-blue-200\">\n                Lũy Kế & Realtime\n              </span>\n            </div>\n            {onSelectView && (\n              <button\n                onClick={() => onSelectView(ViewType.SUC_KHOE_NV)}\n                className=\"text-[11px] font-bold text-blue-600 hover:underline cursor-pointer flex items-center gap-1\"\n              >\n                <span>Xem Xếp Hạng NV</span> ↗\n              </button>\n            )}\n          </div>\n\n          <div className=\"grid grid-cols-2 gap-3\">\n            {renderSlotCard(\n              'dt_nv_luyke',\n              'DT NV Luỹ Kế',\n              'blue',\n              hasDtNvLk,\n              `✓ ${appData.dt_nv_luyke.length} Nhân sự`\n            )}\n            {renderSlotCard(\n              'dt_nv_realtime',\n              'DT NV Realtime',\n              'indigo',\n              hasDtNvRt,\n              `✓ ${appData.dt_nv_realtime.length} Nhân sự`\n            )}\n          </div>\n        </div>\n\n        {/* Box 4: Thi Đua Nhân Viên */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex items-center justify-between pb-2 border-b border-slate-100\">\n            <div className=\"flex items-center space-x-2\">\n              <span className=\"w-2.5 h-2.5 rounded-full bg-purple-600\"></span>\n              <h3 className=\"font-extrabold text-slate-900 text-sm\">Thi Đua Nhân Viên</h3>\n              <span className=\"text-[11px] font-bold text-purple-700 bg-purple-50 px-2 py-0.5 rounded-md border border-purple-200\">\n                TGDĐ & TopZone\n              </span>\n            </div>\n            {onSelectView && (\n              <button\n                onClick={() => onSelectView(ViewType.SUC_KHOE_NV)}\n                className=\"text-[11px] font-bold text-purple-600 hover:underline cursor-pointer flex items-center gap-1\"\n              >\n                <span>Cổng Thi Đua NV</span> ↗\n              </button>\n            )}\n          </div>\n\n          <div className=\"grid grid-cols-2 gap-3\">\n            {renderSlotCard(\n              'nv_tz',\n              `TopZone (${countPrograms(appData.td_luyke, 'TOPZONE')} Môn)`,\n              'blue',\n              hasNvTz,\n              `✓ ${appData.nv_tz.length} Dòng`\n            )}\n            {renderSlotCard(\n              'nv_tgdd',\n              `TGDĐ (${countPrograms(appData.td_luyke, 'TGDD')} Môn)`,\n              'amber',\n              hasNvTgdd,\n              `✓ ${appData.nv_tgdd.length} Dòng`\n            )}\n          </div>\n        </div>\n\n        {/* Box 5: Trả Chậm Nhân Viên — nhập trực tiếp, không cần cổng chính */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4 md:col-span-2\">\n          <div className=\"flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-slate-100\">\n            <div className=\"flex flex-wrap items-center gap-2\">\n              <span className=\"w-2.5 h-2.5 rounded-full bg-rose-500\"></span>\n              <h3 className=\"font-extrabold text-slate-900 text-sm\">Trả Chậm Nhân Viên (2 Cổng)</h3>\n              <span className=\"text-[11px] font-bold text-rose-700 bg-rose-50 px-2 py-0.5 rounded-md border border-rose-200\">\n                {Number(hasTraChamLk) + Number(hasTraChamRt)}/2 Sẵn sàng\n              </span>\n            </div>\n            {onSelectView && (\n              <button type=\"button\" onClick={() => onSelectView(ViewType.TRA_CHAM)}\n                className=\"text-[11px] font-bold text-rose-600 hover:underline cursor-pointer\">\n                Xem Báo Cáo Trả Chậm ↗\n              </button>\n            )}\n          </div>\n          <p className=\"text-xs text-slate-500\">Chọn Lũy kế hoặc Realtime đúng với báo cáo đang sao chép. Dữ liệu được lưu vào cùng hệ thống với cổng chính.</p>\n          <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-3\">\n            {renderSlotCard('tra_cham_luyke', 'Trả Chậm NV Lũy Kế', 'rose', hasTraChamLk,\n              `✓ ${(appData.tra_cham_luyke || []).length} Dòng`)}\n            {renderSlotCard('tra_cham_realtime', 'Trả Chậm NV Realtime', 'rose', hasTraChamRt,\n              `✓ ${(appData.tra_cham_realtime || []).length} Dòng`)}\n          </div>\n        </div>\n      </div>\n\n      {/* Embedded Data Input Modal */}\n      <DataInputModal\n        isOpen={inputModal.isOpen}\n        onClose={() => setInputModal({ isOpen: false, targetCategory: null })}\n        targetCategory={inputModal.targetCategory}\n        onSaveData={handleSaveDataFromModal}\n      />\n    </div>\n  );\n};\n","src/views/DoanhThuStView.tsx":"import React, { useState } from 'react';\nimport { Camera } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatInt, formatPercent, formatProgramName } from '../utils/formatters';\nimport { calculateForecast } from '../utils/forecastEngine';\n\ninterface DoanhThuStViewProps {\n  appData: AppDataState;\n  activeStore: string;\n  onChangeActiveStore: (stId: string) => void;\n  onExportTab: () => void;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n}\n\nexport const DoanhThuStView: React.FC<DoanhThuStViewProps> = ({\n  appData,\n  activeStore,\n  onChangeActiveStore,\n  onExportTab,\n  onOpenProgramDetail,\n}) => {\n  const [dataMode, setDataMode] = useState<'LK' | 'RT'>('LK');\n\n  const sourceList = dataMode === 'LK' ? appData.dt_luyke : appData.dt_realtime;\n  const tdSource = dataMode === 'LK' ? appData.td_luyke : appData.td_realtime;\n\n  const row = sourceList.find(r => String(r['MÃ ĐƠN VỊ']) === String(activeStore)) || {};\n  const dtt = parseFloat(String(row['DOANH THU (TR)'])) || 0;\n  const dtqd = parseFloat(String(row['DOANH THU QĐ (TR)'])) || 0;\n  const target = parseFloat(String(row['TARGET (TR)'])) || 0;\n  const target_qd = parseFloat(String(row['TARGET QĐ (TR)'])) || 0;\n  const tragop = parseFloat(String(row['DT TRẢ GÓP (TR)'])) || 0;\n  const bill = parseFloat(String(row['LƯỢT BILL (TẤT CẢ ST)'])) || 0;\n  const sl = parseFloat(String(row['SỐ LƯỢNG'])) || 0;\n  const tb3thang = parseFloat(String(row['TB 3 THÁNG (TR)'])) || 0;\n  const daysElapsed = Math.max(0, parseFloat(String(row['SỐ NGÀY CỬA SỔ'])) || 0);\n  const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();\n  // Tiến độ tháng phải theo ngày lịch thực tế.\n  // 'SỐ NGÀY CỬA SỔ' của Realtime = 1 chỉ là phạm vi dữ liệu 1 ngày, không phải ngày thứ 1 của tháng.\n  const calendarDay = Math.min(daysInMonth, Math.max(1, new Date().getDate()));\n  const progressPct = daysInMonth > 0 ? calendarDay / daysInMonth * 100 : 0;\n  const vs3MonthPct = tb3thang > 0 ? ((dtt / tb3thang) - 1) * 100 : 0;\n\n  const tg_pct = dtt > 0 ? (tragop / dtt * 100) : 0;\n  const qd_pct = dtt > 0 ? (dtqd / dtt * 100) : 0;\n  const forecastResult = dataMode === 'LK' ? calculateForecast(dtqd, target_qd, daysElapsed, daysInMonth) : { forecast: dtqd, forecastPct: target_qd > 0 ? dtqd / target_qd * 100 : 0 };\n  const runrate_forecast = forecastResult.forecastPct;\n  const forecast_val = forecastResult.forecast;\n\n  const storeKeyword = activeStore === '10341' ? 'AAR' : 'TGD';\n  const storeTd = tdSource.filter(r => String(r['ĐƠN VỊ / NHÂN VIÊN']).includes(storeKeyword));\n\n  let htCount = 0;\n  storeTd.forEach(r => {\n    if ((parseFloat(String(r['% HT THÁNG'])) || 0) >= progressPct) htCount++;\n  });\n\n  return (\n    <div className=\"space-y-6\">\n      {/* Top control bar */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-4 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div className=\"flex flex-wrap items-center gap-3\">\n          <select\n            value={activeStore}\n            onChange={(e) => onChangeActiveStore(e.target.value)}\n            className=\"text-xs font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer\"\n          >\n            <option value=\"933\">TGD_DNA_HCH - 351 Nguyễn Hữu Thọ</option>\n            <option value=\"10341\">AAR_DNA_HCH - 351 Nguyễn Hữu Thọ</option>\n          </select>\n          <span className=\"px-2.5 py-1 rounded-lg text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200\">\n            {dataMode === 'LK' ? 'LUỸ KẾ THÁNG' : 'REALTIME HÔM NAY'}\n          </span>\n          <span className=\"text-xs text-slate-400 font-medium\">\n            Tiến độ tháng: <b>Ngày {calendarDay} / {daysInMonth}</b> (Đã qua: {progressPct.toFixed(1)}%)\n          </span>\n        </div>\n\n        <div className=\"flex items-center gap-2\">\n          <div className=\"flex bg-slate-100 rounded-xl p-1 text-xs font-semibold shadow-inner\">\n            <button\n              onClick={() => setDataMode('LK')}\n              className={`px-3 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                dataMode === 'LK' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              LUỸ KẾ THÁNG\n            </button>\n            <button\n              onClick={() => setDataMode('RT')}\n              className={`px-3 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                dataMode === 'RT' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              REALTIME HÔM NAY\n            </button>\n          </div>\n          <button\n            onClick={onExportTab}\n            className=\"px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-xs transition cursor-pointer\"\n          >\n            <Camera className=\"w-3.5 h-3.5\" />\n            <span>Chụp ảnh báo cáo</span>\n          </button>\n        </div>\n      </div>\n\n      {/* 8 Metric Cards Grid */}\n      <div className=\"grid grid-cols-2 md:grid-cols-4 gap-4\">\n        <div className=\"bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-blue-100\">DOANH THU THỰC</span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {dtt > 0 ? formatCurrency(dtt, 1) : '0'}\n          </div>\n          <div className=\"text-[11px] text-blue-100 flex justify-between border-t border-blue-400/50 pt-2 mt-1\">\n            <span>TARGET:</span>\n            <strong>{formatCurrency(target, 1)} TR</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-teal-500 to-emerald-600 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-emerald-100\">DOANH THU QĐ</span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {dtqd > 0 ? formatCurrency(dtqd, 1) : '0'}\n          </div>\n          <div className=\"text-[11px] text-emerald-100 flex justify-between border-t border-emerald-400/50 pt-2 mt-1\">\n            <span>TARGET:</span>\n            <strong>{formatCurrency(target_qd, 1)} TR</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-amber-500 to-orange-500 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-amber-100\">\n            DOANH THU TRẢ CHẬM\n          </span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {formatPercent(tg_pct, 0)}\n          </div>\n          <div className=\"text-[11px] text-amber-100 flex justify-between border-t border-amber-400/50 pt-2 mt-1\">\n            <span>DT TRẢ CHẬM:</span>\n            <strong>{formatCurrency(tragop, 1)} TR</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-sky-400 to-cyan-500 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-cyan-100\">LƯỢT KHÁCH / BILL</span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {bill}\n          </div>\n          <div className=\"text-[11px] text-cyan-100 flex justify-between border-t border-cyan-300/50 pt-2 mt-1\">\n            <span>BILL MÁY:</span>\n            <strong>{sl} món</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-purple-500 to-indigo-600 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-purple-100\">\n            % HT QĐ DỰ KIẾN\n          </span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {formatPercent(runrate_forecast, 0)}\n          </div>\n          <div className=\"text-[11px] text-purple-100 flex justify-between border-t border-purple-400/50 pt-2 mt-1\">\n            <span>DTQĐ DỰ KIẾN:</span>\n            <strong>{formatCurrency(forecast_val, 0)} TR</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-rose-500 to-pink-600 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-rose-100\">% QUY ĐỔI</span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {formatPercent(qd_pct, 0)}\n          </div>\n          <div className=\"text-[11px] text-rose-100 flex justify-between border-t border-rose-400/50 pt-2 mt-1\">\n            <span>MỤC TIÊU:</span>\n            <strong>150%</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-indigo-600 to-violet-700 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-indigo-100\">\n            THI ĐUA HOÀN THÀNH\n          </span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {htCount}/{storeTd.length}\n          </div>\n          <div className=\"text-[11px] text-indigo-100 flex justify-between border-t border-indigo-400/50 pt-2 mt-1\">\n            <span>TỶ LỆ MÔN:</span>\n            <strong>{storeTd.length > 0 ? formatPercent((htCount / storeTd.length) * 100, 0) : '0%'}</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-amber-600 to-amber-700 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-amber-100\">\n            TĂNG/GIẢM CÙNG KỲ\n          </span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {vs3MonthPct >= 0 ? ' +' : ''}{vs3MonthPct.toFixed(1)}%\n          </div>\n          <div className=\"text-[11px] text-amber-100 flex justify-between border-t border-amber-500/50 pt-2 mt-1\">\n            <span>SO TB 3 THÁNG:</span>\n            <strong>{formatCurrency(tb3thang, 1)} TR</strong>\n          </div>\n        </div>\n      </div>\n\n      {/* Grid of Competition Cards */}\n      <div className=\"grid grid-cols-1 md:grid-cols-2 gap-3.5\">\n        {storeTd.map((r, idx) => {\n          const ten = r['CHƯƠNG TRÌNH'] || '';\n          const pct = parseFloat(String(r['% HT THÁNG'])) || 0;\n          const dt = parseFloat(String(r['DOANH THU (TR)'])) || 0;\n          const dtqd = parseFloat(String(r['DT QUY ĐỔI (TR)'])) || 0;\n          const sl = parseFloat(String(r['SỐ LƯỢNG'])) || 0;\n          const tg = parseFloat(String(r['TARGET (TR/SL theo LOẠI TĐ)'])) || 0;\n          const loai = Number(r['LOẠI TĐ']);\n\n          let displayVal = `${dt.toFixed(0)}/${tg.toFixed(0)}`;\n          let tag = 'DTLK';\n          if (loai === 2) {\n            displayVal = `${sl}/${tg}`;\n            tag = 'SLLK';\n          } else if (loai === 3) {\n            displayVal = `${dtqd.toFixed(0)}/${tg.toFixed(0)}`;\n            tag = 'DTQĐ';\n          }\n\n          const remain = Math.max(0, tg - (loai === 2 ? sl : loai === 3 ? dtqd : dt));\n\n          let badgeColor = 'bg-rose-50 text-rose-700 border-rose-200';\n          let barColor = 'bg-rose-500';\n          if (pct >= 100) {\n            badgeColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';\n            barColor = 'bg-emerald-500';\n          } else if (pct >= 70) {\n            badgeColor = 'bg-amber-50 text-amber-700 border-amber-200';\n            barColor = 'bg-amber-500';\n          }\n\n          return (\n            <div\n              key={idx}\n              onClick={() => onOpenProgramDetail(activeStore === '10341' ? 'TopZone' : 'TGDĐ', r['MÃ CHƯƠNG TRÌNH'], ten)}\n              title=\"Bấm để xem chi tiết nhân viên bán môn này\"\n              className=\"bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs hover:border-blue-500 hover:shadow-md cursor-pointer transition space-y-2.5\"\n            >\n              <div className=\"flex items-center justify-between\">\n                <h5 className=\"font-bold text-slate-800 text-xs truncate max-w-[220px]\" title={ten}>\n                  {formatProgramName(ten)}\n                </h5>\n                <span className={`px-2 py-0.5 rounded-lg text-xs font-black border ${badgeColor}`}>\n                  {formatPercent(pct, 0)}\n                </span>\n              </div>\n\n              <div className=\"w-full bg-slate-100 h-2 rounded-full overflow-hidden\">\n                <div\n                  className={`${barColor} h-full rounded-full transition-all duration-500`}\n                  style={{ width: `${Math.min(Math.max(pct, 0), 100)}%` }}\n                ></div>\n              </div>\n\n              <div className=\"flex items-center justify-between text-[11px] text-slate-500 pt-0.5\">\n                <span>\n                  {tag}: <strong className=\"text-slate-800 font-bold\">{displayVal}</strong>\n                </span>\n                <span className=\"text-slate-400\">\n                  Còn: <b className=\"text-slate-700 font-bold\">{remain.toFixed(0)}</b>\n                </span>\n              </div>\n            </div>\n          );\n        })}\n      </div>\n    </div>\n  );\n};\n","src/views/DuBaoView.tsx":"import React, { useState, useEffect } from 'react';\nimport { Camera, TrendingUp, Calendar, AlertCircle } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatPercent } from '../utils/formatters';\nimport { calculateForecast } from '../utils/forecastEngine';\nimport { useStretchGoalPct } from '../utils/stretchGoal';\n\ninterface DuBaoViewProps {\n  appData: AppDataState;\n  onExportTab: () => void;\n}\n\n// Một hình thanh kéo dùng chung cho web và ảnh; input trong suốt chỉ nhận thao tác.\nconst ForecastSlider = ({min, max, value, step = 1, onChange, label, green = false}: {\n  min: number; max: number; value: number; step?: number;\n  onChange: (value: number) => void; label: string; green?: boolean;\n}) => {\n  const position = max > min ? Math.min(100, Math.max(0, (value - min) / (max - min) * 100)) : 0;\n  return <div data-export-slider=\"true\" style={{position:'relative', height:24, width:'100%', margin:'4px 0'}}>\n    <div style={{position:'absolute', left:7, right:7, top:0, height:24}}>\n      <svg width=\"100%\" height=\"24\" aria-hidden=\"true\" style={{display:'block', overflow:'visible'}}>\n        <rect x=\"0\" y=\"8\" width=\"100%\" height=\"8\" rx=\"4\" fill=\"#e2e8f0\" />\n        <circle cx={`${position}%`} cy=\"12\" r=\"7\" fill={green ? '#059669' : '#2563eb'} />\n      </svg>\n    </div>\n    <input className=\"no-export\" aria-label={label} type=\"range\" min={min} max={max} step={step} value={value}\n      onChange={e => onChange(Number(e.target.value))}\n      style={{position:'absolute', inset:0, width:'100%', height:24, margin:0, opacity:0, cursor:'pointer'}} />\n  </div>;\n};\n\nexport const DuBaoView: React.FC<DuBaoViewProps> = ({ appData, onExportTab }) => {\n  // Dữ liệu DT lũy kế của BI chỉ chốt đến hết NGÀY HÔM QUA.\n  // Vì vậy ngày hiện tại không được tính là ngày đã qua: 12/09 => 11 ngày đã qua.\n  // Có thể kéo thanh để mô phỏng kịch bản; giá trị mô phỏng sẽ được giữ nguyên trong ngày.\n  const getCurrentMonthProgress = () => {\n    const now = new Date();\n    const total = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();\n    const elapsed = Math.max(0, Math.min(total, now.getDate() - 1));\n    return { day: elapsed, total };\n  };\n\n  const initialProgress = getCurrentMonthProgress();\n  const [daysPassed, setDaysPassed] = useState<number>(initialProgress.day);\n  const [totalDays, setTotalDays] = useState<number>(initialProgress.total);\n  \n  // Tự đồng bộ lại khi sang ngày mới. Trong cùng một ngày vẫn cho phép anh kéo\n  // thanh để mô phỏng các kịch bản nếu cần.\n  useEffect(() => {\n    const syncCalendarProgress = () => {\n      const progress = getCurrentMonthProgress();\n      setDaysPassed(prev => {\n        // Chỉ tự chuyển sang ngày mới nếu state đang bám theo ngày thực tế hôm qua.\n        // Ví dụ: ngày 12/09 state = 11; sang 13/09 sẽ tự thành 12.\n        const actualElapsed = Math.max(0, new Date().getDate() - 1);\n        const previousElapsed = Math.max(0, actualElapsed - 1);\n        return prev === previousElapsed ? actualElapsed : prev;\n      });\n      setTotalDays(progress.total);\n    };\n\n    const timer = window.setInterval(syncCalendarProgress, 60 * 1000);\n    return () => window.clearInterval(timer);\n  }, []);\n  const [stretchGoalPct, setStretchGoalPct] = useStretchGoalPct();\n\n  const lk = appData.dt_luyke || [];\n  const shopRows = lk.filter(r => String(r['MÃ ĐƠN VỊ'] || '').trim() && !/^t[oổ]ng/i.test(String(r['TÊN ĐƠN VỊ'] || '')));\n  // Ưu tiên ghép đúng siêu thị bằng mã đơn vị, không phụ thuộc thứ tự dòng Excel.\n  // Giữ cách lấy theo vị trí làm dự phòng để tương thích với dữ liệu cũ thiếu mã.\n  const findStoreByCode = (code: string) => shopRows.find(r => String(r['MÃ ĐƠN VỊ'] || '').trim() === code);\n  const codedAar = findStoreByCode('10341');\n  const codedTgd = findStoreByCode('933');\n  const rowAar = codedAar || shopRows.find(r => r !== codedTgd) || {};\n  const rowTgd = codedTgd || shopRows.find(r => r !== rowAar) || {};\n\n  const aar_dtqd = parseFloat(String(rowAar['DOANH THU QĐ (TR)'])) || 0;\n  const aar_target = parseFloat(String(rowAar['TARGET QĐ (TR)'])) || parseFloat(String(rowAar['TARGET (TR)'])) || 0;\n\n  const tgd_dtqd = parseFloat(String(rowTgd['DOANH THU QĐ (TR)'])) || 0;\n  const tgd_target = parseFloat(String(rowTgd['TARGET QĐ (TR)'])) || parseFloat(String(rowTgd['TARGET (TR)'])) || 0;\n\n  const remainingDays = Math.max(1, totalDays - daysPassed);\n\n  // Simulation calculations\n  const calcSim = (current: number, target: number) => {\n    const adjustedTarget = target * (stretchGoalPct / 100);\n    const forecastResult = calculateForecast(current, target, daysPassed, totalDays, stretchGoalPct);\n    const forecast = forecastResult.forecast;\n    const gap = Math.max(0, adjustedTarget - current);\n    const neededPerDay = gap / remainingDays;\n    const currentRunRate = daysPassed > 0 ? current / daysPassed : 0;\n    const runRateGap = neededPerDay - currentRunRate;\n    const expectedPct = target > 0 ? (forecast / target * 100) : 0;\n\n    return {\n      forecast,\n      gap,\n      neededPerDay,\n      currentRunRate,\n      runRateGap,\n      expectedPct,\n      adjustedTarget,\n    };\n  };\n\n  const aarSim = calcSim(aar_dtqd, aar_target);\n  const tgdSim = calcSim(tgd_dtqd, tgd_target);\n\n  const cum_dtqd = aar_dtqd + tgd_dtqd;\n  const cum_target = aar_target + tgd_target;\n  const cumSim = calcSim(cum_dtqd, cum_target);\n\n  return (\n    <div className=\"space-y-6\">\n      {/* 1. Header Bar */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div>\n          <h3 className=\"font-black text-slate-900 text-lg uppercase tracking-tight flex items-center gap-2\">\n            <TrendingUp className=\"w-5 h-5 text-emerald-600\" />\n            <span>MÔ PHỎNG DỰ BÁO DOANH THU & KẾ HOẠCH BỨT PHÁ</span>\n          </h3>\n          <p className=\"text-xs text-slate-500 font-medium\">\n            Tính toán Run-rate chuẩn, dự báo cuối tháng và target doanh thu cần chạy từng ngày\n          </p>\n        </div>\n\n        <div className=\"flex items-center gap-3\">\n          <button\n            onClick={() => onExportTab()}\n            className=\"no-export px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-xs transition cursor-pointer\"\n          >\n            <Camera className=\"w-3.5 h-3.5\" />\n            <span>Xuất ảnh</span>\n          </button>\n        </div>\n      </div>\n\n      {/* 2. Simulation Sliders / Config Panel */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n        <h4 className=\"font-extrabold text-slate-900 text-xs uppercase flex items-center gap-1.5\">\n          <Calendar className=\"w-4 h-4 text-blue-600\" />\n          <span>Thông Số Kế Hoạch & Tiến Độ Tháng</span>\n        </h4>\n\n        <div className=\"grid grid-cols-1 sm:grid-cols-3 gap-5\">\n          <div>\n            <div className=\"flex justify-between text-xs font-bold text-slate-700 mb-1\">\n              <span>Số ngày đã qua:</span>\n              <span className=\"text-blue-600 font-black\">{daysPassed} ngày</span>\n            </div>\n            <ForecastSlider label=\"Số ngày đã qua\" min={0} max={totalDays} value={daysPassed} onChange={setDaysPassed} />\n            <span className=\"text-[10px] text-slate-400\">Tiến độ thời gian: {((daysPassed / totalDays) * 100).toFixed(1)}%</span>\n          </div>\n\n          <div>\n            <div className=\"flex justify-between text-xs font-bold text-slate-700 mb-1\">\n              <span>Tổng số ngày trong tháng:</span>\n              <span className=\"text-slate-900 font-black\">{totalDays} ngày</span>\n            </div>\n            <ForecastSlider label=\"Tổng số ngày trong tháng\" min={28} max={31} value={totalDays} onChange={value => { setTotalDays(value); setDaysPassed(prev => Math.min(prev, value)); }} />\n            <span className=\"text-[10px] text-slate-400\">Còn lại: {remainingDays} ngày để về đích</span>\n          </div>\n\n          <div>\n            <div className=\"flex justify-between text-xs font-bold text-slate-700 mb-1\">\n              <span>Mục tiêu phấn đấu (Stretch Goal):</span>\n              <span className=\"text-emerald-600 font-black\">{stretchGoalPct}% Target</span>\n            </div>\n            <ForecastSlider label=\"Mục tiêu phấn đấu\" min={90} max={150} step={5} value={stretchGoalPct} onChange={setStretchGoalPct} green />\n            <span className=\"text-[10px] text-slate-400\">Điều chỉnh chỉ tiêu thưởng bứt phá • Đồng bộ toàn hệ thống</span>\n          </div>\n        </div>\n      </div>\n\n      {/* 3. Three Forecast Comparison Cards */}\n      <div className=\"grid grid-cols-1 md:grid-cols-3 gap-5\">\n        {/* TỔNG CỤM */}\n        <div className=\"bg-slate-900 text-white rounded-2xl p-5 shadow-sm space-y-4\">\n          <div className=\"flex justify-between items-center pb-2 border-b border-slate-800\">\n            <div>\n              <span className=\"text-[10px] font-bold text-amber-400 uppercase\">★ TOÀN CỤM 933</span>\n              <h4 className=\"text-base font-black\">Tổng Cụm Siêu Thị</h4>\n            </div>\n            <span className=\"text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300\">\n              {daysPassed}/{totalDays} ngày\n            </span>\n          </div>\n\n          <div className=\"space-y-2.5 text-xs\">\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-400\">DT QĐ Hiện Tại:</span>\n              <span className=\"font-mono font-bold\">{formatCurrency(cum_dtqd)} Tr</span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-400\">Target Mục Tiêu:</span>\n              <span className=\"font-mono font-bold\">{formatCurrency(cumSim.adjustedTarget)} Tr</span>\n            </div>\n            <div className=\"flex justify-between items-baseline pt-1 border-t border-slate-800\">\n              <span className=\"text-slate-400\">Dự Báo Cuối Tháng:</span>\n              <span className=\"text-lg font-black text-amber-300 font-mono\">\n                {formatCurrency(cumSim.forecast)} Tr\n              </span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-400\">% dự báo / target gốc:</span>\n              <span className={`font-black ${cumSim.expectedPct >= 100 ? 'text-emerald-400' : 'text-rose-400'}`}>\n                {formatPercent(cumSim.expectedPct)}\n              </span>\n            </div>\n            <div className=\"flex justify-between gap-2\">\n              <span className=\"text-slate-400\">% dự báo / mục tiêu {stretchGoalPct}%:</span>\n              <span className={`font-black ${cumSim.forecast >= cumSim.adjustedTarget && cumSim.adjustedTarget > 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{cumSim.adjustedTarget > 0 ? formatPercent(cumSim.forecast / cumSim.adjustedTarget * 100) : '—'}</span>\n            </div>\n            <div className=\"p-3 bg-slate-800/80 rounded-xl space-y-1 mt-2\">\n              <span className=\"text-[10.5px] text-slate-400 uppercase block font-bold\">\n                🎯 TARGET CẦN CHẠY MỖI NGÀY\n              </span>\n              <span className=\"text-xl font-black text-rose-300 block font-mono\">\n                {formatCurrency(cumSim.neededPerDay)} Tr/ngày\n              </span>\n              <span className=\"text-[10px] text-slate-400 block\">\n                (Hiện đang chạy: {formatCurrency(cumSim.currentRunRate)} Tr/ngày)\n              </span>\n            </div>\n          </div>\n        </div>\n\n        {/* TGD NHT */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex justify-between items-center pb-2 border-b border-slate-100\">\n            <div>\n              <span className=\"text-[10px] font-bold text-amber-600 uppercase\">933</span>\n              <h4 className=\"text-base font-black text-slate-900\">TGD NHT</h4>\n            </div>\n            <span className=\"text-xs font-bold px-2 py-0.5 rounded bg-amber-50 text-amber-800 border border-amber-200\">\n              {formatPercent(tgd_target > 0 ? (tgd_dtqd / tgd_target * 100) : 0)} HT\n            </span>\n          </div>\n\n          <div className=\"space-y-2.5 text-xs\">\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">DT QĐ Hiện Tại:</span>\n              <span className=\"font-mono font-bold text-slate-800\">{formatCurrency(tgd_dtqd)} Tr</span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">Target Mục Tiêu:</span>\n              <span className=\"font-mono font-bold text-slate-600\">{formatCurrency(tgdSim.adjustedTarget)} Tr</span>\n            </div>\n            <div className=\"flex justify-between items-baseline pt-1 border-t border-slate-100\">\n              <span className=\"text-slate-500\">Dự Báo Cuối Tháng:</span>\n              <span className=\"text-lg font-black text-blue-600 font-mono\">\n                {formatCurrency(tgdSim.forecast)} Tr\n              </span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">% dự báo / target gốc:</span>\n              <span className={`font-black ${tgdSim.expectedPct >= 100 ? 'text-emerald-600' : 'text-rose-600'}`}>\n                {formatPercent(tgdSim.expectedPct)}\n              </span>\n            </div>\n            <div className=\"flex justify-between gap-2\">\n              <span className=\"text-slate-500\">% dự báo / mục tiêu {stretchGoalPct}%:</span>\n              <span className={`font-black ${tgdSim.forecast >= tgdSim.adjustedTarget && tgdSim.adjustedTarget > 0 ? 'text-emerald-600' : 'text-rose-600'}`}>{tgdSim.adjustedTarget > 0 ? formatPercent(tgdSim.forecast / tgdSim.adjustedTarget * 100) : '—'}</span>\n            </div>\n            <div className=\"p-3 bg-amber-50/70 border border-amber-200 rounded-xl space-y-1 mt-2\">\n              <span className=\"text-[10.5px] text-amber-800 uppercase block font-bold\">\n                🎯 CẦN CHẠY MỖI NGÀY\n              </span>\n              <span className=\"text-xl font-black text-rose-600 block font-mono\">\n                {formatCurrency(tgdSim.neededPerDay)} Tr/ngày\n              </span>\n              <span className=\"text-[10px] text-slate-500 block\">\n                (Hiện tại: {formatCurrency(tgdSim.currentRunRate)} Tr/ngày)\n              </span>\n            </div>\n          </div>\n        </div>\n\n        {/* AAR NHT */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex justify-between items-center pb-2 border-b border-slate-100\">\n            <div>\n              <span className=\"text-[10px] font-bold text-blue-600 uppercase\">10341</span>\n              <h4 className=\"text-base font-black text-slate-900\">AAR NHT (TopZone)</h4>\n            </div>\n            <span className=\"text-xs font-bold px-2 py-0.5 rounded bg-blue-50 text-blue-800 border border-blue-200\">\n              {formatPercent(aar_target > 0 ? (aar_dtqd / aar_target * 100) : 0)} HT\n            </span>\n          </div>\n\n          <div className=\"space-y-2.5 text-xs\">\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">DT QĐ Hiện Tại:</span>\n              <span className=\"font-mono font-bold text-slate-800\">{formatCurrency(aar_dtqd)} Tr</span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">Target Mục Tiêu:</span>\n              <span className=\"font-mono font-bold text-slate-600\">{formatCurrency(aarSim.adjustedTarget)} Tr</span>\n            </div>\n            <div className=\"flex justify-between items-baseline pt-1 border-t border-slate-100\">\n              <span className=\"text-slate-500\">Dự Báo Cuối Tháng:</span>\n              <span className=\"text-lg font-black text-blue-600 font-mono\">\n                {formatCurrency(aarSim.forecast)} Tr\n              </span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">% dự báo / target gốc:</span>\n              <span className={`font-black ${aarSim.expectedPct >= 100 ? 'text-emerald-600' : 'text-rose-600'}`}>\n                {formatPercent(aarSim.expectedPct)}\n              </span>\n            </div>\n            <div className=\"flex justify-between gap-2\">\n              <span className=\"text-slate-500\">% dự báo / mục tiêu {stretchGoalPct}%:</span>\n              <span className={`font-black ${aarSim.forecast >= aarSim.adjustedTarget && aarSim.adjustedTarget > 0 ? 'text-emerald-600' : 'text-rose-600'}`}>{aarSim.adjustedTarget > 0 ? formatPercent(aarSim.forecast / aarSim.adjustedTarget * 100) : '—'}</span>\n            </div>\n            <div className=\"p-3 bg-blue-50/70 border border-blue-200 rounded-xl space-y-1 mt-2\">\n              <span className=\"text-[10.5px] text-blue-800 uppercase block font-bold\">\n                🎯 CẦN CHẠY MỖI NGÀY\n              </span>\n              <span className=\"text-xl font-black text-rose-600 block font-mono\">\n                {formatCurrency(aarSim.neededPerDay)} Tr/ngày\n              </span>\n              <span className=\"text-[10px] text-slate-500 block\">\n                (Hiện tại: {formatCurrency(aarSim.currentRunRate)} Tr/ngày)\n              </span>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/views/KpiCustomView.tsx":"import { SortableTable } from '../components/SortableTable';\nimport React, { useState } from 'react';\nimport { Settings, Plus, RotateCcw, ShieldCheck, Eye, EyeOff, Trash2, CheckCircle2, UserCheck, RefreshCw } from 'lucide-react';\nimport { PersonnelConfigMap, AppDataState } from '../types';\nimport { getStretchGoalPct, getPersonnelAllocationPct, setPersonnelAllocationPct, clearPersonnelAllocationPct } from '../utils/stretchGoal';\n\ninterface KpiCustomViewProps {\n  appData?: AppDataState;\n  onUpdateAppData?: (newAppData: AppDataState) => void;\n  personnelConfig: PersonnelConfigMap;\n  onUpdateConfig: (newConfig: PersonnelConfigMap) => void;\n  onResetDefault: () => void;\n}\n\nexport const KpiCustomView: React.FC<KpiCustomViewProps> = ({\n  appData,\n  onUpdateAppData,\n  personnelConfig,\n  onUpdateConfig,\n  onResetDefault,\n}) => {\n  const [activeStore, setActiveStore] = useState<'TGDD' | 'TOPZONE'>('TGDD');\n  const [newStaffName, setNewStaffName] = useState<string>('');\n  const [toastMsg, setToastMsg] = useState<string>('');\n  const [isDivideMenuOpen, setIsDivideMenuOpen] = useState<boolean>(false);\n\n  const showToast = (msg: string) => {\n    setToastMsg(msg);\n    setTimeout(() => setToastMsg(''), 2500);\n  };\n\n  const currentStoreConfigs: Record<string, any> = personnelConfig[activeStore] || {};\n  const staffList = Object.entries(currentStoreConfigs).map(([name, cfg]) => {\n    const c = (cfg || {}) as { isOfficial?: boolean; isVisible?: boolean; targetPct?: number };\n    return {\n      name,\n      isOfficial: c.isOfficial === true,\n      isVisible: c.isVisible !== false,\n      targetPct: c.targetPct ?? (activeStore === 'TGDD' ? 37.5 : 25.0),\n    };\n  });\n\n  // Helper to match staff row across Excel tables\n  const isMatchingStaffRow = (r: any, targetName: string) => {\n    const fields = [\n      r['ĐƠN VỊ / NHÂN VIÊN'],\n      r['TÊN NHÂN VIÊN'],\n      r['Nhân viên'],\n      r['Họ và tên'],\n      r['MÃ NV'],\n      r['Mã NV'],\n      r['MÃ NHÂN VIÊN'],\n    ];\n\n    const normTarget = targetName.trim().toLowerCase();\n    const parenMatch = targetName.match(/\\((\\d+)\\)/);\n    const codeInParen = parenMatch ? parenMatch[1] : '';\n    const cleanTarget = targetName.replace(/\\(\\d+\\)/g, '').trim().toLowerCase();\n\n    return fields.some(f => {\n      if (!f) return false;\n      const str = String(f).trim().toLowerCase();\n      if (str === normTarget || str === cleanTarget) return true;\n      if (cleanTarget && cleanTarget.length >= 3 && str.includes(cleanTarget)) return true;\n      if (codeInParen && str.includes(codeInParen)) return true;\n      return false;\n    });\n  };\n\n  const handleToggleOfficial = (name: string) => {\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    if (!next[activeStore][name]) next[activeStore][name] = {};\n    const curr = next[activeStore][name].isOfficial === true;\n    next[activeStore][name].isOfficial = !curr;\n    onUpdateConfig(next);\n    showToast(`Đã chuyển nhân sự ${name} sang ${!curr ? 'Nội bộ' : 'Hỗ trợ'}`);\n  };\n\n  const handleToggleVisible = (name: string) => {\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    if (!next[activeStore][name]) next[activeStore][name] = {};\n    const curr = next[activeStore][name].isVisible !== false;\n    next[activeStore][name].isVisible = !curr;\n    onUpdateConfig(next);\n    showToast(`Đã ${!curr ? 'HIỆN' : 'ẨN'} nhân sự ${name}`);\n  };\n\n  const handleChangeTarget = (name: string, val: number) => {\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    if (!next[activeStore][name]) next[activeStore][name] = {};\n    next[activeStore][name].targetPct = val;\n    onUpdateConfig(next);\n  };\n\n  // Đồng bộ toàn bộ data khi xóa nhân sự\n  const handleDeleteStaff = (name: string) => {\n    if (\n      !window.confirm(\n        `Bạn có chắc muốn xóa nhân viên \"${name}\" khỏi danh sách? Thao tác này sẽ tự động loại bỏ và đồng bộ toàn bộ dữ liệu liên quan của nhân sự này khỏi tất cả các bảng dữ liệu hiện có.`\n      )\n    ) {\n      return;\n    }\n\n    // 1. Xóa khỏi Personnel Config\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (next[activeStore]) {\n      delete next[activeStore][name];\n      // Loại bỏ các key trùng hoặc tương tự\n      Object.keys(next[activeStore]).forEach(k => {\n        if (k.toLowerCase().trim() === name.toLowerCase().trim()) {\n          delete next[activeStore][k];\n        }\n      });\n    }\n\n    // 2. Tự động cân bằng lại tỷ lệ target cho các nhân sự nội bộ đang hiển thị\n    const remainingOfficials = Object.entries(next[activeStore] || {})\n      .map(([n, cfg]: [string, any]) => ({\n        name: n,\n        isOfficial: cfg?.isOfficial === true,\n        isVisible: cfg?.isVisible !== false,\n      }))\n      .filter(s => s.isOfficial);\n\n    if (remainingOfficials.length > 0) {\n      const equalPct = Math.round((100 / remainingOfficials.length) * 10) / 10;\n      remainingOfficials.forEach(s => {\n        if (next[activeStore][s.name]) {\n          next[activeStore][s.name].targetPct = equalPct;\n        }\n      });\n    }\n\n    onUpdateConfig(next);\n\n    // 3. Đồng bộ dọn sạch toàn bộ data trong AppDataState\n    if (appData && onUpdateAppData) {\n      const filterRows = (arr: any[]) => {\n        if (!arr) return [];\n        return arr.filter(r => !isMatchingStaffRow(r, name));\n      };\n\n      const newAppData: AppDataState = {\n        ...appData,\n        nv_tgdd: activeStore === 'TGDD' ? filterRows(appData.nv_tgdd || []) : appData.nv_tgdd,\n        nv_tz: activeStore === 'TOPZONE' ? filterRows(appData.nv_tz || []) : appData.nv_tz,\n        dt_nv_luyke: filterRows(appData.dt_nv_luyke || []),\n        dt_nv_realtime: filterRows(appData.dt_nv_realtime || []),\n      };\n\n      onUpdateAppData(newAppData);\n    }\n\n    showToast(`Đã xóa ${name} và đồng bộ toàn bộ data thành công!`);\n  };\n\n  // Đồng bộ toàn diện dữ liệu đang có với danh sách cấu hình\n  const handleSyncAllData = () => {\n    if (!appData || !onUpdateAppData) return;\n\n    // Lấy danh sách tên hợp lệ\n    const tgddNames = new Set(Object.keys(personnelConfig['TGDD'] || {}).map(n => n.toLowerCase().trim()));\n    const tzNames = new Set(Object.keys(personnelConfig['TOPZONE'] || {}).map(n => n.toLowerCas
