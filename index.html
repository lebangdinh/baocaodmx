<style id="app-custom-css">

:root {

/* Tabular figures for numbers across tables and cards */

/* Custom Scrollbar */
.custom-scroll::-webkit-scrollbar {
  width: 6px;

}

  background: #f1f5f9;
}

}

  background: #94a3b8;
}

.nav-item-active {
  background-color: #1d4ed8 !important;
  color: #ffffff !important;
  font-weight: 700 !important;
  box-shadow: 0 4px 12px -2px rgba(29, 78, 216, 0.3);
}
.nav-item-active svg {
  color: #ffffff !important;
}

/* Table grid borders */
.table-grid-caro td, .table-grid-caro th {
  border: 1px solid var(--grid-color) !important;
}
.table-grid-horizontal td, .table-grid-horizontal th {
  border-bottom: 1px solid var(--grid-color) !important;
  border-top: 1px solid var(--grid-color) !important;
  border-left: none !important;
  border-right: none !important;
}
.table-grid-none td, .table-grid-none th {
  border: none !important;
}

/* Interactive table headers */
table thead th {
  user-select: none;
  transition: background-color 0.15s ease;
}
table thead th:hover {
  background-color: rgba(37, 99, 235, 0.08);
}

/* Image Export Clean Rules */
.export-only {
  display: none;
}

.is-exporting .no-export {
  display: none !important;
}

.is-exporting .export-only {
  display: inline-flex !important;
}

.is-exporting .card-programs-container,

  max-height: none !important;
  height: auto !important;
  overflow: visible !important;
  overflow-y: visible !important;
  overflow-x: visible !important;
}

/* Suppress all scrollbars during export */
.is-exporting *::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
.is-exporting * {
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}

/* Ensure crystal-clear text during export */
.is-exporting {
  -webkit-font-smoothing: subpixel-antialiased !important;
  text-rendering: geometricPrecision !important;
}



/* SCREEN EXPORT COMPACT MODE: hide only CẦN CHẠY + TRẠNG THÁI from competition tables.
   This class is activated only while exporting with the "Màn hình" layout. */
.is-exporting-screen .export-competition-table thead th:nth-child(8),
.is-exporting-screen .export-competition-table tbody td:nth-child(8),
.is-exporting-screen .export-competition-table thead th:nth-child(9),
.is-exporting-screen .export-competition-table tbody td:nth-child(9) {
  display: none !important;
}

/* 1250px screen export: keep the two sides visually balanced. */
.is-exporting-screen .export-stack-two-columns {
  width: 1250px !important;

  max-width: 1250px !important;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) !important;

/* Let the remaining 7 columns use the available half-width cleanly. */

  width: 100% !important;
  min-width: 0 !important;
  table-layout: auto !important;

.is-exporting-screen .export-competition-table th,

}

.is-exporting-screen .export-competition-table th:first-child,

  width: 135px !important;
  min-width: 135px !important;
  max-width: 135px !important;
  white-space: normal !important;
}

/* Section 1: enlarge the actual numeric/body values by exactly ~20% from Tailwind text-xs (12px -> 14.4px).

/* Make the store labels and the key percentage values readable too. */

<script id="embedded-source" type="application/json">{"src/App.tsx":"import React, { useState, useEffect, useRef } from 'react';\nimport { Trash2, AlertTriangle, X } from 'lucide-react';\nimport { ViewType, AppDataState, PersonnelConfigMap, ScreenshotItem } from './types';\nimport { Header } from './components/Header';\nimport { Sidebar } from './components/Sidebar';\nimport { QuickUploadModal } from './components/QuickUploadModal';\nimport { ProgramDetailModal } from './components/ProgramDetailModal';\nimport { ImageExportModal } from './components/ImageExportModal';\nimport { ClearSessionModal } from './components/ClearSessionModal';\nimport { Drawers, DrawerType } from './components/Drawers';\nimport { captureElement, downloadImage } from './utils/imageExporter';\nimport { validateAppData } from './utils/dataValidation';\nimport { OperationalPulse } from './components/OperationalPulse';\nimport { DailyProgressView } from './views/DailyProgressView';\n\nimport { BaoCaoCuoiNgayView } from './views/BaoCaoCuoiNgayView';\nimport { ThiDuaStView } from './views/ThiDuaStView';\nimport { SucKhoeCumView } from './views/SucKhoeCumView';\nimport { DoanhThuStView } from './views/DoanhThuStView';\nimport { SucKhoeNvView } from './views/SucKhoeNvView';\nimport { SoSanhView } from './views/SoSanhView';\nimport { DuBaoView } from './views/DuBaoView';\nimport { KpiCustomView } from './views/KpiCustomView';\nimport { DataQualityCenterView } from './views/DataQualityCenterView';\nimport { TraChamView } from './views/TraChamView';\nimport { useStretchGoalPct, StretchGoalSyncStatus } from './utils/stretchGoal';\nimport { syncDailyDataSlots, fetchTodayCloudSnapshot, subscribeTodayCloudSnapshot, DailyCloudSnapshot } from './utils/dailyCloudHandoff';\n\nconst STORAGE_KEY_DATA = 'skst_app_data_v7';\nconst STORAGE_KEY_LAST_IMPORT = 'skst_last_import_at_v1';\nconst STORAGE_KEY_PERSONNEL = 'skst_personnel_config_v7';\nconst STORAGE_KEY_AUTO_BACKUPS = 'skst_auto_backups_v2';\nconst STORAGE_KEY_DAILY = 'skst_daily_snapshots_v1';\nconst STORAGE_KEY_DAILY_CLEAR_PROMPT = 'skst_daily_clear_prompt_v1';\nconst STORAGE_KEY_LAST_CLEAR_BACKUP = 'skst_last_clear_backup_v1';\nconst RETENTION_MS = 31 * 24 * 60 * 60 * 1000;\n\nfunction isExpiredArchive(record: any, now = Date.now()): boolean {\n  // Không đoán tuổi của bản cũ thiếu ngày hoặc có ngày không hợp lệ.\n  const raw = record?.savedAt || record?.updatedAt || (record?.date ? `${record.date}T23:59:59.999+07:00` : '');\n  const timestamp = Date.parse(raw);\n  return Number.isFinite(timestamp) && now - timestamp > RETENTION_MS;\n}\n\nfunction pruneExpiredArchives() {\n  const now = Date.now();\n  for (const key of [STORAGE_KEY_AUTO_BACKUPS, STORAGE_KEY_DAILY, STORAGE_KEY_LAST_CLEAR_BACKUP]) {\n    try {\n      const raw = localStorage.getItem(key);\n      if (!raw) continue;\n      const value = JSON.parse(raw);\n      if (key === STORAGE_KEY_LAST_CLEAR_BACKUP) {\n        if (isExpiredArchive(value, now)) localStorage.removeItem(key);\n      } else if (Array.isArray(value)) {\n        const kept = value.filter(record => !isExpiredArchive(record, now));\n        if (kept.length !== value.length) localStorage.setItem(key, JSON.stringify(kept));\n      }\n    } catch (error) { console.warn('Could not prune expired archives', error); }\n  }\n}\n\n// Dọn trước khi đọc state; không tác động dữ liệu phiên hoặc cấu hình nhân sự.\npruneExpiredArchives();\nconst LEGACY_STORAGE_KEYS = ['skst_app_data_v1','skst_personnel_config_v1','skst_app_data_v2','skst_personnel_config_v2','skst_app_data_v3','skst_personnel_config_v3','skst_app_data_v4','skst_personnel_config_v4','skst_app_data_v5','skst_personnel_config_v5','skst_app_data_v6','skst_personnel_config_v6'];\n\ntry {\n  LEGACY_STORAGE_KEYS.forEach((key) => localStorage.removeItem(key));\n} catch (e) {\n  console.warn('Could not clean legacy/demo storage', e);\n}\n\nconst EMPTY_APP_DATA: AppDataState = {\n  dt_luyke: [],\n  dt_realtime: [],\n  td_luyke: [],\n  td_realtime: [],\n  nv_tgdd: [],\n  nv_tz: [],\n  dt_nv_luyke: [],\n  dt_nv_realtime: [],\n  tra_cham_luyke: [],\n  tra_cham_realtime: [],\n};\n\nconst EMPTY_PERSONNEL_CONFIG: PersonnelConfigMap = { TGDD: {}, TOPZONE: {} };\n\n// Danh sách nhân sự mặc định của cụm NHT. Có thể chỉnh sửa trong Tùy Biến KPI Nhân Sự.\nconst DEFAULT_PERSONNEL_CONFIG: PersonnelConfigMap = {\n  TGDD: {\n    'Lê Văn Nhân': { isOfficial: true, isVisible: true, targetPct: 37.5 },\n    'Lê Thị Thanh Trâm': { isOfficial: true, isVisible: true, targetPct: 37.5 },\n    'Nguyễn Thị Thy': { isOfficial: true, isVisible: true, targetPct: 37.5 },\n    'Trần Thị Huyền Trang': { isOfficial: true, isVisible: true, targetPct: 37.5 },\n  },\n  TOPZONE: {\n    'Nguyễn Quỳnh Anh': { isOfficial: true, isVisible: true, targetPct: 25 },\n    'Trần Minh Hải': { isOfficial: true, isVisible: true, targetPct: 25 },\n    'Lê Thị Mỹ Linh': { isOfficial: true, isVisible: true, targetPct: 25 },\n    'Trần Thị Mỹ Trang': { isOfficial: true, isVisible: true, targetPct: 25 },\n    'Tạ Đức Hiếu': { isOfficial: true, isVisible: true, targetPct: 25 },\n    'Đỗ Nhật Trinh': { isOfficial: true, isVisible: true, targetPct: 25 },\n  },\n};\n\nexport default function App() {\n  // 1. App State\n  const [currentView, setCurrentView] = useState<ViewType>(ViewType.BAO_CAO_CUOI_NGAY);\n  const [activeStore, setActiveStore] = useState<string>('933');\n  const [stretchGoalPct] = useStretchGoalPct();\n  const [appData, setAppData] = useState<AppDataState>(() => {\n    try {\n      const saved = localStorage.getItem(STORAGE_KEY_DATA);\n      if (saved) return JSON.parse(saved);\n    } catch (e) {\n      console.error('Error loading saved app data:', e);\n    }\n    return EMPTY_APP_DATA;\n  });\n\n  const [lastImportAt, setLastImportAt] = useState<string | null>(() => {\n    try { return localStorage.getItem(STORAGE_KEY_LAST_IMPORT); } catch { return null; }\n  });\n  const updateLastImportAt = (value: string | null) => {\n    const next = value && Number.isFinite(Date.parse(value)) ? value : null;\n    setLastImportAt(next);\n    try {\n      if (next) localStorage.setItem(STORAGE_KEY_LAST_IMPORT, next);\n      else localStorage.removeItem(STORAGE_KEY_LAST_IMPORT);\n    } catch {}\n  };\n\n  const [personnelConfig, setPersonnelConfig] = useState<PersonnelConfigMap>(() => {\n    try {\n      const saved = localStorage.getItem(STORAGE_KEY_PERSONNEL);\n      if (saved) {\n        const parsed = JSON.parse(saved);\n        // Nếu đã có cấu hình trước đó thì giữ nguyên, nhưng luôn bổ sung nhân sự mặc định còn thiếu.\n        return {\n          TGDD: { ...(DEFAULT_PERSONNEL_CONFIG.TGDD || {}), ...(parsed?.TGDD || {}) },\n          TOPZONE: { ...(DEFAULT_PERSONNEL_CONFIG.TOPZONE || {}), ...(parsed?.TOPZONE || {}) },\n        };\n      }\n    } catch (e) {\n      console.error('Error loading saved personnel config:', e);\n    }\n    return DEFAULT_PERSONNEL_CONFIG;\n  });\n\n  // 2. Modals & Drawers\n  const [isUploadModalOpen, setIsUploadModalOpen] = useState<boolean>(false);\n  const [isClearModalOpen, setIsClearModalOpen] = useState<boolean>(false);\n  const [isDailyClearPromptOpen, setIsDailyClearPromptOpen] = useState<boolean>(false);\n  const [isDailyClearFlow, setIsDailyClearFlow] = useState<boolean>(false);\n  const [cloudHandoffOffer, setCloudHandoffOffer] = useState<DailyCloudSnapshot | null>(null);\n  const [cloudHandoffLoading, setCloudHandoffLoading] = useState<boolean>(false);\n  const [cloudLiveNotice, setCloudLiveNotice] = useState<DailyCloudSnapshot | null>(null);\n  const cloudSeenVersionRef = useRef<number>(0);\n  const cloudCheckAfterClearRef = useRef<boolean>(false);\n  const [activeDrawer, setActiveDrawer] = useState<DrawerType>(null);\n  const [isSidebarOpen, setIsSidebarOpen] = useState<boolean>(false);\n  const [screenshots, setScreenshots] = useState<ScreenshotItem[]>([]);\n  const [dailySnapshots, setDailySnapshots] = useState<any[]>(() => {\n    try {\n      const saved = localStorage.getItem(STORAGE_KEY_DAILY);\n      return saved ? JSON.parse(saved) : [];\n    } catch { return []; }\n  });\n  const [exportedImage, setExportedImage] = useState<{\n    dataUrl: string;\n    blob: Blob;\n    fileName: string;\n  } | null>(null);\n  const [isExporting, setIsExporting] = useState<boolean>(false);\n  const [lastClearedBackup, setLastClearedBackup] = useState<any | null>(() => {\n    try {\n      const raw = localStorage.getItem(STORAGE_KEY_LAST_CLEAR_BACKUP);\n      return raw ? JSON.parse(raw) : null;\n    } catch { return null; }\n  });\n\n  const [isClearNoticeVisible, setIsClearNoticeVisible] = useState(false);\n  // Ẩn thông báo sau 10 giây, không xóa bản an toàn.\n  useEffect(() => {\n    if (!lastClearedBackup) { setIsClearNoticeVisible(false); return; }\n    const age = Date.now() - Date.parse(lastClearedBackup.savedAt || '');\n    const remaining = Number.isFinite(age) ? Math.max(0, Math.min(10_000, 10_000 - age)) : 0;\n    setIsClearNoticeVisible(remaining > 0);\n    if (!remaining) return;\n    const timer = window.setTimeout(() => {\n      setIsClearNoticeVisible(false);\n    }, remaining);\n    return () => window.clearTimeout(timer);\n  }, [lastClearedBackup]);\n\n  const [drilldownModal, setDrilldownModal] = useState<{\n    isOpen: boolean;\n    storeKey: string;\n    programCode: string | number;\n    programName: string;\n  }>({\n    isOpen: false,\n    storeKey: 'TGDĐ',\n    programCode: '',\n    programName: '',\n  });\n\n  // Nhắc xóa data cũ đúng 1 lần mỗi ngày khi hệ thống được mở.\n  // Chỉ nhắc khi thực sự còn data phiên cũ; không tự động xóa dữ liệu.\n  useEffect(() => {\n    try {\n      const now = new Date();\n      const todayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;\n      const lastPromptDate = localStorage.getItem(STORAGE_KEY_DAILY_CLEAR_PROMPT);\n      const hasOldData = [\n        appData.dt_luyke,\n        appData.dt_realtime,\n        appData.td_luyke,\n        appData.td_realtime,\n        appData.nv_tgdd,\n        appData.nv_tz,\n        appData.dt_nv_luyke,\n        appData.dt_nv_realtime,\n        appData.tra_cham_luyke,\n        appData.tra_cham_realtime,\n      ].some((rows) => Array.isArray(rows) && rows.length > 0);\n\n      if (lastPromptDate !== todayKey && hasOldData) {\n        setIsDailyClearPromptOpen(true);\n      }\n    } catch (e) {\n      console.warn('Could not check daily clear prompt', e);\n    }\n  }, []);\n\n  const markDailyClearPromptSeen = () => {\n    try {\n      const now = new Date();\n      const todayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;\n      localStorage.setItem(STORAGE_KEY_DAILY_CLEAR_PROMPT, todayKey);\n    } catch (e) {}\n  };\n\n  const handleDailyClearPromptOpen = () => {\n    setIsDailyClearPromptOpen(false);\n    setIsDailyClearFlow(true);\n    setIsClearModalOpen(true);\n  };\n\n  const handleDailyClearPromptSkip = () => {\n    markDailyClearPromptSeen();\n    setIsDailyClearPromptOpen(false);\n  };\n\n  // UI Theme Customization States\n  const [themeFont, setThemeFont] = useState<string>('Plus Jakarta Sans, sans-serif');\n\n  // 3. Notifications & Toast\n  const [toast, setToast] = useState<{ show: boolean; message: string; type: 'success' | 'info' | 'error' }>({\n    show: false,\n    message: '',\n    type: 'success',\n  });\n\n  // Tự động lưu các snapshot phiên gần nhất để có thể khôi phục khi cần.\n  const saveAutoBackupSnapshot = (data: AppDataState, personnel: PersonnelConfigMap, force = false) => {\n    try {\n      const now = new Date();\n      const dayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;\n      const existing = JSON.parse(localStorage.getItem(STORAGE_KEY_AUTO_BACKUPS) || '[]');\n      const list = Array.isArray(existing) ? existing.filter(x => !isExpiredArchive(x)) : [];\n      const alreadyToday = li edArchives();\n      const list = JSON.parse(localStorage.getItem(STORAGE_KEY_AUTO_BACKUPS) || '[]');\n      return Array.isArray(list) ? list.find(x => !isExpiredArchive(x)) || null : null;\n    } catch (e) { return null; }\n  };\n\n  const handleDownloadAutoBackup = () => {\n    const latest = getLatestAutoBackup();\n    if (!latest) { showToast('Chưa có bản sao lưu tự động nào!', 'info'); return; }\n    const blob = new Blob([JSON.stringify(latest, null, 2)], { type: 'application/json' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    const stamp = String(latest.savedAt || new Date().toISOString()).slice(0, 19).replace(/[T:]/g, '-');\n    a.download = `SucKhoeSieuThi_AutoBackup_${stamp}.json`;\n    a.click();\n    URL.revokeObjectURL(url);\n    showToast('Đã tải bản sao lưu tự động gần nhất!');\n  };\n\n  const handleRestoreLatestAutoBackup = () => {\n    const latest = getLatestAutoBackup();\n    if (!latest?.appData && !latest?.personnelConfig) { showToast('Chưa có bản sao lưu tự động hợp lệ!', 'error'); return; }\n    if (latest.appData) {\n      const validation = validateAppData(latest.appData);\n      if (validation.errors.length) { showToast('Bản backup gần nhất không hợp lệ!', 'error'); return; }\n      setAppData(latest.appData);\n      updateLastImportAt(latest.lastImportAt || null);\n    }\n    if (latest.personnelConfig) setPersonnelConfig(latest.personnelConfig);\n    setLastClearedBackup(null);\n    try { localStorage.removeItem(STORAGE_KEY_LAST_CLEAR_BACKUP); } catch (e) {}\n    showToast('Đã khôi phục bản sao lưu tự động gần nhất!');\n  };\n\n  const showToast = (message: string, type: 'success' | 'info' | 'error' = 'success') => {\n    setToast({ show: true, message, type });\n    setTimeout(() => {\n      setToast(prev => ({ ...prev, show: false }));\n    }, 3500);\n  };\n\n  const formatCloudTime = (timestamp: number) => {\n    if (!timestamp) return '—';\n    try {\n      return        setPersonnelConfig(JSON.parse(JSON.stringify(DEFAULT_PERSONNEL_CONFIG)));\n              showToast('Đã khôi phục danh sách 10 nhân sự NHT mặc định!');\n            }}\n          />\n        );\n      default:\n        return (\n          <BaoCaoCuoiNgayView\n            appData={appData}\n            onExportTab={handleExportScreenshot}\n            onOpenProgramDetail={handleOpenProgramDetail}\n          />\n        );\n    }\n  };\n\n  return (\n    <div\n      style={{ fontFamily: themeFont }}\n      className=\"min-h-screen bg-slate-100 flex flex-col text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900\"\n    >\n      {lastClearedBackup && isClearNoticeVisible && (\n        <div className=\"fixed bottom-5 left-5 z-50 bg-white border border-slate-200 shadow-xl rounded-2xl p-3 flex items-center gap-3\">\n          <div className=\"text-xs\"><b>Data vừa được xóa trắng.</b><div className=\"text-slate-500\">Bản an toàn vẫn còn để hoàn tác.</div></div>\n          <button onClick={() => { setAppData(lastClearedBackup.appData); updateLastImportAt(lastClearedBackup.lastImportAt || null); setPersonnelConfig(lastClearedBackup.personnelConfig); setLastClearedBackup(null); try { localStorage.removeItem(STORAGE_KEY_LAST_CLEAR_BACKUP); } catch {} showToast('Đã hoàn tác lần xóa dữ liệu gần nhất!'); }} className=\"px-3 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-bold\">Hoàn tác</button>\n          <button onClick={() => { setLastClearedBackup(null); try { localStorage.removeItem(STORAGE_KEY_LAST_CLEAR_BACKUP); } catch {} }} className=\"text-xs text-slate-400 hover:text-slate-700\">×</button>\n        </div>\n      )}\n\n      {/* Toast Notification */}\n      {toast.show && (\n        <div className=\"fixed bottom-5 right-5 z-50 animate-bounce\">\n          <div\n            className={`px-4 py-2.5 rounded-xl shadow-lg font-bold text-xs flex items-center gap-2 ${\n              toast.type === 'error'\n                ? 'bg-rose-600 text-white'\n                : toast.type === 'info'\n                ? 'bg-blue-600 text-white'\n                : 'bg-emerald-600 text-white'\n            }`}\n          >\n            <span>{toast.type === 'error' ? '❌' : toast.type === 'info' ? 'ℹ️' : '✓'}</span>\n            <span>{toast.message}</span>\n          </div>\n        </div>\n      )}\n\n      {/* Main Top Header */}\n      <Header\n        currentView={currentView}\n        onOpenUpload={() => setIsUploadModalOpen(true)}\n        onOpenAiAssistant={() => setActiveDrawer('danh-gia-ai')}\n        onOpenSettings={() => setActiveDrawer('giao-dien')}\n        onOpenSessionManager={() => setActiveDrawer('quan-ly-phien')}\n        onOpenClearSession={() => setIsClearModalOpen(true)}\n        onOpenDownloads={() => setActiveDrawer('tai-xuong')}\n        screenshotCount={screenshots.length}\n        isExporting={isExporting}\n        onExportTab={handleExportScreenshot}\n        onToggleMobileSidebar={() => setIsSidebarOpen(!isSidebarOpen)}\n      />\n\n      {/* Application Body Layout */}\n      <div className=\"flex-1 flex overflow-hidden\">\n        {/* Persistent Sidebar */}\n        <Sidebar\n          currentView={currentView}\n          onSelectView={(view) => {\n            setCurrentView(view);\n            setIsSidebarOpen(false);\n          }}\n          isOpenMobile={isSidebarOpen}\n          onCloseMobile={() => setIsSidebarOpen(false)}\n          onOpenClearSession={() => setIsClearModalOpen(true)}\n        />\n\n        {/* Dynamic Main Workspace Canvas */}\n        <main className=\"flex-1 overflow-y-auto custom-scroll p-4 md:p-6 lg:p-8\">\n          <div className=\"max-w-7xl mx-auto mb-3\"><StretchGoalSyncStatus /></div>\n          {cloudLiveNotice && !cloudHandoffOffer && (\n            <div className=\"no-export max-w-7xl mx-auto mb-3 rounded-2xl border border-sky-200 bg-sky-50 px-4 py-3 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3\">\n              <div className= bg-slate-50 border-b border-slate-200 px-4 py-2.5 text-[10px] font-black uppercase text-slate-500\">\n                  <div>Loại data</div><div>Tài khoản / Thời gian</div><div className=\"text-right\">Số dòng</div>\n                </div>\n                <div className=\"divide-y divide-slate-100\">\n                  {cloudHandoffOffer.entries.map((entry) => (\n                    <div key={String(entry.slot)} className=\"grid grid-cols-[1.4fr_.9fr_.75fr] gap-2 px-4 py-3 text-xs items-center\">\n                      <div className=\"font-extrabold text-slate-800\">{entry.label}</div>\n                      <div className=\"min-w-0\">\n                        <div className=\"font-semibold text-slate-600 truncate\" title={entry.updatedByEmail}>{entry.updatedByEmail || 'Google'}</div>\n                        <div className=\"text-[10px] text-slate-400 mt-0.5\">{formatCloudTime(entry.updatedAt)}</div>\n                      </div>\n                      <div className=\"text-right font-black text-slate-900\">{entry.rowCount.toLocaleString('vi-VN')} dòng</div>\n                    </div>\n                  ))}\n                </div>\n              </div>\n\n              <div className=\"mt-4 rounded-2xl bg-amber-50 border border-amber-200 px-4 py-3 text-xs leading-5 text-amber-800\">\n                <b>Lưu ý:</b> Nhận data sẽ đưa các nhóm trên cloud vào phiên hiện tại. Nếu phiên hiện tại đã có cùng loại data, bản cloud sẽ thay nhóm đó. Bỏ qua không xóa bản bàn giao trên cloud.\n              </div>\n            </div>\n\n            <div className=\"p-4 md:p-5 bg-slate-50 border-t border-slate-200 flex flex-col-reverse sm:flex-row sm:justify-end gap-2.5\">\n              <button type=\"button\" onClick={() => setCloudHandoffOffer(null)} className=\"px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-bold hover:bg-slate-50\">\n                Bỏ qua – Tôi sẽ nhập data mới\n              </button>\n              <button type=\"butto       </div>\n                  <p className=\"mt-3 text-sm leading-6 text-slate-600\">\n                    Hệ thống đang phát hiện <strong>data của phiên trước</strong> vẫn còn được lưu. Để tránh trộn data cũ với số liệu mới, anh nên xóa data phiên trước khi nhập dữ liệu hôm nay.\n                  </p>\n                </div>\n              </div>\n\n              <div className=\"mt-5 flex items-start gap-2.5 rounded-2xl bg-amber-50 border border-amber-200 px-4 py-3 text-xs leading-5 text-amber-800\">\n                <AlertTriangle className=\"mt-0.5 h-4 w-4 shrink-0 text-amber-600\" />\n                <span><strong>Yên tâm:</strong> hệ thống sẽ tạo điểm backup an toàn trước khi xóa. Không tự động xóa nếu anh chưa xác nhận.</span>\n              </div>\n\n              <div className=\"mt-6 flex flex-col-reverse sm:flex-row sm:justify-end gap-2.5\">\n                <button\n                  type=\"button\"\n                  onClick={handleDailyClearPromptSkip}\n                  className=\"inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-50 transition\"\n                >\n                  Bỏ qua hôm nay\n                </button>\n                <button\n                  type=\"button\"\n                  onClick={handleDailyClearPromptOpen}\n                  className=\"inline-flex items-center justify-center gap-2 rounded-xl bg-rose-600 px-4 py-2.5 text-sm font-extrabold text-white shadow-lg shadow-rose-600/20 hover:bg-rose-700 active:scale-[0.99] transition\"\n                >\n                  <Trash2 className=\"h-4 w-4\" />\n                  Xóa data phiên\n                </button>\n              </div>\n            </div>\n          </div>\n        </div>\n      )}\n\n      <ClearSessionModal\n        isOpen={isClearModalOpen}\n        onClose={() => {\n          // Không mở lại popup nhắc hằng ngày sau khi đóng hộp thoại xóa.\n          // Đặc biệt sau khi xác nhận xóa, handleConfirmClear() đã đánh dấu hôm nay là đã xử lý.\n          setIsClearModalOpen(false);\n          setIsDailyClearFlow(false);\n          setIsDailyClearPromptOpen(false);\n        }}\n        appData={appData}\n        onConfirmClear={handleConfirmClear}\n      />\n\n      <ProgramDetailModal\n        isOpen={drilldownModal.isOpen}\n        onClose={() => setDrilldownModal(prev => ({ ...prev, isOpen: false }))}\n        storeKey={drilldownModal.storeKey}\n        programCode={drilldownModal.programCode}\n        programName={drilldownModal.programName}\n        appData={appData}\n        personnelConfig={personnelConfig}\n        onUpdatePersonnelConfig={setPersonnelConfig}\n        onSaveScreenshot={(item) => setScreenshots(prev => [item, ...prev])}\n      />\n\n      <Drawers\n        activeDrawer={activeDrawer}\n        onClose={() => setActiveDrawer(null)}\n        appData={appData}\n        personnelConfig={personnelConfig}\n        onUpdatePersonnelConfig={setPersonnelConfig}\n        screenshots={screenshots}\n        onOpenClearModal={() => setIsClearModalOpen(true)}\n        onExportSession={handleExportSession}\n        onImportSession={handleImportSession}\n        onDownloadAutoBackup={handleDownloadAutoBackup}\n        onRestoreLatestAutoBackup={handleRestoreLatestAutoBackup}\n        themeFont={themeFont}\n        onChangeThemeFont={setThemeFont}\n      />\n\n      <ImageExportModal\n        isOpen={!!exportedImage}\n        onClose={() => setExportedImage(null)}\n        imageResult={exportedImage}\n      />\n    </div>\n  );\n}\n","src/components/ClearSessionModal.tsx":"import React, { useState } from 'react';\nimport {\n  Trash2,\n  AlertTriangle,\n  RotateCcw,\n  X,\n  Database,\n  CheckCircle2,\n  FileSpreadsheet,\n  Users,\n  Trophy,\n  Store,\n} from 'lucide-react';\nimport { AppDataState } from '../types';\n\ninterface ClearSessionModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  appData: AppDataState;\n  onConfirmClear: (options: {\n    resetPersonnel: boolean;\n    clearScreenshots: boolean;\n  }) => void;\n}\n\nexport const ClearSessionModal: React.FC<ClearSessionModalProps> = ({\n  isOpen,\n  onClose,\n  appData,\n  onConfirmClear,\n}) => {\n  const [resetPersonnel, setResetPersonnel] = useState<boolean>(false);\n  const [clearScreenshots, setClearScreenshots] = useState<boolean>(false);\n\n  if (!isOpen) return null;\n\n  // Calculate current counts\n  const countDtSt = (appData.dt_luyke?.length || 0) + (appData.dt_realtime?.length || 0);\n  const countTdSt = (appData.td_luyke?.length || 0) + (appData.td_realtime?.length || 0);\n  const countDtNv = (appData.dt_nv_luyke?.length || 0) + (appData.dt_nv_realtime?.length || 0);\n  const countTdNv = (appData.nv_tgdd?.length || 0) + (appData.nv_tz?.length || 0);\n  const totalRecords = countDtSt + countTdSt + countDtNv + countTdNv;\n\n  const handleExecute = () => {\n    onConfirmClear({\n      resetPersonnel,\n      clearScreenshots,\n    });\n    onClose();\n  };\n\n  return (\n    <div className=\"fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-in fade-in duration-200\">\n      <div\n        className=\"bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200\"\n        role=\"dialog\"\n        aria-modal=\"true\"\n      >\n        {/* Header */}\n        <div className=\"bg-rose-50/70 border-b border-rose-100 p-5 flex items-start justify-between\">\n          <div className=\"flex items-center space-x-3\">\n            <div className=\"w-10 h-10 rounded-2xl bg-rose-600 flex items-center justify-center text-white shadow-md shadow-rose-500/20 flex-shrink-0\">\n              <Trash2 className=\"w-5 h-5\" />\n            </div>\n            <div>\n              <h3 className=\"font-extrabold text-slate-900 text-base\">\n                Xóa Dữ Liệu Đang Lưu Trong Phiên\n              </h3>\n              <p className=\"text-xs text-rose-700 font-medium\">\n                Dọn dữ liệu của phiên hiện tại để bắt đầu phiên làm việc mới\n              </p>\n            </div>\n          </div>\n          <button\n            onClick={onClose}\n            className=\"p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-xl transition cursor-pointer\"\n            aria-label=\"Đóng\"\n          >\n            <X className=\"w-5 h-5\" />\n          </button>\n        </div>\n\n        {/* Content Body */}\n        <div className=\"p-5 space-y-5\">\n          {/* Current Session Data Overview */}\n          <div className=\"bg-slate-50 border border-slate-200 rounded-2xl p-3.5 space-y-2.5\">\n            <div className=\"flex items-center justify-between text-xs\">\n              <span className=\"font-bold text-slate-700 flex items-center gap-1.5\">\n                <Database className=\"w-3.5 h-3.5 text-blue-600\" />\n                Dữ liệu hiện đang lưu trong phiên:\n              </span>\n              <span className=\"font-extrabold text-blue-700 bg-blue-50 px-2 py-0.5 rounded-md border border-blue-200\">\n                {totalRecords} dòng bản ghi\n              </span>\n            </div>\n\n            <div className=\"grid grid-cols-2 gap-2 text-[11px]\">\n              <div className=\"flex items-center justify-between p-2 rounded-xl bg-white border border-slate-200/80\">\n                <span className=\"text-slate-600 flex items-center gap-1\">\n                  <Store className=\"w-3 h-3 text-slate-400\" />\n                  DT Siêu thị:\n                </span>\n                <span className=\"font-bold text-slate-900\">{countDtSt} dòng</span>\n              </div>\n              <div className=\"flex items-center justify-between p-2 rounded-xl bg-white border border-slate-200/80\">\n                <span className=\"text-slate-600 flex items-center gap-1\">\n                  <Trophy className=\"w-3 h-3 text-slate-400\" />\n                  Thi đua ST:\n                </span>\n                <span className=\"font-bold text-slate-900\">{countTdSt} dòng</span>\n              </div>\n              <div className=\"flex items-center justify-between p-2 rounded-xl bg-white border border-slate-200/80\">\n                <span className=\"text-slate-600 flex items-center gap-1\">\n                  <Users className=\"w-3 h-3 text-slate-400\" />\n                  DT Nhân viên:\n                </span>\n                <span className=\"font-bold text-slate-900\">{countDtNv} dòng</span>\n              </div>\n              <div className=\"flex items-center justify-between p-2 rounded-xl bg-white border border-slate-200/80\">\n                <span className=\"text-slate-600 flex items-center gap-1\">\n                  <FileSpreadsheet className=\"w-3 h-3 text-slate-400\" />\n                  Thi đua NV:\n                </span>\n                <span className=\"font-bold text-slate-900\">{countTdNv} dòng</span>\n              </div>\n            </div>\n          </div>\n\n          {/* Mode Selector */}\n          <div className=\"space-y-2.5\">\n            <label className=\"text-xs font-bold text-slate-800 block\">\n              Chọn phương thức dọn dẹp:\n            </label>\n\n            {/* Option 1: Xóa Trắng */}\n            <div className=\"p-3.5 rounded-2xl border-2 border-rose-500 bg-rose-50/40 shadow-xs flex items-start space-x-3\">\n              <div className=\"w-4 h-4 rounded-full bg-rose-600 mt-0.5 flex-shrink-0\" />\n              <div className=\"flex-1\">\n                <div className=\"flex items-center justify-between\">\n                  <span className=\"font-extrabold text-xs text-rose-900\">\n                    Xóa trắng toàn bộ dữ liệu (Về 0 bản ghi)\n                  </span>\n                  <span className=\"text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700\">\n                    Khuyên dùng khi nạp ngày mới\n                  </span>\n                </div>\n                <p className=\"text-[11px] text-slate-500 mt-1 leading-relaxed\">\n                  Xóa các bảng Doanh thu, Thi đua và Nhân viên của phiên hiện tại về rỗng. Bản sao lưu an toàn và lịch sử tiến độ vẫn được giữ để có thể khôi phục khi cần.\n                </p>\n              </div>\n            </div>\n          </div>\n\n          {/* Extra options checkboxes */}\n          <div className=\"space-y-2 pt-2 border-t border-slate-100 text-xs\">\n            <label className=\"flex items-center space-x-2.5 cursor-pointer select-none text-slate-700 font-medium\">\n              <input\n                type=\"checkbox\"\n                checked={resetPersonnel}\n                onChange={(e) => setResetPersonnel(e.target.checked)}\n                className=\"w-4 h-4 rounded text-rose-600 accent-rose-600 cursor-pointer\"\n              />\n              <span>Đặt lại cấu hình nhân viên (Ẩn/Hiện và % KPI) về mặc định</span>\n            </label>\n\n            <label className=\"flex items-center space-x-2.5 cursor-pointer select-none text-slate-700 font-medium\">\n              <input\n                type=\"checkbox\"\n                checked={clearScreenshots}\n                onChange={(e) => setClearScreenshots(e.target.checked)}\n                className=\"w-4 h-4 rounded text-rose-600 accent-rose-600 cursor-pointer\"\n              />\n              <span>Xóa toàn bộ kho ảnh báo cáo đã xuất trong phiên</span>\n            </label>\n          </div>\n        </div>\n\n        {/* Action Footer */}\n        <div className=\"p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-3\">\n          <button\n            type=\"button\"\n            onClick={onClose}\n            className=\"px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 font-bold text-xs rounded-xl transition cursor-pointer\"\n          >\n            Hủy bỏ\n          </button>\n\n          <button\n            type=\"button\"\n            onClick={handleExecute}\n            className=\"px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow-xs transition flex items-center gap-2 cursor-pointer\"\n          >\n            <Trash2 className=\"w-4 h-4\" />\n            <span>Xác nhận Xóa Trắng Data</span>\n          </button>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/components/DataInputModal.tsx":"import { SortableTable } from './SortableTable';\nimport React, { useState, useEffect, useMemo } from 'react';\nimport { AppDataState } from '../types';\nimport {\n  parsePastedData,\n  CATEGORY_LABELS,\n  CATEGORY_DESCRIPTIONS,\n  ParseDiagnostics,\n  splitClipboardIntoGrid,\n  detectCategoryFromParsedData,\n} from '../utils/smartDataParser';\nimport {\n  Clipboard,\n  CheckCircle2,\n  AlertTriangle,\n  FileText,\n  Trash2,\n  Sparkles,\n  ArrowRight,\n  Database,\n  X,\n  Table,\n} from 'lucide-react';\n\ninterface DataInputModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  targetCategory?: keyof AppDataState | null;\n  onSaveData: (category: keyof AppDataState, data: any[]) => void;\n}\n\nexport const DataInputModal: React.FC<DataInputModalProps> = ({\n  isOpen,\n  onClose,\n  targetCategory: initialTargetCategory,\n  onSaveData,\n}) => {\n  const [selectedCategory, setSelectedCategory] = useState<string>(\n    initialTargetCategory || 'auto'\n  );\n  const [inputText, setInputText] = useState<string>('');\n  const [pasteError, setPasteError] = useState<string | null>(null);\n  const [showFullPreview, setShowFullPreview] = useState<boolean>(false);\n\n  // Sync initial target category when opened\n  useEffect(() => {\n    if (isOpen) {\n      setSelectedCategory(initialTargetCategory || 'auto');\n      setPasteError(null);\n    } else {\n      setInputText('');\n      setPasteError(null);\n    }\n  }, [isOpen, initialTargetCategory]);\n\n  // Live parsing\n  const parseResult = useMemo(() => {\n    if (!inputText.trim()) return null;\n\n    const catToUse =\n      selectedCategory === 'auto' ? null : (selectedCategory as keyof AppDataState);\n\n    const result = parsePastedData(inputText, catToUse);\n    return result;\n  }, [inputText, selectedCategory]);\n\n  if (!isOpen) return null;\n\n  const isSuccess = parseResult && !('error' in parseResult);\n  const diagnostics = isSuccess ? (parseResult as ParseDiagnostics) : null;\n  const errorMessage = parseResult && 'error' in parseResult ? parseResult.error : null;\n\n  // Handle read from clipboard\n  const handleReadClipboard = async () => {\n    try {\n      const text = await navigator.clipboard.readText();\n      if (text) {\n        setInputText(text);\n        setPasteError(null);\n      } else {\n        setPasteError('Clipboard trống. Hãy sao chép bảng dữ liệu trước rồi dán lại!');\n      }\n    } catch (err) {\n      setPasteError('Không thể tự động đọc clipboard do trình duyệt bảo mật. Bạn hãy bấm Ctrl + V (hoặc Cmd + V) trực tiếp vào khung nhập!');\n    }\n  };\n\n  // Handle Commit / Save\n  const handleCommit = () => {\n    if (!diagnostics || diagnostics.data.length === 0) {\n      setPasteError('Chưa có dữ liệu hợp lệ để lưu.');\n      return;\n    }\n    onSaveData(diagnostics.category, diagnostics.data);\n    onClose();\n  };\n\n  return (\n    <div className=\"fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-200\">\n      <div className=\"bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-4xl max-h-[92vh] flex flex-col overflow-hidden text-slate-800\">\n        {/* Header */}\n        <div className=\"px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-gradient-to-r from-slate-50 to-white\">\n          <div className=\"flex items-center gap-3\">\n            <div className=\"w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md shadow-blue-500/20\">\n              <Clipboard className=\"w-5 h-5\" />\n            </div>\n            <div>\n              <h2 className=\"text-lg font-bold text-slate-900 flex items-center gap-2\">\n                Ô Nhập / Dán Dữ Liệu Báo Cáo\n                <span className=\"text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-100 text-blue-800 border border-blue-200\">\n                  Smart Parser\n                </span>\n              </h2>\n              <p className=\"text-xs text-slate-500\">\n                Sao chép bảng từ trang web BI / MWG / Excel và dán trực tiếp. Tự động nhận diện cột linh hoạt.\n              </p>\n            </div>\n          </div>\n          <button\n            onClick={onClose}\n            className=\"text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-100 transition\"\n          >\n            <X className=\"w-5 h-5\" />\n          </button>\n        </div>\n\n        {/* Modal Body */}\n        <div className=\"p-6 overflow-y-auto custom-scroll space-y-4 flex-1\">\n          {/* Target Category Selector */}\n          <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-50 p-3.5 rounded-xl border border-slate-200/80\">\n            <div className=\"flex items-center gap-2 text-sm font-medium text-slate-700\">\n              <Database className=\"w-4 h-4 text-blue-600\" />\n              <span>Cổng Dữ Liệu Đích:</span>\n            </div>\n            <select\n              value={selectedCategory}\n              onChange={(e) => setSelectedCategory(e.target.value)}\n              className=\"bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm cursor-pointer\"\n            >\n              <option value=\"auto\">✨ Tự động nhận diện theo nội dung dán</option>\n              {Object.entries(CATEGORY_LABELS).map(([key, label]) => (\n                <option key={key} value={key}>\n                  {label} ({key})\n                </option>\n              ))}\n            </select>\n          </div>\n\n          {/* Ctrl+A Helper Tip */}\n          <div className=\"p-3 bg-indigo-50/80 border border-indigo-200/80 rounded-xl text-xs text-indigo-900 flex items-start gap-2.5\">\n            <Sparkles className=\"w-4 h-4 text-indigo-600 flex-shrink-0 mt-0.5\" />\n            <div className=\"leading-relaxed\">\n              <span className=\"font-extrabold text-indigo-950\">Hỗ trợ Copy toàn trang (Ctrl + A):</span>{' '}\n              Anh có thể mở trang web báo cáo BI, nhấn <b>Ctrl + A</b> (chọn toàn bộ trang) rồi <b>Ctrl + C</b> và dán thẳng vào đây. Hệ thống sẽ <b>tự động lọc sạch menu, thanh điều hướng</b> và trích xuất đúng bảng số liệu!\n            </div>\n          </div>\n\n          {/* Text Area */}\n          <div className=\"relative\">\n            <textarea\n              value={inputText}\n              onChange={(e) => {\n                setInputText(e.target.value);\n                setPasteError(null);\n              }}\n              placeholder={`Bấm Ctrl + V để dán dữ liệu vào đây...\\n★ Mẹo: Bạn có thể Ctrl + A trên toàn bộ trang web BI rồi copy dán vào đây, hệ thống tự động lọc bỏ menu và trích xuất bảng dữ liệu!`}\n              rows={8}\n              className=\"w-full font-mono text-xs bg-slate-50 border border-slate-300 rounded-xl p-3.5 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition custom-scroll placeholder:text-slate-400 leading-relaxed\"\n            />\n          </div>\n\n          {/* Paste Error Warning */}\n          {pasteError && (\n            <div className=\"p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-center gap-2 text-xs text-amber-800\">\n              <AlertTriangle className=\"w-4 h-4 text-amber-600 flex-shrink-0\" />\n              <span>{pasteError}</span>\n            </div>\n          )}\n\n          {/* Parsing Error */}\n          {errorMessage && (\n            <div className=\"p-3.5 bg-rose-50 border border-rose-200 rounded-xl flex items-start gap-2.5 text-xs text-rose-800\">\n              <AlertTriangle className=\"w-4 h-4 text-rose-600 flex-shrink-0 mt-0.5\" />\n              <div>\n                <p className=\"font-semibold\">{errorMessage}</p>\n                <p className=\"text-rose-600 mt-0.5\">\n                  Mẹo: Hãy chọn trực tiếp cổng dữ liệu tương ứng ở ô chọn bên trên nếu bảng copy không có tiêu đề rõ ràng.\n                </p>\n              </div>\n            </div>\n          )}\n\n          {/* Live Diagnostic & Recognition Pane */}\n          {diagnostics && (\n            <div className=\"bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3\">\n              <div className=\"flex flex-wrap items-center justify-between gap-2 border-b border-slate-200/80 pb-2.5\">\n                <div className=\"flex items-center gap-2\">\n                  <CheckCircle2 className=\"w-4 h-4 text-emerald-600\" />\n                  <span className=\"text-xs font-bold text-slate-900\">\n                    Nhận diện: {diagnostics.categoryName}\n                  </span>\n                  <span className=\"px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200\">\n                    {diagnostics.rowCount} dòng dữ liệu\n                  </span>\n                  {diagnostics.confidence !== undefined && (\n                    <span className={`px-2 py-0.5 rounded text-[11px] font-bold border ${diagnostics.confidence >= 80 ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-amber-50 text-amber-700 border-amber-200'}`}>\n                      Smart Map {diagnostics.confidence}%\n                    </span>\n                  )}\n                </div>\n                <button\n                  type=\"button\"\n                  onClick={() => setShowFullPreview(!showFullPreview)}\n                  className=\"text-xs text-blue-600 hover:text-blue-700 font-medium flex items-center gap-1\"\n                >\n                  <Table className=\"w-3.5 h-3.5\" />\n                  {showFullPreview ? 'Thu gọn xem trước' : 'Xem trước bảng dữ liệu'}\n                </button>\n              </div>\n\n              {/* Ctrl + A Full Page Extraction Indicator */}\n              {diagnostics.pageExtractedInfo?.isFullPageExtracted && (\n                <div className=\"p-2.5 bg-emerald-50 border border-emerald-200 rounded-lg text-xs text-emerald-900 flex items-center gap-2 font-medium\">\n                  <Sparkles className=\"w-4 h-4 text-emerald-600 flex-shrink-0\" />\n                  <span>\n                    <b>✨ Đã tự động bóc tách từ trang web (Ctrl + A):</b> Bỏ qua{' '}\n                    <b>{diagnostics.pageExtractedInfo.ignoredNoiseLines} dòng</b> menu & tiêu đề thừa, nhận diện bảng tại dòng{' '}\n                    <b>{diagnostics.pageExtractedInfo.headerFoundAtLine + 1}</b>!\n                  </span>\n                </div>\n              )}\n\n              {/* Column Mapping Badges */}\n              <div>\n                <span className=\"text-[11px] font-semibold text-slate-500 uppercase tracking-wider block mb-1.5\">\n                  Cột đã tự động khớp ({diagnostics.recognizedColumns.length} cột):\n                </span>\n                <div className=\"flex flex-wrap gap-1.5\">\n                  {diagnostics.recognizedColumns.map((col, idx) => (\n                    <span\n                      key={idx}\n                      className=\"inline-flex items-center gap-1 text-[11px] px-2 py-1 bg-white border border-slate-200 rounded-md text-slate-700 font-medium shadow-2xs\"\n                    >\n                      <span className=\"font-bold text-blue-700\">{col.field}</span>\n                      <ArrowRight className=\"w-3 h-3 text-slate-400\" />\n                      <span className=\"text-slate-500 italic\">\"{col.mappedHeader}\"</span>\n                    </span>\n                  ))}\n                </div>\n              </div>\n\n              {/* Preview Table */}\n              <div className=\"border border-slate-200 rounded-lg overflow-hidden bg-white max-h-48 overflow-x-auto overflow-y-auto custom-scroll\">\n                <SortableTable rowLimit={showFullPreview ? 15 : 3} className=\"w-full text-[11px] text-left\">\n                  <thead className=\"bg-slate-100/80 text-slate-600 font-semibold border-b border-slate-200 sticky top-0\">\n                    <tr>\n                      <th className=\"p-2 w-8 text-center text-slate-400\">#</th>\n                      {Object.keys(diagnostics.data[0] || {}).map((k) => (\n                        <th key={k} className=\"p-2 whitespace-nowrap\">\n                          {k}\n                        </th>\n                      ))}\n                    </tr>\n                  </thead>\n                  <tbody className=\"divide-y divide-slate-100 text-slate-700\">\n                    {diagnostics.data\n                      \n                      .map((row, rIdx) => (\n                        <tr key={rIdx} className=\"hover:bg-slate-50\">\n                          <td className=\"p-2 text-center text-slate-400\">{rIdx + 1}</td>\n                          {Object.values(row).map((v: any, cIdx) => (\n                            <td key={cIdx} className=\"p-2 whitespace-nowrap font-mono\">\n                              {typeof v === 'number' ? v.toLocaleString('vi-VN') : String(v)}\n                            </td>\n                          ))}\n                        </tr>\n                      ))}\n                  </tbody>\n                </SortableTable>\n              </div>\n              {diagnostics.data.length > 3 && !showFullPreview && (\n                <p className=\"text-[11px] text-slate-400 text-right\">\n                  + {diagnostics.data.length - 3} dòng khác...\n                </p>\n              )}\n            </div>\n          )}\n        </div>\n\n        {/* Footer */}\n        <div className=\"px-6 py-4 border-t border-slate-100 bg-slate-50 flex items-center justify-between\">\n          <button\n            onClick={onClose}\n            type=\"button\"\n            className=\"px-4 py-2 text-xs font-semibold text-slate-600 hover:text-slate-800 hover:bg-slate-200 rounded-xl transition\"\n          >\n            Đóng\n          </button>\n          <button\n            onClick={handleCommit}\n            disabled={!diagnostics || diagnostics.data.length === 0}\n            type=\"button\"\n            className={`inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-bold text-white shadow-md transition ${\n              diagnostics && diagnostics.data.length > 0\n                ? 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-600/20 active:scale-95 cursor-pointer'\n                : 'bg-slate-300 cursor-not-allowed text-slate-500'\n            }`}\n          >\n            <CheckCircle2 className=\"w-4 h-4\" />\n            Lưu Dữ Liệu Vào Hệ Thống ({diagnostics?.rowCount || 0} dòng)\n          </button>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/components/Drawers.tsx":"import React, { useState } from 'react';\nimport { X, RefreshCw, Copy, Check, Download, Palette, Bot, History, Eye, EyeOff, Trash2, Save } from 'lucide-react';\nimport { PersonnelConfigMap, ScreenshotItem } from '../types';\nimport { getStretchGoalPct } from '../utils/stretchGoal';\n\nexport type DrawerType = 'danh-gia-ai' | 'quan-ly-phien' | 'giao-dien' | 'tai-xuong' | null;\n\ninterface DrawersProps {\n  activeDrawer: DrawerType | string | null;\n  onClose: () => void;\n  personnelConfig: PersonnelConfigMap;\n  onUpdatePersonnelConfig?: (cfg: PersonnelConfigMap) => void;\n  screenshots?: ScreenshotItem[];\n  onOpenClearModal?: () => void;\n  onExportSession?: () => void;\n  onImportSession?: (file: File) => void;\n  onDownloadAutoBackup?: () => void;\n  onRestoreLatestAutoBackup?: () => void;\n  themeFont?: string;\n  onChangeThemeFont?: (font: string) => void;\n  appData?: any;\n}\n\nexport const Drawers: React.FC<DrawersProps> = ({\n  activeDrawer,\n  onClose,\n  personnelConfig,\n  onUpdatePersonnelConfig,\n  screenshots = [],\n  onOpenClearModal,\n  onExportSession,\n  onImportSession,\n  onDownloadAutoBackup,\n  onRestoreLatestAutoBackup,\n  themeFont = \"'Be Vietnam Pro', sans-serif\",\n  onChangeThemeFont,\n  appData,\n}) => {\n  const [aiStore, setAiStore] = useState<'10341' | '933' | 'CUM'>('10341');\n  const [aiMode, setAiMode] = useState<'suctich' | 'chitiet'>('chitiet');\n  const [copiedAi, setCopiedAi] = useState<boolean>(false);\n\n  // Guard: if drawer is not active or 'NONE', do not render anything\n  if (!activeDrawer || activeDrawer === 'NONE') return null;\n\n  const getAiAnalysis = () => {\n    const stores = appData?.dt_luyke || [];\n    const competitions = appData?.td_luyke || [];\n    const stretchGoalPct = getStretchGoalPct();\n\n    const num = (v: any) => {\n      const n = Number(String(v ?? '').replace(/,/g, '').replace(/\\s/g, ''));\n      return Number.isFinite(n) ? n : 0;\n    };\n    const sum = (rows: any[], key: string) => rows.reduce((t, r) => t + num(r[key]), 0);\n    const clamp = (n: number, min: number, max: number) => Math.max(min, Math.min(max, n));\n    const fmtTr = (n: number) => `${n.toLocaleString('vi-VN', { maximumFractionDigits: 1 })} Tr`;\n    const fmtPct = (n: number) => `${n.toFixed(1)}%`;\n\n    // BI lũy kế chốt đến hết ngày hôm qua, nên ngày đã qua = hôm nay - 1.\n    const now = new Date();\n    const totalDays = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();\n    const daysPassed = clamp(now.getDate() - 1, 1, totalDays);\n    const remainingDays = Math.max(1, totalDays - daysPassed);\n    const timePct = daysPassed / totalDays * 100;\n\n    const getStoreRows = (code: string) => stores.filter((r: any) => String(r['MÃ ĐƠN VỊ'] || '').trim() === code);\n    const buildStore = (code: string, fallback: string) => {\n      const rows = getStoreRows(code);\n      const target = sum(rows, 'TARGET QĐ (TR)') || sum(rows, 'TARGET (TR)');\n      const current = sum(rows, 'DOANH THU QĐ (TR)');\n      const revenue = sum(rows, 'DOANH THU (TR)');\n      const adjustedTarget = target * stretchGoalPct / 100;\n      const attainment = target > 0 ? current / target * 100 : 0;\n      const stretchAttainment = adjustedTarget > 0 ? current / adjustedTarget * 100 : 0;\n      const runRate = current / daysPassed;\n      const forecast = runRate * totalDays;\n      const requiredPerDay = Math.max(0, adjustedTarget - current) / remainingDays;\n      const paceRatio = requiredPerDay > 0 ? runRate / requiredPerDay : 2;\n      const forecastVsStretch = adjustedTarget > 0 ? forecast / adjustedTarget * 100 : 0;\n      const risk = forecastVsStretch >= 105 ? 'TỐT' : forecastVsStretch >= 95 ? 'THEO DÕI' : forecastVsStretch >= 80 ? 'CẢNH BÁO' : 'NGUY CƠ';\n      const score = clamp(\n        45 * clamp(attainment / stretchGoalPct, 0, 1.15) / 1.15 +\n        40 * clamp(paceRatio, 0, 1.15) / 1.15 +\n        15 * clamp(forecastVsStretch / 100, 0, 1.15) / 1.15,\n        0, 100\n      );\n      return { code, label: rows[0]?.['TÊN ĐƠN VỊ'] || fallback, rows, target, current, revenue, adjustedTarget, attainment, stretchAttainment, runRate, forecast, requiredPerDay, paceRatio, forecastVsStretch, risk, score };\n    };\n\n    const allRows = aiStore === 'CUM' ? stores : getStoreRows(aiStore);\n    const selectedRows = allRows;\n    const storeLabel = aiStore === 'CUM'\n      ? 'TỔNG CỤM 933'\n      : (selectedRows[0]?.['TÊN ĐƠN VỊ'] || `MÃ ${aiStore}`);\n\n    const target = sum(selectedRows, 'TARGET QĐ (TR)') || sum(selectedRows, 'TARGET (TR)');\n    const current = sum(selectedRows, 'DOANH THU QĐ (TR)');\n    const revenue = sum(selectedRows, 'DOANH THU (TR)');\n    const adjustedTarget = target * stretchGoalPct / 100;\n    const attainment = target > 0 ? current / target * 100 : 0;\n    const stretchAttainment = adjustedTarget > 0 ? current / adjustedTarget * 100 : 0;\n    const runRate = current / daysPassed;\n    const forecast = runRate * totalDays;\n    const requiredPerDay = Math.max(0, adjustedTarget - current) / remainingDays;\n    const paceRatio = requiredPerDay > 0 ? runRate / requiredPerDay : 2;\n    const forecastVsStretch = adjustedTarget > 0 ? forecast / adjustedTarget * 100 : 0;\n    const gap = Math.max(0, adjustedTarget - current);\n    const surplus = Math.max(0, current - adjustedTarget);\n\n    const programRows = competitions.filter((r: any) => {\n      if (aiStore === 'CUM') return true;\n      const unit = String(r['ĐƠN VỊ / NHÂN VIÊN'] || '').toLowerCase();\n      return aiStore === '933' ? /tgd|933/.test(unit) : /aar|10341|topzone/.test(unit);\n    });\n\n    // Gộp các dòng trùng tên môn để AI không đánh giá trùng một môn nhiều lần.\n    const programMap = new Map<string, { name: string; pct: number; count: number }>();\n    programRows.forEach((r: any) => {\n      const name = String(r['CHƯƠNG TRÌNH'] || '').trim();\n      if (!name) return;\n      const key = name.toUpperCase();\n      const pct = num(r['% HT THÁNG']);\n      if (!programMap.has(key)) programMap.set(key, { name, pct: 0, count: 0 });\n      const item = programMap.get(key)!;\n      item.pct += pct;\n      item.count += 1;\n    });\n    const programs = [...programMap.values()]\n      .map(p => ({ ...p, pct: p.count ? p.pct / p.count : 0 }))\n      .sort((a, b) => b.pct - a.pct);\n    const top = programs.slice(0, 3);\n    const bottom = programs.slice(-3).reverse();\n    const critical = programs.filter(p => p.pct < 50);\n    const weak = programs.filter(p => p.pct >= 50 && p.pct < 80);\n    const achieved = programs.filter(p => p.pct >= 100);\n    const avgProgram = programs.length ? programs.reduce((s, p) => s + p.pct, 0) / programs.length : 0;\n\n    const programText = (items: any[]) => items.length\n      ? items.map(p => `• ${p.name}: ${fmtPct(p.pct)}`).join('\\n')\n      : '• Chưa đủ dữ liệu chương trình để đánh giá.';\n\n    const status = forecastVsStretch >= 105\n      ? 'ĐANG VƯỢT NHỊP – có thể nâng kỳ vọng hoặc dùng lực để khóa các môn yếu.'\n      : forecastVsStretch >= 95\n        ? 'BÁM MỤC TIÊU – cần giữ nhịp hiện tại và xử lý các điểm yếu.'\n        : forecastVsStretch >= 80\n          ? 'CÓ RỦI RO – tốc độ hiện tại chưa đủ an toàn cho mục tiêu bứt phá.'\n          : 'NGUY CƠ CAO – cần hành động ngay, không nên chờ cuối tháng.';\n\n    const actions: string[] = [];\n    if (critical.length) actions.push(`Ưu tiên ${critical.length} môn dưới 50%: kéo lại từng môn, giao người chịu trách nhiệm và đặt mục tiêu ngày.`);\n    if (weak.length) actions.push(`Push ${weak.length} môn trong vùng 50–79,9% vì đây là nhóm dễ tạo thêm doanh thu nhất trong ngắn hạn.`);\n    if (requiredPerDay > runRate) actions.push(`Nhịp cần đạt ${fmtTr(requiredPerDay)}/ngày đang cao hơn nhịp hiện tại ${fmtTr(runRate)}/ngày → phải tăng tối thiểu ${fmtTr(requiredPerDay - runRate)}/ngày.`);\n    if (forecastVsStretch >= 105) actions.push(`Dự báo đang trên ${fmtPct(forecastVsStretch)} mục tiêu bứt phá → có thể chuyển lực sang khóa các môn chưa đạt.`);\n    if (!actions.length) actions.push('Dữ liệu đang ở trạng thái tốt; duy trì nhịp và kiểm soát các môn có xu hướng tụt tốc.');\n\n    const comparison = aiStore === 'CUM' ? (() => {\n      const a = buildStore('933', 'TGD NHT');\n      const b = buildStore('10341', 'AAR NHT');\n      const leader = a.score >= b.score ? a : b;\n      const lag = a.score >= b.score ? b : a;\n      return `\\n🏪 SO SÁNH 2 SHOP\\n• ${a.label}: ${fmtPct(a.attainment)} Target | dự báo ${fmtPct(a.forecastVsStretch)} Stretch | điểm ${a.score.toFixed(0)}/100\\n• ${b.label}: ${fmtPct(b.attainment)} Target | dự báo ${fmtPct(b.forecastVsStretch)} Stretch | điểm ${b.score.toFixed(0)}/100\\n→ ${leader.label} đang tốt hơn; ${lag.label} là nơi cần ưu tiên hỗ trợ.`;\n    })() : '';\n\n    const summary = `*TRỢ LÝ PHÂN TÍCH AI – ${storeLabel}*\\n` +\n      `🎯 Mục tiêu bứt phá: ${stretchGoalPct}% Target | ${daysPassed}/${totalDays} ngày (${fmtPct(timePct)})\\n` +\n      `💰 Thực đạt: ${fmtTr(current)} / Target gốc ${fmtTr(target)}\\n` +\n      `🚀 Target bứt phá: ${fmtTr(adjustedTarget)} | Hoàn thành: ${fmtPct(stretchAttainment)}\\n` +\n      `📈 Run-rate: ${fmtTr(runRate)}/ngày | Cần: ${fmtTr(requiredPerDay)}/ngày\\n` +\n      `🔮 Dự báo: ${fmtTr(forecast)} = ${fmtPct(forecastVsStretch)} Stretch\\n` +\n      `🧠 KẾT LUẬN: ${status}\\n\\n` +\n      `🏆 MÔN DẪN ĐẦU\\n${programText(top)}\\n\\n` +\n      `⚠️ MÔN CẦN XỬ LÝ\\n${programText(bottom)}` + comparison;\n\n    const detail = `*TRỢ LÝ PHÂN TÍCH AI – BẢN ĐIỀU HÀNH*\\n${storeLabel}\\n` +\n      `════════════════════════════════\\n` +\n      `1. BỨC TRANH TỔNG THỂ\\n` +\n      `• Ngày dữ liệu: ${daysPassed}/${totalDays} ngày đã qua; còn ${remainingDays} ngày.\\n` +\n      `• Tiến độ thời gian: ${fmtPct(timePct)}.\\n` +\n      `• Target gốc: ${fmtTr(target)} | Stretch ${stretchGoalPct}%: ${fmtTr(adjustedTarget)}.\\n` +\n      `• Thực đạt QĐ: ${fmtTr(current)} → ${fmtPct(attainment)} Target gốc / ${fmtPct(stretchAttainment)} Stretch.\\n` +\n      `• Dưới/vượt Stretch: ${surplus > 0 ? '+' + fmtTr(surplus) : '-' + fmtTr(gap)}.\\n\\n` +\n      `2. NHỊP CHẠY & DỰ BÁO\\n` +\n      `• Run-rate hiện tại: ${fmtTr(runRate)}/ngày.\\n` +\n      `• Nhịp cần từ hôm nay: ${fmtTr(requiredPerDay)}/ngày.\\n` +\n      `• Tỷ lệ nhịp đạt yêu cầu: ${fmtPct(clamp(paceRatio * 100, 0, 200))}.\\n` +\n      `• Dự báo cuối tháng: ${fmtTr(forecast)} → ${fmtPct(forecastVsStretch)} Stretch.\\n` +\n      `• Đánh giá: ${status}\\n\\n` +\n      `3. SỨC KHỎE CÁC MÔN\\n` +\n      `• Tổng môn: ${programs.length} | ≥100%: ${achieved.length} | 50–79,9%: ${weak.length} | <50%: ${critical.length}.\\n` +\n      `• Điểm bình quân các môn: ${fmtPct(avgProgram)}.\\n\\n` +\n      `🏆 TOP 3\\n${programText(top)}\\n\\n` +\n      `🚨 BOTTOM 3\\n${programText(bottom)}\\n\\n` +\n      `4. VIỆC CẦN LÀM NGAY\\n` + actions.map((x, i) => `${i + 1}. ${x}`).join('\\n') +\n      comparison;\n\n    return { summary, detail };\n  };\n  const aiReport = getAiAnalysis();\n\n  const handleCopyAi = () => {\n    const text = aiMode === 'suctich' ? aiReport.summary : aiReport.detail;\n    navigator.clipboard.writeText(text).then(() => {\n      setCopiedAi(true);\n      setTimeout(() => setCopiedAi(false), 2000);\n    });\n  };\n\n  const handleDownloadAll = () => {\n    screenshots.forEach((item, idx) => {\n      setTimeout(() => {\n        const a = document.createElement('a');\n        a.href = item.url;\n        a.download = item.name;\n        a.click();\n      }, idx * 400);\n    });\n  };\n\n  return (\n    <>\n      <div\n        onClick={onClose}\n        className=\"fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 transition-opacity\"\n      />\n\n      <aside className=\"fixed right-0 top-0 bottom-0 w-96 max-w-full bg-white border-l border-slate-200 shadow-2xl z-50 flex flex-col animate-slideLeft\">\n        {/* Drawer Header */}\n        <div className=\"px-5 py-4 border-b border-slate-100 flex items-center justify-between\">\n          <div className=\"flex items-center space-x-2\">\n            {activeDrawer === 'danh-gia-ai' && <Bot className=\"w-4 h-4 text-emerald-600\" />}\n            {activeDrawer === 'quan-ly-phien' && <History className=\"w-4 h-4 text-slate-600\" />}\n            {activeDrawer === 'giao-dien' && <Palette className=\"w-4 h-4 text-purple-600\" />}\n            {activeDrawer === 'tai-xuong' && <Download className=\"w-4 h-4 text-blue-600\" />}\n            <h3 className=\"font-extrabold text-slate-900 text-sm uppercase tracking-wide\">\n                {activeDrawer === 'danh-gia-ai' && 'ĐÁNH GIÁ AI'}\n              {activeDrawer === 'quan-ly-phien' && 'QUẢN LÝ PHIÊN'}\n              {activeDrawer === 'giao-dien' && 'GIAO DIỆN & FONT CHỮ'}\n              {activeDrawer === 'tai-xuong' && 'TRUNG TÂM TẢI XUỐNG'}\n            </h3>\n          </div>\n          <button\n            onClick={onClose}\n            className=\"p-1.5 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition cursor-pointer\"\n          >\n            <X className=\"w-5 h-5\" />\n          </button>\n        </div>\n\n        {/* Drawer Body */}\n        <div className=\"p-5 flex-1 overflow-y-auto custom-scroll text-xs space-y-5\">\n          {/* 2. ĐÁNH GIÁ AI */}\n          {activeDrawer === 'danh-gia-ai' && (\n            <div className=\"space-y-4\">\n              <div className=\"bg-emerald-50 border border-emerald-200 rounded-xl p-3\">\n                <div className=\"flex items-center justify-between gap-2\">\n                  <span className=\"font-black text-emerald-900\">🧠 PHÂN TÍCH ĐIỀU HÀNH</span>\n                  <span className=\"px-2 py-1 rounded-lg bg-white text-emerald-700 border border-emerald-200 font-black\">Stretch {getStretchGoalPct()}%</span>\n                </div>\n                <p className=\"text-[10px] text-emerald-700 mt-1\">Đánh giá theo nhịp chạy, dự báo, rủi ro và các môn cần ưu tiên — không chỉ đọc số liệu.</p>\n              </div>\n              <div>\n                <label className=\"block text-slate-500 font-medium mb-1\">Chọn siêu thị phân tích</label>\n                <select\n                  value={aiStore}\n                  onChange={(e) => setAiStore(e.target.value as any)}\n                  className=\"w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold text-slate-800\"\n                >\n                  <option value=\"10341\">AAR_DNA_HCH - 351 Nguyễn Hữu Thọ</option>\n                  <option value=\"933\">TGD_DNA_HCH - 351 Nguyễn Hữu Thọ</option>\n                  <option value=\"CUM\">TỔNG CỤM - 351 Nguyễn Hữu Thọ</option>\n                </select>\n              </div>\n\n              <div className=\"flex items-center justify-between\">\n                <div className=\"flex rounded-xl bg-slate-100 p-1 font-semibold flex-1 mr-2\">\n                  <button\n                    onClick={() => setAiMode('suctich')}\n                    className={`flex-1 py-1.5 rounded-lg transition font-bold ${\n                      aiMode === 'suctich' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600'\n                    }`}\n                  >\n                    Súc tích\n                  </button>\n                  <button\n                    onClick={() => setAiMode('chitiet')}\n                    className={`flex-1 py-1.5 rounded-lg transition font-bold ${\n                      aiMode === 'chitiet' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600'\n                    }`}\n                  >\n                    Chi tiết\n                  </button>\n                </div>\n                <button\n                  onClick={handleCopyAi}\n                  className=\"p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-600 transition cursor-pointer\"\n                  title=\"Sao chép nội dung\"\n                >\n                  <Copy className=\"w-4 h-4\" />\n                </button>\n              </div>\n\n              {copiedAi && (\n                <div className=\"py-1 px-2.5 bg-emerald-50 text-emerald-700 font-bold rounded-lg text-center text-[11px]\">\n                  ✓ Đã sao chép nội dung báo cáo AI!\n                </div>\n              )}\n\n              <div className=\"bg-slate-50 border border-slate-200 rounded-xl p-4 font-mono text-slate-800 text-[11px] leading-relaxed whitespace-pre-line select-text\">\n                {aiMode === 'suctich' ? aiReport.summary : aiReport.detail}\n              </div>\n            </div>\n          )}\n\n          {/* 3. GIAO DIỆN & FONT CHỮ */}\n          {activeDrawer === 'giao-dien' && (\n            <div className=\"space-y-5\">\n              <div>\n                <label className=\"block font-bold text-slate-700 mb-1.5\">Kiểu chữ Báo cáo</label>\n                <select\n                  value={themeFont}\n                  onChange={(e) => onChangeThemeFont(e.target.value)}\n                  className=\"w-full bg-slate-50 border border-slate-200 rounded-xl p-2 font-semibold text-slate-800\"\n                >\n                  <option value=\"'Be Vietnam Pro', sans-serif\">Be Vietnam Pro (Khuyên dùng - Rõ nét)</option>\n                  <option value=\"'Plus Jakarta Sans', sans-serif\">Plus Jakarta Sans</option>\n                  <option value=\"'Inter', sans-serif\">Inter</option>\n                  <option value=\"'JetBrains Mono', monospace\">JetBrains Mono (Dạng số code)</option>\n                  <option value=\"Arial, sans-serif\">Arial chuẩn</option>\n                </select>\n              </div>\n\n\n            </div>\n          )}\n\n          {/* 4. TRUNG TÂM TẢI XUỐNG */}\n          {activeDrawer === 'tai-xuong' && (\n            <div className=\"space-y-4\">\n              <div className=\"bg-blue-50 border border-blue-200 rounded-xl p-3 text-[11px] text-blue-800 leading-relaxed\">\n                ℹ️ Toàn bộ ảnh báo cáo bạn đã xuất trong phiên làm việc. Bạn có thể bấm <b>Tải lại</b> hoặc tải toàn bộ.\n              </div>\n\n              <div className=\"flex items-center justify-between\">\n                <span className=\"px-3 py-1.5 rounded-lg bg-blue-600 text-white font-bold text-xs\">\n                  Tất cả ({screenshots.length} ảnh)\n                </span>\n                {screenshots.length > 0 && (\n                  <button\n                    onClick={handleDownloadAll}\n                    className=\"px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-xs transition cursor-pointer\"\n                  >\n                    Tải Tất Cả Ảnh\n                  </button>\n                )}\n              </div>\n\n              <div className=\"space-y-3 pt-2 max-h-[480px] overflow-y-auto custom-scroll\">\n                {screenshots.length === 0 ? (\n                  <div className=\"text-center py-10 text-slate-400 space-y-2 border-2 border-dashed border-slate-200 rounded-2xl\">\n                    <Download className=\"w-8 h-8 mx-auto text-slate-300\" />\n                    <p className=\"font-bold text-slate-600\">Chưa có ảnh nào được xuất</p>\n                    <p className=\"text-[11px]\">Bấm <b>Xuất Ảnh Tab</b> hoặc <b>Xuất ALL Báo Cáo</b> để tạo ảnh.</p>\n                  </div>\n                ) : (\n                  screenshots.map((item, idx) => (\n                    <div\n                      key={idx}\n                      className=\"p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between\"\n                    >\n                      <div className=\"flex items-center space-x-2.5 truncate pr-2\">\n                        <img\n                          src={item.url}\n                          alt={item.name}\n                          className=\"w-10 h-10 object-cover rounded-lg border border-slate-300\"\n                        />\n                        <div className=\"truncate\">\n                          <p className=\"font-bold text-slate-800 text-xs truncate\">{item.name}</p>\n                          <p className=\"text-[10px] text-slate-400\">Chụp lúc: {item.time}</p>\n                        </div>\n                      </div>\n                      <a\n                        href={item.url}\n                        download={item.name}\n                        className=\"px-2.5 py-1 bg-blue-600 text-white font-bold text-[11px] rounded-lg shadow-xs hover:bg-blue-700 whitespace-nowrap cursor-pointer\"\n                      >\n                        Tải lại\n                      </a>\n                    </div>\n                  ))\n                )}\n              </div>\n            </div>\n          )}\n\n          {/* 5. QUẢN LÝ PHIÊN */}\n          {activeDrawer === 'quan-ly-phien' && (\n            <div className=\"space-y-4\">\n              <p className=\"text-slate-600 leading-relaxed text-xs\">\n                Lưu trữ toàn bộ dữ liệu 6 file, cài đặt tỷ trọng Target Hero và cấu hình giao diện thành phiên làm việc để tải về hoặc tái sử dụng bất cứ lúc nào.\n              </p>\n              \n              <div className=\"bg-emerald-50/70 border border-emerald-200 rounded-2xl p-3.5 space-y-2.5\">\n                <div className=\"flex items-center justify-between gap-2\">\n                  <div>\n                    <div className=\"font-extrabold text-emerald-900 text-xs\">💾 TỰ ĐỘNG SAO LƯU</div>\n                    <div className=\"text-[10px] text-emerald-700 mt-0.5\">Giữ tối đa 5 backup gần nhất. Tự dọn backup, lịch sử ngày và bản hoàn tác quá 31 ngày khi mở hoặc sử dụng trang; không xóa dữ liệu phiên hiện tại, cấu hình KPI hay file JSON đã tải về. Bản thiếu ngày hợp lệ được giữ lại.</div>\n                  </div>\n                  <span className=\"px-2 py-1 rounded-lg bg-emerald-100 text-emerald-800 font-black text-[10px]\">ĐANG BẬT</span>\n                </div>\n                <div className=\"grid grid-cols-2 gap-2\">\n                  <button type=\"button\" onClick={onRestoreLatestAutoBackup} className=\"py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition flex items-center justify-center gap-1.5 text-[11px]\">\n                    <RefreshCw className=\"w-3.5 h-3.5\" /> Khôi phục gần nhất\n                  </button>\n                  <button type=\"button\" onClick={onDownloadAutoBackup} className=\"py-2 bg-white hover:bg-emerald-50 text-emerald-800 font-bold rounded-xl border border-emerald-300 transition flex items-center justify-center gap-1.5 text-[11px]\">\n                    <Download className=\"w-3.5 h-3.5\" /> Tải backup gần nhất\n                  </button>\n                </div>\n              </div>\n\n              <button\n                onClick={onExportSession}\n                className=\"w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-xs transition flex items-center justify-center gap-2 cursor-pointer text-xs\"\n              >\n                <Save className=\"w-4 h-4\" />\n                <span>Sao lưu & Tải file phiên làm việc (.json)</span>\n              </button>\n\n              <label className=\"w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl border border-slate-300 transition flex items-center justify-center gap-2 cursor-pointer text-xs\">\n                <History className=\"w-4 h-4\" />\n                <span>Khôi phục từ file JSON đã lưu</span>\n                <input\n                  type=\"file\"\n                  accept=\".json\"\n                  className=\"hidden\"\n                  onChange={(e) => {\n                    const f = e.target.files?.[0];\n                    if (f && onImportSession) {\n                      onImportSession(f);\n                    }\n                  }}\n                />\n              </label>\n\n\n              {/* XÓA TOÀN BỘ DATA ĐANG LƯU TRONG PHIÊN */}\n              <div className=\"pt-3 border-t border-slate-200\">\n                <div className=\"bg-rose-50/80 border border-rose-200 rounded-2xl p-3.5 space-y-2.5\">\n                  <div className=\"flex items-center space-x-2 text-rose-900 font-extrabold text-xs\">\n                    <Trash2 className=\"w-4 h-4 text-rose-600 flex-shrink-0\" />\n                    <span>Dọn dẹp phiên làm việc</span>\n                  </div>\n                  <p className=\"text-[11px] text-rose-700 leading-relaxed\">\n                    Xóa sạch toàn bộ các bảng dữ liệu đã lưu trong phiên (Doanh thu, Thi đua, Nhân viên) và giải phóng bộ nhớ trình duyệt.\n                  </p>\n                  <button\n                    type=\"button\"\n                    onClick={() => {\n                      onOpenClearModal?.();\n                    }}\n                    className=\"w-full py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-xs transition flex items-center justify-center gap-2 cursor-pointer text-xs\"\n                  >\n                    <Trash2 className=\"w-4 h-4\" />\n                    <span>Xóa toàn bộ data đang lưu trong phiên</span>\n                  </button>\n                </div>\n              </div>\n            </div>\n          )}\n        </div>\n      </aside>\n    </>\n  );\n};\n","src/components/Header.tsx":"import React from 'react';\nimport { Camera, Sparkles, Save, CheckCircle2, Menu, Settings, Bot, History, Loader2, Images, Trash2 } from 'lucide-react';\nimport { ViewType } from '../types';\n\ninterface HeaderProps {\n  currentView?: ViewType;\n  onOpenUpload?: () => void;\n  onExportTab?: () => void;\n  onOpenAiAssistant?: () => void;\n  onOpenSettings?: () => void;\n  onOpenSessionManager?: () => void;\n  onOpenClearSession?: () => void;\n  onOpenDownloads?: () => void;\n  screenshotCount?: number;\n  isExporting?: boolean;\n  onToggleMobileSidebar?: () => void;\n}\n\nconst VIEW_TITLES: Record<ViewType, string> = {\n  [ViewType.DASHBOARD]: 'Bảng Điều Khiển Trung Tâm',\n  [ViewType.BAO_CAO_CUOI_NGAY]: 'Báo Cáo Cuối Ngày — Cụm 933',\n  [ViewType.THI_DUA_ST]: 'Bảng Xếp Hạng Thi Đua Siêu Thị',\n  [ViewType.SUC_KHOE_CUM]: 'Báo Cáo Sức Khoẻ Cụm Siêu Thị',\n  [ViewType.DOANH_THU_ST]: 'Doanh Thu & Thi Đua Siêu Thị Chi Tiết',\n  [ViewType.TRA_CHAM]: 'Báo Cáo Trả Chậm — Cụm 933',\n  [ViewType.SUC_KHOE_NV]: 'Bảng Xếp Hạng Thi Đua & Doanh Thu Nhân Viên',\n  [ViewType.SO_SANH]: 'So Sánh Hiệu Suất & Tương Quan Siêu Thị',\n  [ViewType.DU_BAO]: 'Dự Báo Cuối Tháng & Kế Hoạch Bứt Phá',\n  [ViewType.KPI_CUSTOM]: 'Cài Đặt & Cấu Hình Nhân Sự KPI',\n  [ViewType.THEO_DOI_NGAY]: 'Theo Dõi Tiến Độ Từng Ngày',\n};\n\nexport const Header: React.FC<HeaderProps> = ({\n  currentView = ViewType.BAO_CAO_CUOI_NGAY,\n  onOpenUpload,\n  onExportTab,\n  onOpenAiAssistant,\n  onOpenSettings,\n  onOpenSessionManager,\n  onOpenClearSession,\n  onOpenDownloads,\n  screenshotCount = 0,\n  isExporting = false,\n  onToggleMobileSidebar,\n}) => {\n  const triggerUpload = onOpenUpload;\n\n  return (\n    <header className=\"bg-white border-b border-slate-200 px-4 md:px-6 py-3 flex items-center justify-between sticky top-0 z-20 shadow-xs\">\n      <div className=\"flex items-center space-x-3\">\n        {onToggleMobileSidebar && (\n          <button\n            type=\"button\"\n            onClick={onToggleMobileSidebar}\n            className=\"md:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100 transition cursor-pointer\"\n            aria-label=\"Toggle menu\"\n          >\n            <Menu className=\"w-5 h-5\" />\n          </button>\n        )}\n        <span className=\"inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-emerald-100 animate-pulse\"></span>\n        <h2 className=\"font-extrabold text-slate-900 text-sm tracking-tight truncate max-w-[200px] sm:max-w-xs md:max-w-none\">\n          {VIEW_TITLES[currentView] || 'Sức Khoẻ Siêu Thị'}\n        </h2>\n        <span className=\"hidden sm:inline text-slate-300\">|</span>\n        <span className=\"hidden sm:inline-block text-xs font-bold text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-lg border border-blue-200/70\">\n          Cụm 933 - 351 Nguyễn Hữu Thọ\n        </span>\n      </div>\n\n      <div className=\"flex items-center space-x-2\">\n        {triggerUpload && (\n          <button\n            onClick={triggerUpload}\n            className=\"flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold shadow-xs hover:shadow-amber-500/25 transition cursor-pointer\"\n            title=\"Nhập hoặc dán trực tiếp dữ liệu từ bất kỳ màn hình nào\"\n          >\n            <Sparkles className=\"w-3.5 h-3.5\" />\n            <span className=\"hidden sm:inline\">Nhập / Dán Data</span>\n          </button>\n        )}\n\n        {onOpenAiAssistant && (\n          <button\n            onClick={onOpenAiAssistant}\n            cl
