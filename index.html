ate-900 text-sm\">\n                        {splitStoreKey === 'TGDD' ? 'TGD NHT' : 'AAR NHT'} — Bảng 1 (Môn 1 - {half})\n                      </h5>\n                      <span className=\"text-xs font-bold text-slate-600 bg-slate-100 px-2.5 py-0.5 rounded-lg\">\n                        {part1.length} môn\n                      </span>\n                    </div>\n                    <div className=\"overflow-x-auto custom-scroll\" data-export-expand=\"true\">\n                      <SortableTable className=\"w-full text-left text-xs border-collapse export-competition-table\">\n                        <thead className=\"bg-slate-900 text-white font-bold border-b border-slate-800 text-[10.5px]\">\n                          <tr>\n                                                        <th className=\"py-2.5 px-3 w-[150px] min-w-[150px] max-w-[150px]\"><button type=\"button\" onClick={(e) => { e.stopPropagation(); void copyProgramColumn(part1); }} className=\"inline-flex items-center gap-1 hover:text-amber-300\" title=\"Bấm để copy nguyên cột tên môn\"><span>TÊN MÔN THI ĐUA</span><Copy className=\"w-3 h-3\" /></button></th>\n                            <th className=\"no-export py-2.5 px-2 text-center w-[38px] min-w-[38px] max-w-[38px]\">LOẠI</th>\n                            <th className=\"py-2.5 px-2 text-right\">LUỸ KẾ</th>\n                            <th className=\"py-2.5 px-2 text-right text-amber-300\">HÔM NAY</th>\n                            <th className=\"py-2.5 px-2 text-right font-black text-amber-300\">CHỐT</th>\n                            <th className=\"py-2.5 px-2 text-right\">TARGET</th>\n                            <th className=\"py-2.5 px-2 text-center font-black\">% HT</th>\n                            <th className=\"py-2.5 px-2 text-right text-rose-300\">CẦN CHẠY</th>\n                            <th className=\"py-2.5 px-2 text-center\">TRẠNG THÁI</th>\n                          </tr>\n                        </thead>\n                        <tbody className=\"divide-y divide-slate-100 text-slate-700 font-semibold text-[11px]\">\n                          {renderSideTableRows(part1, storeKeyw)}\n                        </tbody>\n                      </SortableTable>\n                    </div>\n                  </div>\n\n                  <div data-program-copy-scope={storeKeyw} className=\"bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-3\">\n                    <div className=\"flex items-center justify-between pb-2 border-b border-slate-100\">\n                      <h5 className=\"font-extrabold text-slate-900 text-sm\">\n                        {splitStoreKey === 'TGDD' ? 'TGD NHT' : 'AAR NHT'} — Bảng 2 (Môn {half + 1} - {activeProgs.length})\n                      </h5>\n                      <span className=\"text-xs font-bold text-slate-600 bg-slate-100 px-2.5 py-0.5 rounded-lg\">\n                        {part2.length} môn\n                      </span>\n                    </div>\n                    <div className=\"overflow-x-auto custom-scroll\" data-export-expand=\"true\">\n                      <SortableTable className=\"w-full text-left text-xs border-collapse export-competition-table\">\n                        <thead className=\"bg-slate-900 text-white font-bold border-b border-slate-800 text-[10.5px]\">\n                          <tr>\n                                                        <th className=\"py-2.5 px-3 w-[150px] min-w-[150px] max-w-[150px]\"><button type=\"button\" onClick={(e) => { e.stopPropagation(); void copyProgramColumn(part2); }} className=\"inline-flex items-center gap-1 hover:text-blue-300\" title=\"Bấm để copy nguyên cột tên môn\"><span>TÊN MÔN THI ĐUA</span><Copy className=\"w-3 h-3\" /></button></th>\n                            <th className=\"no-export py-2.5 px-2 text-center w-[38px] min-w-[38px] max-w-[38px]\">LOẠI</th>\n                            <th className=\"py-2.5 px-2 text-right\">LUỸ KẾ</th>\n                            <th className=\"py-2.5 px-2 text-right text-blue-300\">HÔM NAY</th>\n                            <th className=\"py-2.5 px-2 text-right font-black text-blue-300\">CHỐT</th>\n                            <th className=\"py-2.5 px-2 text-right\">TARGET</th>\n                            <th className=\"py-2.5 px-2 text-center font-black\">% HT</th>\n                            <th className=\"py-2.5 px-2 text-right text-rose-300\">CẦN CHẠY</th>\n                            <th className=\"py-2.5 px-2 text-center\">TRẠNG THÁI</th>\n                          </tr>\n                        </thead>\n                        <tbody className=\"divide-y divide-slate-100 text-slate-700 font-semibold text-[11px]\">\n                          {renderSideTableRows(part2, storeKeyw)}\n                        </tbody>\n                      </SortableTable>\n                    </div>\n                  </div>\n                </>\n              );\n            })()\n          )}\n        </div>\n      </div>\n    </>\n  ) : (\n    <div className=\"no-export bg-white rounded-2xl border border-dashed border-slate-300 p-6 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-2xs text-slate-600 text-xs\">\n      <div className=\"flex items-center gap-3\">\n        <div className=\"w-10 h-10 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center flex-shrink-0\">\n          <Table2 className=\"w-5 h-5\" />\n        </div>\n        <div>\n          <p className=\"font-extrabold text-slate-900 text-sm\">Bảng dữ liệu chi tiết Doanh thu & Thi đua đang được ẩn</p>\n          <p className=\"text-slate-500 text-xs mt-0.5\">Bấm nút bên cạnh để hiển thị lại toàn bộ số liệu chi tiết</p>\n        </div>\n      </div>\n      <button\n        onClick={() => setShowDataTables(true)}\n        className=\"px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs transition cursor-pointer flex items-center gap-2 shadow-xs whitespace-nowrap\"\n      >\n        <Eye className=\"w-4 h-4\" />\n        <span>Hiện Bảng Dữ Liệu</span>\n      </button>\n    </div>\n  )}\n</div>\n);\n};\n","src/views/DoanhThuStView.tsx":"import React, { useEffect, useState } from 'react';\nimport { AppDataState, PersonnelConfigMap } from '../types';\nimport { formatCurrency, formatPercent, formatProgramName } from '../utils/formatters';\nimport { calculateForecast } from '../utils/forecastEngine';\nimport { RealtimeRevenueSummary } from './RealtimeRevenueSummary';\nimport { getReportPeriodContext, getVietnamCalendarParts } from '../utils/reportPeriod';\nimport { competitionTarget, competitionValue, sameCompetitionProgram } from '../utils/competition';\n\ninterface DoanhThuStViewProps {\n  appData: AppDataState;\n  activeStore: string;\n  onChangeActiveStore: (stId: string) => void;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n  personnelConfig: PersonnelConfigMap;\n  lastImportAt?: string | null;\n  subView: 'DETAIL' | 'REALTIME_SUMMARY';\n  onChangeSubView: (view: 'DETAIL' | 'REALTIME_SUMMARY') => void;\n  onExportRealtimeSummary?: () => void;\n  isExporting?: boolean;\n}\n\nexport const DoanhThuStView: React.FC<DoanhThuStViewProps> = ({\n  appData,\n  activeStore,\n  onChangeActiveStore,\n  onOpenProgramDetail,\n  personnelConfig,\n  lastImportAt,\n  subView,\n  onChangeSubView,\n  onExportRealtimeSummary,\n  isExporting = false,\n}) => {\n  const [dataMode, setDataMode] = useState<'LK' | 'RT'>(() => (appData.dt_luyke || []).length ? 'LK' : (appData.dt_realtime || []).length ? 'RT' : 'LK');\n  useEffect(() => {\n    if (!(appData.dt_luyke || []).length && (appData.dt_realtime || []).length && dataMode === 'LK') setDataMode('RT');\n  }, [(appData.dt_luyke || []).length, (appData.dt_realtime || []).length, dataMode]);\n\n  type ProgramSortMode = 'PCT_DESC' | 'PCT_ASC' | 'REMAIN_DESC' | 'NAME_ASC';\n  type ProgramFilterMode = 'ALL' | 'WEAK' | 'NEAR' | 'DONE';\n\n  const readSavedSort = (): ProgramSortMode => {\n    try {\n      const saved = localStorage.getItem('skst_doanhthu_program_sort_v1') as ProgramSortMode | null;\n      if (saved && ['PCT_DESC', 'PCT_ASC', 'REMAIN_DESC', 'NAME_ASC'].includes(saved)) return saved;\n    } catch {}\n    return 'PCT_DESC';\n  };\n  const readSavedFilter = (): ProgramFilterMode => {\n    try {\n      const saved = localStorage.getItem('skst_doanhthu_program_filter_v1') as ProgramFilterMode | null;\n      if (saved && ['ALL', 'WEAK', 'NEAR', 'DONE'].includes(saved)) return saved;\n    } catch {}\n    return 'ALL';\n  };\n\n  const [programSort, setProgramSortState] = useState<ProgramSortMode>(readSavedSort);\n  const [programFilter, setProgramFilterState] = useState<ProgramFilterMode>(readSavedFilter);\n\n  const setProgramSort = (value: ProgramSortMode) => {\n    setProgramSortState(value);\n    try { localStorage.setItem('skst_doanhthu_program_sort_v1', value); } catch {}\n  };\n  const setProgramFilter = (value: ProgramFilterMode) => {\n    setProgramFilterState(value);\n    try { localStorage.setItem('skst_doanhthu_program_filter_v1', value); } catch {}\n  };\n\n  const sourceList = dataMode === 'LK' ? appData.dt_luyke : appData.dt_realtime;\n\n  const row = sourceList.find(r => String(r['MÃ ĐƠN VỊ']) === String(activeStore)) || {};\n  const dtt = parseFloat(String(row['DOANH THU (TR)'])) || 0;\n  const dtqd = parseFloat(String(row['DOANH THU QĐ (TR)'])) || 0;\n  const target = parseFloat(String(row['TARGET (TR)'])) || 0;\n  const target_qd = parseFloat(String(row['TARGET QĐ (TR)'])) || 0;\n  const hasTragop = Object.prototype.hasOwnProperty.call(row, 'DT TRẢ GÓP (TR)') || Object.prototype.hasOwnProperty.call(row, '% TRẢ GÓP');\n  const tragop = hasTragop ? (parseFloat(String(row['DT TRẢ GÓP (TR)'])) || 0) : null;\n  const bill = parseFloat(String(row['LƯỢT BILL (TẤT CẢ ST)'])) || 0;\n  const sl = parseFloat(String(row['SỐ LƯỢNG'])) || 0;\n  const tb3thang = parseFloat(String(row['TB 3 THÁNG (TR)'])) || 0;\n  const reportPeriod = getReportPeriodContext(appData);\n  const vnNow = getVietnamCalendarParts();\n  const realtimeDaysInMonth = new Date(Date.UTC(vnNow.year, vnNow.month, 0)).getUTCDate();\n  const daysElapsed = dataMode === 'LK' ? reportPeriod.closedDays : 1;\n  const daysInMonth = dataMode === 'LK' ? reportPeriod.daysInMonth : realtimeDaysInMonth;\n\n  const calendarDay = dataMode === 'LK' ? reportPeriod.reportDay : vnNow.day;\n  const progressPct = daysInMonth > 0 ? calendarDay / daysInMonth * 100 : 0;\n  const vs3MonthPct = tb3thang > 0 ? ((dtt / tb3thang) - 1) * 100 : 0;\n\n  const tg_pct = hasTragop && dtt > 0 ? (Number(tragop) / dtt * 100) : null;\n  const qd_pct = dtt > 0 ? (dtqd / dtt * 100) : 0;\n  const forecastResult = dataMode === 'LK' ? calculateForecast(dtqd, target_qd, daysElapsed, daysInMonth) : { forecast: dtqd, forecastPct: target_qd > 0 ? dtqd / target_qd * 100 : 0 };\n  const runrate_forecast = forecastResult.forecastPct;\n  const forecast_val = forecastResult.forecast;\n\n  const storeKeyword = activeStore === '10341' ? 'AAR' : 'TGD';\n\n  const targetedLkPrograms = (appData.td_luyke || []).filter(r =>\n    String(r['ĐƠN VỊ / NHÂN VIÊN'] || '').includes(storeKeyword) &&\n    (parseFloat(String(r['TARGET (TR/SL theo LOẠI TĐ)'])) || 0) > 0\n  );\n  const storeTd = dataMode === 'LK'\n    ? targetedLkPrograms\n    : (appData.td_realtime || [])\n        .filter(r => String(r['ĐƠN VỊ / NHÂN VIÊN'] || '').includes(storeKeyword))\n        .map(rtRow => {\n          const lkRow = targetedLkPrograms.find(lk => sameCompetitionProgram(lk, rtRow));\n          // Thi đua: Target Realtime và Target Lũy kế là hai mốc riêng.\n          // Ở chế độ RT chỉ dùng Target RT của chính bảng Realtime, không mượn Target LK.\n          const rtTarget = competitionTarget(rtRow);\n          const targetNow = rtTarget > 0 ? rtTarget : 0;\n\n          return {\n            ...(lkRow || {}),\n            ...rtRow,\n            'MÃ CHƯƠNG TRÌNH': rtRow['MÃ CHƯƠNG TRÌNH'] || lkRow?.['MÃ CHƯƠNG TRÌNH'],\n            'CHƯƠNG TRÌNH': rtRow['CHƯƠNG TRÌNH'] || lkRow?.['CHƯƠNG TRÌNH'],\n            'LOẠI TĐ': rtRow['LOẠI TĐ'] || lkRow?.['LOẠI TĐ'] || 3,\n            'TARGET (TR/SL theo LOẠI TĐ)': targetNow,\n          };\n        });\n\n  const getProgramMetrics = (r: any) => {\n    const name = formatProgramName(r['CHƯƠNG TRÌNH'] || '');\n    const targetValue = competitionTarget(r);\n    const achieved = competitionValue(r);\n    const pct = targetValue > 0 ? achieved / targetValue * 100 : 0;\n    const remain = Math.max(0, targetValue - achieved);\n    return { name, pct, remain, target: targetValue };\n  };\n\n  const visibleStoreTd = [...storeTd]\n    .filter((r) => {\n      const { pct } = getProgramMetrics(r);\n      if (programFilter === 'WEAK') return pct < 70;\n      if (programFilter === 'NEAR') return pct >= 70 && pct < 100;\n      if (programFilter === 'DONE') return pct >= 100;\n      return true;\n    })\n    .sort((a, b) => {\n      const ma = getProgramMetrics(a);\n      const mb = getProgramMetrics(b);\n      if (programSort === 'PCT_ASC') return ma.pct - mb.pct || mb.remain - ma.remain || ma.name.localeCompare(mb.name, 'vi');\n      if (programSort === 'REMAIN_DESC') return mb.remain - ma.remain || ma.pct - mb.pct || ma.name.localeCompare(mb.name, 'vi');\n      if (programSort === 'NAME_ASC') return ma.name.localeCompare(mb.name, 'vi');\n      return mb.pct - ma.pct || ma.remain - mb.remain || ma.name.localeCompare(mb.name, 'vi');\n    });\n\n  let htCount = 0;\n  storeTd.forEach(r => {\n    if (getProgramMetrics(r).pct >= progressPct) htCount++;\n  });\n\n  return (\n    <div className=\"space-y-6\">\n      <div className=\"no-export bg-white rounded-2xl border border-slate-200 p-2 shadow-xs inline-flex items-center gap-1\">\n        <button\n          type=\"button\"\n          onClick={() => onChangeSubView('DETAIL')}\n          className={`px-4 py-2 rounded-xl text-xs font-black transition ${subView === 'DETAIL' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}\n        >\n          CHI TIẾT SHOP\n        </button>\n        <button\n          type=\"button\"\n          onClick={() => onChangeSubView('REALTIME_SUMMARY')}\n          className={`px-4 py-2 rounded-xl text-xs font-black transition ${subView === 'REALTIME_SUMMARY' ? 'bg-blue-600 text-white shadow-sm' : 'text-blue-700 hover:bg-blue-50'}`}\n        >\n          ⚡ REALTIME TỔNG HỢP\n        </button>\n      </div>\n\n      {subView === 'REALTIME_SUMMARY' ? (\n        <RealtimeRevenueSummary\n          appData={appData}\n          personnelConfig={personnelConfig}\n          lastImportAt={lastImportAt}\n          onExport={onExportRealtimeSummary}\n          isExporting={isExporting}\n        />\n      ) : (\n        <>\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-4 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div className=\"flex flex-wrap items-center gap-3\">\n          <select\n            value={activeStore}\n            onChange={(e) => onChangeActiveStore(e.target.value)}\n            className=\"text-xs font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer\"\n          >\n            <option value=\"933\">TGD_DNA_HCH - 351 Nguyễn Hữu Thọ</option>\n            <option value=\"10341\">AAR_DNA_HCH - 351 Nguyễn Hữu Thọ</option>\n          </select>\n          <span className=\"px-2.5 py-1 rounded-lg text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200\">\n            {dataMode === 'LK' ? 'LUỸ KẾ THÁNG' : 'REALTIME HÔM NAY'}\n          </span>\n          <span className=\"text-xs text-slate-400 font-medium\">\n            Ngày hiện tại: <b>Ngày {calendarDay} / {daysInMonth}</b> (Vị trí trong tháng: {progressPct.toFixed(1)}%)\n          </span>\n        </div>\n\n        <div className=\"flex items-center gap-2\">\n          <div className=\"flex bg-slate-100 rounded-xl p-1 text-xs font-semibold shadow-inner\">\n            <button\n              onClick={() => setDataMode('LK')}\n              className={`px-3 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                dataMode === 'LK' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              LUỸ KẾ THÁNG\n            </button>\n            <button\n              onClick={() => setDataMode('RT')}\n              className={`px-3 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                dataMode === 'RT' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              REALTIME HÔM NAY\n            </button>\n          </div>\n        </div>\n      </div>\n\n      <div className=\"grid grid-cols-2 md:grid-cols-4 gap-4\">\n        <div className=\"bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-blue-100\">DOANH THU THỰC</span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {dtt > 0 ? formatCurrency(dtt, 1) : '0'}\n          </div>\n          <div className=\"text-[11px] text-blue-100 flex justify-between border-t border-blue-400/50 pt-2 mt-1\">\n            <span>TARGET:</span>\n            <strong>{formatCurrency(target, 1)} TR</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-teal-500 to-emerald-600 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-emerald-100\">DOANH THU QĐ</span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {dtqd > 0 ? formatCurrency(dtqd, 1) : '0'}\n          </div>\n          <div className=\"text-[11px] text-emerald-100 flex justify-between border-t border-emerald-400/50 pt-2 mt-1\">\n            <span>TARGET:</span>\n            <strong>{formatCurrency(target_qd, 1)} TR</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-amber-500 to-orange-500 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-amber-100\">\n            DOANH THU TRẢ CHẬM\n          </span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {hasTragop ? formatPercent(Number(tg_pct), 0) : '—'}\n          </div>\n          <div className=\"text-[11px] text-amber-100 flex justify-between border-t border-amber-400/50 pt-2 mt-1\">\n            <span>DT TRẢ CHẬM:</span>\n            <strong>{hasTragop ? `${formatCurrency(Number(tragop), 1)} TR` : '—'}</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-sky-400 to-cyan-500 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-cyan-100\">LƯỢT KHÁCH / BILL</span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {bill}\n          </div>\n          <div className=\"text-[11px] text-cyan-100 flex justify-between border-t border-cyan-300/50 pt-2 mt-1\">\n            <span>BILL MÁY:</span>\n            <strong>{sl} món</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-purple-500 to-indigo-600 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-purple-100\">\n            % HT QĐ DỰ KIẾN\n          </span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {formatPercent(runrate_forecast, 0)}\n          </div>\n          <div className=\"text-[11px] text-purple-100 flex justify-between border-t border-purple-400/50 pt-2 mt-1\">\n            <span>DTQĐ DỰ KIẾN:</span>\n            <strong>{formatCurrency(forecast_val, 0)} TR</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-rose-500 to-pink-600 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <div>\n            <span className=\"text-[11px] font-bold uppercase tracking-wider text-rose-100\">TỶ LỆ QĐ / THỰC</span>\n            <div className=\"text-[9px] font-semibold text-rose-100/90 mt-0.5\">DT QĐ ÷ DT Thực</div>\n          </div>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {formatPercent(qd_pct, 0)}\n          </div>\n          <div className=\"text-[11px] text-rose-100 flex justify-between border-t border-rose-400/50 pt-2 mt-1\">\n            <span>MỤC TIÊU TỶ LỆ:</span>\n            <strong>150%</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-indigo-600 to-violet-700 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-indigo-100\">\n            THI ĐUA HOÀN THÀNH\n          </span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {htCount}/{storeTd.length}\n          </div>\n          <div className=\"text-[11px] text-indigo-100 flex justify-between border-t border-indigo-400/50 pt-2 mt-1\">\n            <span>TỶ LỆ MÔN:</span>\n            <strong>{storeTd.length > 0 ? formatPercent((htCount / storeTd.length) * 100, 0) : '0%'}</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-amber-600 to-amber-700 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-amber-100\">\n            TĂNG/GIẢM CÙNG KỲ\n          </span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {vs3MonthPct >= 0 ? ' +' : ''}{vs3MonthPct.toFixed(1)}%\n          </div>\n          <div className=\"text-[11px] text-amber-100 flex justify-between border-t border-amber-500/50 pt-2 mt-1\">\n            <span>SO TB 3 THÁNG:</span>\n            <strong>{formatCurrency(tb3thang, 1)} TR</strong>\n          </div>\n        </div>\n      </div>\n\n      <div className=\"no-export bg-white rounded-2xl border border-slate-200 p-3.5 shadow-xs flex flex-col gap-3\">\n        <div className=\"flex flex-wrap items-center justify-between gap-3\">\n          <div className=\"flex flex-wrap items-center gap-2\">\n            <span className=\"text-[11px] font-black uppercase tracking-wide text-slate-500\">Sắp xếp</span>\n            {[\n              ['PCT_DESC', '% hoàn thành ↓'],\n              ['PCT_ASC', '% hoàn thành ↑'],\n              ['REMAIN_DESC', 'Còn phải chạy ↓'],\n              ['NAME_ASC', 'Tên môn A–Z'],\n            ].map(([value, label]) => (\n              <button\n                key={value}\n                type=\"button\"\n                onClick={() => setProgramSort(value as ProgramSortMode)}\n                aria-pressed={programSort === value}\n                className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition cursor-pointer ${\n                  programSort === value\n                    ? 'bg-blue-600 border-blue-600 text-white shadow-sm'\n                    : 'bg-white border-slate-200 text-slate-600 hover:bg-blue-50 hover:text-blue-700'\n                }`}\n              >\n                {label}\n              </button>\n            ))}\n          </div>\n          <div className=\"text-[11px] font-bold text-slate-500\">\n            Hiển thị <span className=\"text-slate-900\">{visibleStoreTd.length}/{storeTd.length}</span> môn\n          </div>\n        </div>\n\n        <div className=\"flex flex-wrap items-center gap-2\">\n          <span className=\"text-[11px] font-black uppercase tracking-wide text-slate-500\">Lọc nhanh</span>\n          {[\n            ['ALL', 'Tất cả'],\n            ['WEAK', 'Dưới 70%'],\n            ['NEAR', '70–99%'],\n            ['DONE', 'Đã đạt ≥100%'],\n          ].map(([value, label]) => (\n            <button\n              key={value}\n              type=\"button\"\n              onClick={() => setProgramFilter(value as ProgramFilterMode)}\n              aria-pressed={programFilter === value}\n              className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition cursor-pointer ${\n                programFilter === value\n                  ? value === 'DONE'\n                    ? 'bg-emerald-600 border-emerald-600 text-white'\n                    : value === 'WEAK'\n                    ? 'bg-rose-600 border-rose-600 text-white'\n                    : value === 'NEAR'\n                    ? 'bg-amber-500 border-amber-500 text-white'\n                    : 'bg-slate-800 border-slate-800 text-white'\n                  : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'\n              }`}\n            >\n              {label}\n            </button>\n          ))}\n          {(programSort !== 'PCT_DESC' || programFilter !== 'ALL') && (\n            <button\n              type=\"button\"\n              onClick={() => { setProgramSort('PCT_DESC'); setProgramFilter('ALL'); }}\n              className=\"ml-auto px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-200 bg-slate-50 text-slate-500 hover:bg-slate-100 cursor-pointer\"\n            >\n              ↺ Mặc định\n            </button>\n          )}\n        </div>\n      </div>\n\n      <div className=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5\">\n        {visibleStoreTd.map((r, idx) => {\n          const ten = r['CHƯƠNG TRÌNH'] || '';\n          const metrics = getProgramMetrics(r);\n          const pct = metrics.pct;\n          const tg = metrics.target;\n          const achieved = competitionValue(r);\n          const loai = Number(r['LOẠI TĐ']);\n          const isQty = loai === 2 || loai === 6;\n          const displayVal = `${achieved.toFixed(isQty ? 0 : 1)}/${tg.toFixed(isQty ? 0 : 1)}`;\n          const tag = isQty ? 'SLLK' : 'DTQĐ';\n          const remain = metrics.remain;\n\n          let badgeColor = 'bg-rose-50 text-rose-700 border-rose-200';\n          let barColor = 'bg-rose-500';\n          let cardColor = 'border-rose-300 bg-rose-50/50 hover:border-rose-500';\n          if (pct >= 100) {\n            badgeColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';\n            barColor = 'bg-emerald-500';\n            cardColor = 'border-emerald-300 bg-emerald-50/50 hover:border-emerald-500';\n          } else if (pct >= 70) {\n            badgeColor = 'bg-amber-50 text-amber-700 border-amber-200';\n            barColor = 'bg-amber-500';\n            cardColor = 'border-amber-300 bg-amber-50/50 hover:border-amber-500';\n          }\n\n          return (\n            <div\n              key={`${activeStore}-${String(r['MÃ CHƯƠNG TRÌNH'] || ten || idx)}`}\n              onClick={() => onOpenProgramDetail(activeStore === '10341' ? 'TopZone' : 'TGDĐ', r['MÃ CHƯƠNG TRÌNH'], ten)}\n              title=\"Bấm để xem chi tiết nhân viên bán môn này\"\n              className={`rounded-2xl border-2 p-4 shadow-2xs hover:shadow-md cursor-pointer transition-colors duration-150 space-y-2.5 ${cardColor}`}\n            >\n              <div className=\"flex items-center justify-between\">\n                <h5 className=\"font-bold text-slate-800 text-xs truncate max-w-[220px]\" title={ten}>\n                  {formatProgramName(ten)}\n                </h5>\n                <span className={`px-2 py-0.5 rounded-lg text-xs font-black border ${badgeColor}`}>\n                  {formatPercent(pct, 0)}\n                </span>\n              </div>\n\n              <div className=\"w-full bg-slate-100 h-2 rounded-full overflow-hidden\">\n                <div\n                  className={`${barColor} h-full rounded-full transition-all duration-500`}\n                  style={{ width: `${Math.min(Math.max(pct, 0), 100)}%` }}\n                ></div>\n              </div>\n\n              <div className=\"flex items-center justify-between text-[11px] text-slate-500 pt-0.5\">\n                <span>\n                  {tag}: <strong className=\"text-slate-800 font-bold\">{displayVal}</strong>\n                </span>\n                <span className=\"text-slate-400\">\n                  Còn: <b className=\"text-slate-700 font-bold\">{remain.toFixed(0)}</b>\n                </span>\n              </div>\n            </div>\n          );\n        })}\n        {visibleStoreTd.length === 0 && (\n          <div className=\"col-span-full rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-center text-sm text-slate-500\">\n            Không có môn nào phù hợp với bộ lọc đang chọn.\n          </div>\n        )}\n      </div>\n        </>\n      )}\n    </div>\n  );\n};\n","src/views/DuBaoView.tsx":"import React, { useState, useEffect } from 'react';\nimport { TrendingUp, Calendar } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatPercent } from '../utils/formatters';\nimport { calculateForecast } from '../utils/forecastEngine';\nimport { useStretchGoalPct } from '../utils/stretchGoal';\nimport { getReportPeriodContext } from '../utils/reportPeriod';\n\ninterface DuBaoViewProps {\n  appData: AppDataState;\n}\n\nconst ForecastSlider = ({min, max, value, step = 1, onChange, label, green = false}: {\n  min: number; max: number; value: number; step?: number;\n  onChange: (value: number) => void; label: string; green?: boolean;\n}) => {\n  const position = max > min ? Math.min(100, Math.max(0, (value - min) / (max - min) * 100)) : 0;\n  return <div data-export-slider=\"true\" style={{position:'relative', height:24, width:'100%', margin:'4px 0'}}>\n    <div style={{position:'absolute', left:7, right:7, top:0, height:24}}>\n      <svg width=\"100%\" height=\"24\" aria-hidden=\"true\" style={{display:'block', overflow:'visible'}}>\n        <rect x=\"0\" y=\"8\" width=\"100%\" height=\"8\" rx=\"4\" fill=\"#e2e8f0\" />\n        <circle cx={`${position}%`} cy=\"12\" r=\"7\" fill={green ? '#059669' : '#2563eb'} />\n      </svg>\n    </div>\n    <input className=\"no-export\" aria-label={label} type=\"range\" min={min} max={max} step={step} value={value}\n      onChange={e => onChange(Number(e.target.value))}\n      style={{position:'absolute', inset:0, width:'100%', height:24, margin:0, opacity:0, cursor:'pointer'}} />\n  </div>;\n};\n\nexport const DuBaoView: React.FC<DuBaoViewProps> = ({ appData }) => {\n  const getCurrentMonthProgress = () => {\n    const period = getReportPeriodContext(appData);\n    return { day: period.closedDays, total: period.daysInMonth };\n  };\n\n  const initialProgress = getCurrentMonthProgress();\n  const [daysPassed, setDaysPassed] = useState<number>(initialProgress.day);\n  const [totalDays, setTotalDays] = useState<number>(initialProgress.total);\n\n  useEffect(() => {\n    const progress = getCurrentMonthProgress();\n    setDaysPassed(progress.day);\n    setTotalDays(progress.total);\n  }, [appData.dt_luyke, appData.dt_nv_luyke, appData.dt_realtime]);\n  const [stretchGoalPct, setStretchGoalPct] = useStretchGoalPct();\n\n  const lk = appData.dt_luyke || [];\n  const rt = appData.dt_realtime || [];\n  const shopRows = lk.filter(r => String(r['MÃ ĐƠN VỊ'] || '').trim() && !/^t[oổ]ng/i.test(String(r['TÊN ĐƠN VỊ'] || '')));\n  const findStoreByCode = (code: string) => shopRows.find(r => String(r['MÃ ĐƠN VỊ'] || '').trim() === code);\n  const findRtByCode = (code: string) => rt.find(r => String(r['MÃ ĐƠN VỊ'] || '').trim() === code) || {};\n  const codedAar = findStoreByCode('10341');\n  const codedTgd = findStoreByCode('933');\n  const rowAar = codedAar || shopRows.find(r => r !== codedTgd) || {};\n  const rowTgd = codedTgd || shopRows.find(r => r !== rowAar) || {};\n  const rowAarRt = findRtByCode('10341');\n  const rowTgdRt = findRtByCode('933');\n\n  const aar_lk = parseFloat(String(rowAar['DOANH THU QĐ (TR)'])) || 0;\n  const aar_rt = parseFloat(String(rowAarRt['DOANH THU QĐ (TR)'])) || 0;\n  const aar_dtqd = aar_lk + aar_rt;\n  const aar_target = parseFloat(String(rowAarRt['TARGET QĐ (TR)'])) || parseFloat(String(rowAarRt['TARGET (TR)'])) || parseFloat(String(rowAar['TARGET QĐ (TR)'])) || parseFloat(String(rowAar['TARGET (TR)'])) || 0;\n\n  const tgd_lk = parseFloat(String(rowTgd['DOANH THU QĐ (TR)'])) || 0;\n  const tgd_rt = parseFloat(String(rowTgdRt['DOANH THU QĐ (TR)'])) || 0;\n  const tgd_dtqd = tgd_lk + tgd_rt;\n  const tgd_target = parseFloat(String(rowTgdRt['TARGET QĐ (TR)'])) || parseFloat(String(rowTgdRt['TARGET (TR)'])) || parseFloat(String(rowTgd['TARGET QĐ (TR)'])) || parseFloat(String(rowTgd['TARGET (TR)'])) || 0;\n\n  // Quỹ ngày còn lại tính từ hôm nay trở đi: LK đã chốt D-1, Realtime là D đang chạy.\n  const remainingDays = Math.max(0, totalDays - daysPassed);\n\n  const calcSim = (current: number, closedValue: number, target: number) => {\n    const adjustedTarget = target * (stretchGoalPct / 100);\n    const forecastResult = calculateForecast(closedValue, target, daysPassed, totalDays, stretchGoalPct);\n    const forecast = daysPassed > 0 ? Math.max(current, forecastResult.forecast) : current;\n    const gap = Math.max(0, adjustedTarget - current);\n    const neededPerDay = remainingDays > 0 ? gap / remainingDays : 0;\n    const currentRunRate = daysPassed > 0 ? closedValue / daysPassed : 0;\n    const runRateGap = neededPerDay - currentRunRate;\n    const expectedPct = target > 0 ? (forecast / target * 100) : 0;\n\n    return {\n      forecast,\n      gap,\n      neededPerDay,\n      currentRunRate,\n      runRateGap,\n      expectedPct,\n      adjustedTarget,\n    };\n  };\n\n  const aarSim = calcSim(aar_dtqd, aar_lk, aar_target);\n  const tgdSim = calcSim(tgd_dtqd, tgd_lk, tgd_target);\n\n  const cum_dtqd = aar_dtqd + tgd_dtqd;\n  const cum_lk = aar_lk + tgd_lk;\n  const cum_target = aar_target + tgd_target;\n  const cumSim = calcSim(cum_dtqd, cum_lk, cum_target);\n\n  return (\n    <div className=\"space-y-6\">\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div>\n          <h3 className=\"font-black text-slate-900 text-lg uppercase tracking-tight flex items-center gap-2\">\n            <TrendingUp className=\"w-5 h-5 text-emerald-600\" />\n            <span>MÔ PHỎNG DỰ BÁO DOANH THU & KẾ HOẠCH BỨT PHÁ</span>\n          </h3>\n          <p className=\"text-xs text-slate-500 font-medium\">\n            Nhịp dự báo lấy từ Lũy kế D-1 đã chốt; DT hiện tại và GAP đã cộng Realtime ngày D để không bỏ sót kết quả hôm nay.\n          </p>\n        </div>\n\n      </div>\n\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n        <h4 className=\"font-extrabold text-slate-900 text-xs uppercase flex items-center gap-1.5\">\n          <Calendar className=\"w-4 h-4 text-blue-600\" />\n          <span>Thông Số Kế Hoạch & Tiến Độ Tháng</span>\n        </h4>\n\n        <div className=\"grid grid-cols-1 sm:grid-cols-3 gap-5\">\n          <div>\n            <div className=\"flex justify-between text-xs font-bold text-slate-700 mb-1\">\n              <span>Số ngày lũy kế đã chốt:</span>\n              <span className=\"text-blue-600 font-black\">{daysPassed} ngày</span>\n            </div>\n            <ForecastSlider label=\"Số ngày lũy kế đã chốt\" min={0} max={totalDays} value={daysPassed} onChange={setDaysPassed} />\n            <span className=\"text-[10px] text-slate-400\">Tiến độ thời gian: {((daysPassed / totalDays) * 100).toFixed(1)}%</span>\n          </div>\n\n          <div>\n            <div className=\"flex justify-between text-xs font-bold text-slate-700 mb-1\">\n              <span>Tổng số ngày trong tháng:</span>\n              <span className=\"text-slate-900 font-black\">{totalDays} ngày</span>\n            </div>\n            <ForecastSlider label=\"Tổng số ngày trong tháng\" min={28} max={31} value={totalDays} onChange={value => { setTotalDays(value); setDaysPassed(prev => Math.min(prev, value)); }} />\n            <span className=\"text-[10px] text-slate-400\">Còn lại: {remainingDays} ngày để về đích</span>\n          </div>\n\n          <div>\n            <div className=\"flex justify-between text-xs font-bold text-slate-700 mb-1\">\n              <span>Mục tiêu phấn đấu (Stretch Goal):</span>\n              <span className=\"text-emerald-600 font-black\">{stretchGoalPct}% Target</span>\n            </div>\n            <ForecastSlider label=\"Mục tiêu phấn đấu\" min={90} max={150} step={5} value={stretchGoalPct} onChange={setStretchGoalPct} green />\n            <span className=\"text-[10px] text-slate-400\">Điều chỉnh chỉ tiêu thưởng bứt phá • Đồng bộ toàn hệ thống</span>\n          </div>\n        </div>\n      </div>\n\n      <div className=\"grid grid-cols-1 md:grid-cols-3 gap-5\">\n        <div className=\"bg-slate-900 text-white rounded-2xl p-5 shadow-sm space-y-4\">\n          <div className=\"flex justify-between items-center pb-2 border-b border-slate-800\">\n            <div>\n              <span className=\"text-[10px] font-bold text-amber-400 uppercase\">★ TOÀN CỤM 933</span>\n              <h4 className=\"text-base font-black\">Tổng Cụm Siêu Thị</h4>\n            </div>\n            <span className=\"text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300\">\n              {daysPassed}/{totalDays} ngày\n            </span>\n          </div>\n\n          <div className=\"space-y-2.5 text-xs\">\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-400\">DT QĐ hiện tại (LK + RT):</span>\n              <span className=\"font-mono font-bold\">{formatCurrency(cum_dtqd)} Tr</span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-400\">Target Mục Tiêu:</span>\n              <span className=\"font-mono font-bold\">{formatCurrency(cumSim.adjustedTarget)} Tr</span>\n            </div>\n            <div className=\"flex justify-between items-baseline pt-1 border-t border-slate-800\">\n              <span className=\"text-slate-400\">Dự Báo Cuối Tháng:</span>\n              <span className=\"text-lg font-black text-amber-300 font-mono\">\n                {formatCurrency(cumSim.forecast)} Tr\n              </span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-400\">% dự báo / target gốc:</span>\n              <span className={`font-black ${cumSim.expectedPct >= 100 ? 'text-emerald-400' : 'text-rose-400'}`}>\n                {formatPercent(cumSim.expectedPct)}\n              </span>\n            </div>\n            <div className=\"flex justify-between gap-2\">\n              <span className=\"text-slate-400\">% dự báo / mục tiêu {stretchGoalPct}%:</span>\n              <span className={`font-black ${cumSim.forecast >= cumSim.adjustedTarget && cumSim.adjustedTarget > 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{cumSim.adjustedTarget > 0 ? formatPercent(cumSim.forecast / cumSim.adjustedTarget * 100) : '—'}</span>\n            </div>\n            <div className=\"p-3 bg-slate-800/80 rounded-xl space-y-1 mt-2\">\n              <span className=\"text-[10.5px] text-slate-400 uppercase block font-bold\">\n                🎯 CẦN ĐẠT/NGÀY TỪ MỐC LŨY KẾ\n              </span>\n              <span className=\"text-xl font-black text-rose-300 block font-mono\">\n                {formatCurrency(cumSim.neededPerDay)} Tr/ngày\n              </span>\n              <span className=\"text-[10px] text-slate-400 block\">\n                (Hiện đang chạy: {formatCurrency(cumSim.currentRunRate)} Tr/ngày)\n              </span>\n            </div>\n          </div>\n        </div>\n\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex justify-between items-center pb-2 border-b border-slate-100\">\n            <div>\n              <span className=\"text-[10px] font-bold text-amber-600 uppercase\">933</span>\n              <h4 className=\"text-base font-black text-slate-900\">TGD NHT</h4>\n            </div>\n            <span className=\"text-xs font-bold px-2 py-0.5 rounded bg-amber-50 text-amber-800 border border-amber-200\">\n              {formatPercent(tgd_target > 0 ? (tgd_dtqd / tgd_target * 100) : 0)} HT\n            </span>\n          </div>\n\n          <div className=\"space-y-2.5 text-xs\">\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">DT QĐ Hiện Tại:</span>\n              <span className=\"font-mono font-bold text-slate-800\">{formatCurrency(tgd_dtqd)} Tr</span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">Target Mục Tiêu:</span>\n              <span className=\"font-mono font-bold text-slate-600\">{formatCurrency(tgdSim.adjustedTarget)} Tr</span>\n            </div>\n            <div className=\"flex justify-between items-baseline pt-1 border-t border-slate-100\">\n              <span className=\"text-slate-500\">Dự Báo Cuối Tháng:</span>\n              <span className=\"text-lg font-black text-blue-600 font-mono\">\n                {formatCurrency(tgdSim.forecast)} Tr\n              </span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">% dự báo / target gốc:</span>\n              <span className={`font-black ${tgdSim.expectedPct >= 100 ? 'text-emerald-600' : 'text-rose-600'}`}>\n                {formatPercent(tgdSim.expectedPct)}\n              </span>\n            </div>\n            <div className=\"flex justify-between gap-2\">\n              <span className=\"text-slate-500\">% dự báo / mục tiêu {stretchGoalPct}%:</span>\n              <span className={`font-black ${tgdSim.forecast >= tgdSim.adjustedTarget && tgdSim.adjustedTarget > 0 ? 'text-emerald-600' : 'text-rose-600'}`}>{tgdSim.adjustedTarget > 0 ? formatPercent(tgdSim.forecast / tgdSim.adjustedTarget * 100) : '—'}</span>\n            </div>\n            <div className=\"p-3 bg-amber-50/70 border border-amber-200 rounded-xl space-y-1 mt-2\">\n              <span className=\"text-[10.5px] text-amber-800 uppercase block font-bold\">\n                🎯 CẦN ĐẠT/NGÀY TỪ MỐC LŨY KẾ\n              </span>\n              <span className=\"text-xl font-black text-rose-600 block font-mono\">\n                {formatCurrency(tgdSim.neededPerDay)} Tr/ngày\n              </span>\n              <span className=\"text-[10px] text-slate-500 block\">\n                (Hiện tại: {formatCurrency(tgdSim.currentRunRate)} Tr/ngày)\n              </span>\n            </div>\n          </div>\n        </div>\n\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex justify-between items-center pb-2 border-b border-slate-100\">\n            <div>\n              <span className=\"text-[10px] font-bold text-blue-600 uppercase\">10341</span>\n              <h4 className=\"text-base font-black text-slate-900\">AAR NHT (TopZone)</h4>\n            </div>\n            <span className=\"text-xs font-bold px-2 py-0.5 rounded bg-blue-50 text-blue-800 border border-blue-200\">\n              {formatPercent(aar_target > 0 ? (aar_dtqd / aar_target * 100) : 0)} HT\n            </span>\n          </div>\n\n          <div className=\"space-y-2.5 text-xs\">\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">DT QĐ Hiện Tại:</span>\n              <span className=\"font-mono font-bold text-slate-800\">{formatCurrency(aar_dtqd)} Tr</span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">Target Mục Tiêu:</span>\n              <span className=\"font-mono font-bold text-slate-600\">{formatCurrency(aarSim.adjustedTarget)} Tr</span>\n            </div>\n            <div className=\"flex justify-between items-baseline pt-1 border-t border-slate-100\">\n              <span className=\"text-slate-500\">Dự Báo Cuối Tháng:</span>\n              <span className=\"text-lg font-black text-blue-600 font-mono\">\n                {formatCurrency(aarSim.forecast)} Tr\n              </span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">% dự báo / target gốc:</span>\n              <span className={`font-black ${aarSim.expectedPct >= 100 ? 'text-emerald-600' : 'text-rose-600'}`}>\n                {formatPercent(aarSim.expectedPct)}\n              </span>\n            </div>\n            <div className=\"flex justify-between gap-2\">\n              <span className=\"text-slate-500\">% dự báo / mục tiêu {stretchGoalPct}%:</span>\n              <span className={`font-black ${aarSim.forecast >= aarSim.adjustedTarget && aarSim.adjustedTarget > 0 ? 'text-emerald-600' : 'text-rose-600'}`}>{aarSim.adjustedTarget > 0 ? formatPercent(aarSim.forecast / aarSim.adjustedTarget * 100) : '—'}</span>\n            </div>\n            <div className=\"p-3 bg-blue-50/70 border border-blue-200 rounded-xl space-y-1 mt-2\">\n              <span className=\"text-[10.5px] text-blue-800 uppercase block font-bold\">\n                🎯 CẦN ĐẠT/NGÀY TỪ MỐC LŨY KẾ\n              </span>\n              <span className=\"text-xl font-black text-rose-600 block font-mono\">\n                {formatCurrency(aarSim.neededPerDay)} Tr/ngày\n              </span>\n              <span className=\"text-[10px] text-slate-500 block\">\n                (Hiện tại: {formatCurrency(aarSim.currentRunRate)} Tr/ngày)\n              </span>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/views/KpiCustomView.tsx":"import { SortableTable } from '../components/SortableTable';\nimport React, { useState } from 'react';\nimport { Settings, Plus, RotateCcw, ShieldCheck, Eye, EyeOff, Trash2, CheckCircle2, RefreshCw } from 'lucide-react';\nimport { PersonnelConfigMap, AppDataState } from '../types';\nimport { getStretchGoalPct, getPersonnelAllocationPct, setPersonnelAllocationPct } from '../utils/stretchGoal';\n\ninterface KpiCustomViewProps {\n  appData?: AppDataState;\n  onUpdateAppData?: (newAppData: AppDataState) => void;\n  personnelConfig: PersonnelConfigMap;\n  onUpdateConfig: (newConfig: PersonnelConfigMap) => void;\n  onResetDefault: () => void;\n}\n\nexport const KpiCustomView: React.FC<KpiCustomViewProps> = ({\n  appData,\n  onUpdateAppData,\n  personnelConfig,\n  onUpdateConfig,\n  onResetDefault,\n}) => {\n  const [activeStore, setActiveStore] = useState<'TGDD' | 'TOPZONE'>('TGDD');\n  const [newStaffName, setNewStaffName] = useState<string>('');\n  const [toastMsg, setToastMsg] = useState<string>('');\n  const [isDivideMenuOpen, setIsDivideMenuOpen] = useState<boolean>(false);\n\n  const showToast = (msg: string) => {\n    setToastMsg(msg);\n    setTimeout(() => setToastMsg(''), 2500);\n  };\n\n  const currentStoreConfigs: Record<string, any> = personnelConfig[activeStore] || {};\n  const staffList = Object.entries(currentStoreConfigs).map(([name, cfg]) => {\n    const c = (cfg || {}) as { isOfficial?: boolean; isVisible?: boolean; targetPct?: number };\n    return {\n      name,\n      isOfficial: c.isOfficial === true,\n      isVisible: c.isVisible !== false,\n      targetPct: c.targetPct ?? (activeStore === 'TGDD' ? 37.5 : 25.0),\n    };\n  });\n\n  const isMatchingStaffRow = (r: any, targetName: string) => {\n    const fields = [\n      r['ĐƠN VỊ / NHÂN VIÊN'],\n      r['TÊN NHÂN VIÊN'],\n      r['Nhân viên'],\n      r['Họ và tên'],\n      r['MÃ NV'],\n      r['Mã NV'],\n      r['MÃ NHÂN VIÊN'],\n    ];\n\n    const normTarget = targetName.trim().toLowerCase();\n    const parenMatch = targetName.match(/\\((\\d+)\\)/);\n    const codeInParen = parenMatch ? parenMatch[1] : '';\n    const cleanTarget = targetName.replace(/\\(\\d+\\)/g, '').trim().toLowerCase();\n\n    return fields.some(f => {\n      if (!f) return false;\n      const str = String(f).trim().toLowerCase();\n      if (str === normTarget || str === cleanTarget) return true;\n      if (cleanTarget && cleanTarget.length >= 3 && str.includes(cleanTarget)) return true;\n      if (codeInParen && str.includes(codeInParen)) return true;\n      return false;\n    });\n  };\n\n  const handleToggleOfficial = (name: string) => {\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    if (!next[activeStore][name]) next[activeStore][name] = {};\n    const curr = next[activeStore][name].isOfficial === true;\n    next[activeStore][name].isOfficial = !curr;\n    onUpdateConfig(next);\n    showToast(`Đã chuyển nhân sự ${name} sang ${!curr ? 'Nội bộ' : 'Hỗ trợ'}`);\n  };\n\n  const handleToggleVisible = (name: string) => {\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    if (!next[activeStore][name]) next[activeStore][name] = {};\n    const curr = next[activeStore][name].isVisible !== false;\n    next[activeStore][name].isVisible = !curr;\n    onUpdateConfig(next);\n    showToast(`Đã ${!curr ? 'HIỆN' : 'ẨN'} nhân sự ${name}`);\n  };\n\n  const handleChangeTarget = (name: string, val: number) => {\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    if (!next[activeStore][name]) next[activeStore][name] = {};\n    next[activeStore][name].targetPct = val;\n    onUpdateConfig(next);\n  };\n\n  const handleDeleteStaff = (name: string) => {\n    if (\n      !window.confirm(\n        `Bạn có chắc muốn xóa nhân viên \"${name}\" khỏi danh sách? Thao tác này sẽ tự động loại bỏ và đồng bộ toàn bộ dữ liệu liên quan của nhân sự này khỏi tất cả các bảng dữ liệu hiện có.`\n      )\n    ) {\n      return;\n    }\n\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (next[activeStore]) {\n      delete next[activeStore][name];\n      Object.keys(next[activeStore]).forEach(k => {\n        if (k.toLowerCase().trim() === name.toLowerCase().trim()) {\n          delete next[activeStore][k];\n        }\n      });\n    }\n\n    const remainingOfficials = Object.entries(next[activeStore] || {})\n      .map(([n, cfg]: [string, any]) => ({\n        name: n,\n        isOfficial: cfg?.isOfficial === true,\n        isVisible: cfg?.isVisible !== false,\n      }))\n      .filter(s => s.isOfficial && s.isVisible);\n\n    if (remainingOfficials.length > 0) {\n      const allocationTotal = getPersonnelAllocationPct(activeStore) ?? getStretchGoalPct();\n      const equalPct = Math.round((allocationTotal / remainingOfficials.length) * 10) / 10;\n      remainingOfficials.forEach(s => {\n        if (next[activeStore][s.name]) {\n          next[activeStore][s.name].targetPct = equalPct;\n        }\n      });\n    }\n\n    onUpdateConfig(next);\n\n    if (appData && onUpdateAppData) {\n      const filterRows = (arr: any[]) => {\n        if (!arr) return [];\n        return arr.filter(r => !isMatchingStaffRow(r, name));\n      };\n\n      const newAppData: AppDataState = {\n        ...appData,\n        nv_tgdd: activeStore === 'TGDD' ? filterRows(appData.nv_tgdd || []) : appData.nv_tgdd,\n        nv_tz: activeStore === 'TOPZONE' ? filterRows(appData.nv_tz || []) : appData.nv_tz,\n        dt_nv_luyke: filterRows(appData.dt_nv_luyke || []),\n        dt_nv_realtime: filterRows(appData.dt_nv_realtime || []),\n      };\n\n      onUpdateAppData(newAppData);\n    }\n\n    showToast(`Đã xóa ${name} và đồng bộ toàn bộ data thành công!`);\n  };\n\n  const handleSyncAllData = () => {\n    if (!appData || !onUpdateAppData) return;\n\n    const tgddNames = new Set(Object.keys(personnelConfig['TGDD'] || {}).map(n => n.toLowerCase().trim()));\n    const tzNames = new Set(Object.keys(personnelConfig['TOPZONE'] || {}).map(n => n.toLowerCase().trim()));\n\n    const isMatchSet = (r: any, nameSet: Set<string>) => {\n      const fields = [\n        r['ĐƠN VỊ / NHÂN VIÊN'],\n        r['TÊN NHÂN VIÊN'],\n        r['Nhân viên'],\n        r['Họ và tên'],\n      ];\n      return fields.some(f => {\n        if (!f) return false;\n        const str = String(f).toLowerCase().trim();\n        return [...nameSet].some(n => str.includes(n) || n.includes(str));\n      });\n    };\n\n    const newAppData: AppDataState = {\n      ...appData,\n      nv_tgdd: (appData.nv_tgdd || []).filter(r => isMatchSet(r, tgddNames)),\n      nv_tz: (appData.nv_tz || []).filter(r => isMatchSet(r, tzNames)),\n      dt_nv_luyke: (appData.dt_nv_luyke || []).filter(r => isMatchSet(r, tgddNames) || isMatchSet(r, tzNames)),\n      dt_nv_realtime: (appData.dt_nv_realtime || []).filter(r => isMatchSet(r, tgddNames) || isMatchSet(r, tzNames)),\n    };\n\n    onUpdateAppData(newAppData);\n    handleDivideEqually();\n    showToast('Đã đồng bộ toàn bộ dữ liệu nhân sự thành công!');\n  };\n\n  const handleShowAll = () => {\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    Object.keys(next[activeStore]).forEach(name => {\n      next[activeStore][name].isVisible = true;\n    });\n    onUpdateConfig(next);\n    showToast(`Đã hiện tất cả nhân viên siêu thị ${activeStore === 'TGDD' ? 'TGDĐ' : 'TopZone'}`);\n  };\n\n  const handleDivideEqually = (totalPct: number = getStretchGoalPct()) => {\n    const officials = staffList.filter(s => s.isOfficial && s.isVisible);\n    if (officials.length === 0) {\n      showToast('Chưa có nhân sự nội bộ đang hiển thị để chia target!',);\n      setIsDivideMenuOpen(false);\n      return;\n    }\n\n    const safeTotal = Math.max(100, Math.min(150, Number(totalPct) || 100));\n    const roundedTotal = Math.round(safeTotal * 10) / 10;\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n\n    const base = Math.floor((roundedTotal / officials.length) * 10) / 10;\n    officials.forEach((staff, index) => {\n      const pct = index === officials.length - 1\n        ? Math.round((roundedTotal - base * (officials.length - 1)) * 10) / 10\n        : base;\n      next[activeStore][staff.name].targetPct = pct;\n    });\n\n    Object.keys(next[activeStore]).forEach(name => {\n      const isOff = next[activeStore][name].isOfficial === true;\n      const isVis = next[activeStore][name].isVisible !== false;\n      if (!isOff || !isVis) next[activeStore][name].targetPct = 0;\n    });\n\n    setPersonnelAllocationPct(activeStore, roundedTotal);\n    onUpdateConfig(next);\n    setIsDivideMenuOpen(false);\n    showToast(`Đã chia đều ${roundedTotal}% target siêu thị cho ${officials.length} nhân sự nội bộ • Ưu tiên Chia Đều`);\n  };\n\n  const handleAddStaff = () => {\n    if (!newStaffName.trim()) return;\n    const name = newStaffName.trim();\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    next[activeStore][name] = {\n      isOfficial: true,\n      isVisible: true,\n      targetPct: activeStore === 'TGDD' ? 37.5 : 25.0,\n    };\n    onUpdateConfig(next);\n    setNewStaffName('');\n    showToast(`Đã thêm nhân viên mới: ${name}`);\n  };\n\n  const officialVisibleStaff = staffList.filter(s => s.isOfficial && s.isVisible);\n  const officialVisibleCount = officialVisibleStaff.length;\n  const totalTargetPct = officialVisibleCount > 0\n    ? officialVisibleStaff.reduce((sum, staff) => sum + (Number(staff.targetPct) || 0), 0)\n    : 0;\n\n  return (\n    <div className=\"space-y-6\">\n      {toastMsg && (\n        <div className=\"fixed top-5 right-5 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-bold flex items-center gap-2 border border-slate-700 animate-in fade-in\">\n          <CheckCircle2 className=\"w-4 h-4 text-emerald-400\" />\n          <span>{toastMsg}</span>\n        </div>\n      )}\n\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div>\n          <h3 className=\"font-black text-slate-900 text-lg uppercase tracking-tight flex items-center gap-2\">\n            <Settings className=\"w-5 h-5 text-indigo-600\" />\n            <span>THIẾT LẬP NHÂN SỰ & CHỈ TIÊU KPI GIAO VIỆC</span>\n          </h3>\n          <p className=\"text-xs text-slate-500 font-medium\">\n            Quản lý danh sách nhân sự chính thức, tỷ lệ phân bổ KPI theo siêu thị và ẩn/hiện nhân viên\n          </p>\n        </div>\n\n        <div className=\"flex items-center gap-3\">\n          <div className=\"flex rounded-xl bg-slate-100 p-1 text-xs font-bold shadow-inner\">\n            <button\n              onClick={() => setActiveStore('TGDD')}\n              className={`px-4 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                activeStore === 'TGDD' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              TGD NHT (Shop 933)\n            </button>\n            <button\n              onClick={() => setActiveStore('TOPZONE')}\n              className={`px-4 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                activeStore === 'TOPZONE' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              AAR NHT (Shop 10341)\n            </button>\n          </div>\n\n          <button\n            onClick={onResetDefault}\n            className=\"px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold flex items-center gap-1.5 transition cursor-pointer\"\n            title=\"Khôi phục danh sách nhân sự mặc định ban đầu\"\n          >\n            <RotateCcw className=\"w-3.5 h-3.5\" />\n            <span>Mặc định</span>\n          </button>\n        </div>\n      </div>\n\n      <div className=\"bg-indigo-50/80 border border-indigo-200 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3\">\n        <div className=\"flex items-center space-x-3\">\n          <ShieldCheck className=\"w-6 h-6 text-indigo-600 flex-shrink-0\" />\n          <div>\n            <h4 className=\"font-extrabold text-indigo-950 text-xs uppercase\">\n              TỔNG TARGET NHÂN SỰ: {totalTargetPct.toFixed(1)}% TARGET SIÊU THỊ\n            </h4>\n            <p className=\"text-[11px] text-indigo-700\">\n              {officialVisibleCount > 0\n                ? `✓ Target nhân sự được chia theo tỷ lệ đã chọn và phân bổ đều cho ${officialVisibleCount} nhân sự chính thức.`\n                : '⚠️ Chưa có nhân sự chính thức để tính target.'}\n            </p>\n          </div>\n        </div>\n\n        <div className=\"flex flex-wrap items-center gap-2\">\n          <button\n            onClick={handleSyncAllData}\n            className=\"px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition cursor-pointer shadow-xs whitespace-nowrap flex items-center gap-1.5\"\n            title=\"Đồng bộ toàn bộ data hiện có theo cấu hình nhân sự\"\n          >\n            <RefreshCw className=\"w-3.5 h-3.5\" />\n            <span>Đồng Bộ Data</span>\n          </button>\n          <div className=\"relative\">\n            <button\n              type=\"button\"\n              onClick={() => setIsDivideMenuOpen(v => !v)}\n              className=\"px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition cursor-pointer shadow-xs whitespace-nowrap\"\n              title=\"Chia đều target siêu thị cho nhân sự nội bộ\"\n            >\n              ⚡ Chia Đều\n            </button>\n\n            {isDivideMenuOpen && (\n              <div className=\"absolute right-0 top-full mt-2 z-40 w-72 bg-white border border-indigo-200 rounded-2xl shadow-xl p-3\">\n                <div className=\"mb-2.5\">\n                  <div className=\"text-xs font-black text-slate-900\">CHIA ĐỀU TARGET SIÊU THỊ</div>\n                  <div className=\"text-[10px] text-slate-500 mt-0.5\">Chọn tổng tỷ lệ target siêu thị để chia đều cho nhân sự chính thức.</div>\n                </div>\n                <div className=\"grid grid-cols-3 gap-2\">\n                  {[100, 110, 120, 130, 140, 150].map((pct) => (\n                    <button\n                      key={pct}\n                      type=\"button\"\n                      onClick={() => handleDivideEqually(pct)}\n                      className={`px-2 py-2 rounded-xl text-xs font-black border transition cursor-pointer ${\n                        Math.abs(totalTargetPct - pct) < 0.5\n                          ? 'bg-indigo-600 text-white border-indigo-600'\n                          : 'bg-indigo-50 text-indigo-700 border-indigo-100 hover:bg-indigo-100'\n                      }`}\n                    >\n                      {pct}%\n                    </button>\n                  ))}\n                </div>\n                <div className=\"mt-2.5 pt-2 border-t border-slate-100 text-[10px] text-slate-500\">\n                  Tỷ lệ được chia đều theo số nhân sự chính thức đang hiển thị. Ví dụ 4 người: 100% → 25%/người; 150% → 37,5%/người.\n                </div>\n              </div>\n            )}\n          </div>\n          <button\n            onClick={handleShowAll}\n            className=\"px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition cursor-pointer shadow-xs whitespace-nowrap flex items-center gap-1\"\n          >\n            <Eye className=\"w-3.5 h-3.5\" />\n            <span>Hiện Tất Cả</span>\n          </button>\n        </div>\n      </div>\n\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-4 shadow-xs flex flex-wrap items-center gap-3\">\n        <span className=\"text-xs font-extrabold text-slate-800 uppercase flex items-center gap-1.5\">\n          <Plus className=\"w-4 h-4 text-blue-600\" />\n          <span>Thêm Nhân Viên Mới:</span>\n        </span>\n        <input\n          type=\"text\"\n          value={newStaffName}\n          onChange={(e) => setNewStaffName(e.target.value)}\n          placeholder=\"Nhập họ và tên nhân viên...\"\n          className=\"text-xs px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none w-56 font-semibold\"\n          onKeyDown={(e) => {\n            if (e.key === 'Enter') handleAddStaff();\n          }}\n        />\n        <button\n          onClick={handleAddStaff}\n          className=\"px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition cursor-pointer shadow-xs\"\n        >\n          + Thêm vào danh sách\n        </button>\n      </div>\n\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3\">\n        <div className=\"flex items-center justify-between\">\n          <h4 className=\"font-extrabold text-slate-900 text-xs uppercase\">\n            Danh Sách Nhân Sự {activeStore === 'TGDD' ? 'TGD NHT' : 'AAR NHT (TopZone)'} ({staffList.length} người)\n          </h4>\n          <span className=\"text-[11px] text-slate-500 font-medium\">\n            Bấm nút 👁️ để Ẩn/Hiện nhân viên | Bấm nút Trạng thái để đổi Nội bộ / Hỗ trợ | Tổng KPI có thể chia đều từ 100% đến 150% | Chia Đều sẽ được ưu tiên\n          </span>\n        </div>\n\n        <div className=\"overflow-x-auto custom-scroll\">\n          <SortableTable className=\"w-full text-left text-xs border-collapse\">\n            <thead className=\"bg-slate-900 text-white font-bold text-[11px]\">\n              <tr>\n                <th className=\"py-2.5 px-3 text-center w-12\">#</th>\n                <th className=\"py-2.5 px-4\">HỌ VÀ TÊN</th>\n                <th className=\"py-2.5 px-4 text-center\">LOẠI NHÂN SỰ</th>\n                <th className=\"py-2.5 px-4 text-center\">ẨN / HIỆN</th>\n                <th className=\"py-2.5 px-4 text-center\">TỶ TRỌNG KPI</th>\n                <th className=\"py-2.5 px-3 text-center w-16\">XÓA</th>\n              </tr>\n            </thead>\n            <tbody className=\"divide-y divide-slate-100 font-semibold text-slate-700\">\n              {staffList.map((staff, idx) => (\n                <tr\n                  key={idx}\n                  className={`hover:bg-slate-50 transition border-b border-slate-100 ${\n                    !staff.isVisible ? 'bg-rose-50/20 opacity-70' : ''\n                  }`}\n                >\n                  <td className=\"py-3 px-3 text-center text-slate-400\">{idx + 1}</td>\n                  <td className=\"py-3 px-4 font-bold text-slate-900\">\n                    <span className={staff.isVisible ? '' : 'line-through text-slate-400'}>\n                      {staff.name}\n                    </span>\n                    {!staff.isVisible && (\n                      <span className=\"ml-2 text-[10px] font-bold text-rose-500 bg-rose-50 px-1.5 py-0.5 rounded\">\n                        Đang ẩn\n                      </span>\n                    )}\n                  </td>\n                  <td className=\"py-3 px-4 text-center\">\n                    <button\n                      type=\"button\"\n                      onClick={() => handleToggleOfficial(staff.name)}\n                      className={`px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer transition shadow-2xs ${\n                        staff.isOfficial\n                          ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200'\n                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200'\n                      }`}\n                    >\n                      {staff.isOfficial ? '✓ Nội bộ (KPI)' : 'Hỗ trợ'}\n                    </button>\n                  </td>\n                  <td className=\"py-3 px-4 text-center\">\n                    <button\n                      type=\"button\"\n                      onClick={() => handleToggleVisible(staff.name)}\n                      className={`px-3 py-1.5 rounded-xl text-xs font-extrabold cursor-pointer transition shadow-2xs flex items-center gap-1.5 mx-auto ${\n                        staff.isVisible\n                          ? 'bg-emerald-50 border border-emerald-200 text-emerald-700 hover:bg-emerald-100'\n                          : 'bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100'\n                      }`}\n                    >\n                      {staff.isVisible ? (\n                        <>\n                          <Eye className=\"w-3.5 h-3.5\" />\n                          <span>Đang hiện</span>\n                        </>\n                      ) : (\n                        <>\n                          <EyeOff className=\"w-3.5 h-3.5\" />\n                          <span>Đã ẩn</span>\n                        </>\n                      )}\n                    </button>\n                  </td>\n                  <td className=\"py-3 px-4 text-center\">\n                    <div className=\"flex items-center justify-center gap-2\">\n                      <input\n                        type=\"number\"\n                        min=\"0\"\n                        max=\"150\"\n                        step=\"0.1\"\n                        disabled={!staff.isOfficial}\n                        value={staff.targetPct}\n                        onChange={(e) => handleChangeTarget(staff.name, parseFloat(e.target.value) || 0)}\n                        className=\"w-20 text-center text-xs font-bold border border-slate-200 rounded-lg py-1 px-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500 disabled:opacity-40\"\n                      />\n                      <span className=\"font-bold text-slate-500\">%</span>\n                    </div>\n                  </td>\n                  <td className=\"py-3 px-3 text-center\">\n                    <button\n                      type=\"button\"\n                      onClick={() => handleDeleteStaff(staff.name)}\n                      className=\"p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition cursor-pointer\"\n                      title={`Xóa nhân viên ${staff.name}`}\n                    >\n                      <Trash2 className=\"w-4 h-4\" />\n                    </button>\n                  </td>\n                </tr>\n              ))}\n            </tbody>\n          </SortableTable>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/views/SucKhoeCumView.tsx":"import { SortableTable } from '../components/SortableTable';\nimport React, { useMemo, useState, useRef, useEffect } from 'react';\nimport { Search, AlertTriangle, CheckCircle2, Activity, Store, Zap, ArrowUpDown, Filter, TrendingUp, Eye, EyeOff } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatPercent, formatProgramName } from '../utils/formatters';\nimport { useStretchGoalPct } from '../utils/stretchGoal';\nimport { getReportPeriodContext } from '../utils/reportPeriod';\n\ninterface SucKhoeCumViewProps {\n  appData: AppDataState;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n}\n\ntype SortMode = 'priority' | 'cumAsc' | 'cumDesc' | 'gapDesc' | 'remainingDesc' | 'name';\ntype AlertKind = 'pace' | 'revenueGap' | 'weakerShop' | 'bothWeak' | 'oneWeak' | 'highGap';\ntype ClusterAlert = { kind: AlertKind; text: string };\n\ntype FilterMode = 'all' | 'actionable' | 'watch' | 'bothWeak' | 'oneWeak' | 'under100' | 'doneBoth';\n\nconst num = (value: any) => {\n  const n = parseFloat(String(value ?? ''));\n  return Number.isFinite(n) ? n : 0;\n};\n\nconst normalize = (value: any) => String(value ?? '')\n  .toLowerCase()\n  .normalize('NFD')\n  .replace(/[\\u0300-\\u036f]/g, '')\n  .replace(/đ/g, 'd')\n  .replace(/[^a-z0-9]+/g, ' ')\n  .trim();\n\nconst sameProgram = (a: any, b: any) => {\n  const codeA = normalize(a?.['MÃ CHƯƠNG TRÌNH']);\n  const codeB = normalize(b?.['MÃ CHƯƠNG TRÌNH']);\n  if (codeA && codeB && codeA === codeB) return true;\n  const nameA = normalize(a?.['CHƯƠNG TRÌNH']);\n  const nameB = normalize(b?.['CHƯƠNG TRÌNH']);\n  return !!nameA && !!nameB && nameA === nameB;\n};\n\nconst isStore = (row: any, code: '933' | '10341') => {\n  const rowCode = String(row?.['MÃ ĐƠN VỊ'] ?? '').trim();\n  const text = normalize(row?.['ĐƠN VỊ / NHÂN VIÊN'] || row?.['TÊN ĐƠN VỊ']);\n  return code === '933'\n    ? rowCode === '933' || text.includes('tgd')\n    : rowCode === '10341' || text.includes('aar') || text.includes('topzone');\n};\n\nconst competitionValue = (row: any) => {\n  const type = Number(row?.['LOẠI TĐ']) || 3;\n  if (type === 2 || type === 6) return num(row?.['SỐ LƯỢNG']);\n  const qd = num(row?.['DT QUY ĐỔI (TR)']);\n  return qd !== 0 ? qd : num(row?.['DOANH THU (TR)']);\n};\n\nconst pctTone = (pct: number) => pct >= 100\n  ? 'bg-emerald-100 text-emerald-800 border-emerald-200'\n  : pct >= 70\n  ? 'bg-amber-100 text-amber-800 border-amber-200'\n  : 'bg-rose-100 text-rose-800 border-rose-200';\n\nconst ClusterSection = ({ sectionId, label, header, className, children }: {\n  sectionId: string; label: string; header: React.ReactNode; className: string; children: React.ReactNode;\n}) => {\n  const storageKey = `skst_cluster_section_${sectionId}_visible_v1`;\n  const [expanded, setExpanded] = useState(() => {\n    try { return localStorage.getItem(storageKey) !== 'no'; } catch { return true; }\n  });\n  const toggle = () => {\n    const next = !expanded;\n    setExpanded(next);\n    try { localStorage.setItem(storageKey, next ? 'yes' : 'no'); } catch {}\n  };\n  return <section className={`${className} ${expanded ? '' : 'no-export'}`.trim()} data-export-hidden={expanded ? undefined : 'true'}>\n    <div className=\"flex items-start justify-between gap-3\">\n      <div className=\"min-w-0 flex-1\">{header}</div>\n      <button type=\"button\" onClick={toggle} aria-expanded={expanded}\n        aria-controls={`cluster-panel-${sectionId}`} aria-label={`${expanded ? 'Ẩn' : 'Hiện'} ${label}`}\n        title={`${expanded ? 'Ẩn' : 'Hiện'} ${label}`}\n        className=\"no-export shrink-0 inline-flex items-center gap-1.5 px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold text-blue-700 bg-slate-50 hover:bg-blue-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500\">\n        {expanded ? <EyeOff className=\"w-3.5 h-3.5\" /> : <Eye className=\"w-3.5 h-3.5\" />}\n        <span>{expanded ? 'Ẩn' : 'Hiện'}</span>\n      </button>\n    </div>\n    <div id={`cluster-panel-${sectionId}`} hidden={!expanded} style={expanded ? undefined : {display: 'none'}}>\n      {children}\n    </div>\n  </section>;\n};\n\nexport const SucKhoeCumView: React.FC<SucKhoeCumViewProps> = ({\n  appData,\n  onOpenProgramDetail,\n}) => {\n  const [stretchGoalPct] = useStretchGoalPct();\n  const [searchTerm, setSearchTerm] = useState('');\n  const [activeAlert, setActiveAlert] = useState<AlertKind | null>(null);\n  const alertDetailRef = useRef<HTMLDivElement>(null);\n  useEffect(() => {\n    if (activeAlert && alertDetailRef.current) {\n      alertDetailRef.current.focus({ preventScroll: true });\n      alertDetailRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n    }\n  }, [activeAlert]);\n\n  const [sortMode, setSortModeState] = useState<SortMode>(() => {\n    try { return (localStorage.getItem('skst_cluster_sort_v2') as SortMode) || op = hasOwn(lkRow, 'DT TRẢ GÓP (TR)') || hasOwn(lkRow, '% TRẢ GÓP');\n    const rtHasTragop = hasOwn(rtRow, 'DT TRẢ GÓP (TR)') || hasOwn(rtRow, '% TRẢ GÓP');\n    const hasInstallmentData = (lkExists || rtExists) && (!lkExists || lkHasTragop) && (!rtExists || rtHasTragop);\n    const lkTragop = lkHasTragop ? num(lkRow['DT TRẢ GÓP (TR)']) : 0;\n    const rtTragop = rtHasTragop ? num(rtRow['DT TRẢ GÓP (TR)']) : 0;\n    const tragop = hasInstallmentData ? lkTragop + rtTragop : null;\n    const lkDt = num(lkRow['DOANH THU (TR)']);\n    const rtDt = num(rtRow['DOANH THU (TR)']);\n    const lkTragopPctRaw = Number.parseFloat(String(lkRow['% TRẢ GÓP']));\n    const rtTragopPctRaw = Number.parseFloat(String(rtRow['% TRẢ GÓP']));\n    let tragopPct: number | null = null;\n    if (hasInstallmentData) {\n      let weighted = 0;\n      if (lkDt > 0) weighted += Number.isFinite(lkTragopPctRaw) ? lkTragopPctRaw * lkDt : lkTragop * 100;\n      if (rtDt > 0) weighted += Number.isFinite(rtTragopPctRaw) ? rtTragopPctRaw * rtDt : rtTragop * 100;\n      tragopPct = dt > 0 ? weighted / dt : 0;\n    }\n    const bill = num(lkRow['LƯỢT BILL (TẤT CẢ ST)']) + num(rtRow['LƯỢT BILL (TẤT CẢ ST)']);\n    const stretchTarget = target * stretchFactor;\n    const pctTarget = target > 0 ? chot / target * 100 : 0;\n    const pctStretch = stretchTarget > 0 ? chot / stretchTarget * 100 : 0;\n    const gapStretch = Math.max(0, stretchTarget - chot);\n    const needDaily = daysRemaining > 0 ? gapStretch / daysRemaining : 0;\n    const forecast = daysElapsedLk > 0 ? lkQd * daysInMonth / daysElapsedLk : chot;\n    return { code, label, target, lkQd, rtQd, chot, dt, tragop, tragopPct, hasInstallmentData, bill, stretchTarget, pctTarget, pctStretch, gapStretch, needDaily, forecast };\n  };\n\n  const tgd = storeStats('933', 'TGDĐ 933');\n  const topzone = storeStats('10341', 'TOPZONE 10341');\n  const cluster = {\n    target: tgd.target + topzone.target,\n    lkQd: tgd.lkQd + topzone.lkQd,\n    rtQd: tgd.rtQ ls === 3 ? 'bg-white shadow-xs text-blue-600 font-bold' : 'text-slate-600'\n                }`}\n              >\n                3\n              </button>\n              <button\n                onClick={() => setIsExpandAllPrograms(!isExpandAllPrograms)}\n                className={`ml-1 px-2.5 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                  isExpandAllPrograms ? 'bg-indigo-600 text-white shadow-xs' : 'bg-white text-slate-700 shadow-xs'\n                }`}\n                title=\"Bấm để xem toàn bộ môn thi đua; bấm lại để thu gọn và bật cuộn\"\n              >\n                {isExpandAllPrograms ? '📖 Thu gọn' : '📜 Xem đủ môn'}\n              </button>\n              <button\n                type=\"button\"\n                onClick={() => void handleExportAllEmployeeCards()}\n                disabled={isBulkExporting}\n                className={`ml-1 px-3 py-1.5 rounded-lg transition cursor-pointer font-black text-[11px] flex items-center gap-1.5 ${\n                  isBulkExporting ? 'bg-slate-200 text-slate-500 cursor-wait' : 'bg-blue-600 text-white hover:bg-blue-700 shadow-xs'\n                }`}\n                title=\"Xuất các thẻ nhân viên đang hiển thị theo định dạng đã chọn\"\n              >\n                <Camera className=\"w-3.5 h-3.5\" />\n                {isBulkExporting ? `Đang xuất ${bulkExportProgress}` : `Xuất tất cả ảnh (${aggregatedEmployees.length})`}\n              </button>\n              <select aria-label=\"Định dạng xuất tất cả ảnh\" value={bulkExportFormat} disabled={isBulkExporting}\n                onChange={e => setBulkExportFormat(e.target.value as 'PNG' | 'ZIP')}\n                className=\"no-export px-2 py-1.5 rounded-lg bg-white text-xs font-bold border border-slate-200\">\n                <option value=\"PNG\">Ảnh PNG trực tiếp</option>\n                <option value=\"ZIP\">Gói ZIP</option>\n              </select>\n            </div>\n          )}\n\n          {displayMode === 'CARDS' && ber-200';\n              } else if (idx === 1) {\n                medal = (\n                  <span className=\"w-8 h-8 rounded-full bg-slate-300 text-slate-800 font-black text-sm flex items-center justify-center shadow-xs\">\n                    🥈\n                  </span>\n                );\n                rowBg = 'bg-slate-50 border border-slate-200';\n              } else if (idx === 2) {\n                medal = (\n                  <span className=\"w-8 h-8 rounded-full bg-amber-200 text-amber-900 font-black text-sm flex items-center justify-center shadow-xs\">\n                    🥉\n                  </span>\n                );\n                rowBg = 'bg-amber-50/20 border border-amber-100';\n              }\n\n              return (\n                <div\n                  key={idx}\n                  className={`grid grid-cols-1 xl:grid-cols-[minmax(250px,1fr)_minmax(260px,1.15fr)_auto] items-center gap-x-6 gap-y-4 p-3.5 rounded-2xl ${rowBg} shadow-2xs hover:shadow-xs transition ${\n                    !emp.isVisible ? 'opacity-65 ring-1 ring-rose-200 bg-rose-50/20' : ''\n                  }`}\n                >\n                  <div className=\"flex items-center space-x-3.5\">\n                    {medal}\n                    <div>\n                      <div className=\"flex items-center gap-2\">\n                        <h4 className={`font-extrabold text-sm flex items-center gap-1.5 ${emp.isVisible ? 'text-slate-900' : 'line-through text-slate-400'}`}>\n                          <span>{emp.name}</span>\n                        </h4>\n                        <button\n                          type=\"button\"\n                          onClick={() => handleToggleEmployeeOfficial(emp.name, emp.store)}\n                          className={`px-2 py-0.5 text-[10px] rounded-lg font-bold transition cursor-pointer ${\n                            emp.isOfficial\n                              ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200'\n
