guyễn Hữu Thọ',\n} as const;\n\nexport const SHOP_CODES = {\n  TOPZONE: '10341',\n  TGDD: '933',\n} as const;\n\nfunction canonicalShopFromCode(code: string): string {\n  const c = String(code || '').trim().toUpperCase();\n  if (c === 'AAR_DNA_HCH' || c === '10341' || c.includes('AAR_DNA_HCH')) return MANAGED_SHOPS.TOPZONE;\n  if (c === 'TGD_DNA_HCH' || c === '933' || c.includes('TGD_DNA_HCH')) return MANAGED_SHOPS.TGDD;\n  return '';\n}\n\nfunction canonicalShopCode(value: string): string {\n  const c = String(value || '').trim().toUpperCase();\n  if (c === 'AAR_DNA_HCH' || c === '10341' || c.includes('AAR_DNA_HCH')) return SHOP_CODES.TOPZONE;\n  if (c === 'TGD_DNA_HCH' || c === '933' || c.includes('TGD_DNA_HCH')) return SHOP_CODES.TGDD;\n  return '';\n}\n\nexport interface ParseDiagnostics {\n  category: keyof AppDataState;\n  categoryName: string;\n  rowCount: number;\n  recognizedColumns: { field: string; mappedHeader: string; sampleVal?: string }[];\n  missingColumns: string[];\n  data: any[];\n  pageExtractedInfo?: {\n    headerFoundAtLine: number;\n    totalLinesScanned: number;\n    ignoredNoiseLines: number;\n    isFullPageExtracted: boolean;\n  };\n}\n\nexport interface SplitResult {\n  headers: string[];\n  rows: string[][];\n  pageExtractedInfo: {\n    headerFoundAtLine: number;\n    totalLinesScanned: number;\n    ignoredNoiseLines: number;\n    isFullPageExtracted: boolean;\n  };\n}\n\nexport interface MwgDetectionContext {\n  // Tổng DT QĐ của bản Lũy kế hiện đang có trong phiên.\n  // Khi có baseline này, bản paste có tổng nhỏ hơn sẽ được nhận diện là Realtime.\n  existingStoreLuyKeDtQd?: number;\n  existingEmployeeLuyKeDtQd?: number;\n}\n\nfunction sumParsedDtQd(rows: any[] | undefined): number {\n  return (rows || []).reduce((sum, row) => {\n    const value = Number(row?.['DOANH THU QĐ (TR)']);\n    return sum + (Number.isFinite(value) ? value : 0);\n  }, 0);\n}\n\n/**\n * Remove Vietnamese accents and lower-case for robust matching\n */\nexport function normalizeStr(str: string): string {\n  if (!str) return '';\n  return str\n    .toLowerCase()\n    .normalize('NFD')\n    .replace(/[\\u0300-\\u036f]/g, '')\n    .replace(/đ/g, 'd')\n    .replace(/[^a-z0-9\\s]/g, ' ')\n    .replace(/\\s+/g, ' ')\n    .trim();\n}\n\n/**\n * Flexible number parser handling Vietnamese formatting:\n * - \"1,991\" -> 1991\n * - \"75.7%\" -> 75.7\n * - \"+3.2%\" -> 3.2\n * - \"-4.6%\" -> -4.6\n * - \"12.54\" -> 12.54\n * - \"—\" or \"-\" -> fallback\n */\nexport function parseFlexibleNumber(val: any, fallback: number = 0): number {\n  if (val === null || val === undefined) return fallback;\n  if (typeof val === 'number') return isNaN(val) ? fallback : val;\n\n  let s = String(val).trim();\n  if (!s || s === '—' || s === '-' || s === 'null' || s === 'undefined' || s === '?') {\n    return fallback;\n  }\n\n  // Remove positive sign and trailing %\n  s = s.replace(/^\\+/, '').replace(/%$/, '').trim();\n\n  // If format is 1,991 or 2,631 or 11,384 (thousand comma, dot decimal or integer)\n  if (/^-?\\d{1,3}(,\\d{3})+(\\.\\d+)?$/.test(s)) {\n    s = s.replace(/,/g, '');\n  } else if (/^-?\\d{1,3}(\\.\\d{3})+(,\\d+)?$/.test(s)) {\n    // European/VN style with dot thousands: 1.991,50\n    s = s.replace(/\\./g, '').replace(',', '.');\n  } else if (s.includes(',') && !s.includes('.')) {\n    // If only one comma e.g. \"12,5\" -> \"12.5\"\n    if (/^-?\\d+,\\d{1,2}$/.test(s)) {\n      s = s.replace(',', '.');\n    } else {\n      s = s.replace(/,/g, '');\n    }\n  }\n\n  const num = parseFloat(s);\n  return isNaN(num) ? fallback : num;\n}\n\nconst TOPZONE_STAFF_SET = new Set([\n  '98486', '83089', '170266', '189769', '45500', '183180', '302196', '315664',\n  'Nguyễn Quỳnh Anh', 'Trần Minh Hải', 'Lê Thị Mỹ Linh', 'Tạ Đức Hiếu', 'Trần Thị Mỹ Trang', 'Đỗ Nhật Trinh'\n]);\n\nfunction isTopzoneStaff(idOrName: string): boolean {\n  if (!idOrName) return false;\n  const clean = String(idOrName).trim();\n  if (TOPZONE_STAFF_SET.has(clean)) return true;\n  for (const tz of TOPZONE_STAFF_SET) {\n    if (clean.includes(tz)) return true;\n  }\n  return false;\n}\n\nconst TGDD_STAFF_SET = new Set([\n  '204201', '269167', '29649', '259623',\n  'Lê Văn Nhân', 'Lê Thị Thanh Trâm', 'Nguyễn Thị Thy', 'Trần Thị Huyền Trang'\n]);\n\nfunction isTgddStaff(idOrName: string): boolean {\n  if (!idOrName) return false;\n  const clean = String(idOrName).trim();\n  if (TGDD_STAFF_SET.has(clean)) return true;\n  for (const tg of TGDD_STAFF_SET) {\n    if (clean.includes(tg)) return true;\n  }\n  return false;\n}\n\n\n/** Robust helpers for the 2026 MWG BI copy format. The BI page can be copied as\n * tab-separated text, line-separated cells, or markdown-like table text. */\nfunction cleanClipboardLine(line: string): string {\n  return line\n    .replace(/\\*\\*/g, '')\n    // Markdown exports may escape table characters as \\_ / \\|.\n    // Real Clipboard text usually has no escapes, so this is harmless there.\n    .replace(/\\\\([_|])/g, '$1')\n    .replace(/^\\s*\\|\\s?/, '')\n    .replace(/\\s?\\|\\s*$/, '')\n    .replace(/\\bsvg\\b/gi, '')\n    .trim();\n}\n\nfunction isNoiseLine(line: string): boolean {\n  const n = normalizeStr(line);\n  return !n || /^[-:| ]+$/.test(line) || n === 'tong' || n === 'tong cong' || n === 'total' ||\n    n.startsWith('don vi trieu dong') || n.startsWith('1 17 tong');\n}\n\nfunction numericCellsFromLine(line: string): string[] {\n  const cleaned = cleanClipboardLine(line);\n  let cells: string[] = [];\n  if (cleaned.includes('\\t')) cells = cleaned.split('\\t').map(x => x.trim());\n  else if (cleaned.includes('|')) cells = cleaned.split('|').map(x => x.trim());\n  else return [];\n  return cells.filter(x => x !== '');\n}\n\nfunction looksLikeNumericRow(line: string, min = 3): boolean {\n  const cells = numericCellsFromLine(line);\n  if (cells.length >= min) {\n    const numericish = cells.filter(c => /[0-9]/.test(c) || c === '-' || c === '—').length;\n    return numericish >= min;\n  }\n  return false;\n}\n\nfunction extractProgramAndHeader(line: string, realtime = false): { program: string; type: number } | null {\n  const cleaned = cleanClipboardLine(line);\n  // Do not slice using an index from normalizeStr(): accent removal changes offsets.\n  // The 2026 BI copy concatenates the program title directly with the header.\n  const re = realtime\n    ? /^(.*?)(DOANH\\s*THU\\s*\\(\\s*RT\\s*\\)|SỐ\\s*LƯỢNG\\s*\\(\\s*RT\\s*\\))\\s*TARGET\\s*%?\\s*HT\\s*NGÀY/i\n    : /^(.*?)(DOANH\\s*THU|SỐ\\s*LƯỢNG)\\s*TARGET\\s*%?\\s*HT\\s*THÁNG/i;\n  const m = cleaned.match(re);\n  if (!m) return null;\n  const program = (m[1] || '').replace(/[|\\t]+$/g, '').trim();\n  const marker = m[2] || '';\n  return { program: program || 'Chương trình', type: /SỐ\\s*LƯỢNG/i.test(marker) ? 2 : 3 };\n}\n\nfunction extractPersonRow(line: string): { id: string; name: string; cells: string[] } | null {\n  const cleaned = cleanClipboardLine(line);\n  const m = cleaned.match(/^(\\d{4,7}|online)\\s*[-_–]\\s*(.+?)(?:\\t|\\||$)/i);\n  if (!m) return null;\n  const id = m[1].trim();\n  const name = m[2].trim();\n  const cells = numericCellsFromLine(cleaned);\n  return { id, name, cells: cells.length > 1 ? cells.slice(1) : [] };\n}\n\nfunction extractStoreRow(line: string): { code: string; name: string; cells: string[] } | null {\n  const cleaned = cleanClipboardLine(line);\n  // Store-competition rows use codes such as TGD_DNA_HCH / AAR_DNA_HCH,\n  // unlike the numeric IDs used by the revenue report. Accept both formats.\n  const m = cleaned.match(/^([A-Za-z0-9]{2,20}(?:[_-][A-Za-z0-9]+)*)\\s*[-_–]\\s*(.+?)(?:\\t|\\||$)/);\n  if (!m) return null;\n  const code = m[1].trim();\n  const name = m[2].trim();\n  const cells = numericCellsFromLine(cleaned);\n  return { code, name, cells: cells.length > 1 ? cells.slice(1) : [] };\n}\n\nfunction findFollowingValueCells(lines: string[], index: number): string[] {\n  for (let j = index + 1; j < Math.min(lines.length, index + 3); j++) {\n    if (isNoiseLine(lines[j])) continue;\n    const cells = numericCellsFromLine(lines[j]);\n    if (cells.length >= 3 && cells.some(c => /[0-9]/.test(c))) return cells;\n  }\n  return [];\n}\n\n// =========================================================================\n// 1. DEDICATED MWG BI PARSERS (BUILT DIRECTLY FROM REAL MWG SAMPLES)\n// =========================================================================\n\n/**\n * 1. Doanh thu Siêu thị Lũy kế (dt_luyke)\n * Handles MWG BI summary copy:\n * DT thực / Target trọn kỳ / Tỉ trọng trả góp / Siêu thị table\n */\nexport function parseMwgStoreRevenueLk(rawText: string): ParseDiagnostics | null {\n  const lines = rawText.split(/\\r?\\n/).map(l => l.trim()).filter(Boolean);\n  if (lines.length === 0) return null;\n\n  // Check store markers\n  const hasStore = /si[eê]u\\s*th[iị]|c[uư]ả\\s*h[aà]ng|t[eê]n\\s*đ[oơ]n\\s*v[iị]/i.test(rawText) || /\\b\\d{3,5}\\s*[-_–]/.test(rawText);\n  const hasRevenue = /doanh thu/i.test(rawText) || /dt thuc/i.test(rawText);\n  if (!hasStore || !hasRevenue) return null;\n\n  // Days window (e.g. \"nhịp 8 ngày → 30 ngày\" or \"lũy kế tới hết ngày 08/09\")\n  let daysWindow = 0;\n  const daysMatch = rawText.match(/nh[iị]p\\s*(\\d+)\\s*ng[aà]y/i) ||\n                    rawText.match(/l[uũ]y\\s*k[eế]\\s*t[oớ]i\\s*h[eế]t\\s*ng[aà]y\\s*0?(\\d+)/i) ||\n                    rawText.match(/qu[yỹ]\\s*th[oò]i\\s*gian\\s*[:]?\\s*(\\d+)/i);\n  if (daysMatch && daysMatch[1]) {\n    daysWindow = parseInt(daysMatch[1], 10) || daysWindow;\n  }\n\n  // Installment ratio / total (e.g. \"DT trả góp 1,569 / 2,631\" or \"Tỉ trọng trả góp 59.6%\")\n  let installmentRatio = 0;\n  const ratioMatch = rawText.match(/t[iỉ]\\s*tr[oọ]ng\\s*tr[aả]\\s*g[oó]p\\s*[:]?\\s*([0-9.,]+)%/i);\n  const amountMatch = rawText.match(/dt\\s*tr[aả]\\s*g[oó]p\\s*[:]?\\s*([0-9.,]+)\\s*\\/\\s*([0-9.,]+)/i);\n\n  let totalTraGopAmount = 0;\n  let totalDtAmount = 0;\n  if (amountMatch) {\n    totalTraGopAmount = parseFlexibleNumber(amountMatch[1]);\n    totalDtAmount = parseFlexibleNumber(amountMatch[2]);\n    if (totalDtAmount > 0) installmentRatio = totalTraGopAmount / totalDtAmount;\n  } else if (ratioMatch) {\n    installmentRatio = parseFlexibleNumber(ratioMatch[1]) / 100;\n  }\n\n  const records: StoreRevenueRow[] = [];\n\n  for (let i = 0; i < lines.length; i++) {\n    const line = lines[i];\n    const storeMatch = line.match(/^(\\d{3,5})\\s*[-_–]\\s*([^\\n\\r]+)/);\n    if (!storeMatch || line.includes('Tổng') || line.includes('tong')) continue;\n\n    const code = storeMatch[1];\n    const fullName = (storeMatch[2] || '').split(/\\t|\\|/)[0].trim() || canonicalShopFromCode(code) || line.trim();\n\n    // Check tokens on same line or next line\n    let tokens: string[] = numericCellsFromLine(line).slice(1);\n    if (tokens.length < 4) {\n      tokens = findFollowingValueCells(lines, i);\n    }\n\n    if (tokens.length >= 4) {\n      // Expected tokens: [SL, DOANH THU, % TỈ TRỌNG, DOANH THU QĐ, TARGET, % HT TARGET, TB 3 THÁNG, % TT]\n      // Sample: 161\t1,991\t75.7%\t2,840\t8,929\t22.3%\t1,929\t+3.2%\n      const sl = Math.round(parseFlexibleNumber(tokens[0]));\n      const dtQd = parseFlexibleNumber(tokens[1]);\n      const tiTrong = parseFlexibleNumber(tokens[2]);\n      const dt = tokens.length > 3 ? parseFlexibleNumber(tokens[3]) : 0;\n      const target = tokens.length > 4 ? parseFlexibleNumber(tokens[4]) : 0;\n      const htTarget = tokens.length > 5 ? parseFlexibleNumber(tokens[5]) : (target > 0 ? (dt / target) * 100 : 0);\n      const tb3 = tokens.length > 6 ? parseFlexibleNumber(tokens[6]) : 0;\n      const tt = tokens.length > 7 ? parseFlexibleNumber(tokens[7]) : 0;\n\n      // DT trả góp lấy đúng cột DT TRẢ GÓP từ data mới; không dùng số mẫu/fallback.\n      const dtTraGop = tokens.length > 8 ? parseFlexibleNumber(tokens[8]) : 0;\n\n      const targetQd = target; // BI's TARGET column is the monthly target used for both DT thực and DT QĐ progress.\n\n      records.push({\n        'MÃ ĐƠN VỊ TRỌNG | DT | TARGET | % HT TARGET | TB 3 THÁNG | % TT | DT TRẢ GÓP | % TRẢ GÓP\n      const sl = Math.round(parseFlexibleNumber(tokens[0]));\n      const dtQd = parseFlexibleNumber(tokens[1]);\n      const tiTrong = parseFlexibleNumber(tokens[2]);\n      const dt = tokens.length > 3 ? parseFlexibleNumber(tokens[3]) : 0;\n      const target = tokens.length > 4 ? parseFlexibleNumber(tokens[4], 0) : 0;\n      const htTarget = tokens.length > 5 ? parseFlexibleNumber(tokens[5], 0) : 0;\n      const tb3 = tokens.length > 6 ? parseFlexibleNumber(tokens[6], 0) : 0;\n      const hasCurrentInstallmentColumns = tokens.length >= 10;\n      const idxTraGop = hasCurrentInstallmentColumns ? 8 : -1;\n      const idxPctTraGop = hasCurrentInstallmentColumns ? 9 : -1;\n      const dtTraGop = idxTraGop >= 0 ? parseFlexibleNumber(tokens[idxTraGop], 0) : 0;\n      const pctTraGop = idxPctTraGop >= 0 ? parseFlexibleNumber(tokens[idxPctTraGop], 0) : 0;\n\n      const shop = isTopzoneStaff(staffId) || isTopzoneStaff(staffName) ? 'TopZone' : 'TGDĐ';\n\n      records.push({\n        'MÃ NHÂN VIÊN': staffId,\n        'TÊN NHÂN VIÊN': staffName,\n        'SIÊU THỊ': shop,\n        'DOANH THU (TR)': dt,\n        'DOANH THU QĐ (TR)': dtQd,\n        'DT TRẢ GÓP (TR)': dtTraGop,\n        '% TRẢ GÓP': pctTraGop,\n        'SỐ LƯỢNG': sl,\n        '% TỈ TRỌNG': tiTrong,\n        'TARGET (TR)': target,\n        '% HT TARGET': htTarget,\n        'TB 3 THÁNG (TR)': tb3,\n        'SỐ NGÀY CỬA SỔ': 1,\n      });\n    }\n  }\n\n  if (records.length === 0) return null;\n\n  return {\n    category: 'dt_nv_realtime',\n    categoryName: CATEGORY_LABELS['dt_nv_realtime'],\n    rowCount: records.length,\n    recognizedColumns: [\n      { field: 'MÃ NHÂN VIÊN', mappedHeader: 'Mã NV' },\n      { field: 'TÊN NHÂN VIÊN', mappedHeader: 'Tên nhân viên' },\n      { field: 'SIÊU THỊ', mappedHeader: 'Siêu thị' },\n      { field: 'SỐ LƯỢNG', mappedHeader: 'Số lượng' },\n      { field: 'DOANH THU (TR)', mappedHeader: 'Doanh thu RT' },\n      { field: 'DOANH THU QĐ (TR)', mappedHeader: 'Doanh thu QĐ' },\n      { field: '% TỈ TRỌNG', mappedHeader: '% Tỉ trọng' },\n      { field: 'DT TRẢ GÓP (TR)', mappedHeader: 'DT trả góp' },\n      { field: '% TRẢ GÓP', mappedHeader: '% trả góp' },\n    ],\n    missingColumns: [],\n    data: records,\n    pageExtractedInfo: {\n      headerFoundAtLine: 0,\n      totalLinesScanned: lines.length,\n      ignoredNoiseLines: Math.max(0, lines.length - records.length * 2),\n      isFullPageExtracted: true,\n    },\n  };\n}\n\n/**\n * Master MWG BI Auto-Detector and Parser\n */\nexport function tryParseMwgBiFormat(\n  rawText: string,\n  targetCategory?: keyof AppDataState | null,\n  context?: MwgDetectionContext\n): ParseDiagnostics | null {\n  // Explicit destination is always authoritative.\n  if (targetCategory === 'dt_luyke') return parseMwgStoreRevenueLk(rawText);\n  if (targetCategory === 'dt_realtime') return parseMwgStoreRevenueRt(rawText);\n  if (targetCategory === 'td_luyke') return parseMwgStoreCompetitionLk(rawText);\n  if (targetCategory === 'td_realtime') return parseMwgStoreCompetitionRt(rawText);\n  if (targetCategory === 'nv_tgdd' || targetCategory === 'nv_tz') return parseMwgEmployeeCompetition(rawText, targetCategory);\n  if (targetCategory === 'dt_nv_luyke') return parseMwgEmployeeRevenueLk(rawText);\n  if (targetCategory === 'dt_nv_realtime') return parseMwgEmployeeRevenueRt(rawText);\n\n  const text = String(rawText || '');\n  const norm = normalizeStr(text);\n  const hasEmployeeHeader = /nhan\\s*vien|ma\\s*nv/i.test(norm);\n  const hasStoreRows = /(?:^|\\n|\\|)\\s*\\d{3,5}\\s*[-_–]\\s*/i.test(text);\n\n  // Thi đua: nhận diện trước doanh thu vì header/ranking là chữ ký riêng.\n  // QUAN TRỌNG: không được dùng `(CTY)` làm dấu hiệu duy nhất để phân biệt\n  // TopZone/TGDĐ. Một số phiên bản BI có thể thay đổi cột/hình thức copy.\n  // Ưu tiên nhận diện theo MÃ NV / TÊN NV đã biết của từng shop; chỉ khi\n  // không đủ tín hiệu mới dùng `(CTY)` làm fallback.\n  if (/hang trong st/i.test(norm) || /bo phan/i.test(norm)) {\n    const lines = text.split(/\\r?\\n/).map(cleanClipboardLine).filter(Boolean);\n    let tzHits = 0;\n    let tgddHits = 0;\n\n    for (const line of lines) {\n      const person = extractPersonRow(line);\n      if (!person) continue;\n      if (isTopzoneStaff(person.id) || isTopzoneStaff(person.name)) tzHits++;\n      if (isTgddStaff(person.id) || isTgddStaff(person.name)) tgddHits++;\n    }\n\n    // Nếu toàn bộ/đa số nhân sự thuộc một shop, đó là tín hiệu mạnh nhất.\n    if (tzHits > tgddHits && tzHits > 0) {\n      const result = parseMwgEmployeeCompetition(text, 'nv_tz');\n      if (result?.data.length) return result;\n    }\n    if (tgddHits > tzHits && tgddHits > 0) {\n      const result = parseMwgEmployeeCompetition(text, 'nv_tgdd');\n      if (result?.data.length) return result;\n    }\n\n    // Fallback cho dữ liệu không chứa mã/tên nằm trong danh sách nhận diện.\n    const hasCompanyRank = /\\(\\s*cty\\s*\\)/i.test(text);\n    const preferred = hasCompanyRank ? 'nv_tz' : 'nv_tgdd';\n    const first = parseMwgEmployeeCompetition(text, preferred);\n    if (first?.data.length) return first;\n    const second = parseMwgEmployeeCompetition(text, preferred === 'nv_tz' ? 'nv_tgdd' : 'nv_tz');\n    if (second?.data.length) return second;\n  }\n\n  if (/%\\s*ht\\s*ng[aà]y|doanh\\s*thu\\s*\\(\\s*rt\\s*\\)|s[oố]\\s*l[uư][oợ]ng\\s*\\(\\s*rt\\s*\\)/i.test(text)) {\n    const compRt = parseMwgStoreCompetitionRt(text);\n    if (compRt?.data.length) return compRt;\n  }\n  if (/%\\s*ht\\s*th[aá]ng/i.test(text) && /top\\s*\\/\\s*bottom\\s*v[uù]ng/i.test(text)) {\n    const compLk = parseMwgStoreCompetitionLk(text);\n    if (compLk?.data.length) return compLk;\n  }\n\n  // ================================================================\n  // 1) DOANH THU NHÂN VIÊN\n  // Quy tắc chính theo yêu cầu: nếu đã có bản Lũy kế trong phiên,\n  // tổng DT QĐ của bản paste nhỏ hơn baseline => Realtime; ngược lại => Lũy kế.\n  // Không dùng chữ \"Realtime/Cập nhật/Lũy kế\" trong menu toàn trang để quyết định.\n  // ================================================================\n  if (hasEmployeeHeader) {\n    const empLk = parseMwgEmployeeRevenueLk(text);\n    const empRt = parseMwgEmployeeRevenueRt(text);\n    const incomingLkTotal = sumParsedDtQd(empLk?.data);\n    const incomingRtTotal = sumParsedDtQd(empRt?.data);\n    const baseline = Number(context?.existingEmployeeLuyKeDtQd || 0);\n\n    if (baseline > 0) {\n      // Parse both candidates, then let the total DT QĐ decide.\n      if (incomingRtTotal > 0 && incomingRtTotal < baseline && empRt?.data.length) return empRt;\n      if (incomingLkTotal >= baseline && empLk?.data.length) return empLk;\n      // Realtime can legitimately be 0; a valid RT table with total 0 is\n      // still smaller than a positive Lũy kế baseline.\n      if (empRt?.data.length && incomingRtTotal < baseline) return empRt;\n    }\n\n    // Không có baseline (ví dụ người dùng paste Realtime trước): dùng dấu hiệu\n    // nằm trong CHÍNH bảng, không dùng chữ Realtime ở menu.\n    const employeeRtTableMarker = /%\\s*ht\\s*target\\s*\\(\\s*lk\\s*\\)/i.test(text) ||\n      /doanh\\s*thu\\s*\\(\\s*rt\\s*\\)/i.test(text) ||\n      /s[oố]\\s*l[uư][oợ]ng\\s*\\(\\s*rt\\s*\\)/i.test(text);\n    if (employeeRtTableMarker && empRt?.data.length) return empRt;\n    if (empLk?.data.length) return empLk;\n    if (empRt?.data.length) return empRt;\n  }\n\n  // ================================================================\n  // 2) DOANH THU SIÊU THỊ\n  // Dùng đúng cùng nguyên tắc baseline: tổng DT QĐ paste nhỏ hơn Lũy kế\n  // hiện có => Realtime. Đây là tín hiệu mạnh hơn các chữ ở phần menu/KPI.\n  // ================================================================\n  if (hasStoreRows) {\n    const storeLk = parseMwgStoreRevenueLk(text);\n    const storeRt = parseMwgStoreRevenueRt(text);\n    const incomingLkTotal = sumParsedDtQd(storeLk?.data);\n    const incomingRtTotal = sumParsedDtQd(storeRt?.data);\n    const baseline = Number(context?.existingStoreLuyKeDtQd || 0);\n\n    if (baseline > 0) {\n      if (incomingRtTotal > 0 && incomingRtTotal < baseline && storeRt?.data.length) return storeRt;\n      if (incomingLkTotal >= baseline && storeLk?.data.length) return storeLk;\n      if (storeRt?.data.length && incomingRtTotal < baseline) return storeRt;\n    }\n\n    // Không có baseline: chỉ dùng marker thực sự thuộc bảng RT.\n    const storeRtTableMarker = /doanh\\s*thu\\s*\\(\\s*rt\\s*\\)/i.test(text) ||\n      /%\\s*ht\\s*target\\s*\\(\\s*lk\\s*\\)/i.test(text) ||\n      /s[oố]\\s*l[uư][oợ]ng\\s*\\(\\s*rt\\s*\\)/i.test(text);\n    if (storeRtTableMarker && storeRt?.data.length) return storeRt;\n    if (storeLk?.data.length) return storeLk;\n    if (storeRt?.data.length) return storeRt;\n  }\n\n  return null;\n}\n\n/**\n * Employee competition is a set of small tables, one table per program.\n * 2026 BI changed the copied header to e.g. \"DOANH THU HẠNG TRONG ST\n * TOP/BOTTOM ST BỘ PHẬN\" and may concatenate the program title + headers.\n */\nexport function parseMwgEmployeeCompetition(\n  rawText: string,\n  category: 'nv_tgdd' | 'nv_tz'\n): ParseDiagnostics | null {\n  const lines = rawText.split(/\\r?\\n/).map(cleanClipboardLine).filter(Boolean);\n  const records: CompetitionRow[] = [];\n  let currentProgram = '';\n  let currentLoai = 3;\n  let sawHeader = false;\n\n  for (let i = 0; i < lines.length; i++) {\n    const line = lines[i];\n    const header = extractProgramAndHeader(line, false);\n    if (header && /h[aạ]ng trong st/i.test(normalizeStr(line))) {\n      currentProgram = header.program;\n      currentLoai = header.type;\n      sawHeader = true;\n      continue;\n    }\n\n    // 2026 BI concatenates the program title directly with the header.\n    const n = normalizeStr(line);\n    const employeeHeader = /h[ạa]ng trong st/i.test(n) && /top bottom/i.test(n)\n      ? extractProgramAndHeader(line, false)\n      : null;\n    if (employeeHeader) {\n      currentProgram = employeeHeader.program;\n      currentLoai = employeeHeader.type;\n      sawHeader = true;\n      continue;\n    }\n    // Employee-competition headers do not contain TARGET, so extractProgramAndHeader\n    // cannot recognize them; use the original-string marker as a safe fallback.\n    if ((n.includes('doanh thu') || n.includes('so luong')) && n.includes('hang trong st') && n.includes('top bottom')) {\n      const markerMatch = line.match(/(DOANH\\s*THU|SỐ\\s*LƯỢNG)/i);\n      if (markerMatch && markerMatch.index !== undefined) {\n        currentProgram = line.slice(0, markerMatch.index).trim() || currentProgram || 'Chương trình';\n        currentLoai = /SỐ\\s*LƯỢNG/i.test(markerMatch[1]) ? 2 : 3;\n        sawHeader = true;\n        continue;\n      }\n    }\n\n    if (!sawHeader || !currentProgram) continue;\n    if (/^tong$/i.test(n) || n.startsWith('tong ')) continue;\n\n    const person = extractPersonRow(line);\n    if (!person) continue;\n\n    let cells = person.cells;\n    if (cells.length < 2) cells = findFollowingValueCells(lines, i);\n    if (cells.length < 2) continue;\n\n    const thuc = parseFlexibleNumber(cells[0]);\n    let rank = 0;\n    let topBottom = '';\n    let companyRank: number | null = null;\n\n    // TopZone BI có thêm cột HẠNG CÔNG TY, ví dụ `2786 (CTY)`,\n    // nằm giữa doanh thu/số lượng và HẠNG TRONG ST.\n    // TGDĐ không có cột này, nên phải dò theo nhãn (CTY), không được cố định vị trí.\n    const companyIdx = cells.findIndex(c => /\\(\\s*cty\\s*\\)/i.test(c));\n    if (companyIdx !== -1) {\n      companyRank = parseFlexibleNumber(cells[companyIdx]);\n      if (cells[companyIdx + 1] != null) rank = parseFlexibleNumber(cells[companyIdx + 1]);\n      if (cells[companyIdx + 2] != null) topBottom = cells[companyIdx + 2].trim();\n    } else {\n      rank = cells.length > 1 ? parseFlexibleNumber(cells[1]) : 0;\n      topBottom = cells.length > 2 ? cells[2].trim() : '';\n    }\n\n    const managedShop = category === 'nv_tgdd' ? MANAGED_SHOPS.TGDD : MANAGED_SHOPS.TOPZONE;\n    const row: CompetitionRow = {\n      'MÃ NV': person.id,\n      'MÃ ĐƠN VỊ': category === 'nv_tgdd' ? SHOP_CODES.TGDD : SHOP_CODES.TOPZONE,\n      'TÊN ĐƠN VỊ': managedShop,\n      'ĐƠN VỊ / NHÂN VIÊN': `${person.id} - ${person.name}`,\n      'CHƯƠNG TRÌNH': currentProgram,\n      'LOẠI TĐ': currentLoai,\n      'DOANH THU (TR)': currentLoai === 3 ? thuc : 0,\n      'DT QUY ĐỔI (TR)': currentLoai === 3 ? thuc : 0,\n      'SỐ LƯỢNG': currentLoai === 2 ? Math.round(thuc) : 0,\n      'HẠNG TRONG ST': rank,\n      'TOP/BOTTOM ST': topBottom,\n    };\n    if (companyRank !== null) row['HẠNG CÔNG TY'] = companyRank;\n    records.push(row);\n  }\n\n  if (!records.length) return null;\n  return {\n    category,\n    categoryName: CATEGORY_LABELS[category],\n    rowCount: records.length,\n    recognizedColumns: [\n      { field: 'MÃ NV', mappedHeader: 'Mã nhân viên' },\n      { field: 'ĐƠN VỊ / NHÂN VIÊN', mappedHeader: 'Nhân viên' },\n      { field: 'CHƯƠNG TRÌNH', mappedHeader: 'Tên chương trình' },\n      { field: 'DOANH THU (TR)', mappedHeader: 'Doanh thu' },\n      { field: 'SỐ LƯỢNG', mappedHeader: 'Số lượng' },\n      { field: 'HẠNG TRONG ST', mappedHeader: 'Hạng trong ST' },\n      { field: 'TOP/BOTTOM ST', mappedHeader: 'Top/Bottom ST' },\n    ],\n    missingColumns: [],\n    data: records,\n    pageExtractedInfo: {\n      headerFoundAtLine: 0,\n      totalLinesScanned: lines.length,\n      ignoredNoiseLines: Math.max(0, lines.length - records.length),\n      isFullPageExtracted: true,\n    },\n  };\n}\n\n// =========================================================================\n// 2. GENERIC TABULAR GRID PARSER (FOR EXCEL / GOOGLE SHEETS COPIES)\n// =========================================================================\n\nexport function findColumnIndex(headers: string[], aliases: string[]): number {\n  const normHeaders = headers.map(h => normalizeStr(h));\n\n  for (const alias of aliases) {\n    const normAlias = normalizeStr(alias);\n    const idx = normHeaders.findIndex(h => h === normAlias || h.startsWith(normAlias));\n    if (idx !== -1) return idx;\n  }\n\n  for (const alias of aliases) {\n    const normAlias = normalizeStr(alias);\n    const idx = normHeaders.findIndex(h => h.includes(normAlias));\n    if (idx !== -1) return idx;\n  }\n\n  return -1;\n}\n\nexport function splitClipboardIntoGrid(\n  rawText: string,\n  preferredCategory?: keyof AppDataState | null\n): SplitResult {\n  const rawLines = rawText.split(/\\r?\\n/).filter(line => line.trim().length > 0);\n\n  if (rawLines.length === 0) {\n    return {\n      headers: [],\n      rows: [],\n      pageExtractedInfo: {\n        headerFoundAtLine: 0,\n        totalLinesScanned: 0,\n        ignoredNoiseLines: 0,\n        isFullPageExtracted: false,\n      },\n    };\n  }\n\n  // Check delimiter (Tab vs Semicolon vs Comma)\n  const tabCounts = rawLines.slice(0, 15).map(l => (l.match(/\\t/g) || []).length);\n  const avgTabs = tabCounts.reduce((a, b) => a + b, 0) / tabCounts.length;\n\n  let delimiter: string | RegExp = '\\t';\n  if (avgTabs < 1.5) {\n    const commaCounts = rawLines.slice(0, 15).map(l => (l.match(/,/g) || []).length);\n    const avgCommas = commaCounts.reduce((a, b) => a + b, 0) / commaCounts.length;\n    if (avgCommas >= 2) {\n      delimiter = ',';\n    }\n  }\n\n  const parsedLines = rawLines.map(line =>\n    line.split(delimiter).map(cell => cell.trim())\n  );\n\n  const commonHeaderKeywords = [\n    'ma', 'ten', 'sieu thi', 'don vi', 'target', 'doanh thu', 'quy doi',\n    'so luong', 'chuong trinh', 'nhan vien', 'tra gop', 'tb 3 thang'\n  ];\n\n  let bestHeaderIndex = -1;\n  let bestScore = -1;\n\n  for (let i = 0; i < parsedLines.length; i++) {\n    const row = parsedLines[i];\n    if (row.length < 2) continue;\n\n    const rowText = normalizeStr(row.join(' '));\n    let score = 0;\n\n    commonHeaderKeywords.forEach(kw => {\n      if (rowText.includes(kw)) score += 2;\n    });\n\n    if (row.length >= 4) score += row.length;\n\n    if (i + 1 < parsedLines.length) {\n      const nextRow = parsedLines[i + 1];\n      const nextRowStr = nextRow.join(' ');\n      if (/\\d+/.test(nextRowStr) && nextRow.length >= 2) {\n        score += 4;\n      }\n    }\n\n    if (score > bestScore && score >= 4) {\n      bestScore = score;\n      bestHeaderIndex = i;\n    }\n  }\n\n  if (bestHeaderIndex === -1) bestHeaderIndex = 0;\n\n  const rawHeaders = parsedLines[bestHeaderIndex] || [];\n  const rawDataLines = parsedLines.slice(bestHeaderIndex + 1);\n\n  const extractedRows: string[][] = [];\n  let ignoredNoiseLines = bestHeaderIndex;\n\n  for (let i = 0; i < rawDataLines.length; i++) {\n    const row = rawDataLines[i];\n    if (!row || row.length === 0) continue;\n\n    const rowStr = normalizeStr(row.join(' '));\n    if (\n      rowStr.startsWith('tong cong') ||\n      rowStr.startsWith('tong') ||\n      rowStr.startsWith('total')\n    ) {\n      ignoredNoiseLines++;\n      continue;\n    }\n\n    if (row.length >= 2 || (row.length === 1 && /\\d+/.test(row[0]))) {\n      extractedRows.push(row);\n    } else {\n      ignoredNoiseLines++;\n    }\n  }\n\n  return {\n    headers: rawHeaders,\n    rows: extractedRows,\n    pageExtractedInfo: {\n      headerFoundAtLine: bestHeaderIndex,\n      totalLinesScanned: rawLines.length,\n      ignoredNoiseLines,\n      isFullPageExtracted: bestHeaderIndex > 1,\n    },\n  };\n}\n\nexport function detectCategoryFromParsedData(\n  headers: string[],\n  rows: string[][]\n): keyof AppDataState | null {\n  const headerStr = normalizeStr(headers.join(' '));\n  const sampleText = normalizeStr(rows.slice(0, 5).map(r => r.join(' ')).join(' '));\n\n  const hasStaff = headerStr.includes('ma nv') || headerStr.includes('nhan vien') || headerStr.includes('nguoi ban');\n  const hasProgram = headerStr.includes('chuong trinh') || headerStr.includes('ma ct');\n  const hasStore = headerStr.includes('sieu thi') || headerStr.includes('ma don vi') || headerStr.includes('ma dv') ||\n    sampleText.includes('aar dna hch') || sampleText.includes('tgd dna hch');\n  const isRt = headerStr.includes('realtime') || headerStr.includes('hom nay') || sampleText.includes('realtime');\n\n  if (hasStaff && !hasProgram) {\n    return isRt ? 'dt_nv_realtime' : 'dt_nv_luyke';\n  }\n\n  if (hasProgram && !hasStaff) {\n    return isRt ? 'td_realtime' : 'td_luyke';\n  }\n\n  if (hasStore || headerStr.includes('tb 3 thang')) {\n    return isRt ? 'dt_realtime' : 'dt_luyke';\n  }\n\n  return null;\n}\n\nexport function mapGridToCategoryData(\n  category: keyof AppDataState,\n  headers: string[],\n  rows: string[][],\n  pageExtractedInfo?: SplitResult['pageExtractedInfo']\n): ParseDiagnostics {\n  const recognizedColumns: { field: string; mappedHeader: string; sampleVal?: string }[] = [];\n  const missingColumns: string[] = [];\n\n  const getIdx = (field: string, aliases: string[]): number => {\n    const idx = findColumnIndex(headers, aliases);\n    if (idx !== -1) {\n      recognizedColumns.push({\n        field,\n        mappedHeader: headers[idx],\n        sampleVal: rows[0] ? rows[0][idx] : undefined,\n      });\n    } else {\n      missingColumns.push(field);\n    }\n    return idx;\n  };\n\n  const getCell = (row: string[], idx: number, fallback: any = '') => {\n    if (idx === -1 || !row || idx >= row.length) return fallback;\n    const v = row[idx];\n    return v !== undefined && v !== null ? v : fallback;\n  };\n\n  let formattedData: any[] = [];\n\n  switch (category) {\n    case 'dt_luyke':\n    case 'dt_realtime': {\n      const idxMa = getIdx('MÃ ĐƠN VỊ', ['ma don vi', 'ma dv', 'ma st', 'ma sieu thi', 'st', 'store id', 'ma']);\n      const idxTen = getIdx('TÊN ĐƠN VỊ', ['ten don vi', 'ten dv', 'ten st', 'ten sieu thi', 'sieu thi', 'don vi', 'ten']);\n      const idxTarget = getIdx('TARGET (TR)', ['target tr', 'target dt', 'target', 'muc tieu tr', 'chi tieu tr']);\n      const idxTargetQd = getIdx('TARGET QĐ (TR)', ['target qd tr', 'target qd', 'target quy doi']);\n      const idxDt = getIdx('DOANH THU (TR)', ['doanh thu tr', 'doanh thu', 'dt tr', 'dt', 'thuc hien']);\n      const idxDtQd = getIdx('DOANH THU QĐ (TR)', ['doanh thu qd tr', 'doanh thu qd', 'dt qd tr', 'dt qd', 'quy doi']);\n      const idxTraGop = getIdx('DT TRẢ GÓP (TR)', ['dt tra gop tr', 'dt tra gop', 'tra gop']);\n      const idxPctTraGop = getIdx('% TRẢ GÓP', ['pct tra gop', 'ti le tra gop', 'ty le tra gop', 'phan tram tra gop']);\n      const idxBill = getIdx('LƯỢT BILL (TẤT CẢ ST)', ['luot bill tat ca st', 'luot bill', 'bill', 'so bill']);\n      const idxQty = getIdx('SỐ LƯỢNG', ['so luong', 'sl', 'qty']);\n      const idxTb3 = getIdx('TB 3 THÁNG (TR)', ['tb 3 thang tr', 'tb 3 thang', 'tb 3t', 'tb3t']);\n      const idxDays = getIdx('SỐ NGÀY CỬA SỔ', ['so ngay cua so', 'so ngay', 'cua so']);\n\n      formattedData = rows.map((row, rIdx) => {\n        let maDv = getCell(row, idxMa, '');\n        let tenDv = getCell(row, idxTen, '');\n\n        if (!maDv && tenDv) {\n          const m = String(tenDv).match(/^(\\d{3,5})\\b/);\n          if (m) maDv = m[1];\n        }\n\n        const dt = parseFlexibleNumber(getCell(row, idxDt, 0));\n        const dtQd = idxDtQd !== -1 ? parseFlexibleNumber(getCell(row, idxDtQd, 0)) : 0;\n        const target = parseFlexibleNumber(getCell(row, idxTarget, 0));\n\n        return {\n          'MÃ ĐƠN VỊ': String(maDv || (rIdx === 0 ? '933' : '10341')),\n          'TÊN ĐƠN VỊ': String(tenDv || `Siêu thị ${maDv}`),\n          'TARGET (TR)': target,\n          'TARGET QĐ (TR)': idxTargetQd !== -1 ? parseFlexibleNumber(getCell(row, idxTargetQd, 0)) : target,\n          'DOANH THU (TR)': dt,\n          'DOANH THU QĐ (TR)': dtQd,\n          'DT TRẢ GÓP (TR)': parseFlexibleNumber(getCell(row, idxTraGop, 0)),\n          '% TRẢ GÓP': idxPctTraGop !== -1 ? parseFlexibleNumber(getCell(row, idxPctTraGop, 0)) : 0,\n          'LƯỢT BILL (TẤT CẢ ST)': Math.round(parseFlexibleNumber(getCell(row, idxBill, 0))),\n          'SỐ LƯỢNG': Math.round(parseFlexibleNumber(getCell(row, idxQty, 0))),\n          'TB 3 THÁNG (TR)': parseFlexibleNumber(getCell(row, idxTb3, 0)),\n          'SỐ NGÀY CỬA SỔ': Math.round(parseFlexibleNumber(getCell(row, idxDays, category === 'dt_realtime' ? 1 : 8))),\n        };\n      });\n      break;\n    }\n\n    case 'td_luyke':\n    case 'td_realtime': {\n      const idxMaCt = getIdx('MÃ CHƯƠNG TRÌNH', ['ma chuong trinh', 'ma ct', 'ct id', 'ma']);\n      const idxTenCt = getIdx('CHƯƠNG TRÌNH', ['chuong trinh', 'ten chuong trinh', 'ten ct', 'mon']);\n      const idxTarget = getIdx('TARGET (TR/SL theo LOẠI TĐ)', ['target tr sl theo loai td', 'target tr sl', 'target', 'chi tieu']);\n      const idxDt = getIdx('DOANH THU (TR)', ['doanh thu tr', 'doanh thu', 'dt tr', 'dt']);\n      const idxDtQd = getIdx('DT QUY ĐỔI (TR)', ['dt quy doi tr', 'dt quy doi', 'dt qd tr', 'dtqd']);\n      const idxQty = getIdx('SỐ LƯỢNG', ['so luong', 'sl', 'qty']);\n      const idxLoai = getIdx('LOẠI TĐ', ['loai td', 'loai', 'type']);\n      const idxHt = getIdx('% HT THÁNG', ['ht thang', 'ti le ht', 'hoan thanh', 'ht']);\n      const idxDb = getIdx('% DỰ BÁO', ['du bao', 'db']);\n      const idxRank = getIdx('HẠNG VÙNG', ['hang vung', 'hang']);\n\n      formattedData = rows.map((row, rIdx) => {\n        const dt = parseFlexibleNumber(getCell(row, idxDt, 0));\n        const dtQd = idxDtQd !== -1 ? parseFlexibleNumber(getCell(row, idxDtQd, 0)) : 0;\n        const qty = Math.round(parseFlexibleNumber(getCell(row, idxQty, 0)));\n        const loai = Math.round(parseFlexibleNumber(getCell(row, idxLoai, dt > 0 ? 3 : 2)));\n        const target = parseFlexibleNumber(getCell(row, idxTarget, 0));\n        const htThang = idxHt !== -1 ? parseFlexibleNumber(getCell(row, idxHt, 0)) : (target > 0 ? (dt / target) * 100 : 0);\n\n        return {\n          'MÃ CHƯƠNG TRÌNH': String(getCell(row, idxMaCt, `CT${rIdx + 1}`)),\n          'CHƯƠNG TRÌNH': String(getCell(row, idxTenCt, `Chương trình ${rIdx + 1}`)),\n          'LOẠI TĐ': loai,\n          'TARGET (TR/SL theo LOẠI TĐ)': target,\n          'DOANH THU (TR)': dt,\n          'DT QUY ĐỔI (TR)': dtQd,\n          'SỐ LƯỢNG': qty,\n          '% HT THÁNG': htThang,\n          '% DỰ BÁO': parseFlexibleNumber(getCell(row, idxDb, htThang * 1.15)),\n          'HẠNG VÙNG': getCell(row, idxRank, ''),\n        };\n      });\n      break;\n    }\n\n    case 'dt_nv_luyke':\n    case 'dt_nv_realtime': {\n      const idxMaNv = getIdx('MÃ NHÂN VIÊN', ['ma nhan vien', 'ma nv', 'ma nhan su', 'ma so', 'user id', 'ma']);\n      const idxTenNv = getIdx('TÊN NHÂN VIÊN', ['ten nhan vien', 'ten nv', 'ho va ten', 'ho ten', 'nhan vien']);\n      const idxShop = getIdx('SIÊU THỊ', ['sieu thi', 'ten st', 'don vi', 'shop']);\n      const idxDt = getIdx('DOANH THU (TR)', ['doanh thu tr', 'doanh thu', 'dt']);\n      const idxDtQd = getIdx('DOANH THU QĐ (TR)', ['doanh thu qd tr', 'doanh thu quy doi', 'dt qd tr', 'dt qd', 'quy doi']);\n      const idxTraGop = getIdx('DT TRẢ GÓP (TR)', ['dt tra gop tr', 'dt tra gop', 'tra gop']);\n      const idxPctTraGop = getIdx('% TRẢ GÓP', ['pct tra gop', 'ti le tra gop', 'ty le tra gop', 'phan tram tra gop']);\n      const idxQty = getIdx('SỐ LƯỢNG', ['so luong', 'sl', 'qty']);\n\n      formattedData = rows.map((row, rIdx) => {\n        let maNv = getCell(row, idxMaNv, '');\n        let tenNv = getCell(row, idxTenNv, '');\n\n        if (!maNv && tenNv) {\n          const parenMatch = String(tenNv).match(/\\((\\d+)\\)/);\n          if (parenMatch) {\n            maNv = parenMatch[1];\n            tenNv = String(tenNv).replace(/\\(\\d+\\)/g, '').trim();\n          }\n        }\n        if (!maNv && row[0] && /^\\d{4,7}$/.test(String(row[0]).trim())) {\n          maNv = String(row[0]).trim();\n        }\n        if (!tenNv) {\n          tenNv = `Nhân viên ${maNv || rIdx + 1}`;\n        }\n\n        const dt = parseFlexibleNumber(getCell(row, idxDt, 0));\n        const dtQd = idxDtQd !== -1 ? parseFlexibleNumber(getCell(row, idxDtQd, 0)) : 0;\n\n        let shop = getCell(row, idxShop, '');\n        if (!shop) {\n          shop = isTopzoneStaff(maNv) || isTopzoneStaff(tenNv) ? 'TopZone' : 'TGDĐ';\n        }\n\n        return {\n          'MÃ NHÂN VIÊN': String(maNv || `NV${rIdx + 1}`).trim(),\n          'TÊN NHÂN VIÊN': String(tenNv).trim(),\n          'SIÊU THỊ': shop,\n          'DOANH THU (TR)': dt,\n          'DOANH THU QĐ (TR)': dtQd,\n          'DT TRẢ GÓP (TR)': parseFlexibleNumber(getCell(row, idxTraGop, 0)),\n          '% TRẢ GÓP': idxPctTraGop !== -1 ? parseFlexibleNumber(getCell(row, idxPctTraGop, 0)) : 0,\n          'SỐ LƯỢNG': Math.round(parseFlexibleNumber(getCell(row, idxQty, 0))),\n        };\n      });\n      break;\n    }\n\n    case 'nv_tgdd':\n    case 'nv_tz': {\n      const idxMaNv = getIdx('MÃ NV', ['ma nv', 'ma nhan vien', 'ma so']);\n      const idxTenNv = getIdx('ĐƠN VỊ / NHÂN VIÊN', ['don vi nhan vien', 'ten nhan vien', 'ten nv', 'ho va ten', 'nhan vien']);\n      const idxMaCt = getIdx('MÃ CHƯƠNG TRÌNH', ['ma chuong trinh', 'ma ct']);\n      const idxTenCt = getIdx('CHƯƠNG TRÌNH', ['chuong trinh', 'ten chuong trinh', 'ten ct']);\n      const idxTarget = getIdx('TARGET (TR/SL theo LOẠI TĐ)', ['target tr sl theo loai td', 'target tr sl', 'target']);\n      const idxDt = getIdx('DOANH THU (TR)', ['doanh thu tr', 'doanh thu', 'dt']);\n      const idxDtQd = getIdx('DT QUY ĐỔI (TR)', ['dt quy doi tr', 'dt quy doi', 'dt qd tr', 'dtqd']);\n      const idxQty = getIdx('SỐ LƯỢNG', ['so luong', 'sl']);\n      const idxLoai = getIdx('LOẠI TĐ', ['loai td', 'loai']);\n      const idxHt = getIdx('% HT THÁNG', ['ht thang', 'ti le ht', 'hoan thanh']);\n      const idxRank = getIdx('HẠNG VÙNG', ['hang vung', 'hang']);\n\n      formattedData = rows.map((row, rIdx) => {\n        const dt = parseFlexibleNumber(getCell(row, idxDt, 0));\n        const dtQd = idxDtQd !== -1 ? parseFlexibleNumber(getCell(row, idxDtQd, 0)) : 0;\n        const qty = Math.round(parseFlexibleNumber(getCell(row, idxQty, 0)));\n        const loai = Math.round(parseFlexibleNumber(getCell(row, idxLoai, dt > 0 ? 3 : 2)));\n        const target = parseFlexibleNumber(getCell(row, idxTarget, 0));\n        const htThang = idxHt !== -1 ? parseFlexibleNumber(getCell(row, idxHt, 0)) : (target > 0 ? (dt / target) * 100 : 0);\n\n        return {\n          'MÃ NV': String(getCell(row, idxMaNv, '')),\n          'ĐƠN VỊ / NHÂN VIÊN': String(getCell(row, idxTenNv, `Nhân viên ${rIdx + 1}`)),\n          'MÃ CHƯƠNG TRÌNH': String(getCell(row, idxMaCt, `CT${rIdx + 1}`)),\n          'CHƯƠNG TRÌNH': String(getCell(row, idxTenCt, `Chương trình ${rIdx + 1}`)),\n          'LOẠI TĐ': loai,\n          'TARGET (TR/SL theo LOẠI TĐ)': target,\n          'DOANH THU (TR)': dt,\n          'DT QUY ĐỔI (TR)': dtQd,\n          'SỐ LƯỢNG': qty,\n          '% HT THÁNG': htThang,\n          'HẠNG VÙNG': getCell(row, idxRank, ''),\n        };\n      });\n      break;\n    }\n  }\n\n  return {\n    category,\n    categoryName: CATEGORY_LABELS[category],\n    rowCount: formattedData.length,\n    recognizedColumns,\n    missingColumns,\n    data: formattedData,\n    pageExtractedInfo,\n  };\n}\n\n/**\n * Top-level Master Entrypoint for pasted data\n */\nexport function parsePastedData(\n  rawText: string,\n  targetCategory?: keyof AppDataState | null,\n  context?: MwgDetectionContext\n): ParseDiagnostics | { error: string } {\n  if (!rawText || !rawText.trim()) {\n    return { error: 'Nội dung dán trống. Vui lòng kiểm tra lại clipboard!' };\n  }\n\n  // 1. Prioritize MWG BI Direct Parser (Matches the real format provided by user)\n  const mwgResult = tryParseMwgBiFormat(rawText, targetCategory, context);\n  if (mwgResult && mwgResult.data.length > 0) {\n    return mwgResult;\n  }\n\n  // 2. Generic Tabular Grid Parser (for Excel / Google Sheets copies)\n  const { headers, rows, pageExtractedInfo } = splitClipboardIntoGrid(rawText, targetCategory);\n\n  if (rows.length > 0) {\n    let finalCategory: keyof AppDataState | null = targetCategory || null;\n\n    if (!finalCategory) {\n      finalCategory = detectCategoryFromParsedData(headers, rows);\n    }\n\n    if (finalCategory) {\n      return mapGridToCategoryData(finalCategory, headers, rows, pageExtractedInfo);\n    }\n  }\n\n  if (rows.length === 0) {\n    return {\n      error:\n        'Không tìm thấy dữ liệu bảng hợp lệ trong nội dung dán. Vui lòng copy từ báo cáo BI hoặc bảng tính Excel và dán lại.',\n    };\n  }\n\n  return {\n    error:\n      'Hệ thống chưa tự động nhận diện được loại dữ liệu này. Vui lòng chọn cụ thể mục dữ liệu ở thanh chọn bên trên.',\n  };\n}\n","src/views/BaoCaoCuoiNgayView.tsx":"import React, { useState, useEffect, useRef } from 'react';\nimport { Chart as ChartJS, registerables } from 'chart.js';\nimport { Camera, Eye, EyeOff, Sparkles, Trophy, ArrowRightLeft, Search, BarChart3, Table2 } from 'lucide-react';\nimport { AppDataState, CompetitionRow } from '../types';\nimport {\n  formatCurrency,\n  formatInt,\n  formatPercent,\n  formatProgramName,\n  cleanCode,\n  cleanProgName,\n  getCellNumber\n} from '../utils/formatters';\n\nChartJS.register(...registerables);\n\ninterface BaoCaoCuoiNgayViewProps {\n  appData: AppDataState;\n  onExportTab: () => void;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n}\n\nexport const BaoCaoCuoiNgayView: React.FC<BaoCaoCuoiNgayViewProps> = ({\n  appData,\n  onExportTab,\n  onOpenProgramDetail,\n}) => {\n  const [revenueMode, setRevenueMode] = useState<'QD' | 'THUC'>('QD');\n  const [donutMode, setDonutMode] = useState<'RT' | 'LK'>('RT');\n  const [isSplitTable, setIsSplitTable] = useState<boolean>(false);\n  const [splitStoreKey, setSplitStoreKey] = useState<'TGDD' | 'TOPZONE'>('TGDD');\n  const [searchTerm, setSearchTerm] = useState<string>('');\n\n  // Toggles for charts & data tables\n  const [showCharts, setShowCharts] = useState<boolean>(true);\n  const [showDataTables, setShowDataTables] = useState<boolean>(true);\n\n  const barCanvasRef = useRef<HTMLCanvasElement>(null);\n  const donutTdRef = useRef<HTMLCanvasElement>(null);\n  const donutCatRef = useRef<HTMLCanvasElement>(null);\n\n  const barChartInstance = useRef<ChartJS | null>(null);\n  const donutTdInstance = useRef<ChartJS | null>(null);\n  const donutCatInstance = useRef<ChartJS | null>(null);\n\n\n  const isQd = revenueMode === 'QD';\n\n  // 1. Calculate Store & Cluster Revenue Stats\n  const lk = appData.dt_luyke || [];\n  const rt = appData.dt_realtime || [];\n\n  const rowAarLk = lk.find(r => String(r['MÃ ĐƠN VỊ']) === '10341' || String(r['TÊN ĐƠN VỊ']).includes('AAR')) || {};\n  const rowAarRt = rt.find(r => String(r['MÃ ĐƠN VỊ']) === '10341' || String(r['TÊN ĐƠN VỊ']).includes('AAR')) || {};\n  const rowTgdLk = lk.find(r => String(r['MÃ ĐƠN VỊ']) === '933' || String(r['TÊN ĐƠN VỊ']).includes('TGD')) || {};\n  const rowTgdRt = rt.find(r => String(r['MÃ ĐƠN VỊ']) === '933' || String(r['TÊN ĐƠN VỊ']).includes('TGD')) || {};\n\n  const aar_rt = isQd ? (parseFloat(String(rowAarRt['DOANH THU QĐ (TR)'])) || 0) : (parseFloat(String(rowAarRt['DOANH THU (TR)'])) || 0);\n  const aar_lk = isQd ? (parseFloat(String(rowAarLk['DOANH THU QĐ (TR)'])) || 0) : (parseFloat(String(rowAarLk['DOANH THU (TR)'])) || 0);\n  const aar_chot = aar_lk + aar_rt;\n  const aar_tg = isQd ? (parseFloat(String(rowAarLk['TARGET QĐ (TR)'])) || parseFloat(String(rowAarLk['TARGET (TR)'])) || 0) : (parseFloat(String(rowAarLk['TARGET (TR)'])) || 0);\n  const aar_pct_ht = aar_tg > 0 ? (aar_chot / aar_tg * 100) : 0;\n\n  const tgd_rt = isQd ? (parseFloat(String(rowTgdRt['DOANH THU QĐ (TR)'])) || 0) : (parseFloat(String(rowTgdRt['DOANH THU (TR)'])) || 0);\n  const tgd_lk = isQd ? (parseFloat(String(rowTgdLk['DOANH THU QĐ (TR)'])) || 0) : (parseFloat(String(rowTgdLk['DOANH THU (TR)'])) || 0);\n  const tgd_chot = tgd_lk + tgd_rt;\n  const tgd_tg = isQd ? (parseFloat(String(rowTgdLk['TARGET QĐ (TR)'])) || parseFloat(String(rowTgdLk['TARGET (TR)'])) || 0) : (parseFloat(String(rowTgdLk['TARGET (TR)'])) || 0);\n  const tgd_pct_ht = tgd_tg > 0 ? (tgd_chot / tgd_tg * 100) : 0;\n\n  const cum_rt = aar_rt + tgd_rt;\n  const cum_lk = aar_lk + tgd_lk;\n  const cum_chot = aar_chot + tgd_chot;\n  const cum_tg = aar_tg + tgd_tg;\n  const cum_pct_ht = cum_tg > 0 ? (cum_chot / cum_tg * 100) : 0;\n  const cum_gap = Math.max(0, cum_tg - cum_chot);\n\n  // BI's LK forecast is based on the accumulated amount only (not today's RT).\n  // The end-of-day target gap, however, must use LK + RT and the days remaining\n  // after the current trading day.\n  const daysElapsedLk = Math.max(1, Math.max(\n    parseFloat(String(rowAarLk['SỐ NGÀY CỬA SỔ'])) || 0,\n    parseFloat(String(rowTgdLk['SỐ NGÀY CỬA SỔ'])) || 0\n  ));\n  const hasRealtime = rt.some(r =>\n    String(r['MÃ ĐƠN VỊ'] || '').trim() === '10341' ||\n    String(r['MÃ ĐƠN VỊ'] || '').trim() === '933' ||\n    String(r['TÊN ĐƠN VỊ'] || '').includes('AAR_DNA_HCH') ||\n    String(r['TÊN ĐƠN VỊ'] || '').includes('TGD_DNA_HCH')\n  );\n  const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();\n  const currentDay = Math.min(daysInMonth, daysElapsedLk + (hasRealtime ? 1 : 0));\n  const daysRemaining = Math.max(1, daysInMonth - currentDay);\n  const aar_dubao = aar_lk * daysInMonth / daysElapsedLk;\n  const tgd_dubao = tgd_lk * daysInMonth / daysElapsedLk;\n  const cum_dubao = cum_lk * daysInMonth / daysElapsedLk;\n  const aar_can_chay = Math.max(0, aar_tg - aar_chot) / daysRemaining;\n  const tgd_can_chay = Math.max(0, tgd_tg - tgd_chot) / daysRemaining;\n  const cum_can_chay = Math.max(0, cum_tg - cum_chot) / daysRemaining;\n  const aar_tragop_pct = parseFloat(String(rowAarLk['% TRẢ GÓP'])) || (parseFloat(String(rowAarLk['DOANH THU (TR)'])) > 0 ? (parseFloat(String(rowAarLk['DT TRẢ GÓP (TR)'])) || 0) / parseFloat(String(rowAarLk['DOANH THU (TR)'])) * 100 : 0);\n  const tgd_tragop_pct = parseFloat(String(rowTgdLk['% TRẢ GÓP'])) || (parseFloat(String(rowTgdLk['DOANH THU (TR)'])) > 0 ? (parseFloat(String(rowTgdLk['DT TRẢ GÓP (TR)'])) || 0) / parseFloat(String(rowTgdLk['DOANH THU (TR)'])) * 100 : 0);\n  const cum_tragop_pct = (cum_lk > 0) ? (((parseFloat(String(rowAarLk['DT TRẢ GÓP (TR)'])) || 0) + (parseFloat(String(rowTgdLk['DT TRẢ GÓP (TR)'])) || 0)) / cum_lk * 100) : 0;\n\n  // 2. Extract programs for each store\n  const td_lk = appData.td_luyke || [];\n  const td_rt = appData.td_realtime || [];\n\n  const getStorePrograms = (storeKeyword: string) => {\n    return td_lk.filter(r => String(r['ĐƠN VỊ / NHÂN VIÊN']).includes(storeKeyword) && (parseFloat(String(r['TARGET (TR/SL theo LOẠI TĐ)'])) || 0) > 0);\n  };\n\n  const tgdProgs = getStorePrograms('TGD');\n  const aarProgs = getStorePrograms('AAR');\n\n  // Count done programs\n  let totalDoneCount = 0;\n  const countDone = (progs: CompetitionRow[], storeKeyword: string) => {\n    let count = 0;\n    progs.forEach(p => {\n      const pCode = cleanCode(p['MÃ CHƯƠNG TRÌNH']);\n      const pName = cleanProgName(p['CHƯƠNG TRÌNH']);\n      const target = parseFloat(String(p['TARGET (TR/SL theo LOẠI TĐ)'])) || 0;\n      const loai = p['LOẠI TĐ'];\n\n      // p itself is the exact Lũy kế row already filtered for this store.\n      const lkMatch = p;\n      const rtMatch = td_rt.find(r =>\n        (cleanCode(r['MÃ CHƯƠNG TRÌNH']) === pCode || cleanProgName(r['CHƯƠNG TRÌNH']) === pName) &&\n        String(r['ĐƠN VỊ / NHÂN VIÊN'] || '').includes(storeKeyword)\n      );\n\n      let valLk = (parseFloat(String(lkMatch['DOANH THU (TR)'])) || 0);\n      let valRt = rtMatch ? (parseFloat(String(rtMatch['DOANH THU (TR)'])) || 0) : 0;\n      if (loai === 2 || loai === 6) {\n        valLk = lkMatch ? (parseFloat(String(lkMatch['SỐ LƯỢNG'])) || 0) : 0;\n        valRt = rtMatch ? (parseFloat(String(rtMatch['SỐ LƯỢNG'])) || 0) : 0;\n      } else if (loai === 3) {\n        valLk = lkMatch ? (parseFloat(String(lkMatch['DT QUY ĐỔI (TR)'])) || valLk) : 0;\n        valRt = rtMatch ? (parseFloat(String(rtMatch['DT QUY ĐỔI (TR)'])) || valRt) : 0;\n      }\n\n      const chot = valLk + valRt;\n      const pct = target > 0 ? (chot / target * 100) : 0;\n      if (pct >= 100) count++;\n    });\n    return count;\n  };\n\n  const tgdDone = countDone(tgdProgs, 'TGD');\n  const aarDone = countDone(aarProgs, 'AAR');\n  const allProgsCount = tgdProgs.length + aarProgs.length;\n  totalDoneCount = tgdDone + aarDone;\n\n  // 3. Render Charts\n  useEffect(() => {\n    if (!showCharts) {\n      barChartInstance.current?.destroy();\n      donutTdInstance.current?.destroy();\n      donutCatInstance.current?.destroy();\n      return;\n    }\n\n    // Bar Chart\n    if (barCanvasRef.current) {\n      if (barChartInstance.current) barChartInstance.current.destroy();\n      barChartInstance.current = new ChartJS(barCanvasRef.current, {\n        type: 'bar',\n        data: {\n          labels: ['AAR NHT', 'TGD NHT'],\n          datasets: [\n            {\n              label: 'Realtime Hôm Nay',\n              data: [aar_rt, tgd_rt],\n              backgroundColor: '#f59e0b',\n              borderRadius: 6,\n            },\n            {\n              label: 'Luỹ Kế Đầu Ngày',\n              data: [aar_lk, tgd_lk],\n              backgroundColor: '#3b82f6',\n              borderRadius: 6,\n            },\n            {\n              label: 'Target Tháng',\n              data: [aar_tg, tgd_tg],\n              backgroundColor: '#cbd5e1',\n              borderRadius: 6,\n            }\n          ]\n        },\n        options: {\n          responsive: true,\n          maintainAspectRatio: false,\n          plugins: {\n            legend: { position: 'top', labels: { boxWidth: 10, font: { size: 10, weight: 'bold' } } },\n          },\n          scales: {\n            x: { ticks: { font: { size: 10, weight: 'bold' } } },\n            y: { beginAtZero: true, ticks: { font: { size: 9 } } },\n          }\n        }\n      });\n    }\n\n    // Donut Thi Đua\n    if (donutTdRef.current) {\n      if (donutTdInstance.current) donutTdInstance.current.destroy();\n      let done = 0;\n      let near = 0;\n      let bottom = 0;\n\n      td_lk.forEach(r => {\n        const pct = parseFloat(String(r['% HT THÁNG'])) || 0;\n        if (pct >= 100) done++;\n        else if (pct >= 80) near++;\n        else bottom++;\n      });\n\n      donutTdInstance.current = new ChartJS(donutTdRef.current, {\n        type: 'doughnut',\n        data: {\n          labels: ['Về Số (≥100%)', 'Gần Về (80-100%)', 'Bottom (<80%)'],\n          datasets: [\n            {\n              data: [done || 12, near || 8, bottom || 16],\n              backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],\n            }\n          ]\n        },\n        options: {\n          responsive: true,\n          maintainAspectRatio: false,\n          plugins: {\n            legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }\n          }\n        }\n      });\n    }\n\n    // Donut Top Ngành Hàng\n    if (donutCatRef.current) {\n      if (donutCatInstance.current) donutCatInstance.current.destroy();\n      donutCatInstance.current = new ChartJS(donutCatRef.current, {\n        type: 'doughnut',\n        data: {\n          labels: ['Điện thoại', 'Laptop', 'Đồng hồ', 'Phụ kiện', 'Gia dụng', 'Khác'],\n          datasets: [\n            {\n              data: donutMode === 'RT' ? [54, 18, 12, 8, 5, 3] : [48, 22, 14, 9, 4, 3],\n              backgroundColor: ['#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#64748b'],\n            }\n          ]\n        },\n        options: {\n          responsive: true,\n          maintainAspectRatio: false,\n          plugins: {\n            legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 9 } } }\n          }\n        }\n      });\n    }\n\n    return () => {\n      barChartInstance.current?.destroy();\n      donutTdInstance.current?.destroy();\n      donutCatInstance.current?.destroy();\n    };\n  }, [aar_rt, tgd_rt, aar_lk, tgd_lk, aar_tg, tgd_tg, donutMode, td_lk, showCharts]);\n\n  // Helper to render side competition table\n  const renderSideTableRows = (progs: CompetitionRow[], storeKeyword: string) => {\n    return progs\n      .filter(p => {\n        if (!searchTerm) return true;\n        const name = p['CHƯƠNG TRÌNH'] || '';\n        return (\n          name.toLowerCase().includes(searchTerm.toLowerCase()) ||\n          formatProgramName(name).toLowerCase().includes(searchTerm.toLowerCase())\n        );\n      })\n      .map((p, idx) => {\n        const pCode = cleanCode(p['MÃ CHƯƠNG TRÌNH']);\n        const pName = p['CHƯƠNG TRÌNH'] || '';\n        const target = parseFloat(String(p['TARGET (TR/SL theo LOẠI TĐ)'])) || 0;\n        const loai = Number(p['LOẠI TĐ']) || 3;\n\n        // IMPORTANT: p is already the exact Lũy kế row from td_luyke for this store.\n        // Do not search td_luyke again by program name/code: duplicate program names\n        // across shops (or stale/demo rows) can otherwise make AAR/TGD pick the wrong row.\n        const lkMatch = p;\n        const rtMatch = td_rt.find(r =>\n          (cleanCode(r['MÃ CHƯƠNG TRÌNH']) === pCode || cleanProgName(r['CHƯƠNG TRÌNH']) === cleanProgName(pName)) &&\n          String(r['ĐƠN VỊ / NHÂN VIÊN'] || '').includes(storeKeyword)\n        );\n\n        let valLk = (parseFloat(String(lkMatch['DOANH THU (TR)'])) || 0);\n        let valRt = rtMatch ? (parseFloat(String(rtMatch['DOANH THU (TR)'])) || 0) : 0;\n\n        if (loai === 2 || loai === 6) {\n          valLk = lkMatch ? (parseFloat(String(lkMatch['SỐ LƯỢNG'])) || 0) : 0;\n          valRt = rtMatch ? (parseFloat(String(rtMatch['SỐ LƯỢNG'])) || 0) : 0;\n        } else if (loai === 3) {\n          valLk = lkMatch ? (parseFloat(String(lkMatch['DT QUY ĐỔI (TR)'])) || valLk) : 0;\n          valRt = rtMatch ? (parseFloat(String(rtMatch['DT QUY ĐỔI (TR)'])) || valRt) : 0;\n        }\n\n        const chot = valLk + valRt;\n        const pctHt = target > 0 ? (chot / target * 100) : 0;\n        const gap = Math.max(0, target - chot);\n\n        let badge = (\n          <span className=\"px-2 py-0.5 rounded bg-rose-100 text-rose-800 text-[10px] font-black\">\n            Bottom\n          </span>\n        );\n        if (pctHt >= 100) {\n          badge = (\n            <span className=\"px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[10px] font-black\">\n              Về Số\n            </span>\n          );\n        } else if (pctHt >= 80) {\n          badge = (\n            <span className=\"px-2 py-0.5 rounded bg-amber-100 text-amber-800 text-[10px] font-black\">\n              Gần Về\n            </span>\n          );\n        }\n\n        const isQty = loai === 2 || loai === 6;\n\n        return (\n          <tr\n            key={idx}\n            onClick={() => onOpenProgramDetail(storeKeyword === 'AAR' ? 'TopZone' : 'TGDĐ', pCode, pName)}\n            title=\"Bấm để xem chi tiết nhân viên bán môn này\"\n            className={`hover:bg-blue-50/70 cursor-pointer transition border-b border-slate-100 ${\n              pctHt >= 100 ? 'bg-emerald-50/20' : ''\n            }`}\n          >\n            <td className=\"py-2.5 px-2 text-center font-mono text-[10.5px] text-slate-400\">\n              {pCode}\n            </td>\n            <td className=\"py-2.5 px-3 font-bold text-slate-900\" title={pName}>\n              {formatProgramName(pName)}\n            </td>\n            <td className=\"py-2.5 px-2 text-center text-[10px] text-slate-400 font-mono\">\n              Loại {loai}\n            </td>\n            <td className=\"py-2.5 px-2 text-right font-mono text-slate-700\">\n              {isQty ? formatInt(valLk) : formatCurrency(valLk)}\n            </td>\n            <td className=\"py-2.5 px-2 text-right font-mono font-bold text-blue-600\">\n              {isQty ? formatInt(valRt) : formatCurrency(valRt)}\n            </td>\n            <td className=\"py-2.5 px-2 text-right font-mono font-black text-slate-900 bg-amber-50/50\">\n              {isQty ? formatInt(chot) : formatCurrency(chot)}\n            </td>\n            <td className=\"py-2.5 px-2 text-right font-mono text-slate-500\">\n              {isQty ? formatInt(target) : formatCurrency(target)}\n            </td>\n            <td\n              className={`py-2.5 px-2 text-center font-black ${\n                pctHt >= 100\n                  ? 'text-emerald-700'\n                  : pctHt >= 80\n                  ? 'text-amber-700'\n                  : 'text-rose-600'\n              }`}\n            >\n              {formatPercent(pctHt)}\n            </td>\n            <td className=\"py-2.5 px-2 text-right font-mono font-bold text-rose-600\">\n              {isQty ? formatInt(gap) : formatCurrency(gap)}\n            </td>\n            <td className=\"py-2.5 px-2 text-center\">{badge}</td>\n          </tr>\n        );\n      });\n  };\n\n  return (\n    <div className=\"space-y-6\">\n      {/* 1. Header Banner */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div>\n          <div className=\"flex items-center space-x-2 mb-1\">\n            <span className=\"px-2.5 py-0.5 bg-amber-500 text-white font-extrabold text-[10.5px] rounded-lg shadow-2xs\">\n              ⚡ BÁO CÁO CHỐT CUỐI NGÀY\n            </span>\n            <span className=\"text-[11px] text-slate-400 font-medium\">\n              Cập nhật: <b className=\"text-slate-800\">{new Date().toLocaleDateString('sv-SE')}</b>\n            </span>\n          </div>\n          <h3 className=\"font-black text-slate-900 text-lg uppercase tracking-tight\">\n            BẢNG TỔNG HỢP DOANH THU & THI ĐUA CHỐT CUỐI NGÀY\n          </h3>\n          <p className=\"text-xs text-slate-500 font-medium\">\n            Tự động kết hợp 4 dal } from '../components/DataInputModal';\nimport { CATEGORY_LABELS, parsePastedData } from '../utils/smartDataParser';\n\ninterface DashboardViewProps {\n  appData: AppDataState;\n  onSelectView?: (view: ViewType) => void;\n  onOpenUpload?: () => void;\n  onResetData?: () => void;\n  onOpenProgramDetail?: (params: { storeKey: 'TGDD' | 'TOPZONE'; programCode: string | number; programName: string }) => void;\n  onUpdateSlot?: (slot: keyof AppDataState, data: any[]) => void;\n  onClearSlot?: (slot: keyof AppDataState) => void;\n  onClearAll?: () => void;\n  onRestoreSample?: () => void;\n  onTriggerFilePicker?: (slot: keyof AppDataState) => void;\n  isShortenProg?: boolean;\n  onToggleShortenProg?: () => void;\n  isShortenStore?: boolean;\n  onToggleShortenStore?: () => void;\n  onSelectStoreAndNavigate?: (storeId: string) => void;\n  onNavigateToEmployeeRanking?: (storeTab: 'TGDD' | 'TOPZONE') => void;\n  onOpenStoreSettings?: (storeId: string) => void;\n}\n\nexport const DashboardView: React.FC<DashboardViewProps> = ({\n  appData,\n  onSelectView,\n  onOpenUpload,\n  onResetData,\n  onOpenProgramDetail,\n  onUpdateSlot,\n  onClearSlot,\n  onClearAll,\n  onRestoreSample,\n  onTriggerFilePicker,\n  isShortenProg: initialShortenProg = false,\n  onToggleShortenProg,\n  isShortenStore: initialShortenStore = false,\n  onToggleShortenStore,\n  onSelectStoreAndNavigate,\n  onNavigateToEmployeeRanking,\n  onOpenStoreSettings,\n}) => {\n  // Local fallback states if not controlled from outside\n  const [internalShortenProg, setInternalShortenProg] = useState(initialShortenProg);\n  const [internalShortenStore, setInternalShortenStore] = useState(initialShortenStore);\n\n  const shortenProg = onToggleShortenProg ? initialShortenProg : internalShortenProg;\n  const shortenStore = onToggleShortenStore ? initialShortenStore : internalShortenStore;\n\n  const toggleProg = onToggleShortenProg || (() => setInternalShortenProg(p => !p));\n  const toggleStore = onToggleShortenStore || (() => setInternalShortenStore(p => !p));\n\n  // Modal state for smart paste/manual data entry\n  const [inputModal, setInputModal] = useState<{\n    isOpen: boolean;\n    targetCategory: keyof AppDataState | null;\n  }>({\n    isOpen: false,\n    targetCategory: null,\n  });\n\n  // Toast feedback state for quick paste\n  const [quickFeedback, setQuickFeedback] = useState<string | null>(null);\n\n  const showQuickFeedback = (msg: string) => {\n    setQuickFeedback(msg);\n    setTimeout(() => setQuickFeedback(null), 3500);\n  };\n\n  // Open data entry modal for a specific slot\n  const handleOpenInputModal = (category?: keyof AppDataState) => {\n    setInputModal({\n      isOpen: true,\n      targetCategory: category || null,\n    });\n  };\n\n  // Quick paste directly from clipboard\n  const handleQuickPaste = async (slot: keyof AppDataState) => {\n    try {\n      const text = await navigator.clipboard.readText();\n      if (!text || !text.trim()) {\n        showQuickFeedback('Clipboard trống! Đang mở ô nhập data để bạn dán thủ công...');\n        handleOpenInputModal(slot);\n        return;\n      }\n\n      const parsed = parsePastedData(text, slot);\n      if ('error' in parsed) {\n        showQuickFeedback('Chưa khớp định dạng! Đang mở ô nhập data để bạn xem trước...');\n        handleOpenInputModal(slot);\n        return;\n      }\n\n      if (parsed.data.length > 0) {\n        if (onUpdateSlot) {\n          onUpdateSlot(slot, parsed.data);\n        }\n        showQuickFeedback(`⚡ Đã dán nhanh ${parsed.data.length} dòng vào \"${CATEGORY_LABELS[slot]}\"!`);\n      }\n    } catch (err) {\n      // If clipboard read permission blocked by browser, open the modal instead\n      handleOpenInputModal(slot);\n    }\n  };\n\n  const handleSaveDataFromModal = (category: keyof AppDataState, data: any[]) => {\n    let finalData = data;\n\n    // Doanh thu nhân viên: chỉ giữ những nhân viên thực sự xuất hiện trong\n    // hai báo cáo Thi đua nhân viên TGDĐ/TopZone mà anh đã nạp.\n    // Như vậy các nhân viên không tham gia thi đua sẽ không đi vào bảng KPI NV.\n    if (category === 'dt_nv_luyke' || category === 'dt_nv_realtime') {\n      const competitionIds = new Set<string>();\n      [...(appData.nv_tgdd || []), ...(appData.nv_tz || [])].forEach((row: any) => {\n        const raw = String(row?.['MÃ NV'] ?? row?.['MÃ NHÂN VIÊN'] ?? '').trim();\n        if (raw) competitionIds.add(raw.toLowerCase());\n        const label = String(row?.['ĐƠN VỊ / NHÂN VIÊN'] ?? '').trim();\n        const m = label.match(/^(\\d{4,7}|online)\\s*[-_–]/i);\n        if (m) competitionIds.add(m[1].toLowerCase());\n      });\n\n      // Chỉ lọc khi đã có dữ liệu Thi đua. Nếu anh nhập doanh thu trước\n      // khi nhập Thi đua thì vẫn giữ dữ liệu để không làm mất dữ liệu.\n      if (competitionIds.size > 0) {\n        finalData = data.filter((row: any) => {\n          const id = String(row?.['MÃ NHÂN VIÊN'] ?? row?.['MÃ NV'] ?? '').trim().toLowerCase();\n          return id && competitionIds.has(id);\n        });\n      }\n    }\n\n    if (onUpdateSlot) {\n      onUpdateSlot(category, finalData);\n    }\n\n    if (finalData.length !== data.length) {\n      showQuickFeedback(`✓ Đã lưu ${finalData.length}/${data.length} nhân viên — chỉ giữ nhân viên có trong Thi đua.`);\n    } else {\n      showQuickFeedback(`✓ Đã lưu thành công ${finalData.length} dòng vào \"${CATEGORY_LABELS[category]}\"!`);\n    }\n  };\n\n  const clearSlot = (slot: keyof AppDataState) => {\n    if (onClearSlot) {\n      onClearSlot(slot);\n    } else if (onUpdateSlot) {\n      onUpdateSlot(slot, []);\n    }\n    showQuickFeedback(`Đã xóa dữ liệu mục \"${CATEGORY_LABELS[slot]}\"`);\n  };\n\n  const hasDtLk = appData.dt_luyke.length > 0;\n  const hasDtRt = appData.dt_realtime.length > 0;\n  const hasTdLk = appData.td_luyke.length > 0;\n  const hasTdRt = appData.td_realtime.length > 0;\n  const hasDtNvLk = appData.dt_nv_luyke.length > 0;\n  const hasDtNvRt = appData.dt_nv_realtime.length > 0;\n  const hasNvTz = appData.nv_tz.length > 0;\n  const hasNvTgdd = appData.nv_tgdd.length > 0;\n\n  // Render an interactive Slot Input Card\n  const renderSlotCard = (\n    slot: keyof AppDataState,\n    title: string,\n    iconColor: string,\n    hasData: boolean,\n    countText: string\n  ) => {\n    return (\n      <div\n        className={`border rounded-2xl p-4 transition flex flex-col justify-between ${\n          hasData\n            ? 'border-emerald-200 bg-emerald-50/40 hover:bg-emerald-50/70 shadow-2xs'\n            : 'border-slate-200 bg-white hover:border-blue-300 hover:bg-slate-50/60 shadow-2xs'\n        }`}\n      >\n        <div>\n          {/* Slot Header */}\n          <div className=\"flex items-center justify-between mb-2\">\n            <span className=\"font-extrabold text-slate-800 text-xs flex items-center gap-1.5\">\n              <span className={`w-2 h-2 rounded-full ${hasData ? 'bg-emerald-500' : 'bg-slate-300'}`}></span>\n              {title}\n            </span>\n            <span\n              className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${\n                hasData\n                  ? 'bg-emerald-100 text-emerald-800 border border-emerald-200'\n                  : 'bg-slate-100 text-slate-500'\n              }`}\n            >\n              {hasData ? countText : 'Chưa có data'}\n            </span>\n          </div>\n\n          <p className=\"text-[11px] text-slate-500 line-clamp-1 mb-3\">\n            {hasData ? `✓ Đã sẵn sàng số liệu phân tích` : 'Sao chép từ web BI và dán vào đây'}\n          </p>\n        </div>\n\n        {/* Action Controls for this Slot */}\n        <div className=\"space-y-1.5 pt-2 border-t border-slate-100\">\n          <div className=\"grid grid-cols-2 gap-1.5\">\n            <button\n              onClick={() => handleOpenInputModal(slot)}\n              type=\"button\"\n              className=\"px-2.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 shadow-2xs cursor-pointer active:scale-95\"\n              title=\"Mở ô nhập / dán dữ liệu cho mục này\"\n            >\n              <Clipboard className=\"w-3.5 h-3.5\" />\n              <span>Nhập Data</span>\n            </button>\n\n            <button\n              onClick={() => handleQuickPaste(slot)}\n              type=\"button\"\n              className=\"px-2.5 py-1.5 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 shadow-2xs cursor-pointer active:scale-95\"\n              title=\"Dán nhanh ngay từ clipboard (Ctrl + V)\"\n            >\n              <Zap className=\"w-3.5 h-3.5\" />\n              <span>Dán Nhanh</span>\n            </button>\n          </div>\n\n          <div className=\"flex items-center justify-between text-[11px] pt-1\">\n            {onTriggerFilePicker ? (\n              <button\n                onClick={() => onTriggerFilePicker(slot)}\n                className=\"text-slate-400 hover:text-slate-700 font-medium hover:underline flex items-center gap-1 cursor-pointer\"\n                title=\"Chọn file Excel/CSV cũ nếu có\"\n              >\n                <Upload className=\"w-3 h-3\" />\n                <span>Chọn file cũ</span>\n              </button>\n            ) : (\n              <span />\n            )}\n\n            {hasData && (\n              <button\n                onClick={() => clearSlot(slot)}\n                className=\"text-rose-500 hover:text-rose-700 font-medium flex items-center gap-1 hover:underline cursor-pointer\"\n                title=\"Xóa dữ liệu ô này\"\n              >\n                <Trash2 className=\"w-3 h-3\" />\n                <span>Xóa data</span>\n              </button>\n            )}\n          </div>\n        </div>\n      </div>\n    );\n  };\n\n  return (\n    <div className=\"space-y-6\">\n      {/* Quick Feedback Toast */}\n      {quickFeedback && (\n        <div className=\"fixed top-20 right-6 z-50 animate-in slide-in-from-top-4 duration-300\">\n          <div className=\"bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-xl border border-slate-800 flex items-center gap-2.5\">\n            <CheckCircle2 className=\"w-4 h-4 text-emerald-400 flex-shrink-0\" />\n            <span>{quickFeedback}</span>\n          </div>\n        </div>\n      )}\n\n      {/* 1. KHỐI TRUY CẬP NHANH BI MWG & HƯỚNG DẪN SAO CHÉP / DÁN DATA */}\n      <div className=\"bg-gradient-to-r from-slate-900 via-blue-950 to-indigo-950 text-white rounded-3xl p-6 shadow-xl border border-slate-800 space-y-5\">\n        <div className=\"flex flex-col lg:flex-row lg:items-center justify-between gap-4 pb-4 border-b border-white/10\">\n          <div className=\"flex items-center space-x-3.5\">\n            <div className=\"w-11 h-11 rounded-2xl bg-amber-400 text-slate-950 flex items-center justify-center font-black text-xl shadow-lg shadow-amber-400/20\">\n              ⚡\n            </div>\n            <div>\n              <h3 className=\"font-black text-white text-base uppercase tracking-tight flex items-center gap-2\">\n                <span>Cổng Nhập Dữ Liệu Báo Cáo BI (MWG)</span>\n                <span className=\"text-[10px] bg-emerald-500/20 text-emerald-300 font-bold px-2 py-0.5 rounded-full border border-emerald-500/30\">\n                  Copy & Paste\n                </span>\n              </h3>\n              <p className=\"text-xs text-blue-200\">\n                Không cần xuất file Excel. Chỉ cần bôi đen bảng trên web BI, nhấn Copy (Ctrl + C) và Dán (Ctrl + V) vào hệ thống!\n              </p>\n            </div>\n          </div>\n\n          {/* Quick links to BI */}\n          <div className=\"flex flex-wrap items-center gap-2.5\">\n            <a\n              href=\"https://baocao.dienmayxanh.com/dashboard/home\"\n              target=\"_blank\"\n              rel=\"noopener noreferrer\"\n              className=\"px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-bold transition flex items-center gap-2 border border-white/15 backdrop-blur-sm hover:border-amber-400\"\n            >\n              <span>🌐 BI Trang Chủ</span>\n              <ExternalLink className=\"w-3.5 h-3.5 text-amber-300\" />\n            </a>\n\n            <a\n              href=\"https://baocao.dienmayxanh.com/dashboard/revenue-consolidated\"\n              target=\"_blank\"\n              rel=\"noopener noreferrer\"\n              className=\"px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-extrabold transition flex items-center gap-2 shadow-md hover:shadow-blue-500/30\"\n            >\n              <span>📊 Báo Cáo Doanh Thu</span>\n              <ExternalLink className=\"w-3.5 h-3.5\" />\n            </a>\n\n            <a\n              href=\"https://baocao.dienmayxanh.com/dashboard/thi-dua\"\n              target=\"_blank\"\n              rel=\"noopener noreferrer\"\n              className=\"px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-black transition flex items-center gap-2 shadow-md hover:shadow-amber-500/30\"\n            >\n              <span>🏆 Thi Đua Siêu Thị</span>\n              <ExternalLink className=\"w-3.5 h-3.5\" />\n            </a>\n          </div>\n        </div>\n\n        {/* 3 Step Workflow: Adapted for Copy-Paste */}\n        <div className=\"grid grid-cols-1 md:grid-cols-3 gap-3.5 text-xs\">\n          <div className=\"bg-white/5 border border-white/10 rounded-2xl p-4 space-y-1.5 backdrop-blur-sm\">\n            <div className=\"flex items-center space-x-2\">\n              <span className=\"w-5 h-5 rounded-full bg-blue-500 text-white text-[11px] font-black flex items-center justify-center\">\n                1\n              </span>\n              <h4 className=\"font-extrabold text-blue-200\">Mở Web BI & Lọc Báo Cáo</h4>\n            </div>\n            <p className=\"text-[11.5px] text-slate-300 leading-relaxed\">\n              Bấm nút ở trên để vào BI. Chọn đơn vị:\n              <br />\n              <span className=\"text-amber-300 font-bold\">• 933</span> (TGD NHT) hoặc{' '}\n              <span className=\"text-blue-300 font-bold\">• 10341</span> (AAR NHT).\n            </p>\n          </div>\n\n          <div className=\"bg-white/5 border border-white/10 rounded-2xl p-4 space-y-1.5 backdrop-blur-sm\">\n            <div className=\"flex items-center space-x-2\">\n              <span className=\"w-5 h-5 rounded-full bg-amber-400 text-slate-950 text-[11px] font-black flex items-center justify-center\">\n                2\n              </span>\n              <h4 className=\"font-extrabold text-amber-300\">Ctrl + A Copy Toàn Bộ Trang</h4>\n            </div>\n            <p className=\"text-[11.5px] text-slate-300 leading-relaxed\">\n              Tại trang web BI, anh có thể bấm <b>Ctrl + A</b> (chọn toàn bộ trang) rồi nhấn <b>Ctrl + C</b>.\n              <br />\n              <span className=\"text-amber-200/90 font-medium\">\n                ★ Hệ thống tự động lọc sạch menu, tiêu đề & thanh điều hướng thừa trên web!\n              </span>\n            </p>\n          </div>\n\n          <div className=\"bg-white/5 border border-white/10 rounded-2xl p-4 space-y-1.5 backdrop-blur-sm\">\n            <div className=\"flex items-center space-x-2\">\n              <span className=\"w-5 h-5 rounded-full bg-emerald-400 text-slate-950 text-[11px] font-black flex items-center justify-center\">\n                3\n              </span>\n              <h4 className=\"font-extrabold text-emerald-300\">Dán Nhanh Vào Ô Nhập</h4>\n            </div>\n            <p className=\"text-[11.5px] text-slate-300 leading-relaxed\">\n              Bấm nút <b>\"⚡ Dán Nhanh\"</b> hoặc <b>\"📋 Nhập Data\"</b> tại ô tương ứng bên dưới. Hệ thống tự động bóc tách đúng bảng số liệu và lưu ngay lập tức!\n            </p>\n          </div>\n        </div>\n      </div>\n\n      {/* 2. THANH HÀNH ĐỘNG: DÁN TỔNG HỢP / XÓA DATA CŨ / NẠP LẠI MẪU */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-4 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3\">\n        <div className=\"flex items-center space-x-3\">\n          <div className=\"p-2.5 bg-blue-50 text-blue-600 rounded-xl\">\n            <Clipboard className=\"w-5 h-5\" />\n          </div>\n          <div>\n            <h3 className=\"font-extrabold text-slate-900 text-sm\">Quản Lý Nhập & Cập Nhật Dữ Liệu</h3>\n            <p className=\"text-xs text-slate-500 font-medium\">\n              Dán nội dung bảng từ web BI hoặc xóa sạch dữ liệu cũ để nạp số liệu mới\n            </p>\n          </div>\n        </div>\n\n        <div className=\"flex flex-wrap items-center gap-2\">\n          <button\n            onClick={() => handleOpenInputModal()}\n            type=\"button\"\n            className=\"px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-xs transition flex items-center gap-1.5 cursor-pointer active:scale-95\"\n          >\n            <Clipboard className=\"w-3.5 h-3.5\" />\n            <span>Dán Data Tổng Hợp (Tự Nhận Diện)</span>\n          </button>\n\n          {onClearAll && (\n            <button\n              onClick={onClearAll}\n              type=\"button\"\n              className=\"px-3.5 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold text-xs rounded-xl transition flex items-center gap-1.5 cursor-pointer\"\n            >\n              <Trash2 className=\"w-3.5 h-3.5 text-rose-600\" />\n              <span>Xóa Tất Cả Data Cũ</span>\n            </button>\n          )}\n\n        </div>\n      </div>\n\n      {/* 3. GRID 4 BOX Ô NHẬP DATA */}\n      <div className=\"grid grid-cols-1 md:grid-cols-2 gap-5\">\n        {/* Box 1: Doanh Thu Siêu Thị */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex items-center justify-between pb-2 border-b border-slate-100\">\n            <div className=\"flex items-center space-x-2\">\n              <span className=\"w-2.5 h-2.5 rounded-full bg-emerald-500\"></span>\n              <h3 className=\"font-extrabold text-slate-900 text-sm\">Doanh Thu Siêu Thị</h3>\n              <span className=\"text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200\">\n                {hasDtLk && hasDtRt ? '2/2 Sẵn sàng' : 'Chờ nhập data'}\n              </span>\n            </div>\n            {onSelectView && (\n              <button\n                onClick={() => onSelectView(ViewType.DOANH_THU_ST)}\n                className=\"text-[11px] font-bold text-blue-600 hover:underline cursor-pointer flex items-center gap-1\"\n              >\n                <span>Xem Báo Cáo DT</span> ↗\n              </button>\n            )}\n          </div>\n\n          <div className=\"grid grid-cols-2 gap-3\">\n            {renderSlotCard(\n              'dt_luyke',\n              'Luỹ Kế Siêu Thị',\n              'emerald',\n              hasDtLk,\n              `✓ ${appData.dt_luyke.length} Siêu thị`\n            )}\n            {renderSlotCard(\n              'dt_realtime',\n              'Realtime Hôm Nay',\n              'blue',\n              hasDtRt,\n              `✓ ${appData.dt_realtime.length} Siêu thị`\n            )}\n          </div>\n        </div>\n\n        {/* Box 2: Thi Đua Siêu Thị */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex items-center justify-between pb-2 border-b border-slate-100\">\n            <div className=\"flex items-center space-x-2\">\n              <span className=\"w-2.5 h-2.5 rounded-full bg-amber-500\"></span>\n              <h3 className=\"font-extrabold text-slate-900 text-sm\">Thi Đua Siêu Thị</h3>\n              <span className=\"text-[11px] f
