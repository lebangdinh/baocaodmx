ont-bold text-amber-800 bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200\">\n                24 Môn\n              </span>\n            </div>\n            {/* Toggles */}\n            <div className=\"flex items-center gap-1.5\">\n              <button\n                onClick={toggleProg}\n                type=\"button\"\n                className={`px-2 py-0.5 rounded-lg text-[11px] font-bold border transition cursor-pointer ${\n                  shortenProg\n                    ? 'border-amber-300 bg-amber-100 text-amber-900'\n                    : 'border-slate-200 bg-slate-100 text-slate-600'\n                }`}\n              >\n                ✂️ Rút gọn môn\n              </button>\n              <button\n                onClick={toggleStore}\n                type=\"button\"\n                className={`px-2 py-0.5 rounded-lg text-[11px] font-bold border transition cursor-pointer ${\n                  shortenStore\n                    ? 'border-blue-300 bg-blue-100 text-blue-900'\n                    : 'border-slate-200 bg-slate-100 text-slate-600'\n                }`}\n              >\n                ✂️ Rút gọn tên ST\n              </button>\n            </div>\n          </div>\n\n          <div className=\"grid grid-cols-2 gap-3\">\n            {renderSlotCard(\n              'td_luyke',\n              'Thi Đua Luỹ Kế',\n              'amber',\n              hasTdLk,\n              `✓ ${appData.td_luyke.length} Môn`\n            )}\n            {renderSlotCard(\n              'td_realtime',\n              'Thi Đua Realtime',\n              'purple',\n              hasTdRt,\n              `✓ ${appData.td_realtime.length} Môn`\n            )}\n          </div>\n        </div>\n\n        {/* Box 3: Doanh Thu Nhân Viên (2 Cổng) */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex items-center justify-between pb-2 border-b border-slate-100\">\n            <div className=\"flex items-center space-x-2\">\n              <span className=\"w-2.5 h-2.5 rounded-full bg-blue-600\"></span>\n              <h3 className=\"font-extrabold text-slate-900 text-sm\">Doanh Thu Nhân Viên (2 Cổng)</h3>\n              <span className=\"text-[11px] font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded-md border border-blue-200\">\n                Lũy Kế & Realtime\n              </span>\n            </div>\n            {onSelectView && (\n              <button\n                onClick={() => onSelectView(ViewType.SUC_KHOE_NV)}\n                className=\"text-[11px] font-bold text-blue-600 hover:underline cursor-pointer flex items-center gap-1\"\n              >\n                <span>Xem Xếp Hạng NV</span> ↗\n              </button>\n            )}\n          </div>\n\n          <div className=\"grid grid-cols-2 gap-3\">\n            {renderSlotCard(\n              'dt_nv_luyke',\n              'DT NV Luỹ Kế',\n              'blue',\n              hasDtNvLk,\n              `✓ ${appData.dt_nv_luyke.length} Nhân sự`\n            )}\n            {renderSlotCard(\n              'dt_nv_realtime',\n              'DT NV Realtime',\n              'indigo',\n              hasDtNvRt,\n              `✓ ${appData.dt_nv_realtime.length} Nhân sự`\n            )}\n          </div>\n        </div>\n\n        {/* Box 4: Thi Đua Nhân Viên (12 & 24 môn) */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex items-center justify-between pb-2 border-b border-slate-100\">\n            <div className=\"flex items-center space-x-2\">\n              <span className=\"w-2.5 h-2.5 rounded-full bg-purple-600\"></span>\n              <h3 className=\"font-extrabold text-slate-900 text-sm\">Thi Đua Nhân Viên (12 & 24 Môn)</h3>\n              <span className=\"text-[11px] font-bold text-purple-700 bg-purple-50 px-2 py-0.5 rounded-md border border-purple-200\">\n                TGDĐ & TopZone\n              </span>\n            </div>\n            {onSelectView && (\n              <button\n                onClick={() => onSelectView(ViewType.SUC_KHOE_NV)}\n                className=\"text-[11px] font-bold text-purple-600 hover:underline cursor-pointer flex items-center gap-1\"\n              >\n                <span>Cổng Thi Đua NV</span> ↗\n              </button>\n            )}\n          </div>\n\n          <div className=\"grid grid-cols-2 gap-3\">\n            {renderSlotCard(\n              'nv_tz',\n              '12 Môn (TopZone)',\n              'blue',\n              hasNvTz,\n              `✓ ${appData.nv_tz.length} Dòng`\n            )}\n            {renderSlotCard(\n              'nv_tgdd',\n              '24 Môn (TGDĐ)',\n              'amber',\n              hasNvTgdd,\n              `✓ ${appData.nv_tgdd.length} Dòng`\n            )}\n          </div>\n        </div>\n      </div>\n\n      {/* Embedded Data Input Modal */}\n      <DataInputModal\n        isOpen={inputModal.isOpen}\n        onClose={() => setInputModal({ isOpen: false, targetCategory: null })}\n        targetCategory={inputModal.targetCategory}\n        onSaveData={handleSaveDataFromModal}\n      />\n    </div>\n  );\n};\n","src/views/DoanhThuStView.tsx":"import React, { useState } from 'react';\nimport { Camera } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatInt, formatPercent, formatProgramName } from '../utils/formatters';\nimport { calculateForecast } from '../utils/forecastEngine';\n\ninterface DoanhThuStViewProps {\n  appData: AppDataState;\n  activeStore: string;\n  onChangeActiveStore: (stId: string) => void;\n  onExportTab: () => void;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n}\n\nexport const DoanhThuStView: React.FC<DoanhThuStViewProps> = ({\n  appData,\n  activeStore,\n  onChangeActiveStore,\n  onExportTab,\n  onOpenProgramDetail,\n}) => {\n  const [dataMode, setDataMode] = useState<'LK' | 'RT'>('LK');\n\n  const sourceList = dataMode === 'LK' ? appData.dt_luyke : appData.dt_realtime;\n  const tdSource = dataMode === 'LK' ? appData.td_luyke : appData.td_realtime;\n\n  const row = sourceList.find(r => String(r['MÃ ĐƠN VỊ']) === String(activeStore)) || {};\n  const dtt = parseFloat(String(row['DOANH THU (TR)'])) || 0;\n  const dtqd = parseFloat(String(row['DOANH THU QĐ (TR)'])) || 0;\n  const target = parseFloat(String(row['TARGET (TR)'])) || 0;\n  const target_qd = parseFloat(String(row['TARGET QĐ (TR)'])) || 0;\n  const tragop = parseFloat(String(row['DT TRẢ GÓP (TR)'])) || 0;\n  const bill = parseFloat(String(row['LƯỢT BILL (TẤT CẢ ST)'])) || 0;\n  const sl = parseFloat(String(row['SỐ LƯỢNG'])) || 0;\n  const tb3thang = parseFloat(String(row['TB 3 THÁNG (TR)'])) || 0;\n  const daysElapsed = Math.max(0, parseFloat(String(row['SỐ NGÀY CỬA SỔ'])) || 0);\n  const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();\n  const progressPct = daysInMonth > 0 ? daysElapsed / daysInMonth * 100 : 0;\n  const vs3MonthPct = tb3thang > 0 ? ((dtt / tb3thang) - 1) * 100 : 0;\n\n  const tg_pct = dtt > 0 ? (tragop / dtt * 100) : 0;\n  const qd_pct = dtt > 0 ? (dtqd / dtt * 100) : 0;\n  const forecastResult = dataMode === 'LK' ? calculateForecast(dtqd, target_qd, daysElapsed, daysInMonth) : { forecast: dtqd, forecastPct: target_qd > 0 ? dtqd / target_qd * 100 : 0 };\n  const runrate_forecast = forecastResult.forecastPct;\n  const forecast_val = forecastResult.forecast;\n\n  const storeKeyword = activeStore === '10341' ? 'AAR' : 'TGD';\n  const storeTd = tdSource.filter(r => String(r['ĐƠN VỊ / NHÂN VIÊN']).includes(storeKeyword));\n\n  let htCount = 0;\n  storeTd.forEach(r => {\n    if ((parseFloat(String(r['% HT THÁNG'])) || 0) >= progressPct) htCount++;\n  });\n\n  return (\n    <div className=\"space-y-6\">\n      {/* Top control bar */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-4 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div className=\"flex flex-wrap items-center gap-3\">\n          <select\n            value={activeStore}\n            onChange={(e) => onChangeActiveStore(e.target.value)}\n            className=\"text-xs font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer\"\n          >\n            <option value=\"933\">TGD_DNA_HCH - 351 Nguyễn Hữu Thọ</option>\n            <option value=\"10341\">AAR_DNA_HCH - 351 Nguyễn Hữu Thọ</option>\n          </select>\n          <span className=\"px-2.5 py-1 rounded-lg text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200\">\n            {dataMode === 'LK' ? 'LUỸ KẾ THÁNG' : 'REALTIME HÔM NAY'}\n          </span>\n          <span className=\"text-xs text-slate-400 font-medium\">\n            Tiến độ tháng: <b>Ngày {daysElapsed || 0} / {daysInMonth}</b> (Đã qua: {progressPct.toFixed(1)}%)\n          </span>\n        </div>\n\n        <div className=\"flex items-center gap-2\">\n          <div className=\"flex bg-slate-100 rounded-xl p-1 text-xs font-semibold shadow-inner\">\n            <button\n              onClick={() => setDataMode('LK')}\n              className={`px-3 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                dataMode === 'LK' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              LUỸ KẾ THÁNG\n            </button>\n            <button\n              onClick={() => setDataMode('RT')}\n              className={`px-3 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                dataMode === 'RT' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              REALTIME HÔM NAY\n            </button>\n          </div>\n          <button\n            onClick={onExportTab}\n            className=\"px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-xs transition cursor-pointer\"\n          >\n            <Camera className=\"w-3.5 h-3.5\" />\n            <span>Chụp ảnh báo cáo</span>\n          </button>\n        </div>\n      </div>\n\n      {/* 8 Metric Cards Grid */}\n      <div className=\"grid grid-cols-2 md:grid-cols-4 gap-4\">\n        <div className=\"bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-blue-100\">DOANH THU THỰC</span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {dtt > 0 ? formatCurrency(dtt, 1) : '0'}\n          </div>\n          <div className=\"text-[11px] text-blue-100 flex justify-between border-t border-blue-400/50 pt-2 mt-1\">\n            <span>TARGET:</span>\n            <strong>{formatCurrency(target, 1)} TR</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-teal-500 to-emerald-600 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-emerald-100\">DOANH THU QĐ</span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {dtqd > 0 ? formatCurrency(dtqd, 1) : '0'}\n          </div>\n          <div className=\"text-[11px] text-emerald-100 flex justify-between border-t border-emerald-400/50 pt-2 mt-1\">\n            <span>TARGET:</span>\n            <strong>{formatCurrency(target_qd, 1)} TR</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-amber-500 to-orange-500 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-amber-100\">\n            DOANH THU TRẢ CHẬM\n          </span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {formatPercent(tg_pct, 0)}\n          </div>\n          <div className=\"text-[11px] text-amber-100 flex justify-between border-t border-amber-400/50 pt-2 mt-1\">\n            <span>DT TRẢ CHẬM:</span>\n            <strong>{formatCurrency(tragop, 1)} TR</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-sky-400 to-cyan-500 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-cyan-100\">LƯỢT KHÁCH / BILL</span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {bill}\n          </div>\n          <div className=\"text-[11px] text-cyan-100 flex justify-between border-t border-cyan-300/50 pt-2 mt-1\">\n            <span>BILL MÁY:</span>\n            <strong>{sl} món</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-purple-500 to-indigo-600 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-purple-100\">\n            % HT QĐ DỰ KIẾN\n          </span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {formatPercent(runrate_forecast, 0)}\n          </div>\n          <div className=\"text-[11px] text-purple-100 flex justify-between border-t border-purple-400/50 pt-2 mt-1\">\n            <span>DTQĐ DỰ KIẾN:</span>\n            <strong>{formatCurrency(forecast_val, 0)} TR</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-rose-500 to-pink-600 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-rose-100\">% QUY ĐỔI</span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {formatPercent(qd_pct, 0)}\n          </div>\n          <div className=\"text-[11px] text-rose-100 flex justify-between border-t border-rose-400/50 pt-2 mt-1\">\n            <span>MỤC TIÊU:</span>\n            <strong>150%</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-indigo-600 to-violet-700 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-indigo-100\">\n            THI ĐUA HOÀN THÀNH\n          </span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {htCount}/{storeTd.length}\n          </div>\n          <div className=\"text-[11px] text-indigo-100 flex justify-between border-t border-indigo-400/50 pt-2 mt-1\">\n            <span>TỶ LỆ MÔN:</span>\n            <strong>{storeTd.length > 0 ? formatPercent((htCount / storeTd.length) * 100, 0) : '0%'}</strong>\n          </div>\n        </div>\n\n        <div className=\"bg-gradient-to-br from-amber-600 to-amber-700 text-white rounded-2xl p-4 shadow-sm flex flex-col justify-between\">\n          <span className=\"text-[11px] font-bold uppercase tracking-wider text-amber-100\">\n            TĂNG/GIẢM CÙNG KỲ\n          </span>\n          <div className=\"text-3xl font-black my-2 tracking-tight\">\n            {vs3MonthPct >= 0 ? ' +' : ''}{vs3MonthPct.toFixed(1)}%\n          </div>\n          <div className=\"text-[11px] text-amber-100 flex justify-between border-t border-amber-500/50 pt-2 mt-1\">\n            <span>SO TB 3 THÁNG:</span>\n            <strong>{formatCurrency(tb3thang, 1)} TR</strong>\n          </div>\n        </div>\n      </div>\n\n      {/* Grid of Competition Cards */}\n      <div className=\"grid grid-cols-1 md:grid-cols-2 gap-3.5\">\n        {storeTd.map((r, idx) => {\n          const ten = r['CHƯƠNG TRÌNH'] || '';\n          const pct = parseFloat(String(r['% HT THÁNG'])) || 0;\n          const dt = parseFloat(String(r['DOANH THU (TR)'])) || 0;\n          const dtqd = parseFloat(String(r['DT QUY ĐỔI (TR)'])) || 0;\n          const sl = parseFloat(String(r['SỐ LƯỢNG'])) || 0;\n          const tg = parseFloat(String(r['TARGET (TR/SL theo LOẠI TĐ)'])) || 0;\n          const loai = Number(r['LOẠI TĐ']);\n\n          let displayVal = `${dt.toFixed(0)}/${tg.toFixed(0)}`;\n          let tag = 'DTLK';\n          if (loai === 2) {\n            displayVal = `${sl}/${tg}`;\n            tag = 'SLLK';\n          } else if (loai === 3) {\n            displayVal = `${dtqd.toFixed(0)}/${tg.toFixed(0)}`;\n            tag = 'DTQĐ';\n          }\n\n          const remain = Math.max(0, tg - (loai === 2 ? sl : loai === 3 ? dtqd : dt));\n\n          let badgeColor = 'bg-rose-50 text-rose-700 border-rose-200';\n          let barColor = 'bg-rose-500';\n          if (pct >= 100) {\n            badgeColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';\n            barColor = 'bg-emerald-500';\n          } else if (pct >= 70) {\n            badgeColor = 'bg-amber-50 text-amber-700 border-amber-200';\n            barColor = 'bg-amber-500';\n          }\n\n          return (\n            <div\n              key={idx}\n              onClick={() => onOpenProgramDetail(activeStore === '10341' ? 'TopZone' : 'TGDĐ', r['MÃ CHƯƠNG TRÌNH'], ten)}\n              title=\"Bấm để xem chi tiết nhân viên bán môn này\"\n              className=\"bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs hover:border-blue-500 hover:shadow-md cursor-pointer transition space-y-2.5\"\n            >\n              <div className=\"flex items-center justify-between\">\n                <h5 className=\"font-bold text-slate-800 text-xs truncate max-w-[220px]\" title={ten}>\n                  {formatProgramName(ten)}\n                </h5>\n                <span className={`px-2 py-0.5 rounded-lg text-xs font-black border ${badgeColor}`}>\n                  {formatPercent(pct, 0)}\n                </span>\n              </div>\n\n              <div className=\"w-full bg-slate-100 h-2 rounded-full overflow-hidden\">\n                <div\n                  className={`${barColor} h-full rounded-full transition-all duration-500`}\n                  style={{ width: `${Math.min(Math.max(pct, 0), 100)}%` }}\n                ></div>\n              </div>\n\n              <div className=\"flex items-center justify-between text-[11px] text-slate-500 pt-0.5\">\n                <span>\n                  {tag}: <strong className=\"text-slate-800 font-bold\">{displayVal}</strong>\n                </span>\n                <span className=\"text-slate-400\">\n                  Còn: <b className=\"text-slate-700 font-bold\">{remain.toFixed(0)}</b>\n                </span>\n              </div>\n            </div>\n          );\n        })}\n      </div>\n    </div>\n  );\n};\n","src/views/DuBaoView.tsx":"import React, { useState, useEffect } from 'react';\nimport { Camera, TrendingUp, Calendar, AlertCircle } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatPercent } from '../utils/formatters';\nimport { calculateForecast } from '../utils/forecastEngine';\n\ninterface DuBaoViewProps {\n  appData: AppDataState;\n  onExportTab: () => void;\n}\n\nexport const DuBaoView: React.FC<DuBaoViewProps> = ({ appData, onExportTab }) => {\n  // Dữ liệu DT lũy kế của BI chỉ chốt đến hết NGÀY HÔM QUA.\n  // Vì vậy ngày hiện tại không được tính là ngày đã qua: 12/09 => 11 ngày đã qua.\n  // Có thể kéo thanh để mô phỏng kịch bản; giá trị mô phỏng sẽ được giữ nguyên trong ngày.\n  const getCurrentMonthProgress = () => {\n    const now = new Date();\n    const total = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();\n    const elapsed = Math.max(0, Math.min(total, now.getDate() - 1));\n    return { day: elapsed, total };\n  };\n\n  const initialProgress = getCurrentMonthProgress();\n  const [daysPassed, setDaysPassed] = useState<number>(initialProgress.day);\n  const [totalDays, setTotalDays] = useState<number>(initialProgress.total);\n  \n  // Tự đồng bộ lại khi sang ngày mới. Trong cùng một ngày vẫn cho phép anh kéo\n  // thanh để mô phỏng các kịch bản nếu cần.\n  useEffect(() => {\n    const syncCalendarProgress = () => {\n      const progress = getCurrentMonthProgress();\n      setDaysPassed(prev => {\n        // Chỉ tự chuyển sang ngày mới nếu state đang bám theo ngày thực tế hôm qua.\n        // Ví dụ: ngày 12/09 state = 11; sang 13/09 sẽ tự thành 12.\n        const actualElapsed = Math.max(0, new Date().getDate() - 1);\n        const previousElapsed = Math.max(0, actualElapsed - 1);\n        return prev === previousElapsed ? actualElapsed : prev;\n      });\n      setTotalDays(progress.total);\n    };\n\n    const timer = window.setInterval(syncCalendarProgress, 60 * 1000);\n    return () => window.clearInterval(timer);\n  }, []);\n  const [stretchGoalPct, setStretchGoalPct] = useState<number>(100);\n\n  const lk = appData.dt_luyke || [];\n  const shopRows = lk.filter(r => String(r['MÃ ĐƠN VỊ'] || '').trim() && !/^t[oổ]ng/i.test(String(r['TÊN ĐƠN VỊ'] || '')));\n  const rowAar = shopRows[0] || {};\n  const rowTgd = shopRows[1] || {};\n\n  const aar_dtqd = parseFloat(String(rowAar['DOANH THU QĐ (TR)'])) || 0;\n  const aar_target = parseFloat(String(rowAar['TARGET QĐ (TR)'])) || parseFloat(String(rowAar['TARGET (TR)'])) || 0;\n\n  const tgd_dtqd = parseFloat(String(rowTgd['DOANH THU QĐ (TR)'])) || 0;\n  const tgd_target = parseFloat(String(rowTgd['TARGET QĐ (TR)'])) || parseFloat(String(rowTgd['TARGET (TR)'])) || 0;\n\n  const remainingDays = Math.max(1, totalDays - daysPassed);\n\n  // Simulation calculations\n  const calcSim = (current: number, target: number) => {\n    const adjustedTarget = target * (stretchGoalPct / 100);\n    const forecastResult = calculateForecast(current, target, daysPassed, totalDays, stretchGoalPct);\n    const forecast = forecastResult.forecast;\n    const gap = Math.max(0, adjustedTarget - current);\n    const neededPerDay = gap / remainingDays;\n    const currentRunRate = daysPassed > 0 ? current / daysPassed : 0;\n    const runRateGap = neededPerDay - currentRunRate;\n    const expectedPct = target > 0 ? (forecast / target * 100) : 0;\n\n    return {\n      forecast,\n      gap,\n      neededPerDay,\n      currentRunRate,\n      runRateGap,\n      expectedPct,\n      adjustedTarget,\n    };\n  };\n\n  const aarSim = calcSim(aar_dtqd, aar_target);\n  const tgdSim = calcSim(tgd_dtqd, tgd_target);\n\n  const cum_dtqd = aar_dtqd + tgd_dtqd;\n  const cum_target = aar_target + tgd_target;\n  const cumSim = calcSim(cum_dtqd, cum_target);\n\n  return (\n    <div className=\"space-y-6\">\n      {/* 1. Header Bar */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div>\n          <h3 className=\"font-black text-slate-900 text-lg uppercase tracking-tight flex items-center gap-2\">\n            <TrendingUp className=\"w-5 h-5 text-emerald-600\" />\n            <span>MÔ PHỎNG DỰ BÁO DOANH THU & KẾ HOẠCH BỨT PHÁ</span>\n          </h3>\n          <p className=\"text-xs text-slate-500 font-medium\">\n            Tính toán Run-rate chuẩn, dự báo cuối tháng và target doanh thu cần chạy từng ngày\n          </p>\n        </div>\n\n        <div className=\"flex items-center gap-3\">\n          <button\n            onClick={onExportTab}\n            className=\"px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-xs transition cursor-pointer\"\n          >\n            <Camera className=\"w-3.5 h-3.5\" />\n            <span>Xuất ảnh</span>\n          </button>\n        </div>\n      </div>\n\n      {/* 2. Simulation Sliders / Config Panel */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n        <h4 className=\"font-extrabold text-slate-900 text-xs uppercase flex items-center gap-1.5\">\n          <Calendar className=\"w-4 h-4 text-blue-600\" />\n          <span>Thông Số Kế Hoạch & Tiến Độ Tháng</span>\n        </h4>\n\n        <div className=\"grid grid-cols-1 sm:grid-cols-3 gap-5\">\n          <div>\n            <div className=\"flex justify-between text-xs font-bold text-slate-700 mb-1\">\n              <span>Số ngày đã qua:</span>\n              <span className=\"text-blue-600 font-black\">{daysPassed} ngày</span>\n            </div>\n            <input\n              type=\"range\"\n              min=\"1\"\n              max={totalDays}\n              value={daysPassed}\n              onChange={(e) => setDaysPassed(parseInt(e.target.value))}\n              className=\"w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600\"\n            />\n            <span className=\"text-[10px] text-slate-400\">Tiến độ thời gian: {((daysPassed / totalDays) * 100).toFixed(1)}%</span>\n          </div>\n\n          <div>\n            <div className=\"flex justify-between text-xs font-bold text-slate-700 mb-1\">\n              <span>Tổng số ngày trong tháng:</span>\n              <span className=\"text-slate-900 font-black\">{totalDays} ngày</span>\n            </div>\n            <input\n              type=\"range\"\n              min=\"28\"\n              max=\"31\"\n              value={totalDays}\n              onChange={(e) => setTotalDays(parseInt(e.target.value))}\n              className=\"w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600\"\n            />\n            <span className=\"text-[10px] text-slate-400\">Còn lại: {remainingDays} ngày để về đích</span>\n          </div>\n\n          <div>\n            <div className=\"flex justify-between text-xs font-bold text-slate-700 mb-1\">\n              <span>Mục tiêu phấn đấu (Stretch Goal):</span>\n              <span className=\"text-emerald-600 font-black\">{stretchGoalPct}% Target</span>\n            </div>\n            <input\n              type=\"range\"\n              min=\"90\"\n              max=\"130\"\n              step=\"5\"\n              value={stretchGoalPct}\n              onChange={(e) => setStretchGoalPct(parseInt(e.target.value))}\n              className=\"w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-600\"\n            />\n            <span className=\"text-[10px] text-slate-400\">Điều chỉnh chỉ tiêu thưởng bứt phá</span>\n          </div>\n        </div>\n      </div>\n\n      {/* 3. Three Forecast Comparison Cards */}\n      <div className=\"grid grid-cols-1 md:grid-cols-3 gap-5\">\n        {/* TỔNG CỤM */}\n        <div className=\"bg-slate-900 text-white rounded-2xl p-5 shadow-sm space-y-4\">\n          <div className=\"flex justify-between items-center pb-2 border-b border-slate-800\">\n            <div>\n              <span className=\"text-[10px] font-bold text-amber-400 uppercase\">★ TOÀN CỤM 933</span>\n              <h4 className=\"text-base font-black\">Tổng Cụm Siêu Thị</h4>\n            </div>\n            <span className=\"text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300\">\n              {daysPassed}/{totalDays} ngày\n            </span>\n          </div>\n\n          <div className=\"space-y-2.5 text-xs\">\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-400\">DT QĐ Hiện Tại:</span>\n              <span className=\"font-mono font-bold\">{formatCurrency(cum_dtqd)} Tr</span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-400\">Target Mục Tiêu:</span>\n              <span className=\"font-mono font-bold\">{formatCurrency(cumSim.adjustedTarget)} Tr</span>\n            </div>\n            <div className=\"flex justify-between items-baseline pt-1 border-t border-slate-800\">\n              <span className=\"text-slate-400\">Dự Báo Cuối Tháng:</span>\n              <span className=\"text-lg font-black text-amber-300 font-mono\">\n                {formatCurrency(cumSim.forecast)} Tr\n              </span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-400\">% Dự Báo HT:</span>\n              <span className={`font-black ${cumSim.expectedPct >= 100 ? 'text-emerald-400' : 'text-rose-400'}`}>\n                {formatPercent(cumSim.expectedPct)}\n              </span>\n            </div>\n            <div className=\"p-3 bg-slate-800/80 rounded-xl space-y-1 mt-2\">\n              <span className=\"text-[10.5px] text-slate-400 uppercase block font-bold\">\n                🎯 TARGET CẦN CHẠY MỖI NGÀY\n              </span>\n              <span className=\"text-xl font-black text-rose-300 block font-mono\">\n                {formatCurrency(cumSim.neededPerDay)} Tr/ngày\n              </span>\n              <span className=\"text-[10px] text-slate-400 block\">\n                (Hiện đang chạy: {formatCurrency(cumSim.currentRunRate)} Tr/ngày)\n              </span>\n            </div>\n          </div>\n        </div>\n\n        {/* TGD NHT */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex justify-between items-center pb-2 border-b border-slate-100\">\n            <div>\n              <span className=\"text-[10px] font-bold text-amber-600 uppercase\">933</span>\n              <h4 className=\"text-base font-black text-slate-900\">TGD NHT</h4>\n            </div>\n            <span className=\"text-xs font-bold px-2 py-0.5 rounded bg-amber-50 text-amber-800 border border-amber-200\">\n              {formatPercent(tgd_target > 0 ? (tgd_dtqd / tgd_target * 100) : 0)} HT\n            </span>\n          </div>\n\n          <div className=\"space-y-2.5 text-xs\">\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">DT QĐ Hiện Tại:</span>\n              <span className=\"font-mono font-bold text-slate-800\">{formatCurrency(tgd_dtqd)} Tr</span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">Target Mục Tiêu:</span>\n              <span className=\"font-mono font-bold text-slate-600\">{formatCurrency(tgdSim.adjustedTarget)} Tr</span>\n            </div>\n            <div className=\"flex justify-between items-baseline pt-1 border-t border-slate-100\">\n              <span className=\"text-slate-500\">Dự Báo Cuối Tháng:</span>\n              <span className=\"text-lg font-black text-blue-600 font-mono\">\n                {formatCurrency(tgdSim.forecast)} Tr\n              </span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">% Dự Báo HT:</span>\n              <span className={`font-black ${tgdSim.expectedPct >= 100 ? 'text-emerald-600' : 'text-rose-600'}`}>\n                {formatPercent(tgdSim.expectedPct)}\n              </span>\n            </div>\n            <div className=\"p-3 bg-amber-50/70 border border-amber-200 rounded-xl space-y-1 mt-2\">\n              <span className=\"text-[10.5px] text-amber-800 uppercase block font-bold\">\n                🎯 CẦN CHẠY MỖI NGÀY\n              </span>\n              <span className=\"text-xl font-black text-rose-600 block font-mono\">\n                {formatCurrency(tgdSim.neededPerDay)} Tr/ngày\n              </span>\n              <span className=\"text-[10px] text-slate-500 block\">\n                (Hiện tại: {formatCurrency(tgdSim.currentRunRate)} Tr/ngày)\n              </span>\n            </div>\n          </div>\n        </div>\n\n        {/* AAR NHT */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex justify-between items-center pb-2 border-b border-slate-100\">\n            <div>\n              <span className=\"text-[10px] font-bold text-blue-600 uppercase\">10341</span>\n              <h4 className=\"text-base font-black text-slate-900\">AAR NHT (TopZone)</h4>\n            </div>\n            <span className=\"text-xs font-bold px-2 py-0.5 rounded bg-blue-50 text-blue-800 border border-blue-200\">\n              {formatPercent(aar_target > 0 ? (aar_dtqd / aar_target * 100) : 0)} HT\n            </span>\n          </div>\n\n          <div className=\"space-y-2.5 text-xs\">\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">DT QĐ Hiện Tại:</span>\n              <span className=\"font-mono font-bold text-slate-800\">{formatCurrency(aar_dtqd)} Tr</span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">Target Mục Tiêu:</span>\n              <span className=\"font-mono font-bold text-slate-600\">{formatCurrency(aarSim.adjustedTarget)} Tr</span>\n            </div>\n            <div className=\"flex justify-between items-baseline pt-1 border-t border-slate-100\">\n              <span className=\"text-slate-500\">Dự Báo Cuối Tháng:</span>\n              <span className=\"text-lg font-black text-blue-600 font-mono\">\n                {formatCurrency(aarSim.forecast)} Tr\n              </span>\n            </div>\n            <div className=\"flex justify-between\">\n              <span className=\"text-slate-500\">% Dự Báo HT:</span>\n              <span className={`font-black ${aarSim.expectedPct >= 100 ? 'text-emerald-600' : 'text-rose-600'}`}>\n                {formatPercent(aarSim.expectedPct)}\n              </span>\n            </div>\n            <div className=\"p-3 bg-blue-50/70 border border-blue-200 rounded-xl space-y-1 mt-2\">\n              <span className=\"text-[10.5px] text-blue-800 uppercase block font-bold\">\n                🎯 CẦN CHẠY MỖI NGÀY\n              </span>\n              <span className=\"text-xl font-black text-rose-600 block font-mono\">\n                {formatCurrency(aarSim.neededPerDay)} Tr/ngày\n              </span>\n              <span className=\"text-[10px] text-slate-500 block\">\n                (Hiện tại: {formatCurrency(aarSim.currentRunRate)} Tr/ngày)\n              </span>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/views/KpiCustomView.tsx":"import React, { useState } from 'react';\nimport { Settings, Plus, RotateCcw, ShieldCheck, Eye, EyeOff, Trash2, CheckCircle2, UserCheck, RefreshCw } from 'lucide-react';\nimport { PersonnelConfigMap, AppDataState } from '../types';\n\ninterface KpiCustomViewProps {\n  appData?: AppDataState;\n  onUpdateAppData?: (newAppData: AppDataState) => void;\n  personnelConfig: PersonnelConfigMap;\n  onUpdateConfig: (newConfig: PersonnelConfigMap) => void;\n  onResetDefault: () => void;\n}\n\nexport const KpiCustomView: React.FC<KpiCustomViewProps> = ({\n  appData,\n  onUpdateAppData,\n  personnelConfig,\n  onUpdateConfig,\n  onResetDefault,\n}) => {\n  const [activeStore, setActiveStore] = useState<'TGDD' | 'TOPZONE'>('TGDD');\n  const [newStaffName, setNewStaffName] = useState<string>('');\n  const [toastMsg, setToastMsg] = useState<string>('');\n  const [isDivideMenuOpen, setIsDivideMenuOpen] = useState<boolean>(false);\n\n  const showToast = (msg: string) => {\n    setToastMsg(msg);\n    setTimeout(() => setToastMsg(''), 2500);\n  };\n\n  const currentStoreConfigs: Record<string, any> = personnelConfig[activeStore] || {};\n  const staffList = Object.entries(currentStoreConfigs).map(([name, cfg]) => {\n    const c = (cfg || {}) as { isOfficial?: boolean; isVisible?: boolean; targetPct?: number };\n    return {\n      name,\n      isOfficial: c.isOfficial === true,\n      isVisible: c.isVisible !== false,\n      targetPct: c.targetPct ?? (activeStore === 'TGDD' ? 37.5 : 25.0),\n    };\n  });\n\n  // Helper to match staff row across Excel tables\n  const isMatchingStaffRow = (r: any, targetName: string) => {\n    const fields = [\n      r['ĐƠN VỊ / NHÂN VIÊN'],\n      r['TÊN NHÂN VIÊN'],\n      r['Nhân viên'],\n      r['Họ và tên'],\n      r['MÃ NV'],\n      r['Mã NV'],\n      r['MÃ NHÂN VIÊN'],\n    ];\n\n    const normTarget = targetName.trim().toLowerCase();\n    const parenMatch = targetName.match(/\\((\\d+)\\)/);\n    const codeInParen = parenMatch ? parenMatch[1] : '';\n    const cleanTarget = targetName.replace(/\\(\\d+\\)/g, '').trim().toLowerCase();\n\n    return fields.some(f => {\n      if (!f) return false;\n      const str = String(f).trim().toLowerCase();\n      if (str === normTarget || str === cleanTarget) return true;\n      if (cleanTarget && cleanTarget.length >= 3 && str.includes(cleanTarget)) return true;\n      if (codeInParen && str.includes(codeInParen)) return true;\n      return false;\n    });\n  };\n\n  const handleToggleOfficial = (name: string) => {\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    if (!next[activeStore][name]) next[activeStore][name] = {};\n    const curr = next[activeStore][name].isOfficial === true;\n    next[activeStore][name].isOfficial = !curr;\n    onUpdateConfig(next);\n    showToast(`Đã chuyển nhân sự ${name} sang ${!curr ? 'Nội bộ' : 'Hỗ trợ'}`);\n  };\n\n  const handleToggleVisible = (name: string) => {\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    if (!next[activeStore][name]) next[activeStore][name] = {};\n    const curr = next[activeStore][name].isVisible !== false;\n    next[activeStore][name].isVisible = !curr;\n    onUpdateConfig(next);\n    showToast(`Đã ${!curr ? 'HIỆN' : 'ẨN'} nhân sự ${name}`);\n  };\n\n  const handleChangeTarget = (name: string, val: number) => {\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    if (!next[activeStore][name]) next[activeStore][name] = {};\n    next[activeStore][name].targetPct = val;\n    onUpdateConfig(next);\n  };\n\n  // Đồng bộ toàn bộ data khi xóa nhân sự\n  const handleDeleteStaff = (name: string) => {\n    if (\n      !window.confirm(\n        `Bạn có chắc muốn xóa nhân viên \"${name}\" khỏi danh sách? Thao tác này sẽ tự động loại bỏ và đồng bộ toàn bộ dữ liệu liên quan của nhân sự này khỏi tất cả các bảng dữ liệu hiện có.`\n      )\n    ) {\n      return;\n    }\n\n    // 1. Xóa khỏi Personnel Config\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (next[activeStore]) {\n      delete next[activeStore][name];\n      // Loại bỏ các key trùng hoặc tương tự\n      Object.keys(next[activeStore]).forEach(k => {\n        if (k.toLowerCase().trim() === name.toLowerCase().trim()) {\n          delete next[activeStore][k];\n        }\n      });\n    }\n\n    // 2. Tự động cân bằng lại tỷ lệ target cho các nhân sự nội bộ đang hiển thị\n    const remainingOfficials = Object.entries(next[activeStore] || {})\n      .map(([n, cfg]: [string, any]) => ({\n        name: n,\n        isOfficial: cfg?.isOfficial === true,\n        isVisible: cfg?.isVisible !== false,\n      }))\n      .filter(s => s.isOfficial);\n\n    if (remainingOfficials.length > 0) {\n      const equalPct = Math.round((100 / remainingOfficials.length) * 10) / 10;\n      remainingOfficials.forEach(s => {\n        if (next[activeStore][s.name]) {\n          next[activeStore][s.name].targetPct = equalPct;\n        }\n      });\n    }\n\n    onUpdateConfig(next);\n\n    // 3. Đồng bộ dọn sạch toàn bộ data trong AppDataState\n    if (appData && onUpdateAppData) {\n      const filterRows = (arr: any[]) => {\n        if (!arr) return [];\n        return arr.filter(r => !isMatchingStaffRow(r, name));\n      };\n\n      const newAppData: AppDataState = {\n        ...appData,\n        nv_tgdd: activeStore === 'TGDD' ? filterRows(appData.nv_tgdd || []) : appData.nv_tgdd,\n        nv_tz: activeStore === 'TOPZONE' ? filterRows(appData.nv_tz || []) : appData.nv_tz,\n        dt_nv_luyke: filterRows(appData.dt_nv_luyke || []),\n        dt_nv_realtime: filterRows(appData.dt_nv_realtime || []),\n      };\n\n      onUpdateAppData(newAppData);\n    }\n\n    showToast(`Đã xóa ${name} và đồng bộ toàn bộ data thành công!`);\n  };\n\n  // Đồng bộ toàn diện dữ liệu đang có với danh sách cấu hình\n  const handleSyncAllData = () => {\n    if (!appData || !onUpdateAppData) return;\n\n    // Lấy danh sách tên hợp lệ\n    const tgddNames = new Set(Object.keys(personnelConfig['TGDD'] || {}).map(n => n.toLowerCase().trim()));\n    const tzNames = new Set(Object.keys(personnelConfig['TOPZONE'] || {}).map(n => n.toLowerCase().trim()));\n\n    const isMatchSet = (r: any, nameSet: Set<string>) => {\n      const fields = [\n        r['ĐƠN VỊ / NHÂN VIÊN'],\n        r['TÊN NHÂN VIÊN'],\n        r['Nhân viên'],\n        r['Họ và tên'],\n      ];\n      return fields.some(f => {\n        if (!f) return false;\n        const str = String(f).toLowerCase().trim();\n        return [...nameSet].some(n => str.includes(n) || n.includes(str));\n      });\n    };\n\n    const newAppData: AppDataState = {\n      ...appData,\n      nv_tgdd: (appData.nv_tgdd || []).filter(r => isMatchSet(r, tgddNames)),\n      nv_tz: (appData.nv_tz || []).filter(r => isMatchSet(r, tzNames)),\n      dt_nv_luyke: (appData.dt_nv_luyke || []).filter(r => isMatchSet(r, tgddNames) || isMatchSet(r, tzNames)),\n      dt_nv_realtime: (appData.dt_nv_realtime || []).filter(r => isMatchSet(r, tgddNames) || isMatchSet(r, tzNames)),\n    };\n\n    onUpdateAppData(newAppData);\n    handleDivideEqually();\n    showToast('Đã đồng bộ toàn bộ dữ liệu nhân sự thành công!');\n  };\n\n  const handleShowAll = () => {\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    Object.keys(next[activeStore]).forEach(name => {\n      next[activeStore][name].isVisible = true;\n    });\n    onUpdateConfig(next);\n    showToast(`Đã hiện tất cả nhân viên siêu thị ${activeStore === 'TGDD' ? 'TGDĐ' : 'TopZone'}`);\n  };\n\n  // Chia đều tổng target của siêu thị cho toàn bộ nhân sự nội bộ đang hiển thị.\n  // Cho phép tổng phân bổ từ 100% đến 150% để phục vụ mục tiêu bứt phá.\n  const handleDivideEqually = (totalPct: number = 150) => {\n    const officials = staffList.filter(s => s.isOfficial);\n    if (officials.length === 0) {\n      showToast('Chưa có nhân sự nội bộ đang hiển thị để chia target!',);\n      setIsDivideMenuOpen(false);\n      return;\n    }\n\n    const safeTotal = Math.max(100, Math.min(150, Number(totalPct) || 100));\n    const roundedTotal = Math.round(safeTotal * 10) / 10;\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n\n    // Chia đến 0.1% và dồn phần lẻ vào người cuối để tổng luôn đúng 100–150%.\n    const base = Math.floor((roundedTotal / officials.length) * 10) / 10;\n    officials.forEach((staff, index) => {\n      const pct = index === officials.length - 1\n        ? Math.round((roundedTotal - base * (officials.length - 1)) * 10) / 10\n        : base;\n      next[activeStore][staff.name].targetPct = pct;\n    });\n\n    Object.keys(next[activeStore]).forEach(name => {\n      const isOff = next[activeStore][name].isOfficial === true;\n      const isVis = next[activeStore][name].isVisible !== false;\n      if (!isOff || !isVis) next[activeStore][name].targetPct = 0;\n    });\n\n    onUpdateConfig(next);\n    setIsDivideMenuOpen(false);\n    showToast(`Đã chia đều ${roundedTotal}% target siêu thị cho ${officials.length} nhân sự nội bộ`);\n  };\n\n  const handleAddStaff = () => {\n    if (!newStaffName.trim()) return;\n    const name = newStaffName.trim();\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[activeStore]) next[activeStore] = {};\n    next[activeStore][name] = {\n      isOfficial: true,\n      isVisible: true,\n      targetPct: activeStore === 'TGDD' ? 37.5 : 25.0,\n    };\n    onUpdateConfig(next);\n    setNewStaffName('');\n    showToast(`Đã thêm nhân viên mới: ${name}`);\n  };\n\n  // Calculate total target percentage\n  const officialVisibleCount = staffList.filter(s => s.isOfficial).length;\n  const totalTargetPct = officialVisibleCount > 0 ? 150 : 0;\n\n  return (\n    <div className=\"space-y-6\">\n      {/* Toast Alert */}\n      {toastMsg && (\n        <div className=\"fixed top-5 right-5 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-bold flex items-center gap-2 border border-slate-700 animate-in fade-in\">\n          <CheckCircle2 className=\"w-4 h-4 text-emerald-400\" />\n          <span>{toastMsg}</span>\n        </div>\n      )}\n\n      {/* 1. Header */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div>\n          <h3 className=\"font-black text-slate-900 text-lg uppercase tracking-tight flex items-center gap-2\">\n            <Settings className=\"w-5 h-5 text-indigo-600\" />\n            <span>THIẾT LẬP NHÂN SỰ & CHỈ TIÊU KPI GIAO VIỆC</span>\n          </h3>\n          <p className=\"text-xs text-slate-500 font-medium\">\n            Quản lý danh sách nhân sự chính thức, tỷ lệ phân bổ KPI theo siêu thị và ẩn/hiện nhân viên\n          </p>\n        </div>\n\n        <div className=\"flex items-center gap-3\">\n          <div className=\"flex rounded-xl bg-slate-100 p-1 text-xs font-bold shadow-inner\">\n            <button\n              onClick={() => setActiveStore('TGDD')}\n              className={`px-4 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                activeStore === 'TGDD' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              TGD NHT (Shop 933)\n            </button>\n            <button\n              onClick={() => setActiveStore('TOPZONE')}\n              className={`px-4 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                activeStore === 'TOPZONE' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              AAR NHT (Shop 10341)\n            </button>\n          </div>\n\n          <button\n            onClick={onResetDefault}\n            className=\"px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold flex items-center gap-1.5 transition cursor-pointer\"\n            title=\"Khôi phục danh sách nhân sự mặc định ban đầu\"\n          >\n            <RotateCcw className=\"w-3.5 h-3.5\" />\n            <span>Mặc định</span>\n          </button>\n        </div>\n      </div>\n\n      {/* 2. Target allocation summary banner & Actions */}\n      <div className=\"bg-indigo-50/80 border border-indigo-200 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3\">\n        <div className=\"flex items-center space-x-3\">\n          <ShieldCheck className=\"w-6 h-6 text-indigo-600 flex-shrink-0\" />\n          <div>\n            <h4 className=\"font-extrabold text-indigo-950 text-xs uppercase\">\n              TỔNG TARGET NHÂN SỰ: {totalTargetPct.toFixed(1)}% TARGET SIÊU THỊ\n            </h4>\n            <p className=\"text-[11px] text-indigo-700\">\n              {officialVisibleCount > 0\n                ? `✓ Target nhân sự cố định 150% và chia theo ${officialVisibleCount} nhân sự chính thức.`\n                : '⚠️ Chưa có nhân sự chính thức để tính target.'}\n            </p>\n          </div>\n        </div>\n\n        <div className=\"flex flex-wrap items-center gap-2\">\n          <button\n            onClick={handleSyncAllData}\n            className=\"px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition cursor-pointer shadow-xs whitespace-nowrap flex items-center gap-1.5\"\n            title=\"Đồng bộ toàn bộ data Excel hiện có theo cấu hình nhân sự\"\n          >\n            <RefreshCw className=\"w-3.5 h-3.5\" />\n            <span>Đồng Bộ Data</span>\n          </button>\n          <div className=\"relative\">\n            <button\n              type=\"button\"\n              onClick={() => setIsDivideMenuOpen(v => !v)}\n              className=\"px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition cursor-pointer shadow-xs whitespace-nowrap\"\n              title=\"Chia đều 150% target siêu thị cho nhân sự nội bộ\"\n            >\n              ⚡ Chia Đều 150%\n            </button>\n\n            {isDivideMenuOpen && (\n              <div className=\"absolute right-0 top-full mt-2 z-40 w-72 bg-white border border-indigo-200 rounded-2xl shadow-xl p-3\">\n                <div className=\"mb-2.5\">\n                  <div className=\"text-xs font-black text-slate-900\">CHIA ĐỀU TARGET SIÊU THỊ</div>\n                  <div className=\"text-[10px] text-slate-500 mt-0.5\">Target nhân sự được cố định ở 150% target siêu thị và chia đều cho nhân sự chính thức.</div>\n                </div>\n                <div className=\"grid grid-cols-3 gap-2\">\n                  {[150].map((pct) => (\n                    <button\n                      key={pct}\n                      type=\"button\"\n                      onClick={() => handleDivideEqually(pct)}\n                      className={`px-2 py-2 rounded-xl text-xs font-black border transition cursor-pointer ${\n                        Math.abs(totalTargetPct - pct) < 0.5\n                          ? 'bg-indigo-600 text-white border-indigo-600'\n                          : 'bg-indigo-50 text-indigo-700 border-indigo-100 hover:bg-indigo-100'\n                      }`}\n                    >\n                      {pct}%\n                    </button>\n                  ))}\n                </div>\n                <div className=\"mt-2.5 pt-2 border-t border-slate-100 text-[10px] text-slate-500\">\n                  Ví dụ 4 nhân sự: 150% → 37,5%/người. Ví dụ 6 nhân sự: 150% → 25%/người.\n                </div>\n              </div>\n            )}\n          </div>\n          <button\n            onClick={handleShowAll}\n            className=\"px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition cursor-pointer shadow-xs whitespace-nowrap flex items-center gap-1\"\n          >\n            <Eye className=\"w-3.5 h-3.5\" />\n            <span>Hiện Tất Cả</span>\n          </button>\n        </div>\n      </div>\n\n      {/* 3. Add personnel mini form */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-4 shadow-xs flex flex-wrap items-center gap-3\">\n        <span className=\"text-xs font-extrabold text-slate-800 uppercase flex items-center gap-1.5\">\n          <Plus className=\"w-4 h-4 text-blue-600\" />\n          <span>Thêm Nhân Viên Mới:</span>\n        </span>\n        <input\n          type=\"text\"\n          value={newStaffName}\n          onChange={(e) => setNewStaffName(e.target.value)}\n          placeholder=\"Nhập họ và tên nhân viên...\"\n          className=\"text-xs px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none w-56 font-semibold\"\n          onKeyDown={(e) => {\n            if (e.key === 'Enter') handleAddStaff();\n          }}\n        />\n        <button\n          onClick={handleAddStaff}\n          className=\"px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition cursor-pointer shadow-xs\"\n        >\n          + Thêm vào danh sách\n        </button>\n      </div>\n\n      {/* 4. Personnel table */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3\">\n        <div className=\"flex items-center justify-between\">\n          <h4 className=\"font-extrabold text-slate-900 text-xs uppercase\">\n            Danh Sách Nhân Sự {activeStore === 'TGDD' ? 'TGD NHT' : 'AAR NHT (TopZone)'} ({staffList.length} người)\n          </h4>\n          <span className=\"text-[11px] text-slate-500 font-medium\">\n            Bấm nút 👁️ để Ẩn/Hiện nhân viên | Bấm nút Trạng thái để đổi Nội bộ / Hỗ trợ | Target nhân sự = 150% target siêu thị\n          </span>\n        </div>\n\n        <div className=\"overflow-x-auto custom-scroll\">\n          <table className=\"w-full text-left text-xs border-collapse\">\n            <thead className=\"bg-slate-900 text-white font-bold text-[11px]\">\n              <tr>\n                <th className=\"py-2.5 px-3 text-center w-12\">#</th>\n                <th className=\"py-2.5 px-4\">HỌ VÀ TÊN</th>\n                <th className=\"py-2.5 px-4 text-center\">LOẠI NHÂN SỰ</th>\n                <th className=\"py-2.5 px-4 text-center\">ẨN / HIỆN</th>\n                <th className=\"py-2.5 px-4 text-center\">TỶ TRỌNG KPI 150%</th>\n                <th className=\"py-2.5 px-3 text-center w-16\">XÓA</th>\n              </tr>\n            </thead>\n            <tbody className=\"divide-y divide-slate-100 font-semibold text-slate-700\">\n              {staffList.map((staff, idx) => (\n                <tr\n                  key={idx}\n                  className={`hover:bg-slate-50 transition border-b border-slate-100 ${\n                    !staff.isVisible ? 'bg-rose-50/20 opacity-70' : ''\n                  }`}\n                >\n                  <td className=\"py-3 px-3 text-center text-slate-400\">{idx + 1}</td>\n                  <td className=\"py-3 px-4 font-bold text-slate-900\">\n                    <span className={staff.isVisible ? '' : 'line-through text-slate-400'}>\n                      {staff.name}\n                    </span>\n                    {!staff.isVisible && (\n                      <span className=\"ml-2 text-[10px] font-bold text-rose-500 bg-rose-50 px-1.5 py-0.5 rounded\">\n                        Đang ẩn\n                      </span>\n                    )}\n                  </td>\n                  <td className=\"py-3 px-4 text-center\">\n                    <button\n                      type=\"button\"\n                      onClick={() => handleToggleOfficial(staff.name)}\n                      className={`px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer transition shadow-2xs ${\n                        staff.isOfficial\n                          ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200'\n                          : 'bg-slate-100 text-slate-600 hover:bg-slate-200'\n                      }`}\n                    >\n                      {staff.isOfficial ? '✓ Nội bộ (KPI)' : 'Hỗ trợ'}\n                    </button>\n                  </td>\n                  <td className=\"py-3 px-4 text-center\">\n                    <button\n                      type=\"button\"\n                      onClick={() => handleToggleVisible(staff.name)}\n                      className={`px-3 py-1.5 rounded-xl text-xs font-extrabold cursor-pointer transition shadow-2xs flex items-center gap-1.5 mx-auto ${\n                        staff.isVisible\n                          ? 'bg-emerald-50 border border-emerald-200 text-emerald-700 hover:bg-emerald-100'\n                          : 'bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100'\n                      }`}\n                    >\n                      {staff.isVisible ? (\n                        <>\n                          <Eye className=\"w-3.5 h-3.5\" />\n                          <span>Đang hiện</span>\n                        </>\n                      ) : (\n                        <>\n                          <EyeOff className=\"w-3.5 h-3.5\" />\n                          <span>Đã ẩn</span>\n                        </>\n                      )}\n                    </button>\n                  </td>\n                  <td className=\"py-3 px-4 text-center\">\n                    <div className=\"flex items-center justify-center gap-2\">\n                      <input\n                        type=\"number\"\n                        min=\"0\"\n                        max=\"150\"\n                        step=\"0.1\"\n                        disabled={!staff.isOfficial}\n                        value={staff.isOfficial ? (150 / Math.max(1, officialVisibleCount)).toFixed(1) : 0}\n                        readOnly\n                        className=\"w-20 text-center text-xs font-bold border border-slate-200 rounded-lg py-1 px-1.5 focus:outline-none focus:ring-1 focus:ring-blue-500 disabled:opacity-40\"\n                      />\n                      <span className=\"font-bold text-slate-500\">%</span>\n                    </div>\n                  </td>\n                  <td className=\"py-3 px-3 text-center\">\n                    <button\n                      type=\"button\"\n                      onClick={() => handleDeleteStaff(staff.name)}\n                      className=\"p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition cursor-pointer\"\n                      title={`Xóa nhân viên ${staff.name}`}\n                    >\n                      <Trash2 className=\"w-4 h-4\" />\n                    </button>\n                  </td>\n                </tr>\n              ))}\n            </tbody>\n          </table>\n        </div>\n      </div>\n    </div>\n  );\n};\n\n","src/views/SoSanhView.tsx":"import React, { useState } from 'react';\nimport { Camera, ArrowRightLeft, Sparkles } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatPercent, formatProgramName } from '../utils/formatters';\n\ninterface SoSanhViewProps {\n  appData: AppDataState;\n  onExportTab: () => void;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n}\n\nexport const SoSanhView: React.FC<SoSanhViewProps> = ({\n  appData,\n  onExportTab,\n  onOpenProgramDetail,\n}) => {\n  const [compareMode, setCompareMode] = useState<'SHOPS' | 'TARGET'>('SHOPS');\n\n  const lk = appData.dt_luyke || [];\n  const shopRows = lk.filter(r => String(r['MÃ ĐƠN VỊ'] || '').trim() && !/^t[oổ]ng/i.test(String(r['TÊN ĐƠN VỊ'] || '')));\n  const rowAar = shopRows[0] || {};\n  const rowTgd = shopRows[1] || {};\n\n  const aar_dt = parseFloat(String(rowAar['DOANH THU (TR)'])) || 0;\n  const aar_dtqd = parseFloat(String(rowAar['DOANH THU QĐ (TR)'])) || 0;\n  const aar_tg = parseFloat(String(rowAar['TARGET QĐ (TR)'])) || parseFloat(String(rowAar['TARGET (TR)'])) || 0;\n  const aar_tgop = parseFloat(String(rowAar['DT TRẢ GÓP (TR)'])) || 0;\n  const aar_bill = parseFloat(String(rowAar['LƯỢT BILL (TẤT CẢ ST)'])) || 0;\n\n  const tgd_dt = parseFloat(String(rowTgd['DOANH THU (TR)'])) || 0;\n  const tgd_dtqd = parseFloat(String(rowTgd['DOANH THU QĐ (TR)'])) || 0;\n  const tgd_tg = parseFloat(String(rowTgd['TARGET QĐ (TR)'])) || parseFloat(String(rowTgd['TARGET (TR)'])) || 0;\n  const tgd_tgop = parseFloat(String(rowTgd['DT TRẢ GÓP (TR)'])) || 0;\n  const tgd_bill = parseFloat(String(rowTgd['LƯỢT BILL (TẤT CẢ ST)'])) || 0;\n\n  const td_lk = appData.td_luyke || [];\n  const tgdProgs = td_lk.filter(r => String(r['ĐƠN VỊ / NHÂN VIÊN']).includes('TGD'));\n  const aarProgs = td_lk.filter(r => String(r['ĐƠN VỊ / NHÂN VIÊN']).includes('AAR'));\n\n  const tgdDone = tgdProgs.filter(r => (parseFloat(String(r['% HT THÁNG'])) || 0) >= 100).length;\n  const aarDone = aarProgs.filter(r => (parseFloat(String(r['% HT THÁNG'])) || 0) >= 100).length;\n\n  return (\n    <div className=\"space-y-6\">\n      {/* 1. Header */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div>\n          <h3 className=\"font-black text-slate-900 text-lg uppercase tracking-tight flex items-center gap-2\">\n            <ArrowRightLeft className=\"w-5 h-5 text-blue-600\" />\n            <span>SO SÁNH HIỆU SUẤT VẬN HÀNH & THI ĐUA</span>\n          </h3>\n          <p className=\"text-xs text-slate-500 font-medium\">\n            Phân tích tỷ trọng, cơ cấu doanh thu và tương quan giữa các siêu thị trong Cụm 933\n          </p>\n        </div>\n\n        <div className=\"flex items-center gap-3\">\n          <div className=\"flex rounded-xl bg-slate-100 p-1 text-xs font-bold shadow-inner\">\n            <button\n              onClick={() => setCompareMode('SHOPS')}\n              className={`px-4 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                compareMode === 'SHOPS' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              Shop vs Shop (933 vs 10341)\n            </button>\n            <button\n              onClick={() => setCompareMode('TARGET')}\n              className={`px-4 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                compareMode === 'TARGET' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              Thực Tế vs Mục Tiêu\n            </button>\n          </div>\n\n          <button\n            onClick={onExportTab}\n            className=\"px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-xs transition cursor-pointer\"\n          >\n            <Camera className=\"w-3.5 h-3.5\" />\n            <span>Xuất ảnh</span>\n          </button>\n        </div>\n      </div>\n\n      {/* 2. Side-by-Side Comparison Cards */}\n      <div className=\"grid grid-cols-1 md:grid-cols-2 gap-5\">\n        {/* TGDĐ NHT */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex items-center justify-between pb-3 border-b border-slate-100\">\n            <div className=\"flex items-center space-x-2.5\">\n              <span className=\"w-8 h-8 rounded-xl bg-amber-500 text-white font-mono font-black text-xs flex items-center justify-center shadow-xs\">\n                933\n              </span>\n              <div>\n                <h4 className=\"font-extrabold text-slate-900 text-sm\">TGD NHT - 351 Nguyễn Hữu Thọ</h4>\n                <p className=\"text-[11px] text-slate-400\">Thế Giới Di Động đa ngành</p>\n              </div>\n            </div>\n            <span className=\"px-2.5 py-1 rounded-lg text-xs font-black bg-amber-50 text-amber-800 border border-amber-200\">\n              {tgd_tg > 0 ? formatPercent(tgd_dtqd / tgd_tg * 100) : '0%'} Target\n            </span>\n          </div>\n\n          <div className=\"space-y-3\">\n            <div className=\"flex justify-between items-center text-xs\">\n              <span className=\"text-slate-500\">Doanh Thu Thực:</span>\n              <strong className=\"text-slate-800 font-mono text-sm\">{formatCurrency(tgd_dt)} Tr</strong>\n            </div>\n            <div className=\"flex justify-between items-center text-xs\">\n              <span className=\"text-slate-500\">Doanh Thu Quy Đổi (QĐ):</span>\n              <strong className=\"text-indigo-600 font-mono text-base font-black\">\n                {formatCurrency(tgd_dtqd)} Tr\n              </strong>\n            </div>\n            <div className=\"flex justify-between items-center text-xs\">\n              <span className=\"text-slate-500\">Target QĐ Tháng:</span>\n              <strong className=\"text-slate-600 font-mono\">{formatCurrency(tgd_tg)} Tr</strong>\n            </div>\n            <div className=\"flex justify-between items-center text-xs\">\n              <span className=\"text-slate-500\">Doanh Thu Trả Góp:</span>\n              <strong className=\"text-purple-700 font-mono\">\n                {formatCurrency(tgd_tgop)} Tr ({tgd_dt > 0 ? formatPercent(tgd_tgop / tgd_dt * 100) : '0%'})\n              </strong>\n            </div>\n            <div className=\"flex justify-between items-center text-xs\">\n              <span className=\"text-slate-500\">Lượt Bill Khách:</span>\n              <strong className=\"text-slate-800 font-mono\">{tgd_bill} bill</strong>\n            </div>\n            <div className=\"flex justify-between items-center text-xs\">\n              <span className=\"text-slate-500\">Môn Thi Đua Đạt Target:</span>\n              <strong className=\"text-emerald-600 font-mono font-bold\">\n                {tgdDone} / {tgdProgs.length} môn\n              </strong>\n            </div>\n          </div>\n        </div>\n\n        {/* TopZone AAR NHT */}\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n          <div className=\"flex items-center justify-between pb-3 border-b border-slate-100\">\n            <div className=\"flex items-center space-x-2.5\">\n              <span className=\"w-8 h-8 rounded-xl bg-blue-600 text-white font-mono font-black text-xs flex items-center justify-center shadow-xs\">\n                10341\n              </span>\n              <div>\n                <h4 className=\"font-extrabold text-slate-900 text-sm\">AAR NHT - 351 Nguyễn Hữu Thọ</h4>\n                <p className=\"text-[11px] text-slate-400\">TopZone Apple Authorised Reseller</p>\n              </div>\n            </div>\n            <span className=\"px-2.5 py-1 rounded-lg text-xs font-black bg-blue-50 text-blue-800 border border-blue-200\">\n              {aar_tg > 0 ? formatPercent(aar_dtqd / aar_tg * 100) : '0%'} Target\n            </span>\n          </div>\n\n          <div className=\"space-y-3\">\n            <div className=\"flex justify-between items-center text-xs\">\n              <span className=\"text-slate-500\">Doanh Thu Thực:</span>\n              <strong className=\"text-slate-800 font-mono text-sm\">{formatCurrency(aar_dt)} Tr</strong>\n            </div>\n            <div className=\"flex justify-between items-center text-xs\">\n              <span className=\"text-slate-500\">Doanh Thu Quy Đổi (QĐ):</span>\n              <strong className=\"text-indigo-600 font-mono text-base font-black\">\n                {formatCurrency(aar_dtqd)} Tr\n              </strong>\n            </div>\n            <div className=\"flex justify-between items-center text-xs\">\n              <span className=\"text-slate-500\">Target QĐ Tháng:</span>\n              <strong className=\"text-slate-600 font-mono\">{formatCurrency(aar_tg)} Tr</strong>\n            </div>\n            <div className=\"flex justify-between items-center text-xs\">\n              <span className=\"text-slate-500\">Doanh Thu Trả Góp:</span>\n              <strong className=\"text-purple-700 font-mono\">\n                {formatCurrency(aar_tgop)} Tr ({aar_dt > 0 ? formatPercent(aar_tgop / aar_dt * 100) : '0%'})\n              </strong>\n            </div>\n            <div className=\"flex justify-between items-center text-xs\">\n              <span className=\"text-slate-500\">Lượt Bill Khách:</span>\n              <strong className=\"text-slate-800 font-mono\">{aar_bill} bill</strong>\n            </div>\n            <div className=\"flex justify-between items-center text-xs\">\n              <span className=\"text-slate-500\">Môn Thi Đua Đạt Target:</span>\n              <strong className=\"text-emerald-600 font-mono font-bold\">\n                {aarDone} / {aarProgs.length} môn\n              </strong>\n            </div>\n          </div>\n        </div>\n      </div>\n\n      {/* 3. Tương Quan Tỷ Trọng & Đóng Góp */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n        <h4 className=\"font-extrabold text-slate-900 text-xs uppercase\">\n          Tương Quan Đóng Góp Doanh Thu Toàn Cụm 933\n        </h4>\n\n        {(() => {\n          const tot_dt = aar_dt + tgd_dt;\n          const aarShare = tot_dt > 0 ? (aar_dt / tot_dt * 100) : 75;\n          const tgdShare = 100 - aarShare;\n\n          return (\n            <div className=\"space-y-2\">\n              <div className=\"flex justify-between text-xs font-bold text-slate-700\">\n                <span className=\"text-amber-800\">TGD NHT ({tgdShare.toFixed(1)}%)</span>\n                <span className=\"text-blue-800\">AAR NHT ({aarShare.toFixed(1)}%)</span>\n              </div>\n              <div className=\"w-full bg-slate-100 h-4 rounded-xl overflow-hidden flex shadow-inner\">\n                <div\n                  className=\"bg-amber-500 h-full flex items-center justify-center text-[10px] text-white font-bold transition-all duration-500\"\n                  style={{ width: `${tgdShare}%` }}\n                >\n                  {tgdShare.toFixed(0)}%\n                </div>\n                <div\n                  className=\"bg-blue-600 h-full flex items-center justify-center text-[10px] text-white font-bold transition-all duration-500\"\n                  style={{ width: `${aarShare}%` }}\n                >\n                  {aarShare.toFixed(0)}%\n                </div>\n              </div>\n            </div>\n          );\n        })()}\n      </div>\n    </div>\n  );\n};\n","src/views/SucKhoeCumView.tsx":"import React, { useState } from 'react';\nimport { Search } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatInt, formatPercent, formatProgramName } from '../utils/formatters';\n\ninterface SucKhoeCumViewProps {\n  appData: AppDataState;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n}\n\nexport const SucKhoeCumView: React.FC<SucKhoeCumViewProps> = ({\n  appData,\n  onOpenProgramDetail,\n}) => {\n  const [searchTerm, setSearchTerm] = useState<string>('');\n\n  const lk = appData.dt_luyke || [];\n  const td_lk = appData.td_luyke || [];\n\n  // Calculate cluster sums\n  let tot_target_qd = 0;\n  let tot_dt_qd = 0;\n  let tot_dt = 0;\n  let tot_tragop = 0;\n  let tot_bill = 0;\n\n  lk.forEach(r => {\n    tot_target_qd += parseFloat(String(r['TARGET QĐ (TR)'])) || 0;\n    tot_dt_qd += parseFloat(String(r['DOANH THU QĐ (TR)'])) || 0;\n    tot_dt += parseFloat(String(r['DOANH THU (TR)'])) || 0;\n    tot_tragop += parseFloat(String(r['DT TRẢ GÓP (TR)'])) || 0;\n    tot_bill += parseFloat(String(r['LƯỢT BILL (TẤT CẢ ST)'])) || 0;\n  });\n\n  const tot_pct_ht = tot_target_qd > 0 ? (tot_dt_qd / tot_target_qd * 100) : 0;\n  const tot_pct_qd = tot_dt > 0 ? (tot_dt_qd / tot_dt * 100) : 0;\n  const tot_pct_tg = tot_dt > 0 ? (tot_tragop / tot_dt * 100) : 0;\n\n  // Build cluster competition map\n  const progMap = new Map<string, any>();\n  td_lk.forEach(r => {\n    const name = r['CHƯƠNG TRÌNH'];\n    if (!name) return;\n    if (!progMap.has(name)) {\n      progMap.set(name, {\n        name,\n        displayName: formatProgramName(name),\n        aar_pct: null,\n        aar_dt: 0,\n        aar_tg: 0,\n        tgd_pct: null,\n        tgd_dt: 0,\n        tgd_tg: 0,\n        cum_pct: 0,\n        cum_sub: '',\n      });\n    }\n    const p = progMap.get(name);\n    const donvi = String(r['ĐƠN VỊ / NHÂN VIÊN'] || '');\n    const pct = parseFloat(String(r['% HT THÁNG'])) || 0;\n    const loai = Number(r['LOẠI TĐ']) || 3;\n    const dt = loai === 2 || loai === 6 ? (parseFloat(String(r['SỐ LƯỢNG'])) || 0) : (parseFloat(String(r['DT QUY ĐỔI (TR)'])) || parseFloat(String(r['DOANH THU (TR)'])) || 0);\n    const target = parseFloat(String(r['TARGET (TR/SL theo LOẠI TĐ)'])) || 0;\n\n    if (donvi.includes('AAR')) {\n      p.aar_pct = pct;\n      p.aar_dt = dt;\n      p.aar_tg = target;\n    } else if (donvi.includes('TGD')) {\n      p.tgd_pct = pct;\n      p.tgd_dt = dt;\n      p.tgd_tg = target;\n    }\n  });\n\n  let list = Array.from(progMap.values());\n  if (searchTerm) {\n    list = list.filter(\n      x =>\n        x.name.toLowerCase().includes(searchTerm.toLowerCase()) ||\n        x.displayName.toLowerCase().includes(searchTerm.toLowerCase())\n    );\n  }\n\n  list.forEach(p => {\n    const dtTot = (p.aar_dt || 0) + (p.tgd_dt || 0);\n    const tgTot = (p.aar_tg || 0) + (p.tgd_tg || 0);\n    p.cum_pct = tgTot > 0 ? (dtTot / tgTot * 100) : ((p.aar_pct || 0) + (p.tgd_pct || 0));\n    p.cum_sub = `${dtTot.toFixed(0)}/${tgTot.toFixed(0)}`;\n  });\n\n  list.sort((a, b) => b.cum_pct - a.cum_pct);\n\n  const half = Math.ceil(list.length / 2);\n  const list1 = list.slice(0, half);\n  const list2 = list.slice(half);\n\n  const renderSideProgTable = (items: any[]) => {\n    return items.map((item, idx) => {\n      const aarVal = item.aar_pct !== null ? `${item.aar_pct.toFixed(0)}%` : '-';\n      const tgdVal = item.tgd_pct !== null ? `${item.tgd_pct.toFixed(0)}%` : '-';\n      const cumVal = `${item.cum_pct.toFixed(0)}%`;\n\n      const aarClass =\n        item.aar_pct >= 100\n          ? 'bg-blue-50 text-blue-700 font-bold'\n          : item.aar_pct >= 50\n          ? 'bg-amber-50 text-amber-700 font-bold'\n          : item.aar_pct !== null\n          ? 'text-slate-600'\n          : 'text-slate-300';\n      const tgdClass =\n        item.tgd_pct >= 100\n          ? 'bg-blue-50 text-blue-700 font-bold'\n          : item.tgd_pct >= 50\n          ? 'bg-amber-50 text-amber-700 font-bold'\n          : item.tgd_pct !== null\n          ? 'text-slate-600'\n          : 'text-slate-300';\n\n      return (\n        <tr\n          key={idx}\n          onClick={() => onOpenProgramDetail('TGDD', '', item.name)}\n          title=\"Bấm để xem chi tiết nhân viên bán môn này\"\n          className=\"hover:bg-blue-50/60 cursor-pointer transition border-b border-slate-100\"\n        >\n          <td className=\"py-2.5 px-3 font-semibold text-slate-800 truncate max-w-[170px]\" title={item.name}>\n            {item.displayName}\n          </td>\n          <td className={`py-2.5 px-2 text-center text-xs ${aarClass}`}>{aarVal}</td>\n          <td className={`py-2.5 px-2 text-center text-xs ${tgdClass}`}>{tgdVal}</td>\n          <td className=\"py-2.5 px-2 text-center text-xs bg-slate-50 font-bold text-slate-900\">\n            <span>{cumVal}</span>\n            <span className=\"block text-[10px] text-slate-400 font-normal\">{item.cum_sub}</span>\n          </td>\n        </tr>\n      );\n    });\n  };\n\n  return (\n    <div className=\"space-y-6\">\n      {/* 1. BẢNG TỔNG HỢP DOANH THU CỤM */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n        <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-slate-100\">\n          <div>\n            <h3 className=\"font-extrabold text-slate-900 text-sm uppercase tracking-wide\">\n              BẢNG TỔNG HỢP DOANH THU CỤM SIÊU THỊ\n            </h3>\n            <p className=\"text-xs text-slate-500\">\n              Chi tiết Target QĐ, Doanh thu QĐ, % Hoàn thành, % Quy đổi, % Trả chậm, Lượt khách, Bill\n            </p>\n          </div>\n          <span className=\"text-xs font-bold text-slate-700 bg-slate-100 px-3 py-1 rounded-xl\">\n            LŨY KẾ THÁNG\n          </span>\n        </div>\n\n        <div className=\"overflow-x-auto custom-scroll\">\n          <table className=\"w-full text-left text-xs border-collapse\">\n            <thead className=\"bg-blue-600 text-white font-bold\">\n              <tr>\n                <th className=\"py-3 px-3 text-center\">STT</th>\n                <th className=\"py-3 px-4\">TÊN SIÊU THỊ</th>\n                <th className=\"py-3 px-3 text-right\">TARGET QĐ (TR)</th>\n                <th className=\"py-3 px-3 text-right\">DOANH THU QĐ (TR)</th>\n                <th className=\"py-3 px-3 text-center\">% HOÀN THÀNH</th>\n                <th className=\"py-3 px-3 text-center\">% QUY ĐỔI</th>\n                <th className=\"py-3 px-3 text-center\">% TRẢ CHẬM</th>\n                <th className=\"py-3 px-3 text-center\">LƯỢT KHÁCH</th>\n                <th className=\"py-3 px-3 text-center\">BILL</th>\n                <th className=\"py-3 px-3 text-right\">TỈ LỆ PVTC</th>\n              </tr>\n            </thead>\n            <tbody className=\"divide-y divide-slate-100 text-slate-700 font-semibold\">\n              {lk.map((r, idx) => {\n                const ma = r['MÃ ĐƠN VỊ'] || '';\n                const ten = r['TÊN ĐƠN VỊ'] || '';\n                const target_qd = parseFloat(String(r['TARGET QĐ (TR)'])) || 0;\n                const dt_qd = parseFloat(String(r['DOANH THU QĐ (TR)'])) || 0;\n                const dt = parseFloat(String(r['DOANH THU (TR)'])) || 0;\n                const tragop = parseFloat(String(r['DT TRẢ GÓP (TR)'])) || 0;\n                const bill = parseFloat(String(r['LƯỢT BILL (TẤT CẢ ST)'])) || 0;\n\n                const pct_ht = target_qd > 0 ? (dt_qd / target_qd * 100) : 0;\n                const pct_qd = dt > 0 ? (dt_qd / dt * 100) : 0;\n                const pct_tg = dt > 0 ? (tragop / dt * 100) : 0;\n\n                return (\n                  <tr key={idx} className=\"hover:bg-slate-50 transition font-medium\">\n                    <td className=\"py-2.5 px-3 text-center text-slate-500\">{idx + 1}</td>\n                    <td className=\"py-2.5 px-4 font-bold text-slate-900\">{ma} - {ten}</td>\n                    <td className=\"py-2.5 px-3 text-right font-mono font-bold text-slate-800\">\n                      {formatCurrency(target_qd)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-right font-mono font-bold text-blue-600\">\n                      {formatCurrency(dt_qd)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-center\">\n                      <span\n                        className={`px-2 py-0.5 rounded font-black ${\n                          pct_ht >= 100\n                            ? 'bg-blue-100 text-blue-800'\n                            : pct_ht >= 70\n                            ? 'bg-amber-100 text-amber-800'\n                            : 'bg-rose-100 text-rose-800'\n                        }`}\n                      >\n                        {formatPercent(pct_ht)}\n                      </span>\n                    </td>\n                    <td className=\"py-2.5 px-3 text-center font-bold text-slate-700\">\n                      {formatPercent(pct_qd)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-center font-bold text-purple-700\">\n                      {formatPercent(pct_tg)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-center text-slate-400\">0</td>\n                    <td className=\"py-2.5 px-3 text-center font-bold text-slate-800\">{bill}</td>\n                    <td className=\"py-2.5 px-3 text-right text-slate-500 font-mono\">-</td>\n                  </tr>\n                );\n              })}\n\n              <tr className=\"bg-blue-50/70 font-black text-slate-900 border-t-2 border-blue-200\">\n                <td className=\"py-3 px-3 text-center text-blue-700\">★</td>\n                <td className=\"py-3 px-4 text-blue-900\">TỔNG CỤM SIÊU THỊ</td>\n                <td className=\"py-3 px-3 text-right font-mono\">{formatCurrency(tot_target_qd)}</td>\n                <td className=\"py-3 px-3 text-right font-mono text-blue-700\">{formatCurrency(tot_dt_qd)}</td>\n                <td className=\"py-3 px-3 text-center\">\n                  <span className=\"px-2.5 py-0.5 rounded font-black bg-blue-600 text-white\">\n                    {formatPercent(tot_pct_ht)}\n                  </span>\n                </td>\n                <td className=\"py-3 px-3 text-center text-blue-800\">{formatPercent(tot_pct_qd)}</td>\n                <td className=\"py-3 px-3 text-center text-purple-800\">{formatPercent(tot_pct_tg)}</td>\n                <td className=\"py-3 px-3 text-center\">0</td>\n                <td className=\"py-3 px-3 text-center\">{tot_bill}</td>\n                <td className=\"py-3 px-3 text-right text-slate-400\">0,0%</td>\n              </tr>\n            </tbody>\n          </
