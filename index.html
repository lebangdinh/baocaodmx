etSyncState({ status: /permission|denied/i.test(message) ? 'permission' : 'error' });\n      });\n      void flushAiFocusProgramsSync();\n    } catch {\n      setSyncState({ status: 'error' });\n    }\n  };\n\n  const authListener = () => { void attach(); };\n  const onlineListener = () => { void attach(); };\n  const focusListener = () => { void attach(); };\n  const visibilityListener = () => {\n    if (document.visibilityState === 'visible') void attach();\n  };\n  const offlineListener = () => {\n    setSyncState({ status: 'offline' });\n    detach();\n  };\n\n  window.addEventListener(FIREBASE_AUTH_EVENT, authListener);\n  window.addEventListener('online', onlineListener);\n  window.addEventListener('focus', focusListener);\n  document.addEventListener('visibilitychange', visibilityListener);\n  window.addEventListener('offline', offlineListener);\n  void attach();\n\n  return () => {\n    disposed = true;\n    detach();\n    window.removeEventListener(FIREBASE_AUTH_EVENT, authListener);\n    window.removeEventListener('online', onlineListener);\n    window.removeEventListener('focus', focusListener);\n    document.removeEventListener('visibilitychange', visibilityListener);\n    window.removeEventListener('offline', offlineListener);\n    clearTimeout(flushTimer);\n  };\n}\n","src/utils/numbers.ts":"export function parseReportNumber(value: any, empty = 0): number {\n  if (value == null || value === '') return empty;\n  if (typeof value === 'number') return Number.isFinite(value) ? value : NaN;\n  let s = String(value).trim().replace(/\\u2212/g, '-').replace(/[\\s\\u00a0]/g, '').replace(/%$/, '');\n  if (['', '-', '—', 'null', 'undefined', '?'].includes(s)) return empty;\n  let negative = false;\n  if (/^\\(.*\\)$/.test(s)) { negative = true; s = s.slice(1, -1); }\n  if (/^[+-]?\\d{1,3}(,\\d{3})+(\\.\\d+)?$/.test(s)) s = s.replace(/,/g, '');\n  else if (/^[+-]?\\d{1,3}(\\.\\d{3})+(,\\d+)?$/.test(s)) s = s.replace(/\\./g, '').replace(',', '.');\n  else if (/^[+-]?\\d+,\\d+$/.test(s)) s = s.replace(',', '.');\n  if (!/^[+-]?(?:\\d+(?:\\.\\d+)?|\\.\\d+)$/.test(s)) return NaN;\n  const n = Number(s) * (negative ? -1 : 1);\n  return Number.isFinite(n) ? n : NaN;\n}\n","src/utils/reportPeriod.ts":"import { AppDataState } from '../types';\nimport { parseReportNumber } from './numbers';\n\nexport interface ReportPeriodContext {\n  year: number;\n  month: number;\n  monthKey: string;\n  periodLabel: string;\n  daysInMonth: number;\n  closedDays: number;\n  reportDay: number;\n  reportDateKey: string;\n  hasRealtime: boolean;\n  timePct: number;\n  daysRemainingAfterReport: number;\n  planningDaysRemaining: number;\n  sourceWindowDays: number | null;\n  inferredPreviousMonth: boolean;\n  expectedClosedDays: number;\n  missingLuyKeDays: number;\n  isCurrentMonth: boolean;\n}\n\nexport interface VietnamCalendarParts {\n  year: number;\n  month: number;\n  day: number;\n  hour: number;\n  minute: number;\n}\n\nexport function getVietnamCalendarParts(date: Date = new Date()): VietnamCalendarParts {\n  const parts = new Intl.DateTimeFormat('en-CA', {\n    timeZone: 'Asia/Ho_Chi_Minh',\n    year: 'numeric',\n    month: '2-digit',\n    day: '2-digit',\n    hour: '2-digit',\n    minute: '2-digit',\n    hourCycle: 'h23',\n  }).formatToParts(date);\n  const value = (type: string) => Number(parts.find(p => p.type === type)?.value || 0);\n  return { year: value('year'), month: value('month'), day: value('day'), hour: value('hour'), minute: value('minute') };\n}\n\nexport function getVietnamDateKey(date: Date = new Date()): string {\n  const p = getVietnamCalendarParts(date);\n  return `${p.year}-${String(p.month).padStart(2, '0')}-${String(p.day).padStart(2, '0')}`;\n}\n\nconst daysInMonth = (year: number, month: number) => new Date(Date.UTC(year, month, 0)).getUTCDate();\nconst clamp = (n: number, min: number, max: number) => Math.max(min, Math.min(max, n));\n\nconst shiftMonth = (year: number, month: number, delta: number) => {\n  const d = new Date(Date.UTC(year, month - 1 + delta, 1));\n  return { year: d.getUTCFullYear(), month: d.getUTCMonth() + 1 };\n};\n\nconst readWindowDays = (rows: any[] = []) => rows\n  .map(row => parseReportNumber(row?.['SỐ NGÀY CỬA SỔ'], NaN))\n  .filter(n => Number.isFinite(n) && n > 0);\n\nexport function getReportPeriodContext(\n  appData?: Partial<AppDataState> | null,\n  now: Date = new Date(),\n): ReportPeriodContext {\n  const vn = getVietnamCalendarParts(now);\n  const lkRows = [\n    ...(appData?.dt_luyke || []),\n    ...(appData?.dt_nv_luyke || []),\n  ];\n  const candidates = readWindowDays(lkRows);\n  const sourceWindowDays = candidates.length ? Math.max(...candidates) : null;\n\n  // Trường hợp điển hình: sáng 01/10 nạp báo cáo LK 30/09 có SỐ NGÀY CỬA SỔ = 30.\n  // Nếu cửa sổ LK lớn hơn ngày hiện tại, dữ liệu chắc chắn thuộc tháng vừa chốt.\n  const inferredPreviousMonth = sourceWindowDays !== null && sourceWindowDays > vn.day;\n  const shifted = inferredPreviousMonth ? shiftMonth(vn.year, vn.month, -1) : { year: vn.year, month: vn.month };\n  const totalDays = daysInMonth(shifted.year, shifted.month);\n\n  const hasLkData = lkRows.length > 0 || (appData?.td_luyke || []).length > 0;\n  const hasRealtime = [\n    appData?.dt_realtime,\n    appData?.td_realtime,\n    appData?.dt_nv_realtime,\n    appData?.tra_cham_realtime,\n  ].some(rows => Array.isArray(rows) && rows.length > 0);\n\n  const fallbackClosed = hasLkData\n    ? (inferredPreviousMonth ? totalDays : Math.max(0, vn.day - 1))\n    : 0;\n  const closedDays = clamp(sourceWindowDays ?? fallbackClosed, 0, totalDays);\n\n  let reportDay: number;\n  if (closedDays > 0) {\n    reportDay = clamp(closedDays + (hasRealtime && closedDays < totalDays ? 1 : 0), 1, totalDays);\n  } else if (hasRealtime) {\n    reportDay = clamp(inferredPreviousMonth ? totalDays : vn.day, 1, totalDays);\n  } else {\n    reportDay = clamp(inferredPreviousMonth ? totalDays : vn.day, 1, totalDays);\n  }\n\n  const monthKey = `${shifted.year}-${String(shifted.month).padStart(2, '0')}`;\n  const currentMonthKey = `${vn.year}-${String(vn.month).padStart(2, '0')}`;\n  const isCurrentMonth = monthKey === currentMonthKey;\n  const expectedClosedDays = isCurrentMonth ? Math.max(0, vn.day - 1) : totalDays;\n  const missingLuyKeDays = isCurrentMonth ? Math.max(0, expectedClosedDays - closedDays) : 0;\n  return {\n    year: shifted.year,\n    month: shifted.month,\n    monthKey,\n    periodLabel: `${String(shifted.month).padStart(2, '0')}/${shifted.year}`,\n    daysInMonth: totalDays,\n    closedDays,\n    reportDay,\n    reportDateKey: `${monthKey}-${String(reportDay).padStart(2, '0')}`,\n    hasRealtime,\n    timePct: totalDays > 0 ? closedDays / totalDays * 100 : 0,\n    daysRemainingAfterReport: Math.max(0, totalDays - reportDay),\n    // GAP sau LK được xử lý trên các ngày chưa nằm trong LK; nếu có RT hôm nay thì hôm nay vẫn thuộc quỹ này.\n    planningDaysRemaining: Math.max(0, totalDays - closedDays),\n    sourceWindowDays,\n    inferredPreviousMonth,\n    expectedClosedDays,\n    missingLuyKeDays,\n    isCurrentMonth,\n  };\n}\n","src/utils/competition.ts":"import { parseReportNumber } from './numbers';\n\nexport const normalizeCompetitionKey = (value: any) => String(value ?? '')\n  .trim()\n  .normalize('NFD')\n  .replace(/[\\u0300-\\u036f]/g, '')\n  .replace(/đ/g, 'd')\n  .toLowerCase()\n  .replace(/[^a-z0-9]+/g, ' ')\n  .trim();\n\nexport function competitionStoreCode(row: any): string {\n  const code = String(row?.['MÃ ĐƠN VỊ'] ?? '').trim();\n  if (code === '933' || code === '10341') return code;\n  const text = normalizeCompetitionKey(row?.['ĐƠN VỊ / NHÂN VIÊN'] || row?.['TÊN ĐƠN VỊ'] || row?.['SIÊU THỊ']);\n  if (/10341|aar|topzone/.test(text)) return '10341';\n  if (/(^| )933( |$)|tgd/.test(text)) return '933';\n  return code;\n}\n\nexport function competitionProgramId(row: any): string {\n  const code = String(row?.['MÃ CHƯƠNG TRÌNH'] ?? '').trim();\n  if (code) return `code:${normalizeCompetitionKey(code)}`;\n  return `name:${normalizeCompetitionKey(row?.['CHƯƠNG TRÌNH'])}`;\n}\n\nexport function sameCompetitionProgram(a: any, b: any): boolean {\n  return competitionProgramId(a) === competitionProgramId(b);\n}\n\nexport function competitionTarget(row: any): number {\n  const n = parseReportNumber(row?.['TARGET (TR/SL theo LOẠI TĐ)'], 0);\n  return Number.isFinite(n) ? n : 0;\n}\n\nexport function competitionValue(row: any): number {\n  if (!row) return 0;\n  const type = Number(parseReportNumber(row?.['LOẠI TĐ'], 3)) || 3;\n  if (type === 2 || type === 6) {\n    const qty = parseReportNumber(row?.['SỐ LƯỢNG'], 0);\n    return Number.isFinite(qty) ? qty : 0;\n  }\n  const qd = parseReportNumber(row?.['DT QUY ĐỔI (TR)'], NaN);\n  const actual = parseReportNumber(row?.['DOANH THU (TR)'], 0);\n  // Giữ tương thích nguồn BI: khi cột QĐ thực sự có số (kể cả âm), dùng QĐ; nếu trống/0 mà DT có số thì dùng DT.\n  if (Number.isFinite(qd) && (qd !== 0 || !Number.isFinite(actual) || actual === 0)) return qd;\n  return Number.isFinite(actual) ? actual : 0;\n}\n\n"}</script>
