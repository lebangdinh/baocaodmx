u Đồ Doanh Thu & DT Quy Đổi Từng Nhân Viên</span>\n              </h4>\n              <p className=\"text-[10.5px] text-slate-400\">\n                So sánh trực quan Doanh Thu Thực (Tr), Doanh Thu Quy Đổi (Tr) và Doanh Thu Trả Góp (Tr)\n              </p>\n            </div>\n            <button\n              onClick={() => setIsChartVisible(!isChartVisible)}\n              className=\"px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-bold text-[11px] hover:bg-slate-200 transition cursor-pointer\"\n            >\n              👁️ Ẩn biểu đồ\n            </button>\n          </div>\n          <div className=\"h-56 w-full pt-1\">\n            <canvas ref={chartRef}></canvas>\n          </div>\n        </div>\n      )}\n\n      {!isChartVisible && (\n        <div className=\"flex justify-end\">\n          <button\n            onClick={() => setIsChartVisible(true)}\n            className=\"px-3 py-1.5 rounded-lg bg-blue-50 text-blue-700 font-bold text-[11px] hover:bg-blue-100 transition cursor-pointer\"\n          >\n            👁️ Hiện biểu đồ\n          </button>\n        </div>\n      )}\n\n      {/* 3. Chế Độ 1: BẢNG XẾP HẠNG TỔNG QUAN SỐ MÔN (HUY CHƯƠNG 🥇🥈🥉) */}\n      {displayMode === 'SUMMARY' && (\n        <div className=\"space-y-3\">\n          <div className=\"flex items-center justify-between px-1\">\n            <h4 className=\"font-extrabold text-slate-700 text-xs uppercase\">\n              Bảng Xếp Hạng Tiến Độ Thi Đua & Doanh Thu\n            </h4>\n            <span className=\"text-[11px] text-slate-400 font-medium\">\n              Xếp hạng theo KPI / Đóng góp — cao nhất đứng hạng 1\n            </span>\n          </div>\n\n          <div className=\"space-y-2.5\">\n            {aggregatedEmployees.map((emp, idx) => {\n              const progressStore = /topzone|aar/i.test(emp.store) ? 'TOPZONE' : 'TGDD';\n              const progress = summarizeProgress(emp.programs, countPrograms(appData.td_luyke, progressStore));\n              let medal = (\n                <span className=\"w-8 h-8 rounded-full bg-slate-900 text-white font-black text-sm flex items-center justify-center\">\n                  {idx + 1}\n                </span>\n              );\n              let rowBg = 'bg-slate-50/70 border border-slate-200';\n              if (idx === 0) {\n                medal = (\n                  <span className=\"w-8 h-8 rounded-full bg-amber-400 text-amber-950 font-black text-sm flex items-center justify-center shadow-xs\">\n                    🥇\n                  </span>\n                );\n                rowBg = 'bg-amber-50/40 border border-amber-200';\n              } else if (idx === 1) {\n                medal = (\n                  <span className=\"w-8 h-8 rounded-full bg-slate-300 text-slate-800 font-black text-sm flex items-center justify-center shadow-xs\">\n                    🥈\n                  </span>\n                );\n                rowBg = 'bg-slate-50 border border-slate-200';\n              } else if (idx === 2) {\n                medal = (\n                  <span className=\"w-8 h-8 rounded-full bg-amber-200 text-amber-900 font-black text-sm flex items-center justify-center shadow-xs\">\n                    🥉\n                  </span>\n                );\n                rowBg = 'bg-amber-50/20 border border-amber-100';\n              }\n\n              return (\n                <div\n                  key={idx}\n                  className={`grid grid-cols-1 xl:grid-cols-[minmax(250px,1fr)_minmax(260px,1.15fr)_auto] items-center gap-x-6 gap-y-4 p-3.5 rounded-2xl ${rowBg} shadow-2xs hover:shadow-xs transition ${\n                    !emp.isVisible ? 'opacity-65 ring-1 ring-rose-200 bg-rose-50/20' : ''\n                  }`}\n                >\n                  <div className=\"flex items-center space-x-3.5\">\n                    {medal}\n                    <div>\n                      <div className=\"flex items-center gap-2\">\n                        <h4 className={`font-extrabold text-sm flex items-center gap-1.5 ${emp.isVisible ? 'text-slate-900' : 'line-through text-slate-400'}`}>\n                          <span>{emp.name}</span>\n                        </h4>\n                        <button\n                          type=\"button\"\n                          onClick={() => handleToggleEmployeeOfficial(emp.name, emp.store)}\n                          className={`px-2 py-0.5 text-[10px] rounded-lg font-bold transition cursor-pointer ${\n                            emp.isOfficial\n                              ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200'\n                              : 'bg-slate-200 text-slate-600 hover:bg-slate-300'\n                          }`}\n                          title=\"Bấm để đổi loại: Nội bộ (tính KPI) / Hỗ trợ\"\n                        >\n                          {emp.isOfficial ? 'Nội bộ' : 'Hỗ trợ'}\n                        </button>\n                        <button\n                          type=\"button\"\n                          onClick={() => handleToggleEmployeeVisibility(emp.name, emp.store)}\n                          className={`p-1 rounded-lg border transition cursor-pointer flex items-center gap-1 ${\n                            emp.isVisible\n                              ? 'bg-white border-slate-200 text-slate-400 hover:text-rose-600 hover:bg-rose-50'\n                              : 'bg-rose-100 border-rose-300 text-rose-700 hover:bg-rose-200'\n                          }`}\n                          title={emp.isVisible ? 'Bấm để ẩn nhân viên này' : 'Bấm để hiện lại nhân viên này'}\n                        >\n                          {emp.isVisible ? <Eye className=\"w-3.5 h-3.5\" /> : <EyeOff className=\"w-3.5 h-3.5\" />}\n                          <span className=\"text-[10px] font-bold\">{emp.isVisible ? 'Ẩn' : 'Hiện'}</span>\n                        </button>\n                      </div>\n                      <p className=\"text-[11px] text-slate-500 font-medium\">{emp.department}</p>\n                    </div>\n                  </div>\n\n                  <EmployeeProgress summary={progress} />\n                  <div className=\"flex items-center justify-between xl:justify-end gap-6 text-right\">\n                    <div>\n                      <span className=\"text-xs font-bold text-slate-500 block\">\n                        {formatCurrency(emp.totalDt, 1)} TR (Thực)\n                      </span>\n                      <span className=\"text-base font-black text-indigo-700 block\">\n                        {formatCurrency(emp.totalDtQd, 1)} TR (QĐ)\n                      </span>\n                      {revenueNote(emp)}\n                    </div>\n\n                    <div>\n                      <div className=\"flex items-baseline justify-end gap-1\">\n                        <span className=\"text-2xl font-black text-rose-600 tracking-tight\">\n                          {emp.completedCount}/{progress.total}\n                        </span>\n                        <span className=\"text-[11px] font-black text-slate-700 uppercase\">MÔN</span>\n                      </div>\n                      <span\n                        className={`px-2 py-0.5 rounded text-[10.5px] font-black inline-block mt-0.5 ${\n                          emp.pctDukien >= 100\n                            ? 'bg-emerald-100 text-emerald-800'\n                            : emp.pctDukien >= 80\n                            ? 'bg-amber-100 text-amber-800'\n                            : 'bg-rose-100 text-rose-800'\n                        }`}\n                      >\n                        {formatPercent(emp.pctDukien, 1)} DỰ KIẾN HT\n                      </span>\n                    </div>\n                  </div>\n                </div>\n              );\n            })}\n          </div>\n        </div>\n      )}\n\n      {/* 4. CHẾ ĐỘ AI: ĐÁNH GIÁ & KẾ HOẠCH CHẠY TỪNG NHÂN VIÊN */}\n      {displayMode === 'AI' && (\n        <div className=\"space-y-4\">\n          <div className=\"rounded-2xl border border-indigo-200 bg-gradient-to-r from-indigo-50 via-white to-blue-50 p-5 shadow-xs\">\n            <div className=\"flex flex-col md:flex-row md:items-center justify-between gap-3\">\n              <div>\n                <div className=\"flex items-center gap-2\"><Sparkles className=\"w-5 h-5 text-indigo-600\"/><h4 className=\"font-black text-slate-900 text-base uppercase\">AI ĐÁNH GIÁ & KẾ HOẠCH CHẠY NHÂN VIÊN</h4></div>\n                <p className=\"text-[11px] text-slate-600 mt-1\">AI đọc tiến độ từng nhân viên → chỉ ra môn cần ưu tiên → quy đổi thành số cần chạy mỗi ngày để chạm mục tiêu.</p>\n              </div>\n              <div className=\"flex flex-wrap gap-2 text-[10px] font-black\">\n                <span className=\"px-2.5 py-1.5 rounded-lg bg-white border border-indigo-200 text-indigo-700\">STRETCH {stretchGoalPct}%</span>\n                <span className=\"px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-600\">CÒN {aiEmployeePlans[0]?.daysLeft || 0} NGÀY</span>\n              </div>\n            </div>\n          </div>\n\n          <div className=\"rounded-2xl border border-amber-200 bg-amber-50/60 overflow-hidden\">\n            <div className=\"px-4 py-3 flex flex-col md:flex-row md:items-center justify-between gap-2\">\n              <div>\n                <div className=\"flex items-center gap-2\"><span className=\"text-base\">🎯</span><span className=\"font-black text-slate-900 text-sm uppercase\">MÔN TẬP TRUNG TĂNG TỐC</span><span className=\"px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[9px] font-black\">{aiFocusPrograms.length} MÔN</span></div>\n                <p className=\"text-[10.5px] text-slate-600 mt-0.5\">{isAiFocusSectionVisible ? 'Tích chọn môn muốn đẩy mạnh. AI ưu tiên các môn này trước; môn không chọn vẫn phân tích theo thuật toán bình thường.' : 'Mục đang ẩn. AI vẫn giữ nguyên các môn đã tích chọn và tiếp tục áp dụng trọng số ưu tiên.'}</p>\n              </div>\n              <div className=\"flex items-center gap-2 shrink-0\">\n                {isAiFocusSectionVisible && aiFocusPrograms.length > 0 && (\n                  <button type=\"button\" onClick={clearAiFocusPrograms} className=\"px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-slate-600 hover:text-rose-600 hover:border-rose-200 text-[10px] font-black cursor-pointer\">BỎ CHỌN TẤT CẢ</button>\n                )}\n                <button\n                  type=\"button\"\n                  onClick={() => setIsAiFocusSectionVisible(v => !v)}\n                  aria-expanded={isAiFocusSectionVisible}\n                  className={`px-3 py-1.5 rounded-lg border text-[10px] font-black cursor-pointer transition ${isAiFocusSectionVisible ? 'bg-white border-amber-200 text-amber-800 hover:bg-amber-100' : 'bg-amber-100 border-amber-300 text-amber-900 hover:bg-amber-200'}`}\n                  title={isAiFocusSectionVisible ? 'Ẩn mục Môn tập trung tăng tốc' : 'Hiện mục Môn tập trung tăng tốc'}\n                >\n                  {isAiFocusSectionVisible ? '🙈 ẨN MỤC' : '👁️ HIỆN MỤC'}\n                </button>\n              </div>\n            </div>\n            {isAiFocusSectionVisible && (\n              <div className=\"border-t border-amber-200\">\n                <div className=\"p-3\">\n                  {aiProgramCatalog.length === 0 ? (\n                    <div className=\"py-5 text-center text-[10px] text-slate-500\">Chưa có danh sách môn từ dữ liệu nhân viên.</div>\n                  ) : (\n                    <div className=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 max-h-64 overflow-y-auto custom-scroll pr-1\">\n                      {aiProgramCatalog.map(({name, employeeCount}) => {\n                        const checked = aiFocusPrograms.includes(name);\n                        return (\n                          <label key={name} className={`flex items-center gap-2.5 rounded-xl border px-3 py-2.5 cursor-pointer transition ${checked ? 'border-amber-300 bg-white shadow-sm ring-1 ring-amber-100' : 'border-slate-200 bg-white hover:border-slate-300'}`}>\n                            <input type=\"checkbox\" checked={checked} onChange={() => toggleAiFocusProgram(name)} className=\"w-4 h-4 accent-amber-500 cursor-pointer shrink-0\" />\n                            <span className=\"min-w-0 flex-1\">\n                              <span className={`block text-[10.5px] font-black truncate ${checked ? 'text-amber-900' : 'text-slate-700'}`} title={name}>{name}</span>\n                              <span className=\"block text-[9px] text-slate-400 mt-0.5\">{employeeCount} NV có dữ liệu</span>\n                            </span>\n                            {checked && <span className=\"text-[9px] font-black text-amber-700 shrink-0\">🔥 TẬP TRUNG</span>}\n                          </label>\n                        );\n                      })}\n                    </div>\n                  )}\n                </div>\n              </div>\n            )}\n          </div>\n\n          <div className=\"rounded-2xl border border-slate-200 bg-white overflow-hidden\">\n            <div className=\"px-4 py-3 bg-slate-900 text-white flex items-center justify-between gap-3\">\n              <div className=\"font-black text-sm\">KẾ HOẠCH HÀNH ĐỘNG TỪNG NHÂN VIÊN</div>\n              <div className=\"text-[10px] text-slate-300\">Ưu tiên theo độ thiếu + nguy cơ hụt dự báo</div>\n            </div>\n            <div className=\"p-4 space-y-4\">\n              {aiEmployeePlans.length === 0 ? (\n                <div className=\"py-10 text-center text-xs text-slate-400\">Chưa có dữ liệu nhân viên đủ để lập kế hoạch.</div>\n              ) : aiEmployeePlans.map(({emp, programs, overallForecast, overallGap, overallDaily, daysLeft, status, statusClass}, idx) => (\n                <div key={`${emp.id}-${idx}`} className=\"rounded-2xl border border-slate-200 overflow-hidden\">\n c duy trì nhịp và ưu tiên nâng các môn có khả năng vượt target.</div>\n                    )}\n                    <div className=\"mt-3 rounded-xl bg-blue-50 border border-blue-200 p-3 text-[10.5px] text-blue-900\"><b>AI giao việc:</b> {programs.length ? `${programs.some(p => p.focus) ? 'Ưu tiên các môn đã đánh dấu 🔥 trước; ' : ''}Tập trung trước vào “${programs[0].displayName}”, sau đó lần lượt ${programs.slice(1).map(p => `“${p.displayName}”`).join(', ')}. Mục tiêu là đạt tối thiểu nhịp đã tính trong ${daysLeft} ngày còn lại.` : 'Duy trì các môn đang tốt và dùng thời gian còn lại để tạo dư địa vượt mục tiêu.'}</div>\n                  </div>\n                </div>\n              ))}\n            </div>\n          </div>\n        </div>\n      )}\n\n      {/* 5. Chế Độ 2: BẢNG DOANH THU NHÂN VIÊN CHI TIẾT */}\n      {displayMode === 'TABLE' && (\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3\">\n          <div className=\"pb-2 border-b border-slate-100\">\n            <h4 className=\"font-extrabold text-slate-900 text-xs uppercase\">\n              Bảng Tổng Hợp Doanh Thu Nhân Viên\n            </h4>\n            <p className=\"text-[11px] text-slate-500\">\n              Đối chiếu chi tiết Doanh thu thực, Doanh thu QĐ, Trả góp, Tỷ trọng đóng góp\n            </p>\n          </div>\n\n          <div className=\"overflow-x-auto custom-scroll\">\n            <SortableTable className=\"w-full text-left text-xs border-collapse\">\n              <thead className=\"bg-slate-900 text-white font-bold border-b border-slate-800 text-[10.5px]\">\n                <tr>\n                  <th className=\"py-2.5 px-3 text-center w-12\">#</th>\n                  <th className=\"py-2.5 px-3\">MÃ NV</th>\n                  <th className=\"py-2.5 px-4\">TÊN NHÂN VIÊN</th>\n                  <th className=\"py-2.5 px-3\">SIÊU THỊ</th>\n                  <th className=\"py-2.5 px-3 text-center\">SỐ LƯỢNG</th>\n                  <th className=\"py-2.5 px-3 text-right\">DOANH THU THỰC (TR)</th>\n                  <th className=\"py-2.5 px-3 text-right font-black text-indigo-300\">DOANH THU QĐ (TR)</th>\n                  <th className=\"py-2.5 px-3 text-right\">DT TRẢ GÓP (TR)</th>\n                  <th className=\"py-2.5 px-3 text-center\">% TRẢ GÓP</th>\n                  <th className=\"py-2.5 px-3 text-center\">% ĐÓNG GÓP</th>\n                  <th className=\"py-2.5 px-3 text-center font-bold text-amber-300\">SỐ MÔN HT</th>\n                  <th className=\"py-2.5 px-3 text-center\">THAO TÁC / ẨN HIỆN</th>\n                </tr>\n              </thead>\n              <tbody className=\"divide-y divide-slate-100 font-semibold text-slate-700\">\n                {aggregatedEmployees.map((emp, idx) => (\n                  <tr\n                    key={idx}\n                    className={`hover:bg-slate-50 transition border-b border-slate-100 ${\n                      !emp.isVisible ? 'bg-rose-50/20 opacity-65' : ''\n                    }`}\n                  >\n                    <td className=\"py-2.5 px-3 text-center font-bold\">{idx + 1}</td>\n                    <td className=\"py-2.5 px-3 font-mono text-slate-500\">{emp.id}</td>\n                    <td className=\"py-2.5 px-4 font-bold text-slate-900\">\n                      <span className={emp.isVisible ? '' : 'line-through text-slate-400'}>\n                        {emp.name}\n                      </span>\n                      {!emp.isVisible && (\n                        <span className=\"ml-1.5 px-1 py-0.2 bg-rose-100 text-rose-700 text-[10px] rounded font-bold\">\n                          Đã ẩn\n                        </span>\n                      )}\n                    </td>\n                    <td className=\"py-2.5 px-3 font-semibold text-slate-600\">{emp.store}</td>\n                    <td className=\"py-2.5 px-3 text-center font-mono\">{emp.totalBill}</td>\n                    <td className=\"py-2.5 px-3 text-right font-mono text-slate-700\" data-sort-value={emp.totalDt}>\n                      {formatCurrency(emp.totalDt)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-right font-mono font-black text-indigo-700 bg-indigo-50/40\" data-sort-value={emp.totalDtQd}>\n                      {formatCurrency(emp.totalDtQd)}\n                      {revenueNote(emp)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-right font-mono text-slate-600\" data-sort-value={emp.totalTragop}>\n                      {formatCurrency(emp.totalTragop)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-center font-semibold text-purple-700\" data-sort-value={emp.pctTragop}>\n                      {formatPercent(emp.pctTragop)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-center font-bold text-blue-700\" data-sort-value={emp.pctDongGop}>\n                      {formatPercent(emp.pctDongGop)}\n                    </td>\n                    <td className=\"py-2.5 px-3 text-center font-black text-rose-600\">\n                      {emp.completedCount} môn\n                    </td>\n                    <td className=\"py-2.5 px-3 text-center\">\n                      <div className=\"flex items-center justify-center gap-1.5\">\n                        <button\n                          type=\"button\"\n                          onClick={() => handleToggleEmployeeOfficial(emp.name, emp.store)}\n                          className={`px-2 py-0.5 rounded text-[10px] font-bold cursor-pointer transition ${\n                            emp.isOfficial\n                              ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200'\n                              : 'bg-slate-100 text-slate-600 hover:bg-slate-200'\n                          }`}\n                          title=\"Bấm để đổi Nội bộ / Hỗ trợ\"\n                        >\n                          {emp.isOfficial ? 'Nội bộ' : 'Hỗ trợ'}\n                        </button>\n                        <button\n                          type=\"button\"\n                          onClick={() => handleToggleEmployeeVisibility(emp.name, emp.store)}\n                          className={`p-1 rounded-lg border transition cursor-pointer flex items-center gap-1 ${\n                            emp.isVisible\n                              ? 'bg-white border-slate-200 text-slate-400 hover:text-rose-600 hover:bg-rose-50'\n                              : 'bg-rose-100 border-rose-300 text-rose-700 hover:bg-rose-200'\n                          }`}\n                          title={emp.isVisible ? 'Bấm để ẩn nhân viên' : 'Bấm để hiện lại nhân viên'}\n                        >\n                          {emp.isVisible ? <Eye className=\"w-3.5 h-3.5\" /> : <EyeOff className=\"w-3.5 h-3.5\" />}\n                          <span className=\"text-[10px] font-bold\">{emp.isVisible ? 'Ẩn' : 'Hiện'}</span>\n                        </button>\n                      </div>\n                    </td>\n                  </tr>\n                ))}\n              </tbody>\n            </SortableTable>\n          </div>\n        </div>\n      )}\n\n      {/* 5. Chế Độ 3: THẺ CHI TIẾT TỪNG MÔN THI ĐUA */}\n      {displayMode === 'CARDS' && (\n        <div\n          className={`grid gap-4 items-start ${\n            cardCols === 1\n              ? 'grid-cols-1'\n              : cardCols === 2\n              ? 'grid-cols-1 md:grid-cols-2'\n              : 'grid-cols-1 md:grid-cols-2 lg:grid-cols-3'\n          }`}\n        >\n          {aggregatedEmployees.map((emp, index) => {\n            const rank = index + 1;\n            let rankBadgeClass = 'bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded-lg text-xs';\n            let cardBorderClass = 'border-slate-200';\n            if (rank === 1) {\n              rankBadgeClass = 'bg-amber-400 text-amber-950 font-black px-2.5 py-0.5 rounded-lg text-xs shadow-xs';\n              cardBorderClass = 'border-amber-300 ring-2 ring-amber-100/60';\n            } else if (rank === 2) {\n              rankBadgeClass = 'bg-slate-200 text-slate-800 font-bold px-2.5 py-0.5 rounded-lg text-xs';\n            } else if (rank === 3) {\n              rankBadgeClass = 'bg-amber-100 text-amber-900 font-bold px-2.5 py-0.5 rounded-lg text-xs';\n            }\n\n            const weakList = emp.programs\n              .filter(p => employeeProgramStatus(p) === 'weak')\n              .map(p => `${p.displayName} (${Number(p.thuc) === 0 ? 'Chưa có số · ' : ''}dự kiến ${formatPercent(p.pctDu, 1)})`);\n            const alertText =\n              weakList.length > 0 ? weakList.join(', ') : 'Đang hoàn thành tốt tất cả các môn';\n\n            return (\n              <div\n                key={index}\n                data-employee-card=\"true\"\n                className={`bg-white rounded-2xl border ${cardBorderClass} p-4 shadow-xs relative overflow-hidden flex flex-col justify-between hover:shadow-md transition ${\n                  !emp.isVisible ? 'opacity-65 ring-1 ring-rose-200 bg-rose-50/20' : ''\n                }`}\n              >\n                <div className=\"flex items-start justify-between pb-2 border-b border-slate-100\">\n                  <div>\n                    <h4 className=\"font-bold text-slate-900 text-sm leading-snug flex items-center gap-1.5\">\n                      <span className={emp.isVisible ? '' : 'line-through text-slate-400'}>{emp.name}</span>\n                      <button\n                        type=\"button\"\n                        onClick={() => handleToggleEmployeeOfficial(emp.name, emp.store)}\n                        className={`px-1.5 py-0.2 rounded text-[10px] font-bold cursor-pointer transition ${\n                          emp.isOfficial\n                            ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200'\n                            : 'bg-slate-100 text-slate-500 hover:bg-slate-200'\n                        }`}\n                        title=\"Bấm để đổi loại: Nội bộ / Hỗ trợ\"\n                      >\n                        {emp.isOfficial ? 'Nội bộ' : 'Hỗ trợ'}\n                      </button>\n                    </h4>\n                    <p className=\"text-[11px] text-slate-400 font-mono mt-0.5\">{emp.department}</p>\n                  </div>\n                  <div className=\"flex items-center gap-1.5\">\n                    <button\n                      type=\"button\"\n                      onClick={() => handleToggleEmployeeVisibility(emp.name, emp.store)}\n                      className={`p-1 rounded-lg border transition cursor-pointer flex items-center gap-1 ${\n                        emp.isVisible\n                          ? 'bg-white border-slate-200 text-slate-400 hover:text-rose-600 hover:bg-rose-50'\n                          : 'bg-rose-100 border-rose-300 text-rose-700 hover:bg-rose-200'\n                      }`}\n                      title={emp.isVisible ? 'Ẩn nhân viên này' : 'Hiện lại nhân viên này'}\n                    >\n                      {emp.isVisible ? <Eye className=\"w-3.5 h-3.5\" /> : <EyeOff className=\"w-3.5 h-3.5\" />}\n                      <span className=\"text-[10px] font-bold\">{emp.isVisible ? 'Ẩn' : 'Hiện'}</span>\n                    </button>\n\n                    <span className={rankBadgeClass}>#{rank}</span>\n                  </div>\n                </div>\n\n                {revenueNote(emp)}\n                {/* 3 Metric Mini Boxes */}\n                <div className=\"grid grid-cols-3 gap-2 my-2.5\">\n                  <div className=\"bg-slate-50 border border-slate-100 rounded-xl p-2 text-center\">\n                    <span className=\"text-[9px] font-bold uppercase text-slate-400 block tracking-wider\">\n                      DOANH THU\n                    </span>\n                    <span className=\"text-sm font-black text-slate-800 block leading-tight mt-0.5\">\n                      {formatCurrency(emp.totalDt, 1)}\n                    </span>\n                  </div>\n                  <div className=\"bg-indigo-50/70 border border-indigo-200 rounded-xl p-2 text-center\">\n                    <span className=\"text-[9px] font-black uppercase text-indigo-700 block tracking-wider\">\n                      DT QUY ĐỔI\n                    </span>\n                    <span className=\"text-base font-black text-indigo-600 block leading-tight mt-0.5\">\n                      {formatCurrency(emp.totalDtQd, 1)}\n                    </span>\n                  </div>\n                  <div className=\"bg-slate-50 border border-slate-100 rounded-xl p-2 text-center\">\n                    <span className=\"text-[9px] font-bold uppercase text-slate-400 block tracking-wider\">\n                      KPI / ĐÓNG GÓP\n                    </span>\n                    <span className=\"text-sm font-black text-rose-600 block leading-tight mt-0.5\">\n                      {emp.diemKpi.toFixed(1)}đ\n                    </span>\n                  </div>\n                </div>\n\n                <div className=\"text-[10.5px] text-slate-500 text-center pb-2 border-b border-slate-100\">\n                  ĐT: <b className=\"text-slate-700 font-mono\">{emp.dtDiem.toFixed(1)}đ</b> • HQ:{' '}\n                  <b className=\"text-slate-700 font-mono\">{emp.hqDiem.toFixed(1)}đ</b> (Hiệu quả QĐ{' '}\n                  <b className=\"text-slate-700 font-mono\">{emp.hieuQuaQd.toFixed(1)}%</b>)\n                </div>\n\n                {/* Discipline list with CSS Grid */}\n                <div\n                    className={`card-programs-container custom-scroll pt-1 ${\n                      isExpandAllPrograms\n                        ? 'max-h-none overflow-visible'\n                        : 'max-h-[350px] overflow-y-auto'\n                    }`}\n                  >\n                  <SortableTable grid initialSort={{ column: 4, direction: 'desc' }} className=\"w-full text-left text-[10.5px]\">\n                    <div className=\"grid grid-cols-[40fr_15fr_15fr_15fr_15fr] gap-1 sticky top-0 z-10 bg-white text-slate-500 font-bold border-b border-slate-100 shadow-2xs\">\n                      <div className=\"py-1 px-1 font-semibold\">MÔN</div>\n                      <div className=\"py-1 px-1 text-right font-semibold\">THỰC</div>\n                      <div className=\"py-1 px-1 text-right font-semibold\">TARGET</div>\n                      <div className=\"py-1 px-1 text-right font-bold\">%LK</div>\n                      <div className=\"py-1 px-1 text-right font-semibold\">%DỰ</div>\n                    </div>\n                    <div className=\"divide-y divide-slate-50 text-slate-700\">\n                      {[...emp.programs].sort((a, b) => (Number(b.pctDu) || 0) - (Number(a.pctDu) || 0)).map((p, pIdx) => {\n                        const isQty = p.loai === 2 || p.loai === 6;\n                        const thucStr = isQty ? formatInt(p.thuc) : formatCurrency(p.thuc, 1);\n                        const targetStr = isQty ? formatInt(p.target) : formatCurrency(p.target, 1);\n\n                        const status = employeeProgramStatus(p);\n                        const pctColor = status === 'weak' ? '#f43f5e' : status === 'watch' ? '#d97706' : status === 'good' ? '#059669' : '#64748b';\n                        const missing = status === 'unknown';\n\n                        const isTopVung = p.hangVung && parseInt(p.hangVung) === 1;\n\n                        return (\n                          <div\n                            key={pIdx}\n                            onClick={() => onOpenProgramDetail(emp.store, p.code, p.name)}\n                            title=\"Bấm để xem chi tiết môn này\"\n                            data-program-status={status}\n                            style={{backgroundColor: status === 'weak' ? '#fff4d6' : undefined}}\n                            className=\"grid grid-cols-[40fr_15fr_15fr_15fr_15fr] gap-1 hover:bg-blue-50/70 cursor-pointer transition border-b border-slate-100\"\n                          >\n                            <div className=\"py-1.5 px-1 font-bold text-slate-800 truncate\" title={`${p.name}${status === 'weak' ? Number(p.thuc) === 0 ? ' — Chưa có số' : ' — Dự kiến dưới 80%' : ''}`}>\n                              {status === 'weak' && <span aria-label=\"Cảnh báo môn yếu\" style={{color: '#d97706'}}>⚠ </span>}\n                              {isTopVung && '🥇 '}\n                              {p.displayName}\n                            </div>\n                            <div data-sort-value={p.thuc} className=\"py-1.5 px-1 text-right text-slate-800 font-bold font-mono text-[11px]\">\n                              {p.hasActualData === false ? '—' : thucStr}\n                            </div>\n                            <div data-sort-value={p.target} className=\"py-1.5 px-1 text-right text-slate-700 font-bold font-mono text-[11px]\">\n                              {targetStr}\n                            </div>\n                            <div data-sort-value={p.pctLk} style={{color: pctColor}} className=\"py-1.5 px-1 text-right font-bold font-mono text-[11px]\">\n                              {missing ? '—' : formatPercent(p.pctLk, 1)}\n                            </div>\n                            <div data-sort-value={p.pctDu} style={{color: pctColor}} className=\"py-1.5 px-1 text-right font-bold font-mono text-[10.5px]\">\n                              {missing ? '—' : formatPercent(p.pctDu, 1)}\n                            </div>\n                          </div>\n                        );\n                      })}\n                    </div>\n                  </SortableTable>\n                </div>\n\n                {/* Warning box */}\n                {weakList.length > 0 && <div className=\"bg-rose-50/90 border border-rose-200 text-rose-800 rounded-xl p-2.5 text-[11px] leading-relaxed mt-2.5\">\n                  <span className=\"font-bold flex items-center gap-1 mb-0.5 text-rose-900\">\n                    ⚠ Cảnh báo môn yếu / chưa có số (dự kiến dưới 80%):\n                  </span>\n                  <span className=\"text-slate-600 font-bold text-[10.5px]\">{alertText}</span>\n                </div>}\n              </div>\n            );\n          })}\n        </div>\n      )}\n    </div>\n  );\n};\n","src/views/ThiDuaStView.tsx":"import { countPrograms } from '../utils/programCounts';\nimport { SortableTable } from '../components/SortableTable';\nimport React, { useState } from 'react';\nimport { Camera, Search } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport { formatCurrency, formatInt, formatPercent, formatProgramName } from '../utils/formatters';\n\ninterface ThiDuaStViewProps {\n  appData: AppDataState;\n  onExportTab: (storeLabel?: string) => void | Promise<void>;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n}\n\nexport const ThiDuaStView: React.FC<ThiDuaStViewProps> = ({\n  appData,\n  onExportTab,\n  onOpenProgramDetail,\n}) => {\n  const [activeStore, setActiveStore] = useState<'TGDD' | 'TOPZONE'>('TGDD');\n  const [searchTerm, setSearchTerm] = useState<string>('');\n  const [isExportMenuOpen, setIsExportMenuOpen] = useState<boolean>(false);\n\n  const waitForRender = () => new Promise<void>(resolve => setTimeout(resolve, 350));\n\n  const handleExportBothStores = async () => {\n    if (isExportMenuOpen === false) return;\n    const originalStore = activeStore;\n    setIsExportMenuOpen(false);\n    try {\n      setActiveStore('TGDD');\n      await waitForRender();\n      await onExportTab('TGDĐ');\n      await waitForRender();\n      setActiveStore('TOPZONE');\n      await waitForRender();\n      await onExportTab('TOPZONE');\n      await waitForRender();\n    } finally {\n      setActiveStore(originalStore);\n    }\n  };\n\n  const td_lk = appData.td_luyke || [];\n  const td_rt = appData.td_realtime || [];\n  const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();\n  const storeKeyword = activeStore === 'TGDD' ? 'TGD' : 'AAR';\n\n  const cleanKey = (value: any) => String(value ?? '')\n    .toLowerCase()\n    .normalize('NFD')\n    .replace(/[\\u0300-\\u036f]/g, '')\n    .replace(/[^a-z0-9]+/g, ' ')\n    .trim();\n\n  const sameProgram = (a: any, b: any) => {\n    const codeA = cleanKey(a?.['MÃ CHƯƠNG TRÌNH']);\n    const codeB = cleanKey(b?.['MÃ CHƯƠNG TRÌNH']);\n    if (codeA && codeB && codeA === codeB) return true;\n    const nameA = cleanKey(a?.['CHƯƠNG TRÌNH']);\n    const nameB = cleanKey(b?.['CHƯƠNG TRÌNH']);\n    return !!nameA && !!nameB && nameA === nameB;\n  };\n\n  const sameStore = (r: any) => {\n    const shop = cleanKey(r?.['ĐƠN VỊ / NHÂN VIÊN'] || r?.['TÊN ĐƠN VỊ']);\n    const code = cleanKey(r?.['MÃ ĐƠN VỊ']);\n    if (activeStore === 'TGDD') return shop.includes('tgd') || code === '933';\n    return shop.includes('aar') || shop.includes('topzone') || code === '10341';\n  };\n\n  // Khi đã có Data Thi đua Realtime của đúng shop, Realtime được hiểu là số liệu phát sinh HÔM NAY.\n  // Vì vậy quỹ thời gian phải tính đến ngày hôm nay (thay vì dừng ở hết ngày hôm qua).\n  // Nếu chưa có RT của shop đang chọn thì vẫn giữ cách tính cũ: đến hết ngày hôm qua.\n  const hasRealtimeToday = td_rt.some(r => sameStore(r));\n  const daysElapsed = Math.max(0, Math.min(daysInMonth, new Date().getDate() - (hasRealtimeToday ? 0 : 1)));\n  const progressPct = daysInMonth > 0 ? (daysElapsed / daysInMonth * 100) : 0;\n\n  // Chỉ hiển thị các môn có TARGET > 0. Môn không giao target (TARGET = 0/—)\n  // sẽ được loại khỏi bảng, bộ đếm và tỷ lệ của shop.\n  let list = td_lk.filter(r => {\n    if (!sameStore(r)) return false;\n    const rtRow = td_rt.find(x => sameStore(x) && sameProgram(r, x));\n    const targetLk = parseFloat(String(r['TARGET (TR/SL theo LOẠI TĐ)'])) || 0;\n    const targetRt = parseFloat(String(rtRow?.['TARGET (TR/SL theo LOẠI TĐ)'])) || 0;\n    return targetLk > 0 || targetRt > 0;\n  });\n  if (searchTerm) {\n    list = list.filter(r => {\n      const name = r['CHƯƠNG TRÌNH'] || '';\n      return (\n        name.toLowerCase().includes(searchTerm.toLowerCase()) ||\n        formatProgramName(name).toLowerCase().includes(searchTerm.toLowerCase())\n      );\n    });\n  }\n\n  // Ghép Realtime vào từng môn Lũy kế. Không phụ thuộc thứ tự dòng giữa 2 bảng.\n  const rows = list.map((lkRow) => {\n    const rtRow = td_rt.find(r => sameStore(r) && sameProgram(lkRow, r));\n    const loai = Number(lkRow['LOẠI TĐ']) || Number(rtRow?.['LOẠI TĐ']) || 3;\n    const isQty = loai === 2 || loai === 6;\n    const lkValue = isQty\n      ? (parseFloat(String(lkRow['SỐ LƯỢNG'])) || 0)\n      : (parseFloat(String(lkRow['DOANH THU (TR)'])) || 0);\n    const rtValue = rtRow\n      ? (isQty\n        ? (parseFloat(String(rtRow['SỐ LƯỢNG'])) || 0)\n        : (parseFloat(String(rtRow['DOANH THU (TR)'])) || 0))\n      : 0;\n    const target = parseFloat(String(lkRow['TARGET (TR/SL theo LOẠI TĐ)'])) || parseFloat(String(rtRow?.['TARGET (TR/SL theo LOẠI TĐ)'])) || 0;\n    const pctLk = parseFloat(String(lkRow['% HT THÁNG'])) || 0;\n    const pctRt = rtRow\n      ? (parseFloat(String(rtRow['% HT NGÀY'])) || parseFloat(String(rtRow['% HT THÁNG'])) || 0)\n      : 0;\n    const pctDu = parseFloat(String(lkRow['% DỰ BÁO'])) || (pctLk * (daysInMonth / Math.max(1, daysElapsed)));\n    const gap = Math.max(0, target - lkValue - rtValue);\n    const isCompleted = pctLk >= 100;\n    const remainingDays = Math.max(1, daysInMonth - daysElapsed);\n    const soNgay = isCompleted ? '✓ XONG' : (gap / remainingDays).toFixed(1) + '/NGÀY';\n    return { lkRow, rtRow, loai, isQty, lkValue, rtValue, target, pctLk, pctRt, pctDu, gap, isCompleted, soNgay };\n  });\n\n  // Sort theo tiến độ Lũy kế như cũ.\n  rows.sort((a, b) => b.pctLk - a.pctLk);\n\n  const totalPrograms = rows.length;\n  let completedCount = 0;\n  let above50Count = 0;\n  let below50Count = 0;\n  rows.forEach(r => {\n    if (r.pctLk >= 100) completedCount++;\n    if (r.pctLk >= 50) above50Count++;\n    else below50Count++;\n  });\n  const forecastPct = totalPrograms > 0 ? (completedCount / totalPrograms * 100).toFixed(1) : '0';\n  const rtLoadedCount = rows.filter(r => !!r.rtRow).length;\n\n  return (\n    <div className=\"space-y-6\">\n      {/* 1. Header Bar */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div className=\"flex items-center space-x-3\">\n          <span className=\"px-2.5 py-1 bg-slate-900 text-white font-black text-xs rounded-xl font-mono\">\n            {activeStore === 'TGDD' ? '933' : '10341'}\n          </span>\n          <div>\n            <h3 className=\"font-extrabold text-slate-900 text-base uppercase\">\n              BẢNG XẾP HẠNG THI ĐUA — Thi Đua Siêu Thị – {activeStore === 'TGDD' ? 'TGDĐ' : 'TOPZONE'}\n            </h3>\n            <p className=\"text-[11.5px] text-slate-500 font-medium flex items-center gap-1.5\">\n              <span>Cụm 933</span><span>•</span><span>351 Nguyễn Hữu Thọ</span>\n            </p>\n          </div>\n        </div>\n\n        <div className=\"flex items-center gap-3\">\n          <div className=\"flex rounded-xl bg-slate-100 p-1 text-xs font-bold shadow-inner\">\n            <button onClick={() => setActiveStore('TGDD')} className={`px-4 py-1.5 rounded-lg transition font-bold cursor-pointer ${activeStore === 'TGDD' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600'}`}>\n              TGDĐ ({countPrograms(appData.td_luyke, 'TGDD')} môn)\n            </button>\n            <button onClick={() => setActiveStore('TOPZONE')} className={`px-4 py-1.5 rounded-lg transition font-bold cursor-pointer ${activeStore === 'TOPZONE' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600'}`}>\n              TOPZONE ({countPrograms(appData.td_luyke, 'TOPZONE')} môn)\n            </button>\n          </div>\n          <div className=\"relative\">\n            <button onClick={() => setIsExportMenuOpen(v => !v)} className=\"px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-xs transition flex items-center gap-1.5 cursor-pointer\" title=\"Chọn cách xuất ảnh\">\n              <Camera className=\"w-3.5 h-3.5\" /><span>Xuất Ảnh</span><span className=\"text-[10px] ml-0.5\">▾</span>\n            </button>\n            {isExportMenuOpen && (\n              <>\n                <button type=\"button\" aria-label=\"Đóng menu xuất ảnh\" className=\"fixed inset-0 z-40 cursor-default\" onClick={() => setIsExportMenuOpen(false)} />\n                <div className=\"absolute right-0 top-full mt-2 z-50 w-60 rounded-2xl bg-white border border-slate-200 shadow-xl p-1.5\">\n                  <button type=\"button\" onClick={async () => { setIsExportMenuOpen(false); await onExportTab(activeStore === 'TGDD' ? 'TGDĐ' : 'TOPZONE'); }} className=\"w-full text-left px-3 py-2.5 rounded-xl hover:bg-blue-50 text-slate-800 text-xs font-bold flex items-center gap-2 cursor-pointer\">\n                    <Camera className=\"w-4 h-4 text-blue-600\" /><span>Xuất ảnh shop đang chọn</span>\n                  </button>\n                  <button type=\"button\" onClick={handleExportBothStores} className=\"w-full text-left px-3 py-2.5 rounded-xl hover:bg-emerald-50 text-slate-800 text-xs font-bold flex items-center gap-2 cursor-pointer\">\n                    <span className=\"text-base\">🏪</span><span>Xuất ảnh cả 2 shop</span>\n                  </button>\n                  <div className=\"px-3 pt-1 pb-1 text-[10px] text-slate-400\">TGDĐ + TOPZONE → 2 ảnh PNG riêng biệt</div>\n                </div>\n              </>\n            )}\n          </div>\n        </div>\n      </div>\n\n      {/* 2. Quỹ thời gian banner */}\n      <div className=\"bg-blue-50/80 border border-blue-200 rounded-xl p-3.5 flex items-center justify-between text-xs\">\n        <span className=\"font-bold text-blue-950\">Quỹ thời gian: {daysElapsed || 0} / {daysInMonth} NGÀY{hasRealtimeToday ? ' · RT hôm nay' : ' · chưa có RT hôm nay'}</span>\n        <span className=\"font-black text-blue-800\">Tiến độ chuẩn: {progressPct.toFixed(1)}%</span>\n      </div>\n\n      {/* 3. Action recommendations row */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3\">\n        <h4 className=\"font-extrabold text-slate-800 text-xs uppercase flex items-center gap-1.5\"><span>⚡ Tập trung push mạnh về số thi đua – {activeStore === 'TGDD' ? 'TGDĐ' : 'TOPZONE'}</span></h4>\n        <div className=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5 text-xs\">\n          <div className=\"p-3.5 bg-rose-50/70 border border-rose-200 rounded-xl space-y-1\">\n            <span className=\"text-[11px] font-bold text-rose-900 block\">⚠️ MÔN ĐANG KÉO TỤT</span>\n            {rows.filter(r => r.pctLk < 50).slice(-3).map((r,i) => <p key={i} className=\"text-rose-700 text-[11px]\">{formatProgramName(r.lkRow['CHƯƠNG TRÌNH'] || '')}: <b>{formatPercent(r.pctLk)}</b></p>)}\n          </div>\n          <div className=\"p-3.5 bg-emerald-50/70 border border-emerald-200 rounded-xl space-y-1\">\n            <span className=\"text-[11px] font-bold text-emerald-900 block\">📈 MÔN BỨT PHÁ</span>\n            {rows.slice(0,3).map((r,i) => <p key={i} className=\"text-emerald-800 text-[11px]\">{formatProgramName(r.lkRow['CHƯƠNG TRÌNH'] || '')}: <b>{formatPercent(r.pctLk)}</b></p>)}\n          </div>\n          <div className=\"p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-center flex flex-col justify-center\">\n            <span className=\"text-[10px] text-slate-400 font-bold uppercase block\">🎯 DỰ BÁO THÁNG NÀY</span>\n            <span className=\"text-xl font-black text-emerald-600 block mt-1\">{completedCount}/{totalPrograms}</span>\n            <span className=\"text-[10.5px] text-slate-500 font-medium\">MÔN ĐẠT TARGET</span>\n          </div>\n          <div className=\"p-3.5 bg-amber-50/70 border border-amber-200 rounded-xl space-y-1\">\n            <span className=\"text-[11px] font-bold text-amber-900 block\">📋 ƯU TIÊN HÔM NAY</span>\n            <p className=\"text-amber-800 text-[10.5px]\">• Đẩy mạnh Mở thẻ tín dụng & Bảo hiểm</p>\n            <p className=\"text-amber-800 text-[10.5px]\">• Chốt thêm 2 Sim Vina/Mobi</p>\n            <p className=\"text-amber-800 text-[10.5px]\">• Duy trì tốc độ môn Android & Đồng hồ</p>\n          </div>\n        </div>\n      </div>\n\n      {/* 4. 5 Metric Summary Boxes */}\n      <div className=\"grid grid-cols-2 md:grid-cols-5 gap-3.5 text-white\">\n        <div className=\"bg-slate-900 rounded-2xl p-4 text-center shadow-xs\"><span className=\"text-2xl font-black block\">{totalPrograms}</span><span className=\"text-[10px] text-slate-400 uppercase font-bold\">NGÀNH CÓ TARGET</span></div>\n        <div className=\"bg-emerald-600 rounded-2xl p-4 text-center shadow-xs\"><span className=\"text-2xl font-black block\">{completedCount}</span><span className=\"text-[10px] text-emerald-100 uppercase font-bold\">SỐ MÔN VỀ SỐ</span></div>\n        <div className=\"bg-teal-600 rounded-2xl p-4 text-center shadow-xs\"><span className=\"text-2xl font-black block\">{above50Count}</span><span className=\"text-[10px] text-teal-100 uppercase font-bold\">SỐ MÔN TRÊN 50%</span></div>\n        <div className=\"bg-rose-600 rounded-2xl p-4 text-center shadow-xs\"><span className=\"text-2xl font-black block\">{below50Count}</span><span className=\"text-[10px] text-rose-100 uppercase font-bold\">SỐ MÔN DƯỚI 50%</span></div>\n        <div className=\"bg-purple-600 rounded-2xl p-4 text-center col-span-2 md:col-span-1 shadow-xs\"><span className=\"text-2xl font-black block\">{forecastPct}%</span><span className=\"text-[10px] text-purple-100 uppercase font-bold\">TỈ LỆ DỰ KIẾN HT</span></div>\n      </div>\n\n      {/* 5. Detail Table — Lũy kế + Realtime hôm nay */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n        <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2 border-b border-slate-100\">\n          <div>\n            <h4 className=\"font-black text-slate-900 text-sm uppercase flex items-center gap-2\"><span>PUSH SỐ MÔN THI ĐUA {activeStore === 'TGDD' ? 'TGDĐ' : 'TOPZONE'}</span></h4>\n            <p className=\"text-[11px] text-slate-500\">Theo dõi song song <b>Lũy kế</b> và <b>Realtime hôm nay</b> · {rtLoadedCount}/{totalPrograms} môn đã có dữ liệu RT</p>\n          </div>\n          <div className=\"relative\">\n            <input type=\"text\" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder=\"🔍 Tìm ngành hàng...\" className=\"text-xs px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none w-48\" />\n          </div>\n        </div>\n\n        <div className=\"overflow-x-auto custom-scroll\">\n          <SortableTable className=\"w-full min-w-[1050px] text-left text-xs border-collapse\">\n            <thead className=\"bg-slate-50 text-slate-600 font-bold border-b border-slate-200\">\n              <tr>\n                <th className=\"py-2.5 px-3 text-center w-12\">#</th>\n                <th className=\"py-2.5 px-4\">NGÀNH HÀNG</th>\n                <th className=\"py-2.5 px-3 text-right\">LŨY KẾ</th>\n                {rtLoadedCount > 0 && <th className=\"py-2.5 px-3 text-right bg-amber-50 text-amber-700\">HÔM NAY (RT)</th>}\n                {rtLoadedCount > 0 && <th className=\"py-2.5 px-3 text-right bg-amber-50 text-amber-700\">% HT NGÀY</th>}\n                <th className=\"py-2.5 px-3 text-right text-rose-600\">GAP (THIẾU)</th>\n                <th className=\"py-2.5 px-3 text-right\">MỤC TIÊU</th>\n                <th className=\"py-2.5 px-4 text-center w-36\">TIẾN ĐỘ LK</th>\n                <th className=\"py-2.5 px-3 text-right\">DỰ KIẾN HT</th>\n                <th className=\"py-2.5 px-3 text-center\">SỐ/NGÀY</th>\n              </tr>\n            </thead>\n            <tbody className=\"divide-y divide-slate-100 text-slate-700\">\n              {rows.map((row, idx) => {\n                const ten = row.lkRow['CHƯƠNG TRÌNH'] || '';\n                let rankBadge: React.ReactNode = <span className=\"text-slate-400 font-mono text-[11px]\">{idx + 1}</span>;\n                if (idx === 0) rankBadge = <span className=\"text-base\">🥇</span>;\n                else if (idx === 1) rankBadge = <span className=\"text-base\">🥈</span>;\n                else if (idx === 2) rankBadge = <span className=\"text-base\">🥉</span>;\n\n                return (\n                  <tr key={String(row.lkRow['MÃ CHƯƠNG TRÌNH'] ?? idx)} onClick={() => onOpenProgramDetail(activeStore, row.lkRow['MÃ CHƯƠNG TRÌNH'], ten)} title=\"Bấm để xem chi tiết nhân viên bán môn này\" className={`hover:bg-blue-50/60 cursor-pointer transition border-b border-slate-100 ${row.isCompleted ? 'bg-emerald-50/20' : ''}`}>\n                    <td className=\"py-2.5 px-3 text-center\">{rankBadge}</td>\n                    <td className=\"py-2.5 px-4 font-bold text-slate-900\" title={ten}>{formatProgramName(ten)}</td>\n                    <td className=\"py-2.5 px-3 text-right font-mono font-semibold text-slate-800\" data-sort-value={row.isQty ? (row.lkValue) : (row.lkValue)}>{row.isQty ? formatInt(row.lkValue) : formatCurrency(row.lkValue)}</td>\n                    {rtLoadedCount > 0 && <td className={`py-2.5 px-3 text-right font-mono font-black ${row.rtRow ? 'text-amber-700' : 'text-slate-300'}`} data-sort-value={row.rtRow ? (row.isQty ? (row.rtValue) : (row.rtValue)) : ('—')}>{row.rtRow ? (row.isQty ? formatInt(row.rtValue) : formatCurrency(row.rtValue)) : '—'}</td>}\n                    {rtLoadedCount > 0 && <td className={`py-2.5 px-3 text-right font-black bg-amber-50/50 ${row.rtRow ? (row.pctRt >= progressPct ? 'text-emerald-700' : 'text-amber-700') : 'text-slate-300'}`} data-sort-value={row.rtRow ? (row.pctRt) : ('—')}>{row.rtRow ? formatPercent(row.pctRt) : '—'}</td>}\n                    <td className=\"py-2.5 px-3 text-right font-mono font-semibold text-rose-600\" data-sort-value={row.isQty ? (row.gap) : (row.gap)}>{row.isQty ? formatInt(row.gap) : formatCurrency(row.gap)}</td>\n                    <td className=\"py-2.5 px-3 text-right font-mono text-slate-500\" data-sort-value={row.isQty ? (row.target) : (row.target)}>{row.isQty ? formatInt(row.target) : formatCurrency(row.target)}</td>\n                    <td className=\"py-2.5 px-4 text-center\">\n                      <div className=\"flex items-center justify-center gap-2\">\n                        <div className=\"w-16 bg-slate-200 h-1.5 rounded-full overflow-hidden\"><div className={`${row.isCompleted ? 'bg-emerald-500' : 'bg-blue-600'} h-full`} style={{ width: `${Math.min(row.pctLk, 100)}%` }} /></div>\n                        <span className={`font-bold text-xs ${row.isCompleted ? 'text-emerald-700' : 'text-blue-700'}`}>{formatPercent(row.pctLk)}</span>\n                      </div>\n                    </td>\n                    <td className=\"py-2.5 px-3 text-right font-mono text-slate-600\" data-sort-value={row.pctDu}>{formatPercent(row.pctDu)}</td>\n                    <td className=\"py-2.5 px-3 text-center\"><span className={`px-2 py-0.5 rounded font-black text-[10px] ${row.isCompleted ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}`}>{row.soNgay}</span></td>\n                  </tr>\n                );\n              })}\n            </tbody>\n          </SortableTable>\n        </div>\n\n        {totalPrograms > 0 && rtLoadedCount < totalPrograms && (\n          <div className=\"text-[10.5px] text-slate-500 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2\">\n            ℹ️ Môn chưa có RT được giữ dấu <b>—</b>, không tự suy đoán từ Lũy kế. Khi anh dán Data Realtime mới, bảng sẽ tự ghép theo mã/tên chương trình cho đúng từng shop.\n          </div>\n        )}\n      </div>\n    </div>\n  );\n};\n","src/utils/forecastEngine.ts":"export interface ForecastResult {\n  forecast: number;\n  forecastPct: number;\n  remainingGap: number;\n  requiredPerDay: number;\n  runRatePerDay: number;\n}\n\nexport function calculateForecast(current: number, target: number, daysPassed: number, totalDays: number, targetMultiplier = 100): ForecastResult {\n  const safeCurrent = Number.isFinite(current) ? current : 0;\n  const safeTarget = Number.isFinite(target) ? target : 0;\n  const d = Math.max(1, Math.min(Math.round(daysPassed || 1), Math.max(1, Math.round(totalDays || 1))));\n  const days = Math.max(d, Math.round(totalDays || d));\n  const runRatePerDay = safeCurrent / d;\n  const forecast = runRatePerDay * days;\n  const forecastPct = safeTarget > 0 ? forecast / safeTarget * 100 : 0;\n  const adjustedTarget = safeTarget * (Math.max(0, targetMultiplier) / 100);\n  const remainingDays = Math.max(1, days - d);\n  const remainingGap = Math.max(0, adjustedTarget - safeCurrent);\n  const requiredPerDay = remainingGap / remainingDays;\n  return { forecast, forecastPct, remainingGap, requiredPerDay, runRatePerDay };\n}\n","src/utils/dataValidation.ts":"import { AppDataState } from '../types';\n\nexport interface ValidationResult { errors: string[]; warnings: string[]; }\n\nconst num = (v: any) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };\n\nexport function validateAppData(data: Partial<AppDataState> | null | undefined): ValidationResult {\n  const errors: string[] = [];\n  const warnings: string[] = [];\n  const d: any = data || {};\n  const storeRows = [...(d.dt_luyke || []), ...(d.dt_realtime || [])];\n  const seenStoresByCategory: Record<string, Set<string>> = { dt_luyke: new Set(), dt_realtime: new Set() };\n  const seenByCategory: Record<string, Set<string>> = { dt_luyke: new Set(), dt_realtime: new Set() };\n  (['dt_luyke','dt_realtime'] as const).forEach(category => {\n    (d[category] || []).forEach((r: any, i: number) => {\n      const code = String(r['MÃ ĐƠN VỊ'] || '').trim();\n      if (code) {\n        if (seenByCategory[category].has(code)) warnings.push(`${category}: mã đơn vị ${code} xuất hiện trùng trong cùng một cổng.`);\n        seenByCategory[category].add(code);\n      }\n    });\n  });\n  storeRows.forEach((r: any, i: number) => {\n    const code = String(r['MÃ ĐƠN VỊ'] || '').trim();\n    if (!code) errors.push(`Doanh thu ST dòng ${i + 1}: thiếu MÃ ĐƠN VỊ.`);\n    // Cùng mã shop xuất hiện ở LK và RT là hợp lệ; chỉ cảnh báo duplicate trong cùng một cổng.\n    // Cross-port duplicate không còn bị coi là lỗi.\n\n    ['TARGET (TR)','TARGET QĐ (TR)','DOANH THU (TR)','DOANH THU QĐ (TR)'].forEach(k => { if (num(r[k]) < 0) errors.push(`${code}: ${k} không được âm.`); });\n    const target = num(r['TARGET (TR)']); const dt = num(r['DOANH THU (TR)']);\n    if (target === 0 && dt > 0) warnings.push(`${code}: có doanh thu nhưng TARGET bằng 0.`);\n    if (target > 0 && dt > target * 2.5) warnings.push(`${code}: doanh thu cao bất thường so với TARGET, hãy kiểm tra đơn vị/số liệu.`);\n    const days = num(r['SỐ NGÀY CỬA SỔ']);\n    if (days < 0 || days > 31) errors.push(`${code}: SỐ NGÀY CỬA SỔ không hợp lệ.`);\n  });\n  const employeeRows = [...(d.dt_nv_luyke || []), ...(d.dt_nv_realtime || [])];\n  employeeRows.forEach((r: any, i: number) => {\n    if (!String(r['TÊN NHÂN VIÊN'] || '').trim()) warnings.push(`Doanh thu NV dòng ${i + 1}: thiếu tên nhân viên.`);\n    // BI có thể trả về doanh thu âm ở cấp nhân viên do điều chỉnh/hoàn trừ.\n    // Không chặn toàn bộ lần import chỉ vì DOANH THU/DOANH THU QĐ âm.\n    // Giữ lại dưới dạng cảnh báo để người dùng có thể kiểm tra khi cần.\n    ['DOANH THU (TR)','DOANH THU QĐ (TR)'].forEach(k => {\n      if (num(r[k]) < 0) warnings.push(`Doanh thu NV dòng ${i + 1}: ${k} đang âm do điều chỉnh/hoàn trừ, hãy kiểm tra nếu cần.`);\n    });\n  });\n  const compRows = [...(d.td_luyke || []), ...(d.td_realtime || []), ...(d.nv_tgdd || []), ...(d.nv_tz || [])];\n  compRows.forEach((r: any, i: number) => {\n    // BI có thể trả về doanh thu âm do điều chỉnh/hoàn trừ ở một số chương trình.\n    // Vì vậy không chặn toàn bộ lần import chỉ vì DOANH THU/DT QUY ĐỔI âm.\n    // Chỉ TARGET và SỐ LƯỢNG âm mới là lỗi dữ liệu nghiêm trọng.\n    ['TARGET (TR/SL theo LOẠI TĐ)','SỐ LƯỢNG'].forEach(k => { if (num(r[k]) < 0) errors.push(`Thi đua dòng ${i + 1}: ${k} không được âm.`); });\n  });\n  return { errors: [...new Set(errors)].slice(0, 30), warnings: [...new Set(warnings)].slice(0, 50) };\n}\n","src/components/OperationalPulse.tsx":"import React, { useState } from 'react';\nimport { AlertTriangle, CheckCircle2, TrendingUp, Users, ArrowRight, Store, Trophy, Database, Clock, Target, Zap } from 'lucide-react';\nimport { AppDataState, PersonnelConfigMap, ViewType } from '../types';\nimport { formatCurrency, formatPercent } from '../utils/formatters';\nimport { calculateForecast } from '../utils/forecastEngine';\nimport { DashboardView } from '../views/DashboardView';\n\nconst num = (v:any) => Number(v) || 0;\nconst pct = (a:number,b:number) => b > 0 ? a / b * 100 : 0;\n\nexport const OperationalPulse: React.FC<{appData: AppDataState; lastImportAt?: string | null; personnelConfig: PersonnelConfigMap; onNavigate?: (view: ViewType) => void; onUpdateSlot?: (slot: keyof AppDataState, data: any[]) => void; onClearAll?: () => void}> = ({appData, lastImportAt, personnelConfig, onNavigate, onUpdateSlot, onClearAll}) => {\n  const hasData = Object.values(appData).some(rows => Array.isArray(rows) && rows.length > 0);\n  const importedDate = lastImportAt ? new Date(lastImportAt) : null;\n  const importLabel = !hasData ? 'Chưa nạp data' : importedDate && Number.isFinite(importedDate.getTime())\n    ? `Nạp data gần nhất: ${importedDate.toLocaleTimeString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })} – ${importedDate.toLocaleDateString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', day: '2-digit', month: '2-digit', year: 'numeric' })}`\n    : 'Nạp data gần nhất: chưa ghi nhận';\n  const [showEmbeddedDataInput, setShowEmbeddedDataInput] = useState(false);\n  const lk = (appData.dt_luyke || []).filter((r:any) => String(r['MÃ ĐƠN VỊ'] || '').trim());\n  const rt = (appData.dt_realtime || []).filter((r:any) => String(r['MÃ ĐƠN VỊ'] || '').trim());\n  const td = [...(appData.td_luyke || []), ...(appData.td_realtime || [])];\n  const emp = [...(appData.dt_nv_luyke || []), ...(appData.dt_nv_realtime || [])].filter((r:any) => String(r['TÊN NHÂN VIÊN'] || r['ĐƠN VỊ / NHÂN VIÊN'] || '').trim());\n\n  const target = lk.reduce((s:number,r:any)=>s+(num(r['TARGET QĐ (TR)'])||num(r['TARGET (TR)'])),0);\n  const actual = lk.reduce((s:number,r:any)=>s+num(r['DOANH THU QĐ (TR)']),0);\n  const rtActual = rt.reduce((s:number,r:any)=>s+num(r['DOANH THU QĐ (TR)']),0);\n  const rtQd = rt.reduce((s:number,r:any)=>s+num(r['DOANH THU QĐ (TR)']),0);\n  const now = new Date();\n  const totalDays = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();\n  const day = now.getDate();\n  const daysElapsed = Math.max(1, Math.min(totalDays, day));\n  const f = calculateForecast(actual, target, Math.max(0, day - 1), totalDays);\n  const progressPct = pct(actual,target);\n  const dailyRunRate = actual / daysElapsed;\n  const remaining = Math.max(0,target-actual);\n  const neededPerDay = remaining / Math.max(1,totalDays-day);\n\n  const staffMap = new Map<string, any>();\n  emp.forEach((r:any) => {\n    const name = String(r['TÊN NHÂN VIÊN'] || r['ĐƠN VỊ / NHÂN VIÊN'] || '').trim();\n    if (!name) return;\n    const prev = staffMap.get(name) || { name, revenue:0, qd:0, qty:0, pct:0 };\n    prev.revenue += num(r['DOANH THU (TR)']);\n    prev.qd += num(r['DOANH THU QĐ (TR)']) || num(r['DT QUY ĐỔI (TR)']);\n    prev.qty += num(r['SỐ LƯỢNG']);\n    prev.pct = Math.max(prev.pct, num(r['% HT THÁNG']));\n    staffMap.set(name, prev);\n  });\n  const topStaff = [...staffMap.values()].sort((a,b)=>b.qd-a.qd).slice(0,5);\n\n  const configuredStaff = Object.values(personnelConfig || {}).reduce((n:any,x:any)=>n+Object.values(x||{}).filter((c:any)=>c?.isOfficial!==false&&c?.isVisible!==false).length,0);\n\n  const shops = [\n    { code:'933', name:'TGDĐ', row: lk.find((r:any)=>String(r['MÃ ĐƠN VỊ']).trim()==='933' || /TGD/i.test(String(r['TÊN ĐƠN VỊ']||''))) },\n    { code:'10341', name:'TopZone', row: lk.find((r:any)=>String(r['MÃ ĐƠN VỊ']).trim()==='10341' || /AAR|TOPZONE/i.test(String(r['TÊN ĐƠN VỊ']||''))) },\n  ].map(x=>({ ...x, target:num(x.row?.['TARGET QĐ (TR)'])||num(x.row?.['TARGET (TR)']), actual:num(x.row?.['DOANH THU QĐ (TR)']) }));\n\n  const alerts:string[]=[];\n  if (!lk.length) alerts.push('Chưa có dữ liệu Doanh Thu Lũy Kế — hãy bấm “Nhập / Dán Data”.');\n  if (lk.length && target>0 && f.forecastPct < 100) alerts.push(`Dự báo cuối tháng ${formatPercent(f.forecastPct,0)} target — cần tăng tốc để đạt kế hoạch.`);\n  shops.forEach(s=>{ if(s.row && s.target>0 && pct(s.actual,s.target) < Math.max(40, progressPct-15)) alerts.push(`${s.code} ${s.name} đang thấp hơn nhịp chung của cụm.`); });\n  if (rt.length && rtActual===0) alerts.push('Có bảng Realtime nhưng doanh thu quy đổi hiện tại đang bằng 0 — kiểm tra cột dữ liệu.');\n\n  const dataBlocks = [\n    ['DT Lũy kế', appData.dt_luyke?.length || 0],\n    ['DT Realtime', appData.dt_realtime?.length || 0],\n    ['Thi đua ST', (appData.td_luyke?.length || 0)+(appData.td_realtime?.length || 0)],\n    ['Thi đua NV', (appData.nv_tgdd?.length || 0)+(appData.nv_tz?.length || 0)],\n    ['DT Nhân viên', (appData.dt_nv_luyke?.length || 0)+(appData.dt_nv_realtime?.length || 0)],\n  ];\n  const loadedBlocks = dataBlocks.filter(x=>Number(x[1])>0).length;\n\n  return <div className=\"space-y-5\">\n    <section className=\"bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden\">\n      <div className=\"px-6 py-5 bg-gradient-to-r from-white via-blue-50/40 to-indigo-50/50 border-b border-slate-100\">\n        <div className=\"flex flex-wrap items-center justify-between gap-4\">\n          <div>\n            <div className=\"text-[11px] font-black uppercase tracking-[0.16em] text-blue-600 flex items-center gap-2\"><span className=\"w-2 h-2 rounded-full bg-blue-600 animate-pulse\"/>TRUNG TÂM ĐIỀU HÀNH</div>\n            <h1 className=\"text-2xl md:text-3xl font-black text-slate-900 mt-1\">Sức khỏe cụm hôm nay</h1>\n            <p className=\"text-xs text-slate-500 mt-1\">Tổng hợp trực tiếp từ các bảng Data anh đã nạp · Ngày {day}/{totalDays}</p>\n          </div>\n          <div className=\"flex items-center gap-2 flex-wrap justify-end\">\n            <span title=\"Thời điểm nạp dữ liệu vào ứng dụng, không phải thời điểm chốt số liệu trên hệ thống bán hàng.\" className=\"px-3 py-2 rounded-xl bg-white border border-slate-200 text-[11px] font-bold text-slate-600 shadow-sm flex items-center gap-1.5\"><Clock className=\"w-3.5 h-3.5 shrink-0\"/> {importLabel}</span>\n            <button type=\"button\" onClick={()=>setShowEmbeddedDataInput(true)} className=\"px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 text-[11px] font-black shadow-sm flex items-center gap-1.5 transition cursor-pointer\" title=\"Nhập riêng từng loại dữ liệu khi cổng tự động không nhận diện được\">\n              <Database className=\"w-3.5 h-3.5\"/> Cổng nhập Data riêng\n            </button>\n            <button onClick={()=>onNavigate?.(ViewType.DU_BAO)} className=\"px-3 py-2 rounded-xl bg-blue-600 text-white text-[11px] font-black shadow-sm hover:bg-blue-700 flex items-center gap-1.5\">Mở dự báo <ArrowRight className=\"w-3.5 h-3.5\"/></button>\n          </div>\n        </div>\n      </div>\n\n      <div className=\"p-5 md:p-6 space-y-5\">\n        <div className=\"grid grid-cols-2 xl:grid-cols-6 gap-3\">\n          <div className=\"rounded-2xl bg-blue-50 border border-blue-100 p-4 xl:col-span-2  font-bold text-slate-500\">NGÀY GẦN NHẤT</div><div className=\"text-xl font-black\">{current?.date||'—'}</div></div><div className=\"bg-white rounded-2xl border p-4\"><div className=\"text-[10px] font-bold text-slate-500\">DOANH THU QĐ</div><div className=\"text-xl font-black\">{current?formatCurrency(current.achieved,1)+' TR':'—'}</div></div><div className=\"bg-white rounded-2xl border p-4\"><div className=\"text-[10px] font-bold text-slate-500\">% TARGET</div><div className=\"text-xl font-black\">{current?formatPercent(current.pct,1):'—'}</div></div><div className=\"bg-white rounded-2xl border p-4\"><div className=\"text-[10px] font-bold text-slate-500\">BIẾN ĐỘNG</div><div className={\"text-xl font-black \"+(delta>=0?'text-emerald-600':'text-rose-600')}>{current?formatPercent(delta,1):'—'}</div></div></div>\n  <div className=\"bg-white rounded-2xl border border-slate-200 overflow-hidden\"><div className=\"p-4 border-b font-black text-sm\">LỊCH SỬ TIẾN ĐỘ</div>{rows.length?<div className=\"overflow-auto\"><SortableTable className=\"w-full text-xs\"><thead className=\"bg-slate-50\"><tr><th className=\"p-3 text-left\">Ngày</th><th className=\"p-3 text-right\">Doanh thu QĐ</th><th className=\"p-3 text-right\">Target</th><th className=\"p-3 text-right\">% HT</th><th className=\"p-3 text-right\">So với ngày trước</th></tr></thead><tbody>{rows.slice().reverse().map((r:any,i:number)=>{const before=rows[rows.indexOf(r)-1];const d=before?r.pct-before.pct:0;return <tr key={r.date} className=\"border-t\"><td className=\"p-3 font-bold\">{r.date}</td><td className=\"p-3 text-right\">{formatCurrency(r.achieved,1)} TR</td><td className=\"p-3 text-right\">{formatCurrency(r.target,1)} TR</td><td className=\"p-3 text-right font-black\" data-sort-value={r.pct}>{formatPercent(r.pct,1)}</td><td className={\"p-3 text-right font-bold \"+(d>=0?'text-emerald-600':'text-rose-600')} data-sort-value={d}>{formatPercent(d,1)}</td></tr>})}</tbody></SortableTable></div>:<div className=\"p-8 tex
