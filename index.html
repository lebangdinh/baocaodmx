<style id="app-custom-css">

:root {
  --app-font: 'Be Vietnam Pro', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --kpi-align: center;
  --kpi-size: 3.2rem;
  --content-size: 14px;
  --export-width: 1900px;
  --grid-color: #e2e8f0;
}

body {
  font-family: var(--app-font);
  font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Tabular figures for numbers across tables and cards */
table, td, th, .tabular-nums, .font-mono {
  font-variant-numeric: tabular-nums;
}

/* Custom Scrollbar */
.custom-scroll::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
.custom-scroll::-webkit-scrollbar-track {
  background: #f1f5f9;
}
.custom-scroll::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 9999px;
}
.custom-scroll::-webkit-scrollbar-thumb:hover {
  background: #94a3b8;
}

.nav-item-active {
  background-color: #1d4ed8 !important;
  color: #ffffff !important;
  font-weight: 700 !important;
  box-shadow: 0 4px 12px -2px rgba(29, 78, 216, 0.3);
}
.nav-item-active svg {
  color: #ffffff !important;
}

/* Table grid borders */
.table-grid-caro td, .table-grid-caro th {
  border: 1px solid var(--grid-color) !important;
}
.table-grid-horizontal td, .table-grid-horizontal th {
  border-bottom: 1px solid var(--grid-color) !important;
  border-top: 1px solid var(--grid-color) !important;
  border-left: none !important;
  border-right: none !important;
}
.table-grid-none td, .table-grid-none th {
  border: none !important;
}

/* Interactive table headers */
table thead th {
  user-select: none;
  transition: background-color 0.15s ease;
}
table thead th:hover {
  background-color: rgba(37, 99, 235, 0.08);
}

/* Image Export Clean Rules */
.export-only {
  display: none;
}

.is-exporting .no-export {
  display: none !important;
}

.is-exporting .export-only {
  display: inline-flex !important;
}

.is-exporting .card-programs-container,
.is-exporting [data-export-expand="true"] {
  max-height: none !important;
  height: auto !important;
  overflow: visible !important;
  overflow-y: visible !important;
  overflow-x: visible !important;
}

/* Suppress all scrollbars during export */
.is-exporting *::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
.is-exporting * {
  scrollbar-width: none !important;
  -ms-overflow-style: none !important;
}

/* Ensure crystal-clear text during export */
.is-exporting {
  -webkit-font-smoothing: subpixel-antialiased !important;
  text-rendering: geometricPrecision !important;
}

<script id="embedded-source" type="application/json">{"src/App.tsx":"import React, { useState, useEffect, useRef } from 'react';\nimport { ViewType, AppDataState, PersonnelConfigMap, ScreenshotItem } from './types';\nimport { Header } from './components/Header';\nimport { Sidebar } from './components/Sidebar';\nimport { QuickUploadModal } from './components/QuickUploadModal';\nimport { ProgramDetailModal } from './components/ProgramDetailModal';\nimport { ImageExportModal } from './components/ImageExportModal';\nimport { ClearSessionModal } from './components/ClearSessionModal';\nimport { Drawers, DrawerType } from './components/Drawers';\nimport { captureElement, downloadImage } from './utils/imageExporter';\nimport { validateAppData } from './utils/dataValidation';\nimport { OperationalPulse } from './components/OperationalPulse';\nimport { DailyProgressView } from './views/DailyProgressView';\n\nimport { DashboardView } from './views/DashboardView';\nimport { BaoCaoCuoiNgayView } from './views/BaoCaoCuoiNgayView';\nimport { ThiDuaStView } from './views/ThiDuaStView';\nimport { SucKhoeCumView } from './views/SucKhoeCumView';\nimport { DoanhThuStView } from './views/DoanhThuStView';\nimport { SucKhoeNvView } from './views/SucKhoeNvView';\nimport { SoSanhView } from './views/SoSanhView';\nimport { DuBaoView } from './views/DuBaoView';\nimport { KpiCustomView } from './views/KpiCustomView';\n\nconst STORAGE_KEY_DATA = 'skst_app_data_v7';\nconst STORAGE_KEY_PERSONNEL = 'skst_personnel_config_v7';\nconst STORAGE_KEY_AUTO_BACKUPS = 'skst_auto_backups_v2';\nconst STORAGE_KEY_DAILY = 'skst_daily_snapshots_v1';\nconst LEGACY_STORAGE_KEYS = ['skst_app_data_v1','skst_personnel_config_v1','skst_app_data_v2','skst_personnel_config_v2','skst_app_data_v3','skst_personnel_config_v3','skst_app_data_v4','skst_personnel_config_v4','skst_app_data_v5','skst_personnel_config_v5','skst_app_data_v6','skst_personnel_config_v6'];\n\ntry {\n  LEGACY_STORAGE_KEYS.forEach((key) => localStorage.removeItem(key));\n} catch (e) {\n  console.warn('Could not clean legacy/demo storage', e);\n}\n\nconst EMPTY_APP_DATA: AppDataState = {\n  dt_luyke: [],\n  dt_realtime: [],\n  td_luyke: [],\n  td_realtime: [],\n  nv_tgdd: [],\n  nv_tz: [],\n  dt_nv_luyke: [],\n  dt_nv_realtime: [],\n};\n\nconst EMPTY_PERSONNEL_CONFIG: PersonnelConfigMap = { TGDD: {}, TOPZONE: {} };\n\n// Danh sách nhân sự mặc định của cụm NHT. Có thể chỉnh sửa trong Tùy Biến KPI Nhân Sự.\nconst DEFAULT_PERSONNEL_CONFIG: PersonnelConfigMap = {\n  TGDD: {\n    'Lê Văn Nhân': { isOfficial: true, isVisible: true, targetPct: 37.5 },\n    'Lê Thị Thanh Trâm': { isOfficial: true, isVisible: true, targetPct: 37.5 },\n    'Nguyễn Thị Thy': { isOfficial: true, isVisible: true, targetPct: 37.5 },\n    'Trần Thị Huyền Trang': { isOfficial: true, isVisible: true, targetPct: 37.5 },\n  },\n  TOPZONE: {\n    'Nguyễn Quỳnh Anh': { isOfficial: true, isVisible: true, targetPct: 25 },\n    'Trần Minh Hải': { isOfficial: true, isVisible: true, targetPct: 25 },\n    'Lê Thị Mỹ Linh': { isOfficial: true, isVisible: true, targetPct: 25 },\n    'Trần Thị Mỹ Trang': { isOfficial: true, isVisible: true, targetPct: 25 },\n    'Tạ Đức Hiếu': { isOfficial: true, isVisible: true, targetPct: 25 },\n    'Đỗ Nhật Trinh': { isOfficial: true, isVisible: true, targetPct: 25 },\n  },\n};\n\nexport default function App() {\n  // 1. App State\n  const [currentView, setCurrentView] = useState<ViewType>(ViewType.BAO_CAO_CUOI_NGAY);\n  const [activeStore, setActiveStore] = useState<string>('933');\n  const [appData, setAppData] = useState<AppDataState>(() => {\n    try {\n      const saved = localStorage.getItem(STORAGE_KEY_DATA);\n      if (saved) return JSON.parse(saved);\n    } catch (e) {\n      console.error('Error loading saved app data:', e);\n    }\n    return EMPTY_APP_DATA;\n  });\n\n  const [personnelConfig, setPersonnelConfig] = useState<PersonnelConfigMap>(() => {\n    try {\n      const saved = localStorage.getItem(STORAGE_KEY_PERSONNEL);\n      if (saved) {\n        const parsed = JSON.parse(saved);\n        // Nếu đã có cấu hình trước đó thì giữ nguyên, nhưng luôn bổ sung nhân sự mặc định còn thiếu.\n        return {\n          TGDD: { ...(DEFAULT_PERSONNEL_CONFIG.TGDD || {}), ...(parsed?.TGDD || {}) },\n          TOPZONE: { ...(DEFAULT_PERSONNEL_CONFIG.TOPZONE || {}), ...(parsed?.TOPZONE || {}) },\n        };\n      }\n    } catch (e) {\n      console.error('Error loading saved personnel config:', e);\n    }\n    return DEFAULT_PERSONNEL_CONFIG;\n  });\n\n  // 2. Modals & Drawers\n  const [isUploadModalOpen, setIsUploadModalOpen] = useState<boolean>(false);\n  const [isClearModalOpen, setIsClearModalOpen] = useState<boolean>(false);\n  const [activeDrawer, setActiveDrawer] = useState<DrawerType>(null);\n  const [isSidebarOpen, setIsSidebarOpen] = useState<boolean>(false);\n  const [screenshots, setScreenshots] = useState<ScreenshotItem[]>([]);\n  const [dailySnapshots, setDailySnapshots] = useState<any[]>(() => {\n    try {\n      const saved = localStorage.getItem(STORAGE_KEY_DAILY);\n      return saved ? JSON.parse(saved) : [];\n    } catch { return []; }\n  });\n  const [exportedImage, setExportedImage] = useState<{\n    dataUrl: string;\n    blob: Blob;\n    fileName: string;\n  } | null>(null);\n  const [isExporting, setIsExporting] = useState<boolean>(false);\n  const [lastClearedBackup, setLastClearedBackup] = useState<any | null>(null);\n  const [drilldownModal, setDrilldownModal] = useState<{\n    isOpen: boolean;\n    storeKey: string;\n    programCode: string | number;\n    programName: string;\n  }>({\n    isOpen: false,\n    storeKey: 'TGDĐ',\n    programCode: '',\n    programName: '',\n  });\n\n  // UI Theme Customization States\n  const [themeFont, setThemeFont] = useState<string>('Plus Jakarta Sans, sans-serif');\n  const [kpiAlign, setKpiAlign] = useState<string>('center');\n  const [kpiSize, setKpiSize] = useState<number>(3.2);\n\n  // 3. Notifications & Toast\n  const [toast, setToast] = useState<{ show: boolean; message: string; type: 'success' | 'info' | 'error' }>({\n    show: false,\n    message: '',\n    type: 'success',\n  });\n\n  // Tự động lưu các snapshot phiên gần nhất để có thể khôi phục khi cần.\n  const saveAutoBackupSnapshot = (data: AppDataState, personnel: PersonnelConfigMap, force = false) => {\n    try {\n      const now = new Date();\n      const dayKey = now.toISOString().slice(0, 10);\n      const existing = JSON.parse(localStorage.getItem(STORAGE_KEY_AUTO_BACKUPS) || '[]');\n      const list = Array.isArray(existing) ? existing : [];\n      const alreadyToday = list.some((x: any) => String(x.savedAt || '').slice(0, 10) === dayKey);\n      if (!force && alreadyToday) return;\n      const snapshot = { appData: data, personnelConfig: personnel, savedAt: now.toISOString(), reason: force ? 'manual-safety-point' : 'daily-auto-backup' };\n      localStorage.setItem(STORAGE_KEY_AUTO_BACKUPS, JSON.stringify([snapshot, ...list].slice(0, 5)));\n    } catch (e) {\n      console.warn('Could not create automatic session backup', e);\n    }\n  };\n\n  const saveDailyProgressSnapshot = (data: AppDataState) => {\n    try {\n      const now = new Date();\n      const key = now.toISOString().slice(0, 10);\n      const lk = data.dt_luyke || [];\n      const stores = lk.filter((r: any) => String(r['MÃ ĐƠN VỊ'] || '').trim());\n      if (!stores.length) return;\n      const total = (field: string) => stores.reduce((s: number, r: any) => s + (Number(r[field]) || 0), 0);\n      const target = total('TARGET QĐ (TR)') || total('TARGET (TR)');\n      const achieved = total('DOANH THU QĐ (TR)');\n      const record = { date: key, updatedAt: now.toISOString(), target, achieved, pct: target > 0 ? achieved / target * 100 : 0, stores: stores.map((r: any) => ({ code: String(r['MÃ ĐƠN VỊ'] || ''), name: String(r['TÊN ĐƠN VỊ'] || ''), target: Number(r['TARGET QĐ (TR)']) || Number(r['TARGET (TR)']) || 0, achieved: Number(r['DOANH THU QĐ (TR)']) || 0 })) };\n      const existing = JSON.parse(localStorage.getItem(STORAGE_KEY_DAILY) || '[]');\n      const list = Array.isArray(existing) ? existing : [];\n      const next = [record, ...list.filter((x: any) => x.date !== key)].slice(0, 62);\n      localStorage.setItem(STORAGE_KEY_DAILY, JSON.stringify(next));\n      setDailySnapshots(next);\n    } catch (e) { console.warn('Could not save daily progress snapshot', e); }\n  };\n\n  const getLatestAutoBackup = () => {\n    try {\n      const list = JSON.parse(localStorage.getItem(STORAGE_KEY_AUTO_BACKUPS) || '[]');\n      return Array.isArray(list) && list.length ? list[0] : null;\n    } catch (e) { return null; }\n  };\n\n  const handleDownloadAutoBackup = () => {\n    const latest = getLatestAutoBackup();\n    if (!latest) { showToast('Chưa có bản sao lưu tự động nào!', 'info'); return; }\n    const blob = new Blob([JSON.stringify(latest, null, 2)], { type: 'application/json' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    const stamp = String(latest.savedAt || new Date().toISOString()).slice(0, 19).replace(/[T:]/g, '-');\n    a.download = `SucKhoeSieuThi_AutoBackup_${stamp}.json`;\n    a.click();\n    URL.revokeObjectURL(url);\n    showToast('Đã tải bản sao lưu tự động gần nhất!');\n  };\n\n  const handleRestoreLatestAutoBackup = () => {\n    const latest = getLatestAutoBackup();\n    if (!latest?.appData && !latest?.personnelConfig) { showToast('Chưa có bản sao lưu tự động hợp lệ!', 'error'); return; }\n    if (latest.appData) {\n      const validation = validateAppData(latest.appData);\n      if (validation.errors.length) { showToast('Bản backup gần nhất không hợp lệ!', 'error'); return; }\n      setAppData(latest.appData);\n    }\n    if (latest.personnelConfig) setPersonnelConfig(latest.personnelConfig);\n    showToast('Đã khôi phục bản sao lưu tự động gần nhất!');\n  };\n\n  const showToast = (message: string, type: 'success' | 'info' | 'error' = 'success') => {\n    setToast({ show: true, message, type });\n    setTimeout(() => {\n      setToast(prev => ({ ...prev, show: false }));\n    }, 3500);\n  };\n\n  // 4. Persistence Effect — lưu tức thời + tạo snapshot tự động gần nhất\n  useEffect(() => {\n    try {\n      localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(appData));\n      localStorage.setItem(STORAGE_KEY_PERSONNEL, JSON.stringify(personnelConfig));\n      saveAutoBackupSnapshot(appData, personnelConfig);\n      saveDailyProgressSnapshot(appData);\n    } catch (e) {\n      console.warn('Could not save session to local storage', e);\n    }\n  }, [appData, personnelConfig]);\n\n  // 5. Handlers\n  const handleDataParsed = (newData: Partial<AppDataState>) => {\n    const merged = { ...appData, ...newData } as AppDataState;\n    const validation = validateAppData(merged);\n    if (validation.errors.length) {\n      showToast(`Dữ liệu có ${validation.errors.length} lỗi nghiêm trọng. Vui lòng kiểm tra lại!`, 'error');\n      return;\n    }\n    setAppData(merged);\n    if (validation.warnings.length) showToast(`Đã nạp dữ liệu, có ${validation.warnings.length} cảnh báo cần xem lại.`, 'info');\n    else showToast('Đã nạp và cập nhật dữ liệu Excel thành công!');\n  };\n\n  const handleConfirmClear = (options: {\n    resetPersonnel: boolean;\n    clearScreenshots: boolean;\n  }) => {\n    const safetyBackup = { appData: JSON.parse(JSON.stringify(appData)), personnelConfig: JSON.parse(JSON.stringify(personnelConfig)), savedAt: new Date().toISOString() };\n    saveAutoBackupSnapshot(appData, personnelConfig, true);\n    setLastClearedBackup(safetyBackup);\n    setAppData(EMPTY_APP_DATA);\n    try {\n      localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(EMPTY_APP_DATA));\n    } catch (e) {}\n    showToast('Đã xóa sạch toàn bộ dữ liệu đang lưu trong phiên!', 'info');\n\n    if (options.resetPersonnel) {\n      setPersonnelConfig(EMPTY_PERSONNEL_CONFIG);\n      try {\n        localStorage.removeItem(STORAGE_KEY_PERSONNEL);\n      } catch (e) {}\n    }\n\n    if (options.clearScreenshots) {\n      setScreenshots([]);\n    }\n  };\n\n  const handleExportSession = () => {\n    const backup = {\n      appData,\n      personnelConfig,\n      exportedAt: new Date().toISOString(),\n    };\n    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url;\n    a.download = `SucKhoeSieuThi_Backup_${new Date().toISOString().slice(0, 10)}.json`;\n    a.click();\n    URL.revokeObjectURL(url);\n    showToast('Đã tải file sao lưu toàn bộ phiên làm việc!');\n  };\n\n  const handleImportSession = (file: File) => {\n    const reader = new FileReader();\n    reader.onload = (e) => {\n      try {\n        const content = e.target?.result as string;\n        const parsed = JSON.parse(content);\n        if (parsed.appData) {\n          const validation = validateAppData(parsed.appData);\n          if (validation.errors.length) { showToast(`File backup có ${validation.errors.length} lỗi dữ liệu, không thể phục hồi.`, 'error'); return; }\n          saveAutoBackupSnapshot(appData, personnelConfig, true);\n          setAppData(parsed.appData);\n        }\n        if (parsed.personnelConfig) setPersonnelConfig(parsed.personnelConfig);\n        showToast('Đã phục hồi phiên làm việc thành công!');\n      } catch (err) {\n        showToast('File sao lưu không hợp lệ!', 'error');\n      }\n    };\n    reader.readAsText(file);\n  };\n\n  const exportContainerRef = useRef<HTMLDivElement>(null);\n\n  const handleExportScreenshot = async (storeLabel?: string) => {\n    if (!exportContainerRef.current || isExporting) return;\n    setIsExporting(true);\n    showToast('Đang kết xuất ảnh báo cáo chất lượng cao (2x DPI)...', 'info');\n\n    try {\n      const dateStr = new Date().toISOString().slice(0, 10);\n      const suffix = storeLabel ? `_${storeLabel}` : '';\n      const fileName = `BaoCao_${currentView}${suffix}_${dateStr}.png`;\n\n      const result = await captureElement(exportContainerRef.current, {\n        fileName,\n        backgroundColor: '#f8fafc',\n        scale: 2,\n      });\n\n      // 1. Add to session screenshot collection\n      const newScreenshot: ScreenshotItem = {\n        name: result.fileName,\n        url: result.dataUrl,\n        time: new Date().toLocaleTimeString('vi-VN'),\n      };\n      setScreenshots(prev => [newScreenshot, ...prev]);\n\n      // 2. Trigger direct browser download\n      downloadImage(result.blob, result.fileName);\n\n      // 3. Open Preview & Quick Copy Modal\n      setExportedImage(result);\n\n      showToast('Đã xuất ảnh báo cáo thành công!');\n    } catch (err) {\n      console.error('Screenshot export error:', err);\n      showToast('Có lỗi khi tạo ảnh báo cáo! Vui lòng thử lại.', 'error');\n    } finally {\n      setIsExporting(false);\n    }\n  };\n\n  const handleOpenProgramDetail = (storeKey: string, programCode: string | number, programName: string) => {\n    const normalized = String(storeKey || '').trim().toUpperCase();\n    const isTopZone = normalized === 'TOPZONE' || normalized === 'AAR' || normalized === '10341' || normalized.includes('TOPZONE') || normalized.includes('AAR');\n    setDrilldownModal({\n      isOpen: true,\n      storeKey: isTopZone ? 'TopZone' : 'TGDĐ',\n      programCode,\n      programName,\n    });\n  };\n\n  const handleAutoDivideStaff = (storeKey: 'TGDD' | 'TOPZONE') => {\n    const storePersonnel = personnelConfig[storeKey] || {};\n    const names = Object.keys(storePersonnel);\n    const activeStaff = names.filter(n => {\n      const cfg = storePersonnel[n] || {};\n      return cfg.isOfficial !== false && cfg.isVisible !== false;\n    });\n    if (activeStaff.length === 0) {\n      showToast('Không có nhân sự nào đang hiển thị và là nội bộ!', 'error');\n      return;\n    }\n    const equalPct = Math.round((100 / activeStaff.length) * 10) / 10;\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[storeKey]) next[storeKey] = {};\n    names.forEach(n => {\n      const isOff = next[storeKey][n]?.isOfficial !== false;\n      const isVis = next[storeKey][n]?.isVisible !== false;\n      if (isOff && isVis) {\n        next[storeKey][n].targetPct = equalPct;\n      } else {\n        next[storeKey][n].targetPct = 0;\n      }\n    });\n    setPersonnelConfig(next);\n    showToast(`Đã chia đều 100% KPI cho ${activeStaff.length} nhân sự ${storeKey}!`);\n  };\n\n  const handleDivideEquallyWithMultiplier = (storeKey: 'TGDD' | 'TOPZONE', mult: number) => {\n    const storePersonnel = personnelConfig[storeKey] || {};\n    const names = Object.keys(storePersonnel);\n    const activeStaff = names.filter(n => {\n      const cfg = storePersonnel[n] || {};\n      return cfg.isOfficial !== false && cfg.isVisible !== false;\n    });\n    if (activeStaff.length === 0) {\n      showToast('Không có nhân sự nào đang hiển thị và là nội bộ!', 'error');\n      return;\n    }\n    const pct = Math.round(((100 / activeStaff.length) * (mult / 100)) * 10) / 10;\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[storeKey]) next[storeKey] = {};\n    names.forEach(n => {\n      const isOff = next[storeKey][n]?.isOfficial !== false;\n      const isVis = next[storeKey][n]?.isVisible !== false;\n      if (isOff && isVis) {\n        next[storeKey][n].targetPct = pct;\n      } else {\n        next[storeKey][n].targetPct = 0;\n      }\n    });\n    setPersonnelConfig(next);\n    showToast(`Đã chia đều mục tiêu (${mult}%) cho ${activeStaff.length} nhân sự!`);\n  };\n\n  // 6. Render Active View\n  const renderCurrentView = () => {\n    switch (currentView) {\n      case ViewType.DASHBOARD:\n        return <OperationalPulse\n              appData={appData}\n              personnelConfig={personnelConfig}\n              onNavigate={setCurrentView}\n              onUpdateSlot={(slot, data) => {\n                setAppData(prev => ({ ...prev, [slot]: data }));\n                showToast(`Đã nạp thành công ${data.length} dòng dữ liệu!`);\n              }}\n              onClearAll={() => setIsClearModalOpen(true)}\n            />;\n      case ViewType.BAO_CAO_CUOI_NGAY:\n        return (\n          <BaoCaoCuoiNgayView\n            appData={appData}\n            onExportTab={handleExportScreenshot}\n            onOpenProgramDetail={handleOpenProgramDetail}\n          />\n        );\n      case ViewType.THI_DUA_ST:\n        return (\n          <ThiDuaStView\n            appData={appData}\n            onExportTab={handleExportScreenshot}\n            onOpenProgramDetail={handleOpenProgramDetail}\n          />\n        );\n      case ViewType.SUC_KHOE_CUM:\n        return (\n          <SucKhoeCumView\n            appData={appData}\n            onOpenProgramDetail={handleOpenProgramDetail}\n          />\n        );\n      case ViewType.DOANH_THU_ST:\n        return (\n          <DoanhThuStView\n            appData={appData}\n            activeStore={activeStore}\n            onChangeActiveStore={setActiveStore}\n            onExportTab={handleExportScreenshot}\n            onOpenProgramDetail={handleOpenProgramDetail}\n          />\n        );\n      case ViewType.SUC_KHOE_NV:\n        return (\n          <SucKhoeNvView\n            appData={appData}\n            personnelConfig={personnelConfig}\n            onUpdatePersonnelConfig={setPersonnelConfig}\n            onOpenQuickUpload={() => setIsUploadModalOpen(true)}\n            onOpenProgramDetail={handleOpenProgramDetail}\n            onOpenPersonnelSettings={() => setCurrentView(ViewType.KPI_CUSTOM)}\n          />\n        );\n      case ViewType.SO_SANH:\n        return (\n          <SoSanhView\n            appData={appData}\n            onExportTab={handleExportScreenshot}\n            onOpenProgramDetail={handleOpenProgramDetail}\n          />\n        );\n      case ViewType.DU_BAO:\n        return (\n          <DuBaoView\n            appData={appData}\n            onExportTab={handleExportScreenshot}\n          />\n        );\n      case ViewType.THEO_DOI_NGAY:\n        return (\n          <DailyProgressView appData={appData} dailySnapshots={dailySnapshots} onRefresh={() => saveDailyProgressSnapshot(appData)} />\n        );\n      case ViewType.KPI_CUSTOM:\n        return (\n          <KpiCustomView\n            appData={appData}\n            onUpdateAppData={setAppData}\n            personnelConfig={personnelConfig}\n            onUpdateConfig={setPersonnelConfig}\n            onResetDefault={() => {\n              setPersonnelConfig(JSON.parse(JSON.stringify(DEFAULT_PERSONNEL_CONFIG)));\n              showToast('Đã khôi phục danh sách 10 nhân sự NHT mặc định!');\n            }}\n          />\n        );\n      default:\n        return (\n          <BaoCaoCuoiNgayView\n            appData={appData}\n            onExportTab={handleExportScreenshot}\n            onOpenProgramDetail={handleOpenProgramDetail}\n          />\n        );\n    }\n  };\n\n  return (\n    <div\n      style={{ fontFamily: themeFont }}\n      className=\"min-h-screen bg-slate-100 flex flex-col text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900\"\n    >\n      {lastClearedBackup && (\n        <div className=\"fixed bottom-5 left-5 z-50 bg-white border border-slate-200 shadow-xl rounded-2xl p-3 flex items-center gap-3\">\n          <div className=\"text-xs\"><b>Data vừa được xóa trắng.</b><div className=\"text-slate-500\">Bản an toàn vẫn còn để hoàn tác.</div></div>\n          <button onClick={() => { setAppData(lastClearedBackup.appData); setPersonnelConfig(lastClearedBackup.personnelConfig); setLastClearedBackup(null); showToast('Đã hoàn tác lần xóa dữ liệu gần nhất!'); }} className=\"px-3 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-bold\">Hoàn tác</button>\n          <button onClick={() => setLastClearedBackup(null)} className=\"text-xs text-slate-400 hover:text-slate-700\">×</button>\n        </div>\n      )}\n\n      {/* Toast Notification */}\n      {toast.show && (\n        <div className=\"fixed bottom-5 right-5 z-50 animate-bounce\">\n          <div\n            className={`px-4 py-2.5 rounded-xl shadow-lg font-bold text-xs flex items-center gap-2 ${\n              toast.type === 'error'\n                ? 'bg-rose-600 text-white'\n                : toast.type === 'info'\n                ? 'bg-blue-600 text-white'\n                : 'bg-emerald-600 text-white'\n            }`}\n          >\n            <span>{toast.type === 'error' ? '❌' : toast.type === 'info' ? 'ℹ️' : '✓'}</span>\n            <span>{toast.message}</span>\n          </div>\n        </div>\n      )}\n\n      {/* Main Top Header */}\n      <Header\n        currentView={currentView}\n        onOpenUpload={() => setIsUploadModalOpen(true)}\n        onOpenAiAssistant={() => setActiveDrawer('danh-gia-ai')}\n        onOpenSettings={() => setActiveDrawer('giao-dien')}\n        onOpenSessionManager={() => setActiveDrawer('quan-ly-phien')}\n        onOpenClearSession={() => setIsClearModalOpen(true)}\n        onOpenDownloads={() => setActiveDrawer('tai-xuong')}\n        screenshotCount={screenshots.length}\n        isExporting={isExporting}\n        onExportTab={handleExportScreenshot}\n        onToggleMobileSidebar={() => setIsSidebarOpen(!isSidebarOpen)}\n      />\n\n      {/* Application Body Layout */}\n      <div className=\"flex-1 flex overflow-hidden\">\n        {/* Persistent Sidebar */}\n        <Sidebar\n          currentView={currentView}\n          onSelectView={(view) => {\n            setCurrentView(view);\n            setIsSidebarOpen(false);\n          }}\n          isOpenMobile={isSidebarOpen}\n          onCloseMobile={() => setIsSidebarOpen(false)}\n          onOpenClearSession={() => setIsClearModalOpen(true)}\n        />\n\n        {/* Dynamic Main Workspace Canvas */}\n        <main className=\"flex-1 overflow-y-auto custom-scroll p-4 md:p-6 lg:p-8\">\n          <div ref={exportContainerRef} className=\"max-w-7xl mx-auto space-y-6\">\n            {renderCurrentView()}\n          </div>\n        </main>\n      </div>\n\n      {/* Modals and Drawers */}\n      <QuickUploadModal\n        isOpen={isUploadModalOpen}\n        onClose={() => setIsUploadModalOpen(false)}\n        appData={appData}\n        onDataParsed={handleDataParsed}\n        onOpenClearModal={() => setIsClearModalOpen(true)}\n      />\n\n      <ClearSessionModal\n        isOpen={isClearModalOpen}\n        onClose={() => setIsClearModalOpen(false)}\n        appData={appData}\n        onConfirmClear={handleConfirmClear}\n      />\n\n      <ProgramDetailModal\n        isOpen={drilldownModal.isOpen}\n        onClose={() => setDrilldownModal(prev => ({ ...prev, isOpen: false }))}\n        storeKey={drilldownModal.storeKey}\n        programCode={drilldownModal.programCode}\n        programName={drilldownModal.programName}\n        appData={appData}\n        personnelConfig={personnelConfig}\n        onSaveScreenshot={(item) => setScreenshots(prev => [item, ...prev])}\n      />\n\n      <Drawers\n        activeDrawer={activeDrawer}\n        onClose={() => setActiveDrawer(null)}\n        appData={appData}\n        personnelConfig={personnelConfig}\n        onUpdatePersonnelConfig={setPersonnelConfig}\n        onAutoDivideStaff={handleAutoDivideStaff}\n        onDivideEquallyWithMultiplier={handleDivideEquallyWithMultiplier}\n        screenshots={screenshots}\n        onOpenClearModal={() => setIsClearModalOpen(true)}\n        onExportSession={handleExportSession}\n        onImportSession={handleImportSession}\n        onDownloadAutoBackup={handleDownloadAutoBackup}\n        onRestoreLatestAutoBackup={handleRestoreLatestAutoBackup}\n        themeFont={themeFont}\n        onChangeThemeFont={setThemeFont}\n        kpiAlign={kpiAlign}\n        onChangeKpiAlign={setKpiAlign}\n        kpiSize={kpiSize}\n        onChangeKpiSize={setKpiSize}\n      />\n\n      <ImageExportModal\n        isOpen={!!exportedImage}\n        onClose={() => setExportedImage(null)}\n        imageResult={exportedImage}\n      />\n    </div>\n  );\n}\n","src/components/ClearSessionModal.tsx":"import React, { useState } from 'react';\nimport {\n  Trash2,\n  AlertTriangle,\n  RotateCcw,\n  X,\n  Database,\n  CheckCircle2,\n  FileSpreadsheet,\n  Users,\n  Trophy,\n  Store,\n} from 'lucide-react';\nimport { AppDataState } from '../types';\n\ninterface ClearSessionModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  appData: AppDataState;\n  onConfirmClear: (options: {\n    resetPersonnel: boolean;\n    clearScreenshots: boolean;\n  }) => void;\n}\n\nexport const ClearSessionModal: React.FC<ClearSessionModalProps> = ({\n  isOpen,\n  onClose,\n  appData,\n  onConfirmClear,\n}) => {\n  const [resetPersonnel, setResetPersonnel] = useState<boolean>(false);\n  const [clearScreenshots, setClearScreenshots] = useState<boolean>(false);\n\n  if (!isOpen) return null;\n\n  // Calculate current counts\n  const countDtSt = (appData.dt_luyke?.length || 0) + (appData.dt_realtime?.length || 0);\n  const countTdSt = (appData.td_luyke?.length || 0) + (appData.td_realtime?.length || 0);\n  const countDtNv = (appData.dt_nv_luyke?.length || 0) + (appData.dt_nv_realtime?.length || 0);\n  const countTdNv = (appData.nv_tgdd?.length || 0) + (appData.nv_tz?.length || 0);\n  const totalRecords = countDtSt + countTdSt + countDtNv + countTdNv;\n\n  const handleExecute = () => {\n    onConfirmClear({\n      resetPersonnel,\n      clearScreenshots,\n    });\n    onClose();\n  };\n\n  return (\n    <div className=\"fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-in fade-in duration-200\">\n      <div\n        className=\"bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200\"\n        role=\"dialog\"\n        aria-modal=\"true\"\n      >\n        {/* Header */}\n        <div className=\"bg-rose-50/70 border-b border-rose-100 p-5 flex items-start justify-between\">\n          <div className=\"flex items-center space-x-3\">\n            <div className=\"w-10 h-10 rounded-2xl bg-rose-600 flex items-center justify-center text-white shadow-md shadow-rose-500/20 flex-shrink-0\">\n              <Trash2 className=\"w-5 h-5\" />\n            </div>\n            <div>\n              <h3 className=\"font-extrabold text-slate-900 text-base\">\n                Xóa Dữ Liệu Đang Lưu Trong Phiên\n              </h3>\n              <p className=\"text-xs text-rose-700 font-medium\">\n                Dọn sạch bộ nhớ và trình duyệt để bắt đầu phiên làm việc mới\n              </p>\n            </div>\n          </div>\n          <button\n            onClick={onClose}\n            className=\"p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-xl transition cursor-pointer\"\n            aria-label=\"Đóng\"\n          >\n            <X className=\"w-5 h-5\" />\n          </button>\n        </div>\n\n        {/* Content Body */}\n        <div className=\"p-5 space-y-5\">\n          {/* Current Session Data Overview */}\n          <div className=\"bg-slate-50 border border-slate-200 rounded-2xl p-3.5 space-y-2.5\">\n            <div className=\"flex items-center justify-between text-xs\">\n              <span className=\"font-bold text-slate-700 flex items-center gap-1.5\">\n                <Database className=\"w-3.5 h-3.5 text-blue-600\" />\n                Dữ liệu hiện đang lưu trong phiên:\n              </span>\n              <span className=\"font-extrabold text-blue-700 bg-blue-50 px-2 py-0.5 rounded-md border border-blue-200\">\n                {totalRecords} dòng bản ghi\n              </span>\n            </div>\n\n            <div className=\"grid grid-cols-2 gap-2 text-[11px]\">\n              <div className=\"flex items-center justify-between p-2 rounded-xl bg-white border border-slate-200/80\">\n                <span className=\"text-slate-600 flex items-center gap-1\">\n                  <Store className=\"w-3 h-3 text-slate-400\" />\n                  DT Siêu thị:\n                </span>\n                <span className=\"font-bold text-slate-900\">{countDtSt} dòng</span>\n              </div>\n              <div className=\"flex items-center justify-between p-2 rounded-xl bg-white border border-slate-200/80\">\n                <span className=\"text-slate-600 flex items-center gap-1\">\n                  <Trophy className=\"w-3 h-3 text-slate-400\" />\n                  Thi đua ST:\n                </span>\n                <span className=\"font-bold text-slate-900\">{countTdSt} dòng</span>\n              </div>\n              <div className=\"flex items-center justify-between p-2 rounded-xl bg-white border border-slate-200/80\">\n                <span className=\"text-slate-600 flex items-center gap-1\">\n                  <Users className=\"w-3 h-3 text-slate-400\" />\n                  DT Nhân viên:\n                </span>\n                <span className=\"font-bold text-slate-900\">{countDtNv} dòng</span>\n              </div>\n              <div className=\"flex items-center justify-between p-2 rounded-xl bg-white border border-slate-200/80\">\n                <span className=\"text-slate-600 flex items-center gap-1\">\n                  <FileSpreadsheet className=\"w-3 h-3 text-slate-400\" />\n                  Thi đua NV:\n                </span>\n                <span className=\"font-bold text-slate-900\">{countTdNv} dòng</span>\n              </div>\n            </div>\n          </div>\n\n          {/* Mode Selector */}\n          <div className=\"space-y-2.5\">\n            <label className=\"text-xs font-bold text-slate-800 block\">\n              Chọn phương thức dọn dẹp:\n            </label>\n\n            {/* Option 1: Xóa Trắng */}\n            <div className=\"p-3.5 rounded-2xl border-2 border-rose-500 bg-rose-50/40 shadow-xs flex items-start space-x-3\">\n              <div className=\"w-4 h-4 rounded-full bg-rose-600 mt-0.5 flex-shrink-0\" />\n              <div className=\"flex-1\">\n                <div className=\"flex items-center justify-between\">\n                  <span className=\"font-extrabold text-xs text-rose-900\">\n                    Xóa trắng toàn bộ dữ liệu (Về 0 bản ghi)\n                  </span>\n                  <span className=\"text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700\">\n                    Khuyên dùng khi nạp ngày mới\n                  </span>\n                </div>\n                <p className=\"text-[11px] text-slate-500 mt-1 leading-relaxed\">\n                  Xóa toàn bộ các bảng Doanh thu, Thi đua, Nhân viên về rỗng và xóa sạch lưu trữ{' '}\n                  <code className=\"bg-slate-100 px-1 py-0.5 rounded text-[10px]\">localStorage</code>{' '}\n                  trên trình duyệt để nhập số liệu mới hoàn toàn từ đầu.\n                </p>\n              </div>\n            </div>\n          </div>\n\n          {/* Extra options checkboxes */}\n          <div className=\"space-y-2 pt-2 border-t border-slate-100 text-xs\">\n            <label className=\"flex items-center space-x-2.5 cursor-pointer select-none text-slate-700 font-medium\">\n              <input\n                type=\"checkbox\"\n                checked={resetPersonnel}\n                onChange={(e) => setResetPersonnel(e.target.checked)}\n                className=\"w-4 h-4 rounded text-rose-600 accent-rose-600 cursor-pointer\"\n              />\n              <span>Đặt lại cấu hình nhân viên (Ẩn/Hiện và % KPI) về mặc định</span>\n            </label>\n\n            <label className=\"flex items-center space-x-2.5 cursor-pointer select-none text-slate-700 font-medium\">\n              <input\n                type=\"checkbox\"\n                checked={clearScreenshots}\n                onChange={(e) => setClearScreenshots(e.target.checked)}\n                className=\"w-4 h-4 rounded text-rose-600 accent-rose-600 cursor-pointer\"\n              />\n              <span>Xóa toàn bộ kho ảnh báo cáo đã xuất trong phiên</span>\n            </label>\n          </div>\n        </div>\n\n        {/* Action Footer */}\n        <div className=\"p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-3\">\n          <button\n            type=\"button\"\n            onClick={onClose}\n            className=\"px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 font-bold text-xs rounded-xl transition cursor-pointer\"\n          >\n            Hủy bỏ\n          </button>\n\n          <button\n            type=\"button\"\n            onClick={handleExecute}\n            className=\"px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow-xs transition flex items-center gap-2 cursor-pointer\"\n          >\n            <Trash2 className=\"w-4 h-4\" />\n            <span>Xác nhận Xóa Trắng Data</span>\n          </button>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/components/DataInputModal.tsx":"import React, { useState, useEffect, useMemo } from 'react';\nimport { AppDataState } from '../types';\nimport {\n  parsePastedData,\n  CATEGORY_LABELS,\n  CATEGORY_DESCRIPTIONS,\n  ParseDiagnostics,\n  splitClipboardIntoGrid,\n  detectCategoryFromParsedData,\n} from '../utils/smartDataParser';\nimport {\n  Clipboard,\n  CheckCircle2,\n  AlertTriangle,\n  FileText,\n  Trash2,\n  Sparkles,\n  ArrowRight,\n  Database,\n  X,\n  Table,\n} from 'lucide-react';\n\ninterface DataInputModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  targetCategory?: keyof AppDataState | null;\n  onSaveData: (category: keyof AppDataState, data: any[]) => void;\n}\n\nexport const DataInputModal: React.FC<DataInputModalProps> = ({\n  isOpen,\n  onClose,\n  targetCategory: initialTargetCategory,\n  onSaveData,\n}) => {\n  const [selectedCategory, setSelectedCategory] = useState<string>(\n    initialTargetCategory || 'auto'\n  );\n  const [inputText, setInputText] = useState<string>('');\n  const [pasteError, setPasteError] = useState<string | null>(null);\n  const [showFullPreview, setShowFullPreview] = useState<boolean>(false);\n\n  // Sync initial target category when opened\n  useEffect(() => {\n    if (isOpen) {\n      setSelectedCategory(initialTargetCategory || 'auto');\n      setPasteError(null);\n    } else {\n      setInputText('');\n      setPasteError(null);\n    }\n  }, [isOpen, initialTargetCategory]);\n\n  // Live parsing\n  const parseResult = useMemo(() => {\n    if (!inputText.trim()) return null;\n\n    const catToUse =\n      selectedCategory === 'auto' ? null : (selectedCategory as keyof AppDataState);\n\n    const result = parsePastedData(inputText, catToUse);\n    return result;\n  }, [inputText, selectedCategory]);\n\n  if (!isOpen) return null;\n\n  const isSuccess = parseResult && !('error' in parseResult);\n  const diagnostics = isSuccess ? (parseResult as ParseDiagnostics) : null;\n  const errorMessage = parseResult && 'error' in parseResult ? parseResult.error : null;\n\n  // Handle read from clipboard\n  const handleReadClipboard = async () => {\n    try {\n      const text = await navigator.clipboard.readText();\n      if (text) {\n        setInputText(text);\n        setPasteError(null);\n      } else {\n        setPasteError('Clipboard trống. Hãy sao chép bảng dữ liệu trước rồi dán lại!');\n      }\n    } catch (err) {\n      setPasteError('Không thể tự động đọc clipboard do trình duyệt bảo mật. Bạn hãy bấm Ctrl + V (hoặc Cmd + V) trực tiếp vào khung nhập!');\n    }\n  };\n\n  // Handle Commit / Save\n  const handleCommit = () => {\n    if (!diagnostics || diagnostics.data.length === 0) {\n      setPasteError('Chưa có dữ liệu hợp lệ để lưu.');\n      return;\n    }\n    onSaveData(diagnostics.category, diagnostics.data);\n    onClose();\n  };\n\n  return (\n    <div className=\"fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-200\">\n      <div className=\"bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-4xl max-h-[92vh] flex flex-col overflow-hidden text-slate-800\">\n        {/* Header */}\n        <div className=\"px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-gradient-to-r from-slate-50 to-white\">\n          <div className=\"flex items-center gap-3\">\n            <div className=\"w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md shadow-blue-500/20\">\n              <Clipboard className=\"w-5 h-5\" />\n            </div>\n            <div>\n              <h2 className=\"text-lg font-bold text-slate-900 flex items-center gap-2\">\n                Ô Nhập / Dán Dữ Liệu Báo Cáo\n                <span className=\"text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-100 text-blue-800 border border-blue-200\">\n                  Smart Parser\n                </span>\n              </h2>\n              <p className=\"text-xs text-slate-500\">\n                Sao chép bảng từ trang web BI / MWG / Excel và dán trực tiếp. Tự động nhận diện cột linh hoạt.\n              </p>\n            </div>\n          </div>\n          <button\n            onClick={onClose}\n            className=\"text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-100 transition\"\n          >\n            <X className=\"w-5 h-5\" />\n          </button>\n        </div>\n\n        {/* Modal Body */}\n        <div className=\"p-6 overflow-y-auto custom-scroll space-y-4 flex-1\">\n          {/* Target Category Selector */}\n          <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-50 p-3.5 rounded-xl border border-slate-200/80\">\n            <div className=\"flex items-center gap-2 text-sm font-medium text-slate-700\">\n              <Database className=\"w-4 h-4 text-blue-600\" />\n              <span>Cổng Dữ Liệu Đích:</span>\n            </div>\n            <select\n              value={selectedCategory}\n              onChange={(e) => setSelectedCategory(e.target.value)}\n              className=\"bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm cursor-pointer\"\n            >\n              <option value=\"auto\">✨ Tự động nhận diện theo nội dung dán</option>\n              {Object.entries(CATEGORY_LABELS).map(([key, label]) => (\n                <option key={key} value={key}>\n                  {label} ({key})\n                </option>\n              ))}\n            </select>\n          </div>\n\n          {/* Ctrl+A Helper Tip */}\n          <div className=\"p-3 bg-indigo-50/80 border border-indigo-200/80 rounded-xl text-xs text-indigo-900 flex items-start gap-2.5\">\n            <Sparkles className=\"w-4 h-4 text-indigo-600 flex-shrink-0 mt-0.5\" />\n            <div className=\"leading-relaxed\">\n              <span className=\"font-extrabold text-indigo-950\">Hỗ trợ Copy toàn trang (Ctrl + A):</span>{' '}\n              Anh có thể mở trang web báo cáo BI, nhấn <b>Ctrl + A</b> (chọn toàn bộ trang) rồi <b>Ctrl + C</b> và dán thẳng vào đây. Hệ thống sẽ <b>tự động lọc sạch menu, thanh điều hướng</b> và trích xuất đúng bảng số liệu!\n            </div>\n          </div>\n\n          {/* Text Area */}\n          <div className=\"relative\">\n            <textarea\n              value={inputText}\n              onChange={(e) => {\n                setInputText(e.target.value);\n                setPasteError(null);\n              }}\n              placeholder={`Bấm Ctrl + V để dán dữ liệu vào đây...\\n★ Mẹo: Bạn có thể Ctrl + A trên toàn bộ trang web BI rồi copy dán vào đây, hệ thống tự động lọc bỏ menu và trích xuất bảng dữ liệu!`}\n              rows={8}\n              className=\"w-full font-mono text-xs bg-slate-50 border border-slate-300 rounded-xl p-3.5 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition custom-scroll placeholder:text-slate-400 leading-relaxed\"\n            />\n          </div>\n\n          {/* Paste Error Warning */}\n          {pasteError && (\n            <div className=\"p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-center gap-2 text-xs text-amber-800\">\n              <AlertTriangle className=\"w-4 h-4 text-amber-600 flex-shrink-0\" />\n              <span>{pasteError}</span>\n            </div>\n          )}\n\n          {/* Parsing Error */}\n          {errorMessage && (\n            <div className=\"p-3.5 bg-rose-50 border border-rose-200 rounded-xl flex items-start gap-2.5 text-xs text-rose-800\">\n              <AlertTriangle className=\"w-4 h-4 text-rose-600 flex-shrink-0 mt-0.5\" />\n              <div>\n                <p className=\"font-semibold\">{errorMessage}</p>\n                <p className=\"text-rose-600 mt-0.5\">\n                  Mẹo: Hãy chọn trực tiếp cổng dữ liệu tương ứng ở ô chọn bên trên nếu bảng copy không có tiêu đề rõ ràng.\n                </p>\n              </div>\n            </div>\n          )}\n\n          {/* Live Diagnostic & Recognition Pane */}\n          {diagnostics && (\n            <div className=\"bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3\">\n              <div className=\"flex flex-wrap items-center justify-between gap-2 border-b border-slate-200/80 pb-2.5\">\n                <div className=\"flex items-center gap-2\">\n                  <CheckCircle2 className=\"w-4 h-4 text-emerald-600\" />\n                  <span className=\"text-xs font-bold text-slate-900\">\n                    Nhận diện: {diagnostics.categoryName}\n                  </span>\n                  <span className=\"px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200\">\n                    {diagnostics.rowCount} dòng dữ liệu\n                  </span>\n                </div>\n                <button\n                  type=\"button\"\n                  onClick={() => setShowFullPreview(!showFullPreview)}\n                  className=\"text-xs text-blue-600 hover:text-blue-700 font-medium flex items-center gap-1\"\n                >\n                  <Table className=\"w-3.5 h-3.5\" />\n                  {showFullPreview ? 'Thu gọn xem trước' : 'Xem trước bảng dữ liệu'}\n                </button>\n              </div>\n\n              {/* Ctrl + A Full Page Extraction Indicator */}\n              {diagnostics.pageExtractedInfo?.isFullPageExtracted && (\n                <div className=\"p-2.5 bg-emerald-50 border border-emerald-200 rounded-lg text-xs text-emerald-900 flex items-center gap-2 font-medium\">\n                  <Sparkles className=\"w-4 h-4 text-emerald-600 flex-shrink-0\" />\n                  <span>\n                    <b>✨ Đã tự động bóc tách từ trang web (Ctrl + A):</b> Bỏ qua{' '}\n                    <b>{diagnostics.pageExtractedInfo.ignoredNoiseLines} dòng</b> menu & tiêu đề thừa, nhận diện bảng tại dòng{' '}\n                    <b>{diagnostics.pageExtractedInfo.headerFoundAtLine + 1}</b>!\n                  </span>\n                </div>\n              )}\n\n              {/* Column Mapping Badges */}\n              <div>\n                <span className=\"text-[11px] font-semibold text-slate-500 uppercase tracking-wider block mb-1.5\">\n                  Cột đã tự động khớp ({diagnostics.recognizedColumns.length} cột):\n                </span>\n                <div className=\"flex flex-wrap gap-1.5\">\n                  {diagnostics.recognizedColumns.map((col, idx) => (\n                    <span\n                      key={idx}\n                      className=\"inline-flex items-center gap-1 text-[11px] px-2 py-1 bg-white border border-slate-200 rounded-md text-slate-700 font-medium shadow-2xs\"\n                    >\n                      <span className=\"font-bold text-blue-700\">{col.field}</span>\n                      <ArrowRight className=\"w-3 h-3 text-slate-400\" />\n                      <span className=\"text-slate-500 italic\">\"{col.mappedHeader}\"</span>\n                    </span>\n                  ))}\n                </div>\n              </div>\n\n              {/* Preview Table */}\n              <div className=\"border border-slate-200 rounded-lg overflow-hidden bg-white max-h-48 overflow-x-auto overflow-y-auto custom-scroll\">\n                <table className=\"w-full text-[11px] text-left\">\n                  <thead className=\"bg-slate-100/80 text-slate-600 font-semibold border-b border-slate-200 sticky top-0\">\n                    <tr>\n                      <th className=\"p-2 w-8 text-center text-slate-400\">#</th>\n                      {Object.keys(diagnostics.data[0] || {}).map((k) => (\n                        <th key={k} className=\"p-2 whitespace-nowrap\">\n                          {k}\n                        </th>\n                      ))}\n                    </tr>\n                  </thead>\n                  <tbody className=\"divide-y divide-slate-100 text-slate-700\">\n                    {diagnostics.data\n                      .slice(0, showFullPreview ? 15 : 3)\n                      .map((row, rIdx) => (\n                        <tr key={rIdx} className=\"hover:bg-slate-50\">\n                          <td className=\"p-2 text-center text-slate-400\">{rIdx + 1}</td>\n                          {Object.values(row).map((v: any, cIdx) => (\n                            <td key={cIdx} className=\"p-2 whitespace-nowrap font-mono\">\n                              {typeof v === 'number' ? v.toLocaleString('vi-VN') : String(v)}\n                            </td>\n                          ))}\n                        </tr>\n                      ))}\n                  </tbody>\n                </table>\n              </div>\n              {diagnostics.data.length > 3 && !showFullPreview && (\n                <p className=\"text-[11px] text-slate-400 text-right\">\n                  + {diagnostics.data.length - 3} dòng khác...\n                </p>\n              )}\n            </div>\n          )}\n        </div>\n\n        {/* Footer */}\n        <div className=\"px-6 py-4 border-t border-slate-100 bg-slate-50 flex items-center justify-between\">\n          <button\n            onClick={onClose}\n            type=\"button\"\n            className=\"px-4 py-2 text-xs font-semibold text-slate-600 hover:text-slate-800 hover:bg-slate-200 rounded-xl transition\"\n          >\n            Đóng\n          </button>\n          <button\n            onClick={handleCommit}\n            disabled={!diagnostics || diagnostics.data.length === 0}\n            type=\"button\"\n            className={`inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs font-bold text-white shadow-md transition ${\n              diagnostics && diagnostics.data.length > 0\n                ? 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-600/20 active:scale-95 cursor-pointer'\n                : 'bg-slate-300 cursor-not-allowed text-slate-500'\n            }`}\n          >\n            <CheckCircle2 className=\"w-4 h-4\" />\n            Lưu Dữ Liệu Vào Hệ Thống ({diagnostics?.rowCount || 0} dòng)\n          </button>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/components/Drawers.tsx":"import React, { useState } from 'react';\nimport { X, Save, RefreshCw, Copy, Check, Download, Palette, Bot, Crosshair, History, Eye, EyeOff, Trash2 } from 'lucide-react';\nimport { PersonnelConfigMap, ScreenshotItem } from '../types';\n\nexport type DrawerType = 'target-hero' | 'danh-gia-ai' | 'quan-ly-phien' | 'giao-dien' | 'tai-xuong' | null;\n\ninterface DrawersProps {\n  activeDrawer: DrawerType | string | null;\n  onClose: () => void;\n  personnelConfig: PersonnelConfigMap;\n  onUpdatePersonnelConfig?: (cfg: PersonnelConfigMap) => void;\n  onAutoDivideStaff?: (storeKey: 'TGDD' | 'TOPZONE') => void;\n  onDivideEquallyWithMultiplier?: (storeKey: 'TGDD' | 'TOPZONE', multiplier: number) => void;\n  screenshots?: ScreenshotItem[];\n  onSaveCurrentSession?: () => void;\n  onResetData?: () => void;\n  onOpenClearModal?: () => void;\n  onExportSession?: () => void;\n  onImportSession?: (file: File) => void;\n  onDownloadAutoBackup?: () => void;\n  onRestoreLatestAutoBackup?: () => void;\n  themeFont?: string;\n  onChangeThemeFont?: (font: string) => void;\n  kpiAlign?: string;\n  onChangeKpiAlign?: (align: string) => void;\n  kpiSize?: number;\n  onChangeKpiSize?: (size: number) => void;\n  appData?: any;\n}\n\nexport const Drawers: React.FC<DrawersProps> = ({\n  activeDrawer,\n  onClose,\n  personnelConfig,\n  onUpdatePersonnelConfig,\n  onAutoDivideStaff,\n  onDivideEquallyWithMultiplier,\n  screenshots = [],\n  onSaveCurrentSession,\n  onResetData,\n  onOpenClearModal,\n  onExportSession,\n  onImportSession,\n  onDownloadAutoBackup,\n  onRestoreLatestAutoBackup,\n  themeFont = \"'Be Vietnam Pro', sans-serif\",\n  onChangeThemeFont,\n  kpiAlign = 'center',\n  onChangeKpiAlign,\n  kpiSize = 3.2,\n  onChangeKpiSize,\n  appData,\n}) => {\n  const [targetHeroStore, setTargetHeroStore] = useState<'TGDD' | 'TOPZONE'>('TGDD');\n  const [targetMultiplier, setTargetMultiplier] = useState<number>(100);\n  const [aiStore, setAiStore] = useState<'10341' | '933' | 'CUM'>('10341');\n  const [aiMode, setAiMode] = useState<'suctich' | 'chitiet'>('chitiet');\n  const [copiedAi, setCopiedAi] = useState<boolean>(false);\n\n  // Guard: if drawer is not active or 'NONE', do not render anything\n  if (!activeDrawer || activeDrawer === 'NONE') return null;\n\n  const currentStorePersonnel = personnelConfig[targetHeroStore] || {};\n  const empNames = Object.keys(currentStorePersonnel);\n\n  const shopTargetRow = (appData?.dt_luyke || []).find((r: any) => {\n    const code = String(r['MÃ ĐƠN VỊ'] || '').trim();\n    const name = String(r['TÊN ĐƠN VỊ'] || '');\n    return targetHeroStore === 'TGDD' ? (code === '933' || /TGD|TGDD/i.test(name)) : (code === '10341' || /AAR|TOPZONE/i.test(name));\n  }) || {};\n  const shopTargetDt = Number(shopTargetRow['TARGET (TR)']) || 0;\n  const shopTargetQd = Number(shopTargetRow['TARGET QĐ (TR)']) || shopTargetDt;\n\n  const handleAutoDivide = (storeKey: 'TGDD' | 'TOPZONE') => {\n    if (onAutoDivideStaff) {\n      onAutoDivideStaff(storeKey);\n      return;\n    }\n    const storePersonnel = personnelConfig[storeKey] || {};\n    const names = Object.keys(storePersonnel);\n    const activeStaff = names.filter(n => {\n      const cfg = storePersonnel[n] || {};\n      return cfg.isOfficial !== false && cfg.isVisible !== false;\n    });\n    if (activeStaff.length === 0) return;\n    const equalPct = Math.round((100 / activeStaff.length) * 10) / 10;\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[storeKey]) next[storeKey] = {};\n    names.forEach(n => {\n      const isOff = next[storeKey][n]?.isOfficial !== false;\n      const isVis = next[storeKey][n]?.isVisible !== false;\n      if (isOff && isVis) {\n        next[storeKey][n].targetPct = equalPct;\n      } else {\n        next[storeKey][n].targetPct = 0;\n      }\n    });\n    onUpdatePersonnelConfig?.(next);\n  };\n\n  const handleDivideMultiplier = (storeKey: 'TGDD' | 'TOPZONE', mult: number) => {\n    if (onDivideEquallyWithMultiplier) {\n      onDivideEquallyWithMultiplier(storeKey, mult);\n      return;\n    }\n    const storePersonnel = personnelConfig[storeKey] || {};\n    const names = Object.keys(storePersonnel);\n    const activeStaff = names.filter(n => {\n      const cfg = storePersonnel[n] || {};\n      return cfg.isOfficial !== false && cfg.isVisible !== false;\n    });\n    if (activeStaff.length === 0) return;\n    const pct = Math.round(((100 / activeStaff.length) * (mult / 100)) * 10) / 10;\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[storeKey]) next[storeKey] = {};\n    names.forEach(n => {\n      const isOff = next[storeKey][n]?.isOfficial !== false;\n      const isVis = next[storeKey][n]?.isVisible !== false;\n      if (isOff && isVis) {\n        next[storeKey][n].targetPct = pct;\n      } else {\n        next[storeKey][n].targetPct = 0;\n      }\n    });\n    onUpdatePersonnelConfig?.(next);\n  };\n\n  const handleToggleAllVisibility = (storeKey: 'TGDD' | 'TOPZONE', makeVisible: boolean) => {\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[storeKey]) next[storeKey] = {};\n    Object.keys(next[storeKey]).forEach(name => {\n      next[storeKey][name].isVisible = makeVisible;\n    });\n    onUpdatePersonnelConfig?.(next);\n  };\n\n  const handleCopyAi = () => {\n    let text = '';\n    if (aiMode === 'suctich') {\n      text = `*BÁO CÁO SỨC KHỎE SIÊU THỊ*\nSiêu thị: ${aiStore === '933' ? '933 - TGD_DNA_HCH' : (aiStore === '10341' ? '10341 - AAR_DNA_HCH' : 'TỔNG CỤM')}\n------------------------------------\n1️⃣ DOANH THU: Đạt kế hoạch\n2️⃣ QUY ĐỔI: 48.5%\n3️⃣ TRẢ GÓP: 52.3%\n🚀 CỐ GẮNG LÊN TEAM!`;\n    } else {\n      text = `*PHÂN TÍCH CHI TIẾT SỨC KHỎE SIÊU THỊ*\nSiêu thị: ${aiStore === '933' ? '933 - TGD_DNA_HCH' : (aiStore === '10341' ? '10341 - AAR_DNA_HCH' : 'TỔNG CỤM')}\n- Nhóm Vượt mục tiêu (>110%): Đồng hồ tháng 9, Ví trả sau, Sim Mobi/Vina, Flagship Samsung.\n- Nhóm Cần lưu ý (80-100%): Laptop, Phụ kiện IT, Phụ kiện công nghệ.\n- Nhóm Báo động (<80%): Bảo hiểm tổng, OTT Mango, Thẻ tín dụng.`;\n    }\n    navigator.clipboard.writeText(text).then(() => {\n      setCopiedAi(true);\n      setTimeout(() => setCopiedAi(false), 2000);\n    });\n  };\n\n  const handleDownloadAll = () => {\n    screenshots.forEach((item, idx) => {\n      setTimeout(() => {\n        const a = document.createElement('a');\n        a.href = item.url;\n        a.download = item.name;\n        a.click();\n      }, idx * 400);\n    });\n  };\n\n  return (\n    <>\n      <div\n        onClick={onClose}\n        className=\"fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 transition-opacity\"\n      />\n\n      <aside className=\"fixed right-0 top-0 bottom-0 w-96 max-w-full bg-white border-l border-slate-200 shadow-2xl z-50 flex flex-col animate-slideLeft\">\n        {/* Drawer Header */}\n        <div className=\"px-5 py-4 border-b border-slate-100 flex items-center justify-between\">\n          <div className=\"flex items-center space-x-2\">\n            {activeDrawer === 'target-hero' && <Crosshair className=\"w-4 h-4 text-blue-600\" />}\n            {activeDrawer === 'danh-gia-ai' && <Bot className=\"w-4 h-4 text-emerald-600\" />}\n            {activeDrawer === 'quan-ly-phien' && <History className=\"w-4 h-4 text-slate-600\" />}\n            {activeDrawer === 'giao-dien' && <Palette className=\"w-4 h-4 text-purple-600\" />}\n            {activeDrawer === 'tai-xuong' && <Download className=\"w-4 h-4 text-blue-600\" />}\n            <h3 className=\"font-extrabold text-slate-900 text-sm uppercase tracking-wide\">\n              {activeDrawer === 'target-hero' && 'TARGET HERO'}\n              {activeDrawer === 'danh-gia-ai' && 'ĐÁNH GIÁ AI'}\n              {activeDrawer === 'quan-ly-phien' && 'QUẢN LÝ PHIÊN'}\n              {activeDrawer === 'giao-dien' && 'GIAO DIỆN & FONT CHỮ'}\n              {activeDrawer === 'tai-xuong' && 'TRUNG TÂM TẢI XUỐNG'}\n            </h3>\n          </div>\n          <button\n            onClick={onClose}\n            className=\"p-1.5 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition cursor-pointer\"\n          >\n            <X className=\"w-5 h-5\" />\n          </button>\n        </div>\n\n        {/* Drawer Body */}\n        <div className=\"p-5 flex-1 overflow-y-auto custom-scroll text-xs space-y-5\">\n          {/* 1. TARGET HERO */}\n          {activeDrawer === 'target-hero' && (\n            <div className=\"space-y-5\">\n              <div>\n                <label className=\"block font-bold t -semibold\">\n                    <button\n                      onClick={() => onChangeKpiAlign('center')}\n                      className={`flex-1 py-1 rounded-lg transition ${\n                        kpiAlign === 'center' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-600'\n                      }`}\n                    >\n                      Căn giữa\n                    </button>\n                    <button\n                      onClick={() => onChangeKpiAlign('left')}\n                      className={`flex-1 py-1 rounded-lg transition ${\n                        kpiAlign === 'left' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-600'\n                      }`}\n                    >\n                      Căn trái\n                    </button>\n                  </div>\n                </div>\n\n                <div>\n                  <div className=\"flex justify-between items-center mb-1\">\n                    <span className=\"text-slate-500 font-medium\">Cỡ chữ KPI (Chỉ số chính)</span>\n                    <span className=\"font-bold text-blue-600\">{kpiSize.toFixed(2)}rem</span>\n                  </div>\n                  <input\n                    type=\"range\"\n                    min=\"1.8\"\n                    max=\"4.5\"\n                    step=\"0.1\"\n                    value={kpiSize}\n                    onChange={(e) => onChangeKpiSize(parseFloat(e.target.value))}\n                    className=\"w-full accent-blue-600\"\n                  />\n                </div>\n              </div>\n            </div>\n          )}\n\n          {/* 4. TRUNG TÂM TẢI XUỐNG */}\n          {activeDrawer === 'tai-xuong' && (\n            <div className=\"space-y-4\">\n              <div className=\"bg-blue-50 border border-blue-200 rounded-xl p-3 text-[11px] text-blue-800 leading-relaxed\">\n                ℹ️ Toàn bộ ảnh báo cáo bạn đã xuất trong phiên làm việc. Bạn có thể bấm <b>Tải lại</b> hoặc tải toàn bộ.\n              </div>\n\n              <div className=\"flex items-center justify-between\">\n                <span className=\"px-3 py-1.5 rounded-lg bg-blue-600 text-white font-bold text-xs\">\n                  Tất cả ({screenshots.length} ảnh)\n                </span>\n                {screenshots.length > 0 && (\n                  <button\n                    onClick={handleDownloadAll}\n                    className=\"px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-xs transition cursor-pointer\"\n                  >\n                    Tải Tất Cả Ảnh\n                  </button>\n                )}\n              </div>\n\n              <div className=\"space-y-3 pt-2 max-h-[480px] overflow-y-auto custom-scroll\">\n                {screenshots.length === 0 ? (\n                  <div className=\"text-center py-10 text-slate-400 space-y-2 border-2 border-dashed border-slate-200 rounded-2xl\">\n                    <Download className=\"w-8 h-8 mx-auto text-slate-300\" />\n                    <p className=\"font-bold text-slate-600\">Chưa có ảnh nào được xuất</p>\n                    <p className=\"text-[11px]\">Bấm <b>Xuất Ảnh Tab</b> hoặc <b>Xuất ALL Báo Cáo</b> để tạo ảnh.</p>\n                  </div>\n                ) : (\n                  screenshots.map((item, idx) => (\n                    <div\n                      key={idx}\n                      className=\"p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between\"\n                    >\n                      <div className=\"flex items-center space-x-2.5 truncate pr-2\">\n                        <img\n                          src={item.url}\n                          alt={item.name}\n                          className=\"w-10 h-10 object-cover rounded-lg border border-slate-300\"\n                        />\n                        <div className=\"truncate\">\n                          <p className=\"font-bold text-slate-800 text-xs truncate\">{item.name}</p>\n                          <p className=\"text-[10px] text-slate-400\">Chụp lúc: {item.time}</p>\n                        </div>\n                      </div>\n                      <a\n                        href={item.url}\n                        download={item.name}\n                        className=\"px-2.5 py-1 bg-blue-600 text-white font-bold text-[11px] rounded-lg shadow-xs hover:bg-blue-700 whitespace-nowrap cursor-pointer\"\n                      >\n                        Tải lại\n                      </a>\n                    </div>\n                  ))\n                )}\n              </div>\n            </div>\n          )}\n\n          {/* 5. QUẢN LÝ PHIÊN */}\n          {activeDrawer === 'quan-ly-phien' && (\n            <div className=\"space-y-4\">\n              <p className=\"text-slate-600 leading-relaxed text-xs\">\n                Lưu trữ toàn bộ dữ liệu 6 file, cài đặt tỷ trọng Target Hero và cấu hình giao diện thành phiên làm việc để tải về hoặc tái sử dụng bất cứ lúc nào.\n              </p>\n              \n              <div className=\"bg-emerald-50/70 border border-emerald-200 rounded-2xl p-3.5 space-y-2.5\">\n                <div className=\"flex items-center justify-between gap-2\">\n                  <div>\n                    <div className=\"font-extrabold text-emerald-900 text-xs\">💾 TỰ ĐỘNG SAO LƯU</div>\n                    <div className=\"text-[10px] text-emerald-700 mt-0.5\">Tự lưu ngay khi anh nhập/chỉnh sửa dữ liệu</div>\n                  </div>\n                  <span className=\"px-2 py-1 rounded-lg bg-emerald-100 text-emerald-800 font-black text-[10px]\">ĐANG BẬT</span>\n                </div>\n                <div className=\"grid grid-cols-2 gap-2\">\n                  <button type=\"button\" onClick={onRestoreLatestAutoBackup} className=\"py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition flex items-center justify-center gap-1.5 text-[11px]\">\n                    <RefreshCw className=\"w-3.5 h-3.5\" /> Khôi phục gần nhất\n                  </button>\n                  <button type=\"button\" onClick={onDownloadAutoBackup} className=\"py-2 bg-white hover:bg-emerald-50 text-emerald-800 font-bold rounded-xl border border-emerald-300 transition flex items-center justify-center gap-1.5 text-[11px]\">\n                    <Download className=\"w-3.5 h-3.5\" /> Tải backup gần nhất\n                  </button>\n                </div>\n              </div>\n\n              <button\n                onClick={onExportSession || onSaveCurrentSession}\n                className=\"w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-xs transition flex items-center justify-center gap-2 cursor-pointer text-xs\"\n              >\n                <Save className=\"w-4 h-4\" />\n                <span>Sao lưu & Tải file phiên làm việc (.json)</span>\n              </button>\n\n              <label className=\"w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl border border-slate-300 transition flex items-center justify-center gap-2 cursor-pointer text-xs\">\n                <History className=\"w-4 h-4\" />\n                <span>Khôi phục từ file JSON đã lưu</span>\n                <input\n                  type=\"file\"\n                  accept=\".json\"\n                  className=\"hidden\"\n                  onChange={(e) => {\n                    const f = e.target.files?.[0];\n                    if (f && onImportSession) {\n                      onImportSession(f);\n                    }\n                  }}\n                />\n              </label>\n\n\n              {/* XÓA TOÀN BỘ DATA ĐANG LƯU TRONG PHIÊN */}\n              <div className=\"pt-3 border-t border-slate-200\">\n                <div className=\"bg-rose-50/80 border border-rose-200 rounded-2xl p-3.5 space-y-2.5\">\n                  <div className=\"flex items-center space-x-2 text-rose-900 font-extrabold text-xs\">\n                    <Trash2 className=\"w-4 h-4 text-rose-600 flex-shrink-0\" />\n                    <span>Dọn dẹp phiên làm việc</span>\n                  </div>\n                  <p className=\"text-[11px] text-rose-700 leading-relaxed\">\n                    Xóa sạch toàn bộ các bảng dữ liệu đã lưu trong phiên (Doanh thu, Thi đua, Nhân viên) và giải phóng bộ nhớ trình duyệt.\n                  </p>\n                  <button\n                    type=\"button\"\n                    onClick={() => {\n                      if (onOpenClearModal) {\n                        onOpenClearModal();\n                      } else if (onResetData) {\n                        onResetData();\n                      }\n                    }}\n                    className=\"w-full py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-xs transition flex items-center justify-center gap-2 cursor-pointer text-xs\"\n                  >\n                    <Trash2 className=\"w-4 h-4\" />\n                    <span>Xóa toàn bộ data đang lưu trong phiên</span>\n                  </button>\n                </div>\n              </div>\n            </div>\n          )}\n        </div>\n      </aside>\n    </>\n  );\n};","src/components/Header.tsx":"import React from 'react';\nimport { Camera, Sparkles, Save, CheckCircle2, Menu, Settings, Bot, History, Loader2, Images, Trash2 } from 'lucide-react';\nimport { ViewType } from '../types';\n\ninterface HeaderProps {\n  currentView?: ViewType;\n  onOpenUpload?: () => void;\n  onOpenQuickUpload?: () => void;\n  onSaveSession?: () => void;\n  onExportTab?: () => void;\n  onOpenAiAssistant?: () => void;\n  onOpenSettings?: () => void;\n  onOpenSessionManager?: () => void;\n  onOpenClearSession?: () => void;\n  onOpenDownloads?: () => void;\n  screenshotCount?: number;\n  isExporting?: boolean;\n  onToggleMobileSidebar?: () => void;\n  hasAutoSaved?: boolean;\n}\n\nconst VIEW_TITLES: Record<ViewType, string> = {\n  [ViewType.DASHBOARD]: 'Bảng Điều Khiển Trung Tâm',\n  [ViewType.BAO_CAO_CUOI_NGAY]: 'Báo Cáo Cuối Ngày — Cụm 933',\n  [ViewType.THI_DUA_ST]: 'Bảng Xếp Hạng Thi Đua Siêu Thị',\n  [ViewType.SUC_KHOE_CUM]: 'Báo Cáo Sức Khoẻ Cụm Siêu Thị',\n  [ViewType.DOANH_THU_ST]: 'Doanh Thu & Thi Đua Siêu Thị Chi Tiết',\n  [ViewType.SUC_KHOE_NV]: 'Bảng Xếp Hạng Thi Đua & Doanh Thu Nhân Viên',\n  [ViewType.SO_SANH]: 'So Sánh Hiệu Suất & Tương Quan Siêu Thị',\n  [ViewType.DU_BAO]: 'Dự Báo Cuối Tháng & Kế Hoạch Bứt Phá',\n  [ViewType.KPI_CUSTOM]: 'Cài Đặt & Cấu Hình Nhân Sự KPI',\n  [ViewType.THEO_DOI_NGAY]: 'Theo Dõi Tiến Độ Từng Ngày',\n};\n\nexport const Header: React.FC<HeaderProps> = ({\n  currentView = ViewType.BAO_CAO_CUOI_NGAY,\n  onOpenUpload,\n  onOpenQuickUpload,\n  onSaveSession,\n  onExportTab,\n  onOpenAiAssistant,\n  onOpenSettings,\n  onOpenSessionManager,\n  onOpenClearSession,\n  onOpenDownloads,\n  screenshotCount = 0,\n  isExporting = false,\n  onToggleMobileSidebar,\n  hasAutoSaved = true,\n}) => {\n  const triggerUpload = onOpenUpload || onOpenQuickUpload;\n\n  return (\n    <header className=\"bg-white border-b border-slate-200 px-4 md:px-6 py-3 flex items-center justify-between sticky top-0 z-20 shadow-xs\">\n      <div className=\"flex items-center space-x-3\">\n        {onToggleMobileSidebar && (\n          <button\n            onClick={onToggleMobileSidebar}\n            className=\"md:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100 transition cursor-pointer\"\n            aria-label=\"Toggle menu\"\n          >\n            <Menu className=\"w-5 h-5\" />\n          </button>\n        )}\n        <span className=\"inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-emerald-100 animate-pulse\"></span>\n        <h2 className=\"font-extrabold text-slate-900 text-sm tracking-tight truncate max-w-[200px] sm:max-w-xs md:max-w-none\">\n          {VIEW_TITLES[currentView] || 'Sức Khoẻ Siêu Thị'}\n        </h2>\n        <span className=\"hidden sm:inline text-slate-300\">|</span>\n        <span className=\"hidden sm:inline-block text-xs font-bold text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-lg border border-blue-200/70\">\n          Cụm 933 - 351 Nguyễn Hữu Thọ\n        </span>\n      </div>\n\n      <div className=\"flex items-center space-x-2\">\n        {triggerUpload && (\n          <button\n            onClick={triggerUpload}\n            className=\"flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold shadow-xs hover:shadow-amber-500/25 transition cursor-pointer\"\n            title=\"Nhập hoặc dán trực tiếp dữ liệu từ bất kỳ màn hình nào\"\n          >\n            <Sparkles className=\"w-3.5 h-3.5\" />\n            <span className=\"hidden sm:inline\">Nhập / Dán Data</span>\n          </button>\n        )}\n\n        {onOpenAiAssistant && (\n          <button\n            onClick={onOpenAiAssistant}\n            className=\"flex items-center space-x-1 px-3 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 text-xs font-bold transition cursor-pointer\"\n            title=\"Mở Trợ Lý Đánh Giá AI\"\n          >\n            <Bot className=\"w-3.5 h-3.5 text-emerald-600\" />\n            <span className=\"hidden md:inline\">Đánh Giá AI</span>\n          </button>\n        )}\n\n        {onOpenSessionManager && (\n          <button\n            onClick={onOpenSessionManager}\n            className=\"flex items-center space-x-1 px-2.5 py-1.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-xs font-semibold text-slate-700 transition cursor-pointer\"\n            title=\"Quản lý sao lưu & khôi phục phiên làm việc\"\n          >\n            <History className=\"w-3.5 h-3.5 text-slate-500\" />\n            <span className=\"hidden lg:inline\">Phiên làm việc</span>\n          </button>\n        )}\n\n        {onOpenClearSession && (\n          <button\n            onClick={onOpenClearSession}\n            className=\"flex items-center space-x-1.5 px-2.5 py-1.5 rounded-xl border border-rose-200 bg-rose-50/70 hover:bg-rose-100 text-rose-700 text-xs font-bold transition cursor-pointer\"\n            title=\"Xóa toàn bộ data đang lưu trong phiên\"\n          >\n            <Trash2 className=\"w-3.5 h-3.5 text-rose-600\" />\n            <span className=\"hidden xl:inline\">Xóa Data Phiên</span>\n          </button>\n        )}\n\n        {onOpenSettings && (\n          <button\n            onClick={onOpenSettings}\n            className=\"p-1.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-600 transition cursor-pointer\"\n            title=\"Cài đặt hệ thống\"\n          >\n            <Settings className=\"w-4 h-4\" />\n          </button>\n        )}\n\n        {onOpenDownloads && screenshotCount > 0 && (\n          <button\n            onClick={onOpenDownloads}\n            className=\"flex items-center space-x-1.5 px-2.5 py-1.5 rounded-xl border border-blue-200 bg-blue-50/70 hover:bg-blue-100 text-blue-800 text-xs font-bold transition cursor-pointer\"\n            title=\"Xem danh sách ảnh báo cáo đã xuất\"\n          >\n            <Images className=\"w-3.5 h-3.5 text-blue-600\" />\n            <span className=\"hidden sm:inline\">Kho ảnh</span>\n            <span className=\"w-4 h-4 rounded-full bg-blue-600 text-white text-[10px] flex items-center justify-center font-bold\">\n              {screenshotCount}\n            </span>\n          </button>\n        )}\n\n        {onExportTab && (\n          <button\n            onClick={onExportTab}\n            disabled={isExporting}\n            className=\"flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white text-xs font-bold shadow-xs hover:shadow-blue-500/25 transition cursor-pointer\"\n            title=\"Chụp ảnh tab đang hiển thị\"\n          >\n            {isExporting ? <Loader2 className=\"w-3.5 h-3.5 animate-spin\" /> : <Camera className=\"w-3.5 h-3.5\" />}\n            <span>{isExporting ? 'Đang xuất...' : 'Xuất Ảnh'}</span>\n          </button>\n        )}\n      </div>\n    </header>\n  );\n};\n","src/components/ImageExportModal.tsx":"import React, { useState } from 'react';\nimport { X, Download, Copy, Check, ExternalLink, Camera, Image as ImageIcon } from 'lucide-react';\nimport { downloadImage, copyImageToClipboard } from '../utils/imageExporter';\n\ninterface ImageExportModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  imageResult: {\n    dataUrl: string;\n    blob: Blob;\n    fileName: string;\n  } | null;\n}\n\nexport const ImageExportModal: React.FC<ImageExportModalProps> = ({\n  isOpen,\n  onClose,\n  imageResult,\n}) => {\n  const [copied, setCopied] = useState<boolean>(false);\n\n  if (!isOpen || !imageResult) return null;\n\n  const handleDownload = () => {\n    downloadImage(imageResult.blob, imageResult.fileName);\n  };\n\n  const handleCopy = async () => {\n    const ok = await copyImageToClipboard(imageResult.blob);\n    if (ok) {\n      setCopied(true);\n      setTimeout(() => setCopied(false), 2500);\n    } else {\n      // Fallback: copy as dataURL if binary clipboard is not supported\n      try {\n        await navigator.clipboard.writeText(imageResult.dataUrl);\n        setCopied(true);\n        setTimeout(() => setCopied(false), 2500);\n      } catch (err) {\n        console.error('Clipboard copy failed:', err);\n      }\n    }\n  };\n\n  const handleOpenInNewTab = () => {\n    try {\n      const blobUrl = URL.createObjectURL(imageResult.blob);\n      window.open(blobUrl, '_blank');\n    } catch (err) {\n      const win = window.open();\n      if (win) {\n        win.document.write(`<img src=\"${imageResult.dataUrl}\" style=\"max-width:100%\" />`);\n      }\n    }\n  };\n\n  return (\n    <div\n      className=\"fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-5\"\n      onC
