l;\n  entries.sort((a, b) => b.updatedAt - a.updatedAt);\n\n  const appData: Partial<AppDataState> = {};\n  for (const entry of entries) (appData as any)[entry.slot] = entry.rows;\n\n  return {\n    dayKey,\n    entries,\n    appData,\n    latestAt: entries[0]?.updatedAt || 0,\n    latestEntry: entries[0] || null,\n    viewerUid: String(viewer?.uid || ''),\n    viewerEmail: String(viewer?.email || ''),\n  };\n}\n\nasync function drainPendingDailyData(): Promise<DailyCloudFetchResult> {\n  let sentAny = false;\n  while (true) {\n    let pending = readPending();\n    if (!pending?.slots.length) return { status: sentAny ? 'ok' : 'empty', snapshot: null };\n    if (pending.dayKey !== getVietnamDayKey()) {\n      writePending(null);\n      return { status: 'empty', snapshot: null };\n    }\n    if (!navigator.onLine) return { status: 'offline', snapshot: null };\n    try {\n      const ctx = await getSharedFirebaseContext();\n      if (!ctx?.user || !ctx?.db) return { status: 'signed-out', snapshot: null };\n      pending = readPending();\n      if (!pending?.slots.length) continue;\n      if (pending.dayKey !== getVietnamDayKey()) continue;\n      const localData = readLocalAppData();\n      const updates: Record<string, any> = {};\n      const sentIds: Record<string, string | undefined> = {};\n      for (const slot of pending.slots) {\n        const item = pending.items?.[slot];\n        const rows = item ? item.rows : localData?.[slot]; // old queue migration\n        const validation = validateAppData({ [slot]: rows });\n        if (!Array.isArray(rows) || validation.errors.length) {\n          return { status: 'error', snapshot: null, message: `invalid-pending-data:${slot}` };\n        }\n        sentIds[slot] = item?.id;\n        updates[slot] = {\n          dataJson: JSON.stringify(rows), rowCount: rows.length,\n          updatedAt: (window as any).firebase?.database?.ServerValue?.TIMESTAMP || Date.now(),\n          updatedByEmail: String(ctx.user.email || ''), updatedByUid: String(ctx.user.uid || ''),\n        };\n      }\n      await ctx.db.ref(`${DAILY_CLOUD_ROOT}/${pending.dayKey}`).update(updates);\n      sentAny = true;\n      const latest = readPending();\n      if (latest?.dayKey === pending.dayKey) {\n        const items = { ...latest.items };\n        const remaining = latest.slots.filter(slot => {\n          const acknowledged = Object.prototype.hasOwnProperty.call(sentIds, slot)\n            && items[slot]?.id === sentIds[slot];\n          if (acknowledged) delete items[slot];\n          return !acknowledged;\n        });\n        writePending(remaining.length ? { ...latest, slots: remaining, items } : null);\n      }\n    } catch (e: any) {\n      const message = String(e?.code || e?.message || e || '');\n      return { status: /permission|denied/i.test(message) ? 'permission' : 'error', snapshot: null, message };\n    }\n  }\n}\n\nfunction flushPendingDailyData(): Promise<DailyCloudFetchResult> {\n  if (activeFlush) return activeFlush;\n  if (retryTimer !== null) { window.clearTimeout(retryTimer); retryTimer = null; }\n  activeFlush = drainPendingDailyData().then(result => {\n    activeFlush = null;\n    const remaining = readPending();\n    if ((result.status === 'ok' || result.status === 'empty') && remaining?.dayKey === getVietnamDayKey() && remaining.slots.length) return flushPendingDailyData();\n    if (result.status === 'error' && !result.message?.startsWith('invalid-pending-data:') && readPending()) {\n      retryTimer = window.setTimeout(() => { retryTimer = null; void flushPendingDailyData(); }, retryDelay);\n      retryDelay = Math.min(retryDelay * 2, 30000);\n    } else if (result.status === 'ok' || result.status === 'empty') retryDelay = 5000;\n    return result;\n  });\n  return activeFlush;\n}\n\nexport async function syncDailyDataSlots(partial: Partial<AppDataState>): Promise<DailyCloudFetchResult> {\n  const validation = validateAppData(partial);\n  if (validation.errors.length) return { status: 'error', snapshot: null, message: 'invalid-pending-data:input' };\n  const slots = DAILY_DATA_SLOTS.filter(slot => Array.isArray(partial?.[slot]) && partial[slot]!.length > 0);\n  if (!slots.length) return { status: 'empty', snapshot: null };\n  try { queueSlots(slots, partial); }\n  catch { return { status: 'error', snapshot: null, message: 'pending-storage-unavailable' }; }\n  return flushPendingDailyData();\n}\n\nexport function subscribeTodayCloudSnapshot(\n  onSnapshot: (snapshot: DailyCloudSnapshot | null) => void,\n  onError?: (message: string) => void,\n): () => void {\n  let disposed = false;\n  let ref: any = null;\n  let handler: any = null;\n  let generation = 0;\n  let attachedDay = getVietnamDayKey();\n\n  const detach = () => {\n    if (ref && handler) {\n      try { ref.off('value', handler); } catch {}\n    }\n    ref = null;\n    handler = null;\n  };\n\n  const attach = async () => {\n    const epoch = ++generation;\n    detach();\n    if (disposed || !navigator.onLine) return;\n    try {\n      const ctx = await getSharedFirebaseContext();\n      if (disposed || epoch !== generation) return;\n      if (!ctx?.user || !ctx?.db) { onSnapshot(null); return; }\n      attachedDay = getVietnamDayKey();\n      const dayKey = attachedDay;\n      const viewer = ctx.user;\n      ref = ctx.db.ref(`${DAILY_CLOUD_ROOT}/${dayKey}`);\n      handler = (snap: any) => {\n        if (disposed || epoch !== generation || dayKey !== getVietnamDayKey()) return;\n        onSnapshot(buildSnapshot(snap.val(), viewer, dayKey));\n      };\n      ref.on('value', handler, (err: any) => {\n        if (disposed || epoch !== generation) return;\n        onError?.(String(err?.code || err?.message || err || 'permission-denied'));\n      });\n      void flushPendingDailyData();\n    } catch (e: any) {\n      onError?.(String(e?.code || e?.message || e || 'cloud-error'));\n    }\n  };\n\n  const authListener = () => { void attach(); };\n  const onlineListener = () => { void attach(); };\n  const offlineListener = () => { generation++; detach(); };\n  const checkDay = () => {\n    if (!disposed && attachedDay !== getVietnamDayKey()) {\n      attachedDay = getVietnamDayKey(); onSnapshot(null); void attach();\n    }\n  };\n  const dayTimer = window.setInterval(checkDay, 15000);\n  window.addEventListener('focus', checkDay);\n\n  window.addEventListener(FIREBASE_AUTH_EVENT, authListener);\n  window.addEventListener('online', onlineListener);\n  window.addEventListener('offline', offlineListener);\n  void attach();\n\n  return () => {\n    disposed = true; generation++;\n    window.clearInterval(dayTimer);\n    window.removeEventListener('focus', checkDay);\n    detach();\n    window.removeEventListener(FIREBASE_AUTH_EVENT, authListener);\n    window.removeEventListener('online', onlineListener);\n    window.removeEventListener('offline', offlineListener);\n  };\n}\n","src/utils/programCopy.ts":"let suppressProgramOpenUntil = 0;\n\nconst cleanNames = (names: string[]) => {\n  const seen = new Set<string>();\n  const out: string[] = [];\n  names.forEach(name => {\n    const value = String(name || '').replace(/\\s+/g, ' ').trim();\n    if (!value) return;\n    const key = value.toLocaleLowerCase('vi-VN');\n    if (seen.has(key)) return;\n    seen.add(key);\n    out.push(value);\n  });\n  return out;\n};\n\nexport async function copyProgramNames(names: string[]): Promise<number> {\n  const list = cleanNames(names);\n  if (!list.length) return 0;\n  const text = list.join('\\n');\n  try {\n    if (navigator.clipboard?.writeText) {\n      await navigator.clipboard.writeText(text);\n      return list.length;\n    }\n  } catch {}\n  try {\n    const ta = document.createElement('textarea');\n    ta.value = text;\n    ta.setAttribute('readonly', '');\n    ta.style.position = 'fixed';\n    ta.style.left = '-9999px';\n    ta.style.top = '0';\n    document.body.appendChild(ta);\n    ta.select();\n    const ok = document.execCommand('copy');\n    document.body.removeChild(ta);\n    return ok ? list.length : 0;\n  } catch {\n    return 0;\n  }\n}\n\nexport function suppressProgramOpen(ms = 900): void {\n  suppressProgramOpenUntil = Math.max(suppressProgramOpenUntil, Date.now() + ms);\n}\n\nexport function shouldSuppressProgramOpen(): boolean {\n  return Date.now() < suppressProgramOpenUntil;\n}\n\nexport function getProgramCopyNamesInRect(\n  root: HTMLElement | null,\n  startX: number,\n  startY: number,\n  endX: number,\n  endY: number,\n): string[] {\n  if (!root) return [];\n  const left = Math.min(startX, endX);\n  const right = Math.max(startX, endX);\n  const top = Math.min(startY, endY);\n  const bottom = Math.max(startY, endY);\n  const names: string[] = [];\n  root.querySelectorAll<HTMLElement>('[data-program-copy-name]').forEach(el => {\n    const r = el.getBoundingClientRect();\n    const intersects = r.right >= left && r.left <= right && r.bottom >= top && r.top <= bottom;\n    if (!intersects) return;\n    const name = String(el.getAttribute('data-program-copy-name') || '').trim();\n    if (name) names.push(name);\n  });\n  return cleanNames(names);\n}\n\nexport function highlightProgramCopyNames(root: HTMLElement | null, names: string[]): void {\n  if (!root) return;\n  const selected = new Set(cleanNames(names).map(x => x.toLocaleLowerCase('vi-VN')));\n  root.querySelectorAll<HTMLElement>('[data-program-copy-name]').forEach(el => {\n    const name = String(el.getAttribute('data-program-copy-name') || '').trim().toLocaleLowerCase('vi-VN');\n    el.classList.toggle('program-drag-selected', !!name && selected.has(name));\n  });\n}\n\nexport function clearProgramCopyHighlights(root: HTMLElement | null): void {\n  if (!root) return;\n  root.querySelectorAll<HTMLElement>('.program-drag-selected').forEach(el => el.classList.remove('program-drag-selected'));\n  root.classList.remove('program-dragging');\n  root.style.userSelect = '';\n}\n","src/components/ProgramCopyToolbar.tsx":"import React, { useEffect, useMemo, useState } from 'react';\nimport { CheckSquare, ListChecks, X, Sparkles } from 'lucide-react';\nimport { copyProgramNames } from '../utils/programCopy';\nimport { getVietnamDayKey } from '../utils/dailyCloudHandoff';\n\nexport interface ProgramCopyItem {\n  id: string;\n  name: string;\n  pct: number;\n  group?: string;\n}\n\ninterface ProgramCopyToolbarProps {\n  items: ProgramCopyItem[];\n  focusItems?: ProgramCopyItem[];\n  onCopied?: (message: string) => void;\n  label?: string;\n}\n\nconst getDayBasedCopyThreshold = () => {\n  const [yearText, monthText, dayText] = getVietnamDayKey().split('-');\n  const year = Number(yearText);\n  const month = Number(monthText);\n  const day = Number(dayText);\n  const daysInMonth = new Date(year, month, 0).getDate();\n  if (!Number.isFinite(day) || !Number.isFinite(daysInMonth) || daysInMonth <= 0) return 95;\n  if (day >= daysInMonth) return 95;\n\n  return Math.max(5, Math.min(95, Math.round(((day / daysInMonth) * 95) / 5) * 5));\n};\n\nexport const ProgramCopyToolbar: React.FC<ProgramCopyToolbarProps> = ({ items, focusItems = [], onCopied, label = 'COPY TÊN MÔN' }) => {\n  const [threshold, setThreshold] = useState(() => getDayBasedCopyThreshold());\n  const [showPicker, setShowPicker] = useState(false);\n  const [selected, setSelected] = useState<Set<string>>(() => new Set());\n\n  const normalized = useMemo(() => {\n    const seen = new Set<string>();\n    return items.filter(item => {\n      const key = `${item.id}__${item.name}`;\n      if (!item.name?.trim() || seen.has(key)) return false;\n      seen.add(key);\n      return true;\n    });\n  }, [items]);\n\n  const normalizedFocus = useMemo(() => {\n    const seen = new Set<string>();\n    return focusItems.filter(item => {\n      const key = `${item.id}__${item.name}`;\n      if (!item.name?.trim() || seen.has(key)) return false;\n      seen.add(key);\n      return true;\n    });\n  }, [focusItems]);\n\n  useEffect(() => {\n    const valid = new Set(normalized.map(x => x.id));\n    setSelected(prev => {\n      const next = new Set(Array.from(prev).filter(id => valid.has(id)));\n      return next.size === prev.size ? prev : next;\n    });\n  }, [normalized]);\n\n  const under = normalized.filter(item => Number(item.pct) < threshold);\n  const selectedItems = normalized.filter(item => selected.has(item.id));\n\n  const doCopy = async (list: ProgramCopyItem[], suffix = '') => {\n    const count = await copyProgramNames(list.map(x => x.name));\n    onCopied?.(count ? `Đã copy ${count} môn${suffix}` : 'Không copy được · hãy cấp quyền Clipboard cho trình duyệt');\n  };\n\n  const toggle = (id: string) => setSelected(prev => {\n    const next = new Set(prev);\n    if (next.has(id)) next.delete(id); else next.add(id);\n    return next;\n  });\n\n  return (\n    <div className=\"no-export bg-slate-50/90 border border-slate-200 rounded-2xl p-3 space-y-2.5 shadow-2xs\">\n      <div className=\"flex flex-wrap items-center gap-2\">\n        <span className=\"text-[10px] font-black text-slate-500 uppercase tracking-wide mr-1\">{label}</span>\n\n        {normalizedFocus.length > 0 && (\n          <button type=\"button\" onClick={() => void doCopy(normalizedFocus, ' cần tập trung')} className=\"px-3 py-1.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-[11px] font-extrabold hover:bg-amber-100 flex items-center gap-1.5\">\n            <Sparkles className=\"w-3.5 h-3.5\" /> Copy môn tập trung ({normalizedFocus.length})\n          </button>\n        )}\n\n        <div className=\"flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white border border-slate-200\">\n          <span className=\"text-[10.5px] font-bold text-slate-600 whitespace-nowrap\">Dưới <b className=\"text-rose-600\">{threshold}%</b></span>\n          <input aria-label=\"Ngưỡng phần trăm để copy môn; mặc định tự tính theo ngày và có thể kéo chỉnh\" title=\"Mặc định tự tính theo ngày; anh vẫn có thể kéo để chỉnh ngưỡng\" type=\"range\" min=\"0\" max=\"150\" step=\"5\" value={threshold} onChange={e => setThreshold(Number(e.target.value))} className=\"w-24 accent-rose-600\" />\n          <button type=\"button\" onClick={() => void doCopy(under, ` dưới ${threshold}%`)} disabled={!under.length} className=\"px-2.5 py-1 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-[10.5px] font-extrabold disabled:opacity-40\">\n            Copy {under.length} môn\n          </button>\n        </div>\n\n        <button type=\"button\" onClick={() => setShowPicker(v => !v)} className={`px-3 py-1.5 rounded-xl border text-[11px] font-extrabold flex items-center gap-1.5 ${showPicker ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-blue-200 text-blue-700'}`}>\n          <ListChecks className=\"w-3.5 h-3.5\" /> Tích chọn ({selected.size})\n        </button>\n\n        <span className=\"text-[10.5px] text-slate-500 ml-auto\">🖱️ Click tên môn = xem chi tiết · Kéo từ vùng trống quét qua các tên → thả = tự copy</span>\n      </div>\n\n      {showPicker && (\n        <div className=\"max-w-2xl bg-white border border-blue-100 rounded-xl p-2.5 shadow-sm\">\n          <div className=\"flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-2 mb-1.5\">\n            <div className=\"flex items-center gap-2\">\n              <span className=\"text-[10px] font-black text-blue-700 uppercase\">Chọn nhanh</span>\n              <button type=\"button\" onClick={() => setSelected(new Set(normalized.map(x => x.id)))} className=\"text-[10.5px] font-bold text-blue-700 hover:underline\">Tất cả</button>\n              <span className=\"text-slate-300\">•</span>\n              <button type=\"button\" onClick={() => setSelected(new Set())} className=\"text-[10.5px] font-bold text-slate-600 hover:underline\">Bỏ chọn</button>\n            </div>\n            <div className=\"flex items-center gap-1.5\">\n              <button type=\"button\" onClick={() => void doCopy(selectedItems, ' đã chọn')} disabled={!selectedItems.length} className=\"px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-[10.5px] font-extrabold disabled:opacity-40 flex items-center gap-1.5\">\n                <CheckSquare className=\"w-3.5 h-3.5\" /> Copy {selectedItems.length}\n              </button>\n              <button type=\"button\" onClick={() => setShowPicker(false)} className=\"p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100\" title=\"Thu gọn\">\n                <X className=\"w-3.5 h-3.5\" />\n              </button>\n            </div>\n          </div>\n\n          <div className=\"max-h-64 overflow-y-auto custom-scroll pr-1 space-y-0.5\">\n            {normalized.map(item => {\n              const isFocus = normalizedFocus.some(focus => focus.id === item.id || focus.name === item.name);\n              return (\n                <label key={item.id} className={`flex items-center gap-1.5 min-h-8 px-2 py-1 rounded-lg cursor-pointer border transition ${selected.has(item.id) ? 'bg-blue-50 border-blue-200' : 'border-transparent hover:bg-slate-50 hover:border-slate-200'}`}>\n                  <input type=\"checkbox\" checked={selected.has(item.id)} onChange={() => toggle(item.id)} className=\"w-4 h-4 shrink-0 accent-blue-600 cursor-pointer\" />\n                  <span className=\"min-w-0 flex-1 truncate text-[10.5px] font-bold text-slate-800\" title={item.name}>{item.name}</span>\n                  {isFocus && <span className=\"shrink-0 rounded-md border border-amber-200 bg-amber-50 px-1.5 py-0.5 text-[8.5px] font-black text-amber-800\">TẬP TRUNG</span>}\n                  {item.group && <span className=\"shrink-0 text-[9px] font-bold text-slate-400\">{item.group}</span>}\n                  <span className=\"shrink-0 min-w-[42px] text-right text-[10px] font-black text-slate-500\">{Number(item.pct).toFixed(1)}%</span>\n                </label>\n              );\n            })}\n          </div>\n        </div>\n      )}\n    </div>\n  );\n};\n","src/utils/personnelCloudSync.ts":"import { PersonnelConfigMap } from '../types';\nimport { FIREBASE_AUTH_EVENT, getSharedFirebaseContext } from './stretchGoal';\n\nconst CLOUD_PATH = 'sharedConfig/personnelKpi';\nconst PENDING_STORAGE_KEY = 'skst_personnel_cloud_pending_v1';\nconst ALLOCATION_STORAGE_KEY = 'skst_personnel_target_allocation_v1';\n\ntype PendingPersonnelConfig = {\n  configJson: string;\n  allocationJson: string;\n  queuedAt: number;\n};\n\ntype PersonnelCloudMeta = {\n  updatedAt: number;\n  updatedByEmail: string;\n  updatedByUid: string;\n};\n\ntype PersonnelCloudSyncResult = {\n  status: 'ok' | 'empty' | 'signed-out' | 'offline' | 'permission' | 'error';\n  message?: string;\n};\n\nlet flushTimer: any = null;\nlet writing = false;\n\nfunction safeConfigJson(config: PersonnelConfigMap): string {\n  try { return JSON.stringify(config || { TGDD: {}, TOPZONE: {} }); }\n  catch { return JSON.stringify({ TGDD: {}, TOPZONE: {} }); }\n}\n\nfunction readAllocationJson(): string {\n  try {\n    const raw = localStorage.getItem(ALLOCATION_STORAGE_KEY);\n    if (!raw) return '{}';\n    const parsed = JSON.parse(raw);\n    return JSON.stringify(parsed && typeof parsed === 'object' ? parsed : {});\n  } catch { return '{}'; }\n}\n\nfunction applyAllocationJson(raw: string) {\n  try {\n    const parsed = JSON.parse(raw || '{}');\n    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return;\n    localStorage.setItem(ALLOCATION_STORAGE_KEY, JSON.stringify(parsed));\n  } catch {}\n}\n\nfunction readPending(): PendingPersonnelConfig | null {\n  try {\n    const parsed = JSON.parse(localStorage.getItem(PENDING_STORAGE_KEY) || 'null');\n    if (!parsed || typeof parsed.configJson !== 'string' || typeof parsed.allocationJson !== 'string') return null;\n    JSON.parse(parsed.configJson);\n    JSON.parse(parsed.allocationJson);\n    return {\n      configJson: parsed.configJson,\n      allocationJson: parsed.allocationJson,\n      queuedAt: Number(parsed.queuedAt) || Date.now(),\n    };\n  } catch { return null; }\n}\n\nfunction writePending(value: PendingPersonnelConfig | null) {\n  try {\n    if (!value) localStorage.removeItem(PENDING_STORAGE_KEY);\n    else localStorage.setItem(PENDING_STORAGE_KEY, JSON.stringify(value));\n  } catch {}\n}\n\nfunction scheduleFlush() {\n  clearTimeout(flushTimer);\n  flushTimer = window.setTimeout(() => { void flushPersonnelConfigSync(); }, 450);\n}\n\nexport function queuePersonnelConfigSync(config: PersonnelConfigMap): void {\n  writePending({\n    configJson: safeConfigJson(config),\n    allocationJson: readAllocationJson(),\n    queuedAt: Date.now(),\n  });\n  scheduleFlush();\n}\n\nasync function flushPersonnelConfigSync(): Promise<PersonnelCloudSyncResult> {\n  const pending = readPending();\n  if (!pending) return { status: 'empty' };\n  if (!navigator.onLine) return { status: 'offline' };\n  if (writing) return { status: 'empty' };\n\n  const ctx = await getSharedFirebaseContext();\n  if (!ctx?.user || !ctx?.db) return { status: 'signed-out' };\n\n  writing = true;\n  try {\n    const serverTimestamp = (window as any).firebase?.database?.ServerValue?.TIMESTAMP || Date.now();\n    await ctx.db.ref(CLOUD_PATH).update({\n      configJson: pending.configJson,\n      allocationJson: pending.allocationJson,\n      updatedAt: serverTimestamp,\n      updatedByEmail: String(ctx.user.email || ''),\n      updatedByUid: String(ctx.user.uid || ''),\n    });\n    const latest = readPending();\n    if (latest && latest.configJson === pending.configJson && latest.allocationJson === pending.allocationJson) {\n      writePending(null);\n    }\n    return { status: 'ok' };\n  } catch (e: any) {\n    const message = String(e?.code || e?.message || e || '');\n    if (/permission|denied/i.test(message)) return { status: 'permission', message };\n    return { status: 'error', message };\n  } finally {\n    writing = false;\n    if (readPending() && navigator.onLine) scheduleFlush();\n  }\n}\n\nfunction parseRemote(raw: any): { config: PersonnelConfigMap; allocationJson: string; meta: PersonnelCloudMeta } | null {\n  if (!raw || typeof raw !== 'object' || typeof raw.configJson !== 'string' || typeof raw.allocationJson !== 'string') return null;\n  try {\n    const config = JSON.parse(raw.configJson);\n    const allocation = JSON.parse(raw.allocationJson || '{}');\n    if (!config || typeof config !== 'object' || Array.isArray(config)) return null;\n    if (!config.TGDD || typeof config.TGDD !== 'object') config.TGDD = {};\n    if (!config.TOPZONE || typeof config.TOPZONE !== 'object') config.TOPZONE = {};\n    const allocationJson = JSON.stringify(allocation && typeof allocation === 'object' && !Array.isArray(allocation) ? allocation : {});\n    return {\n      config: config as PersonnelConfigMap,\n      allocationJson,\n      meta: {\n        updatedAt: Number(raw.updatedAt) || 0,\n        updatedByEmail: String(raw.updatedByEmail || ''),\n        updatedByUid: String(raw.updatedByUid || ''),\n      },\n    };\n  } catch { return null; }\n}\n\nexport function subscribePersonnelConfigSync(\n  getLocalConfig: () => PersonnelConfigMap,\n  applyRemote: (config: PersonnelConfigMap, meta: PersonnelCloudMeta) => void,\n): () => void {\n  let disposed = false;\n  let ref: any = null;\n  let handler: any = null;\n\n  const detach = () => {\n    if (ref && handler) {\n      try { ref.off('value', handler); } catch {}\n    }\n    ref = null;\n    handler = null;\n  };\n\n  const attach = async () => {\n    detach();\n    if (disposed || !navigator.onLine) return;\n    try {\n      const ctx = await getSharedFirebaseContext();\n      if (disposed || !ctx?.user || !ctx?.db) return;\n      ref = ctx.db.ref(CLOUD_PATH);\n      handler = (snap: any) => {\n        if (disposed) return;\n        const remote = parseRemote(snap.val());\n        const pending = readPending();\n\n        if (!remote) {\n\n          if (!pending) queuePersonnelConfigSync(getLocalConfig());\n          void flushPersonnelConfigSync();\n          return;\n        }\n\n        if (pending) {\n          void flushPersonnelConfigSync();\n          return;\n        }\n\n        const localAllocationJson = readAllocationJson();\n        applyAllocationJson(remote.allocationJson);\n        const localJson = safeConfigJson(getLocalConfig());\n        const remoteJson = safeConfigJson(remote.config);\n        if (localJson !== remoteJson || localAllocationJson !== remote.allocationJson) {\n          applyRemote(remote.config, remote.meta);\n        }\n      };\n      ref.on('value', handler, () => {});\n      void flushPersonnelConfigSync();\n    } catch {}\n  };\n\n  const authListener = () => { void attach(); };\n  const onlineListener = () => { void attach(); };\n  const offlineListener = () => detach();\n\n  window.addEventListener(FIREBASE_AUTH_EVENT, authListener);\n  window.addEventListener('online', onlineListener);\n  window.addEventListener('offline', offlineListener);\n  void attach();\n\n  return () => {\n    disposed = true;\n    detach();\n    window.removeEventListener(FIREBASE_AUTH_EVENT, authListener);\n    window.removeEventListener('online', onlineListener);\n    window.removeEventListener('offline', offlineListener);\n    clearTimeout(flushTimer);\n  };\n}\n","src/utils/dailyHandoffGate.ts":"import type { AppDataState } from '../types';\nimport type { DailyCloudSnapshot } from './dailyCloudHandoff';\n\nexport function createDailyHandoffGate() {\n  let day = '';\n  const seen = new Set<string>();\n  function key(snapshot: DailyCloudSnapshot): string {\n    if (day !== snapshot.dayKey) { day = snapshot.dayKey; seen.clear(); }\n    return JSON.stringify([...snapshot.entries].sort((a, b) => String(a.slot).localeCompare(String(b.slot)))\n      .map(entry => [entry.slot, entry.updatedAt, entry.rows]));\n  }\n  return {\n    remember(snapshot: DailyCloudSnapshot) { seen.add(key(snapshot)); },\n    shouldOffer(snapshot: DailyCloudSnapshot, local: AppDataState): boolean {\n      if (!snapshot.entries.length) return false;\n      const version = key(snapshot);\n      if (seen.has(version)) return false;\n      seen.add(version);\n\n      return snapshot.entries.some(entry =>\n        JSON.stringify(local[entry.slot] || []) !== JSON.stringify(entry.rows));\n    },\n  };\n}\n","src/utils/dailyTrends.ts":"import { competitionProgramId, competitionStoreCode, competitionTarget, competitionValue, sameCompetitionProgram } from './competition';\nexport const trendStores = [{code:'933',name:'TGĐĐ',color:'#2563eb'}, {code:'10341',name:'TopZone',color:'#8b5cf6'}];\nconst numeric = (v:any):number|null => {\n if (v == null || String(v).trim() === '') return null;\n const n = typeof v === 'number' ? v : Number(String(v).trim().replace(/%/g,'').replace(/,/g,'.'));\n return Number.isFinite(n) ? n : null;\n};\nexport function storeCode(row:any) {\n const explicit=String(row?.code ?? '').trim();\n return explicit || competitionStoreCode(row);\n}\nexport function snapshotPrograms(lkRows:any[], realtimeRowsOrInclude:any[] | boolean = [], includeUntargeted=false) {\n const realtimeRows = Array.isArray(realtimeRowsOrInclude) ? realtimeRowsOrInclude : [];\n const allowUntargeted = typeof realtimeRowsOrInclude === 'boolean' ? realtimeRowsOrInclude : includeUntargeted;\n const entries=new Map<string,any>();\n for(const row of lkRows || []) {\n  const shop=competitionStoreCode(row); if(!trendStores.some(s=>s.code===shop)) continue;\n  const code=String(row['MÃ CHƯƠNG TRÌNH'] ?? '').trim();\n  const name=String(row['CHƯƠNG TRÌNH'] ?? '').trim();\n  if(!code && !name) continue;\n  const target=competitionTarget(row);\n  if(!allowUntargeted && !(target>0)) continue;\n  const id=competitionProgramId(row);\n  const realtime=(realtimeRows || [])\n    .filter(rt=>competitionStoreCode(rt)===shop && sameCompetitionProgram(row,rt))\n    .reduce((sum,rt)=>sum+competitionValue(rt),0);\n  const actual=competitionValue(row)+realtime;\n  entries.set(shop+'|'+id,{id,code,name:name||code,storeCode:shop,target,pct:target>0?actual/target*100:null});\n }\n return [...entries.values()];\n}\nconst dayNumber=(date:string)=>Date.parse(date+'T00:00:00Z')/86400000;\n\nexport function calendarRows(rows:any[],month:string) {\n const selected=rows.filter(r=>r?.date?.slice(0,7)===month && Number.isFinite(dayNumber(r.date))).sort((a,b)=>a.date.localeCompare(b.date));\n if(!selected.length) return [];\n const byDate=new Map(selected.map(r=>[r.date,r]));\n const result:any[]=[];\n for(let day=dayNumber(selected[0].date);day<=dayNumber(selected[selected.length-1].date);day++) {\n  const date=new Date(day*86400000).toISOString().slice(0,10);\n  result.push(byDate.get(date)||{date});\n }\n return result;\n}\nexport function slowTrend(rows:any[],getValue:(r:any)=>number|null) {\n const points=rows.map(r=>({day:dayNumber(r.date),value:getValue(r)})).filter(p=>p.value!==null && Number.isFinite(p.day));\n if(points.length<4) return null;\n const last=points[points.length-1], first=points[0];\n\n const anchor=points.slice(0,-1).reverse().find(p=>last.day-p.day>=2 && last.day-p.day<=3);\n if(!anchor || last.day-first.day<4) return null;\n const recent=points.filter(p=>p.day>=anchor.day);\n if(recent.length<3 || points.some((p,i)=>i>0 && p.value!<points[i-1].value!)) return null;\n const average=(last.value!-first.value!)/(last.day-first.day);\n const rate=(last.value!-anchor.value!)/(last.day-anchor.day);\n if(average<=0 || rate>=average*0.75) return null;\n return {rate,average,drop:Math.round((1-rate/average)*100)};\n}\nexport function revenueValue(row:any,code:string) {\n const item=(Array.isArray(row?.stores)?row.stores:[]).find((s:any)=>storeCode(s)===code);\n return numeric(item?.achieved);\n}\nexport function programValue(row:any,code:string,id:string) {\n const item=(Array.isArray(row?.programs)?row.programs:[]).find((p:any)=>p.storeCode===code && p.id===id);\n return numeric(item?.pct);\n}\n","src/components/DailyTrendCharts.tsx":"import React, {useEffect,useRef,useState} from 'react';\nimport {Chart,registerables} from 'chart.js';\nimport {calendarRows,trendStores,revenueValue,programValue,slowTrend,snapshotPrograms} from '../utils/dailyTrends';\n\nfunction TrendChart({rows,programId}:{rows:any[];programId?:string}) {\n const canvas=useRef<HTMLCanvasElement>(null);\n const [error,setError]=useState(false);\n const get=(r:any,code:string)=>programId ? programValue(r,code,programId) : revenueValue(r,code);\n const datasets=trendStores.map(s=>({label:s.name,data:rows.map(r=>get(r,s.code)),borderColor:s.color,backgroundColor:s.color,pointRadius:4,pointHoverRadius:6,borderWidth:2.5,tension:0.15,spanGaps:false}));\n const hasData=datasets.some(s=>s.data.some(v=>v!==null));\n const warnings=trendStores.map(s=>({store:s.name,result:slowTrend(rows,r=>get(r,s.code))})).filter(s=>s.result);\n useEffect(()=>{\n  if(!canvas.current || !hasData) return;\n  let chart:any;\n  try {\n   Chart.register(...registerables);\n   chart=new Chart(canvas.current, {\n    type:'line', data:{labels:rows.map(r=>r.date.slice(8)+'/'+r.date.slice(5,7)),datasets},\n    options:{\n     responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},\n     plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:(ctx:any)=>`${ctx.dataset.label}: ${Number(ctx.parsed.y).toLocaleString('vi-VN',{maximumFractionDigits:2})}${programId?'%':' TR'}`}}},\n     scales:{\n      x:{title:{display:true,text:'Ngày lưu'},grid:{display:false},ticks:{maxTicksLimit:12}},\n      y:{beginAtZero:true,title:{display:true,text:programId?'Hoàn thành tháng (%)':'Doanh thu QĐ lũy kế (TR)'}}\n     }\n    }\n   });\n   setError(false);\n  } catch(e) { console.warn('Daily chart unavailable',e); setError(true); }\n  return ()=>chart?.destroy();\n },[rows,programId,hasData]);\n return <>\n  <div className=\"flex flex-wrap items-center justify-between gap-2 mb-3\">{warnings.map(w=><span key={w.store} className=\"text-xs font-bold rounded-lg px-3 py-1 bg-amber-100 text-amber-800\" title={`Tốc độ gần đây ${w.result!.rate.toFixed(2)}, trung bình ${w.result!.average.toFixed(2)} mỗi ngày`}>⚠ {w.store}: tốc độ giảm {w.result!.drop}%</span>)}</div>\n  {hasData?<div style={{height:280,position:'relative'}}><canvas ref={canvas} role=\"img\" aria-label={programId?'Biểu đồ phần trăm hoàn thành môn theo ngày':'Biểu đồ doanh thu lũy kế TGĐĐ và TopZone theo ngày'}/></div>:<div className=\"p-8 bg-slate-50 rounded-xl text-center text-sm text-slate-500\">{programId?'Chưa có lịch sử cho môn này trong tháng đã chọn. Nạp dữ liệu thi đua lũy kế và bấm Cập nhật hôm nay.':'Chưa có lịch sử doanh thu trong tháng đã chọn.'}</div>}\n  {error && <p className=\"text-sm text-amber-700\">Chưa tải được thư viện biểu đồ. Anh kiểm tra kết nối mạng và mở lại file; số liệu vẫn xem được trong bảng dưới.</p>}\n  {hasData && <details className=\"mt-2 text-xs text-slate-500\"><summary className=\"cursor-pointer\">Xem số liệu biểu đồ</summary><div className=\"overflow-auto mt-2\"><table className=\"w-full\"><thead><tr><th className=\"text-left p-2\">Ngày</th>{trendStores.map(s=><th key={s.code} className=\"text-right p-2\">{s.name}</th>)}</tr></thead><tbody>{rows.map(r=><tr key={r.date}><td className=\"p-2\">{r.date}</td>{trendStores.map(s=>{const v=get(r,s.code);return <td className=\"text-right p-2\" key={s.code}>{v===null?'—':v.toLocaleString('vi-VN',{maximumFractionDigits:2})+(programId?'%':' TR')}</td>})}</tr>)}</tbody></table></div></details>}\n </>;\n}\nfunction useSavedChoice(key:string,initial:string) {\n const [value,setValue]=useState(()=>{try{return localStorage.getItem(key)||initial;}catch{return initial;}});\n const update=(next:string)=>{setValue(next);try{localStorage.setItem(key,next);}catch{}};\n return [value,update] as const;\n}\nfunction MiniTrend({values,color}:{values:(number|null)[];color:string}) {\n const valid=values.filter((v):v is number=>v!==null);\n if(!valid.length) return <span className=\"text-slate-400\">Chưa có lịch sử</span>;\n const low=Math.min(...valid),high=Math.max(...valid),range=high-low||1;\n const xy=(v:number,i:number)=>[6+(values.length>1?i/(values.length-1)*108:54),30-(v-low)/range*24];\n const segments:string[]=[];let segment='';\n values.forEach((v,i)=>{if(v===null){if(segment)segments.push(segment);segment='';}else{const [x,y]=xy(v,i);segment+=(segment?' L':'M')+x+','+y;}});if(segment)segments.push(segment);\n return <svg width=\"120\" height=\"36\" viewBox=\"0 0 120 36\" role=\"img\" aria-label=\"Xu hướng trong tháng; khoảng trống là ngày thiếu dữ liệu\"><title>Xu hướng tương đối của môn trong tháng; mỗi đường dùng thang riêng</title>{segments.map((d,i)=><path key={i} d={d} fill=\"none\" stroke={color} strokeWidth=\"2\"/>)}{values.map((v,i)=>v===null?null:<circle key={i} cx={xy(v,i)[0]} cy={xy(v,i)[1]} r=\"2.5\" fill={color}/>)}</svg>;\n}\nfunction AllProgramTrends({programs,days,onSelect}:{programs:[string,string][];days:any[];onSelect:(id:string)=>void}) {\n const [search,setSearch]=useState('');\n const visible=programs.filter(([id,name])=>(name+' '+id).toLocaleLowerCase('vi').includes(search.trim().toLocaleLowerCase('vi')));\n const number=(v:number)=>v.toLocaleString('vi-VN',{maximumFractionDigits:1});\n return <div>\n  <div className=\"flex flex-wrap items-center justify-between gap-3 mb-3\"><p className=\"text-sm text-slate-500\">{visible.length}/{programs.length} môn · Bấm tên môn để xem biểu đồ chi tiết</p><input aria-label=\"Tìm môn thi đua\" value={search} onChange={e=>setSearch(e.target.value)} placeholder=\"Tìm môn thi đua…\" className=\"border border-slate-200 rounded-xl px-3 py-2 text-sm max-w-full\"/></div>\n  <div className=\"overflow-x-auto border border-slate-200 rounded-xl\"><table className=\"w-full text-xs\" style={{minWidth:700}}><thead className=\"bg-slate-50\"><tr><th rowSpan={2} className=\"p-3 text-left\">Môn thi đua</th>{trendStores.map(shop=><th key={shop.code} colSpan={2} className=\"p-3 text-center border-l border-slate-200\" style={{color:shop.color}}>{shop.name}</th>)}</tr><tr>{trendStores.map(shop=><React.Fragment key={shop.code}><th className=\"px-3 pb-3 text-right border-l border-slate-200\">% HT gần nhất</th><th className=\"px-3 pb-3 text-left\">Xu hướng / biến động</th></React.Fragment>)}</tr></thead><tbody>{visible.map(([id,name])=><tr key={id} className=\"border-t border-slate-100 hover:bg-slate-50\"><td className=\"p-3 font-bold\"><button onClick={()=>onSelect(id)} className=\"text-left text-blue-700 hover:underline\">{name}</button></td>{trendStores.map(shop=>{\n   const values=days.map(r=>programValue(r,shop.code,id));\n   const points=days.map((r,i)=>({date:r.date,value:values[i]})).filter(p=>p.value!==null);\n   const latest=points[points.length-1],before=points[points.length-2];\n   const delta=latest&&before?latest.value!-before.value!:null;\n   const warning=slowTrend(days,r=>programValue(r,shop.code,id));\n   return <React.Fragment key={shop.code}><td className=\"p-3 text-right border-l border-slate-100\"><div className=\"font-black text-base\" style={{color:shop.color}}>{latest?number(latest.value!)+'%':'—'}</div><div className=\"text-slate-400 mt-1\">{latest?latest.date.slice(8)+'/'+latest.date.slice(5,7):'Chưa có dữ liệu'}</div></td><td className=\"p-3\"><MiniTrend values={values} color={shop.color}/><div className={delta===null?'text-slate-400':delta>0?'text-emerald-700':delta<0?'text-rose-600':'text-slate-500'} title={before&&latest?`Từ ${before.date} đến ${latest.date}`:undefined}>{delta===null?'Cần thêm ngày để so sánh':(delta>0?'↑ +':delta<0?'↓ ':'→ ')+number(delta)+' điểm %'}</div>{warning&&<span className=\"inline-block mt-1 rounded px-2 py-1 bg-amber-100 text-amber-800\">⚠ Tốc độ giảm {warning.drop}%</span>}</td></React.Fragment>;\n  })}</tr>)}</tbody></table>{!visible.length&&<p className=\"p-6 text-center text-slate-500\">{programs.length?'Không tìm thấy môn phù hợp.':'Nạp bảng Thi đua lũy kế và cập nhật hôm nay để bắt đầu.'}</p>}</div>\n  <p className=\"text-xs text-slate-400 mt-3\">Biến động so với lần lưu có dữ liệu trước đó trong tháng (điểm %). Đường nhỏ thể hiện xu hướng riêng từng môn, không dùng để so độ lớn giữa các môn. Ngày thiếu dữ liệu để trống.</p>\n </div>;\n}\nexport function DailyTrendCharts({rows,appData,month,children}:{rows:any[];appData:any;month:string;children?:React.ReactNode}) {\n const currentPrograms=snapshotPrograms(appData.td_luyke||[],true);\n const knownTargets=new Map(currentPrograms.map(p=>[p.storeCode+'|'+p.id,p.target]));\n const eligible=(p:any)=>{\n  if(!p?.id) return false;\n  const target=p.target===undefined?knownTargets.get(p.storeCode+'|'+p.id):p.target;\n  return typeof target==='number' && Number.isFinite(target) && target>0;\n };\n const filteredRows=rows.map(r=>({...r,programs:(Array.isArray(r.programs)?r.programs:[]).filter(eligible)}));\n const options=new Map<string,string>();\n for(const p of [...filteredRows.flatMap(r=>r.programs),...currentPrograms.filter(eligible)]) if(p?.id) options.set(p.id,p.name||p.code||p.id);\n const programs=[...options].sort((a,b)=>a[1].localeCompare(b[1],'vi'));\n const [selected,setSelected]=useState('');\n const [revenueVisibility,setRevenueVisibility]=useSavedChoice('skst_daily_revenue_visible_v1','yes');\n const [programVisibility,setProgramVisibility]=useSavedChoice('skst_daily_program_visible_v1','yes');\n const [mode,setMode]=useSavedChoice('skst_daily_program_mode_v1','all');\n const showRevenue=revenueVisibility!=='no',showPrograms=programVisibility!=='no';\n const programId=options.has(selected)?selected:(programs[0]?.[0]||'');\n const days=calendarRows(filteredRows,month);\n const toggleClass='shrink-0 px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold text-blue-700 bg-slate-50 hover:bg-blue-50';\n return <div className=\"space-y-6\">\n  <section className=\"bg-white border border-slate-200 rounded-2xl p-5 shadow-sm\"><div className=\"flex items-center justify-between gap-3\"><h4 className=\"font-black text-slate-900\">Xu hướng doanh thu theo shop</h4><button className={toggleClass} aria-expanded={showRevenue} aria-controls=\"daily-revenue-panel\" onClick={()=>setRevenueVisibility(showRevenue?'no':'yes')}>{showRevenue?'Ẩn biểu đồ':'Hiện biểu đồ'}</button></div>{showRevenue&&<div id=\"daily-revenue-panel\" className=\"mt-4\"><TrendChart rows={days}/><p className=\"text-xs text-slate-400 mt-2\">Mỗi điểm là bản lưu cuối cùng trong ngày. Ngày thiếu dữ liệu để trống, không tính bằng 0.</p></div>}</section>\n  {children}\n  <section className=\"bg-white border border-slate-200 rounded-2xl p-5 shadow-sm\"><div className=\"flex items-center justify-between gap-3\"><h4 className=\"font-black text-slate-900\">Xu hướng hoàn thành môn thi đua</h4><button className={toggleClass} aria-expanded={showPrograms} aria-controls=\"daily-program-panel\" onClick={()=>setProgramVisibility(showPrograms?'no':'yes')}>{showPrograms?'Ẩn xu hướng':'Hiện xu hướng'}</button></div>{showPrograms&&<div id=\"daily-program-panel\" className=\"mt-4\">\n   <div className=\"flex flex-wrap gap-2 mb-5\" role=\"group\" aria-label=\"Cách xem xu hướng môn thi đua\">{[['all','Bảng tổng hợp tất cả môn'],['single','Biểu đồ từng môn']].map(([value,label])=><button key={value} onClick={()=>setMode(value)} aria-pressed={mode===value} className={'px-3 py-2 rounded-xl text-sm font-bold '+(mode===value?'bg-blue-600 text-white':'bg-slate-100 text-slate-600')}>{label}</button>)}</div>\n   {mode==='all'?<AllProgramTrends programs={programs} days={days} onSelect={id=>{setSelected(id);setMode('single');}}/>:<><div className=\"flex flex-wrap items-center gap-3 mb-5\"><label htmlFor=\"daily-program\" className=\"text-sm font-bold text-slate-600\">Môn thi đua</label><select id=\"daily-program\" value={programId} onChange={e=>setSelected(e.target.value)} disabled={!programs.length} className=\"min-w-0 max-w-full border border-slate-200 rounded-xl p-2 text-sm bg-slate-50\">{programs.length?programs.map(([id,name])=><option key={id} value={id}>{name}</option>):<option value=\"\">Chưa có dữ liệu môn thi đua</option>}</select></div>{programId?<TrendChart rows={days} programId={programId}/>:<p className=\"text-sm text-slate-500\">Nạp bảng Thi đua lũy kế để bắt đầu lưu lịch sử từng môn.</p>}</>}\n   <p className=\"text-xs text-slate-400 mt-3\">Lịch sử cũ chưa lưu môn sẽ để trống. Cảnh báo khi tốc độ 2–3 ngày gần nhất thấp hơn trên 25% so với trung bình giai đoạn đã lưu trong tháng; cần ít nhất 4 bản lưu trải dài 4 ngày. Dữ liệu giảm do điều chỉnh sẽ không dùng để cảnh báo.</p>\n  </div>}</section>\n </div>;\n}\n","src/views/RealtimeRevenueSummary.tsx":"import React, { useEffect, useMemo, useRef, useState } from 'react';\nimport { AppDataState, PersonnelConfigMap } from '../types';\nimport { formatCurrency, formatPercent, formatProgramName, getCellNumber } from '../utils/formatters';\nimport { useStretchGoalPct } from '../utils/stretchGoal';\nimport { SortableTable } from '../components/SortableTable';\nimport { getVietnamCalendarParts, getVietnamDateKey } from '../utils/reportPeriod';\n\ninterface RealtimeRevenueSummaryProps {\n  appData: AppDataState;\n  personnelConfig: PersonnelConfigMap;\n  lastImportAt?: string | null;\n  onExport?: () => void;\n  isExporting?: boolean;\n}\n\ntype StoreKey = 'TGDD' | 'TOPZONE';\ntype Milestone = 'AUTO' | '12H' | '15H' | '18H' | '22H';\ntype DailyTargetOverride = { pct: number; note: string; updatedAt: string };\n\nconst HIDDEN_STAFF_KEY = 'skst_realtime_summary_hidden_staff_v1';\nconst HIDE_COMPLETED_EMPLOYEES_KEY = 'skst_realtime_summary_hide_completed_employees_v1';\nconst HIDE_ZERO_EMPLOYEES_KEY = 'skst_realtime_summary_hide_zero_employees_v1';\nconst MANUALLY_HIDDEN_STAFF_KEY = 'skst_realtime_summary_manually_hidden_staff_v1';\nconst MILESTONE_KEY = 'skst_realtime_summary_milestone_v1';\nconst HIDE_COMPLETED_COMPETITIONS_KEY = 'skst_realtime_summary_hide_completed_competitions_v1';\nconst HIDE_ACHIEVED_TODAY_COMPETITIONS_KEY = 'skst_realtime_summary_hide_achieved_today_competitions_v1';\nconst ONLY_NEED_TODAY_COMPETITIONS_KEY = 'skst_realtime_summary_only_need_today_competitions_v1';\nconst HIDE_ZERO_COMPETITIONS_KEY = 'skst_realtime_summary_hide_zero_competitions_v1';\nconst COMPETITION_SHOPS_KEY = 'skst_realtime_summary_competition_shops_v1';\nconst DAILY_TARGET_OVERRIDES_KEY = 'skst_realtime_summary_daily_target_overrides_v1';\n\nconst localDateKey = (date = new Date()) => getVietnamDateKey(date);\nconst parseLocalDateKey = (key: string) => {\n  const [year, month, day] = String(key || '').split('-').map(Number);\n  return year && month && day ? new Date(year, month - 1, day, 12, 0, 0) : null;\n};\n\nconst VIETNAM_HOLIDAYS_2026: Record<string, string> = {\n  '2026-01-01': 'Tết Dương lịch',\n  '2026-02-16': 'Tết Nguyên đán',\n  '2026-02-17': 'Tết Nguyên đán',\n  '2026-02-18': 'Tết Nguyên đán',\n  '2026-02-19': 'Tết Nguyên đán',\n  '2026-02-20': 'Tết Nguyên đán',\n  '2026-04-26': 'Giỗ Tổ Hùng Vương',\n  '2026-04-27': 'Nghỉ bù Giỗ Tổ Hùng Vương',\n  '2026-04-30': 'Ngày Chiến thắng 30/4',\n  '2026-05-01': 'Quốc tế Lao động 1/5',\n  '2026-09-01': 'Nghỉ Quốc khánh',\n  '2026-09-02': 'Quốc khánh 2/9',\n};\n\nconst getAutomaticDailyTargetInfo = (dateKey: string, stretchGoalPct: number) => {\n  const date = parseLocalDateKey(dateKey);\n  const holidayName = VIETNAM_HOLIDAYS_2026[dateKey] || '';\n  const isWeekend = !!date && (date.getDay() === 0 || date.getDay() === 6);\n  const pct = holidayName\n    ? Math.max(stretchGoalPct, 200)\n    : isWeekend\n      ? Math.max(stretchGoalPct, 150)\n      : stretchGoalPct;\n  return { holidayName, isWeekend, pct };\n};\n\nconst normalize = (value: any) => String(value ?? '')\n  .normalize('NFD')\n  .replace(/[\\u0300-\\u036f]/g, '')\n  .replace(/đ/gi, 'd')\n  .toLowerCase()\n  .replace(/[^a-z0-9]+/g, ' ')\n  .trim();\n\nconst cleanId = (value: any) => String(value ?? '').trim().replace(/\\.0$/, '');\nconst employeeName = (row: any) => String(row?.['TÊN NHÂN VIÊN'] || row?.['NHÂN VIÊN'] || row?.['Nhân viên'] || row?.['Họ và tên'] || '').replace(/\\s+/g, ' ').trim();\nconst employeeId = (row: any) => cleanId(row?.['MÃ NHÂN VIÊN'] || row?.['MÃ NV'] || row?.['Mã NV']);\nconst employeeKey = (row: any) => {\n  const id = employeeId(row);\n  const name = employeeName(row);\n  return id ? `id:${id}` : `name:${normalize(name)}`;\n};\n\nconst storeFromText = (value: any): StoreKey | null => {\n  const text = normalize(value);\n  if (!text) return null;\n  if (text.includes('10341') || text.includes('aar') || text.includes('topzone')) return 'TOPZONE';\n  if (text.includes('933') || text.includes('tgd') || text.includes('the gioi di dong')) return 'TGDD';\n  return null;\n};\n\nconst rowStore = (row: any): StoreKey | null => storeFromText(\n  row?.['SIÊU THỊ'] || row?.['TÊN ĐƠN VỊ'] || row?.['ĐƠN VỊ / NHÂN VIÊN'] || row?.['MÃ ĐƠN VỊ'] || ''\n);\n\nconst programKey = (row: any) => {\n  const code = normalize(row?.['MÃ CHƯƠNG TRÌNH']);\n  if (code) return `code:${code}`;\n  return `name:${normalize(row?.['CHƯƠNG TRÌNH'])}`;\n};\n\nconst sameProgram = (a: any, b: any) => {\n  const codeA = normalize(a?.['MÃ CHƯƠNG TRÌNH']);\n  const codeB = normalize(b?.['MÃ CHƯƠNG TRÌNH']);\n  if (codeA && codeB) return codeA === codeB;\n  const nameA = normalize(a?.['CHƯƠNG TRÌNH']);\n  const nameB = normalize(b?.['CHƯƠNG TRÌNH']);\n  return !!nameA && !!nameB && nameA === nameB;\n};\n\nconst competitionMetric = (row: any, loai: number) => {\n  if (loai === 2 || loai === 6) return getCellNumber(row, ['SỐ LƯỢNG', 'SL']);\n  if (loai === 3) return getCellNumber(row, ['DT QUY ĐỔI (TR)', 'DOANH THU QĐ (TR)', 'DTQĐ']);\n  return getCellNumber(row, ['DOANH THU (TR)', 'DOANH THU', 'DT']);\n};\n\nconst metricLabel = (loai: number) => (loai === 2 || loai === 6 ? 'SL' : 'TR');\nconst formatCompetitionValue = (value: number, loai: number) => loai === 2 || loai === 6\n  ? Math.round(value).toLocaleString('vi-VN')\n  : formatCurrency(value, 1);\n\nexport const RealtimeRevenueSummary: React.FC<RealtimeRevenueSummaryProps> = ({\n  appData,\n  personnelConfig,\n  lastImportAt,\n  onExport,\n  isExporting = false,\n}) => {\n  const [stretchGoalPct] = useStretchGoalPct();\n  const [hiddenStaff, setHiddenStaff] = useState<Set<string>>(() => {\n    try {\n      const raw = JSON.parse(localStorage.getItem(HIDDEN_STAFF_KEY) || '[]');\n      if (Array.isArray(raw)) return new Set(raw.map(String));\n      if (raw?.date === localDateKey() && Array.isArray(raw?.keys)) return new Set(raw.keys.map(String));\n      return new Set();\n    } catch { return new Set(); }\n  });\n  const [manuallyHiddenStaff, setManuallyHiddenStaff] = useState<Set<string>>(() => {\n    try {\n      const keys = JSON.parse(localStorage.getItem(MANUALLY_HIDDEN_STAFF_KEY) || '[]');\n      return new Set(Array.isArray(keys) ? keys.filter((key: unknown) => typeof key === 'string') : []);\n    } catch { return new Set(); }\n  });\n  const saveManuallyHiddenStaff = (next: Set<string>) => {\n    setManuallyHiddenStaff(next);\n    try { localStorage.setItem(MANUALLY_HIDDEN_STAFF_KEY, JSON.stringify([...next])); } catch {}\n  };\n  const setStaffVisible = (key: string, visible: boolean) => {\n    const next = new Set<string>(manuallyHiddenStaff);\n    if (visible) next.delete(key); else next.add(key);\n    saveManuallyHiddenStaff(next);\n  };\n  const [showManage, setShowManage] = useState(false);\n  const [staffPanel, setStaffPanel] = useState<'OFF' | 'SELECT' | null>(null);\n  const [staffSearch, setStaffSearch] = useState('');\n  const [showCompetitionManage, setShowCompetitionManage] = useState(false);\n  const employeeFilterButtonRef = useRef<HTMLButtonElement>(null);\n  const employeeFilterPanelRef = useRef<HTMLDivElement>(null);\n  const competitionFilterButtonRef = useRef<HTMLButtonElement>(null);\n  const competitionFilterPanelRef = useRef<HTMLDivElement>(null);\n  const [hideCompletedCompetitions, setHideCompletedCompetitionsState] = useState<boolean>(() => {\n    try { return localStorage.getItem(HIDE_COMPLETED_COMPETITIONS_KEY) === 'true'; } catch { return false; }\n  });\n  const [hideAchievedTodayCompetitions, setHideAchievedTodayCompetitionsState] = useState<boolean>(() => {\n    try { return localStorage.getItem(HIDE_ACHIEVED_TODAY_COMPETITIONS_KEY) === 'true'; } catch { return false; }\n  });\n  const [onlyNeedTodayCompetitions, setOnlyNeedTodayCompetitionsState] = useState<boolean>(() => {\n    try { return localStorage.getItem(ONLY_NEED_TODAY_COMPETITIONS_KEY) === 'true'; } catch { return false; }\n  });\n  const [hideZeroCompetitions, setHideZeroCompetitionsState] = useState<boolean>(() => {\n    try {\n      const raw = JSON.parse(localStorage.getItem(HIDE_ZERO_COMPETITIONS_KEY) || 'null');\n      if (raw?.date === localDateKey()) return raw.value !== false;\n      return true;\n    } catch { return true; }\n  });\n  const [competitionShops, setCompetitionShopsState] = useState<{TGDD:boolean;TOPZONE:boolean}>(() => {\n    try {\n      const raw = JSON.parse(localStorage.getItem(COMPETITION_SHOPS_KEY) || '{}');\n      return { TGDD: raw?.TGDD !== false, TOPZONE: raw?.TOPZONE !== false };\n    } catch { return { TGDD: true, TOPZONE: true }; }\n  });\n  const [hideCompletedEmployees, setHideCompletedEmployeesState] = useState<boolean>(() => {\n    try { return localStorage.getItem(HIDE_COMPLETED_EMPLOYEES_KEY) === 'true'; } catch { return false; }\n  });\n  const [hideZeroEmployees, setHideZeroEmployeesState] = useState<boolean>(() => {\n    try { return localStorage.getItem(HIDE_ZERO_EMPLOYEES_KEY) === 'true'; } catch { return false; }\n  });\n  const [milestone, setMilestoneState] = useState<Milestone>(() => {\n    try {\n      const saved = localStorage.getItem(MILESTONE_KEY) as Milestone | null;\n      return saved && ['AUTO', '12H', '15H', '18H', '22H'].includes(saved) ? saved : 'AUTO';\n    } catch { return 'AUTO'; }\n  });\n  const [showTargetSettings, setShowTargetSettings] = useState(false);\n  const [dailyTargetOverrides, setDailyTargetOverrides] = useState<Record<string, DailyTargetOverride>>(() => {\n    try {\n      const parsed = JSON.parse(localStorage.getItem(DAILY_TARGET_OVERRIDES_KEY) || '{}');\n      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};\n      const clean: Record<string, DailyTargetOverride> = {};\n      Object.entries(parsed).forEach(([date, raw]: [string, any]) => {\n        const pct = Number(raw?.pct);\n        if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(date) || !Number.isFinite(pct) || pct <= 0 || pct > 999) return;\n        clean[date] = { pct, note: String(raw?.note || '').trim(), updatedAt: String(raw?.updatedAt || '') };\n      });\n      return clean;\n    } catch { return {}; }\n  });\n  const [targetEditDate, setTargetEditDate] = useState(() => localDateKey());\n  const [targetEditPct, setTargetEditPct] = useState('200');\n  const [targetEditNote, setTargetEditNote] = useState('');\n\n  const persistDailyTargetOverrides = (next: Record<string, DailyTargetOverride>) => {\n    setDailyTargetOverrides(next);\n    try { localStorage.setItem(DAILY_TARGET_OVERRIDES_KEY, JSON.stringify(next)); } catch {}\n  };\n  const saveDailyTargetOverride = () => {\n    const pct = Number(targetEditPct);\n    if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(targetEditDate) || !Number.isFinite(pct) || pct <= 0 || pct > 999) return;\n    persistDailyTargetOverrides({\n      ...dailyTargetOverrides,\n      [targetEditDate]: { pct, note: targetEditNote.trim(), updatedAt: new Date().toISOString() },\n    });\n  };\n  const removeDailyTargetOverride = (date: string) => {\n    const next = { ...dailyTargetOverrides };\n    delete next[date];\n    persistDailyTargetOverrides(next);\n    if (date === targetEditDate) setTargetEditNote('');\n  };\n\n  const setHideCompletedEmployees = (value: boolean) => {\n    setHideCompletedEmployeesState(value);\n    try { localStorage.setItem(HIDE_COMPLETED_EMPLOYEES_KEY, String(value)); } catch {}\n  };\n  const setHideZeroEmployees = (value: boolean) => {\n    setHideZeroEmployeesState(value);\n    try { localStorage.setItem(HIDE_ZERO_EMPLOYEES_KEY, String(value)); } catch {}\n  };\n  const saveHiddenStaff = (next: Set<string>) => {\n    setHiddenStaff(next);\n    try { localStorage.setItem(HIDDEN_STAFF_KEY, JSON.stringify({ date: localDateKey(), keys: [...next] })); } catch {}\n  };\n  const toggleHidden = (key: string) => {\n    const next = new Set<string>(hiddenStaff);\n    if (next.has(key)) next.delete(key); else next.add(key);\n    saveHiddenStaff(next);\n  };\n  const setMilestone = (value: Milestone) => {\n    setMilestoneState(value);\n    try { localStorage.setItem(MILESTONE_KEY, value); } catch {}\n  };\n  const setHideCompletedCompetitions = (value: boolean) => {\n    setHideCompletedCompetitionsState(value);\n    try { localStorage.setItem(HIDE_COMPLETED_COMPETITIONS_KEY, String(value)); } catch {}\n  };\n  const setHideAchievedTodayCompetitions = (value: boolean) => {\n    setHideAchievedTodayCompetitionsState(value);\n    try { localStorage.setItem(HIDE_ACHIEVED_TODAY_COMPETITIONS_KEY, String(value)); } catch {}\n  };\n  const setOnlyNeedTodayCompetitions = (value: boolean) => {\n    setOnlyNeedTodayCompetitionsState(value);\n    try { localStorage.setItem(ONLY_NEED_TODAY_COMPETITIONS_KEY, String(value)); } catch {}\n  };\n  const setHideZeroCompetitions = (value: boolean) => {\n    setHideZeroCompetitionsState(value);\n    try { localStorage.setItem(HIDE_ZERO_COMPETITIONS_KEY, JSON.stringify({ date: localDateKey(), value })); } catch {}\n  };\n  const setCompetitionShops = (next: {TGDD:boolean;TOPZONE:boolean}) => {\n    const safe = next.TGDD || next.TOPZONE ? next : { TGDD: true, TOPZONE: true };\n    setCompetitionShopsState(safe);\n    try { localStorage.setItem(COMPETITION_SHOPS_KEY, JSON.stringify(safe)); } catch {}\n  };\n  useEffect(() => {\n    const handlePointerDown = (event: MouseEvent) => {\n      const target = event.target as Node;\n      if (\n        showManage &&\n        !employeeFilterPanelRef.current?.contains(target) &&\n        !employeeFilterButtonRef.current?.contains(target)\n      ) {\n        setShowManage(false);\n      }\n      if (\n        showCompetitionManage &&\n        !competitionFilterPanelRef.current?.contains(target) &&\n        !competitionFilterButtonRef.current?.contains(target)\n      ) {\n        setShowCompetitionManage(false);\n      }\n    };\n    const handleKeyDown = (event: KeyboardEvent) => {\n      if (event.key !== 'Escape') return;\n      setShowManage(false);\n      setShowCompetitionManage(false);\n    };\n    document.addEventListener('mousedown', handlePointerDown);\n    document.addEventListener('keydown', handleKeyDown);\n    return () => {\n      document.removeEventListener('mousedown', handlePointerDown);\n      document.removeEventListener('keydown', handleKeyDown);\n    };\n  }, [showManage, showCompetitionManage]);\n\n  const [now, setNow] = useState(() => new Date());\n  useEffect(() => {\n    const timer = window.setInterval(() => setNow(new Date()), 30_000);\n    return () => window.clearInterval(timer);\n  }, []);\n\n  const vnNow = getVietnamCalendarParts(now);\n  const daysInMonth = new Date(Date.UTC(vnNow.year, vnNow.month, 0)).getUTCDate();\n  const calendarDay = Math.max(1, Math.min(daysInMonth, vnNow.day));\n\n  // Target Realtime theo ngày: ngày thường dùng Stretch hệ thống, T7/CN tối thiểu 150%, ngày lễ/nghỉ lễ tối thiểu 200%.\n  // Lịch nghỉ lễ 2026 được khai báo một lần ở cấp module; ngày lễ luôn ưu tiên hơn cuối tuần.\n  const todayKey = localDateKey(now);\n  useEffect(() => {\n    try {\n      const raw = JSON.parse(localStorage.getItem(HIDDEN_STAFF_KEY) || '{}');\n      if (Array.isArray(raw)) {\n        localStorage.setItem(HIDDEN_STAFF_KEY, JSON.stringify({ date: todayKey, keys: raw.map(String) }));\n      } else if (raw?.date && raw.date !== todayKey) {\n        setHiddenStaff(new Set<string>());\n        localStorage.setItem(HIDDEN_STAFF_KEY, JSON.stringify({ date: to r-t border-amber-100 bg-white px-3 py-2.5\">\n                  <span className=\"text-[9.5px] font-semibold text-slate-500\">Đang hiện <b className=\"text-slate-800\">{visibleCompetitionRows.length}/{competitionRows.length}</b> môn thi đua</span>\n                  <button type=\"button\" onClick={() => setShowCompetitionManage(false)} className=\"shrink-0 rounded-lg bg-amber-500 px-4 py-2 text-[10px] font-black text-white shadow-sm transition hover:bg-amber-600\">✓ Xong</button>\n                </div>\n              </div>\n            )}\n            <div className=\"overflow-x-auto custom-scroll\" data-export-expand=\"true\">\n              <SortableTable className=\"w-full text-[10px] border-collapse\" style={{ minWidth: 640 }}>\n                <thead className=\"bg-slate-900 text-white\">\n                  <tr>\n                    <th className=\"px-3 py-2.5 text-left w-[170px]\">MÔN THI ĐUA</th>\n                    <th className=\"px-1.5 py-2.5 text-center leading-tight whitespace-normal w-[70px]\">LŨY KẾ</th>\n                    <th className=\"px-1.5 py-2.5 text-center text-amber-300 leading-tight whitespace-normal w-[68px]\">\n                      <span className=\"block\">RT</span>\n                      <span className=\"block\">NGÀY</span>\n                    </th>\n                    <th className=\"px-2 py-2.5 text-center leading-tight whitespace-normal w-[98px]\">TIẾN ĐỘ RT</th>\n                    <th className=\"px-2 py-2.5 text-center font-black leading-tight whitespace-normal w-[104px]\">\n                      <span className=\"block\">CÒN THIẾU</span>\n                      <span className=\"block\">TARGET RT</span>\n                    </th>\n                  </tr>\n                </thead>\n                <tbody className=\"divide-y divide-slate-100\">\n                  {visibleCompetitionRows.map(row => (\n                    <tr key={row.key}>\n                      <td className=\"px-3 py-2.5\" data-sort-value={row.name}>\n                        <div className=\"font-black text-slate-900 leading-tight\">{row.name}</div>\n                        <div className={`inline-flex mt-1 px-1.5 py-0.5 rounded text-[9px] font-black ${row.store === 'TOPZONE' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>{row.store === 'TOPZONE' ? 'TopZone' : 'TGDĐ'}</div>\n                      </td>\n                      <td className=\"px-1.5 py-2.5 text-right whitespace-nowrap\" data-sort-value={row.lkValue}>\n                        <div className=\"font-black text-slate-800\">{row.lkValue === null ? '—' : <>{formatCompetitionValue(row.lkValue, row.loai)} <span className=\"text-[8px] font-bold text-slate-500\">{metricLabel(row.loai)}</span></>}</div>\n                        <div className=\"mt-0.5 text-[9px] font-semibold text-slate-500\">\n                          {row.lkValue === null\n                            ? 'Chưa có LK'\n                            : row.lkTarget !== null\n                              ? `Target LK: ${formatCompetitionValue(row.lkTarget, row.loai)} ${metricLabel(row.loai)}`\n                              : 'LK chưa có Target'}\n                        </div>\n                      </td>\n                      <td className=\"px-1.5 py-2.5 text-right font-black text-amber-700 bg-amber-50/50 whitespace-nowrap\" data-sort-value={row.rtValue}>\n                        {row.hasRt ? (<>\n                          {formatCompetitionValue(row.rtValue, row.loai)} <span className=\"text-[8px]\">{metricLabel(row.loai)}</span>\n                        </>) : (\n                          <span className=\"inline-flex rounded-lg bg-slate-100 px-1.5 py-1 text-[8.5px] font-black text-slate-600\">CHƯA CÓ RT</span>\n                        )}\n                      </td>\n                      <td className=\"px-3 py-2.5 text-center\" data-sort-value={row.pct}>\n                        <div className=\"flex items-center justify-center gap-1.5\">\n                          <svg width=\"52\" height=\"8\" viewBox=\"0 0 52 8\" className=\"shrink-0\" aria-hidden=\"true\">\n                            <rect x=\"0\" y=\"1\" width=\"52\" height=\"6\" rx=\"3\" fill=\"#cbd5e1\" />\n                            <rect\n                              x=\"0\"\n                              y=\"1\"\n                              width={Math.max(0, Math.min(52, 52 * Math.min(row.pct, 100) / 100))}\n                              height=\"6\"\n                              rx=\"3\"\n                              fill={row.needToday !== null && row.needToday <= 0 ? '#10b981' : '#2563eb'}\n                            />\n                          </svg>\n                          <span className={`font-black text-[10.5px] ${row.needToday !== null && row.needToday <= 0 ? 'text-emerald-700' : 'text-blue-700'}`}>{row.pct === null ? '—' : formatPercent(row.pct, 1)}</span>\n                        </div>\n                        <div className=\"mt-1 text-[8px] font-semibold text-slate-500 whitespace-nowrap\">RT {formatCompetitionValue(row.rtValue, row.loai)} / {row.target === null ? '—' : formatCompetitionValue(row.target, row.loai)} {metricLabel(row.loai)}</div>\n                      </td>\n                      <td className=\"px-2 py-2.5 text-right\" data-sort-value={row.needToday}>\n                        {row.needToday === null ? (\n                          <span className=\"inline-flex px-2 py-1 rounded-lg bg-sky-50 text-sky-700 border border-sky-200 text-[9.5px] font-black whitespace-nowrap\">CHƯA CÓ TARGET RT</span>\n                        ) : (\n                          <div className={`text-[11px] font-black whitespace-nowrap ${row.needToday <= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>\n                            {row.needToday <= 0 ? 'ĐẠT TARGET RT' : `Thiếu +${row.loai === 2 || row.loai === 6 ? Math.ceil(row.needToday).toLocaleString('vi-VN') : formatCurrency(row.needToday, 1)} ${metricLabel(row.loai)}`}\n                          </div>\n                        )}\n                      </td>\n                    </tr>\n                  ))}\n                  {!visibleCompetitionRows.length && (\n                    <tr data-sort-fixed=\"true\"><td colSpan={5} className=\"p-8 text-center text-slate-500\">\n                      {competitionRows.length\n                        ? 'Không còn môn phù hợp với bộ lọc Thi đua hiện tại.'\n                        : 'Chưa có dữ liệu Thi đua Realtime/Lũy kế để theo dõi.'}\n                    </td></tr>\n                  )}\n                </tbody>\n              </SortableTable>\n            </div>\n          </section>\n        </div>\n\n        <div className=\"rounded-xl border border-slate-200 bg-slate-50 px-4 py-1.5 text-[9px] text-slate-500 flex flex-wrap items-center justify-between gap-1.5\">\n          <span><b>NV Realtime:</b> <b>Nhịp hôm nay/NV = (Target QĐ tháng 100% × hệ số ngày) ÷ số ngày trong tháng ÷ số nhân sự chính thức của shop</b>; thứ tự ưu tiên: <b>Cấu hình tay theo ngày → Ngày lễ → Thứ 7/CN → Stretch hệ thống</b>. Ngày thường = {stretchGoalPct}%, Thứ 7/CN = tối thiểu 150%, ngày lễ/nghỉ lễ = tối thiểu 200%. Hôm nay: <b>{realtimeTargetReason}</b>. Còn thiếu hôm nay = Nhịp hôm nay − RT QĐ hôm nay. <b>Riêng Thi đua:</b> Target Realtime là chỉ tiêu riêng của bảng RT, nên % HT RT = RT hôm nay ÷ Target RT và Còn thiếu RT = Target RT − RT hôm nay. Target Lũy kế được đọc riêng từ bảng Lũy kế khi có; không cộng, không thay thế và không lấy Target RT làm Target LK.</span>\n          <span>Bộ lọc NV và Thi đua được lưu riêng; OFF nhân viên chỉ có hiệu lực trong ngày và tự reset khi sang ngày mới. Ẩn CHƯA CÓ RT được mặc định bật lại mỗi ngày.</span>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/utils/aiFocusPrograms.ts":"const AI_FOCUS_STORAGE_KEY = 'skst_ai_focus_programs_v1';\nconst AI_FOCUS_MONTH_STORAGE_KEY = 'skst_ai_focus_programs_month_v1';\n\nconst sanitizePrograms = (value: any): string[] => {\n  if (!Array.isArray(value)) return [];\n  return Array.from(new Set(\n    value\n      .filter((x: any) => typeof x === 'string')\n      .map((x: string) => x.trim())\n      .filter(Boolean)\n  ));\n};\n\nexport const getVietnamMonthKey = (date = new Date()): string => {\n  try {\n    const parts = new Intl.DateTimeFormat('en-CA', {\n      timeZone: 'Asia/Ho_Chi_Minh',\n      year: 'numeric',\n      month: '2-digit',\n    }).formatToParts(date);\n    const part = (type: string) => parts.find(p => p.type === type)?.value || '';\n    const year = part('year');\n    const month = part('month');\n    if (year && month) return `${year}-${month}`;\n  } catch {}\n  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;\n};\n\nexport const readAiFocusPrograms = (): string[] => {\n  try {\n    const currentMonth = getVietnamMonthKey();\n    const savedRaw = localStorage.getItem(AI_FOCUS_STORAGE_KEY);\n    let parsed: any = [];\n    try { parsed = savedRaw ? JSON.parse(savedRaw) : []; } catch { parsed = []; }\n    const programs = sanitizePrograms(parsed);\n    const savedMonth = localStorage.getItem(AI_FOCUS_MONTH_STORAGE_KEY);\n\n    if (!savedMonth) {\n      localStorage.setItem(AI_FOCUS_MONTH_STORAGE_KEY, currentMonth);\n      localStorage.setItem(AI_FOCUS_STORAGE_KEY, JSON.stringify(programs));\n      return programs;\n    }\n\n    if (savedMonth !== currentMonth) {\n      localStorage.setItem(AI_FOCUS_STORAGE_KEY, '[]');\n      localStorage.setItem(AI_FOCUS_MONTH_STORAGE_KEY, currentMonth);\n      return [];\n    }\n\n    return programs;\n  } catch {\n    return [];\n  }\n};\n\nexport const writeAiFocusPrograms = (programs: string[]): string[] => {\n  const clean = sanitizePrograms(programs);\n  try {\n    localStorage.setItem(AI_FOCUS_STORAGE_KEY, JSON.stringify(clean));\n    localStorage.setItem(AI_FOCUS_MONTH_STORAGE_KEY, getVietnamMonthKey());\n  } catch {}\n  return clean;\n};\n","src/utils/aiFocusCloudSync.ts":"import { FIREBASE_AUTH_EVENT, getSharedFirebaseContext } from './stretchGoal';\nimport { getVietnamMonthKey } from './aiFocusPrograms';\n\nconst CLOUD_PATH = 'sharedConfig/personnelKpi/aiFocusPrograms';\nconst PENDING_STORAGE_KEY = 'skst_ai_focus_cloud_pending_v1';\nconst AI_FOCUS_SYNC_STATUS_EVENT = 'skst-ai-focus-sync-status';\n\nexport type AiFocusSyncStatus = 'local' | 'syncing' | 'synced' | 'offline' | 'signed-out' | 'permission' | 'error';\n\nexport type AiFocusSyncState = {\n  status: AiFocusSyncStatus;\n  updatedAt: number;\n  checkedAt: number;\n  updatedByEmail: string;\n};\n\nlet syncState: AiFocusSyncState = {\n  status: typeof navigator !== 'undefined' && !navigator.onLine ? 'offline' : 'local',\n  updatedAt: 0,\n  checkedAt: 0,\n  updatedByEmail: '',\n};\n\nfunction setSyncState(patch: Partial<AiFocusSyncState>) {\n  syncState = { ...syncState, ...patch };\n  try { window.dispatchEvent(new CustomEvent(AI_FOCUS_SYNC_STATUS_EVENT)); } catch {}\n}\n\nexport function getAiFocusSyncState(): AiFocusSyncState {\n  return { ...syncState };\n}\n\nexport function subscribeAiFocusSyncStatus(listener: (state: AiFocusSyncState) => void): () => void {\n  const handler = () => listener(getAiFocusSyncState());\n  window.addEventListener(AI_FOCUS_SYNC_STATUS_EVENT, handler);\n  handler();\n  return () => window.removeEventListener(AI_FOCUS_SYNC_STATUS_EVENT, handler);\n}\n\ntype AiFocusCloudMeta = {\n  updatedAt: number;\n  updatedByEmail: string;\n  updatedByUid: string;\n};\n\ntype AiFocusCloudSyncResult = {\n  status: 'ok' | 'empty' | 'signed-out' | 'offline' | 'permission' | 'error';\n  message?: string;\n};\n\ntype PendingAiFocus = {\n  monthKey: string;\n  programsJson: string;\n  queuedAt: number;\n  allowEmpty: boolean;\n};\n\nlet flushTimer: any = null;\nlet writing = false;\n\nfunction sanitizePrograms(value: any): string[] {\n  if (!Array.isArray(value)) return [];\n  const seen = new Set<string>();\n  const out: string[] = [];\n  value.forEach((item: any) => {\n    if (typeof item !== 'string') return;\n    const name = item.trim();\n    if (!name) return;\n    const key = name.toLocaleLowerCase('vi-VN');\n    if (seen.has(key)) return;\n    seen.add(key);\n    out.push(name);\n  });\n  return out;\n}\n\nfunction safeProgramsJson(programs: string[]): string {\n  try { return JSON.stringify(sanitizePrograms(programs)); }\n  catch { return '[]'; }\n}\n\nfunction parseProgramsJson(raw: string): string[] | null {\n  try {\n    const parsed = JSON.parse(raw || '[]');\n    if (!Array.isArray(parsed)) return null;\n    return sanitizePrograms(parsed);\n  } catch { return null; }\n}\n\nfunction readPending(): PendingAiFocus | null {\n  try {\n    const parsed = JSON.parse(localStorage.getItem(PENDING_STORAGE_KEY) || 'null');\n    if (!parsed || typeof parsed.monthKey !== 'string' || typeof parsed.programsJson !== 'string') return null;\n\n    if (parsed.monthKey !== getVietnamMonthKey()) {\n      localStorage.removeItem(PENDING_STORAGE_KEY);\n      return null;\n    }\n    if (!parseProgramsJson(parsed.programsJson)) return null;\n    return {\n      monthKey: parsed.monthKey,\n      programsJson: parsed.programsJson,\n      queuedAt: Number(parsed.queuedAt) || Date.now(),\n      allowEmpty: parsed.allowEmpty === true,\n    };\n  } catch { return null; }\n}\n\nfunction writePending(value: PendingAiFocus | null) {\n  try {\n    if (!value) localStorage.removeItem(PENDING_STORAGE_KEY);\n    else localStorage.setItem(PENDING_STORAGE_KEY, JSON.stringify(value));\n  } catch {}\n}\n\nfunction scheduleFlush() {\n  clearTimeout(flushTimer);\n  flushTimer = window.setTimeout(() => { void flushAiFocusProgramsSync(); }, 300);\n}\n\nexport function queueAiFocusProgramsSync(programs: string[], options: { allowEmpty?: boolean } = {}): void {\n  const clean = sanitizePrograms(programs);\n  const allowEmpty = options.allowEmpty === true;\n\n  // Bảo vệ máy mới/localStorage rỗng không tự ghi đè danh sách Cloud.\n  // Chỉ cho phép ghi [] khi thao tác người dùng chủ động yêu cầu bỏ hết môn.\n  if (clean.length === 0 && !allowEmpty) {\n    const pending = readPending();\n    if (pending && parseProgramsJson(pending.programsJson)?.length === 0 && !pending.allowEmpty) {\n      writePending(null);\n    }\n    return;\n  }\n\n  writePending({\n    monthKey: getVietnamMonthKey(),\n    programsJson: safeProgramsJson(clean),\n    queuedAt: Date.now(),\n    allowEmpty,\n  });\n  setSyncState({ status: navigator.onLine ? 'syncing' : 'offline' });\n  scheduleFlush();\n}\n\nasync function flushAiFocusProgramsSync(): Promise<AiFocusCloudSyncResult> {\n  const pending = readPending();\n  if (!pending) return { status: 'empty' };\n  const pendingPrograms = parseProgramsJson(pending.programsJson) || [];\n  if (pendingPrograms.length === 0 && !pending.allowEmpty) {\n    writePending(null);\n    return { status: 'empty' };\n  }\n  if (!navigator.onLine) {\n    setSyncState({ status: 'offline' });\n    return { status: 'offline' };\n  }\n  if (writing) {\n    setSyncState({ status: 'syncing' });\n    return { status: 'empty' };\n  }\n\n  const ctx = await getSharedFirebaseContext();\n  if (!ctx?.user || !ctx?.db) {\n    setSyncState({ status: 'signed-out' });\n    return { status: 'signed-out' };\n  }\n\n  writing = true;\n  setSyncState({ status: 'syncing' });\n  let retryPending = true;\n  try {\n    const serverTimestamp = (window as any).firebase?.database?.ServerValue?.TIMESTAMP || Date.now();\n    await ctx.db.ref(CLOUD_PATH).set({\n      monthKey: pending.monthKey,\n      programsJson: pending.programsJson,\n      updatedAt: serverTimestamp,\n      updatedByEmail: String(ctx.user.email || ''),\n      updatedByUid: String(ctx.user.uid || ''),\n    });\n    const latest = readPending();\n    if (latest && latest.monthKey === pending.monthKey && latest.programsJson === pending.programsJson) {\n      writePending(null);\n    }\n    const now = Date.now();\n    setSyncState({\n      status: 'synced',\n      updatedAt: now,\n      checkedAt: now,\n      updatedByEmail: String(ctx.user.email || ''),\n    });\n    return { status: 'ok' };\n  } catch (e: any) {\n    const message = String(e?.code || e?.message || e || '');\n    if (/permission|denied/i.test(message)) {\n      retryPending = false;\n      setSyncState({ status: 'permission' });\n      return { status: 'permission', message };\n    }\n    setSyncState({ status: 'error' });\n    return { status: 'error', message };\n  } finally {\n    writing = false;\n    if (retryPending && readPending() && navigator.onLine) scheduleFlush();\n  }\n}\n\nfunction parseRemote(raw: any): { monthKey: string; programs: string[]; meta: AiFocusCloudMeta } | null {\n  if (!raw || typeof raw !== 'object' || typeof raw.monthKey !== 'string' || typeof raw.programsJson !== 'string') return null;\n  const programs = parseProgramsJson(raw.programsJson);\n  if (!programs) return null;\n  return {\n    monthKey: raw.monthKey,\n    programs,\n    meta: {\n      updatedAt: Number(raw.updatedAt) || 0,\n      updatedByEmail: String(raw.updatedByEmail || ''),\n      updatedByUid: String(raw.updatedByUid || ''),\n    },\n  };\n}\n\nexport function subscribeAiFocusProgramsSync(\n  getLocalPrograms: () => string[],\n  applyRemote: (programs: string[], meta: AiFocusCloudMeta) => void,\n): () => void {\n  let disposed = false;\n  let ref: any = null;\n  let handler: any = null;\n\n  const detach = () => {\n    if (ref && handler) {\n      try { ref.off('value', handler); } catch {}\n    }\n    ref = null;\n    handler = null;\n  };\n\n  const attach = async () => {\n    detach();\n    if (disposed) return;\n    if (!navigator.onLine) {\n      setSyncState({ status: 'offline' });\n      return;\n    }\n    try {\n      const ctx = await getSharedFirebaseContext();\n      if (disposed) return;\n      if (!ctx?.user || !ctx?.db) {\n        setSyncState({ status: 'signed-out' });\n        return;\n      }\n      ref = ctx.db.ref(CLOUD_PATH);\n      handler = (snap: any) => {\n        if (disposed) return;\n        const remote
