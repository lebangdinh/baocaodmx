table>\n        </div>\n      </div>\n\n      {/* 2. BẢNG TỔNG HỢP THI ĐUA CỤM (2 BẢNG SONG SONG) */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4\">\n        <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2 border-b border-slate-100\">\n          <div>\n            <h3 className=\"font-extrabold text-slate-900 text-sm uppercase tracking-wide\">\n              BẢNG TỔNG HỢP THI ĐUA CỤM SIÊU THỊ\n            </h3>\n            <p className=\"text-xs text-slate-500\">\n              Hiển thị % hoàn thành của từng shop và Tổng Cụm (chia 2 bảng song song giúp quan sát toàn cảnh)\n            </p>\n          </div>\n          <div className=\"relative\">\n            <input\n              type=\"text\"\n              value={searchTerm}\n              onChange={(e) => setSearchTerm(e.target.value)}\n              placeholder=\"Tìm môn thi đua...\"\n              className=\"text-xs px-3.5 py-1.5 border border-slate-200 rounded-xl focus:outline-none w-56\"\n            />\n          </div>\n        </div>\n\n        <div className=\"grid grid-cols-1 lg:grid-cols-2 gap-5\">\n          <div className=\"border border-slate-200 rounded-2xl overflow-hidden shadow-xs\">\n            <div className=\"bg-slate-50 px-3.5 py-2.5 border-b border-slate-200 font-bold text-xs text-slate-700 flex justify-between items-center\">\n              <span>🎗 Bảng 1: Nhóm thi đua (Top đầu)</span>\n              <span className=\"text-[11px] text-slate-500 font-normal\">{list1.length} môn</span>\n            </div>\n            <div className=\"overflow-x-auto custom-scroll max-h-[550px]\">\n              <table className=\"w-full text-left text-xs border-collapse\">\n                <thead className=\"bg-blue-600 text-white font-bold sticky top-0 shadow-xs\">\n                  <tr>\n                    <th className=\"py-2.5 px-3\">MÔN THI ĐUA</th>\n                    <th className=\"py-2.5 px-2 text-center\">ST 10341</th>\n                    <th className=\"py-2.5 px-2 text-center\">ST 933</th>\n                    <th className=\"py-2.5 px-2 text-center\">TỔNG CỤM</th>\n                  </tr>\n                </thead>\n                <tbody className=\"divide-y divide-slate-100 text-slate-700\">\n                  {renderSideProgTable(list1)}\n                </tbody>\n              </table>\n            </div>\n          </div>\n\n          <div className=\"border border-slate-200 rounded-2xl overflow-hidden shadow-xs\">\n            <div className=\"bg-slate-50 px-3.5 py-2.5 border-b border-slate-200 font-bold text-xs text-slate-700 flex justify-between items-center\">\n              <span>🎗 Bảng 2: Nhóm thi đua (Cần bứt phá)</span>\n              <span className=\"text-[11px] text-slate-500 font-normal\">{list2.length} môn</span>\n            </div>\n            <div className=\"overflow-x-auto custom-scroll max-h-[550px]\">\n              <table className=\"w-full text-left text-xs border-collapse\">\n                <thead className=\"bg-blue-600 text-white font-bold sticky top-0 shadow-xs\">\n                  <tr>\n                    <th className=\"py-2.5 px-3\">MÔN THI ĐUA</th>\n                    <th className=\"py-2.5 px-2 text-center\">ST 10341</th>\n                    <th className=\"py-2.5 px-2 text-center\">ST 933</th>\n                    <th className=\"py-2.5 px-2 text-center\">TỔNG CỤM</th>\n                  </tr>\n                </thead>\n                <tbody className=\"divide-y divide-slate-100 text-slate-700\">\n                  {renderSideProgTable(list2)}\n                </tbody>\n              </table>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/views/SucKhoeNvView.tsx":"import React, { useState, useEffect, useRef, useMemo } from 'react';\nimport { Chart as ChartJS, registerables } from 'chart.js';\nimport { Search, Plus, Eye, EyeOff, Trophy, Sparkles, Camera } from 'lucide-react';\nimport { AppDataState, AggregatedEmployee, PersonnelConfigMap } from '../types';\nimport {\n  formatCurrency,\n  formatInt,\n  formatPercent,\n  formatProgramName,\n  cleanCode,\n  cleanProgName,\n  getCellNumber\n} from '../utils/formatters';\nimport { captureElement, downloadImage } from '../utils/imageExporter';\n\nChartJS.register(...registerables);\n\ninterface SucKhoeNvViewProps {\n  appData: AppDataState;\n  personnelConfig: PersonnelConfigMap;\n  onUpdatePersonnelConfig?: (cfg: PersonnelConfigMap) => void;\n  onOpenQuickUpload: () => void;\n  onOpenProgramDetail: (storeKey: string, code: string | number, name: string) => void;\n  onOpenPersonnelSettings?: () => void;\n}\n\nconst TOPZONE_STAFF_SET = new Set([\n  'Nguyễn Quỳnh Anh',\n  'Lê Thị Mỹ Linh',\n  'Tạ Đức Hiếu',\n  'Trần Minh Hải',\n  'Trần Thị Mỹ Trang',\n  'Đỗ Nhật Trinh',\n  '98486',\n  '170266',\n  '189769',\n  '83089',\n  '45500',\n  '183180',\n]);\n\nconst TGDD_STAFF_SET = new Set([\n  'Lê Văn Nhân',\n  'Lê Thị Thanh Trâm',\n  'Nguyễn Thị Thy',\n  'Trần Thị Huyền Trang',\n  '204201',\n  '269167',\n  '29649',\n  '259623',\n]);\n\nexport const SucKhoeNvView: React.FC<SucKhoeNvViewProps> = ({\n  appData,\n  personnelConfig,\n  onUpdatePersonnelConfig,\n  onOpenQuickUpload,\n  onOpenProgramDetail,\n  onOpenPersonnelSettings,\n}) => {\n  const [storeTab, setStoreTab] = useState<'TGDD' | 'TOPZONE' | 'ALL'>('TGDD');\n  const [displayMode, setDisplayMode] = useState<'SUMMARY' | 'TABLE' | 'CARDS'>('SUMMARY');\n  const [cardCols, setCardCols] = useState<number>(2);\n  const [isOfficialOnly, setIsOfficialOnly] = useState<boolean>(true);\n  const [visibilityFilter, setVisibilityFilter] = useState<'VISIBLE_ONLY' | 'ALL' | 'HIDDEN_ONLY'>('VISIBLE_ONLY');\n  const [isExcludeOnline, setIsExcludeOnline] = useState<boolean>(true);\n  const [searchTerm, setSearchTerm] = useState<string>('');\n  const [isChartVisible, setIsChartVisible] = useState<boolean>(true);\n  const [isExpandAllPrograms, setIsExpandAllPrograms] = useState<boolean>(false);\n  const [isBulkExporting, setIsBulkExporting] = useState<boolean>(false);\n\n  const handleToggleEmployeeVisibility = (empName: string, store: string) => {\n    const storeKey: 'TGDD' | 'TOPZONE' = store.includes('TopZone') || store.includes('AAR') || store === 'TOPZONE' ? 'TOPZONE' : 'TGDD';\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[storeKey]) next[storeKey] = {};\n    if (!next[storeKey][empName]) next[storeKey][empName] = {};\n    const curr = next[storeKey][empName].isVisible !== false;\n    next[storeKey][empName].isVisible = !curr;\n    onUpdatePersonnelConfig?.(next);\n  };\n\n  const handleToggleEmployeeOfficial = (empName: string, store: string) => {\n    const storeKey: 'TGDD' | 'TOPZONE' = store.includes('TopZone') || store.includes('AAR') || store === 'TOPZONE' ? 'TOPZONE' : 'TGDD';\n    const next = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[storeKey]) next[storeKey] = {};\n    if (!next[storeKey][empName]) next[storeKey][empName] = {};\n    const curr = next[storeKey][empName].isOfficial !== false;\n    next[storeKey][empName].isOfficial = !curr;\n    onUpdatePersonnelConfig?.(next);\n  };\n\n  const handleExportEmployeeCard = async (\n    cardElement: HTMLElement | null,\n    emp: AggregatedEmployee,\n    rank: number,\n  ) => {\n    if (!cardElement) return;\n\n    const safeName = String(emp.name || 'NhanVien')\n      .normalize('NFD')\n      .replace(/[\\u0300-\\u036f]/g, '')\n      .replace(/[^a-zA-Z0-9]+/g, '_')\n      .replace(/^_+|_+$/g, '');\n    const dateStr = new Date().toISOString().slice(0, 10);\n    const fileName = `XepHang_NV_${rank}_${safeName}_${dateStr}.png`;\n\n    try {\n      const result = await captureElement(cardElement, {\n        fileName,\n        backgroundColor: '#ffffff',\n        scale: 2,\n      });\n      downloadImage(result.blob, result.fileName);\n    } catch (err) {\n      console.error('Employee card export error:', err);\n      window.alert('Không thể xuất ảnh thẻ nhân viên. Vui lòng thử lại!');\n    }\n  };\n\n  const handleExportAllEmployeeCards = async () => {\n    if (isBulkExporting) return;\n\n    const cards = Array.from(document.querySelectorAll('[data-employee-card=\"true\"]')) as HTMLElement[];\n    if (!cards.length || !aggregatedEmployees.length) {\n      window.alert('Chưa có thẻ nhân viên để xuất ảnh. Hãy chuyển sang mục 🃏 Thẻ Chi Tiết và kiểm tra dữ liệu.');\n      return;\n    }\n\n    const JSZipCtor = (window as any).JSZip;\n    if (!JSZipCtor) {\n      window.alert('Chưa tải được bộ đóng gói ZIP. Vui lòng kiểm tra kết nối mạng rồi thử lại.');\n      return;\n    }\n\n    setIsBulkExporting(true);\n    try {\n      const zip = new JSZipCtor();\n      const dateStr = new Date().toISOString().slice(0, 10);\n\n      for (let i = 0; i < cards.length; i++) {\n        const emp = aggregatedEmployees[i];\n        if (!emp) continue;\n\n        const safeName = String(emp.name || 'NhanVien')\n          .normalize('NFD')\n          .replace(/[\\u0300-\\u036f]/g, '')\n          .replace(/[^a-zA-Z0-9]+/g, '_')\n          .replace(/^_+|_+$/g, '');\n        const fileName = `XepHang_NV_${i + 1}_${safeName}_${dateStr}.png`;\n\n        const result = await captureElement(cards[i], {\n          fileName,\n          backgroundColor: '#ffffff',\n          scale: 2,\n        });\n        zip.file(fileName, result.blob);\n      }\n\n      const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });\n      const url = URL.createObjectURL(zipBlob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = `XepHang_NhanVien_TatCa_${storeTab}_${dateStr}.zip`;\n      document.body.appendChild(a);\n      a.click();\n      a.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 1500);\n\n      window.alert(`Đã xuất ${cards.length} ảnh nhân viên thành 1 file ZIP. Mỗi nhân viên vẫn là 1 ảnh PNG riêng.`);\n    } catch (err) {\n      console.error('Bulk employee card export error:', err);\n      window.alert('Không thể xuất toàn bộ ảnh nhân viên. Vui lòng thử lại!');\n    } finally {\n      setIsBulkExporting(false);\n    }\n  };\n\n  const chartRef = useRef<HTMLCanvasElement>(null);\n  const chartInstance = useRef<ChartJS | null>(null);\n\n  // 1. Determine valid disciplines with target for the active store\n  const validPrograms = useMemo(() => {\n    const storeKeyw = storeTab === 'TOPZONE' ? 'AAR' : 'TGD';\n    const td_lk = appData.td_luyke || [];\n    const valid: { code: string | number; name: string; loai: number; storeTarget: number }[] = [];\n\n    td_lk.forEach(r => {\n      if (String(r['ĐƠN VỊ / NHÂN VIÊN']).includes(storeKeyw)) {\n        const target = parseFloat(String(r['TARGET (TR/SL theo LOẠI TĐ)'])) || 0;\n        if (target > 0) {\n          valid.push({\n            code: r['MÃ CHƯƠNG TRÌNH'] || '',\n            name: r['CHƯƠNG TRÌNH'] || '',\n            loai: Number(r['LOẠI TĐ']) || 3,\n            storeTarget: target,\n          });\n        }\n      }\n    });\n\n    return valid;\n  }, [storeTab, appData.td_luyke, appData.nv_tz, appData.nv_tgdd]);\n\n  // 2. Aggregate employees data\n  const aggregatedEmployees: AggregatedEmployee[] = useMemo(() => {\n    const tgddRaw = appData.nv_tgdd || [];\n    const tzRaw = appData.nv_tz || [];\n    const dtNvList = appData.dt_nv_luyke || [];\n\n    // Build employee records from BOTH sources but use MÃ NV as the canonical key.\n    // This prevents the same person appearing twice as:\n    //   \"98486 - Nguyễn Quỳnh Anh\" (competition data)\n    //   \"Nguyễn Quỳnh Anh\" (revenue data).\n    type EmpBucket = { id: string; name: string; progRows: any[]; revRow: any };\n    const buckets = new Map<string, EmpBucket>();\n    const canonicalName = (s: any) => String(s || '').replace(/\\s+/g, ' ').trim();\n    const canonicalId = (s: any) => cleanCode(s);\n    const addBucket = (idRaw: any, nameRaw: any, storeHint: 'TGDD' | 'TOPZONE', row?: any) => {\n      const id = canonicalId(idRaw);\n      const name = canonicalName(nameRaw);\n      if (!name || /^online$/i.test(name) || /online/i.test(name)) return null;\n      const key = id ? `id:${id}` : `name:${name.toLowerCase()}`;\n      let b = buckets.get(key);\n      if (!b) {\n        b = { id, name, progRows: [], revRow: {} };\n        buckets.set(key, b);\n      }\n      if (!b.id && id) b.id = id;\n      if (name && (!b.name || b.name.includes(' - '))) b.name = name;\n      if (row) {\n        if (row.__source === 'prog') b.progRows.push(row);\n        if (row.__source === 'rev') b.revRow = row;\n      }\n      return b;\n    };\n\n    const classifyProgStore = (category: 'TGDD' | 'TOPZONE', r: any) => {\n      const id = canonicalId(r['MÃ NV'] || r['Mã NV']);\n      const nameRaw = r['ĐƠN VỊ / NHÂN VIÊN'] || r['Nhân viên'] || r['Họ và tên'];\n      const full = canonicalName(nameRaw);\n      const name = full.replace(/^\\d{4,7}\\s*[-_–]\\s*/, '').trim();\n      const isTzByFixed = TOPZONE_STAFF_SET.has(name) || TOPZONE_STAFF_SET.has(id);\n      const isTgByFixed = TGDD_STAFF_SET.has(name) || TGDD_STAFF_SET.has(id);\n      if (category === 'TGDD') return !isTzByFixed;\n      return !isTgByFixed;\n    };\n\n    const progSources: { rows: any[]; store: 'TGDD' | 'TOPZONE' }[] =\n      storeTab === 'TGDD' ? [{ rows: tgddRaw, store: 'TGDD' }] :\n      storeTab === 'TOPZONE' ? [{ rows: tzRaw, store: 'TOPZONE' }] :\n      [{ rows: tgddRaw, store: 'TGDD' }, { rows: tzRaw, store: 'TOPZONE' }];\n\n    progSources.forEach(src => {\n      src.rows.forEach(r0 => {\n        if (!classifyProgStore(src.store, r0)) return;\n        const full = canonicalName(r0['ĐƠN VỊ / NHÂN VIÊN'] || r0['Nhân viên'] || r0['Họ và tên']);\n        const id = canonicalId(r0['MÃ NV'] || r0['Mã NV']);\n        const name = full.replace(/^\\d{4,7}\\s*[-_–]\\s*/, '').trim();\n        const row = { ...r0, __source: 'prog', __store: src.store };\n        addBucket(id, name, src.store, row);\n      });\n    });\n\n    dtNvList.forEach(r0 => {\n      const id = canonicalId(r0['MÃ NHÂN VIÊN'] || r0['Mã NV']);\n      const name = canonicalName(r0['TÊN NHÂN VIÊN'] || r0['Nhân viên'] || r0['Họ và tên']);\n      if (!name || /online/i.test(name)) return;\n      const sourceStore = String(r0['SIÊU THỊ'] || '').toLowerCase();\n      const isTz = sourceStore.includes('topzone') || sourceStore.includes('aar') || TOPZONE_STAFF_SET.has(name) || TOPZONE_STAFF_SET.has(id);\n      if (storeTab === 'TGDD' && isTz) return;\n      if (storeTab === 'TOPZONE' && !isTz) return;\n      addBucket(id, name, isTz ? 'TOPZONE' : 'TGDD', { ...r0, __source: 'rev', __store: isTz ? 'TOPZONE' : 'TGDD' });\n    });\n\n    const employeeRows = dtNvList;\n    const lkStoreRows = appData.dt_luyke || [];\n    const daysCandidates = [\n      ...employeeRows.map(r => getCellNumber(r, ['SỐ NGÀY CỬA SỔ', 'SỐ NGÀY', 'NGÀY CỬA SỔ'])),\n      ...lkStoreRows.map(r => getCellNumber(r, ['SỐ NGÀY CỬA SỔ', 'SỐ NGÀY', 'NGÀY CỬA SỔ']))\n    ].filter(n => n > 0);\n    const daysInMonthForForecast = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();\n    // Employee BI rows may omit SỐ NGÀY CỬA SỔ. Use the LK store source\n    // (or yesterday as a final fallback) so % DỰ is based on completed days.\n    const fallbackDaysRun = Math.max(0, new Date().getDate() - 1);\n    const daysRun = daysCandidates.length ? Math.max(...daysCandidates) : fallbackDaysRun;\n    const pacingMultiplier = daysInMonthForForecast / Math.max(1, daysRun);\n\n    // TARGET NHÂN VIÊN dùng một quy tắc duy nhất cho cả doanh thu và từng môn thi đua:\n    // TARGET NV = TARGET SIÊU THỊ × 150% ÷ SỐ NHÂN SỰ CHÍNH THỨC.\n    // Số nhân sự lấy trực tiếp từ cấu hình KPI; không đếm các dòng thi đua cũ/hỗ trợ\n    // trong dữ liệu BI vì các dòng đó có thể làm phình mẫu số và khiến target bị sai.\n    const staffCountByStore = (storeKey: 'TGDD' | 'TOPZONE') => {\n      const roster = personnelConfig[storeKey] || {};\n      const count = Object.values(roster).filter((cfg: any) => cfg?.isOfficial === true).length;\n      if (count > 0) return count;\n      // Fallback theo roster mặc định của cụm nếu dữ liệu cấu hình chưa được nạp.\n      return storeKey === 'TGDD' ? 4 : 6;\n    };\n\n    const shopTargetQdTotal = (() => {\n      const rows = lkStoreRows.filter(r => {\n        const code = cleanCode(r['MÃ ĐƠN VỊ'] || r['Mã đơn vị'] || '');\n        const name = String(r['TÊN ĐƠN VỊ'] || r['Siêu thị'] || r['SIÊU THỊ'] || '');\n        const isTzRow = code === '10341' || /AAR|TOPZONE/i.test(name);\n        const isTgdRow = code === '933' || /TGD|TGDD|THẾ GIỚI DI ĐỘNG/i.test(name);\n        return storeTab === 'TOPZONE' ? isTzRow : storeTab === 'TGDD' ? isTgdRow : isTzRow || isTgdRow;\n      });\n      return rows.reduce((sum, r) => sum + getCellNumber(r, ['TARGET QĐ (TR)', 'TARGET (TR)', 'TARGET']), 0);\n    })();\n\n    const employees: AggregatedEmployee[] = [];\n    buckets.forEach(bucket => {\n      const empProgRows = bucket.progRows;\n      const empRevRow = bucket.revRow || {};\n      const id = bucket.id || cleanCode(empRevRow['MÃ NHÂN VIÊN'] || '');\n      const name = bucket.name || String(empRevRow['TÊN NHÂN VIÊN'] || '').trim();\n\n      const sourceStore = String(empRevRow['SIÊU THỊ'] || '').toLowerCase();\n      const isTz = sourceStore.includes('topzone') || sourceStore.includes('aar') || TOPZONE_STAFF_SET.has(name) || TOPZONE_STAFF_SET.has(id) || empProgRows.some(r => r.__store === 'TOPZONE');\n      const storeName = isTz ? 'TopZone' : 'TGDĐ';\n      const storeConfigKey = isTz ? 'TOPZONE' : 'TGDD';\n\n      const cfg = (personnelConfig[storeConfigKey] || {})[name] || (personnelConfig[storeConfigKey] || {})[`${id} - ${name}`] || {\n        // Không có cấu hình thì xem là nhân sự hỗ trợ, tránh tự động đưa nhân sự cũ\n        // từ bảng thi đua vào nhóm chính thức và làm sai target.\n        isOfficial: false,\n        isVisible: true,\n        targetPct: 0,\n      };\n\n      // THẺ TỔNG: chỉ lấy từ Doanh thu nhân viên Lũy kế.\n      const totalDt = getCellNumber(empRevRow, ['DOANH THU (TR)', 'DOANH THU', 'DT', 'DT LŨY KẾ (TR)']);\n      const totalDtQd = getCellNumber(empRevRow, ['DOANH THU QĐ (TR)', 'DT QUY ĐỔI (TR)', 'DTQĐ', 'DT LŨY KẾ QĐ (TR)']);\n      const totalTragop = getCellNumber(empRevRow, ['DT TRẢ GÓP (TR)', 'DT TRẢ GÓP']);\n      const totalBill = getCellNumber(empRevRow, ['SỐ LƯỢNG', 'Số lượng', 'SL']);\n\n      // Target doanh thu NV = 150% target siêu thị / số nhân sự chính thức.\n      // Không dùng targetPct cũ trong cấu hình để tránh target doanh thu và target môn\n      // dùng hai công thức khác nhau.\n      const staffCount = Math.max(1, staffCountByStore(storeConfigKey));\n      const empTargetShare = 1.5 / staffCount;\n      const empTargetQd = shopTargetQdTotal * empTargetShare;\n      const pctLkRev = empTargetQd > 0 ? (totalDtQd / empTargetQd * 100) : 0;\n      const pctDukienRev = pctLkRev * pacingMultiplier;\n\n      let completedCount = 0;\n      const empPrograms: any[] = [];\n\n      // Build programs from the employee-competition source itself. Store-level\n      // competition only supplies the target/loại when available; it never supplies THỰC.\n      const programMap = new Map<string, any>();\n      empProgRows.forEach(r => {\n        const pname = cleanProgName(r['CHƯƠNG TRÌNH'] || r['Tên CT'] || '');\n        if (!pname) return;\n        if (!programMap.has(pname)) programMap.set(pname, r);\n      });\n\n      const storePrograms = validPrograms;\n      storePrograms.forEach(vProg => {\n        const pkey = cleanProgName(vProg.name);\n        const matchRows = empProgRows.filter(r => cleanProgName(r['CHƯƠNG TRÌNH'] || r['Tên CT']) === pkey);\n        if (matchRows.length === 0) return;\n\n        let thuc = 0;\n        let dtQdProg = 0;\n        let hangVung = '';\n        matchRows.forEach(mr => {\n          // IMPORTANT: THỰC comes from the metric of the employee competition row.\n          // Revenue programs -> DOANH THU (TR); quantity programs -> SỐ LƯỢNG.\n          const loaiRow = Number(mr['LOẠI TĐ']) || Number(vProg.loai) || 3;\n          const mDt = getCellNumber(mr, ['DOANH THU (TR)', 'DOANH THU', 'DT']);\n          const mDtQd = getCellNumber(mr, ['DT QUY ĐỔI (TR)', 'DTQĐ', 'DOANH THU QĐ (TR)']);\n          const mSl = getCellNumber(mr, ['SỐ LƯỢNG', 'SL']);\n          hangVung = mr['HẠNG VÙNG'] || mr['Hạng vùng'] || '';\n          if (loaiRow === 2 || loaiRow === 6) thuc += mSl;\n          else thuc += mDt;\n          dtQdProg += mDtQd;\n        });\n\n        // TARGET THI ĐUA NHÂN VIÊN = TARGET MÔN DO ANH NHẬP × 150% / SỐ NHÂN SỰ CHÍNH THỨC.\n        // Ví dụ: Target môn = 47.99, TGDĐ có 4 NV => 47.99 × 150% / 4 = 18.0.\n        const staffCount = Math.max(1, staffCountByStore(storeConfigKey));\n        const empTarget = Math.round((vProg.storeTarget * 1.5 / staffCount) * 10) / 10;\n        const pctLk = empTarget > 0 ? (thuc / empTarget * 100) : 0;\n        const pctDu = pctLk * pacingMultiplier;\n        if (pctLk >= 100) completedCount++;\n\n        empPrograms.push({\n          code: vProg.code,\n          name: vProg.name,\n          displayName: formatProgramName(vProg.name),\n          thuc,\n          dtQd: dtQdProg,\n          target: empTarget,\n          pctLk,\n          pctDu,\n          loai: vProg.loai,\n          hangVung,\n        });\n      });\n\n      employees.push({\n        name,\n        id,\n        store: storeName,\n        department: `${id} - BP All In One - DMX`,\n        isOfficial: cfg.isOfficial !== false,\n        isVisible: cfg.isVisible !== false,\n        targetSharePct: Math.round((1.5 / Math.max(1, staffCountByStore(storeConfigKey))) * 1000) / 10,\n        totalDt,\n        totalDtQd,\n        totalTragop,\n        totalBill,\n        pctTragop: totalDt > 0 ? (totalTragop / totalDt * 100) : 0,\n        pctDukien: pctDukienRev,\n        completedCount,\n        pctDongGop: 0,\n        dtDiem: totalDt / 10,\n        hieuQuaQd: totalDt > 0 ? (totalDtQd / totalDt * 100) : 100,\n        hqDiem: (totalDt / 10) * ((totalDt > 0 ? (totalDtQd / totalDt * 100) : 100) / 100) / 10,\n        diemKpi: (totalDtQd / 20) + (completedCount * 1.5),\n        programs: empPrograms,\n      });\n    });\n\n    let filtered = employees;\n    if (isExcludeOnline) filtered = filtered.filter(e => !/online/i.test(String(e.name || '')) && !/online/i.test(String(e.department || '')));\n    if (visibilityFilter === 'VISIBLE_ONLY') filtered = filtered.filter(e => e.isVisible !== false);\n    else if (visibilityFilter === 'HIDDEN_ONLY') filtered = filtered.filter(e => e.isVisible === false);\n    if (isOfficialOnly) filtered = filtered.filter(e => e.isOfficial);\n    if (searchTerm) filtered = filtered.filter(e => e.name.toLowerCase().includes(searchTerm.toLowerCase()) || String(e.id).includes(searchTerm));\n\n    const totalStoreKpi = filtered.reduce((sum, e) => sum + (Number(e.diemKpi) || 0), 0);\n    filtered.forEach(emp => { emp.pctDongGop = totalStoreKpi > 0 ? ((Number(emp.diemKpi) || 0) / totalStoreKpi * 100) : 0; });\n\n    // Xếp hạng chính thức: ưu tiên KPI / Điểm đóng góp, cao nhất đứng trước.\n    // Khi KPI bằng nhau, dùng % dự kiến và DT Quy Đổi để phá hòa.\n    filtered.sort((a, b) => {\n      const kpiDiff = (Number(b.diemKpi) || 0) - (Number(a.diemKpi) || 0);\n      if (Math.abs(kpiDiff) > 0.000001) return kpiDiff;\n      const duDiff = (Number(b.pctDukien) || 0) - (Number(a.pctDukien) || 0);\n      if (Math.abs(duDiff) > 0.000001) return duDiff;\n      return (Number(b.totalDtQd) || 0) - (Number(a.totalDtQd) || 0);\n    });\n    return filtered;\n  }, [storeTab, appData, personnelConfig, isOfficialOnly, visibilityFilter, isExcludeOnline, searchTerm, validPrograms]);\n  // 3. Render chart\n  useEffect(() => {\n    if (!chartRef.current || !isChartVisible) return;\n    if (chartInstance.current) chartInstance.current.destroy();\n\n    if (aggregatedEmployees.length === 0) return;\n\n    const names = aggregatedEmployees.map(e => e.name);\n    const dtData = aggregatedEmployees.map(e => e.totalDt);\n    const dtQdData = aggregatedEmployees.map(e => e.totalDtQd);\n    const tragopData = aggregatedEmployees.map(e => e.totalTragop);\n\n    chartInstance.current = new ChartJS(chartRef.current, {\n      type: 'bar',\n      data: {\n        labels: names,\n        datasets: [\n          {\n            label: 'Doanh Thu Thực (Tr)',\n            data: dtData,\n            backgroundColor: '#3b82f6',\n            borderRadius: 6,\n          },\n          {\n            label: 'Doanh Thu Quy Đổi (Tr)',\n            data: dtQdData,\n            backgroundColor: '#6366f1',\n            borderRadius: 6,\n          },\n          {\n            label: 'Doanh Thu Trả Góp (Tr)',\n            data: tragopData,\n            backgroundColor: '#10b981',\n            borderRadius: 6,\n          },\n        ],\n      },\n      options: {\n        responsive: true,\n        maintainAspectRatio: false,\n        plugins: {\n          legend: { position: 'top', labels: { boxWidth: 12, font: { size: 10, weight: 'bold' } } },\n        },\n        scales: {\n          x: { ticks: { font: { size: 10, weight: 'bold' } } },\n          y: { beginAtZero: true, ticks: { font: { size: 9 } } },\n        },\n      },\n    });\n\n    return () => {\n      chartInstance.current?.destroy();\n    };\n  }, [aggregatedEmployees, isChartVisible]);\n\n  const totalDisciplines = validPrograms.length;\n\n  return (\n    <div className=\"space-y-5\">\n      {/* 1. Header Bar */}\n      <div className=\"bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4\">\n        <div className=\"flex items-center space-x-3.5\">\n          <span className=\"px-3 py-1.5 bg-slate-900 text-white font-black text-xs rounded-xl font-mono shadow-xs flex-shrink-0\">\n            {storeTab === 'TGDD' ? '933' : storeTab === 'TOPZONE' ? '10341' : 'CỤM 933'}\n          </span>\n          <div className=\"space-y-0.5\">\n            <h3 className=\"font-black text-slate-900 text-base sm:text-lg uppercase tracking-tight leading-snug\">\n              BẢNG XẾP HẠNG THI ĐUA & DOANH THU NHÂN VIÊN – {storeTab === 'TGDD' ? 'TGDĐ' : storeTab === 'TOPZONE' ? 'TOPZONE' : 'TOÀN CỤM'}\n            </h3>\n            <p className=\"text-xs text-slate-500 font-medium leading-normal\">\n              Cập nhật đầy đủ 3 nguồn: DT Nhân Viên + TĐ TGDĐ + TĐ TopZone\n            </p>\n            <div className=\"export-only items-center gap-3 pt-1 text-[11px] text-slate-500 font-semibold\">\n              <span>📅 Ngày xuất: {new Date().toLocaleDateString('vi-VN')}</span>\n              <span>•</span>\n              <span>⏰ {new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })}</span>\n              <span>•</span>\n              <span className=\"text-indigo-700 font-bold\">Tổng nhân sự: {aggregatedEmployees.length} nhân viên</span>\n            </div>\n          </div>\n        </div>\n\n        <div className=\"flex flex-wrap items-center gap-2.5 no-export\">\n          {/* Store Switcher */}\n          <div className=\"flex rounded-xl bg-slate-100 p-1 text-xs font-bold shadow-inner\">\n            <button\n              onClick={() => setStoreTab('TGDD')}\n              className={`px-3.5 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                storeTab === 'TGDD' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              TGDĐ\n            </button>\n            <button\n              onClick={() => setStoreTab('TOPZONE')}\n              className={`px-3.5 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                storeTab === 'TOPZONE' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              TOPZONE\n            </button>\n            <button\n              onClick={() => setStoreTab('ALL')}\n              className={`px-3.5 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                storeTab === 'ALL' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600 hover:text-slate-900'\n              }`}\n            >\n              TOÀN CỤM\n            </button>\n          </div>\n\n          {/* View Modes */}\n          <div className=\"flex rounded-xl bg-slate-100 p-1 text-xs font-bold shadow-inner\">\n            <button\n              onClick={() => setDisplayMode('SUMMARY')}\n              className={`px-3 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                displayMode === 'SUMMARY' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600'\n              }`}\n            >\n              📊 Tổng Quan\n            </button>\n            <button\n              onClick={() => setDisplayMode('TABLE')}\n              className={`px-3 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                displayMode === 'TABLE' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600'\n              }`}\n            >\n              📋 Bảng DT\n            </button>\n            <button\n              onClick={() => setDisplayMode('CARDS')}\n              className={`px-3 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                displayMode === 'CARDS' ? 'bg-white shadow-xs text-blue-600' : 'text-slate-600'\n              }`}\n            >\n              🃏 Thẻ Chi Tiết\n            </button>\n          </div>\n\n          {/* Cards Column Config */}\n          {displayMode === 'CARDS' && (\n            <div className=\"flex items-center gap-1 rounded-xl bg-slate-100 p-1 text-xs font-bold shadow-inner\">\n              <span className=\"px-2 text-slate-500 hidden xl:inline\">Cột:</span>\n              <button\n                onClick={() => setCardCols(1)}\n                className={`px-2.5 py-1.5 rounded-lg transition cursor-pointer ${\n                  cardCols === 1 ? 'bg-white shadow-xs text-blue-600 font-bold' : 'text-slate-600'\n                }`}\n              >\n                1\n              </button>\n              <button\n                onClick={() => setCardCols(2)}\n                className={`px-2.5 py-1.5 rounded-lg transition cursor-pointer ${\n                  cardCols === 2 ? 'bg-white shadow-xs text-blue-600 font-bold' : 'text-slate-600'\n                }`}\n              >\n                2\n              </button>\n              <button\n                onClick={() => setCardCols(3)}\n                className={`px-2.5 py-1.5 rounded-lg transition cursor-pointer ${\n                  cardCols === 3 ? 'bg-white shadow-xs text-blue-600 font-bold' : 'text-slate-600'\n                }`}\n              >\n                3\n              </button>\n              <button\n                onClick={() => setIsExpandAllPrograms(!isExpandAllPrograms)}\n                className={`ml-1 px-2.5 py-1.5 rounded-lg transition cursor-pointer font-bold ${\n                  isExpandAllPrograms ? 'bg-indigo-600 text-white shadow-xs' : 'bg-white text-slate-700 shadow-xs'\n                }`}\n                title=\"Bấm để mở rộng tất cả môn thi đua không bị cuộn\"\n              >\n                {isExpandAllPrograms ? '📖 Thu gọn' : '📜 Xem đủ môn'}\n              </button>\n              <button\n                type=\"button\"\n                onClick={() => void handleExportAllEmployeeCards()}\n                disabled={isBulkExporting}\n                className={`ml-1 px-3 py-1.5 rounded-lg transition cursor-pointer font-black text-[11px] flex items-center gap-1.5 ${\n                  isBulkExporting ? 'bg-slate-200 text-slate-500 cursor-wait' : 'bg-blue-600 text-white hover:bg-blue-700 shadow-xs'\n                }`}\n                title=\"Xuất toàn bộ thẻ nhân viên đang hiển thị thành các ảnh PNG riêng trong một file ZIP\"\n              >\n                <Camera className=\"w-3.5 h-3.5\" />\n                {isBulkExporting ? 'Đang xuất...' : `📦 Xuất tất cả ảnh (${aggregatedEmployees.length})`}\n              </button>\n            </div>\n          )}\n\n          <div className=\"relative w-36 sm:w-44\">\n            <input\n              type=\"text\"\n              value={searchTerm}\n              onChange={(e) => setSearchTerm(e.target.value)}\n              placeholder=\"🔍 Tìm nhân viên...\"\n              className=\"w-full text-xs px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none\"\n            />\n          </div>\n\n          {onOpenPersonnelSettings && (\n            <button\n              onClick={onOpenPersonnelSettings}\n              className=\"flex items-center gap-1.5 px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-bold text-xs rounded-xl shadow-2xs transition cursor-pointer\"\n              title=\"Mở giao diện Cài đặt Nhân sự & KPI\"\n            >\n              <span>⚙️ QL Nhân sự</span>\n            </button>\n          )}\n\n          <button\n            onClick={onOpenQuickUpload}\n            className=\"flex items-center gap-1.5 px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-xs transition cursor-pointer\"\n          >\n            <Plus className=\"w-3.5 h-3.5\" />\n            <span>Nạp Data NV</span>\n          </button>\n        </div>\n      </div>\n\n      {/* 2. Biểu Đồ Rõ Ràng */}\n      {isChartVisible && (\n        <div className=\"bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-2\">\n          <div className=\"flex items-center justify-between pb-1 border-b border-slate-100\">\n            <div>\n              <h4 className=\"font-extrabold text-slate-900 text-xs uppercase flex items-center gap-1.5\">\n                <span>📈 Biểu Đồ Doanh Thu & DT Quy Đổi Từng Nhân Viên</span>\n              </h4>\n              <p className=\"text-[10.5px] text-slate-400\">\ emp, index) => {\n            const rank = index + 1;\n            let rankBadgeClass = 'bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded-lg text-xs';\n            let cardBorderClass = 'border-slate-200';\n            if (rank === 1) {\n              rankBadgeClass = 'bg-amber-400 text-amber-950 font-black px-2.5 py-0.5 rounded-lg text-xs shadow-xs';\n              cardBorderClass = 'border-amber-300 ring-2 ring-amber-100/60';\n            } else if (rank === 2) {\n              rankBadgeClass = 'bg-slate-200 text-slate-800 font-bold px-2.5 py-0.5 rounded-lg text-xs';\n            } else if (rank === 3) {\n              rankBadgeClass = 'bg-amber-100 text-amber-900 font-bold px-2.5 py-0.5 rounded-lg text-xs';\n            }\n\n            const weakList = emp.programs\n              .filter(p => p.pctLk < 30)\n              .map(p => `${p.displayName} (${p.pctLk.toFixed(1)}%)`);\n            const alertText =\n              weakList.length > 0 ? weakList.join(', ') : 'Đang hoàn thành tốt tất cả các môn';\n\n            return (\n              <div\n                key={index}\n                data-employee-card=\"true\"\n                className={`bg-white rounded-2xl border ${cardBorderClass} p-4 shadow-xs relative overflow-hidden flex flex-col justify-between hover:shadow-md transition ${\n                  !emp.isVisible ? 'opacity-65 ring-1 ring-rose-200 bg-rose-50/20' : ''\n                }`}\n              >\n                <div className=\"flex items-start justify-between pb-2 border-b border-slate-100\">\n                  <div>\n                    <h4 className=\"font-bold text-slate-900 text-sm leading-snug flex items-center gap-1.5\">\n                      <span className={emp.isVisible ? '' : 'line-through text-slate-400'}>{emp.name}</span>\n                      <button\n                        type=\"button\"\n                        onClick={() => handleToggleEmployeeOfficial(emp.name, emp.store)}\n                        className={`px [9px] font-bold uppercase text-slate-400 block tracking-wider\">\n                      DOANH THU\n                    </span>\n                    <span className=\"text-sm font-black text-slate-800 block leading-tight mt-0.5\">\n                      {formatCurrency(emp.totalDt, 1)}\n                    </span>\n                  </div>\n                  <div className=\"bg-indigo-50/70 border border-indigo-200 rounded-xl p-2 text-center\">\n                    <span className=\"text-[9px] font-black uppercase text-indigo-700 block tracking-wider\">\n                      DT QUY ĐỔI\n                    </span>\n                    <span className=\"text-base font-black text-indigo-600 block leading-tight mt-0.5\">\n                      {formatCurrency(emp.totalDtQd, 1)}\n                    </span>\n                  </div>\n                  <div className=\"bg-slate-50 border border-slate-100 rounded-xl p-2 text-center\">\n                    <span className=\"text-[9px] font-bold uppercase text-slate-400 block tracking-wider\">\n                      KPI / ĐÓNG GÓP\n                    </span>\n                    <span className=\"text-sm font-black text-rose-600 block leading-tight mt-0.5\">\n                      {emp.diemKpi.toFixed(1)}đ\n                    </span>\n                  </div>\n                </div>\n\n                <div className=\"text-[10.5px] text-slate-500 text-center pb-2 border-b border-slate-100\">\n                  ĐT: <b className=\"text-slate-700 font-mono\">{emp.dtDiem.toFixed(1)}đ</b> • HQ:{' '}\n                  <b className=\"text-slate-700 font-mono\">{emp.hqDiem.toFixed(1)}đ</b> (Hiệu quả QĐ{' '}\n                  <b className=\"text-slate-700 font-mono\">{emp.hieuQuaQd.toFixed(1)}%</b>)\n                </div>\n\n                {/* Discipline list with CSS Grid */}\n                <div className=\"card-programs-container max-h-[350px] overflow-y-auto custom-scroll pt-1\">\n                  <div className=\"w-full
