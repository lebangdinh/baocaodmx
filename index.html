assName=\"flex items-center space-x-1 px-3 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 text-xs font-bold transition cursor-pointer\"\n            title=\"Mở Trợ Lý Đánh Giá AI\"\n          >\n            <Bot className=\"w-3.5 h-3.5 text-emerald-600\" />\n            <span className=\"hidden md:inline\">Đánh Giá AI</span>\n          </button>\n        )}\n\n        {onOpenSessionManager && (\n          <button\n            onClick={onOpenSessionManager}\n            className=\"flex items-center space-x-1 px-2.5 py-1.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-xs font-semibold text-slate-700 transition cursor-pointer\"\n            title=\"Quản lý sao lưu & khôi phục phiên làm việc\"\n          >\n            <History className=\"w-3.5 h-3.5 text-slate-500\" />\n            <span className=\"hidden lg:inline\">Phiên làm việc</span>\n          </button>\n        )}\n\n        {onOpenClearSession && (\n          <button\n            onClick={onOpenClearSession}\n            className=\"flex items-center space-x-1.5 px-2.5 py-1.5 rounded-xl border border-rose-200 bg-rose-50/70 hover:bg-rose-100 text-rose-700 text-xs font-bold transition cursor-pointer\"\n            title=\"Xóa toàn bộ data đang lưu trong phiên\"\n          >\n            <Trash2 className=\"w-3.5 h-3.5 text-rose-600\" />\n            <span className=\"hidden xl:inline\">Xóa Data Phiên</span>\n          </button>\n        )}\n\n        {onOpenSettings && (\n          <button\n            onClick={onOpenSettings}\n            className=\"p-1.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-600 transition cursor-pointer\"\n            title=\"Cài đặt hệ thống\"\n          >\n            <Settings className=\"w-4 h-4\" />\n          </button>\n        )}\n\n        {onOpenDownloads && screenshotCount > 0 && (\n          <button\n            onClick={onOpenDownloads}\n            className=\"flex items-center space-x-1.5 px-2.5 py-1.5 rounded-xl border border-blue-200 bg-blue-50/70 hover:bg-blue-100 text-blue-800 text-xs font-bold transition cursor-pointer\"\n            title=\"Xem danh sách ảnh báo cáo đã xuất\"\n          >\n            <Images className=\"w-3.5 h-3.5 text-blue-600\" />\n            <span className=\"hidden sm:inline\">Kho ảnh</span>\n            <span className=\"w-4 h-4 rounded-full bg-blue-600 text-white text-[10px] flex items-center justify-center font-bold\">\n              {screenshotCount}\n            </span>\n          </button>\n        )}\n\n        {onExportTab && (\n          <button\n            onClick={onExportTab}\n            disabled={isExporting}\n            className=\"flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white text-xs font-bold shadow-xs hover:shadow-blue-500/25 transition cursor-pointer\"\n            title=\"Chụp ảnh tab đang hiển thị\"\n          >\n            {isExporting ? <Loader2 className=\"w-3.5 h-3.5 animate-spin\" /> : <Camera className=\"w-3.5 h-3.5\" />}\n            <span>{isExporting ? 'Đang xuất...' : 'Xuất Ảnh'}</span>\n          </button>\n        )}\n      </div>\n    </header>\n  );\n};\n","src/components/ImageExportModal.tsx":"import React, { useState } from 'react';\nimport { X, Download, Copy, Check, ExternalLink, Camera, Image as ImageIcon } from 'lucide-react';\nimport { downloadImage, copyImageToClipboard } from '../utils/imageExporter';\n\ninterface ImageExportModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  imageResult: {\n    dataUrl: string;\n    blob: Blob;\n    fileName: string;\n  } | null;\n}\n\nexport const ImageExportModal: React.FC<ImageExportModalProps> = ({\n  isOpen,\n  onClose,\n  imageResult,\n}) => {\n  const [copied, setCopied] = useState<boolean>(false);\n\n  if (!isOpen || !imageResult) return null;\n\n  const handleDownload = () => {\n    downloadImage(imageResult.blob, imageResult.fileName);\n  };\n\n  const handleCopy = async () => {\n    const ok = await copyImageToClipboard(imageResult.blob);\n    if (ok) {\n      setCopied(true);\n      setTimeout(() => setCopied(false), 2500);\n    } else {\n      // Fallback: copy as dataURL if binary clipboard is not supported\n      try {\n        await navigator.clipboard.writeText(imageResult.dataUrl);\n        setCopied(true);\n        setTimeout(() => setCopied(false), 2500);\n      } catch (err) {\n        console.error('Clipboard copy failed:', err);\n      }\n    }\n  };\n\n  const handleOpenInNewTab = () => {\n    try {\n      const blobUrl = URL.createObjectURL(imageResult.blob);\n      window.open(blobUrl, '_blank');\n    } catch (err) {\n      const win = window.open();\n      if (win) {\n        win.document.write(`<img src=\"${imageResult.dataUrl}\" style=\"max-width:100%\" />`);\n      }\n    }\n  };\n\n  return (\n    <div\n      className=\"fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-5\"\n      onClick={(e) => {\n        if (e.target === e.currentTarget) onClose();\n      }}\n    >\n      <div className=\"bg-white rounded-3xl shadow-2xl max-w-2xl w-full p-5 sm:p-6 border border-slate-200 space-y-4 animate-fadeIn flex flex-col max-h-[90vh]\">\n        {/* Header */}\n        <div className=\"flex items-center justify-between pb-3 border-b border-slate-100 flex-shrink-0\">\n          <div className=\"flex items-center space-x-2.5\">\n            <div className=\"w-8 h-8 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold\">\n              <Camera className=\"w-4 h-4\" />\n            </div>\n            <div>\n              <h3 className=\"font-black text-slate-900 text-sm\">Xuất Ảnh Báo Cáo Thành Công!</h3>\n              <p className=\"text-[11px] text-slate-500 font-medium truncate max-w-xs sm:max-w-md\">\n                {imageResult.fileName}\n              </p>\n            </div>\n          </div>\n          <button\n            onClick={onClose}\n            className=\"p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition cursor-pointer\"\n          >\n            <X className=\"w-5 h-5\" />\n          </button>\n        </div>\n\n        {/* Image Preview Box */}\n        <div className=\"flex-1 min-h-0 overflow-y-auto custom-scroll rounded-2xl border border-slate-200 bg-slate-50 p-2 flex items-center justify-center\">\n          <img\n            src={imageResult.dataUrl}\n            alt={imageResult.fileName}\n            className=\"max-w-full max-h-[50vh] object-contain rounded-xl shadow-xs border border-slate-200\"\n          />\n        </div>\n\n        {/* Action Controls */}\n        <div className=\"flex-shrink-0 space-y-3 pt-1\">\n          <div className=\"flex flex-wrap items-center justify-between gap-2\">\n            <div className=\"flex items-center gap-2\">\n              <button\n                onClick={handleCopy}\n                className=\"px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition flex items-center gap-1.5 cursor-pointer\"\n                title=\"Sao chép ảnh để dán thẳng vào Zalo, Viber, PowerPoint...\"\n              >\n                {copied ? <Check className=\"w-4 h-4 text-emerald-600\" /> : <Copy className=\"w-4 h-4\" />}\n                <span>{copied ? 'Đã sao chép ảnh!' : 'Sao chép ảnh (Copy)'}</span>\n              </button>\n\n              <button\n                onClick={handleOpenInNewTab}\n                className=\"px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition flex items-center gap-1.5 cursor-pointer\"\n                title=\"Mở ảnh kích thước đầy đủ trong tab mới\"\n              >\n                <ExternalLink className=\"w-3.5 h-3.5\" />\n                <span className=\"hidden sm:inline\">Mở tab mới</span>\n              </button>\n            </div>\n\n            <div className=\"flex items-center gap-2\">\n              <button\n                onClick={handleDownload}\n                className=\"px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-xs transition flex items-center gap-1.5 cursor-pointer\"\n              >\n                <Download className=\"w-4 h-4\" />\n                <span>Tải Ảnh Về Máy (.PNG)</span>\n              </button>\n              <button\n                onClick={onClose}\n                className=\"px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs transition cursor-pointer\"\n              >\n                Đóng\n              </button>\n            </div>\n          </div>\n\n          <p className=\"text-[11px] text-slate-500 text-center\">\n            💡 <b>Mẹo:</b> Bạn có thể bấm <b>Sao chép ảnh</b> rồi nhấn <code>Ctrl + V</code> để gửi ngay vào tin nhắn Zalo / Nhóm bán hàng!\n          </p>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/components/ProgramDetailModal.tsx":"import { SortableTable } from './SortableTable';\nimport React, { useRef, useState } from 'react';\nimport { Camera, X, CheckCircle, AlertCircle, Clock, Loader2 } from 'lucide-react';\nimport { captureElement, downloadImage } from '../utils/imageExporter';\nimport { formatCurrency, formatInt, formatPercent, formatProgramName, cleanCode, cleanProgName } from '../utils/formatters';\nimport { AppDataState, PersonnelConfigMap } from '../types';\nimport { getPersonnelAllocationPct } from '../utils/stretchGoal';\n\nexport interface StaffSellingDetail {\n  name: string;\n  id: string;\n  sl: number;\n  dtThuc: number;\n  dtQd: number;\n  empTarget: number;\n  pctLk: number;\n  pctDu: number;\n  isDone: boolean;\n}\n\ninterface ProgramDetailModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  storeKey?: string;\n  programCode?: string | number;\n  programName?: string;\n  appData?: AppDataState;\n  personnelConfig?: PersonnelConfigMap;\n  onUpdatePersonnelConfig?: (cfg: PersonnelConfigMap) => void;\n  storeName?: string;\n  progCode?: string | number;\n  progName?: string;\n  loaiTd?: number;\n  shopThuc?: number;\n  shopTarget?: number;\n  shopPctLk?: number;\n  shopPctDu?: number;\n  staffList?: StaffSellingDetail[];\n  onSaveScreenshot?: (item: { name: string; url: string; time: string }) => void;\n}\n\nconst normalizeStoreKey = (value?: string) => {\n  const s = String(value || '').trim().toUpperCase();\n  if (s === 'TOPZONE' || s === 'AAR' || s === '10341' || s.includes('TOPZONE') || s.includes('AAR')) return 'TOPZONE';\n  return 'TGDD';\n};\n\nconst isStoreRow = (row: any, store: 'TGDD' | 'TOPZONE') => {\n  const code = cleanCode(row?.['MÃ ĐƠN VỊ'] || row?.['Mã đơn vị'] || row?.['MÃ ĐƠN VỊ'] || '');\n  const name = String(row?.['TÊN ĐƠN VỊ'] || row?.['ĐƠN VỊ / NHÂN VIÊN'] || row?.['Siêu thị'] || '').toUpperCase();\n  return store === 'TOPZONE'\n    ? code === '10341' || /TOPZONE|AAR/.test(name)\n    : code === '933' || /TGDĐ|TGDD|TGD\\b|THẾ GIỚI DI ĐỘNG/.test(name);\n};\n\nconst canonicalEmployeeName = (value: any) => {\n  const raw = String(value || '').trim();\n  return raw.replace(/^\\d{4,7}\\s*[-_–]\\s*/, '').trim();\n};\n\nexport const ProgramDetailModal: React.FC<ProgramDetailModalProps> = ({\n  isOpen,\n  onClose,\n  storeKey,\n  programCode,\n  programName,\n  appData,\n  personnelConfig,\n  onUpdatePersonnelConfig,\n  storeName: propStoreName,\n  progCode: propProgCode,\n  progName: propProgName,\n  loaiTd: propLoaiTd,\n  shopThuc: propShopThuc,\n  shopTarget: propShopTarget,\n  shopPctLk: propShopPctLk,\n  shopPctDu: propShopPctDu,\n  staffList: propStaffList,\n  onSaveScreenshot,\n}) => {\n  const cardRef = useRef<HTMLDivElement>(null);\n  const [isExporting, setIsExporting] = useState<boolean>(false);\n  const [isEmployeeVisibilityMenuOpen, setIsEmployeeVisibilityMenuOpen] = useState<boolean>(false);\n  // Ẩn/hiện CHỈ áp dụng cho bảng của từng môn thi đua (khóa theo programKey),\n  // để bấm ẩn ở môn này không còn làm ẩn nhầm sang bảng của môn khác.\n  const [hiddenEmployeeKeysByProgram, setHiddenEmployeeKeysByProgram] = useState<Record<string, Record<string, boolean>>>({});\n  // Chế độ ẩn: LOCAL = chỉ ẩn ở bảng môn đang xem; GLOBAL = ẩn nhân viên này ở TẤT CẢ các bảng.\n  const [hideScope, setHideScope] = useState<'LOCAL' | 'GLOBAL'>('LOCAL');\n\n  if (!isOpen) return null;\n\n  const effectiveStore = storeKey || propStoreName || 'TGDĐ';\n  const storeType = normalizeStoreKey(effectiveStore);\n  const isTopZone = storeType === 'TOPZONE';\n  const effectiveCode = programCode !== undefined ? programCode : propProgCode;\n  const effectiveName = programName || propProgName || 'Chi tiết môn thi đua';\n\n  let computedLoaiTd = propLoaiTd || 3;\n  let computedShopThuc = propShopThuc || 0;\n  let computedShopTarget = propShopTarget || 0;\n  let computedPctLk = propShopPctLk || 0;\n  let computedPctDu = propShopPctDu || 0;\n  let computedStaffList: StaffSellingDetail[] = propStaffList || [];\n\n  if (appData) {\n    const codeStr = effectiveCode !== undefined && effectiveCode !== null ? cleanCode(effectiveCode) : '';\n    const nameClean = cleanProgName(effectiveName || '');\n    const isProgMatch = (r: any) => {\n      const rCode = cleanCode(r?.['MÃ CHƯƠNG TRÌNH']);\n      const rName = cleanProgName(r?.['CHƯƠNG TRÌNH'] || '');\n      // When a program code exists, it is the canonical key. Do not fall back to\n      // another store's row just because the program name happens to match.\n      if (codeStr && rCode) return rCode === codeStr;\n      // Không dùng includes: các môn như \"TABLET ANDROID\" và\n      // \"ĐIỆN THOẠI & TABLET ANDROID\" là 2 chương trình hoàn toàn khác nhau.\n      return !!nameClean && rName === nameClean;\n    };\n\n    // Find the program ONLY inside the selected store.\n    const tdRow = (appData.td_luyke || []).find((r: any) => isStoreRow(r, storeType) && isProgMatch(r));\n\n    if (tdRow) {\n      computedLoaiTd = Number(tdRow['LOẠI TĐ']) || 3;\n      computedShopTarget = Number(tdRow['TARGET (TR/SL theo LOẠI TĐ)']) || 0;\n      computedShopThuc = (computedLoaiTd === 2 || computedLoaiTd === 6)\n        ? (Number(tdRow['SỐ LƯỢNG']) || 0)\n        : (Number(tdRow['DT QUY ĐỔI (TR)']) || Number(tdRow['DOANH THU (TR)']) || 0);\n      computedPctLk = Number(tdRow['% HT THÁNG']) || 0;\n      computedPctDu = Number(tdRow['% DỰ BÁO']) || 0;\n    }\n\n    // Không phụ thuộc vào việc parser đã xếp dòng vào nv_tgdd hay nv_tz.\n    // BI employee row có MÃ ĐƠN VỊ/TÊN ĐƠN VỊ là nguồn sự thật để xác định shop.\n    // Điều này cũng sửa trường hợp dữ liệu trước đó bị xếp nhầm 933 <-> 10341.\n    const nvSource = [\n      ...(appData.nv_tgdd || []),\n      ...(appData.nv_tz || []),\n    ].filter((r: any) => isStoreRow(r, storeType));\n    const resolvedProgCode = tdRow ? cleanCode(tdRow['MÃ CHƯƠNG TRÌNH']) : codeStr;\n\n    // Quan trọng: mỗi lần bấm một môn phải lọc đúng MÔN đó.\n    // Không dùng danh sách nhân sự cấu hình để loại dòng BI, vì một nhân viên\n    // có thể hỗ trợ chéo giữa TGDĐ/TopZone và BI vẫn phải được tôn trọng.\n    const filteredStaff = nvSource.filter((r: any) => {\n      const rCode = cleanCode(r?.['MÃ CHƯƠNG TRÌNH']);\n      const rName = cleanProgName(r?.['CHƯƠNG TRÌNH'] || '');\n\n      // Nếu cả hai bên có mã chương trình thì mã là khóa chính.\n      if (resolvedProgCode && rCode) return rCode === resolvedProgCode;\n\n      // BI hiện tại của anh không có MÃ CHƯƠNG TRÌNH ở bảng nhân viên,\n      // nên bắt buộc đối chiếu theo TÊN MÔN chính xác (không includes).\n      if (nameClean && rName) return rName === nameClean;\n      return false;\n    });\n\n    if (filteredStaff.length > 0) {\n      const seen = new Set<string>();\n      computedStaffList = filteredStaff\n        .map((r: any) => {\n          const empNameRaw = String(r?.['ĐƠN VỊ / NHÂN VIÊN'] || r?.['TÊN NHÂN VIÊN'] || '').trim();\n          const empName = canonicalEmployeeName(empNameRaw);\n          const empId = cleanCode(r?.['MÃ NV'] || r?.['MÃ NHÂN VIÊN'] || '');\n          const key = empId ? `id:${empId}` : `name:${empName.toLowerCase()}`;\n          if (seen.has(key)) return null;\n          seen.add(key);\n\n          const sl = Number(r?.['SỐ LƯỢNG']) || 0;\n          const dtThuc = Number(r?.['DOANH THU (TR)']) || 0;\n          const dtQd = Number(r?.['DT QUY ĐỔI (TR)']) || dtThuc;\n          const empLoai = Number(r?.['LOẠI TĐ']) || computedLoaiTd;\n          const isQuantity = empLoai === 2 || empLoai === 6;\n\n          const cfgMap = personnelConfig?.[storeType] || {};\n          const officialStaffCount = Object.values(cfgMap).filter((cfg: any) => cfg?.isOfficial === true).length;\n          const staffCount = officialStaffCount > 0\n            ? officialStaffCount\n            : (storeType === 'TGDD' ? 4 : 6);\n          // TARGET CÁ NHÂN = TARGET MÔN SHOP × TỶ LỆ TARGET NHÂN VIÊN.\n          // Target môn shop ở đây đã được lấy bằng tên chương trình chính xác,\n          // nên TABLET ANDROID sẽ không thể nhầm với ĐIỆN THOẠI & TABLET ANDROID.\n          const allocationTotalPct = getPersonnelAllocationPct(storeType);\n          const employeeName = canonicalEmployeeName(r?.['TÊN NHÂN VIÊN'] || r?.['NHÂN VIÊN'] || '');\n          const employeeCfg = cfgMap[employeeName] || cfgMap[String(r?.['MÃ NHÂN VIÊN'] || '').trim()] || {};\n          const effectiveSharePct = allocationTotalPct != null && employeeCfg?.isOfficial !== false\n            ? (Number(employeeCfg?.targetPct) || (allocationTotalPct / staffCount))\n            : (allocationTotalPct != null ? allocationTotalPct / staffCount : 100 / staffCount);\n          let empTarget = computedShopTarget > 0\n            ? Math.round((computedShopTarget * effectiveSharePct / 100) * 10) / 10\n            : (Number(r?.['TARGET']) || Number(r?.['TARGET (TR/SL theo LOẠI TĐ)']) || 0);\n\n          const currentAchieved = isQuantity ? sl : (dtQd || dtThuc);\n          const pctLk = empTarget > 0\n            ? (currentAchieved / empTarget) * 100\n            : (Number(r?.['% LŨY KẾ']) || 0);\n          const pctDu = Number(r?.['% DỰ BÁO']) || (pctLk * 1.2);\n\n          return {\n            name: empName || empNameRaw,\n            id: empId,\n            sl,\n            dtThuc,\n            dtQd,\n            empTarget,\n            pctLk,\n            pctDu,\n            isDone: pctLk >= 100,\n          } as StaffSellingDetail;\n        })\n        .filter(Boolean) as StaffSellingDetail[];\n    }\n  }\n\n  const isQty = computedLoaiTd === 2 || computedLoaiTd === 6;\n  const employeeKey = (emp: StaffSellingDetail) => emp.id ? `id:${emp.id}` : `name:${emp.name.toLowerCase()}`;\n  // Khóa riêng cho từng bảng theo môn + shop, để hiddenEmployeeKeysByProgram không lẫn giữa các môn.\n  const programKey = `${storeType}::${effectiveCode || cleanProgName(effectiveName || '')}`;\n  const hiddenEmployeeKeys = hiddenEmployeeKeysByProgram[programKey] || {};\n\n  const isGloballyHiddenEmployee = (emp: StaffSellingDetail) => {\n    const cfgMap = personnelConfig?.[storeType] || {};\n    const cfg = cfgMap[emp.name] || (emp.id ? cfgMap[emp.id] : undefined) || {};\n    return cfg.isVisible === false;\n  };\n\n  const isEmployeeVisible = (emp: StaffSellingDetail) => !hiddenEmployeeKeys[employeeKey(emp)] && !isGloballyHiddenEmployee(emp);\n\n  const visibleStaffList = computedStaffList.filter(isEmployeeVisible);\n  const hiddenEmployeeCount = computedStaffList.length - visibleStaffList.length;\n  const allEmployeesVisible = hiddenEmployeeCount === 0;\n  const totalAchieved = visibleStaffList.reduce((sum, emp) => sum + (isQty ? emp.sl : (emp.dtQd || emp.dtThuc)), 0);\n  const totalTarget = visibleStaffList.reduce((sum, emp) => sum + emp.empTarget, 0);\n  const totalGap = Math.max(0, totalTarget - totalAchieved);\n  const doneCount = visibleStaffList.filter(emp => emp.pctLk >= 100).length;\n  const needRunCount = visibleStaffList.filter(emp => emp.pctLk < 100).length;\n\n  const setEmployeeHiddenInThisProgram = (emp: StaffSellingDetail, hidden: boolean) => {\n    const key = employeeKey(emp);\n    setHiddenEmployeeKeysByProgram(prev => {\n      const currentForProgram = { ...(prev[programKey] || {}) };\n      if (hidden) currentForProgram[key] = true;\n      else delete currentForProgram[key];\n      return { ...prev, [programKey]: currentForProgram };\n    });\n  };\n\n  const setEmployeeHiddenGlobally = (emp: StaffSellingDetail, hidden: boolean) => {\n    if (!onUpdatePersonnelConfig) return;\n    const next: PersonnelConfigMap = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[storeType]) next[storeType] = {};\n    if (!next[storeType][emp.name]) next[storeType][emp.name] = {};\n    next[storeType][emp.name].isVisible = !hidden;\n    onUpdatePersonnelConfig(next);\n  };\n\n  const toggleEmployeeVisibility = (emp: StaffSellingDetail) => {\n    const currentlyVisible = isEmployeeVisible(emp);\n    if (currentlyVisible) {\n      // Đang hiện -> ẩn theo phạm vi đang chọn (chỉ bảng này, hoặc toàn bộ các bảng).\n      if (hideScope === 'GLOBAL') {\n        setEmployeeHiddenGlobally(emp, true);\n      } else {\n        setEmployeeHiddenInThisProgram(emp, true);\n      }\n    } else {\n      // Đang ẩn -> bấm hiện lại thì hiện ở khắp nơi, bất kể trước đó bị ẩn theo phạm vi nào.\n      setEmployeeHiddenInThisProgram(emp, false);\n      if (isGloballyHiddenEmployee(emp)) setEmployeeHiddenGlobally(emp, false);\n    }\n  };\n\n  const setAllEmployeesVisibility = (visible: boolean) => {\n    if (visible) {\n      setHiddenEmployeeKeysByProgram(prev => ({ ...prev, [programKey]: {} }));\n      if (onUpdatePersonnelConfig) {\n        const next: PersonnelConfigMap = JSON.parse(JSON.stringify(personnelConfig || {}));\n        if (!next[storeType]) next[storeType] = {};\n        computedStaffList.forEach(emp => {\n          if (isGloballyHiddenEmployee(emp)) {\n            if (!next[storeType][emp.name]) next[storeType][emp.name] = {};\n            next[storeType][emp.name].isVisible = true;\n          }\n        });\n        onUpdatePersonnelConfig(next);\n      }\n      return;\n    }\n    if (hideScope === 'GLOBAL' && onUpdatePersonnelConfig) {\n      const next: PersonnelConfigMap = JSON.parse(JSON.stringify(personnelConfig || {}));\n      if (!next[storeType]) next[storeType] = {};\n      computedStaffList.forEach(emp => {\n        if (!next[storeType][emp.name]) next[storeType][emp.name] = {};\n        next[storeType][emp.name].isVisible = false;\n      });\n      onUpdatePersonnelConfig(next);\n    } else {\n      const nextForProgram: Record<string, boolean> = {};\n      computedStaffList.forEach(emp => { nextForProgram[employeeKey(emp)] = true; });\n      setHiddenEmployeeKeysByProgram(prev => ({ ...prev, [programKey]: nextForProgram }));\n    }\n  };\n\n  const handleExportImage = async () => {\n    if (!cardRef.current || isExporting) return;\n    setIsExporting(true);\n    try {\n      const cleanName = String(effectiveName || 'Mon_Thi_Dua').replace(/[^a-zA-Z0-9_]/g, '_');\n      const filename = `Chi_Tiet_Mon_${cleanName}_${new Date().toISOString().slice(0, 10)}.png`;\n      const result = await captureElement(cardRef.current, {\n        fileName: filename,\n        backgroundColor: '#ffffff',\n        scale: 2,\n      });\n      if (onSaveScreenshot) {\n        onSaveScreenshot({ name: result.fileName, url: result.dataUrl, time: new Date().toLocaleTimeString('vi-VN') });\n      }\n      downloadImage(result.blob, result.fileName);\n    } catch (err) {\n      console.error('Export detail error:', err);\n    } finally {\n      setIsExporting(false);\n    }\n  };\n\n  return (\n    <div\n      className=\"fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-5 overflow-y-auto\"\n      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}\n    >\n      <div ref={cardRef} className=\"bg-white rounded-3xl shadow-2xl max-w-5xl w-full p-5 sm:p-6 border border-slate-200 space-y-4 my-auto animate-fadeIn\">\n        <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100\">\n          <div className=\"flex items-center space-x-3 min-w-0\">\n            <span className=\"px-2.5 py-1 bg-blue-600 text-white font-mono font-black text-xs rounded-xl shadow-xs shrink-0\">Mã {effectiveCode || '---'}</span>\n            <div className=\"min-w-0\">\n              <div className=\"flex items-center gap-2 flex-wrap\">\n                <h3 className=\"font-black text-slate-900 text-base uppercase tracking-tight truncate\">{formatProgramName(effectiveName)}</h3>\n                <span className=\"px-2.5 py-0.5 rounded-lg text-[10.5px] font-extrabold bg-amber-100 text-amber-900 shrink-0\">\n                  {isTopZone ? 'AAR / TopZone (10341)' : 'TGD NHT (933)'}\n                </span>\n              </div>\n              <p className=\"text-xs text-slate-500 font-medium\">Chi tiết nhân sự bán hàng & tiến độ hoàn thành môn</p>\n            </div>\n          </div>\n          <div className=\"flex items-center gap-2 shrink-0\">\n            <div className=\"relative no-export\">\n              <button\n                type=\"button\"\n                onClick={() => setIsEmployeeVisibilityMenuOpen(v => !v)}\n                className={`px-3.5 py-2 font-bold text-xs rounded-xl shadow-xs transition flex items-center gap-1.5 cursor-pointer border ${hiddenEmployeeCount > 0 ? 'bg-blue-600 hover:bg-blue-700 text-white border-blue-600' : 'bg-white hover:bg-slate-50 text-slate-700 border-slate-200'}`}\n                title=\"Chọn từng nhân viên để ẩn/hiện\"\n              >\n                <span className=\"text-sm leading-none\">◉</span>\n                <span>Ẩn/Hiện NV{hiddenEmployeeCount > 0 ? ` (${hiddenEmployeeCount})` : ''}</span>\n              </button>\n              {isEmployeeVisibilityMenuOpen && (\n                <>\n                  <button type=\"button\" aria-label=\"Đóng danh sách nhân viên\" className=\"fixed inset-0 z-40 cursor-default\" onClick={() => setIsEmployeeVisibilityMenuOpen(false)} />\n                  <div className=\"absolute right-0 top-full mt-2 z-50 w-72 max-w-[calc(100vw-2rem)] rounded-2xl bg-white border border-slate-200 shadow-xl p-2\">\n                    <div className=\"flex items-center justify-between gap-2 px-2 py-1.5 border-b border-slate-100\">\n                      <div>\n                        <div className=\"text-xs font-black text-slate-800\">Hiển thị nhân viên</div>\n                        <div className=\"text-[10px] text-slate-400\">Bỏ chọn người nào thì người đó sẽ ẩn khỏi bảng.</div>\n                      </div>\n                      <button type=\"button\" onClick={() => setAllEmployeesVisibility(!allEmployeesVisible)} className=\"text-[10px] font-black text-blue-600 hover:text-blue-700 whitespace-nowrap\">{allEmployeesVisible ? 'Ẩn tất cả' : 'Hiện tất cả'}</button>\n                    </div>\n                    <div className=\"px-2 pt-2 pb-1\">\n                      <div className=\"text-[9.5px] font-bold text-slate-400 uppercase mb-1\">Phạm vi khi bấm ẩn</div>\n                      <div className=\"grid grid-cols-2 gap-1.5\">\n                        <button\n                          type=\"button\"\n                          onClick={() => setHideScope('LOCAL')}\n                          className={`px-2 py-1.5 rounded-lg text-[10px] font-black border transition cursor-pointer ${hideScope === 'LOCAL' ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}`}\n                          title=\"Chỉ ẩn nhân viên này ở bảng của môn đang xem\"\n                        >\n                          Chỉ bảng này\n                        </button>\n                        <button\n                          type=\"button\"\n                          onClick={() => setHideScope('GLOBAL')}\n                          className={`px-2 py-1.5 rounded-lg text-[10px] font-black border transition cursor-pointer ${hideScope === 'GLOBAL' ? 'bg-rose-600 border-rose-600 text-white' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}`}\n                          title=\"Ẩn nhân viên này ở TẤT CẢ các bảng môn thi đua\"\n                        >\n                          Toàn bộ các bảng\n                        </button>\n                      </div>\n                    </div>\n                    <div className=\"max-h-72 overflow-y-auto custom-scroll py-1\">\n                      {computedStaffList.map((emp) => {\n                        const key = employeeKey(emp);\n                        const visible = isEmployeeVisible(emp);\n                        const hiddenGlobally = isGloballyHiddenEmployee(emp);\n                        return (\n                          <label key={key} className=\"flex items-center gap-2 px-2 py-2 rounded-xl hover:bg-slate-50 cursor-pointer\">\n                            <input type=\"checkbox\" checked={visible} onChange={() => toggleEmployeeVisibility(emp)} className=\"w-4 h-4 accent-blue-600 cursor-pointer\" />\n                            <span className={`text-xs font-bold flex-1 ${visible ? 'text-slate-800' : 'text-slate-400 line-through'}`}>{emp.name}</span>\n                            {!visible && hiddenGlobally && <span className=\"text-[9px] font-black text-rose-500\" title=\"Đang ẩn ở tất cả các bảng\">Toàn bộ</span>}\n                            {emp.id && <span className=\"text-[9px] font-mono text-slate-400\">{emp.id}</span>}\n                          </label>\n                        );\n                      })}\n                    </div>\n                    <div className=\"px-2 pt-1.5 border-t border-slate-100 text-[10px] text-slate-400\">Đang hiển thị <b className=\"text-slate-700\">{visibleStaffList.length}/{computedStaffList.length}</b> nhân sự</div>\n                  </div>\n                </>\n              )}\n            </div>\n            <button onClick={() => { setIsEmployeeVisibilityMenuOpen(false); handleExportImage(); }} disabled={isExporting} className=\"px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-bold text-xs rounded-xl shadow-xs transition flex items-center gap-1.5 cursor-pointer\">\n              {isExporting ? <Loader2 className=\"w-3.5 h-3.5 animate-spin\" /> : <Camera className=\"w-3.5 h-3.5\" />}\n              <span>{isExporting ? 'Đang xuất...' : 'Xuất Ảnh'}</span>\n            </button>\n            <button onClick={onClose} className=\"px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs rounded-xl transition cursor-pointer\"><X className=\"w-4 h-4\" /></button>\n          </div>\n        </div>\n\n        <div className=\"grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-center\">\n          <div className=\"bg-slate-50 border border-slate-200 rounded-2xl p-2.5\">\n            <span className=\"text-[9.5px] text-slate-400 font-bold uppercase block\">THỰC ĐẠT SHOP</span>\n            <span className=\"text-base font-black text-slate-900 mt-0.5 block\">{isQty ? `${formatInt(computedShopThuc)} món` : `${formatCurrency(computedShopThuc)} TR`}</span>\n          </div>\n          <div className=\"bg-slate-50 border border-slate-200 rounded-2xl p-2.5\">\n            <span className=\"text-[9.5px] text-slate-400 font-bold uppercase block\">TARGET SHOP</span>\n            <span className=\"text-base font-black text-slate-700 mt-0.5 block\">{isQty ? `${formatInt(computedShopTarget)} món` : `${formatCurrency(computedShopTarget)} TR`}</span>\n          </div>\n          <div className=\"bg-blue-50/70 border border-blue-200 rounded-2xl p-2.5\">\n            <span className=\"text-[9.5px] text-blue-600 font-bold uppercase block\">% HOÀN THÀNH SHOP</span>\n            <span className=\"text-base font-black text-blue-700 mt-0.5 block\">{formatPercent(computedPctLk)}</span>\n          </div>\n          <div className=\"bg-emerald-50/70 border border-emerald-200 rounded-2xl p-2.5\">\n            <span className=\"text-[9.5px] text-emerald-600 font-bold uppercase block\">DỰ BÁO CHỐT SHOP</span>\n            <span className=\"text-base font-black text-emerald-700 mt-0.5 block\">{formatPercent(computedPctDu)}</span>\n          </div>\n        </div>\n\n        <div className=\"grid grid-cols-3 gap-2.5 text-center\">\n          <div className=\"rounded-2xl border border-slate-200 bg-white p-2.5\"><span className=\"block text-[9px] font-bold text-slate-400 uppercase\">Nhân sự</span><b className=\"text-lg text-slate-900\">{visibleStaffList.length}</b></div>\n          <div className=\"rounded-2xl border border-emerald-200 bg-emerald-50/60 p-2.5\"><span className=\"block text-[9px] font-bold text-emerald-600 uppercase\">Đã về số</span><b className=\"text-lg text-emerald-700\">{doneCount}</b></div>\n          <div className=\"rounded-2xl border border-rose-200 bg-rose-50/60 p-2.5\"><span className=\"block text-[9px] font-bold text-rose-600 uppercase\">Còn cần chạy</span><b className=\"text-lg text-rose-700\">{needRunCount}</b></div>\n        </div>\n\n        <div className=\"space-y-2 pt-1\">\n          <div className=\"flex items-center justify-between gap-3\">\n            <div>\n              <h4 className=\"font-extrabold text-slate-800 text-xs uppercase\">Bảng Chi Tiết Nhân Viên Bán Môn Này</h4>\n              <p className=\"text-[10px] text-slate-400 mt-0.5\">Đã lọc đúng theo <b>{isTopZone ? 'AAR / TopZone (10341)' : 'TGD NHT (933)'}</b> và mã môn.</p>\n            </div>\n            <span className=\"text-[11px] text-slate-500 font-medium shrink-0\">{visibleStaffList.length}/{computedStaffList.length} nhân sự</span>\n          </div>\n          <div className=\"overflow-x-auto custom-scroll max-h-[420px] border border-slate-200 rounded-2xl\">\n            <SortableTable className=\"w-full text-left text-xs border-collapse min-w-[920px]\">\n              <thead className=\"bg-slate-900 text-white font-bold text-[10.5px] sticky top-0 shadow-xs z-10\">\n                <tr>\n                  <th className=\"py-2.5 px-3 text-center w-10\">#</th>\n                  <th className=\"py-2.5 px-3\">MÃ NV</th>\n                  <th className=\"py-2.5 px-4\">TÊN NHÂN VIÊN</th>\n                  <th className=\"py-2.5 px-3 text-center\">SỐ LƯỢNG</th>\n                  <th className=\"py-2.5 px-3 text-right\">DT THỰC (TR)</th>\n                  <th className=\"py-2.5 px-3 text-right font-black text-indigo-300\">DT QĐ (TR)</th>\n                  <th className=\"py-2.5 px-3 text-right\">TARGET CÁ NHÂN</th>\n                  <th className=\"py-2.5 px-3 text-right text-rose-300\">CÒN THIẾU</th>\n                  <th className=\"py-2.5 px-3 text-center font-black\">% LK</th>\n                  <th className=\"py-2.5 px-3 text-center font-bold text-amber-300\">% DỰ BÁO</th>\n                  <th className=\"py-2.5 px-3 text-center\">TRẠNG THÁI</th>\n                </tr>\n              </thead>\n              <tbody className=\"divide-y divide-slate-100 font-semibold text-slate-700\">\n                {computedStaffList.length === 0 ? (\n                  <tr><td colSpan={11} className=\"py-8 text-center text-slate-400 font-medium\">Chưa ghi nhận số liệu nhân viên bán môn này.</td></tr>\n                ) : visibleStaffList.length === 0 ? (\n                  <tr><td colSpan={11} className=\"py-8 text-center text-slate-400 font-medium\">Đang ẩn toàn bộ nhân viên. Bấm <b>Ẩn/Hiện NV</b> để chọn người cần hiển thị.</td></tr>\n                ) : (\n                  visibleStaffList\n                    .slice()\n                    .sort((a, b) => a.pctLk - b.pctLk)\n                    .map((emp, idx) => {\n                      const achieved = isQty ? emp.sl : (emp.dtQd || emp.dtThuc);\n                      const gap = Math.max(0, emp.empTarget - achieved);\n                      let badge = <span className=\"px-2 py-0.5 rounded text-[10px] font-black bg-rose-100 text-rose-800\">Cần chạy</span>;\n                      if (emp.pctLk >= 100) badge = <span className=\"px-2 py-0.5 rounded text-[10px] font-black bg-emerald-100 text-emerald-800\">✓ Về Số</span>;\n                      else if (emp.pctDu >= 100) badge = <span className=\"px-2 py-0.5 rounded text-[10px] font-black bg-emerald-50 text-emerald-700 border border-emerald-300\">✓ Dự kiến đạt</span>;\n                      else if (emp.pctDu >= 80) badge = <span className=\"px-2 py-0.5 rounded text-[10px] font-black bg-amber-100 text-amber-800\">⚡ Gần Về</span>;\n                      return (\n                        <tr key={`${emp.id || emp.name}-${idx}`} className={`hover:bg-blue-50 transition border-b border-slate-100 ${emp.isDone ? 'bg-emerald-50/20' : ''}`}>\n                          <td className=\"py-2.5 px-3 text-center font-bold text-slate-500\">{idx + 1}</td>\n                          <td className=\"py-2.5 px-3 font-mono text-slate-400\">{emp.id || '—'}</td>\n                          <td className=\"py-2.5 px-4 font-bold text-slate-900\">{emp.name}</td>\n                          <td className=\"py-2.5 px-3 text-center font-mono font-bold\" data-sort-value={emp.sl}>{formatInt(emp.sl)}</td>\n                          <td className=\"py-2.5 px-3 text-right font-mono font-bold text-slate-800\" data-sort-value={emp.dtThuc}>{formatCurrency(emp.dtThuc)}</td>\n                          <td className=\"py-2.5 px-3 text-right font-mono font-black text-indigo-700 bg-indigo-50/40\" data-sort-value={emp.dtQd}>{formatCurrency(emp.dtQd)}</td>\n                          <td className=\"py-2.5 px-3 text-right font-mono text-slate-500\" data-sort-value={isQty ? (emp.empTarget) : (emp.empTarget)}>{isQty ? formatInt(emp.empTarget) : formatCurrency(emp.empTarget)}</td>\n                          <td className={`py-2.5 px-3 text-right font-mono font-black ${gap > 0 ? 'text-rose-600' : 'text-emerald-600'}`} data-sort-value={gap > 0 ? (isQty ? (gap) : (gap)) : ('✓ 0')}>{gap > 0 ? (isQty ? formatInt(gap) : formatCurrency(gap)) : '✓ 0'}</td>\n                          <td className={`py-2.5 px-3 text-center font-black ${emp.pctLk >= 100 ? 'text-emerald-700' : 'text-slate-700'}`} data-sort-value={emp.pctLk}>{formatPercent(emp.pctLk)}</td>\n                          <td className={`py-2.5 px-3 text-center font-black ${emp.pctDu >= 100 ? 'text-emerald-600' : emp.pctDu >= 80 ? 'text-amber-600' : 'text-rose-600'}`} data-sort-value={emp.pctDu}>{formatPercent(emp.pctDu)}</td>\n                          <td className=\"py-2.5 px-3 text-center\">{badge}</td>\n                        </tr>\n                      );\n                    })\n                )}\n              </tbody>\n            </SortableTable>\n          </div>\n\n          {computedStaffList.length > 0 && (\n            <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-2 rounded-2xl bg-slate-50 border border-slate-200 px-3 py-2 text-[10.5px]\">\n              <span className=\"text-slate-500\">Tổng target cá nhân: <b className=\"text-slate-800\">{isQty ? `${formatInt(totalTarget)} món` : `${formatCurrency(totalTarget)} TR`}</b></span>\n              <span className=\"text-slate-500\">Tổng còn thiếu: <b className=\"text-rose-600\">{isQty ? `${formatInt(totalGap)} món` : `${formatCurrency(totalGap)} TR`}</b></span>\n              <span className=\"text-slate-500\">Tổng thực đạt NV: <b className=\"text-slate-800\">{isQty ? `${formatInt(totalAchieved)} món` : `${formatCurrency(totalAchieved)} TR`}</b></span>\n            </div>\n          )}\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/components/QuickUploadModal.tsx":"import { SortableTable } from './SortableTable';\nimport React, { useRef, useState, useMemo } from 'react';\nimport {\n  UploadCloud,\n  X,\n  FileSpreadsheet,\n  Check,\n  Loader2,\n  AlertTriangle,\n  RefreshCw,\n  AlertCircle,\n  Clipboard,\n  Sparkles,\n  Database,\n  ArrowRight,\n  CheckCircle2,\n  Table,\n  Trash2,\n} from 'lucide-react';\nimport { parseExcelFile, ParseResult } from '../utils/excelParser';\nimport { AppDataState } from '../types';\nimport {\n  parsePastedData,\n  CATEGORY_LABELS,\n  ParseDiagnostics,\n} from '../utils/smartDataParser';\n\ninterface QuickUploadModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  onDataParsed?: (newData: Partial<AppDataState>) => boolean | void;\n  appData?: AppDataState;\n  onFilesSelected?: (files: FileList | File[]) => void;\n  onOpenClearModal?: () => void;\n}\n\ninterface UploadReport {\n  successList: { filename: string; categoryName: string; rows: number }[];\n  errorList: { filename: string; error: string; advice?: string }[];\n}\n\nexport const QuickUploadModal: React.FC<QuickUploadModalProps> = ({\n  isOpen,\n  onClose,\n  onDataParsed,\n  appData,\n  onFilesSelected,\n  onOpenClearModal,\n}) => {\n  const [activeTab, setActiveTab] = useState<'paste' | 'file'>('paste');\n\n  // Paste Mode States\n  const [selectedCategory, setSelectedCategory] = useState<string>('auto');\n  const [inputText, setInputText] = useState<string>('');\n  const [pasteError, setPasteError] = useState<string | null>(null);\n  const [showFullPreview, setShowFullPreview] = useState<boolean>(false);\n\n  // File Upload Mode States\n  const fileInputRef = useRef<HTMLInputElement>(null);\n  const [isProcessing, setIsProcessing] = useState<boolean>(false);\n  const [uploadStatus, setUploadStatus] = useState<string>('');\n  const [report, setReport] = useState<UploadReport | null>(null);\n\n  type PendingTable = { raw: string; result: ParseDiagnostics };\n  const [pending, setPending] = useState<PendingTable[]>([]);\n  const pendingRef = useRef<PendingTable[]>([]);\n  const [activeCategory, setActiveCategory] = useState<keyof AppDataState | null>(null);\n  const [notice, setNotice] = useState('');\n  const textareaRef = useRef<HTMLTextAreaElement>(null);\n  const updatePending = (next: PendingTable[]) => {\n    pendingRef.current = next;\n    setPending(next);\n  };\n  const parseText = (text: string, category = 'auto') => {\n    const data = { ...appData };\n    pendingRef.current.forEach(item => { data[item.result.category] = item.result.data as any; });\n    const sum = (rows: any[] = [], key: string) => rows.reduce((n, r) => n + (Number(r?.[key]) || 0), 0);\n    return parsePastedData(text, category === 'auto' ? null : category as keyof AppDataState, {\n      existingStoreCompetitionLuyKe: data.td_luyke,\n      existingStoreLuyKeDtQd: sum(data.dt_luyke, 'DOANH THU QĐ (TR)'),\n      existingEmployeeLuyKeDtQd: sum(data.dt_nv_luyke, 'DOANH THU QĐ (TR)'),\n      existingTraChamLuyKeTotal: sum(data.tra_cham_luyke, 'DT TRẢ GÓP (TRIỆU)'),\n    });\n  };\n  const parseResult = useMemo(() => inputText.trim() ? parseText(inputText, selectedCategory) : null,\n    [inputText, selectedCategory, appData, pending]);\n  const draft = parseResult && !('error' in parseResult) && parseResult.data.length ? parseResult : null;\n  const previewItem = pending.find(item => item.result.category === activeCategory);\n  const diagnostics = inputText.trim() ? draft : previewItem?.result;\n  const pasteErrorMessage = parseResult && 'error' in parseResult ? parseResult.error : null;\n  const tablesToSave = draft\n    ? [...pending.filter(item => item.result.category !== draft.category), { raw: inputText, result: draft }]\n    : pending;\n  const totalRows = tablesToSave.reduce((n, item) => n + item.result.data.length, 0);\n  const canSave = totalRows > 0 && (!inputText.trim() || !!draft) && !!onDataParsed;\n\n  const receivePaste = (text: string) => {\n    if (!text.trim()) return;\n    // Every clipboard event is a new report, never concatenate unrelated tables.\n    const result = parseText(text, selectedCategory);\n    setShowFullPreview(false);\n    if ('error' in result || !result.data.length) {\n      setInputText(text);\n      setPasteError('error' in result ? result.error : 'Bảng chưa có dòng dữ liệu hợp lệ.');\n      setNotice('');\n      return;\n    }\n    const replaced = pendingRef.current.some(item => item.result.category === result.category);\n    const next = pendingRef.current.filter(item => item.result.category !== result.category);\n    // Preserve the original button position when replacing a report.\n    const oldIndex = pendingRef.current.findIndex(item => item.result.category === result.category);\n    next.splice(oldIndex < 0 ? next.length : oldIndex, 0, { raw: text, result });\n    updatePending(next);\n    setActiveCategory(result.category);\n    setInputText('');\n    setSelectedCategory('auto');\n    setPasteError(null);\n    setNotice(`${replaced ? 'Đã thay bản đang chờ' : 'Đã nhận'}: ${result.categoryName} (${result.data.length} dòng). Anh dán tiếp bảng khác vào ô bên dưới nhé.`);\n  };\n\n  const changeCategory = (category: string) => {\n    setSelectedCategory(category);\n    setPasteError(null);\n    if (inputText.trim() || !previewItem) return;\n    const result = parseText(previewItem.raw, category);\n    if ('error' in result || !result.data.length) {\n      setPasteError('error' in result ? result.error : 'Không có dữ liệu hợp lệ.');\n      setSelectedCategory('auto');\n      return;\n    }\n    if (result.category !== activeCategory && pending.some(item => item.result.category === result.category)) {\n      setPasteError('Mục này đã có bảng chờ lưu. Anh hãy bỏ bảng cũ bằng nút × trước khi đổi sang mục này.');\n      setSelectedCategory('auto');\n      return;\n    }\n    updatePending(pending.map(item => item.result.category === activeCategory ? { raw: item.raw, result } : item));\n    setActiveCategory(result.category);\n    setSelectedCategory('auto');\n    setNotice(`Đã cập nhật loại dữ liệu: ${result.categoryName}.`);\n  };\n\n  const handleCommitPastedData = () => {\n    if (!canSave || !onDataParsed) return;\n    const updates: Partial<AppDataState> = {};\n    tablesToSave.forEach(item => { updates[item.result.category] = item.result.data as any; });\n    try {\n      if (onDataParsed(updates) === false) {\n        setPasteError('Dữ liệu chưa được lưu do lỗi kiểm tra. Các bảng vẫn được giữ để anh sửa lại.');\n        return;\n      }\n      setNotice('');\n      updatePending([]);\n      setActiveCategory(null);\n      setInputText('');\n      setPasteError(null);\n      setSelectedCategory('auto');\n      onClose();\n    } catch (error) {\n      setPasteError('Chưa lưu được dữ liệu. Các bảng vẫn được giữ, anh vui lòng thử lại.');\n    }\n  };\n\n  if (!isOpen) return null;\n\n  // Process Files\n  const processFiles = async (files: FileList | File[]) => {\n    if (!files || files.length === 0) return;\n    setIsProcessing(true);\n    setUploadStatus('Đang đọc và phân tích cấu trúc files...');\n    setReport(null);\n\n    try {\n      const fileArr = Array.from(files);\n      const updates: Partial<AppDataState> = {};\n      const successList: { filename: string; categoryName: string; rows: number }[] = [];\n      const errorList: { filename: string; error: string; advice?: string }[] = [];\n\n      for (const file of fileArr) {\n        try {\n          const res: ParseResult = await parseExcelFile(file);\n          if (res.success && res.category && res.data && res.data.length > 0) {\n            updates[res.category] = res.data as any;\n            successList.push({\n              filename: file.name,\n              categoryName: res.categoryName || res.category,\n              rows: res.rowCount,\n            });\n          } else {\n            errorList.push({\n              filename: file.name,\n              error: res.error || 'Cấu trúc file không đúng định dạng',\n              advice: res.advice || 'Vui lòng kiểm tra lại cột tiêu đề hoặc nội dung file Excel.',\n            });\n          }\n        } catch (err: any) {\n          errorList.push({\n            filename: file.name,\n            error: 'Lỗi không xác định khi mở file',\n            advice: err?.message || 'File có thể bị mã hóa, bị hỏng hoặc dung lượng bất thường.',\n          });\n        }\n      }\n\n      if (Object.keys(updates).length > 0 && onDataParsed) {\n        onDataParsed(updates);\n      }\n      if (onFilesSelected) {\n        onFilesSelected(files);\n      }\n\n      setReport({ successList, errorList });\n      setIsProcessing(false);\n\n      if (errorList.length === 0 && successList.length > 0) {\n        setUploadStatus(`Đã nhận diện và nạp thành công ${successList.length} file!`);\n        // Keep the import center open, including any pending pasted reports.\n      }\n    } catch (e: any) {\n      setIsProcessing(false);\n      setUploadStatus('Có lỗi hệ thống khi xử lý files!');\n      setReport({\n        successList: [],\n        errorList: [{ filename: 'Hệ thống', error: 'Lỗi xử lý file', advice: e?.message }],\n      });\n    }\n  };\n\n  const handleDrop = (e: React.DragEvent<HTMLDivElement>) => {\n    e.preventDefault();\n    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {\n      processFiles(e.dataTransfer.files);\n    }\n  };\n\n  return (\n    <div\n      className=\"fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200\"\n      onClick={(e) => {\n        if (e.target === e.currentTarget && !isProcessing) {\n          onClose();\n        }\n      }}\n    >\n      <div className=\"bg-white rounded-3xl shadow-2xl max-w-5xl w-full p-4 sm:p-5 border border-slate-200 space-y-3 max-h-[94dvh] flex flex-col overflow-hidden text-slate-800\">\n        {/* Header */}\n        <div className=\"flex items-center justify-between pb-3 border-b border-slate-100 flex-shrink-0\">\n          <div className=\"flex items-center space-x-2.5\">\n            <span className=\"p-2.5 bg-blue-50 text-blue-600 rounded-xl font-bold\">\n              <Clipboard className=\"w-5 h-5\" />\n            </span>\n            <div>\n              <h4 className=\"font-black text-slate-900 text-base\">Trung Tâm Nhập & Dán Dữ Liệu Báo Cáo</h4>\n              <p className=\"text-xs text-slate-500 font-medium\">\n                Hỗ trợ sao chép trực tiếp từ web BI MWG (không cần xuất Excel) hoặc nạp file có sẵn\n              </p>\n            </div>\n          </div>\n          <button\n            onClick={onClose}\n            disabled={isProcessing}\n            className=\"text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-100 transition cursor-pointer disabled:opacity-50\"\n          >\n            <X className=\"w-5 h-5\" />\n          </button>\n        </div>\n\n        <div className=\"overflow-y-auto custom-scroll flex-1 min-h-0 pr-1 space-y-3\">\n        {/* Recognized reports stay together until one batch save. */}\n        {activeTab === 'paste' && (pending.length > 0 || notice) && (\n          <div className=\"space-y-2 flex-shrink-0\">\n            {pending.length > 0 && <div className=\"flex flex-wrap gap-1.5 max-h-24 overflow-y-auto\" aria-label=\"Các bảng chờ lưu\">\n              {pending.map((item, index) => <div key={item.result.category} className={`inline-flex items-center rounded-lg border text-xs ${activeCategory === item.result.category ? 'bg-blue-50 border-blue-300 text-blue-800' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>\n                <button type=\"button\" aria-pressed={activeCategory === item.result.category} onClick={() => { setActiveCategory(item.result.category); setActiveTab('paste'); setShowFullPreview(false); }} className=\"px-2.5 py-1.5 font-bold text-left\">\n                  ✓ {index + 1}. {item.result.categoryName} <span className=\"font-medium\">({item.result.data.length} dòng)</span>\n                </button>\n                <button type=\"button\" aria-label={`Bỏ ${item.result.categoryName} khỏi danh sách chờ`} onClick={() => {\n                  updatePending(pendingRef.current.filter(table => table.result.category !== item.result.category));\n                  if (activeCategory === item.result.category) setActiveCategory(null);\n                  setNotice('Đã bỏ bảng khỏi danh sách chờ lưu.');\n                }} className=\"px-2 py-1.5 text-slate-400 hover:text-rose-600\">×</button>\n              </div>)}\n            </div>}\n            <p role=\"status\" className=\"text-xs text-blue-700\">{notice || `${pending.length} mục đang chờ lưu. Dán tiếp bảng khác hoặc bấm Lưu tất cả.`}</p>\n          </div>\n        )}\n\n        {/* Tab Navigation */}\n        <div className=\"flex items-center gap-2 p-1 bg-slate-100 rounded-xl flex-shrink-0\">\n          <button\n            onClick={() => setActiveTab('paste')}\n            type=\"button\"\n            className={`flex-1 py-2 px-4 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 cursor-pointer ${\n              activeTab === 'paste'\n                ? 'bg-white text-blue-700 shadow-xs'\n                : 'text-slate-600 hover:text-slate-900'\n            }`}\n          >\n            <Clipboard className=\"w-4 h-4 text-blue-600\" />\n            <span>📋 Dán Nội Dung (Copy & Paste Từ Web BI)</span>\n            <span className=\"text-[10px] px-1.5 py-0.5 bg-blue-100 text-blue-800 rounded font-semibold\">\n              Mới • Khuyên dùng\n            </span>\n          </button>\n\n          <button\n            onClick={() => setActiveTab('file')}\n            type=\"button\"\n            className={`py-2 px-4 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 cursor-pointer ${\n              activeTab === 'file'\n                ? 'bg-white text-slate-900 shadow-xs'\n                : 'text-slate-600 hover:text-slate-900'\n            }`}\n          >\n            <FileSpreadsheet className=\"w-4 h-4 text-emerald-600\" />\n            <span>📁 Chọn File Excel / CSV</span>\n          </button>\n        </div>\n\n        {/* Modal Body */}\n        <div className=\"space-y-3\">\n          {activeTab === 'paste' ? (\n            /* TAB 1: PASTE DATA */\n            <div className=\"space-y-3\">\n              {/* DATA INPUT — placed first for fastest Copy/Paste workflow */}\n              <div className=\"relative\">\n                <textarea\n                  autoFocus\n                  ref={textareaRef}\n                  onPaste={(event) => {\n                    const text = event.clipboardData.getData('text/plain');\n                    if (!text.trim()) return;\n                    event.preventDefault();\n                    receivePaste(text);\n                  }}\n                  value={inputText}\n                  onChange={(e) => {\n                    setInputText(e.target.value);\n                    setPasteError(null);\n                  }}\n                  placeholder={`Dán dữ liệu BI vào đây (Ctrl + V)...\\nMỗi lần dán một bảng; ô tự trống để dán tiếp. Xong bấm Lưu tất cả bên dưới.`}\n                  rows={3}\n                  style={{ height: 'clamp(88px, 15vh, 128px)', resize: 'none' }}\n                  className=\"w-full font-mono text-xs bg-white border-2 border-blue-200 rounded-2xl p-4 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition custom-scroll placeholder:text-slate-400 leading-relaxed shadow-sm\"\n                />\n              </div>\n\n              {/* Only the essential selector remains */}\n              <div className=\"flex items-center justify-between gap-3 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2\">\n                <div className=\"flex items-center gap-2 text-xs font-bold text-slate-700\">\n                  <Database className=\"w-4 h-4 text-blue-600\" />\n                  <span>Loại dữ liệu</span>\n                </div>\n                <select\n                  value={selectedCategory}\n                  onChange={(e) => changeCategory(e.target.value)}\n                  className=\"flex-1 max-w-md bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer\"\n                >\n                  <option value=\"auto\">✨ Tự động nhận diện theo bảng dán</option>\n                  {Object.entries(CATEGORY_LABELS).map(([key, label]) => (\n                    <option key={key} value={key}>\n                      {label}\n                    </option>\n                  ))}\n                </select>\n              </div>\n\n              {/* Session clear — kept because it is a real data-safety action */}\n              {onOpenClearModal && (\n                <div className=\"flex justify-end\">\n                  <button\n                    onClick={onOpenClearModal}\n                    type=\"button\"\n                    className=\"inline-flex items-center gap-1.5 px-2.5 py-1.5 text-[11px] text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-lg font-bold transition cursor-pointer\"\n                    title=\"Xóa toàn bộ data đang lưu trong phiên\"\n                  >\n                    <Trash2 className=\"w-3.5 h-3.5 text-rose-600\" />\n                    Xóa data phiên\n                  </button>\n                </div>\n              )}\n\n              {/* Paste Error */}\n              {(pasteError || pasteErrorMessage) && (\n                <div className=\"p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-center gap-2 text-xs text-amber-800\">\n                  <AlertTriangle className=\"w-4 h-4 text-amber-600 flex-shrink-0\" />\n                  <span>{pasteError || pasteErrorMessage}</span>\n                </div>\n              )}\n\n              {/* Diagnostics & Preview */}\n              {diagnostics && (\n                <div className=\"bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3\">\n                  <div className=\"flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 pb-2\">\n                    <div className=\"flex items-center gap-2\">\n                      <CheckCircle2 className=\"w-4 h-4 text-emerald-600\" />\n                      <span className=\"text-xs font-bold text-slate-900\">\n                        Khớp với: {diagnostics.categoryName}\n                      </span>\n                      <span className=\"px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200\">\n                        {diagnostics.rowCount} dòng dữ liệu\n                      </span>\n                    </div>\n                    <button\n                      type=\"button\"\n                      onClick={() => setShowFullPreview(!showFullPreview)}\n                      className=\"text-xs text-blue-600 hover:text-blue-700 font-medium flex items-center gap-1 cursor-pointer\"\n                    >\n                      <Table className=\"w-3.5 h-3.5\" />\n                      {showFullPreview ? 'Thu gọn' : 'Xem trước bảng'}\n                    </button>\n                  </div>\n\n                  {/* Ctrl + A Full Page Extraction Indicator */}\n                  {diagnostics.pageExtractedInfo?.isFullPageExtracted && (\n                    <div className=\"p-2.5 bg-emerald-50 border border-emerald-200 rounded-lg text-xs text-emerald-900 flex items-center gap-2 font-medium\">\n                      <Sparkles className=\"w-4 h-4 text-emerald-600 flex-shrink-0\" />\n                      <span>\n                        <b>✨ Đã tự động lọc sạch trang web (Ctrl + A):</b> Bỏ qua{' '}\n                        <b>{diagnostics.pageExtractedInfo.ignoredNoiseLines} dòng</b> menu/chân trang thừa, nhận diện bảng tại dòng{' '}\n                        <b>{diagnostics.pageExtractedInfo.headerFoundAtLine + 1}</b>!\n                      </span>\n                    </div>\n                  )}\n\n                  <div>\n                    <span className=\"text-[11px] font-semibold text-slate-500 uppercase tracking-wider block mb-1.5\">\n                      Cột dữ liệu tự động nhận diện ({diagnostics.recognizedColumns.length} cột):\n                    </span>\n                    <div className=\"flex flex-wrap gap-1.5\">\n                      {diagnostics.recognizedColumns.map((col, idx) => (\n                        <span\n                          key={idx}\n                          className=\"inline-flex items-center gap-1 text-[11px] px-2 py-0.5 bg-white border border-slate-200 rounded-md text-slate-700 font-medium\"\n                        >\n                          <span className=\"font-bold text-blue-700\">{col.field}</span>\n                          <ArrowRight className=\"w-3 h-3 text-slate-400\" />\n                          <span className=\"text-slate-500 italic\">\"{col.mappedHeader}\"</span>\n                        </span>\n                      ))}\n                    </div>\n                  </div>\n\n                  <div className=\"border border-slate-200 rounded-lg overflow-hidden bg-white max-h-40 overflow-x-auto overflow-y-auto custom-scroll\">\n                    <SortableTable rowLimit={showFullPreview ? 15 : 3} className=\"w-full text-[11px] text-left\">\n                      <thead className=\"bg-slate-100 text-slate-600 font-semibold border-b border-slate-200 sticky top-0\">\n                        <tr>\n                          <th className=\"p-2 w-8 text-center text-slate-400\">#</th>\n                          {Object.keys(diagnostics.data[0] || {}).map((k) => (\n                            <th key={k} className=\"p-2 whitespace-nowrap\">\n                              {k}\n                            </th>\n                          ))}\n                        </tr>\n                      </thead>\n                      <tbody className=\"divide-y divide-slate-100 text-slate-700\">\n                        {diagnostics.data\n                          \n                          .map((row, rIdx) => (\n                            <tr key={rIdx} className=\"hover:bg-slate-50\">\n                              <td className=\"p-2 text-center text-slate-400\">{rIdx + 1}</td>\n                              {Object.values(row).map((v: any, cIdx) => (\n                                <td key={cIdx} className=\"p-2 whitespace-nowrap font-mono\">\n                                  {typeof v === 'number' ? v.toLocaleString('vi-VN') : String(v)}\n                                </td>\n                              ))}\n                            </tr>\n                          ))}\n                      </tbody>\n                    </SortableTable>\n                  </div>\n                </div>\n              )}\n            </div>\n          ) : (\n            /* TAB 2: FILE DROP ZONE */\n            <div className=\"space-y-4\">\n              <div\n                onDrop={handleDrop}\n                onDragOver={(e) => e.preventDefault()}\n                onClick={() => !isProcessing && fileInputRef.current?.click()}\n                className={`border-2 border-dashed rounded-2xl p-7 text-center transition cursor-pointer group ${\n                  isProcessing\n                    ? 'border-blue-400 bg-blue-50/50 cursor-wait'\n                    : report?.errorList && report.errorList.length > 0\n                    ? 'border-amber-400 bg-amber-50/30 hover:bg-amber-50/60'\n                    : 'border-indigo-300 hover:border-indigo-500 bg-indigo-50/20 hover:bg-indigo-50/50'\n                }`}\n              >\n                <input\n                  type=\"file\"\n                  ref={fileInputRef}\n                  onChange={(e) => {\n                    if (e.target.files && e.target.files.length > 0) {\n                      processFiles(e.target.files);\n                    }\n                  }}\n                  multiple\n                  accept=\".xlsx,.xls,.csv\"\n                  className=\"hidden\"\n                  disabled={isProcessing}\n                />\n                <div className=\"w-12 h-12 rounded-2xl bg-indigo-100 text-indigo-600 flex items-center justify-center mx-auto mb-2.5 group-hover:scale-110 transition-transform\">\n                  {isProcessing ? (\n                    <Loader2 className=\"w-6 h-6 animate-spin text-blue-600\" />\n                  ) : (\n                    <UploadCloud className=\"w-6 h-6\" />\n                  )}\n                </div>\n                <p className=\"text-xs font-bold text-slate-800\">\n                  {isProcessing ? uploadStatus : 'Kéo thả hoặc bấm để chọn files Excel (.xlsx, .xls, .csv)'}\n                </p>\n                <p className=\"text-[11px] text-slate-500 mt-1\">\n                  Có thể chọn cùng lúc nhiều files – hệ thống sẽ kiểm tra từng file và cảnh báo nếu có lỗi\n                </p>\n              </div>\n\n              {/* WARNING REPORT BOX IF FILES FAILED */}\n              {report?.errorList && report.errorList.length > 0 && (\n                <div className=\"bg-rose-50 border border-rose-200 rounded-2xl p-4 space-y-3\">\n                  <div className=\"flex items-center gap-2 text-rose-800 font-extrabold text-xs\">\n                    <AlertTriangle className=\"w-4 h-4 text-rose-600 flex-shrink-0\" />\n                    <span>CẢNH BÁO: CÓ {report.errorList.length} FILE BỊ SAI ĐỊNH DẠNG</span>\n                  </div>\n                  <div className=\"space-y-2 max-h-36 overflow-y-auto pr-1 custom-scroll\">\n                    {report.errorList.map((err, idx) => (\n                      <div key={idx} className=\"bg-white rounded-xl p-2.5 border border-rose-200 text-xs shadow-2xs space-y-1\">\n                        <div className=\"flex items-center justify-between\">\n                          <span className=\"font-bold text-slate-900 truncate max-w-[280px]\">\n                            📄 {err.filename}\n                          </span>\n                          <span className=\"px-2 py-0.5 bg-rose-100 text-rose-800 font-black text-[10px] rounded-md\">\n                            Sai cấu trúc\n                          </span>\n                        </div>\n                        <p className=\"text-rose-700 font-semibold text-[11px] flex items-start gap-1\">\n                          <AlertCircle className=\"w-3.5 h-3.5 text-rose-500 mt-0.5 flex-shrink-0\" />\n                          <span>{err.error}</span>\n                        </p>\n                        {err.advice && (\n                          <p className=\"text-slate-500 text-[10.5px] pl-4 italic\">\n                            💡 {err.advice}\n                          </p>\n                        )}\n                      </div>\n                    ))}\n                  </div>\n                </div>\n              )}\n\n              {/* SUCCESS LIST */}\n              {report?.successList && report.successList.length > 0 && (\n                <div className=\"bg-emerald-50 border border-emerald-200 rounded-2xl p-3.5 space-y-2\">\n                  <div className=\"text-emerald-900 font-extrabold text-xs flex items-center gap-1.5\">\n                    <Check className=\"w-4 h-4 text-emerald-600\" />\n                    <span>Đã nạp thành công {report.successList.length} file:</span>\n                  </div>\n                  <div className=\"space-y-1 max-h-32 overflow-y-auto pr-1 custom-scroll\">\n                    {report.successList.map((suc, idx) => (\n                      <div key={idx} className=\"flex items-center justify-between bg-white rounded-lg p-2 border border-emerald-200 text-[11px]\">\n                        <span className=\"font-bold text-slate-800 truncate max-w-[240px]\">\n                          ✓ {suc.filename}\n                        </span>\n                        <div className=\"flex items-center gap-2\">\n                          <span className=\"text-emerald-700 font-semibold bg-emerald-100/70 px-2 py-0.5 rounded text-[10px]\">\n                            {suc.categoryName}\n                          </span>\n                          <span className=\"text-slate-400 font-mono text-[10px]\">({suc.rows} dòng)</span>\n                        </div>\n                      </div>\n                    ))}\n                  </div>\n                </div>\n              )}\n            </div>\n          )}\n        </div>\n\n        </div>\n\n        {/* Footer stays outside the scrollable content so Save is always reachable. */}\n        <div className=\"flex items-center gap-3 pt-3 border-t border-slate-100 flex-shrink-0 bg-white\">\n          <button\n            onClick={onClose}\n            type=\"button\"\n            className=\"px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition cursor-pointer\"\n          >\n            Đóng\n          </button>\n          {activeTab === 'paste' && (\n<button\n                onClick={handleCommitPastedData}\n                disabled={!canSave}\n                type=\"button\"\n                className={`flex-1 min-w-0 inline-flex items-center justify-center gap-2 px-3 sm:px-5 py-3 rounded-xl text-sm font-extrabold text-white shadow-md transition ${\n                  canSave\n                    ? 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-600/20 active:scale-[0.99] cursor-pointer'\n                    : 'bg-slate-300 cursor-not-allowed text-slate-500'\n                }`}\n              >\n                <CheckCircle2 className=\"w-5 h-5\" />\n                Lưu Tất Cả Vào Hệ Thống ({tablesToSave.length} mục · {totalRows.toLocaleString('vi-VN')} dòng)\n              </button>\n          )}\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/components/Sidebar.tsx":"import React from 'react';\nimport {\n  LayoutDashboard,\n  FileCheck2,\n  Trophy,\n  Layers,\n  Store,\n  Users2,\n  ArrowRightLeft,\n  TrendingUp,\n  Settings2,\n  CreditCard,\n  X,\n  CalendarDays,\n  ShieldCheck,\n  BarChart3,\n} from 'lucide-react';\nimport { ViewType } from '../types';\n\ninterface SidebarProps {\n  currentView: ViewType;\n  onSelectView: (view: ViewType) => void;\n  isOpenMobile?: boolean;\n  onCloseMobile?: () => void;\n  onOpenClearSession?: () => void;\n}\n\nexport const Sidebar: React.FC<SidebarProps> = ({\n  currentView,\n  onSelectView,\n  isOpenMobile = false,\n  onCloseMobile,\n}) => {\n  const navItems = [\n    {\n      id: ViewType.DASHBOARD,\n      label: 'Dashboard Tổng Quan',\n      icon: LayoutDashboard,\n    },\n    {\n      id: ViewType.BAO_CAO_CUOI_NGAY,\n      label: 'Báo Cáo Cuối Ngày ⚡',\n      icon: FileCheck2,\n      badge: 'HOT',\n      highlight: true,\n    },\n    {\n      id: ViewType.THI_DUA_ST,\n      label: 'Thi Đua Siêu Thị 🏆',\n      icon: Trophy,\n    },\n    {\n      id: ViewType.SUC_KHOE_CUM,\n      label: 'Sức Khoẻ Cụm 933',\n      icon: Layers,\n    },\n    {\n      id: ViewType.DOANH_THU_ST,\n      label: 'Doanh Thu Siêu Thị',\n      icon: Store,\n    },\n    {\n      id: ViewType.SUC_KHOE_NV,\n      label: 'Xếp Hạng Nhân Viên',\n      icon: Users2,\n    },\n    {\n      id: ViewType.TRA_CHAM,\n      label: 'Trả Chậm Nhân Viên',\n      icon: CreditCard,\n    },\n    {\n      id: ViewType.SO_SANH,\n      label: 'So Sánh Hiệu Suất',\n      icon: ArrowRightLeft,\n    },\n    {\n      id: ViewType.DU_BAO,\n      label: 'Dự Báo & Kế Hoạch',\n      icon: TrendingUp,\n    },\n    {\n      id: ViewType.THEO_DOI_NGAY,\n      label: 'Theo Dõi Từng Ngày',\n      icon: CalendarDays,\n    },\n    {\n      id: ViewType.DATA_QUALITY,\n      label: 'Data Quality Center',\n      icon: ShieldCheck,\n    },\n    {\n      id: ViewType.KPI_CUSTOM,\n      label: 'Tùy Biến KPI Nhân Sự',\n      icon: Settings2,\n    },\n  ];\n\n  const content = (\n    <aside className=\"w-64 bg-white border-r border-slate-200 flex flex-col justify-between flex-shrink-0 z-30 shadow-sm select-none h-full\">\n      <div className=\"p-4 flex flex-col space-y-4\">\n        {/* Brand header */}\n        <div className=\"flex items-center justify-between px-2\">\n          <div className=\"flex items-center space-x-2.5\">\n            <div className=\"w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white font-black shadow-md shadow-blue-500/30\">\n              <Store className=\"w-4.5 h-4.5\" />\n            </div>\n            <div>\n              <h1 className=\"font-black text-slate-900 text-xs tracking-wider uppercase\">SỨC KHOẺ SIÊU THỊ</h1>\n              <p className=\"text-[10px] text-slate-400 font-semibold\">Cụm 933 - NHT</p>\n            </div>\n          </div>\n          {onCloseMobile && (\n            <button\n              onClick={onCloseMobile}\n              className=\"md:hidden p-1 text-slate-400 hover:text-slate-700\"\n            >\n              <X className=\"w-5 h-5\" />\n            </button>\n          )}\n        </div>\n\n        {/* Navigation list */}\n        <nav className=\"space-y-1 pt-1\">\n          {navItems.map((item) => {\n            const Icon = item.icon;\n            const isActive = currentView === item.id;\n            return (\n              <button\n                key={item.id}\n                onClick={() => onSelectView(item.id)}\n                className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-bold transition cursor-pointer ${\n                  isActive\n                    ? 'bg-blue-600 text-white shadow-sm font-black'\n                    : item.highlight\n                    ? 'text-emerald-800 bg-emerald-50 hover:bg-emerald-100/70 border border-emerald-200/60'\n                    : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'\n                }`}\n              >\n                <div className=\"flex items-center space-x-2.5 truncate\">\n                  <Icon\n                    className={`w-4 h-4 flex-shrink-0 ${\n                      isActive ? 'text-white' : item.highlight ? 'text-emerald-600' : 'text-slate-400'\n                    }`}\n                  />\n                  <span className=\"truncate\">{item.label}</span>\n                </div>\n                {item.badge && !isActive && (\n                  <span className=\"text-[9px] font-black px-1.5 py-0.5 rounded bg-amber-400 text-amber-950\">\n                    {item.badge}\n                  </span>\n                )}\n              </button>\n            );\n          })}\n        </nav>\n      </div>\n\n      {/* Footer Store Info */}\n      <div className=\"p-3.5 border-t border-slate-100 bg-slate-50/60 text-[11px] text-slate-500 space-y-2\">\n        <div className=\"space-y-1\">\n          <div className=\"flex justify-between font-bold text-slate-700\">\n            <span>Shop 933:</span>\n            <span>TGDĐ</span>\n          </div>\n          <div className=\"flex justify-between font-bold text-slate-700\">\n            <span>Shop 10341:</span>\n            <span>TopZone</span>\n          </div>\n        </div>\n\n        <div className=\"text-[10px] text-slate-400 pt-1 border-t border-slate-200/60 flex justify-between items-center\">\n          <span>Hệ điều hành v1.0.2</span>\n          <span className=\"text-emerald-600 font-semibold\">Online</span>\n        </div>\n        <div className=\"pt-2 border-t border-slate-200/60 text-[10px] leading-relaxed text-slate-500\">\n          <p>© 2026</p>\n          <p className=\"font-semibold text-slate-700\" style={{ fontSize: '10px', whiteSpace: 'nowrap', letterSpacing: '-0.1px' }}>Dinh Đz - lebangdinh@gmail.com</p>\n        </div>\n      </div>\n    </aside>\n  );\n\n  return (\n    <>\n      {/* Desktop view */}\n      <div className=\"hidden md:block h-full\">\n        {content}\n      </div>\n\n      {/* Mobile drawer backdrop */}\n      {isOpenMobile && (\n        <div className=\"fixed inset-0 z-50 md:hidden flex\">\n          <div\n            className=\"fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity\"\n            onClick={onCloseMobile}\n          ></div>\n          <div className=\"relative z-10 w-64 h-full bg-white shadow-2xl animate-in slide-in-from-left\">\n            {content}\n          </div>\n        </div>\n      )}\n    </>\n  );\n};\n","src/index.css":"@import \"tailwindcss\";\n\n:root {\n  --app-font: 'Be Vietnam Pro', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;\n  --kpi-align: center;\n  --kpi-size: 3.2rem;\n  --content-size: 14px;\n  --export-width: 1250px;\n  --grid-color: #e2e8f0;\n}\n\nbody {\n  font-family: var(--app-font);\n  font-feature-settings: \"cv02\", \"cv03\", \"cv04\", \"cv11\";\n  font-variant-numeric: tabular-nums;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n/* Tabular figures for numbers across tables and cards */\ntable, td, th, .tabular-nums, .font-mono {\n  font-variant-numeric: tabular-nums;\n}\n\n/* Custom Scrollbar */\n.custom-scroll::-webkit-scrollbar {\n  width: 6px;\n  height: 6px;\n}\n.custom-scroll::-webkit-scrollbar-track {\n  background: #f1f5f9;\n}\n.custom-scroll::-webkit-scrollbar-thumb {\n  background: #cbd5e1;\n  border-radius: 9999px;\n}\n.custom-scroll::-webkit-scrollbar-thumb:hover {\n  background: #94a3b8;\n}\n\n.nav-item-active {\n  background-color: #1d4ed8 !important;\n  color: #ffffff !important;\n  font-weight: 700 !important;\n  box-shadow: 0 4px 12px -2px rgba(29, 78, 216, 0.3);\n}\n.nav-item-active svg {\n  color: #ffffff !important;\n}\n\n/* Table grid borders */\n.table-grid-caro td, .table-grid-caro th {\n  border: 1px solid var(--grid-color) !important;\n}\n.table-grid-horizontal td, .table-grid-horizontal th {\n  border-bottom: 1px solid var(--grid-color) !important;\n  border-top: 1px solid var(--grid-color) !important;\n  border-left: none !important;\n  border-right: none !important;\n}\n.table-grid-none td, .table-grid-none th {\n  border: none !important;\n}\n\n/* Interactive table headers */\ntable thead th {\n  user-select: none;\n  transition: background-color 0.15s ease;\n}\ntable thead th:hover {\n  background-color: rgba(37, 99, 235, 0.08);\n}\n\n/* Image Export Clean Rules */\n.export-only {\n  display: none;\n}\n\n.is-exporting .no-export {\n  display: none !important;\n}\n\n.is-exporting .export-only {\n  display: inline-flex !important;\n}\n\n.is-exporting .card-programs-container,\n.is-exporting [data-export-expand=\"true\"] {\n  max-height: none !important;\n  height: auto !important;\n  overflow: visible !important;\n  overflow-y: visible !important;\n  overflow-x: visible !important;\n}\n\n/* Suppress all scrollbars during export */\n.is-exporting *::-webkit-scrollbar {\n  display: none !important;\n  width: 0 !important;\n  height: 0 !important;\n}\n.is-exporting * {\n  scrollbar-width: none !important;\n  -ms-overflow-style: none !important;\n}\n\n/* Ensure crystal-clear text during export */\n.is-exporting {\n  -webkit-font-smoothing: subpixel-antialiased !important;\n  text-rendering: geometricPrecision !important;\n  max-height: none !important;\n  height: auto !important;\n  overflow: visible !important;\n  overflow-y: visible !important;\n  overflow-x: visible !important;\n}\n\n","src/main.tsx":"import {StrictMode} from 'react';\nimport {createRoot} from 'react-dom/client';\nimport App from './App.tsx';\nimport './index.css';\n\ncreateRoot(document.getElementById('root')!).render(\n  <StrictMode>\n    <App />\n  </StrictMode>,\n);\n","src/types.ts":"export interface StoreRevenueRow {\n  'MÃ ĐƠN VỊ'?: string | number;\n  'TÊN ĐƠN VỊ'?: string;\n  'TARGET (TR)'?: number | string;\n  'TARGET QĐ (TR)'?: number | string;\n  'DOANH THU (TR)'?: number | string;\n  'DOANH THU QĐ (TR)'?: number | string;\n  'DT TRẢ GÓP (TR)'?: number | string;\n  '% TRẢ GÓP'?: number | string;\n  'LƯỢT BILL (TẤT CẢ ST)'?: number | string;\n  'SỐ LƯỢNG'?: number | string;\n  'TB 3 THÁNG (TR)'?: number | string;\n  'SỐ NGÀY CỬA SỔ'?: number | string;\n  [key: string]: any;\n}\n\nexport interface CompetitionRow {\n  'MÃ CHƯƠNG TRÌNH'?: string | number;\n  'CHƯƠNG TRÌNH'?: string;\n  'ĐƠN VỊ / NHÂN VIÊN'?: string;\n  'LOẠI TĐ'
