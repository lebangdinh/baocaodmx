 return null;\n\n  const effectiveStore = storeKey || propStoreName || 'TGDĐ';\n  const storeType = normalizeStoreKey(effectiveStore);\n  const isTopZone = storeType === 'TOPZONE';\n  const effectiveCode = programCode !== undefined ? programCode : propProgCode;\n  const effectiveName = programName || propProgName || 'Chi tiết môn thi đua';\n\n  let computedLoaiTd = propLoaiTd || 3;\n  let computedShopThuc = propShopThuc || 0;\n  let computedShopTarget = propShopTarget || 0;\n  let computedPctLk = propShopPctLk || 0;\n  let computedPctDu = propShopPctDu || 0;\n  let computedStaffList: StaffSellingDetail[] = propStaffList || [];\n\n  if (appData) {\n    const codeStr = effectiveCode !== undefined && effectiveCode !== null ? cleanCode(effectiveCode) : '';\n    const nameClean = cleanProgName(effectiveName || '');\n    const isProgMatch = (r: any) => {\n      const rCode = cleanCode(r?.['MÃ CHƯƠNG TRÌNH']);\n      const rName = cleanProgName(r?.['CHƯƠNG TRÌNH'] || '');\n\n      if (codeStr && rCode) return rCode === codeStr;\n\n      return !!nameClean && rName === nameClean;\n    };\n\n    const tdRow = (appData.td_luyke || []).find((r: any) => isStoreRow(r, storeType) && isProgMatch(r));\n    const tdRtRow = (appData.td_realtime || []).find((r: any) => isStoreRow(r, storeType) && isProgMatch(r));\n\n    if (tdRow || tdRtRow) {\n      // Không trộn Target Thi đua LK với Target Thi đua RT.\n      // Có LK thì chi tiết dùng đúng bộ LK; chưa có LK thì mới hiển thị riêng bộ RT.\n      const detailRow = tdRow || tdRtRow;\n      computedLoaiTd = Number(detailRow?.['LOẠI TĐ']) || 3;\n      computedShopTarget = Number(detailRow?.['TARGET (TR/SL theo LOẠI TĐ)']) || 0;\n      computedShopThuc = detailRow\n        ? ((computedLoaiTd === 2 || computedLoaiTd === 6)\n          ? (Number(detailRow['SỐ LƯỢNG']) || 0)\n          : (Number(detailRow['DT QUY ĐỔI (TR)']) || Number(detailRow['DOANH THU (TR)']) || 0))\n        : 0;\n      computedPctLk = tdRow\n        ? (Number(tdRow?.['% HT THÁNG']) || 0)\n        : (Number(tdRtRow?.['% HT NGÀY']) || Number(tdRtRow?.['% HT THÁNG']) || 0);\n      computedPctDu = tdRow ? (Number(tdRow?.['% DỰ BÁO']) || 0) : 0;\n    }\n\n    const nvSource = [\n      ...(appData.nv_tgdd || []),\n      ...(appData.nv_tz || []),\n    ].filter((r: any) => isStoreRow(r, storeType));\n    const resolvedProgCode = tdRtRow ? cleanCode(tdRtRow['MÃ CHƯƠNG TRÌNH']) : tdRow ? cleanCode(tdRow['MÃ CHƯƠNG TRÌNH']) : codeStr;\n\n    const filteredStaff = nvSource.filter((r: any) => {\n      const rCode = cleanCode(r?.['MÃ CHƯƠNG TRÌNH']);\n      const rName = cleanProgName(r?.['CHƯƠNG TRÌNH'] || '');\n\n      if (resolvedProgCode && rCode) return rCode === resolvedProgCode;\n\n      if (nameClean && rName) return rName === nameClean;\n      return false;\n    });\n\n    if (filteredStaff.length > 0) {\n      const seen = new Set<string>();\n      computedStaffList = filteredStaff\n        .map((r: any) => {\n          const empNameRaw = String(r?.['ĐƠN VỊ / NHÂN VIÊN'] || r?.['TÊN NHÂN VIÊN'] || '').trim();\n          const empName = canonicalEmployeeName(empNameRaw);\n          const empId = cleanCode(r?.['MÃ NV'] || r?.['MÃ NHÂN VIÊN'] || '');\n          const key = empId ? `id:${empId}` : `name:${empName.toLowerCase()}`;\n          if (seen.has(key)) return null;\n          seen.add(key);\n\n          const sl = Number(r?.['SỐ LƯỢNG']) || 0;\n          const dtThuc = Number(r?.['DOANH THU (TR)']) || 0;\n          const dtQd = Number(r?.['DT QUY ĐỔI (TR)']) || dtThuc;\n          const empLoai = Number(r?.['LOẠI TĐ']) || computedLoaiTd;\n          const isQuantity = empLoai === 2 || empLoai === 6;\n\n          const cfgMap = personnelConfig?.[storeType] || {};\n          const officialStaffCount = Object.values(cfgMap).filter((cfg: any) => cfg?.isOfficial === true).length;\n          const staffCount = officialStaffCount > 0\n            ? officialStaffCount\n            : (storeType === 'TGDD' ? 4 : 6);\n          const allocationTotalPct = getPersonnelAllocationPct(storeType);\n          const employeeName = canonicalEmployeeName(r?.['TÊN NHÂN VIÊN'] || r?.['NHÂN VIÊN'] || '');\n          const employeeCfg = cfgMap[employeeName] || cfgMap[String(r?.['MÃ NHÂN VIÊN'] || '').trim()] || {};\n          const effectiveSharePct = allocationTotalPct != null && employeeCfg?.isOfficial !== false\n            ? (Number(employeeCfg?.targetPct) || (allocationTotalPct / staffCount))\n            : (allocationTotalPct != null ? allocationTotalPct / staffCount : 100 / staffCount);\n          let empTarget = computedShopTarget > 0\n            ? Math.round((computedShopTarget * effectiveSharePct / 100) * 10) / 10\n            : (Number(r?.['TARGET']) || Number(r?.['TARGET (TR/SL theo LOẠI TĐ)']) || 0);\n\n          const currentAchieved = isQuantity ? sl : (dtQd || dtThuc);\n          const pctLk = empTarget > 0\n            ? (currentAchieved / empTarget) * 100\n            : (Number(r?.['% LŨY KẾ']) || 0);\n          const pctDu = Number(r?.['% DỰ BÁO']) || (pctLk * 1.2);\n\n          return {\n            name: empName || empNameRaw,\n            id: empId,\n            sl,\n            dtThuc,\n            dtQd,\n            empTarget,\n            pctLk,\n            pctDu,\n            isDone: pctLk >= 100,\n          } as StaffSellingDetail;\n        })\n        .filter(Boolean) as StaffSellingDetail[];\n    }\n  }\n\n  const isQty = computedLoaiTd === 2 || computedLoaiTd === 6;\n  const employeeKey = (emp: StaffSellingDetail) => emp.id ? `id:${emp.id}` : `name:${emp.name.toLowerCase()}`;\n  const programKey = `${storeType}::${effectiveCode || cleanProgName(effectiveName || '')}`;\n  const hiddenEmployeeKeys = hiddenEmployeeKeysByProgram[programKey] || {};\n\n  const isGloballyHiddenEmployee = (emp: StaffSellingDetail) => {\n    const cfgMap = personnelConfig?.[storeType] || {};\n    const cfg = cfgMap[emp.name] || (emp.id ? cfgMap[emp.id] : undefined) || {};\n    return cfg.isVisible === false;\n  };\n\n  const isEmployeeVisible = (emp: StaffSellingDetail) => !hiddenEmployeeKeys[employeeKey(emp)] && !isGloballyHiddenEmployee(emp);\n\n  const visibleStaffList = computedStaffList.filter(isEmployeeVisible);\n  const hiddenEmployeeCount = computedStaffList.length - visibleStaffList.length;\n  const allEmployeesVisible = hiddenEmployeeCount === 0;\n  const totalAchieved = visibleStaffList.reduce((sum, emp) => sum + (isQty ? emp.sl : (emp.dtQd || emp.dtThuc)), 0);\n  const totalTarget = visibleStaffList.reduce((sum, emp) => sum + emp.empTarget, 0);\n  const totalGap = Math.max(0, totalTarget - totalAchieved);\n  const doneCount = visibleStaffList.filter(emp => emp.pctLk >= 100).length;\n  const needRunCount = visibleStaffList.filter(emp => emp.pctLk < 100).length;\n\n  const setEmployeeHiddenInThisProgram = (emp: StaffSellingDetail, hidden: boolean) => {\n    const key = employeeKey(emp);\n    setHiddenEmployeeKeysByProgram(prev => {\n      const currentForProgram = { ...(prev[programKey] || {}) };\n      if (hidden) currentForProgram[key] = true;\n      else delete currentForProgram[key];\n      return { ...prev, [programKey]: currentForProgram };\n    });\n  };\n\n  const setEmployeeHiddenGlobally = (emp: StaffSellingDetail, hidden: boolean) => {\n    if (!onUpdatePersonnelConfig) return;\n    const next: PersonnelConfigMap = JSON.parse(JSON.stringify(personnelConfig || {}));\n    if (!next[storeType]) next[storeType] = {};\n    if (!next[storeType][emp.name]) next[storeType][emp.name] = {};\n    next[storeType][emp.name].isVisible = !hidden;\n    onUpdatePersonnelConfig(next);\n  };\n\n  const toggleEmployeeVisibility = (emp: StaffSellingDetail) => {\n    const currentlyVisible = isEmployeeVisible(emp);\n    if (currentlyVisible) {\n      if (hideScope === 'GLOBAL') {\n        setEmployeeHiddenGlobally(emp, true);\n      } else {\n        setEmployeeHiddenInThisProgram(emp, true);\n      }\n    } else {\n      setEmployeeHiddenInThisProgram(emp, false);\n      if (isGloballyHiddenEmployee(emp)) setEmployeeHiddenGlobally(emp, false);\n    }\n  };\n\n  const setAllEmployeesVisibility = (visible: boolean) => {\n    if (visible) {\n      setHiddenEmployeeKeysByProgram(prev => ({ ...prev, [programKey]: {} }));\n      if (onUpdatePersonnelConfig) {\n        const next: PersonnelConfigMap = JSON.parse(JSON.stringify(personnelConfig || {}));\n        if (!next[storeType]) next[storeType] = {};\n        computedStaffList.forEach(emp => {\n          if (isGloballyHiddenEmployee(emp)) {\n            if (!next[storeType][emp.name]) next[storeType][emp.name] = {};\n            next[storeType][emp.name].isVisible = true;\n          }\n        });\n        onUpdatePersonnelConfig(next);\n      }\n      return;\n    }\n    if (hideScope === 'GLOBAL' && onUpdatePersonnelConfig) {\n      const next: PersonnelConfigMap = JSON.parse(JSON.stringify(personnelConfig || {}));\n      if (!next[storeType]) next[storeType] = {};\n      computedStaffList.forEach(emp => {\n        if (!next[storeType][emp.name]) next[storeType][emp.name] = {};\n        next[storeType][emp.name].isVisible = false;\n      });\n      onUpdatePersonnelConfig(next);\n    } else {\n      const nextForProgram: Record<string, boolean> = {};\n      computedStaffList.forEach(emp => { nextForProgram[employeeKey(emp)] = true; });\n      setHiddenEmployeeKeysByProgram(prev => ({ ...prev, [programKey]: nextForProgram }));\n    }\n  };\n\n  const handleExportImage = async () => {\n    if (!cardRef.current || isExporting) return;\n    setIsExporting(true);\n    try {\n      const cleanName = String(effectiveName || 'Mon_Thi_Dua').replace(/[^a-zA-Z0-9_]/g, '_');\n      const filename = `Chi_Tiet_Mon_${cleanName}_${new Date().toISOString().slice(0, 10)}.png`;\n      const result = await captureElement(cardRef.current, {\n        fileName: filename,\n        backgroundColor: '#ffffff',\n        scale: 2,\n      });\n      if (onSaveScreenshot) {\n        onSaveScreenshot({ name: result.fileName, url: URL.createObjectURL(result.blob), time: new Date().toLocaleTimeString('vi-VN') });\n      }\n      downloadImage(result.blob, result.fileName);\n    } catch (err) {\n      console.error('Export detail error:', err);\n    } finally {\n      setIsExporting(false);\n    }\n  };\n\n  return (\n    <div\n      className=\"fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-5 overflow-y-auto\"\n      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}\n    >\n      <div ref={cardRef} className=\"bg-white rounded-3xl shadow-2xl max-w-5xl w-full p-5 sm:p-6 border border-slate-200 space-y-4 my-auto animate-fadeIn\">\n        <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100\">\n          <div className=\"flex items-center space-x-3 min-w-0\">\n            <span className=\"px-2.5 py-1 bg-blue-600 text-white font-mono font-black text-xs rounded-xl shadow-xs shrink-0\">Mã {effectiveCode || '---'}</span>\n            <div className=\"min-w-0\">\n              <div className=\"flex items-center gap-2 flex-wrap\">\n                <h3 className=\"font-black text-slate-900 text-base uppercase tracking-tight truncate\">{formatProgramName(effectiveName)}</h3>\n                <span className=\"px-2.5 py-0.5 rounded-lg text-[10.5px] font-extrabold bg-amber-100 text-amber-900 shrink-0\">\n                  {isTopZone ? 'AAR / TopZone (10341)' : 'TGD NHT (933)'}\n                </span>\n              </div>\n              <p className=\"text-xs text-slate-500 font-medium\">Chi tiết nhân sự bán hàng & tiến độ hoàn thành môn</p>\n            </div>\n          </div>\n          <div className=\"flex items-center gap-2 shrink-0\">\n            <div className=\"relative no-export\">\n              <button\n                type=\"button\"\n                onClick={() => setIsEmployeeVisibilityMenuOpen(v => !v)}\n                className={`px-3.5 py-2 font-bold text-xs rounded-xl shadow-xs transition flex items-center gap-1.5 cursor-pointer border ${hiddenEmployeeCount > 0 ? 'bg-blue-600 hover:bg-blue-700 text-white border-blue-600' : 'bg-white hover:bg-slate-50 text-slate-700 border-slate-200'}`}\n                title=\"Chọn từng nhân viên để ẩn/hiện\"\n              >\n                <span className=\"text-sm leading-none\">◉</span>\n                <span>Ẩn/Hiện NV{hiddenEmployeeCount > 0 ? ` (${hiddenEmployeeCount})` : ''}</span>\n              </button>\n              {isEmployeeVisibilityMenuOpen && (\n                <>\n                  <button type=\"button\" aria-label=\"Đóng danh sách nhân viên\" className=\"fixed inset-0 z-40 cursor-default\" onClick={() => setIsEmployeeVisibilityMenuOpen(false)} />\n                  <div className=\"absolute right-0 top-full mt-2 z-50 w-72 max-w-[calc(100vw-2rem)] rounded-2xl bg-white border border-slate-200 shadow-xl p-2\">\n                    <div className=\"flex items-center justify-between gap-2 px-2 py-1.5 border-b border-slate-100\">\n                      <div>\n                        <div className=\"text-xs font-black text-slate-800\">Hiển thị nhân viên</div>\n                        <div className=\"text-[10px] text-slate-400\">Bỏ chọn người nào thì người đó sẽ ẩn khỏi bảng.</div>\n                      </div>\n                      <button type=\"button\" onClick={() => setAllEmployeesVisibility(!allEmployeesVisible)} className=\"text-[10px] font-black text-blue-600 hover:text-blue-700 whitespace-nowrap\">{allEmployeesVisible ? 'Ẩn tất cả' : 'Hiện tất cả'}</button>\n                    </div>\n                    <div className=\"px-2 pt-2 pb-1\">\n                      <div className=\"text-[9.5px] font-bold text-slate-400 uppercase mb-1\">Phạm vi khi bấm ẩn</div>\n                      <div className=\"grid grid-cols-2 gap-1.5\">\n                        <button\n                          type=\"button\"\n                          onClick={() => setHideScope('LOCAL')}\n                          className={`px-2 py-1.5 rounded-lg text-[10px] font-black border transition cursor-pointer ${hideScope === 'LOCAL' ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}`}\n                          title=\"Chỉ ẩn nhân viên này ở bảng của môn đang xem\"\n                        >\n                          Chỉ bảng này\n                        </button>\n                        <button\n                          type=\"button\"\n                          onClick={() => setHideScope('GLOBAL')}\n                          className={`px-2 py-1.5 rounded-lg text-[10px] font-black border transition cursor-pointer ${hideScope === 'GLOBAL' ? 'bg-rose-600 border-rose-600 text-white' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}`}\n                          title=\"Ẩn nhân viên này ở TẤT CẢ các bảng môn thi đua\"\n                        >\n                          Toàn bộ các bảng\n                        </button>\n                      </div>\n                    </div>\n                    <div className=\"max-h-72 overflow-y-auto custom-scroll py-1\">\n                      {computedStaffList.map((emp) => {\n                        const key = employeeKey(emp);\n                        const visible = isEmployeeVisible(emp);\n                        const hiddenGlobally = isGloballyHiddenEmployee(emp);\n                        return (\n                          <label key={key} className=\"flex items-center gap-2 px-2 py-2 rounded-xl hover:bg-slate-50 cursor-pointer\">\n                            <input type=\"checkbox\" checked={visible} onChange={() => toggleEmployeeVisibility(emp)} className=\"w-4 h-4 accent-blue-600 cursor-pointer\" />\n                            <span className={`text-xs font-bold flex-1 ${visible ? 'text-slate-800' : 'text-slate-400 line-through'}`}>{emp.name}</span>\n                            {!visible && hiddenGlobally && <span className=\"text-[9px] font-black text-rose-500\" title=\"Đang ẩn ở tất cả các bảng\">Toàn bộ</span>}\n                            {emp.id && <span className=\"text-[9px] font-mono text-slate-400\">{emp.id}</span>}\n                          </label>\n                        );\n                      })}\n                    </div>\n                    <div className=\"px-2 pt-1.5 border-t border-slate-100 text-[10px] text-slate-400\">Đang hiển thị <b className=\"text-slate-700\">{visibleStaffList.length}/{computedStaffList.length}</b> nhân sự</div>\n                  </div>\n                </>\n              )}\n            </div>\n            <button onClick={() => { setIsEmployeeVisibilityMenuOpen(false); handleExportImage(); }} disabled={isExporting} className=\"px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-bold text-xs rounded-xl shadow-xs transition flex items-center gap-1.5 cursor-pointer\">\n              {isExporting ? <Loader2 className=\"w-3.5 h-3.5 animate-spin\" /> : <Camera className=\"w-3.5 h-3.5\" />}\n              <span>{isExporting ? 'Đang xuất...' : 'Xuất Ảnh'}</span>\n            </button>\n            <button onClick={onClose} className=\"px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs rounded-xl transition cursor-pointer\"><X className=\"w-4 h-4\" /></button>\n          </div>\n        </div>\n\n        <div className=\"grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-center\">\n          <div className=\"bg-slate-50 border border-slate-200 rounded-2xl p-2.5\">\n            <span className=\"text-[9.5px] text-slate-400 font-bold uppercase block\">THỰC ĐẠT SHOP</span>\n            <span className=\"text-base font-black text-slate-900 mt-0.5 block\">{isQty ? `${formatInt(computedShopThuc)} món` : `${formatCurrency(computedShopThuc)} TR`}</span>\n          </div>\n          <div className=\"bg-slate-50 border border-slate-200 rounded-2xl p-2.5\">\n            <span className=\"text-[9.5px] text-slate-400 font-bold uppercase block\">TARGET SHOP</span>\n            <span className=\"text-base font-black text-slate-700 mt-0.5 block\">{isQty ? `${formatInt(computedShopTarget)} món` : `${formatCurrency(computedShopTarget)} TR`}</span>\n          </div>\n          <div className=\"bg-blue-50/70 border border-blue-200 rounded-2xl p-2.5\">\n            <span className=\"text-[9.5px] text-blue-600 font-bold uppercase block\">% HOÀN THÀNH SHOP</span>\n            <span className=\"text-base font-black text-blue-700 mt-0.5 block\">{formatPercent(computedPctLk)}</span>\n          </div>\n          <div className=\"bg-emerald-50/70 border border-emerald-200 rounded-2xl p-2.5\">\n            <span className=\"text-[9.5px] text-emerald-600 font-bold uppercase block\">DỰ BÁO CHỐT SHOP</span>\n            <span className=\"text-base font-black text-emerald-700 mt-0.5 block\">{formatPercent(computedPctDu)}</span>\n          </div>\n        </div>\n\n        <div className=\"grid grid-cols-3 gap-2.5 text-center\">\n          <div className=\"rounded-2xl border border-slate-200 bg-white p-2.5\"><span className=\"block text-[9px] font-bold text-slate-400 uppercase\">Nhân sự</span><b className=\"text-lg text-slate-900\">{visibleStaffList.length}</b></div>\n          <div className=\"rounded-2xl border border-emerald-200 bg-emerald-50/60 p-2.5\"><span className=\"block text-[9px] font-bold text-emerald-600 uppercase\">Đã về số</span><b className=\"text-lg text-emerald-700\">{doneCount}</b></div>\n          <div className=\"rounded-2xl border border-rose-200 bg-rose-50/60 p-2.5\"><span className=\"block text-[9px] font-bold text-rose-600 uppercase\">Còn cần chạy</span><b className=\"text-lg text-rose-700\">{needRunCount}</b></div>\n        </div>\n\n        <div className=\"space-y-2 pt-1\">\n          <div className=\"flex items-center justify-between gap-3\">\n            <div>\n              <h4 className=\"font-extrabold text-slate-800 text-xs uppercase\">Bảng Chi Tiết Nhân Viên Bán Môn Này</h4>\n              <p className=\"text-[10px] text-slate-400 mt-0.5\">Đã lọc đúng theo <b>{isTopZone ? 'AAR / TopZone (10341)' : 'TGD NHT (933)'}</b> và mã môn.</p>\n            </div>\n            <span className=\"text-[11px] text-slate-500 font-medium shrink-0\">{visibleStaffList.length}/{computedStaffList.length} nhân sự</span>\n          </div>\n          <div className=\"overflow-x-auto custom-scroll max-h-[420px] border border-slate-200 rounded-2xl\">\n            <SortableTable className=\"w-full text-left text-xs border-collapse min-w-[920px]\">\n              <thead className=\"bg-slate-900 text-white font-bold text-[10.5px] sticky top-0 shadow-xs z-10\">\n                <tr>\n                  <th className=\"py-2.5 px-3 text-center w-10\">#</th>\n                  <th className=\"py-2.5 px-3\">MÃ NV</th>\n                  <th className=\"py-2.5 px-4\">TÊN NHÂN VIÊN</th>\n                  <th className=\"py-2.5 px-3 text-center\">SỐ LƯỢNG</th>\n                  <th className=\"py-2.5 px-3 text-right\">DT THỰC (TR)</th>\n                  <th className=\"py-2.5 px-3 text-right font-black text-indigo-300\">DT QĐ (TR)</th>\n                  <th className=\"py-2.5 px-3 text-right\">TARGET CÁ NHÂN</th>\n                  <th className=\"py-2.5 px-3 text-right text-rose-300\">CÒN THIẾU</th>\n                  <th className=\"py-2.5 px-3 text-center font-black\">% LK</th>\n                  <th className=\"py-2.5 px-3 text-center font-bold text-amber-300\">% DỰ BÁO</th>\n                  <th className=\"py-2.5 px-3 text-center\">TRẠNG THÁI</th>\n                </tr>\n              </thead>\n              <tbody className=\"divide-y divide-slate-100 font-semibold text-slate-700\">\n                {computedStaffList.length === 0 ? (\n                  <tr><td colSpan={11} className=\"py-8 text-center text-slate-400 font-medium\">Chưa ghi nhận số liệu nhân viên bán môn này.</td></tr>\n                ) : visibleStaffList.length === 0 ? (\n                  <tr><td colSpan={11} className=\"py-8 text-center text-slate-400 font-medium\">Đang ẩn toàn bộ nhân viên. Bấm <b>Ẩn/Hiện NV</b> để chọn người cần hiển thị.</td></tr>\n                ) : (\n                  visibleStaffList\n                    .slice()\n                    .sort((a, b) => a.pctLk - b.pctLk)\n                    .map((emp, idx) => {\n                      const achieved = isQty ? emp.sl : (emp.dtQd || emp.dtThuc);\n                      const gap = Math.max(0, emp.empTarget - achieved);\n                      let badge = <span className=\"px-2 py-0.5 rounded text-[10px] font-black bg-rose-100 text-rose-800\">Cần chạy</span>;\n                      if (emp.pctLk >= 100) badge = <span className=\"px-2 py-0.5 rounded text-[10px] font-black bg-emerald-100 text-emerald-800\">✓ Về Số</span>;\n                      else if (emp.pctDu >= 100) badge = <span className=\"px-2 py-0.5 rounded text-[10px] font-black bg-emerald-50 text-emerald-700 border border-emerald-300\">✓ Dự kiến đạt</span>;\n                      else if (emp.pctDu >= 80) badge = <span className=\"px-2 py-0.5 rounded text-[10px] font-black bg-amber-100 text-amber-800\">⚡ Gần Về</span>;\n                      return (\n                        <tr key={`${emp.id || emp.name}-${idx}`} className={`hover:bg-blue-50 transition border-b border-slate-100 ${emp.isDone ? 'bg-emerald-50/20' : ''}`}>\n                          <td className=\"py-2.5 px-3 text-center font-bold text-slate-500\">{idx + 1}</td>\n                          <td className=\"py-2.5 px-3 font-mono text-slate-400\">{emp.id || '—'}</td>\n                          <td className=\"py-2.5 px-4 font-bold text-slate-900\">{emp.name}</td>\n                          <td className=\"py-2.5 px-3 text-center font-mono font-bold\" data-sort-value={emp.sl}>{formatInt(emp.sl)}</td>\n                          <td className=\"py-2.5 px-3 text-right font-mono font-bold text-slate-800\" data-sort-value={emp.dtThuc}>{formatCurrency(emp.dtThuc)}</td>\n                          <td className=\"py-2.5 px-3 text-right font-mono font-black text-indigo-700 bg-indigo-50/40\" data-sort-value={emp.dtQd}>{formatCurrency(emp.dtQd)}</td>\n                          <td className=\"py-2.5 px-3 text-right font-mono text-slate-500\" data-sort-value={emp.empTarget}>{isQty ? formatInt(emp.empTarget) : formatCurrency(emp.empTarget)}</td>\n                          <td className={`py-2.5 px-3 text-right font-mono font-black ${gap > 0 ? 'text-rose-600' : 'text-emerald-600'}`} data-sort-value={gap > 0 ? gap : '✓ 0'}>{gap > 0 ? (isQty ? formatInt(gap) : formatCurrency(gap)) : '✓ 0'}</td>\n                          <td className={`py-2.5 px-3 text-center font-black ${emp.pctLk >= 100 ? 'text-emerald-700' : 'text-slate-700'}`} data-sort-value={emp.pctLk}>{formatPercent(emp.pctLk)}</td>\n                          <td className={`py-2.5 px-3 text-center font-black ${emp.pctDu >= 100 ? 'text-emerald-600' : emp.pctDu >= 80 ? 'text-amber-600' : 'text-rose-600'}`} data-sort-value={emp.pctDu}>{formatPercent(emp.pctDu)}</td>\n                          <td className=\"py-2.5 px-3 text-center\">{badge}</td>\n                        </tr>\n                      );\n                    })\n                )}\n              </tbody>\n            </SortableTable>\n          </div>\n\n          {computedStaffList.length > 0 && (\n            <div className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-2 rounded-2xl bg-slate-50 border border-slate-200 px-3 py-2 text-[10.5px]\">\n              <span className=\"text-slate-500\">Tổng target cá nhân: <b className=\"text-slate-800\">{isQty ? `${formatInt(totalTarget)} món` : `${formatCurrency(totalTarget)} TR`}</b></span>\n              <span className=\"text-slate-500\">Tổng còn thiếu: <b className=\"text-rose-600\">{isQty ? `${formatInt(totalGap)} món` : `${formatCurrency(totalGap)} TR`}</b></span>\n              <span className=\"text-slate-500\">Tổng thực đạt NV: <b className=\"text-slate-800\">{isQty ? `${formatInt(totalAchieved)} món` : `${formatCurrency(totalAchieved)} TR`}</b></span>\n            </div>\n          )}\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/components/QuickUploadModal.tsx":"import { SortableTable } from './SortableTable';\nimport React, { useRef, useState, useMemo } from 'react';\nimport { X, AlertTriangle, Clipboard, Sparkles, Database, ArrowRight, CheckCircle2, Table, Trash2 } from 'lucide-react';\nimport { AppDataState } from '../types';\nimport {\n  parsePastedData,\n  CATEGORY_LABELS,\n  ParseDiagnostics,\n} from '../utils/smartDataParser';\n\ninterface ImportSourceMeta {\n  sourceMonthBySlot?: Partial<Record<keyof AppDataState, string>>;\n}\n\ninterface QuickUploadModalProps {\n  isOpen: boolean;\n  onClose: () => void;\n  onDataParsed?: (newData: Partial<AppDataState>, meta?: ImportSourceMeta) => boolean | void;\n  appData?: AppDataState;\n  onOpenClearModal?: () => void;\n}\n\n\nexport const QuickUploadModal: React.FC<QuickUploadModalProps> = ({\n  isOpen,\n  onClose,\n  onDataParsed,\n  appData,\n  onOpenClearModal,\n}) => {\n  const [selectedCategory, setSelectedCategory] = useState<string>('auto');\n  const [inputText, setInputText] = useState<string>('');\n  const [pasteError, setPasteError] = useState<string | null>(null);\n  const [showFullPreview, setShowFullPreview] = useState<boolean>(false);\n\n  type PendingTable = { raw: string; result: ParseDiagnostics };\n  const [pending, setPending] = useState<PendingTable[]>([]);\n  const pendingRef = useRef<PendingTable[]>([]);\n  const [activeCategory, setActiveCategory] = useState<keyof AppDataState | null>(null);\n  const [notice, setNotice] = useState('');\n  const textareaRef = useRef<HTMLTextAreaElement>(null);\n  const updatePending = (next: PendingTable[]) => {\n    pendingRef.current = next;\n    setPending(next);\n  };\n\n  // Chỉ đọc nhãn kỳ báo cáo MM/YYYY từ phần văn bản gốc; không thay đổi logic parser cũ.\n  // Ưu tiên dòng đứng riêng (ví dụ 09/2026) để không nhầm ngày cập nhật 01/10/2026 thành kỳ 10/2026.\n  const detectReportMonthKey = (raw: string): string | null => {\n    const lines = String(raw || '').split(/\\r?\\n/).map(line => line.trim()).filter(Boolean);\n    for (const line of lines) {\n      const match = line.match(/^(0?[1-9]|1[0-2])\\s*[\\/.\\-]\\s*(20\\d{2})$/);\n      if (match) return `${match[2]}-${String(Number(match[1])).padStart(2, '0')}`;\n    }\n    const text = ` ${String(raw || '')} `;\n    const regex = /(^|[^0-9\\/.\\-])(0?[1-9]|1[0-2])\\s*[\\/.\\-]\\s*(20\\d{2})(?=$|[^0-9\\/.\\-])/g;\n    let found: RegExpExecArray | null = null;\n    let match: RegExpExecArray | null;\n    while ((match = regex.exec(text))) found = match;\n    return found ? `${found[3]}-${String(Number(found[2])).padStart(2, '0')}` : null;\n  };\n  const parseText = (text: string, category = 'auto') => {\n    const data = { ...appData };\n    pendingRef.current.forEach(item => { data[item.result.category] = item.result.data as any; });\n    const sum = (rows: any[] = [], key: string) => rows.reduce((n, r) => n + (Number(r?.[key]) || 0), 0);\n    return parsePastedData(text, category === 'auto' ? null : category as keyof AppDataState, {\n      existingStoreCompetitionLuyKe: data.td_luyke,\n      existingStoreLuyKeDtQd: sum(data.dt_luyke, 'DOANH THU QĐ (TR)'),\n      existingEmployeeLuyKeDtQd: sum(data.dt_nv_luyke, 'DOANH THU QĐ (TR)'),\n      existingTraChamLuyKeTotal: sum(data.tra_cham_luyke, 'DT TRẢ GÓP (TRIỆU)'),\n    });\n  };\n  const parseResult = useMemo(() => inputText.trim() ? parseText(inputText, selectedCategory) : null,\n    [inputText, selectedCategory, appData, pending]);\n  const draft = parseResult && !('error' in parseResult) && parseResult.data.length ? parseResult : null;\n  const previewItem = pending.find(item => item.result.category === activeCategory);\n  const diagnostics = inputText.trim() ? draft : previewItem?.result;\n  const pasteErrorMessage = parseResult && 'error' in parseResult ? parseResult.error : null;\n  const tablesToSave = draft\n    ? [...pending.filter(item => item.result.category !== draft.category), { raw: inputText, result: draft }]\n    : pending;\n  const totalRows = tablesToSave.reduce((n, item) => n + item.result.data.length, 0);\n  const canSave = totalRows > 0 && (!inputText.trim() || !!draft) && !!onDataParsed;\n\n  const receivePaste = (text: string) => {\n    if (!text.trim()) return;\n\n    const result = parseText(text, selectedCategory);\n    setShowFullPreview(false);\n    if ('error' in result || !result.data.length) {\n      setInputText(text);\n      setPasteError('error' in result ? result.error : 'Bảng chưa có dòng dữ liệu hợp lệ.');\n      setNotice('');\n      return;\n    }\n    const replaced = pendingRef.current.some(item => item.result.category === result.category);\n    const next = pendingRef.current.filter(item => item.result.category !== result.category);\n\n    const oldIndex = pendingRef.current.findIndex(item => item.result.category === result.category);\n    next.splice(oldIndex < 0 ? next.length : oldIndex, 0, { raw: text, result });\n    updatePending(next);\n    setActiveCategory(result.category);\n    setInputText('');\n    setSelectedCategory('auto');\n    setPasteError(null);\n    setNotice(`${replaced ? 'Đã thay bản đang chờ' : 'Đã nhận'}: ${result.categoryName} (${result.data.length} dòng). Anh dán tiếp bảng khác vào ô bên dưới nhé.`);\n  };\n\n  const changeCategory = (category: string) => {\n    setSelectedCategory(category);\n    setPasteError(null);\n    if (inputText.trim() || !previewItem) return;\n    const result = parseText(previewItem.raw, category);\n    if ('error' in result || !result.data.length) {\n      setPasteError('error' in result ? result.error : 'Không có dữ liệu hợp lệ.');\n      setSelectedCategory('auto');\n      return;\n    }\n    if (result.category !== activeCategory && pending.some(item => item.result.category === result.category)) {\n      setPasteError('Mục này đã có bảng chờ lưu. Anh hãy bỏ bảng cũ bằng nút × trước khi đổi sang mục này.');\n      setSelectedCategory('auto');\n      return;\n    }\n    updatePending(pending.map(item => item.result.category === activeCategory ? { raw: item.raw, result } : item));\n    setActiveCategory(result.category);\n    setSelectedCategory('auto');\n    setNotice(`Đã cập nhật loại dữ liệu: ${result.categoryName}.`);\n  };\n\n  const handleCommitPastedData = () => {\n    if (!canSave || !onDataParsed) return;\n    const updates: Partial<AppDataState> = {};\n    const sourceMonthBySlot: Partial<Record<keyof AppDataState, string>> = {};\n    tablesToSave.forEach(item => {\n      updates[item.result.category] = item.result.data as any;\n      const monthKey = detectReportMonthKey(item.raw);\n      if (monthKey) sourceMonthBySlot[item.result.category] = monthKey;\n    });\n    try {\n      if (onDataParsed(updates, { sourceMonthBySlot }) === false) {\n        setPasteError('Dữ liệu chưa được lưu do lỗi kiểm tra. Các bảng vẫn được giữ để anh sửa lại.');\n        return;\n      }\n      setNotice('');\n      updatePending([]);\n      setActiveCategory(null);\n      setInputText('');\n      setPasteError(null);\n      setSelectedCategory('auto');\n      onClose();\n    } catch {\n      setPasteError('Chưa lưu được dữ liệu. Các bảng vẫn được giữ, anh vui lòng thử lại.');\n    }\n  };\n\n  if (!isOpen) return null;\n\n  return (\n    <div\n      className=\"fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200\"\n      onClick={(e) => {\n        if (e.target === e.currentTarget) {\n          onClose();\n        }\n      }}\n    >\n      <div className=\"bg-white rounded-3xl shadow-2xl max-w-5xl w-full p-4 sm:p-5 border border-slate-200 space-y-3 max-h-[94dvh] flex flex-col overflow-hidden text-slate-800\">\n        <div className=\"flex items-center justify-between pb-3 border-b border-slate-100 flex-shrink-0\">\n          <div className=\"flex items-center space-x-2.5\">\n            <span className=\"p-2.5 bg-blue-50 text-blue-600 rounded-xl font-bold\">\n              <Clipboard className=\"w-5 h-5\" />\n            </span>\n            <div>\n              <h4 className=\"font-black text-slate-900 text-base\">Trung Tâm Dán Dữ Liệu Báo Cáo</h4>\n              <p className=\"text-xs text-slate-500 font-medium\">\n                Sao chép trực tiếp từ web BI MWG bằng Ctrl+C / Ctrl+V · không cần xuất Excel\n              </p>\n            </div>\n          </div>\n          <button\n            onClick={onClose}\n            className=\"text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-100 transition cursor-pointer disabled:opacity-50\"\n          >\n            <X className=\"w-5 h-5\" />\n          </button>\n        </div>\n\n        <div className=\"overflow-y-auto custom-scroll flex-1 min-h-0 pr-1 space-y-3\">\n        {(pending.length > 0 || notice) && (\n          <div className=\"space-y-2 flex-shrink-0\">\n            {pending.length > 0 && <div className=\"flex flex-wrap gap-1.5 max-h-24 overflow-y-auto\" aria-label=\"Các bảng chờ lưu\">\n              {pending.map((item, index) => <div key={item.result.category} className={`inline-flex items-center rounded-lg border text-xs ${activeCategory === item.result.category ? 'bg-blue-50 border-blue-300 text-blue-800' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>\n                <button type=\"button\" aria-pressed={activeCategory === item.result.category} onClick={() => { setActiveCategory(item.result.category); setShowFullPreview(false); }} className=\"px-2.5 py-1.5 font-bold text-left\">\n                  ✓ {index + 1}. {item.result.categoryName} <span className=\"font-medium\">({item.result.data.length} dòng)</span>\n                </button>\n                <button type=\"button\" aria-label={`Bỏ ${item.result.categoryName} khỏi danh sách chờ`} onClick={() => {\n                  updatePending(pendingRef.current.filter(table => table.result.category !== item.result.category));\n                  if (activeCategory === item.result.category) setActiveCategory(null);\n                  setNotice('Đã bỏ bảng khỏi danh sách chờ lưu.');\n                }} className=\"px-2 py-1.5 text-slate-400 hover:text-rose-600\">×</button>\n              </div>)}\n            </div>}\n            <p role=\"status\" className=\"text-xs text-blue-700\">{notice || `${pending.length} mục đang chờ lưu. Dán tiếp bảng khác hoặc bấm Lưu tất cả.`}</p>\n          </div>\n        )}\n\n        <div className=\"space-y-3\">\n\n            <div className=\"space-y-3\">\n              <div className=\"relative\">\n                <textarea\n                  autoFocus\n                  ref={textareaRef}\n                  onPaste={(event) => {\n                    const text = event.clipboardData.getData('text/plain');\n                    if (!text.trim()) return;\n                    event.preventDefault();\n                    receivePaste(text);\n                  }}\n                  value={inputText}\n                  onChange={(e) => {\n                    setInputText(e.target.value);\n                    setPasteError(null);\n                  }}\n                  placeholder={`Dán dữ liệu BI vào đây (Ctrl + V)...\\nMỗi lần dán một bảng; ô tự trống để dán tiếp. Xong bấm Lưu tất cả bên dưới.`}\n                  rows={3}\n                  style={{ height: 'clamp(88px, 15vh, 128px)', resize: 'none' }}\n                  className=\"w-full font-mono text-xs bg-white border-2 border-blue-200 rounded-2xl p-4 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition custom-scroll placeholder:text-slate-400 leading-relaxed shadow-sm\"\n                />\n              </div>\n\n              <div className=\"flex items-center justify-between gap-3 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2\">\n                <div className=\"flex items-center gap-2 text-xs font-bold text-slate-700\">\n                  <Database className=\"w-4 h-4 text-blue-600\" />\n                  <span>Loại dữ liệu</span>\n                </div>\n                <select\n                  value={selectedCategory}\n                  onChange={(e) => changeCategory(e.target.value)}\n                  className=\"flex-1 max-w-md bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer\"\n                >\n                  <option value=\"auto\">✨ Tự động nhận diện theo bảng dán</option>\n                  {Object.entries(CATEGORY_LABELS).map(([key, label]) => (\n                    <option key={key} value={key}>\n                      {label}\n                    </option>\n                  ))}\n                </select>\n              </div>\n\n              {onOpenClearModal && (\n                <div className=\"flex justify-end\">\n                  <button\n                    onClick={onOpenClearModal}\n                    type=\"button\"\n                    className=\"inline-flex items-center gap-1.5 px-2.5 py-1.5 text-[11px] text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-lg font-bold transition cursor-pointer\"\n                    title=\"Xóa toàn bộ data đang lưu trong phiên\"\n                  >\n                    <Trash2 className=\"w-3.5 h-3.5 text-rose-600\" />\n                    Xóa data phiên\n                  </button>\n                </div>\n              )}\n\n              {(pasteError || pasteErrorMessage) && (\n                <div className=\"p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-center gap-2 text-xs text-amber-800\">\n                  <AlertTriangle className=\"w-4 h-4 text-amber-600 flex-shrink-0\" />\n                  <span>{pasteError || pasteErrorMessage}</span>\n                </div>\n              )}\n\n              {diagnostics && (\n                <div className=\"bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3\">\n                  <div className=\"flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 pb-2\">\n                    <div className=\"flex items-center gap-2\">\n                      <CheckCircle2 className=\"w-4 h-4 text-emerald-600\" />\n                      <span className=\"text-xs font-bold text-slate-900\">\n                        Khớp với: {diagnostics.categoryName}\n                      </span>\n                      <span className=\"px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200\">\n                        {diagnostics.rowCount} dòng dữ liệu\n                      </span>\n                    </div>\n                    <button\n                      type=\"button\"\n                      onClick={() => setShowFullPreview(!showFullPreview)}\n                      className=\"text-xs text-blue-600 hover:text-blue-700 font-medium flex items-center gap-1 cursor-pointer\"\n                    >\n                      <Table className=\"w-3.5 h-3.5\" />\n                      {showFullPreview ? 'Thu gọn' : 'Xem trước bảng'}\n                    </button>\n                  </div>\n\n                  {diagnostics.pageExtractedInfo?.isFullPageExtracted && (\n                    <div className=\"p-2.5 bg-emerald-50 border border-emerald-200 rounded-lg text-xs text-emerald-900 flex items-center gap-2 font-medium\">\n                      <Sparkles className=\"w-4 h-4 text-emerald-600 flex-shrink-0\" />\n                      <span>\n                        <b>✨ Đã tự động lọc sạch trang web (Ctrl + A):</b> Bỏ qua{' '}\n                        <b>{diagnostics.pageExtractedInfo.ignoredNoiseLines} dòng</b> menu/chân trang thừa, nhận diện bảng tại dòng{' '}\n                        <b>{diagnostics.pageExtractedInfo.headerFoundAtLine + 1}</b>!\n                      </span>\n                    </div>\n                  )}\n\n                  <div>\n                    <span className=\"text-[11px] font-semibold text-slate-500 uppercase tracking-wider block mb-1.5\">\n                      Cột dữ liệu tự động nhận diện ({diagnostics.recognizedColumns.length} cột):\n                    </span>\n                    <div className=\"flex flex-wrap gap-1.5\">\n                      {diagnostics.recognizedColumns.map((col, idx) => (\n                        <span\n                          key={idx}\n                          className=\"inline-flex items-center gap-1 text-[11px] px-2 py-0.5 bg-white border border-slate-200 rounded-md text-slate-700 font-medium\"\n                        >\n                          <span className=\"font-bold text-blue-700\">{col.field}</span>\n                          <ArrowRight className=\"w-3 h-3 text-slate-400\" />\n                          <span className=\"text-slate-500 italic\">\"{col.mappedHeader}\"</span>\n                        </span>\n                      ))}\n                    </div>\n                  </div>\n\n                  <div className=\"border border-slate-200 rounded-lg overflow-hidden bg-white max-h-40 overflow-x-auto overflow-y-auto custom-scroll\">\n                    <SortableTable rowLimit={showFullPreview ? 15 : 3} className=\"w-full text-[11px] text-left\">\n                      <thead className=\"bg-slate-100 text-slate-600 font-semibold border-b border-slate-200 sticky top-0\">\n                        <tr>\n                          <th className=\"p-2 w-8 text-center text-slate-400\">#</th>\n                          {Object.keys(diagnostics.data[0] || {}).map((k) => (\n                            <th key={k} className=\"p-2 whitespace-nowrap\">\n                              {k}\n                            </th>\n                          ))}\n                        </tr>\n                      </thead>\n                      <tbody className=\"divide-y divide-slate-100 text-slate-700\">\n                        {diagnostics.data\n\n                          .map((row, rIdx) => (\n                            <tr key={rIdx} className=\"hover:bg-slate-50\">\n                              <td className=\"p-2 text-center text-slate-400\">{rIdx + 1}</td>\n                              {Object.values(row).map((v: any, cIdx) => (\n                                <td key={cIdx} className=\"p-2 whitespace-nowrap font-mono\">\n                                  {typeof v === 'number' ? v.toLocaleString('vi-VN') : String(v)}\n                                </td>\n                              ))}\n                            </tr>\n                          ))}\n                      </tbody>\n                    </SortableTable>\n                  </div>\n                </div>\n              )}\n            </div>\n        </div>\n        </div>\n\n        <div className=\"flex items-center gap-3 pt-3 border-t border-slate-100 flex-shrink-0 bg-white\">\n          <button\n            onClick={onClose}\n            type=\"button\"\n            className=\"px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition cursor-pointer\"\n          >\n            Đóng\n          </button>\n          <button\n                onClick={handleCommitPastedData}\n                disabled={!canSave}\n                type=\"button\"\n                className={`flex-1 min-w-0 inline-flex items-center justify-center gap-2 px-3 sm:px-5 py-3 rounded-xl text-sm font-extrabold text-white shadow-md transition ${\n                  canSave\n                    ? 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-600/20 active:scale-[0.99] cursor-pointer'\n                    : 'bg-slate-300 cursor-not-allowed text-slate-500'\n                }`}\n              >\n                <CheckCircle2 className=\"w-5 h-5\" />\n                Lưu Tất Cả Vào Hệ Thống ({tablesToSave.length} mục · {totalRows.toLocaleString('vi-VN')} dòng)\n              </button>\n        </div>\n      </div>\n    </div>\n  );\n};\n","src/components/Sidebar.tsx":"import React from 'react';\nimport { FileCheck2, Trophy, Layers, Store, Users2, TrendingUp, Settings2, X, CalendarDays, ShieldCheck } from 'lucide-react';\nimport { ViewType } from '../types';\n\ninterface SidebarProps {\n  currentView: ViewType;\n  onSelectView: (view: ViewType) => void;\n  isOpenMobile?: boolean;\n  onCloseMobile?: () => void;\n  onOpenClearSession?: () => void;\n}\n\nexport const Sidebar: React.FC<SidebarProps> = ({\n  currentView,\n  onSelectView,\n  isOpenMobile = false,\n  onCloseMobile,\n}) => {\n  const navItems = [\n    {\n      id: ViewType.DOANH_THU_ST,\n      label: 'Doanh Thu Siêu Thị',\n      icon: Store,\n    },\n    {\n      id: ViewType.THI_DUA_ST,\n      label: 'Thi Đua Siêu Thị 🏆',\n      icon: Trophy,\n    },\n    {\n      id: ViewType.SUC_KHOE_NV,\n      label: 'Xếp Hạng Nhân Viên',\n      icon: Users2,\n    },\n    {\n      id: ViewType.SUC_KHOE_CUM,\n      label: 'Sức Khoẻ Cụm 933',\n      icon: Layers,\n    },\n    {\n      id: ViewType.BAO_CAO_CUOI_NGAY,\n      label: 'Báo Cáo Cuối Ngày ⚡',\n      icon: FileCheck2,\n      badge: 'HOT',\n      highlight: true,\n    },\n    {\n      id: ViewType.DU_BAO,\n      label: 'Dự Báo & Kế Hoạch',\n      icon: TrendingUp,\n    },\n    {\n      id: ViewType.THEO_DOI_NGAY,\n      label: 'Theo Dõi Từng Ngày',\n      icon: CalendarDays,\n    },\n    {\n      id: ViewType.DATA_QUALITY,\n      label: 'Data Quality Center',\n      icon: ShieldCheck,\n    },\n    {\n      id: ViewType.KPI_CUSTOM,\n      label: 'Tùy Biến KPI Nhân Sự',\n      icon: Settings2,\n    },\n  ];\n\n  const content = (\n    <aside className=\"w-64 bg-white border-r border-slate-200 flex flex-col justify-between flex-shrink-0 z-30 shadow-sm select-none h-full\">\n      <div className=\"p-4 flex flex-col space-y-4\">\n        {}\n        <div className=\"flex items-center justify-between px-2\">\n          <div className=\"flex items-center space-x-2.5\">\n            <div className=\"w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white font-black shadow-md shadow-blue-500/30\">\n              <Store className=\"w-4.5 h-4.5\" />\n            </div>\n            <div>\n              <h1 className=\"font-black text-slate-900 text-xs tracking-wider uppercase\">SỨC KHOẺ SIÊU THỊ</h1>\n              <p className=\"text-[10px] text-slate-400 font-semibold\">Cụm 933 - NHT</p>\n            </div>\n          </div>\n          {onCloseMobile && (\n            <button\n              onClick={onCloseMobile}\n              className=\"md:hidden p-1 text-slate-400 hover:text-slate-700\"\n            >\n              <X className=\"w-5 h-5\" />\n            </button>\n          )}\n        </div>\n\n        {}\n        <nav className=\"space-y-1 pt-1\">\n          {navItems.map((item) => {\n            const Icon = item.icon;\n            const isActive = currentView === item.id;\n            return (\n              <button\n                key={item.id}\n                onClick={() => onSelectView(item.id)}\n                className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-bold transition cursor-pointer ${\n                  isActive\n                    ? 'bg-blue-600 text-white shadow-sm font-black'\n                    : item.highlight\n                    ? 'text-emerald-800 bg-emerald-50 hover:bg-emerald-100/70 border border-emerald-200/60'\n                    : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'\n                }`}\n              >\n                <div className=\"flex items-center space-x-2.5 truncate\">\n                  <Icon\n                    className={`w-4 h-4 flex-shrink-0 ${\n                      isActive ? 'text-white' : item.highlight ? 'text-emerald-600' : 'text-slate-400'\n                    }`}\n                  />\n                  <span className=\"truncate\">{item.label}</span>\n                </div>\n                {item.badge && !isActive && (\n                  <span className=\"text-[9px] font-black px-1.5 py-0.5 rounded bg-amber-400 text-amber-950\">\n                    {item.badge}\n                  </span>\n                )}\n              </button>\n            );\n          })}\n        </nav>\n      </div>\n\n      <div className=\"p-3.5 border-t border-slate-100 bg-slate-50/60 text-[11px] text-slate-500 space-y-2\">\n        <div className=\"space-y-1\">\n          <div className=\"flex justify-between font-bold text-slate-700\">\n            <span>Shop 933:</span>\n            <span>TGDĐ</span>\n          </div>\n          <div className=\"flex justify-between font-bold text-slate-700\">\n            <span>Shop 10341:</span>\n            <span>TopZone</span>\n          </div>\n        </div>\n\n        <div className=\"text-[10px] text-slate-400 pt-1 border-t border-slate-200/60 flex justify-between items-center\">\n          <span>Hệ điều hành v1.0.2</span>\n          <span className=\"text-emerald-600 font-semibold\">Online</span>\n        </div>\n        <div className=\"pt-2 border-t border-slate-200/60 text-[10px] leading-relaxed text-slate-500\">\n          <p>© 2026 Dinh Đz</p>\n          <p className=\"font-semibold text-slate-700\" style={{ fontSize: '10px', whiteSpace: 'nowrap', letterSpacing: '-0.1px' }}>lebangdinh@gmail.com</p>\n        </div>\n      </div>\n    </aside>\n  );\n\n  return (\n    <>\n      <div className=\"hidden md:block h-full\">\n        {content}\n      </div>\n\n      {isOpenMobile && (\n        <div className=\"fixed inset-0 z-50 md:hidden flex\">\n          <div\n            className=\"fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity\"\n            onClick={onCloseMobile}\n          ></div>\n          <div className=\"relative z-10 w-64 h-full bg-white shadow-2xl animate-in slide-in-from-left\">\n            {content}\n          </div>\n        </div>\n      )}\n    </>\n  );\n};\n","src/main.tsx":"import {StrictMode} from 'react';\nimport {createRoot} from 'react-dom/client';\nimport App from './App.tsx';\n\ncreateRoot(document.getElementById('root')!).render(\n  <StrictMode>\n    <App />\n  </StrictMode>,\n);\n","src/types.ts":"export interface StoreRevenueRow {\n  'MÃ ĐƠN VỊ'?: string | number;\n  'TÊN ĐƠN VỊ'?: string;\n  'TARGET (TR)'?: number | string;\n  'TARGET QĐ (TR)'?: number | string;\n  'DOANH THU (TR)'?: number | string;\n  'DOANH THU QĐ (TR)'?: number | string;\n  'DT TRẢ GÓP (TR)'?: number | string;\n  '% TRẢ GÓP'?: number | string;\n  'LƯỢT BILL (TẤT CẢ ST)'?: number | string;\n  'SỐ LƯỢNG'?: number | string;\n  'TB 3 THÁNG (TR)'?: number | string;\n  'SỐ NGÀY CỬA SỔ'?: number | string;\n  [key: string]: any;\n}\n\nexport interface CompetitionRow {\n  'MÃ CHƯƠNG TRÌNH'?: string | number;\n  'CHƯƠNG TRÌNH'?: string;\n  'ĐƠN VỊ / NHÂN VIÊN'?: string;\n  'LOẠI TĐ'?: number | string;\n  'TARGET (TR/SL theo LOẠI TĐ)'?: number | string;\n  'DOANH THU (TR)'?: number | string;\n  'DT QUY ĐỔI (TR)'?: number | string;\n  'SỐ LƯỢNG'?: number | string;\n  '% HT THÁNG'?: number | string;\n  '% DỰ BÁO'?: number | string;\n  'MÃ NV'?: string | number;\n  'HẠNG VÙNG'?: string | number;\n  [key: string]: any;\n}\n\nexport interface EmployeeRevenueRow {\n  'MÃ NHÂN VIÊN'?: string | number;\n  'TÊN NHÂN VIÊN'?: string;\n  'SIÊU THỊ'?: string;\n  'DOANH THU (TR)'?: number | string;\n  'DOANH THU QĐ (TR)'?: number | string;\n  'DT TRẢ GÓP (TR)'?: number | string;\n  '% TRẢ GÓP'?: number | string;\n  'SỐ LƯỢNG'?: number | string;\n  'SỐ NGÀY CỬA SỔ'?: number | string;\n  [key: string]: any;\n}\n\nexport interface AppDataState {\n  dt_luyke: StoreRevenueRow[];\n  dt_realtime: StoreRevenueRow[];\n  td_luyke: CompetitionRow[];\n  td_realtime: CompetitionRow[];\n  nv_tgdd: CompetitionRow[];\n  nv_tz: CompetitionRow[];\n  dt_nv_luyke: EmployeeRevenueRow[];\n  dt_nv_realtime: EmployeeRevenueRow[];\n  tra_cham_luyke: any[];\n  tra_cham_realtime: any[];\n}\n\ninterface EmployeeProgramDetail {\n  code: string | number;\n  name: string;\n  displayName: string;\n  thuc: number;\n  dtQd: number;\n  target: number;\n  pctLk: number;\n  pctDu: number;\n  hasActualData?: boolean;\n  loai: number;\n  hangVung: string;\n}\n\nexport interface AggregatedEmployee {\n  name: string;\n  id: string;\n  store: 'TGDĐ' | 'TopZone';\n  department: string;\n  isOfficial: boolean;\n  isVisible: boolean;\n  targetSharePct: number;\n  revenueTarget?: number;\n  revenueRealtime?: {status: string; lkDt?: number; lkQd?: number; dt?: number; qd?: number};\n  totalDt: number;\n  totalDtQd: number;\n  totalTragop: number;\n  totalBill: number;\n  pctTragop: number;\n  pctDukien: number;\n  completedCount: number;\n  pctDongGop: number;\n  dtDiem: number;\n  hieuQuaQd: number;\n  hqDiem: number;\n  diemKpi: number;\n  programs: EmployeeProgramDetail[];\n}\n\nexport interface PersonnelConfigMap {\n  [storeKey: string]: {\n    [empName: string]: {\n      isOfficial?: boolean;\n      isVisible?: boolean;\n      targetPct?: number;\n    };\n  };\n}\n\nexport interface ScreenshotItem {\n  name: string;\n  url: string;\n  time: string;\n}\n\nexport enum ViewType {\n  BAO_CAO_CUOI_NGAY = 'bao-cao-cuoi-ngay',\n  THI_DUA_ST = 'thi-dua-st',\n  SUC_KHOE_CUM = 'suc-khoe-cum',\n  DOANH_THU_ST = 'doanh-thu-st',\n  SUC_KHOE_NV = 'suc-khoe-nv',\n  DU_BAO = 'du-bao',\n  KPI_CUSTOM = 'cai-dat',\n  DATA_QUALITY = 'data-quality',\n  THEO_DOI_NGAY = 'theo-doi-ngay',\n}\n","src/utils/formatters.ts":"import { parseReportNumber } from './numbers';\nconst SHORT_PROG_DICT: Record<string, string> = {\n  'TRẢ CHẬM FECREDIT, SHINHAN, SAMSUNG FINANCE+': 'Trả chậm FE/Shinhan/SS',\n  'SIM MOBIFONE/VINAPHONE/SIM DMX': 'Sim Mobi/Vina',\n  'MỞ THẺ TÍN DỤNG TPBANK EVO VÀ VPBANK MWG': 'Mở thẻ TPBank/VPBank',\n  'ĐIỆN THOẠI & TABLET ANDROID': 'ĐT & Tab Android',\n  'Điện thoại Flagship Samsung Galaxy S/Z Series': 'Flagship Samsung',\n  'Phụ kiện IT và nhóm khác': 'Phụ kiện IT',\n  'NẠP RÚT TIỀN TÀI KHOẢN NGÂN HÀNG': 'Nạp rút ngân hàng',\n  'Bảo hiểm Thợ ĐMX': 'BH Thợ ĐMX',\n  'Bảo hiểm tổng': 'BH Tổng',\n  'Laptop (trừ Apple)': 'Laptop',\n  'OTT MANGO+, ICALLME -': 'OTT Mango/iCall',\n  'Đồng hồ tháng 9': 'Đồng hồ T9',\n  'PHỤ KIỆN CÔNG NGHỆ': 'Phụ kiện CN',\n  'Điện thoại realme': 'ĐT Realme',\n  'Điện thoại Vivo': 'ĐT Vivo',\n  'Thu cũ đổi mới (Trade-in)': 'Thu cũ đổi mới',\n  'Phụ kiện chính hãng Apple': 'PK Apple',\n  'Gói AppleCare / BHMR': 'AppleCare/BHMR',\n  'Dịch vụ bảo hành & Kỹ thuật': 'Bảo hành kỹ thuật',\n};\n\nexport function formatProgramName(name: string, isShorten = true): string {\n  if (!name) return '';\n  if (!isShorten) return name;\n  return SHORT_PROG_DICT[name] || name;\n}\n\nexport function formatCurrency(val: number | string | undefined | null, digits = 2): string {\n  if (val === undefined || val === null || val === '') return '0,00';\n  const num = parseReportNumber(val);\n  if (!Number.isFinite(num)) return '—';\n  return num.toLocaleString('vi-VN', {\n    minimumFractionDigits: digits,\n    maximumFractionDigits: digits,\n  });\n}\n\nexport function formatInt(val: number | string | undefined | null): string {\n  if (val === undefined || val === null || val === '') return '0';\n  const num = parseReportNumber(val);\n  if (!Number.isFinite(num)) return '—';\n  return Math.round(num).toLocaleString('vi-VN');\n}\n\nexport function formatPercent(val: number | string | undefined | null, digits = 1): string {\n  if (val === undefined || val === null || val === '') return '0,0%';\n  const num = parseReportNumber(val);\n  if (!Number.isFinite(num)) return '—';\n  return num.toLocaleString('vi-VN', {\n    minimumFractionDigits: digits,\n    maximumFractionDigits: digits,\n  }) + '%';\n}\n\nexport function cleanCode(c: string | number | undefined | null): string {\n  if (c === undefined || c === null) return '';\n  return String(c).trim();\n}\n\nexport function cleanProgName(s: string | undefined | null): string {\n  if (!s) return '';\n  return String(s).trim().toLowerCase().replace(/\\s+/g, ' ');\n}\n\nexport function getCellNumber(row: any, possibleKeys: string[]): number {\n  if (!row) return 0;\n  for (const k of possibleKeys) {\n    if (row[k] !== undefined && row[k] !== null && row[k] !== '') {\n      const val = parseReportNumber(row[k], NaN);\n      if (!isNaN(val)) return val;\n    }\n  }\n  const rowKeys = Object.keys(row);\n  for (const pk of possibleKeys) {\n    const matchedKey = rowKeys.find(rk => rk.trim().toLowerCase() === pk.trim().toLowerCase());\n    if (matchedKey && row[matchedKey] !== undefined && row[matchedKey] !== null) {\n      const val = parseReportNumber(row[matchedKey], NaN);\n      if (!isNaN(val)) return val;\n    }\n  }\n  return 0;\n}\n","src/utils/imageExporter.ts":"import { toPng } from 'html-to-image';\nimport html2canvasPro from 'html2canvas-pro';\n\ninterface ExportImageResult {\n  dataUrl: string;\n  blob: Blob;\n  fileName: string;\n}\n\nfunction dataUrlToBlob(dataUrl: string): Blob {\n  const parts = dataUrl.split(';base64,');\n  const contentType = parts[0].split(':')[1] || 'image/png';\n  const raw = window.atob(parts[1]);\n  const rawLength = raw.length;\n  const uInt8Array = new Uint8Array(rawLength);\n\n  for (let i = 0; i < rawLength; ++i) {\n    uInt8Array[i] = raw.charCodeAt(i);\n  }\n\n  return new Blob([uInt8Array], { type: contentType });\n}\n\nexport async function captureElement(\n  element: HTMLElement,\n  options?: {\n    fileName?: string;\n    backgroundColor?: string;\n    scale?: number;\n\n    twoColumnLayout?: boolean;\n\n    exportWidth?: number;\n  }\n): Promise<ExportImageResult> {\n  const fileName = options?.fileName || `BaoCao_${new Date().toISOString().slice(0, 10)}.png`;\n  const bg = options?.backgroundColor || '#f8fafc';\n  const scale = options?.scale || 2;\n  const preserveTwoColumnLayout = options?.twoColumnLayout === true;\n  const requestedExportWidth = Number(options?.exportWidth) || 0;\n  const screenExportWidth = preserveTwoColumnLayout\n    ? Math.max(1, Math.round(requestedExportWidth || 1250))\n    : 0;\n\n  try {\n    if (document.fonts) {\n      await document.fonts.ready;\n    }\n  } catch {\n  }\n\n  element.classList.add('is-exporting');\n  if (preserveTwoColumnLayout) element.classList.add('is-exporting-screen');\n  document.body.classList.add('is-exporting');\n\n  const touchedAncestors: Array<{ el: HTMLElement; style: { overflow: string; overflowX: string; overflowY: string; height: string; maxHeight: string; } }> = [];\n  try {\n    let parent = element.parentElement;\n    while (parent && parent !== document.body) {\n      touchedAncestors.push({\n        el: parent,\n        style: {\n          overflow: parent.style.overflow,\n          overflowX: parent.style.overflowX,\n          overflowY: parent.style.overflowY,\n          height: parent.style.height,\n          maxHeight: parent.style.maxHeight,\n        },\n      });\n      parent.style.overflow = 'visible';\n      parent.style.overflowX = 'visible';\n      parent.style.overflowY = 'visible';\n      parent.style.height = 'auto';\n      parent.style.maxHeight = 'none';\n      parent = parent.parentElement;\n    }\n  } catch (e) {\n    console.warn('Could not temporarily unroll export ancestors', e);\n  }\n\n  await new Promise((resolve) => setTimeout(resolve, 120));\n\n  try {\n    try {\n      const canvas = await html2canvasPro(element, {\n        scale,\n        useCORS: true,\n        ...(preserveTwoColumnLayout ? { width: screenExportWidth, windowWidth: screenExportWidth } : {}),\n        allowTaint: true,\n        backgroundColor: bg,\n        logging: false,\n        ignoreElements: (domNode) => {\n          return domNode.classList?.contains('no-export') || domNode.getAttribute?.('data-export-hidden') === 'true' || false;\n        },\n        onclone: (clonedDoc, clonedElement) => {\n          clonedElement.classList.add('is-exporting');\n          if (preserveTwoColumnLayout) clonedElement.classList.add('is-exporting-screen');\n\n          if (!preserveTwoColumnLayout) {\n            clonedElement.querySelectorAll<HTMLElement>('.export-stack-two-columns').forEach((grid) => {\n              grid.style.display = 'block';\n              grid.style.width = '100%';\n              grid.style.maxWidth = 'none';\n            });\n\n            clonedElement.querySelectorAll<HTMLElement>('.export-stack-two-columns > *').forEach((card) => {\n              card.style.width = '100%';\n              card.style.maxWidth = 'none';\n              card.style.marginBottom = '20px';\n            });\n          } else {\n            const exportWidth = `${screenExportWidth}px`;\n            clonedElement.style.setProperty('width', exportWidth, 'important');\n            clonedElement.style.setProperty('min-width', exportWidth, 'important');\n            clonedElement.style.setProperty('max-width', exportWidth, 'important');\n\n            clonedElement.querySelectorAll<HTMLElement>('.export-stack-two-columns').forEach((grid) => {\n              grid.style.setProperty('display', 'grid', 'important');\n              grid.style.setProperty('grid-template-columns', 'minmax(0, 1fr) minmax(0, 1fr)', 'important');\n              grid.style.setProperty('width', '100%', 'important');\n              grid.style.setProperty('min-width', '0', 'important');\n              grid.style.setProperty('max-width', '100%', 'important');\n              grid.style.setProperty('column-gap', '14px', 'important');\n            });\n\n            clonedElement.querySelectorAll<HTMLElement>('.export-stack-two-columns > *').forEach((card) => {\n              card.style.setProperty('width', 'auto', 'important');\n              card.style.setProperty('min-width', '0', 'important');\n              card.style.setProperty('max-width', '100%', 'important');\n              card.style.setProperty('margin-bottom', '0', 'important');\n            });\n\n            clonedElement.querySelectorAll<HTMLElement>('.realtime-summary-report > .grid.grid-cols-2').forEach((grid) => {\n              grid.style.setProperty('grid-template-columns', 'repeat(4, minmax(0, 1fr))', 'important');\n              grid.style.setProperty('width', '100%', 'important');\n            });\n\n            clonedElement.querySelectorAll<HTMLElement>('.realtime-summary-report .export-stack-two-columns table').forEach((table) => {\n              table.style.setProperty('width', '100%', 'important');\n              table.style.setProperty('min-width', '0', 'important');\n              table.style.setProperty('max-width', '100%', 'important');\n              table.style.setProperty('table-layout', 'auto', 'important');\n            });\n          }\n\n          clonedElement.querySelectorAll<HTMLInputElement>('input[type=\\\"range\\\"]').forEach((input) => {\n            if (input.closest('[data-export-slider]')) { input.remove(); return; }\n            const min = Number(input.min || 0);\n            const max = Number(input.max || 100);\n            const value = Number(input.value || min);\n            const pct = max > min ? Math.min(100, Math.max(0, ((value - min) / (max - min)) * 100)) : 0;\n\n            const wrapper = clonedDoc.createElement('div');\n            wrapper.style.width = '100%';\n            wrapper.style.height = '8px';\n            wrapper.style.position = 'relative';\n            wrapper.style.borderRadius = '9999px';\n            wrapper.style.background = '#e2e8f0';\n            wrapper.style.margin = '0';\n            wrapper.style.padding = '0';\n\n            const fill = clonedDoc.createElement('div');\n            fill.style.position = 'absolute';\n            fill.style.left = '0';\n            fill.style.top = '0';\n            fill.style.height = '100%';\n            fill.style.width = `${pct}%`;\n            fill.style.borderRadius = '9999px';\n            fill.style.background = input.classList.contains('accent-emerald-600') ? '#10b981' : '#2563eb';\n\n            const thumb = clonedDoc.createElement('div');\n            thumb.style.position = 'absolute';\n            thumb.style.left = `calc(${pct}% - 6px)`;\n            thumb.style.top = '50%';\n            thumb.style.width = '12px';\n            thumb.style.height = '12px';\n            thumb.style.transform = 'translateY(-50%)';\n            thumb.style.borderRadius = '50%';\n            thumb.style.background = '#ffffff';\n            thumb.style.border = input.classList.contains('accent-emerald-600') ? '2px solid #10b981' : '2px solid #2563eb';\n            thumb.style.boxSizing = 'border-box';\n            thumb.style.boxShadow = '0 1px 3px rgba(15,23,42,.18)';\n\n            wrapper.appendChild(fill);\n            wrapper.appendChild(thumb);\n            input.parentElement?.replaceChild(wrapper, input);\n          });\n\n          const allNodes = clonedElement.querySelectorAll('*');\n          allNodes.forEach((node: any) => {\n            if (node.closest?.('[data-export-slider], [data-export-preserve-layout=\"true\"]')) return;\n            if (!node.style) return;\n            const computed = clonedDoc.defaultView?.getComputedStyle(node);\n            const scrollable = computed && (\n              computed.overflow !== 'visible' ||\n              computed.overflowX !== 'visible' ||\n              computed.overflowY !== 'visible' ||\n              node.scrollHeight > node.clientHeight + 1 ||\n              node.scrollWidth > node.clientWidth + 1\n            );\n            if (scrollable || node.matches?.('.card-programs-container, [data-export-expand=\"true\"]')) {\n              node.scrollTop = 0;\n              node.scrollLeft = 0;\n              node.style.maxHeight = 'none';\n              node.style.height = 'auto';\n              node.style.minHeight = '0';\n              node.style.overflow = 'visible';\n              node.style.overflowY = 'visible';\n              node.style.overflowX = 'visible';\n              node.style.scrollbarWidth = 'none';\n              node.style.webkitOverflowScrolling = 'auto';\n            }\n          });\n\n          clonedElement.style.maxHeight = 'none';\n          clonedElement.style.height = 'auto';\n          clonedElement.style.overflow = 'visible';\n          clonedElement.style.overflowY = 'visible';\n          clonedElement.style.overflowX = 'visible';\n        },\n      });\n\n      const dataUrl = canvas.toDataURL('image/png');\n      if (dataUrl && dataUrl.length > 200) {\n        const blob = dataUrlToBlob(dataUrl);\n        return { dataUrl, blob, fileName };\n      }\n    } catch (h2cError) {\n      console.warn('html2canvas-pro capture failed, attempting html-to-image fallback...', h2cError);\n    }\n\n    try {\n      const fullWidth = Math.max(element.scrollWidth, element.getBoundingClientRect().width);\n      const fullHeight = Math.max(element.scrollHeight, element.getBoundingClientRect().height);\n      const dataUrl = await toPng(element, {\n        backgroundColor: bg,\n        pixelRatio: scale,\n        cacheBust: true,\n        quality: 0.98,\n        width: fullWidth,\n        height: fullHeight,\n        style: {\n          transform: 'none',\n          margin: '0',\n          width: `${preserveTwoColumnLayout ? screenExportWidth : fullWidth}px`,\n          height: `${fullHeight}px`,\n          minWidth: preserveTwoColumnLayout ? `${screenExportWidth}px` : `${fullWidth}px`,\n          maxWidth: 'none',\n          maxHeight: 'none',\n          overflow: 'visible',\n        },\n        filter: (domNode) => {\n          if (domNode instanceof HTMLElement) {\n            if (domNode.classList.contains('no-export') || domNode.getAttribute('data-export-hidden') === 'true') return false;\n          }\n          return true;\n        },\n      });\n\n      if (dataUrl && dataUrl.length > 200) {\n        const blob = dataUrlToBlob(dataUrl);\n        return { dataUrl, blob, fileName };\n      }\n    } catch (toPngErr) {\n      console.error('html-to-image fallback also failed:', toPngErr);\n    }\n\n    throw new Error('Không thể tạo ảnh từ giao diện. Vui lòng thử lại!');\n  } finally {\n    for (const item of touchedAncestors.reverse()) {\n      item.el.style.overflow = item.style.overflow;\n      item.el.style.overflowX = item.style.overflowX;\n      item.el.style.overflowY = item.style.overflowY;\n      item.el.style.height = item.style.height;\n      item.el.style.maxHeight = item.style.maxHeight;\n    }\n\n    element.classList.remove('is-exporting');\n    element.classList.remove('is-exporting-screen');\n    document.body.classList.remove('is-exporting');\n  }\n}\n\nexport function downloadImage(blob: Blob | string, fileName: string): boolean {\n  try {\n    let url: string;\n    let shouldRevoke = false;\n\n    if (typeof blob === 'string') {\n      if (blob.startsWith('data:')) {\n        const b = dataUrlToBlob(blob);\n        url = URL.createObjectURL(b);\n        shouldRevoke = true;\n      } else {\n        url = blob;\n      }\n    } else {\n      url = URL.createObjectURL(blob);\n      shouldRevoke = true;\n    }\n\n    const anchor = document.createElement('a');\n    anchor.href = url;\n    anchor.download = fileName;\n    anchor.style.display = 'none';\n    document.body.appendChild(anchor);\n\n    anchor.click();\n\n    setTimeout(() => {\n      document.body.removeChild(anchor);\n      if (shouldRevoke) URL.revokeObjectURL(url);\n    }, 1000);\n\n    return true;\n  } catch (e) {\n    console.error('Direct download error:', e);\n    return false;\n  }\n}\n\nexport async function copyImageToClipboard(blob: Blob): Promise<boolean> {\n  if (!navigator.clipboard || !window.ClipboardItem) {\n    return false;\n  }\n\n  try {\n    const pngBlob = blob.type === 'image/png' ? blob : new Blob([blob], { type: 'image/png' });\n    await navigator.clipboard.write([\n      new ClipboardItem({\n        'image/png': pngBlob,\n      }),\n    ]);\n    return true;\n  } catch (err) {\n    console.warn('Clipboard write failed:', err);\n    return false;\n  }\n}\n","src/utils/smartDataParser.ts":"import { parseReportNumber } from './numbers';\nimport { AppDataState, StoreRevenueRow, CompetitionRow, EmployeeRevenueRow } from '../types';\n\nexport const CATEGORY_LABELS: Record<keyof AppDataState, string> = {\n  dt_luyke: 'Doanh Thu Luỹ Kế Siêu Thị',\n  dt_realtime: 'Doanh Thu Realtime Siêu Thị',\n  td_luyke: 'Thi đua Lũy kế 2 shop',\n  td_realtime: 'Thi đua Realtime 2 shop',\n  nv_tgdd: 'Lũy kế thi đua nhân viên TGDĐ',\n  nv_tz: 'Lũy kế thi đua nhân viên TopZone',\n  dt_nv_luyke: 'Doanh Thu Nhân Viên Luỹ Kế',\n  dt_nv_realtime: 'Doanh Thu Nhân Viên Realtime',\n  tra_cham_luyke: 'Trả Chậm — Lũy Kế',\n  tra_cham_realtime: 'Trả Chậm — Realtime',\n};\n\nconst MANAGED_SHOPS = {\n  TOPZONE: 'AAR_DNA_HCH - 351 Nguyễn Hữu Thọ',\n  TGDD: 'TGD_DNA_HCH - 351 Nguyễn Hữu Thọ',\n} as const;\n\nconst SHOP_CODES = {\n  TOPZONE: '10341',\n  TGDD: '933',\n} as const;\n\nfunction canonicalShopFromCode(code: string): string {\n  const c = String(code || '').trim().toUpperCase();\n  if (c === 'AAR_DNA_HCH' || c === '10341' || c.includes('AAR_DNA_HCH')) return MANAGED_SHOPS.TOPZONE;\n  if (c === 'TGD_DNA_HCH' || c === '933' || c.includes('TGD_DNA_HCH')) return MANAGED_SHOPS.TGDD;\n  return '';\n}\n\nfunction canonicalShopCode(value: string): string {\n  const c = String(value || '').trim().toUpperCase();\n  if (c === 'AAR_DNA_HCH' || c === '10341' || c.includes('AAR_DNA_HCH')) return SHOP_CODES.TOPZONE;\n  if (c === 'TGD_DNA_HCH' || c === '933' || c.includes('TGD_DNA_HCH')) return SHOP_CODES.TGDD;\n  return '';\n}\n\nexport interface ParseDiagnostics {\n  category: keyof AppDataState;\n  categoryName: string;\n  rowCount: number;\n  recognizedColumns: { field: string; mappedHeader: string; sampleVal?: string }[];\n  missingColumns: string[];\n  data: any[];\n  mappingMode?: 'exact' | 'fuzzy' | 'learned';\n  confidence?: number;\n  pageExtractedInfo?: {\n    headerFoundAtLine: number;\n    totalLinesScanned: number;\n    ignoredNoiseLines: number;\n    isFullPageExtracted: boolean;\n  };\n}\n\ninterface SplitResult {\n  headers: string[];\n  rows: string[][];\n  pageExtractedInfo: {\n    headerFoundAtLine: number;\n    totalLinesScanned: number;\n    ignoredNoiseLines: number;\n    isFullPageExtracted: boolean;\n  };\n}\n\ninterface MwgDetectionContext {\n  existingStoreCompetitionLuyKe?: any[];\n\n  existingStoreLuyKeDtQd?: number;\n  existingEmployeeLuyKeDtQd?: number;\n  existingTraChamLuyKeTotal?: number;\n}\n\nfunction sumParsedDtQd(rows: any[] | undefined): number {\n  return (rows || []).reduce((sum, row) => {\n    const value = Number(row?.['DOANH THU QĐ (TR)']);\n    return sum + (Number.isFinite(value) ? value : 0);\n  }, 0);\n}\n\nfunction normalizeStr(str: string): string {\n  if (!str) return '';\n  return str\n    .toLowerCase()\n    .normalize('NFD')\n    .replace(/[\\u0300-\\u036f]/g, '')\n    .replace(/đ/g, 'd')\n    .replace(/[^a-z0-9\\s]/g, ' ')\n    .replace(/\\s+/g, ' ')\n    .trim();\n}\n\nfunction parseFlexibleNumber(val: any, fallback: number = 0): number {\n  // Parser BI cần bỏ qua các ô nhãn/metadata chen giữa bảng (ví dụ\n  // \"online - Online - 18001060\") thay vì chặn toàn bộ lần dán.\n  // parseReportNumber vẫn giữ đúng số âm, dấu trừ Unicode và định dạng nghìn/thập phân.\n  const n = parseReportNumber(val, NaN);\n  return Number.isFinite(n) ? n : fallback;\n}\n\nconst TOPZONE_STAFF_SET = new Set([\n  '98486', '83089', '170266', '189769', '45500', '183180', '302196', '315664',\n  'Nguyễn Quỳnh Anh', 'Trần Minh Hải', 'Lê Thị Mỹ Linh', 'Tạ Đức Hiếu', 'Trần Thị Mỹ Trang', 'Đỗ Nhật Trinh'\n]);\n\nfunction isTopzoneStaff(idOrName: string): boolean {\n  if (!idOrName) return false;\n  const clean = String(idOrName).trim();\n  if (TOPZONE_STAFF_SET.has(clean)) return true;\n  for (const tz of TOPZONE_STAFF_SET) {\n    if (clean.includes(tz)) return true;\n  }\n  return false;\n}\n\nconst TGDD_STAFF_SET = new Set([\n  '204201', '269167', '29649', '259623',\n  'Lê Văn Nhân', 'Lê Thị Thanh Trâm', 'Nguyễn Thị Thy', 'Trần Thị Huyền Trang'\n]);\n\nfunction isTgddStaff(idOrName: string): boolean {\n  if (!idOrName) return false;\n  const clean = String(idOrName).trim();\n  if (TGDD_STAFF_SET.has(clean)) return true;\n  for (const tg of TGDD_STAFF_SET) {\n    if (clean.includes(tg)) return true;\n  }\n  return false;\n}\n\nfunction cleanClipboardLine(line: string): string {\n  return line\n    .replace(/\\*\\*/g, '')\n\n    .replace(/\\\\([_|])/g, '$1')\n    .replace(/^\\s*\\|\\s?/, '')\n    .replace(/\\s?\\|\\s*$/, '')\n    .replace(/\\bsvg\\b/gi, '')\n    .trim();\n}\n\nfunction isNoiseLine(line: string): boolean {\n  const n = normalizeStr(line);\n  return !n || /^[-:| ]+$/.test(line) || n === 'tong' || n === 'tong cong' || n === 'total' ||\n    n.startsWith('don vi trieu dong') || n.startsWith('1 17 tong');\n}\n\nfunction numericCellsFromLine(line: string): string[] {\n  const cleaned = cleanClipboardLine(line);\n  let cells: string[] = [];\n  if (cleaned.includes('\\t')) cells = cleaned.split('\\t').map(x => x.trim());\n  else if (cleaned.includes('|')) cells = cleaned.split('|').map(x => x.trim());\n  else return [];\n  return cells.filter(x => x !== '');\n}\n\nfunction competitionValueCells(line: string): string[] {\n  const cleaned = cleanClipboardLine(line);\n  return cleaned.split(/\\t|\\|/).slice(1).map(x => x.trim());\n}\n\nfunction extractProgramAndHeader(line: string, realtime = false): { program: string; type: number } | null {\n  const cleaned = cleanClipboardLine(line);\n\n  const re = realtime\n    ? /^(.*?)(DOANH\\s*THU\\s*\\(\\s*RT\\s*\\)|SỐ\\s*LƯỢNG\\s*\\(\\s*RT\\s*\\))\\s*TARGET\\s*%?\\s*HT\\s*NGÀY/i\n    : /^(.*?)(DOANH\\s*THU|SỐ\\s*LƯỢNG)\\s*TARGET\\s*%?\\s*HT\\s*THÁNG/i;\n  const m = cleaned.match(re);\n  if (!m) return null;\n  const program = (m[1] || '').replace(/[|\\t]+$/g, '').trim();\n  const marker = m[2] || '';\n  return { program: program || 'Chương trình', type: /SỐ\\s*LƯỢNG/i.test(marker) ? 2 : 3 };\n}\n\nfunction extractPersonRow(line: string): { id: string; name: string; cells: string[] } | null {\n  const cleaned = cleanClipboardLine(line);\n  const m = cleaned.match(/^(\\d{4,7}|online)\\s*[-_–]\\s*(.+?)(?:\\t|\\||$)/i);\n  if (!m) return null;\n  const id = m[1].trim();\n  const name = m[2].trim();\n  const cells = numericCellsFromLine(cleaned);\n  return { id, name, cells: cells.length > 1 ? cells.slice(1) : [] };\n}\n\nfunction extractStoreRow(line: string): { code: string; name: string; cells: string[] } | null {\n  const cleaned = cleanClipboardLine(line);\n\n  const m = cleaned.match(/^([A-Za-z0-9]{2,20}(?:[_-][A-Za-z0-9]+)*)\\s*[-_–]\\s*(.+?)(?:\\t|\\||$)/);\n  if (!m) return null;\n  const code = m[1].trim();\n  const name = m[2].trim();\n  const cells = numericCellsFromLine(cleaned);\n  return { code, name, cells: cells.length > 1 ? cells.slice(1) : [] };\n}\n\nfunction findFollowingValueCells(lines: string[], index: number): string[] {\n  for (let j = index + 1; j < Math.min(lines.length, index + 3); j++) {\n    if (isNoiseLine(lines[j])) continue;\n    const cells = numericCellsFromLine(lines[j]);\n    if (cells.length >= 3 && cells.some(c => /[0-9]/.test(c))) return cells;\n  }\n  return [];\n}\n\nfunction normalizeCompetitionClipboard(rawText: string): string {\n  if (!/hang (?:trong st|vung)/.test(normalizeStr(rawText)) || !/top bottom/.test(normalizeStr(rawText))) return rawText;\n  const rawLines = String(rawText || '').replace(/\\r\\n?/g, '\\n').replace(/[\\u200B-\\u200D\\uFEFF]/g, '').split('\\n');\n  const lines = rawLines.map(cleanClipboardLine).filter(Boolean);\n  const output: string[] = [];\n  const metric = /(DOANH\\s*THU|SỐ\\s*LƯỢNG)(?:\\s*\\(\\s*RT\\s*\\))?(?=\\s*(?:$|TARGET|HẠNG|[|\\t]))/i;\n  const signature = /(DOANH\\s*THU|SỐ\\s*LƯỢNG)(?:\\s*\\(\\s*RT\\s*\\))?\\s*(?:TARGET\\s*%?\\s*HT\\s*(?:THÁNG|NGÀY)|HẠNG\\s*TRONG\\s*ST)/i;\n  let sawHeader = false;\n  for (let i = 0; i
