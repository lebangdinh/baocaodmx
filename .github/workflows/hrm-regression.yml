name: Backported HRM regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm init -y
      - run: npm install --no-save --no-package-lock --ignore-scripts @babel/standalone@7.28.4 react@18.3.1 react-dom@18.3.1
      - run: node tests/hrm-regression.cjs
      - run: node tests/hrm-ssr.cjs
