name: Backported HRM regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm init -y
      - run: npm install --no-save --no-package-lock --ignore-scripts @babel/standalone@7.28.4 react@18.3.1 react-dom@18.3.1 react-test-renderer@18.3.1 jsdom@26.1.0
      - run: node tests/hrm-regression.cjs
      - run: node tests/hrm-ssr.cjs
      - run: node tests/bi-extension.cjs
      - run: node tests/bi-extension-auth.cjs
      - run: node tests/bi-detail-toggle.cjs
      - run: node tests/bi-selected-buttons.cjs
      - run: node tests/bi-control-discovery.cjs
      - run: node tests/bi-start-connection.cjs
      - run: node tests/bi-combined-collection.cjs
      - run: node tests/realtime-personnel.cjs
      - run: node tests/bi-employee-store-switch.cjs
      - run: node tests/bi-release-package.cjs

      - run: node tests/monthly-overview.cjs
